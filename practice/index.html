<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hands-on ML, AI and math coding problems with tests, hints and full solutions. Python runs in the browser.">
<meta name="theme-color" content="#F7F7F8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Practice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --panel:#EFEFF1; --side:#FAFAFA; --ink:#272727; --muted:#6E6E6E; --faint:#9C9CA3;
  --line:#E8E8EA; --line2:#C9C9CF; --accent:#C03A73; --accent-ink:#FFFFFF; --accent-soft:#FCEEF4; --accent-line:#F1C6D8;
  --go:#2F8A5F; --go-soft:#E7F5EE; --go-line:#ABD3C1; --flame:#C8643A; --flame-soft:#FBEFE8; --gold:#9A7414; --gold-soft:#FFF8ED;
  --bad:#B9524A; --bad-soft:#FBEDEB; --paper:#FFF8ED; --paper-line:#EADDBE; --kraft:#5F5647;
  --btn-a:#272727; --btn-b:#272727; --btn-ink:#FFFFFF; --btn-edge:#272727;
  --shadow:rgba(59,59,59,.09) 0 1px 2px, rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.01) 0 0 0 1px;
  --lift:rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.09) 0 4px 8px, rgba(59,59,59,.1) 0 8px 16px, rgba(59,59,59,.01) 0 0 0 1px;
  --dg-sh:#272727; --dot:rgba(39,39,39,.08); --strip:#272727; --strip-ink:#F4F4F5;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --num:"Geist", system-ui, sans-serif;
  --pix:"Pixelify Sans", "Geist Mono", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#F28DB8; --accent-ink:#2A0A18; --accent-soft:#2E1621; --accent-line:#4F2638;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#F28DB8; --accent-ink:#2A0A18; --accent-soft:#2E1621; --accent-line:#4F2638;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.lab{font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
#readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:700;letter-spacing:-.03em;font-size:17px;white-space:nowrap}
.brand b{font-family:var(--pix);font-weight:500;color:var(--accent);letter-spacing:0}
.ibtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
#crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--muted);margin-left:8px}
#crumbs a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#crumbs a:hover{color:var(--ink)}
#crumbs .sep{color:var(--line2)}
.grow{flex:1}
.sbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;min-width:220px}
.sbtn span{flex:1;text-align:left}
kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 13px var(--mono);white-space:nowrap;text-decoration:none}
.chip.st{color:var(--flame)} .chip.st.off{color:var(--faint)}
.chip .lv{font-family:var(--num);font-size:15px;color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:18px 12px 40px;border-right:1px solid var(--line);scrollbar-width:thin}
.side .nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:14.5px;font-weight:500;color:var(--muted)}
.side .nv:hover{background:var(--panel);color:var(--ink)}
.side .nv[aria-current]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.side .nv .cnt{margin-left:auto;font:600 11px var(--mono);background:var(--flame);color:#fff;border-radius:999px;padding:1px 7px}
.side .part{margin:22px 10px 8px;display:flex;justify-content:space-between}
.side .mr{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink)}
.side .mr:hover{background:var(--panel)}
.side .mr .n{font:500 12px var(--mono);color:var(--faint)}
.side .mr .c{font:500 11px var(--mono);color:var(--faint)}
.side .mr.full .c{color:var(--go)}
.side .mr[aria-current]{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600}
.side .mr[aria-current] .n{color:var(--accent)}
.side .ls{margin:4px 0 8px 22px;padding-left:12px;border-left:1px solid var(--line)}
.side .li{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:8px;text-decoration:none;font-size:13.5px;line-height:1.4;color:var(--muted)}
.side .li:hover{color:var(--ink);background:var(--panel)}
.side .li[aria-current]{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.sd{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid var(--line2)}
.sd.on{background:var(--go);border-color:var(--go)}
#scrim{display:none}
main{min-width:0;padding:28px 36px 90px}

/* shared components */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--btn-edge);background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--btn-ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 var(--btn-edge),0 8px 18px -8px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 var(--btn-edge),0 3px 8px -4px rgba(0,0,0,.4)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:0 2px 0 var(--line2)}
.btn.go{background:linear-gradient(180deg,#22B26F,#0F8C52);border-color:#0A6B3E;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0A6B3E,0 8px 18px -8px rgba(15,140,82,.6)}
.btn .xp{font:600 12px var(--mono);padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill.k{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.a{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.ok{background:var(--go-soft);border-color:transparent;color:var(--go)}
.pill.ip{background:var(--flame-soft);border-color:transparent;color:var(--flame)}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:7px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--go)}
.seg i.cur{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:44px 0 14px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.03em}

/* home */
.hero{position:relative;overflow:hidden;padding:52px 48px 48px;min-height:440px;background-color:var(--panel);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.hero .copy{position:relative;z-index:2;max-width:540px}
.hero h1{font-size:clamp(40px,5.6vw,72px);line-height:.98;letter-spacing:-.055em;margin:16px 0 18px;font-weight:700}
.hero h1 .px{font-family:var(--pix);font-weight:500;letter-spacing:-.02em;color:var(--accent)}
.hero p.sub{font-size:18px;color:var(--muted);max-width:470px;margin:0 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.float{position:absolute;z-index:1;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);padding:16px}
.float.f1{right:46px;top:44px;width:310px;transform:rotate(3deg)}
.float.f2{right:280px;top:270px;width:250px;transform:rotate(-5deg);background:#1B1B1E;color:#F4F4F6;border-color:#000}
.float.f3{right:28px;top:236px;width:236px;transform:rotate(-1.5deg)}
.float.f4{right:250px;top:58px;width:200px;transform:rotate(-8deg);background:var(--accent);color:#fff;border-color:transparent}
.float .lab{margin-bottom:8px}
.float.f2 .lab,.float.f4 .lab{color:rgba(255,255,255,.7)}
.float.f2 .seg i{background:rgba(255,255,255,.14)} .float.f2 .seg i.on{background:#3FCB86}
.float.f4 .big{font:700 34px/1 var(--num)}
.float svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 7s ease-in-out infinite}
  .float.f2{animation-delay:-2s}.float.f3{animation-delay:-4s}.float.f4{animation-delay:-5.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .num{font:800 40px/1 var(--num);letter-spacing:-.05em;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}
.stat .num small{font:500 13px var(--mono);color:var(--muted)}
.stat .sub{font-size:13.5px;color:var(--muted)}
.wk{display:flex;gap:6px;margin-top:10px}
.wk span{flex:1;text-align:center;font:500 10px var(--mono);color:var(--faint)}
.wk span i{display:block;height:22px;border-radius:7px;background:var(--panel);margin-bottom:4px;border:1px solid var(--line)}
.wk span i.on{background:var(--flame);border-color:var(--flame)}
.wk span.today{color:var(--ink)}
.ring{position:absolute;right:18px;top:18px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.cont{padding:26px;display:flex;flex-direction:column;gap:12px}
.cont h3{font-size:28px;line-height:1.1;letter-spacing:-.04em;margin:4px 0 0}
.cont ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.cont .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.heat{padding:22px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:16px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.hm i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--card));border-color:transparent}
.hm i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--card));border-color:transparent}
.hm i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--card));border-color:transparent}
.hm i.l4{background:var(--accent);border-color:transparent}
.hm i.fut{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font:500 11px var(--mono);color:var(--faint)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{padding:16px;display:flex;flex-direction:column;gap:8px}
.bdg .ic{width:46px;height:46px;display:grid;place-items:center;font:700 17px var(--num);border-radius:14px;color:#fff;background:linear-gradient(160deg,var(--gold),#C2700A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #9A5806}
.bdg b{font-size:14.5px;letter-spacing:-.01em}
.bdg span{font-size:12.5px;color:var(--muted);line-height:1.35}
.bdg.lock{opacity:.55}
.bdg.lock .ic{background:var(--panel);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line2)}
.parth{display:flex;align-items:baseline;gap:14px;margin:34px 0 12px}
.parth h3{margin:0;font-size:19px;letter-spacing:-.03em}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:18px 18px 16px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.mcard .tp{display:flex;justify-content:space-between;align-items:center}
.mcard .no{font:500 26px/1 var(--mono);letter-spacing:-.04em;color:var(--faint)}
.mcard.done .no{color:var(--go)} .mcard.ip .no{color:var(--accent)}
.mcard h4{margin:4px 0 0;font-size:17px;line-height:1.25;letter-spacing:-.02em}
.mcard .ft{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.foot-note{margin-top:40px;font-size:13px;color:var(--faint);max-width:720px}

/* module page */
.mhead{padding:36px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.mhead h1{font-size:clamp(34px,4.4vw,56px);line-height:1;letter-spacing:-.05em;margin:10px 0 14px}
.mhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.mhead .big{font:500 110px/0.8 var(--mono);letter-spacing:-.08em;color:var(--line2);text-align:right}
.path{position:relative;max-width:760px;margin:36px auto 0;padding:10px 0}
.pnode{position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;margin:0 0 26px;transform:translateX(var(--dx,0))}
.pnode .o{flex:none;position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--num);background:var(--card);border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2);color:var(--muted);transition:transform .1s}
.pnode:hover .o{transform:translateY(-2px)}
.pnode.done .o{background:var(--go);border-color:#0A7A47;color:#fff;box-shadow:0 5px 0 #0A6B3E}
.pnode.cur .o{background:var(--accent);border-color:#0F5FA6;color:#fff;box-shadow:0 5px 0 #0D5290}
.pnode.cur .o::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);opacity:.5}
@media (prefers-reduced-motion:no-preference){.pnode.cur .o::after{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}}
.pnode .t{padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;flex:1;max-width:420px}
.pnode .t b{display:block;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pnode .t span{font:500 11.5px var(--mono);color:var(--muted)}
.pnode.cur .t{border-color:var(--accent)}
.mnav{display:flex;justify-content:space-between;gap:12px;max-width:760px;margin:30px auto 0}

/* lesson page */
.lgrid{display:grid;grid-template-columns:minmax(0,760px) 230px;gap:44px;justify-content:center}
.lhead{padding:28px 32px 26px;margin-bottom:30px}
.lhead .back{font-size:14px;color:var(--muted);text-decoration:none}
.lhead .back:hover{color:var(--ink)}
.lhead .idrow{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.lhead .lid{font:600 20px/1 var(--mono);color:var(--accent)}
.lhead h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.045em;margin:0 0 18px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.lhead .seg{margin-top:20px}
.prose{font-size:17px;line-height:1.72}
.prose>p{margin:0 0 18px}
.prose h2{counter-increment:h;font-size:24px;letter-spacing:-.035em;line-height:1.2;margin:46px 0 14px;display:flex;align-items:baseline;gap:12px}
.prose h2::before{content:counter(h,decimal-leading-zero);font:500 13px var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:7px;transform:translateY(-3px)}
.prose{counter-reset:h fig}
.prose ul,.prose ol{padding-left:22px;margin:0 0 18px}
.prose li{margin:6px 0}
.prose li>p{margin:4px 0}.prose li>ul,.prose li>ol{margin:4px 0 6px}
.prose ul li::marker{color:var(--accent)}
.prose ol li::marker{font:600 14px var(--mono);color:var(--accent)}
.prose code{font:500 .86em var(--mono);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.prose strong{font-weight:650}
.code{font:13.5px/1.6 var(--mono);background:#16161A;color:#E9E9EE;padding:18px 20px;border-radius:14px;overflow-x:auto;margin:0 0 20px;border:1px solid #000}
.take{margin:26px 0;padding:20px 22px 20px 22px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);position:relative}
.take .lab{color:var(--accent);margin-bottom:8px}
.take p{margin:0;font-weight:550;font-size:17px}
.ex{margin:26px 0;padding:20px 22px;border-radius:16px;background:var(--card);border:1px dashed var(--line2)}
.ex .lab{color:var(--gold);margin-bottom:10px}
.ex p{margin:0 0 8px;font-size:16px}.ex p:last-child{margin:0}
.tbl{overflow-x:auto;margin:0 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel)}
.dg{counter-increment:fig;margin:26px 0;padding:22px 20px 14px;border-radius:18px;background-color:var(--card);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.dg figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.5}
.dg figcaption::before{content:"FIG " counter(fig,decimal-leading-zero);font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink);margin-right:10px}
.dg-scroll{overflow-x:auto;padding-bottom:4px}
.dg-scroll svg{display:block;margin:0 auto}
.dg-hint{font:500 11px var(--mono);color:var(--faint);margin-top:6px}
.layers{display:flex;flex-direction:column;gap:0;max-width:560px;margin:0 auto}
.lay{padding:12px 16px;border-radius:12px;background:var(--card);border:1.3px solid var(--ink);box-shadow:0 3px 0 var(--dg-sh);display:flex;flex-direction:column}
.lay strong{font-size:15px}
.lay span{font-size:13.5px;color:var(--muted)}
.lay.hot{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.lay.hot strong{color:var(--accent)}
.lay-arr{text-align:center;color:var(--faint);font-size:14px;line-height:22px}
.wip{padding:14px 18px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-size:15px;margin-bottom:18px}

.blk{margin-top:44px;padding:26px}
.blk .lab{margin-bottom:10px}
.blk h3{margin:0 0 6px;font-size:21px;letter-spacing:-.03em;line-height:1.3}
.q{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.4;margin:0 0 16px}
textarea{width:100%;min-height:140px;resize:vertical;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.saved{font:500 12px var(--mono);color:var(--faint)}
.sample{margin-top:18px;padding:18px 20px;border-radius:14px;background:var(--go-soft);border:1px solid color-mix(in srgb,var(--go) 30%,transparent)}
.sample .lab{color:var(--go);margin-bottom:8px}
.sample p{margin:0;font-size:16px}
.grade{margin-top:18px}
.grade .gb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gbtn{padding:12px 10px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--line2);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.gbtn small{font:500 11px var(--mono);color:var(--muted)}
.gbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.gbtn[data-g="1"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.gbtn[data-g="2"][aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 3px 0 var(--gold);color:var(--gold)}
.gbtn[data-g="3"][aria-pressed="true"]{background:var(--go-soft);border-color:var(--go);box-shadow:0 3px 0 var(--go);color:var(--go)}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.srcs li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.srcs .fav{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 15px var(--num);color:var(--accent)}
.srcs .tx{flex:1;min-width:0}
.srcs a{font-weight:600;text-decoration:none;line-height:1.35;display:block}
.srcs a:hover{color:var(--accent)}
.srcs .n{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.srcs .h{font:500 11px var(--mono);color:var(--faint)}
.rep{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.rep.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.done-zone{margin-top:44px;padding:30px 26px;text-align:center;border-radius:22px;background:var(--panel)}
.done-zone p{margin:10px 0 0;font:500 12px var(--mono);color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pn a{padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s}
.pn a:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.pn a b{font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pn a.nx{text-align:right;grid-column:2}
.pn a.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rail{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:14px}
.rail .card{padding:16px}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--line);text-decoration:none;font-size:13.5px;color:var(--muted);line-height:1.4}
.toc a.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}

/* review */
.rv{max-width:680px;margin:0 auto}
.rvtop{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:8px 0 18px}
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;min-height:340px;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:30px;border-radius:22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.face.fr{background:var(--card);border:1px solid var(--line);box-shadow:var(--lift)}
.face.bk{transform:rotateY(180deg);background:#1B1B1E;color:#F2F2F4;border:1px solid #000;box-shadow:var(--lift)}
.face.bk .lab{color:#9A9AA3}
.face .q{font-size:22px}
.face .hint{margin-top:auto;font:500 12px var(--mono);color:var(--faint)}
.face .mine{font-size:14.5px;color:#BDBDC5;border-top:1px solid #333;padding-top:12px}
.rvbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.empty{padding:44px 30px;text-align:center}
.empty .big{font:700 56px/1 var(--num);color:var(--line2)}

/* palette, toasts */
#pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,10,14,.42);backdrop-filter:blur(3px)}
#pal.on{display:flex}
.palbox{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font:18px var(--body);background:transparent;color:var(--ink);outline:none}
#palres{max-height:52vh;overflow-y:auto;padding:8px}
#palres a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none}
#palres a.on{background:var(--accent-soft)}
#palres .id{font:500 12px var(--mono);color:var(--accent);width:44px;flex:none}
#palres .tt{flex:1;min-width:0}
#palres .tt b{display:block;font-weight:600;font-size:15px}
#palres .tt span{font-size:12.5px;color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px;border-radius:999px;background:#1B1B1E;color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:tin .3s ease-out}
.toast b{font-family:var(--num);font-weight:500;color:#7CC7FF}
.toast.big{padding:16px 24px;font-size:16px;background:linear-gradient(180deg,#22B26F,#0F8C52)}
.toast.big b{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:85;width:100%;height:100%}

@media (max-width:1279px){.lgrid{grid-template-columns:minmax(0,760px)}.rail{display:none}.float.f2{right:262px;width:230px}}
@media (max-width:1180px){.float{display:none}.hero{min-height:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .side.open{transform:none;box-shadow:20px 0 60px -20px rgba(0,0,0,.4)}

  main{padding:22px 24px 80px}

}

  .top{padding:0 12px;gap:8px}

  .ring{right:12px;top:12px}
  .cont{padding:20px}.cont h3{font-size:23px}
  .mhead{padding:24px 22px;grid-template-columns:1fr}.mhead .big{display:none}
  .pnode{--dx:0!important;gap:14px}.pnode .o{width:52px;height:52px;font-size:17px}
  .lhead{padding:22px 20px;border-radius:18px}

  .pn{grid-template-columns:1fr}.pn a.nx{grid-column:1}

/* ---- taste pass: fanout brand system (Taste Engine extraction) + slop-rubric fixes ---- */
body{font-variant-numeric:tabular-nums}
.lab{font:500 11px/1.5 var(--mono);letter-spacing:.08em}
.brand{font-weight:600;letter-spacing:-.02em}
.side{background:var(--side)}
.side .nv[aria-current],.side .mr[aria-current]{border:0;box-shadow:var(--shadow);border-radius:8px}
.card{border:0;border-radius:12px;box-shadow:var(--shadow)}
.panel{border-radius:16px}
.btn{min-height:40px;padding:0 16px;border-radius:8px;background:var(--btn-a);border:1px solid var(--btn-edge);font-weight:500;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.16);transition:opacity .15s ease,transform .08s}
.btn:hover{filter:none;opacity:.9}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:var(--shadow)}

.pill.k{border:1px solid var(--accent-line)} .pill.ok{border:1px solid var(--go-line)} .pill.a{border:1px solid var(--paper-line);background:var(--paper);color:var(--kraft)} .pill.ip{border:1px solid color-mix(in srgb,var(--flame) 30%,transparent)}
.chip{border:0;border-radius:8px;box-shadow:var(--shadow);font:500 12.5px var(--mono)}
.chip .lv{font:600 12.5px var(--mono);color:var(--accent)}
.sbtn{border-radius:8px;border-color:var(--line)}

/* home: title -> (note + body) -> session strip, one continuous panel */

.cover{height:104px;border-radius:7px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;background-color:var(--c);color:var(--ci);background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(0,0,0,.07) 13px 14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.08)}

.palbox{border-radius:14px}
@media (max-width:1180px){.hero{padding-top:36px}}
@media (max-width:959px){.hrow{grid-template-columns:minmax(0,1fr);gap:26px}.note{max-width:460px}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.08)}.week{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.hero{padding:28px 20px 0}.hero h1{margin-bottom:24px}.strip{margin:30px -20px 0}.strip>div{padding:14px 16px 16px}.strip .v{font-size:23px}.note{transform:none}.stamps{grid-template-columns:repeat(2,minmax(0,1fr))}.mods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:84px;padding:10px}.cover .cn{font-size:22px}.mcard h4{font-size:14.5px}.mcard .ft span+span{display:none}}
.hm{grid-template-rows:repeat(7,16px);grid-auto-columns:minmax(0,1fr);gap:4px}
.hm i{aspect-ratio:auto;height:16px}
.stp span span{display:none}
.stp{padding:9px 10px}


/* illustrated covers */
.cover{position:relative;overflow:hidden;height:132px;background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.2px);background-size:10px 10px}
.cover .ill{position:absolute;right:6px;bottom:4px;width:62%;max-width:150px;height:auto;color:var(--ci)}
.cover .ill .f{fill:currentColor}
.cover .ill .h{fill:currentColor;fill-opacity:.22}
.cover .ill .g{fill:var(--c);stroke:none}
.cover .tp,.cover .tg{position:relative;z-index:1}
.cover.big{width:240px;height:180px;border-radius:12px;padding:16px 18px;transform:rotate(2deg);box-shadow:var(--lift)}
.cover.big .ill{width:78%;max-width:none;right:10px;bottom:8px}
.cover.big .cn{font-size:34px}
@media (max-width:640px){.cover{height:108px}.cover .ill{width:66%}.cover.big{display:none}}

/* ---------- practice: problem lists, filters, editor, results ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;text-decoration:none;transition:transform .12s,box-shadow .12s}
.prow.num{grid-template-columns:22px 18px minmax(0,1fr) auto}
.prow:hover{transform:translateY(-1px);box-shadow:var(--lift)}
.prow b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.prow .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.prow .tg span{font:500 11px var(--mono);color:var(--muted)}
.prow .rt{display:flex;gap:6px;align-items:center}
.pill.Easy{background:var(--go-soft);border-color:transparent;color:var(--go)}
.pill.Medium{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.Hard{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.filters{display:flex;flex-direction:column;gap:12px;padding:18px;margin-bottom:16px}
.filters .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=search],.filters select{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:14px var(--body);padding:0 12px}
.filters input[type=search]{flex:1;min-width:200px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font:500 12px var(--mono);color:var(--muted);cursor:pointer}
.tchip b{color:var(--faint);font-weight:500;margin-left:4px}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .tchip[aria-pressed="true"] b{color:inherit;opacity:.75}
.tchip:disabled{opacity:.4;cursor:default}
.cnt-line{font:500 12px var(--mono);color:var(--muted);margin:0 0 10px}
.mcard .dif{display:flex;gap:6px;font:500 11px var(--mono);color:var(--muted)}
.mcard .dif i{font-style:normal}
.pcover{height:84px;border-radius:12px;background:var(--c);color:var(--ci);display:flex;align-items:flex-end;justify-content:space-between;padding:10px 12px;font:500 30px/1 var(--mono);letter-spacing:-.04em}
.pcover .ck{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}

.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.pgrid .lhead{margin-bottom:24px}
.ide{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.ide .card{padding:0;overflow:hidden}
.ide .bar2{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ide .bar2 .lab{margin-right:auto}
.ide .btn{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.CodeMirror{height:min(52vh,520px);font:13.5px/1.6 var(--mono);background:var(--card);color:var(--ink)}
.CodeMirror-gutters{background:var(--card);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--faint)}
.CodeMirror-cursor{border-left-color:var(--ink)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--accent-soft)!important}
.cm-s-default .cm-keyword{color:var(--accent);font-weight:600} .cm-s-default .cm-def{color:var(--go)}
.cm-s-default .cm-string{color:var(--gold)} .cm-s-default .cm-comment{color:var(--faint);font-style:italic}
.cm-s-default .cm-number{color:var(--flame)} .cm-s-default .cm-builtin,.cm-s-default .cm-variable-2{color:var(--accent)}
.cm-s-default .cm-operator,.cm-s-default .cm-variable{color:var(--ink)} .cm-s-default .cm-property{color:var(--ink)}
.res{padding:14px 16px;font-size:14px;max-height:340px;overflow:auto}
.res .sum{font-weight:650;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.res .sum.ok{color:var(--go)} .res .sum.no{color:var(--bad)}
.res .t{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font:12.5px/1.5 var(--mono)}
.res .t .k{color:var(--muted)} .res .t .v{white-space:pre-wrap;word-break:break-word}
.res .t.bad .k:first-child{color:var(--bad)} .res .t.good .k:first-child{color:var(--go)}
.res pre{margin:8px 0 0;white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--panel);padding:10px 12px;border-radius:10px;max-height:180px;overflow:auto}
.res .st{color:var(--muted);font:500 12.5px var(--mono)}
.exs{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
.exs .e{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:12.5px/1.55 var(--mono)}
.exs .e .k{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.exs .e .v{white-space:pre-wrap;word-break:break-word;margin:2px 0 6px}
.reveal{margin-top:16px}
.reveal .card{padding:20px 22px;margin-top:12px}
.reveal .hint{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);margin-top:8px;font-size:15px;line-height:1.55}
.reveal .hint b{font:600 12px var(--mono);color:var(--gold);flex:none;padding-top:3px}
.reveal .rbtns{display:flex;gap:10px;flex-wrap:wrap}
.reveal .btn.ghost{min-height:40px;font-size:14px}
.solcode{margin:12px 0 0}
.links{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.links a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-decoration:none;font-size:14.5px}
.links a:hover{border-color:var(--accent)}
.links a span{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.colab{padding:22px}
.colab p{color:var(--muted);font-size:14.5px;margin:6px 0 16px}
.katex{font-size:1.05em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
@media (max-width:1100px){.pgrid{grid-template-columns:minmax(0,1fr)}.ide{position:static}}
@media (max-width:640px){.prow{grid-template-columns:14px minmax(0,1fr)}.prow .rt{grid-column:2}.prow.num{grid-template-columns:22px 14px minmax(0,1fr)}.prow.num .rt{grid-column:3}.CodeMirror{height:340px}}

itle":"Cracking Deep Learning","blurb":"Build the layers behind modern networks by hand in NumPy: activations, losses, initialisation, normalisation and backprop, then CNN, RNN and transformer blocks, and the pieces of autoencoders, VAEs and GANs. Every problem pins down shapes and conventions the way a framework does.","prereq":"Fluent Python and NumPy broadcasting, the chain rule, and matrix products; the Cracking ML and Calculus plans cover the groundwork.","next":"Go deeper into language or vision with the NLP and computer vision problems, or move on to diffusion and flow-matching models, which reuse the U-Net, attention and normalisation blocks practised here.","sections":[{"name":"Neural network foundations","problems":["perceptron","activation-functions","dropout-2","loss-functions","multi-layer-perceptron-forward-pass","weight-initialization","mini-batch-training-loop","batch-normalization","backpropagation-single-hidden-layer","computational-graph-and-autograd"]},{"name":"Convolutional networks","problems":["pooling-layers","2d-convolution","transposed-convolution","vgg-convolution-block","depthwise-separable-convolution","lenet-forward-pass","resnet-residual-block","inception-module"]},{"name":"Recurrent networks","problems":["vanilla-rnn-cell","gru-cell","lstm-cell","sequence-to-sequence-forward-pass"]},{"name":"Transformers","problems":["layer-normalization","rotary-position-embedding-rope","scaled-dot-product-attention-2","multi-head-attention","transformer-encoder-block","transformer-decoder-block","vision-transformer-patch-embedding"]},{"name":"Generative models","problems":["autoencoder-forward-pass","variational-autoencoder-forward-pass","gan-training-step"]},{"name":"Advanced architectures and techniques","problems":["non-maximum-suppression","squeeze-and-excitation-block","u-net-skip-connection"]}],"quiz":["Neural network foundations","Convolutional networks","Recurrent networks","Transformers","Generative models","Advanced architectures and techniques"]},{"id":"cracking-ml","group":"Specializations","title":"Cracking ML Interviews","blurb":"Implement the classical machine learning toolkit from scratch: linear models, trees and ensembles, clustering, evaluation metrics and preprocessing. Each problem pins down its conventions exactly, the way an interviewer would.","prereq":"Comfortable Python and NumPy broadcasting, plus the basics of linear algebra, probability and gradients.","next":"Carry these building blocks into neural networks and training loops, or practise turning them into production pipelines in an ML system design setting.","sections":[{"name":"Linear models","problems":["linear-regression","logistic-regression","ridge-regression","lasso-regression","softmax-regression"]},{"name":"Classification","problems":["knn-classifier","gaussian-naive-bayes","averaged-perceptron","linear-discriminant-analysis","svm-with-hinge-loss-sgd"]},{"name":"Trees and ensembles","problems":["permutation-feature-importance","decision-tree-classifier-cart","decision-tree-regressor","bagging-classifier","random-forest","adaboost","gradient-boosted-regressor","stacking-ensemble"]},{"name":"Unsupervised learning","problems":["k-means-clustering","k-means-initialization","dbscan","agglomerative-clustering","pca","gaussian-mixture-models-em","isolation-forest","t-sne-affinity-matrix"]},{"name":"Evaluation and model selection","problems":["k-fold-cross-validation","log-loss-binary-cross-entropy","auc-roc","precision-recall-curve-and-average-precision","regression-metrics"]},{"name":"Feature engineering and preprocessing","problems":["missing-value-imputation","categorical-encoding","feature-scaling","distance-metrics"]}],"quiz":["Linear models","Classification","Trees and ensembles","Unsupervised learning","Evaluation and model selection","Feature engineering and preprocessing"]},{"id":"cracking-nlp","group":"Specializations","title":"Cracking NLP","blurb":"Thirty-five NLP interview problems that start from raw strings and end at decoding, evaluation and tokenizer training. Each one pins down its conventions exactly, so you practise getting the details right rather than guessing them.","prereq":"Comfortable Python, dictionaries and NumPy indexing, plus the basic idea of a softmax and of training a model by gradient descent.","next":"Take these pieces into full Transformer language models and retrieval pipelines, where tokenizers, sampling and ranking meet real model weights.","sections":[{"name":"Text preprocessing","problems":["tokenization","text-normalization","regex-patterns-for-nlp","padding-and-truncation","stemming-vs-lemmatization","sentence-segmentation","edit-distance","vocabulary-building","subword-tokenization"]},{"name":"Representations and embeddings","problems":["bag-of-words","embedding-similarity","tf-idf","n-gram-language-model","sentence-embeddings","word2vec","glove","fasttext"]},{"name":"Sequence labelling and language models","problems":["named-entity-recognition","pos-tagging","greedy-sequence-tagging","text-classification","language-modeling","spell-correction"]},{"name":"Transformer tasks and decoding","problems":["masked-language-modeling","next-sentence-prediction","token-classification","span-extraction","beam-search-decoding","text-generation-sampling"]},{"name":"Evaluation, data and tokenizers","problems":["perplexity-computation","text-deduplication-minhash","evaluation-metrics-bleu-rouge","tokenizer-training","document-ranking","byte-pair-encoding"]}],"quiz":["Text preprocessing","Representations and embeddings","Sequence labelling and language models","Transformer tasks and decoding","Evaluation, data and tokenizers"]},{"id":"cracking-rl","group":"Specializations","title":"Cracking RL","blurb":"Thirty reinforcement learning interview problems, from Bellman equations and tabular TD control to bandits, DQN tricks, policy gradients, PPO and the preference losses behind RLHF. Environments are small arrays and every random draw is passed in, so each answer is exact.","prereq":"Comfortable NumPy indexing and broadcasting, plus expected values, conditional probability and the softmax function.","next":"Scale these pieces up with neural function approximation in PyTorch, or study how the RLHF losses here fit into a full language model post-training pipeline.","sections":[{"name":"MDPs and dynamic programming","problems":["discounted-returns","bellman-expectation-equation","value-iteration-step","value-iteration","policy-iteration"]},{"name":"Tabular model-free RL","problems":["monte-carlo-policy-evaluation","td-0-value-update","sarsa-update","q-learning-update","expected-sarsa"]},{"name":"Bandits and exploration","problems":["epsilon-greedy-action-selection","ucb1-for-multi-armed-bandits","thompson-sampling-beta-bernoulli","softmax-boltzmann-exploration","linucb-contextual-bandit"]},{"name":"Deep value-based RL","problems":["dqn-loss-with-target-network","experience-replay-buffer","prioritized-experience-replay","double-dqn-target","dueling-dqn-decomposition"]},{"name":"Policy gradients and PPO","problems":["reinforce-gradient","reinforce-with-baseline","gae-advantages","actor-critic-a2c-loss-with-entropy","ppo-clipped-surrogate-objective"]},{"name":"RLHF and preference optimization","problems":["bradley-terry-reward-model-loss","ppo-with-reference-policy-kl","dpo-closed-form-loss","grpo-group-relative-advantage","rloo-reinforce-leave-one-out"]}],"quiz":["MDPs and dynamic programming","Tabular model-free RL","Bandits and exploration","Deep value-based RL","Policy gradients and PPO","RLHF and preference optimization"]},{"id":"cuda","group":"Systems and GPU Programming","title":"CUDA Kernels","blurb":"Write GPU kernels from scratch with Numba CUDA: map threads to data, keep memory accesses coalesced, reduce across a block with shared memory and barriers, and finish with tiled convolutions and matrix multiplication.","prereq":"You should be comfortable with Python loops and NumPy arrays; no previous GPU experience is assumed, since the first section starts from a single element-wise kernel.","next":"Carry these ideas up a level with Triton and into model serving in Inference Engineering, where the same reductions and tiles show up as softmax, normalisation and attention kernels.","sections":[{"name":"Threads, blocks and element-wise kernels","problems":["vector-addition","vector-subtraction","relu","sigmoid","tanh","leaky-relu","softmax-2","gelu","swish"]},{"name":"2-D grids and matrix kernels","problems":["matrix-addition","matrix-transpose","matrix-multiplication","outer-product","hadamard-product","layer-normalization","matrix-vector-multiplication","rms-normalization"]},{"name":"Reductions","problems":["dot-product-2","sum-of-array","l1-normalization","l2-normalization","mean-and-variance","max-of-array","min-of-array","argmax","argmin"]},{"name":"Convolutions and stencils","problems":["1d-convolution","2d-convolution-2","3d-convolution","max-pool-2d"]},{"name":"Fused ML primitives","problems":["cross-entropy-loss","dropout-2","scaled-dot-product-attention-2","cosine-similarity-2"]},{"name":"Performance: tiling","problems":["tiled-matrix-multiplication"]}],"quiz":[]},{"id":"diffusion","group":"Build from Scratch","title":"Build a Diffusion Model from Scratch","blurb":"Write every piece of a denoising diffusion model in NumPy: the noise schedule, the forward process, a small time-conditioned denoiser, the training loss, and the DDPM, DDIM and ODE samplers. The last sections connect it to score matching and flow matching and finish with a complete train-and-sample loop.","prereq":"Comfort with NumPy broadcasting and the basic properties of the normal distribution (sums, scaling, mean and variance) is enough to start.","next":"Scale the toy pieces into a real PyTorch model trained on images, then explore latent diffusion, distillation for few-step sampling, and text conditioning with cross-attention.","sections":[{"name":"Gaussian Foundations","problems":["reparameterized-gaussian-sample","diagonal-gaussian-kl-divergence","gaussian-mixture-score"]},{"name":"Forward Process and Noise Schedules","problems":["linear-beta-schedule","cosine-noise-schedule","forward-diffusion-sample","rescale-to-zero-terminal-snr"]},{"name":"The Denoising Network","problems":["sinusoidal-timestep-embedding","time-conditioned-residual-block","spatial-self-attention-block","tiny-u-net-forward-pass"]},{"name":"Training Objective","problems":["noise-prediction-loss","posterior-mean-and-variance","prediction-parameterization","min-snr-loss-weighting"]},{"name":"Sampling","problems":["ddpm-ancestral-step","classifier-free-guidance","ddim-step","karras-euler-sampler"]},{"name":"Score and Flow View","problems":["denoising-score-matching-loss","annealed-langevin-dynamics","conditional-flow-matching-loss"]},{"name":"Evaluation, Transformers and Capstone","problems":["frechet-distance-between-feature-sets","dit-patchify-and-adaln-zero-block","toy-diffusion-training-step","toy-ddpm-sampler"]}],"quiz":[]},{"id":"inference-engineering","group":"Systems and GPU Programming","title":"Inference Engineering Drills","blurb":"Build the pieces of an LLM serving engine in code: attention variants that shrink the KV cache, tiled attention, sampling and MoE routing, a paged and prefix-shared cache, speculative decoding, low-bit weight formats, and the schedulers, metrics and capacity models that decide what a deployment costs.","prereq":"Comfortable with PyTorch tensor code and with how causal attention in a Transformer works; knowing what a KV cache stores is a good starting point.","next":"Write the GPU kernels behind these components with the Triton plan, or follow a full model from training to serving in the LLM from-scratch plan.","sections":[{"name":"Attention architectures","problems":["scaled-dot-product-attention-3","multi-head-attention-mha","multi-query-attention-mqa","grouped-query-attention-gqa","multi-head-latent-attention-mla"]},{"name":"Efficient transformer components","probl ar-neuron","gradient-check-scalar-neuron"]},{"name":"Automatic reverse-mode autodiff","problems":["apply-local-vector-jacobian-rules","topologically-sort-computation-dag","run-reverse-mode-autodiff","gradient-check-autodiff-graph"]},{"name":"Accumulation and the remaining operators","problems":["accumulate-shared-path-gradients","differentiate-exponentials-and-powers"]},{"name":"Neural-network modules","problems":["build-scalar-neuron-module","evaluate-dense-layer","evaluate-multi-layer-perceptron","collect-module-parameters-recursively"]},{"name":"Losses, training and zeroing gradients","problems":["squared-error-loss-gradients","apply-one-full-sgd-training-step","train-tiny-micrograd-mlp"]}],"quiz":["Derivatives and gradient checks","Value objects and expression graphs","Neurons and activation gradients","Automatic reverse-mode autodiff","Accumulation and the remaining operators","Neural-network modules","Losses, training and zeroing gradients"]},{"id":"numpy","group":"Foundations","title":"NumPy Sheet","blurb":"Twenty-five short exercises that take you from building arrays to writing loop-free data transforms. Each problem uses one core NumPy idea on a small, realistic task: padding token batches, cutting image patches, forward-filling sensor gaps, finding the lag between two signals.","prereq":"You should be comfortable writing Python functions with lists and loops; no NumPy experience is assumed.","next":"Next, try the Linear Algebra plan, where these array skills become matrix factorisations, then build full models from scratch in Cracking ML.","sections":[{"name":"Array Creation","problems":["create-arrays-from-lists","zeros-and-ones","arange-and-linspace","random-array-generation","reshaping-arrays"]},{"name":"Indexing & Slicing","problems":["basic-indexing","fancy-indexing","boolean-masking","filter-and-extract","mutation-trap"]},{"name":"Broadcasting","problems":["outer-sum","row-scaling","pairwise-differences","column-scaling","normalize-columns"]},{"name":"Vectorized Operations","problems":["normalized-difference","angle-features","aggregation-functions","sort-and-argsort","norm-gated-linear-transform"]},{"name":"Array Utilities","problems":["row-extremes","winsorize","quantize-and-frame","tile-and-diff","concat-and-correlate"]}],"quiz":["Array Creation","Indexing & Slicing","Broadcasting","Vectorized Operations","Array Utilities"]},{"id":"optimization","group":"ML Math","title":"Optimization","blurb":"Build the optimizers behind model training from first principles: solve quadratics in closed form, read curvature from the Hessian, then implement gradient descent, momentum, AdaGrad, RMSProp, Adam and L-BFGS, and race them against each other.","prereq":"Comfortable with NumPy arrays and matrix products, and with taking partial derivatives of simple functions.","next":"Apply these optimizers inside real networks in the deep learning plans, and study how learning-rate schedules and batch size interact at scale.","sections":[{"name":"Foundations: minima, convexity, curvature","problems":["minimum-of-univariate-quadratic","minimum-of-axis-aligned-paraboloid","convexity-certificate-via-hessian","convex-polytope-membership","classify-critical-point-from-hessian"]},{"name":"Gradient descent and momentum","problems":["vanilla-gradient-descent","batch-vs-stochastic-vs-mini-batch-gd","classical-momentum","nesterov-momentum"]},{"name":"Adaptive optimizers","problems":["adagrad","rmsprop","adam-optimizer","adamw-decoupled-weight-decay"]},{"name":"Learning-rate schedules","problems":["learning-rate-sweep","linear-warmup","cosine-annealing-with-warm-restarts","lr-range-test-and-one-cycle-policy"]},{"name":"Regularisation and training hygiene","problems":["lasso-regression-using-ista","gradient-accumulation","dropout","early-stopping"]},{"name":"Second-order methods and stability","problems":["newton-s-method","gradient-clipping","l-bfgs","optimizer-showdown"]}],"quiz":["Foundations: minima, convexity, curvature","Gradient descent and momentum","Adaptive optimizers","Learning-rate schedules","Regularisation and training hygiene","Second-order methods and stability"]},{"id":"pandas","group":"Foundations","title":"Pandas Sheet","blurb":"Twenty-five hands-on exercises that cover the everyday pandas toolkit on realistic tables: messy exports, event logs, sensor feeds, sales ledgers and training metrics. You go from building and inspecting a DataFrame to cleaning it, summarising it by group and reshaping it between long and wide.","prereq":"You should be able to write Python functions using lists, dicts and loops; no previous pandas experience is needed.","next":"Continue with the NumPy plan to see the array machinery under every DataFrame, or the SQL plan to express the same joins, groupings and windows in a database, then put the skills to work in Cracking ML.","sections":[{"name":"Loading & Inspecting Data","problems":["create-dataframe-from-dict","inspect-dataframe-shape","column-selection","data-types-overview","head-and-tail-operations"]},{"name":"Indexing & Selection","problems":["loc-vs-iloc","boolean-indexing","multi-column-selection","setting-index","resetting-index"]},{"name":"Data Cleaning","problems":["handle-missing-values","drop-duplicates","rename-columns","replace-values","change-data-types"]},{"name":"Aggregation & Grouping","problems":["groupby-basics","aggregation-functions","pivot-tables","cross-tabulation","multi-level-groupby"]},{"name":"Merging & Reshaping","problems":["merge-dataframes","concatenate-dataframes","melt-wide-to-long","unstack-long-to-wide","apply-custom-transforms"]}],"quiz":["Loading & Inspecting Data","Indexing & Selection","Data Cleaning","Aggregation & Grouping","Merging & Reshaping"]},{"id":"probability-statistics","group":"ML Math","title":"Probability & Statistics","blurb":"Thirty problems that build statistics from the ground up in NumPy, from summary statistics and counting through distributions, sampling and the CLT, to hypothesis tests whose p-values you compute yourself without SciPy.","prereq":"Comfortable Python and NumPy arrays, plus school algebra; no statistics course assumed.","next":"Apply these tools to models that are built on them, such as Naive Bayes, Gaussian mixtures and A/B experiment pipelines, or revisit the ML Maths probability and inference lessons for the theory behind each test.","sections":[{"name":"Describing data","problems":["mean-median-mode","sample-variance-and-standard-deviation","percentiles-quantiles","skewness-and-kurtosis","pearson-correlation-matrix"]},{"name":"Probability basics","problems":["basic-probability-rules","conditional-probability","bayes-theorem","independence-testing","permutations-and-combinations"]},{"name":"Distributions","problems":["binomial-distribution","poisson-distribution","normal-distribution","discrete-moments","exponential-distribution"]},{"name":"Sampling and the CLT","problems":["sampling-distribution-of-mean","central-limit-theorem","standard-error-comparison","bootstrap-confidence-interval","stratified-sampling"]},{"name":"Hypothesis testing","problems":["z-test-one-sample","t-test-one-sample","p-values-and-significance","b-test-significance","chi-square-goodness-of-fit"]},{"name":"Estimation and applied statistics","problems":["maximum-likelihood-estimation","bayesian-updating","correlation-significance-test","anova-f-statistic","monte-carlo-pi-estimation"]}],"quiz":["Describing data","Probability basics","Distributions","Sampling and the CLT","Hypothesis testing","Estimation and applied statistics"]},{"id":"pytorch","group":"Foundations","title":"PyTorch Sheet","blurb":"Thirty problems that build PyTorch fluency from tensors and autograd up to optimizers, data pipelines and the layers inside real models. Each one asks you to reproduce what a built-in does, from the raw weights, and match it exactly.","prereq":"You should know Python and basic NumPy array work, and roughly what a layer and a loss function are; the NumPy plan covers the array skills.","next":"Go deeper into architectures with Cracking Deep Learning, or follow attention into large language models in the Inference Engineering course.","sections":[{"name":"Tensors and Autograd","problems":["tensor-factory","tensor-operations","tensor-shape-manipulation","basic-autograd","activation-functions"]},{"name":"Modules and Layers","problems":["simple-neural-network","custom-linear-layer","loss-functions","batch-normalization","dropout"]},{"name":"The Training Loop","problems":["softmax","mini-training-loop","gradient-accumulation","manual-weight-update","early-stopping"]},{"name":"Optimizers, Schedules and Data","problems":["optimizer-scheduler","weight-initialization","custom-dataset-class","balanced-dataloader","transform-pipeline"]},{"name":"Under the Hood","problems":["custom-sgd-with-momentum","conv2d","rnn-cell","attention-mechanism","learning-rate-warmup-scheduler"]},{"name":"Sequences and Structure","problems":["lstm-cell-2","multi-head-attention","masked-causal-attention","residual-block","beam-search-decoding"]}],"quiz":["Tensors and Autograd","Modules and Layers","The Training Loop","Optimizers, Schedules and Data","Under the Hood","Sequences and Structure"]},{"id":"sql","group":"Foundations","title":"SQL Sheet","blurb":"Twenty-five SQLite queries on the tables an ML engineer actually meets: experiment logs, eval results, inference requests, clickstreams and model registries. You start with single-table SELECTs and work up to window functions, recursive CTEs and sessionizing events, with every problem pinning down the NULL, tie and boundary cases that trip people up.","prereq":"No SQL background is needed; it helps to know what a table, a row and a column are.","next":"Take the same analyses into Python with the Pandas plan, then use them on model outputs in the Metrics & Evaluation problems.","sections":[{"name":"SELECT Fundamentals","problems":["basic-select","where-clauses","order-by","limit-and-offset","distinct-values"]},{"name":"Joins & Relationships","problems":["inner-join","left-join","self-join","multiple-joins","cross-join"]},{"name":"Aggregation","problems":["group-by","having-clause","count-sum-avg","conditional-aggregation","nested-aggregations"]},{"name":"Window Functions","problems":["row-number","rank-and-dense-rank","running-totals","null-handling","lag-and-lead"]},{"name":"Advanced Queries","problems":["subqueries","common-table-expressions","case-statements","date-functions","string-functions"]}],"quiz":["SELECT Fundamentals","Joins & Relationships","Aggregation","Window Functions","Advanced Queries"]},{"id":"triton","group":"Systems and GPU Programming","title":"Triton Kernels","blurb":"Thirty GPU kernel exercises, most of them written block by block in Triton, from a masked elementwise add to FlashAttention, split-K and block-pointer matmuls. Triton kernels are graded on a real GPU in Colab against a PyTorch reference of the same spec, and each explanation covers memory traffic, masking and the bugs that bite in practice.","prereq":"You should be at home with PyTorch tensors, shapes and strides; CUDA experience helps but is not required.","next":"Take the attention, KV-cache and normalisation kernels into serving with the Inference Engineering course, or compare them with their thread-level versions in the CUDA plan.","sections":[{"name":"Foundations and the block model","problems":["vector-addition","fused-multiply-add","relu","gelu","silu"]},{"name":"Reductions","problems":["vector-sum-reduction","vector-max-reduction","single-pass-mean-and-variance","l2-vector-norm","fused-row-wise-softmax","row-wise-logsumexp"]},{"name":"Matrix multiply and autotuning","problems":["tiled-matrix-multiplication","autotuned-matrix-multiplication","tiled-transpose","gemv-matrix-vector-product","fused-matmul-bias-relu"]},{"name":"Normalisation and training ops","problems":["layernorm-forward","rmsnorm-forward","dropout-inverted-scaling","cross-entropy-loss-mean-reduction","layernorm-backward"]},{"name":"Attention and LLM kernels","problems":["flashattention-forward","scaled-dot-product-attention-2","rotary-position-embedding","kv-cache-append","online-softmax"]},{"name":"Performance patterns","problems":["grouped-program-id-matmul","split-k-matmul","block-pointer-matmul","vectorized-vector-add"]}],"quiz":[]}];
const BUILDS = [{"id":"adam","kind":"paper","group":"Training and optimization","title":"Adam: A Method for Stochastic Optimization","authors":"Kingma and Ba","year":2014,"url":"https://arxiv.org/abs/1412.6980","blurb":"Combined momentum with per-parameter step sizes from a running average of squared gradients, plus a bias correction, giving the default optimiser for most of deep learning.","intro":"Adam tracks exponential averages of the gradient and of its square, corrects both for their zero initialisation, and steps each parameter by the ratio of the two. The paper also introduces AdaMax, which uses an infinity norm in place of the second moment. The steps build momentum, RMSProp, the Adam update, the full optimiser and decoupled weight decay, then compare them; the capstone runs Adam, Adam without bias correction and AdaMax on a noisy ill-conditioned quadratic.","steps":[{"name":"Classical momentum","problem":"classical-momentum"},{"name":"RMSProp","problem":"rmsprop"},{"name":"One Adam step","problem":"adam-step"},{"name":"Adam over many steps","problem":"adam-optimizer"},{"name":"AdamW: decoupled weight decay","problem":"adamw-decoupled-weight-decay","note":"The later fix that modern LLM training uses."},{"name":"Optimiser comparison","problem":"optimizer-showdown"}],"capstone":"adam-adamax-trajectories","lessons":["mlmaths:14.03","air-fanout-v1:05.06"],"lesson_links":[{"href":"../ml-maths-course/index.html#l14-03","t":"Adaptive methods: AdaGrad, RMSProp, Adam, AdamW","c":"ML Maths"},{"href":"../ai-research-track-web/index.html#l05-06","t":"Adam Optimizer","c":"AI Research"}]},{"id":"alexnet","kind":"paper","group":"Convolutional networks","title":"ImageNet Classification with Deep Convolutional Neural Networks","authors":"Krizhevsky, Sutskever & Hinton","year":2012,"url":"https://papers.nips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html","blurb":"The GPU-trained CNN that won ImageNet 2012 by a wide margin and started the deep learning era in computer vision.","intro":"AlexNet combined ReLU activations, local response normalisation, overlapping max pooling, dropout and aggressive data augmentation in a five-convolution, three-FC network. The steps build each ingredient, including the PCA colour augmentation; the capstone runs a miniature AlexNet with the paper's ten-crop test-time averaging.","steps":[{"name":"Strided convolution","problem":"2d-convolution"},{"name":"ReLU and other activations","problem":"activation-functions"},{"name":"Local response normalisation","problem":"local-response-normalization"},{"name":"Overlapping max pooling","problem":"max-pool-2d","note":"Use window 3 and stride 2."},{"name":"Dropout","problem":"dropout"},{"name":"Random crops and flips","problem":"basic-indexing"},{"name":"PCA colour augmentation","problem":"pca-color-augmentation"}],"capstone":"alexnet-ten-crop-predict","lessons":["dlcore:03.03","dlcore:02.03"],"lesson_links":[{"href":"../deep-learning/index.html#l03-03","t":"Classic CNNs: LeNet, AlexNet, VGG","c":"Deep Learning"},{"href":"../deep-learning/index.html#l02-03","t":"Dropout and regularisation","c":"Deep Learning"}]},{"id":"attention-is-all-you-need","kind":"paper","group":"Transformers and LLMs","title":"Attention Is All You Need","authors":"Vaswani et al.","year":2017,"url":"https://arxiv.org/abs/1706.03762","blurb":"Replaced recurrence in machine translation with stacks of self-attention and feed-forward layers, so a whole sentence is processed in parallel.","intro":"The paper's encoder-decoder is built from four ideas: token embeddings plus a fixed sinusoidal position signal, scaled dot-product attention split into several heads, a position-wise feed-forward network, and residual connections wrapped in LayerNorm. The steps build each piece and then the two block types; the capstone stacks them into a full translation model whose output is next-token logits. Decoding with a beam closes the loop.","steps":[{"name":"Build a vocabulary","problem":"vocabulary-building","note":"Map tokens to ids, with special tokens for padding and sentence start."},{"name":"Sinusoidal positional encoding","problem":"sinusoidal-positional-encoding"},{"name":"Scaled dot-product attention","problem":"scaled-dot-product-attention","note":"The $QK^\\top/\\sqrt{d_k}$ core, with a mask."},{"name":"Multi-head attention","problem":"multi-head-attention-mha"},{"name":"Layer normalization","problem":"layer-norm"},{"name":"Encoder block","problem":"transformer-encoder-block","note":"Self-attention and FFN sublayers, pre-LN and post-LN."},{"name":"Decoder block","problem":"transformer-decoder-block","note":"Adds causal masking and cross-attention to the encoder output."},{"name":"Beam search","problem":"beam-search-decoding","note":"How the paper decodes translations, with a length penalty."}],"capstone":"transformer-translation-forward","lessons":["aieng:04.01","aieng:04.02","aieng:04.03","dlcore:05.04"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l04-01","t":"Positional embeddings","c":"AI Engineering"},{"href":"../ai-engineering-course/index.html#l04-02","t":"Attention","c":"AI Engineering"},{"href":"../ai-engineering-course/index.html#l04-03","t":"Transformer architecture","c":"AI Engineering"},{"href":"../deep-learning/index.html#l05-04","t":"Transformers for sequences","c":"Deep Learning"}]},{"id":"bahdanau-attention","kind":"paper","group":"Sequence models and embeddings","title":"Neural Machine Translation by Jointly Learning to Align and Translate","authors":"Bahdanau, Cho & Bengio","year":2014,"url":"https://arxiv.org/abs/1409.0473","blurb":"Introduced attention to neural translation: the decoder computes a fresh weighted average of all encoder states at every output step.","intro":"A bidirectional RNN encoder produces one annotation per source word. At each output step a small network scores every annotation against the previous decoder state, the softmax of the scores weights the annotations into a context vector, and the decoder consumes it together with the previous word. The steps build the GRU, the encoder-decoder and additive attention; the capstone wires the full teacher-forced model and returns the alignment matrix.","steps":[{"name":"GRU over a sequence","problem":"gru-cell"},{"name":"Encoder-decoder without attention","problem":"sequence-to-sequence-forward-pass","note":"The fixed-vector bottleneck attention removes."},{"name":"Additive attention","problem":"attention-mechanism"},{"name":"Softmax","problem":"softmax-rows"},{"name":"Beam search decoding","problem":"beam-search-decoding"}],"capstone":"bahdanau-attention-decoder","lessons":["dlcore:05.03","air-fanout-v1:06.01"],"lesson_links":[{"href":"../deep-learning/index.html#l05-03","t":"Sequence-to-sequence and attention","c":"Deep Learning"},{"href":"../ai-research-track-web/index.html#l06-01","t":"Attention Mechanism Explained","c":"AI Research"}]},{"id":"batchnorm","kind":"paper","group":"Training and optimization","title":"Batch Normalization: Accelerating Deep Network Training by Reducing Internal Covariate Shift","authors":"Ioffe and Szegedy","year":2015,"url":"https://arxiv.org/abs/1502.03167","blurb":"Normalised each layer's pre-activations over the mini-batch, which allowed much higher learning rates and made deep networks far less sensitive to initialisation.","intro":"BatchNorm standardises every unit with the batch mean and variance, then applies a learned scale and shift. Because each example's output depends on the whole batch, the backward pass must differentiate through the batch statistics, and at test time the layer switches to running averages. The steps build per-channel statistics, the layer itself, its per-example cousin LayerNorm, manual backprop and initialisation; the capstone trains a small classifier for one step and evaluates it in inference mode.","steps":[{"name":"Per-channel mean and standard deviation","problem":"per-channel-mean-and-std"},{"name":"BatchNorm in train and eval mode","problem":"batch-normalization"},{"name":"LayerNorm for comparison","problem":"layer-normalization","note":"Normalises over features instead of the batch, so it has no train/eval difference."},{"name":"Backprop through a hidden layer","problem":"backpropagation-single-hidden-layer"},{"name":"Weight initialisation","problem":"weight-initialization","note":"What BatchNorm makes much less critical."}],"capstone":"batchnorm-mlp-training-step","lessons":["dlcore:02.01","dlcore:02.02"],"lesson_links":[{"href":"../deep-learning/index.html#l02-01","t":"Batch normalisation","c":"Deep Learning"},{"href":"../deep-learning/index.html#l02-02","t":"Layer and RMS normalisation","c":"Deep Learning"}]},{"id":"bert","kind":"paper","group":"Transformers and LLMs","title":"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding","authors":"Devlin et al.","year":2018,"url":"https://arxiv.org/abs/1810.04805","blurb":"Pre-trains a bidirectional Transformer encoder by predicting masked tokens and sentence order, then fine-tunes the same network for each downstream task.","intro":"BERT is an encoder-only Transformer. Its novelty is the pre-training setup: WordPiece inputs packed as `[CLS] A [SEP] B [SEP]` with segment embeddings, a masked-language-model objective that lets every position use both left and right context, and a next-sentence classifier on `[CLS]`. The steps build the input pipeline and the corruption scheme, then the encoder and two fine-tuning heads; the capstone computes both pre-training losses from one forward pass.","steps":[{"name":"WordPiece tokenization","problem":"subword-tokenization","note":"Greedy longest-match encoding with `##` continuation pieces."},{"name":"Sentence-pair packing and segment ids","problem":"next-sentence-prediction"},{"name":"Masked-LM corruption (80/10/10)","problem":"masked-language-modeling"},{"name":"Encoder block (post-LN)","problem":"transformer-encoder-block"},{"name":"Cross-entropy at scored positions","problem":"cross-entropy-logits"},{"name":"Fine-tuning: span extraction","problem":"span-extraction","note":"SQuAD-style start and end logits."},{"name":"Fine-tuning: token classification","problem":"token-classification","note":"Align word labels to WordPiece tokens."}],"capstone":"bert-pretraining-loss","lessons":["aieng:04.03","dlcore:05.04"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l04-03","t":"Transformer architecture","c":"AI Engineering"},{"href":"../deep-learning/index.html#l05-04","t":"Transformers for sequences","c":"Deep Learning"}]},{"id":"chinchilla","kind":"paper","group":"Training and optimization","title":"Training Compute-Optimal Large Language Models","authors":"Hoffmann et al.","year":2022,"url":"https://arxiv.org/abs/2203.15556","blurb":"Found that model size and training tokens should scale roughly equally with compute, about 20 tokens per parameter, and showed a smaller model trained on more data beats a larger undertrained one.","intro":"The paper trains hundreds of models across sizes and token counts and estimates the compute-optimal split three ways: from the lower envelope of training curves, from IsoFLOP profiles, and from a parametric fit $L = E + A/N^\\alpha + B/D^\\beta$. The steps build FLOP counting, compute budgets, power-law fits with and without a loss floor, the IsoFLOP exponent and allocation rules; the capstone fits the parametric loss and derives the optimal model and data size for several budgets.","steps":[{"name":"Counting transformer training FLOPs","problem":"transformer-training-flop-estimator"},{"name":"Compute budgets and wall-clock","problem":"training-compute-budget"},{"name":"Power-law fit in log space","problem":"power-law-log-fit"},{"name":"Power law with a loss floor","problem":"saturating-power-law-fit"},{"name":"Exponent from an IsoFLOP sweep","problem":"isoflop-sweep-exponent","note":"The paper's second approach."},{"name":"Compute-optimal size from a fitted loss","problem":"chinchilla-compute-optimal"},{"name":"Fixed tokens-per-parameter split","problem":"fixed-ratio-budget-split"}],"capstone":"chinchilla-parametric-fit","lessons":["air-fanout-v1:13.05"],"lesson_links":[{"href":"../ai-research-track-web/index.html#l13-05","t":"Scaling laws","c":"AI Research"}]},{"id":"clip","kind":"paper","group":"Vision and detection","title":"Learning Transferable Visual Models From Natural Language Supervision","authors":"Radford et al.","year":2021,"url":"https://arxiv.org/abs/2103.00020","blurb":"Trained image and text encoders on 400 million image-caption pairs with a contrastive loss, producing a joint embedding space that classifies images zero-shot from class names.","intro":"CLIP embeds a batch of images and their captions, normalises both, and trains so that each image's most similar caption in the batch is its own, and vice versa. The result is a pair of encoders whose cosine similarity measures image-text agreement. The steps build the ViT input embedding, masked pooling for text features, the symmetric contrastive loss and its sigmoid alternative, and retrieval; the capstone turns class names and prompt templates into a zero-shot classifier.","steps":[{"name":"ViT patch embedding","problem":"vision-transformer-patch-embedding","note":"CLIP's best image encoders are ViTs."},{"name":"Pooling token features","problem":"masked-mean-pooling"},{"name":"Symmetric contrastive loss","problem":"symmetric-clip-contrastive-loss"},{"name":"SigLIP's pairwise sigmoid loss","problem":"siglip-pairwise-loss","note":"A later replacement that drops the batch-wide softmax."},{"name":"Cosine retrieval","problem":"clip-cosine-retrieval"}],"capstone":"clip-zero-shot-classifier","lessons":["ieng:26.03"],"lesson_links":[{"href":"../inference-eng-course/index.html#l26-03","t":"Vision-Language & Multimodal Inference","c":"Inference Engineering"}]},{"id":"ddpm","kind":"paper","group":"Generative models","title":"Denoising Diffusion Probabilistic Models","authors":"Ho, Jain and Abbeel","year":2020,"url":"https://arxiv.org/abs/2006.11239","blurb":"Showed that a model trained to predict the noise added to an image, then run as a long reverse chain, produces samples competitive with GANs.","intro":"The forward process adds Gaussian noise over $T$ steps on a fixed schedule, and has a closed form for jumping from $x_0$ straight to any $x_t$. A network learns to predict the added noise with a plain mean-squared error, and sampling runs the reverse chain from pure noise, removing predicted noise and adding a little fresh noise at each step. The steps build the schedule, the forward jump, the posterior, the loss, the timestep embedding and both algorithms; the capstone trains a toy model and samples from it.","steps":[{"name":"Linear $\\beta$ schedule","problem":"linear-beta-schedule"},{"name":"Jumping to $x_t$ in closed form","problem":"forward-diffusion-sample"},{"name":"The forward-process posterior","problem":"posterior-mean-and-variance"},{"name":"The simple noise-prediction loss","problem":"noise-prediction-loss"},{"name":"Timestep embedding","problem":"sinusoidal-timestep-embedding","note":"How a real denoiser is told which step it is on."},{"name":"One training step","problem":"toy-diffusion-training-step"},{"name":"One ancestral sampling step","problem":"ddpm-ancestral-step"},{"name":"The full sampling chain","problem":"toy-ddpm-sampler"}],"capstone":"ddpm-train-and-sample","lessons":["dlcore:07.03","dlcore:07.04","dlcore:07.05"],"lesson_links":[{"href":"../deep-learning/index.html#l07-03","t":"Diffusion: the forward process","c":"Deep Learning"},{"href":"../deep-learning/index.html#l07-04","t":"Diffusion: the denoiser and its objective","c":"Deep Learning"},{"href":"../deep-learning/index.html#l07-05","t":"Diffusion: sampling with DDPM and DDIM","c":"Deep Learning"}]},{"id":"deepseek-v3","kind":"paper","group":"Transformers and LLMs","title":"DeepSeek-V3 Technical Report","authors":"DeepSeek-AI","year":2024,"url":"https://arxiv.org/abs/2412.19437","b
