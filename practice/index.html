lurb":"A 671B-parameter mixture-of-experts model with 37B active parameters per token, built on latent attention, fine-grained experts, bias-based load balancing and multi-token prediction.","intro":"Each DeepSeek-V3 layer pairs multi-head latent attention (MLA), which caches a small latent per token instead of full keys and values, with a DeepSeekMoE feed-forward: one shared expert plus many small routed experts chosen by sigmoid affinities. Load is balanced by adjusting per-expert routing biases instead of an auxiliary loss, and extra modules predict tokens further ahead during training. The steps build MLA, the router and the MoE machinery separately; the capstone assembles one full block.","steps":[{"name":"Multi-head latent attention","problem":"multi-head-latent-attention-mla","note":"Compressed KV plus a decoupled rotary key."},{"name":"KV-cache size: MHA, GQA and MLA","problem":"kv-cache-memory-for-mha-mqa-gqa-and-mla"},{"name":"Auxiliary-loss-free routing","problem":"aux-loss-free-moe-routing"},{"name":"Top-k routing with balance statistics","problem":"top-k-moe-router-with-load-statistics","note":"The auxiliary-loss approach V3 moved away from, for comparison."},{"name":"Token dispatch and expert combine","problem":"moe-token-dispatch-and-expert-aggregation"},{"name":"Expert parallelism across GPUs","problem":"expert-parallel-routing-across-gpus"},{"name":"Multi-token prediction","problem":"multi-token-prediction-loss"},{"name":"Block-wise FP8 quantization","problem":"block-wise-fp8-quantization","note":"V3 trained in FP8 with fine-grained scaling."}],"capstone":"deepseek-v3-block","lessons":["aieng:06.02","ieng:19.01","ieng:19.02","ieng:19.03"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l06-02","t":"Mixture of experts","c":"AI Engineering"},{"href":"../inference-eng-course/index.html#l19-01","t":"How MoE Inference Differs From Dense Models","c":"Inference Engineering"},{"href":"../inference-eng-course/index.html#l19-02","t":"Token Routing & Expert Activation","c":"Inference Engineering"},{"href":"../inference-eng-course/index.html#l19-03","t":"Expert Parallelism & Expert Placement","c":"Inference Engineering"}]},{"id":"densenet","kind":"paper","group":"Convolutional networks","title":"Densely Connected Convolutional Networks","authors":"Huang et al.","year":2017,"url":"https://arxiv.org/abs/1608.06993","blurb":"Connects every layer in a block to all earlier layers by concatenation, so features are reused and each layer can be very narrow.","intro":"A dense block keeps a growing stack of feature maps: each layer reads the whole stack and appends $k$ new channels. Bottleneck 1×1 convolutions keep the 3×3 layers cheap, and transition layers compress channels and halve the resolution between blocks. The steps cover the convolution, normalisation and pooling pieces; the capstone builds a DenseNet-BC from blocks and transitions.","steps":[{"name":"Multi-channel convolution","problem":"multichannel-2d-convolution"},{"name":"Batch normalisation","problem":"batch-normalization"},{"name":"1×1 bottlenecks and their savings","problem":"depthwise-separable-convolution","note":"Counting how cheap convolutions reduce cost, the motivation for the BC variant."},{"name":"Average pooling for transitions","problem":"average-pool-2d"},{"name":"Global average pooling","problem":"adaptive-average-pool-2d"}],"capstone":"densenet-tiny-forward","lessons":["dlcore:03.05","dlcore:03.04"],"lesson_links":[{"href":"../deep-learning/index.html#l03-05","t":"Efficient and attentive CNNs","c":"Deep Learning"},{"href":"../deep-learning/index.html#l03-04","t":"Residual networks","c":"Deep Learning"}]},{"id":"dit","kind":"paper","group":"Generative models","title":"Scalable Diffusion Models with Transformers","authors":"Peebles and Xie","year":2022,"url":"https://arxiv.org/abs/2212.09748","blurb":"Replaced the diffusion U-Net with a plain transformer over latent patches and showed sample quality improves steadily with compute.","intro":"DiT patchifies a latent like a ViT, runs transformer blocks over the tokens and unpatchifies the output into a noise prediction and a variance. The timestep and class label condition every block through adaptive LayerNorm: they regress a shift, a scale and a residual gate per sublayer, initialised so each block starts as the identity. The steps build patchification, the timestep embedding, one adaLN-Zero block and classifier-free guidance; the capstone is the full forward pass from latent to output.","steps":[{"name":"Patchify","problem":"vit-patchify"},{"name":"Timestep embedding","problem":"sinusoidal-timestep-embedding"},{"name":"adaLN-Zero block","problem":"dit-patchify-and-adaln-zero-block"},{"name":"Classifier-free guidance","problem":"classifier-free-guidance","note":"DiT's best results use guidance with a null class label."}],"capstone":"dit-full-forward","lessons":["ieng:26.08","dlcore:07.07"],"lesson_links":[{"href":"../inference-eng-course/index.html#l26-08","t":"Diffusion Inference: Denoising & Sampling","c":"Inference Engineering"},{"href":"../deep-learning/index.html#l07-07","t":"Guidance and conditioning","c":"Deep Learning"}]},{"id":"dpo","kind":"paper","group":"Reinforcement learning and alignment","title":"Direct Preference Optimization: Your Language Model is Secretly a Reward Model","authors":"Rafailov et al.","year":2023,"url":"https://arxiv.org/abs/2305.18290","blurb":"Showed that the KL-regularised RLHF objective can be optimised directly from preference pairs with a classification loss, with no reward model and no RL loop.","intro":"The optimal policy for a KL-penalised reward has a closed form, so the reward can be written in terms of the policy's log-probability ratio to a reference model. Substituting that into the Bradley-Terry preference likelihood cancels the intractable normaliser and leaves a loss on the policy alone. The steps build preference data, the Bradley-Terry loss, the DPO loss from token log-probabilities and the choice of length normalisation; the capstone computes sequence log-probabilities for a bigram model and takes one DPO gradient step.","steps":[{"name":"Canonical preference pairs","problem":"canonicalize-pairwise-preference-data"},{"name":"Bradley-Terry loss","problem":"bradley-terry-reward-model-loss","note":"The preference model DPO inherits."},{"name":"DPO loss from token log-probabilities","problem":"dpo-closed-form-loss"},{"name":"Sequence vs token length normalisation","problem":"compare-sequence-and-token-length-normalization"}],"capstone":"dpo-gradient-step","lessons":["dlcore:08.07"],"lesson_links":[{"href":"../deep-learning/index.html#l08-07","t":"Learning from preferences","c":"Deep Learning"}]},{"id":"dqn","kind":"paper","group":"Reinforcement learning and alignment","title":"Human-level control through deep reinforcement learning","authors":"Mnih et al.","year":2015,"url":"https://www.nature.com/articles/nature14236","blurb":"Learned to play dozens of Atari games from pixels with a single Q-learning agent, stabilised by experience replay and a periodically updated target network.","intro":"DQN is Q-learning with a convolutional network as the Q-function. Two additions make the combination stable: transitions are stored in a replay buffer and sampled at random, and the bootstrapped targets come from a frozen copy of the network that is refreshed only occasionally. The steps build tabular Q-learning, $\\epsilon$-greedy exploration, the replay buffer, the target-network loss and the later Double, Dueling and prioritised-replay improvements; the capstone runs the whole training loop on a chain environment.","steps":[{"name":"Tabular Q-learning","problem":"q-learning-update"},{"name":"$\\epsilon$-greedy action selection","problem":"epsilon-greedy-action-selection"},{"name":"Experience replay buffer","problem":"experience-replay-buffer"},{"name":"Huber loss against a target network","problem":"dqn-loss-with-target-network"},{"name":"Double DQN targets","problem":"double-dqn-target","note":"Later work that reduces overestimation."},{"name":"Dueling architecture","problem":"dueling-dqn-decomposition"},{"name":"Prioritised replay","problem":"prioritized-experience-replay"}],"capstone":"dqn-chain-training-loop","lessons":["air-fanout-v1:07.03","dlcore:08.04"],"lesson_links":[{"href":"../ai-research-track-web/index.html#l07-03","t":"Deep Q-Learning (DQN)","c":"AI Research"},{"href":"../deep-learning/index.html#l08-04","t":"Q-learning and SARSA","c":"Deep Learning"}]},{"id":"dropout","kind":"paper","group":"Training and optimization","title":"Dropout: A Simple Way to Prevent Neural Networks from Overfitting","authors":"Srivastava et al.","year":2014,"url":"https://jmlr.org/papers/v15/srivastava14a.html","blurb":"Regularised neural networks by randomly zeroing units during training, approximately averaging an exponential number of thinned networks at test time.","intro":"During training each unit is kept with some probability and dropped otherwise, a different mask for every example and step. At test time the full network is used with activations scaled to match their training-time expectation; the inverted form does the scaling during training instead. The steps build the forward pass, inverted dropout and its channel-wise variant for feature maps; the capstone trains a regressor with explicit masks and compares deterministic prediction with Monte Carlo dropout.","steps":[{"name":"MLP forward pass","problem":"multi-layer-perceptron-forward-pass"},{"name":"Inverted dropout in an MLP","problem":"dropout"},{"name":"Channel dropout for feature maps","problem":"dropout-2","note":"Drops whole channels, since neighbouring pixels are strongly correlated."},{"name":"Backprop through a hidden layer","problem":"backpropagation-single-hidden-layer"}],"capstone":"dropout-train-and-mc-predict","lessons":["dlcore:02.03"],"lesson_links":[{"href":"../deep-learning/index.html#l02-03","t":"Dropout and regularisation","c":"Deep Learning"}]},{"id":"elman-rnn","kind":"paper","group":"Sequence models and embeddings","title":"Finding Structure in Time","authors":"Elman","year":1990,"url":"https://doi.org/10.1207/s15516709cog1402_1","blurb":"Introduced the simple recurrent network, whose hidden state feeds back as context so the network can discover structure in sequences.","intro":"An Elman network copies its hidden layer into a context layer that is fed back at the next step, giving the recurrence $h_t = \\tanh(x_tW_{xh} + h_{t-1}W_{hh} + b)$. Training it means backpropagating through the unrolled sequence, and the gradients through many steps tend to vanish or explode. The steps build the cell, a language model and training with truncated BPTT and clipping; the capstone computes full BPTT gradients and shows the vanishing effect.","steps":[{"name":"Elman RNN over padded sequences","problem":"vanilla-rnn-cell"},{"name":"Score a batch with an RNN language model","problem":"language-modeling"},{"name":"Truncated backprop through time","problem":"rnn-cell"},{"name":"Gradient clipping","problem":"gradient-clipping"}],"capstone":"rnn-bptt-gradients","lessons":["dlcore:05.02"],"lesson_links":[{"href":"../deep-learning/index.html#l05-02","t":"LSTMs and GRUs","c":"Deep Learning"}]},{"id":"faster-rcnn","kind":"paper","group":"Vision and detection","title":"Faster R-CNN: Towards Real-Time Object Detection with Region Proposal Networks","authors":"Ren et al.","year":2015,"url":"https://arxiv.org/abs/1506.01497","blurb":"Replaced hand-crafted region proposals with a small network on shared convolutional features, making two-stage detection fast and fully learned.","intro":"A region proposal network slides over the backbone's feature map, scoring and refining a set of anchor boxes at every position. Its top proposals, after NMS, are cropped from the same features and passed to a second head that classifies and refines them. The steps build anchors, IoU and box encodings, RPN training targets, NMS, RoIAlign and the feature pyramid that later versions add; the capstone turns raw RPN outputs into proposals.","steps":[{"name":"Anchor boxes over a feature map","problem":"anchor-box-generation"},{"name":"IoU between box sets","problem":"iou-matrix"},{"name":"Box encoding and decoding","problem":"box-encode-and-decode"},{"name":"RPN training targets","problem":"rpn-anchor-target-assignment"},{"name":"Non-maximum suppression","problem":"non-maximum-suppression"},{"name":"RoIAlign","problem":"roi-align","note":"From Mask R-CNN; it replaced the paper's RoI pooling."},{"name":"Feature pyramid fusion","problem":"fpn-top-down-fusion","note":"FPN, the standard multi-scale backbone for Faster R-CNN since 2017."}],"capstone":"rpn-proposals","lessons":["dlcore:04.02","dlcore:04.03"],"lesson_links":[{"href":"../deep-learning/index.html#l04-02","t":"Object detection basics","c":"Deep Learning"},{"href":"../deep-learning/index.html#l04-03","t":"Detection losses and matching","c":"Deep Learning"}]},{"id":"flashattention","kind":"paper","group":"Efficient inference","title":"FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness","authors":"Dao et al.","year":2022,"url":"https://arxiv.org/abs/2205.14135","blurb":"Made exact attention much faster and linear in memory by tiling it so the attention matrix never leaves on-chip memory, recomputing it in the backward pass.","intro":"Attention is bound by memory traffic, not arithmetic: writing and re-reading the $N\\times N$ score and probability matrices dominates. FlashAttention processes query and key tiles in fast SRAM, combining partial softmaxes with an online rescaling, and stores only the output and one logsumexp per row. The backward pass rebuilds each probability tile from that logsumexp. The steps build reference attention, the online softmax and tiled forward passes in numpy, torch and Triton; the capstone adds the tiled backward pass.","steps":[{"name":"Reference attention","problem":"scaled-dot-product-attention"},{"name":"Online softmax","problem":"online-softmax"},{"name":"Blockwise online softmax","problem":"blockwise-online-softmax"},{"name":"Blockwise attention","problem":"blockwise-attention-with-online-softmax"},{"name":"Tiled forward pass","problem":"flashattention-with-online-softmax"},{"name":"Forward kernel in Triton","problem":"flashattention-forward","note":"The same algorithm as a GPU kernel."}],"capstone":"flashattention-tiled-backward","lessons":["ieng:14.03","aieng:06.03"],"lesson_links":[{"href":"../inference-eng-course/index.html#l14-03","t":"FlashAttention","c":"Inference Engineering"},{"href":"../ai-engineering-course/index.html#l06-03","t":"FlashAttention","c":"AI Engineering"}]},{"id":"flow-matching","kind":"paper","group":"Generative models","title":"Flow Matching for Generative Modeling","authors":"Lipman et al.","year":2022,"url":"https://arxiv.org/abs/2210.02747","blurb":"Trained continuous normalising flows without simulation by regressing a velocity field onto per-sample target velocities along simple paths from noise to data.","intro":"Pick a path from each noise sample to a data sample, such as a straight line, and its velocity is known in closed form. Regressing a network onto those conditional velocities learns a field whose ODE moves the whole noise distribution onto the data. Sampling integrates that ODE with a standard solver. The steps build the flow-matching loss, conversions between prediction targets and an ODE sampler; the capstone trains a small velocity model and integrates it with Euler or midpoint steps.","steps":[{"name":"Conditional flow-matching loss","problem":"conditional-flow-matching-loss"},{"name":"Converting between noise, data and velocity targets","problem":"prediction-parameterization","note":"Links flow matching to diffusion's $\\epsilon$- and $v$-prediction."},{"name":"Euler ODE sampling","problem":"karras-euler-sampler","note":"The same integrator, written for a diffusion ODE."}],"capstone":"flow-matching-train-and-integrate","lessons":["dlcore:07.06"],"lesson_links":[{"href":"../deep-learning/index.html#l07-06","t":"Score matching and flow matching","c":"Deep Learning"}]},{"id":"gan","kind":"paper","group":"Generative models","title":"Generative Adversarial Nets","authors":"Goodfellow et al.","year":2014,"url":"https://arxiv.org/abs/1406.2661","blurb":"Trained a generator by pitting it against a discriminator that learns to tell real samples from generated ones, with no likelihood and no Markov chains.","intro":"The discriminator is a binary classifier trained with cross-entropy on real and generated samples; the generator is trained to make the discriminator wrong. The two alternate, usually with a few discriminator steps per generator step, and the paper's practical trick is the non-saturating generator loss. The steps build the networks, the classifier loss and a single adversarial update; the capstone runs the full alternating loop on 1-D data and also asks how to evaluate the result.","steps":[{"name":"MLP forward pass","problem":"multi-layer-perceptron-forward-pass","note":"Both players in the paper are MLPs."},{"name":"The discriminator's loss","problem":"log-loss-binary-cross-entropy"},{"name":"One adversarial update","problem":"gan-training-step"},{"name":"Evaluating samples with FID","problem":"frechet-distance-between-feature-sets","note":"A later metric, now the standard way to compare GANs."}],"capstone":"gan-1d-training-loop","lessons":["dlcore:07.02"],"lesson_links":[{"href":"../deep-learning/index.html#l07-02","t":"Generative adversarial networks","c":"Deep Learning"}]},{"id":"gated-deltanet","kind":"paper","group":"Sequence models and embeddings","title":"Gated Delta Networks: Improving Mamba2 with Delta Rule","authors":"Yang, Kautz & Hatamizadeh","year":2024,"url":"https://arxiv.org/abs/2412.06464","blurb":"Combines Mamba-2's decay gate with DeltaNet's error-correcting state update, giving a linear-time recurrent layer that both forgets and overwrites precisely.","intro":"Linear attention keeps a matrix state that only accumulates. The delta rule turns it into a key-value memory that corrects the value stored under each key; a scalar decay gate lets the memory forget quickly. The steps go from linear attention through the gated recurrence to the chunkwise (WY/UT) form used for training; the capstone wraps the recurrence in the full layer with projections, short convolutions and a gated output norm.","steps":[{"name":"Linear attention: parallel and recurrent","problem":"parallel-and-recurrent-linear-attention"},{"name":"Mamba-2 scalar-gated scan","problem":"mamba-2-gated-state-scan","note":"Where the decay gate comes from."},{"name":"Gated delta rule, token by token","problem":"gated-deltanet-state-update"},{"name":"Chunkwise form with the WY/UT transform","problem":"chunkwise-gated-delta-rule"}],"capstone":"gated-deltanet-layer","lessons":["aieng:07.02"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l07-02","t":"Sparse attention","c":"AI Engineering"}]},{"id":"gemma-3","kind":"paper","group":"Transformers and LLMs","title":"Gemma 3 Technical Report","authors":"Gemma Team, Google DeepMind","year":2025,"url":"https://arxiv.org/abs/2503.19786","blurb":"Extends the Gemma decoder to 128k-token contexts by making most layers sliding-window attention, with a global layer every few layers.","intro":"Gemma 3's block is a GQA decoder block with RMSNorm on both sides of each sublayer and QK-norm inside attention. The architecture change that matters most is the layer schedule: five local sliding-window layers for every global layer, with a small RoPE base for local layers and a large one for global layers. The steps cover sliding-window GQA, RoPE, the norm choices and the gated MLP; the capstone builds the interleaved stack.","steps":[{"name":"Causal GQA with a sliding window","problem":"causal-grouped-query-attention"},{"name":"Rotary position embeddings","problem":"rotary-position-embedding-rope"},{"name":"Soft-capping vs QK-norm","problem":"qk-norm-vs-logit-softcap","note":"Gemma 2 capped logits; Gemma 3 normalises queries and keys instead."},{"name":"RMSNorm and a gated MLP","problem":"norm-gated-linear-transform"},{"name":"KV-cache size of local vs global layers","problem":"kv-cache-memory-for-mha-mqa-gqa-and-mla"}],"capstone":"gemma3-local-global-stack","lessons":["aieng:07.02","aieng:04.03"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l07-02","t":"Sparse attention","c":"AI Engineering"},{"href":"../ai-engineering-course/index.html#l04-03","t":"Transformer architecture","c":"AI Engineering"}]},{"id":"glm-4-5","kind":"paper","group":"Transformers and LLMs","title":"GLM-4.5: Agentic, Reasoning, and Coding (ARC) Foundation Models","authors":"GLM-4.5 Team, Z.ai","year":2025,"url":"https://arxiv.org/abs/2508.06471","blurb":"A deep, narrow mixture-of-experts decoder with dense prefix layers, partial RoPE, QK-norm and a multi-token-prediction layer, trained for agentic and reasoning tasks.","intro":"GLM-4.5's architecture combines familiar parts in a particular way: GQA attention with QK-norm and rotary embeddings on only part of each head, a few dense layers at the bottom, MoE layers with a shared expert and sigmoid routing balanced by biases, and an MTP layer used for speculative decoding. The steps cover each part; the capstone builds a stack of dense and MoE layers.","steps":[{"name":"RMSNorm","problem":"rmsnorm-forward-pass"},{"name":"Partial rotary embeddings","problem":"rotary-query-and-key-embeddings"},{"name":"QK-norm","problem":"qk-norm-vs-logit-softcap"},{"name":"Grouped-query attention","problem":"causal-grouped-query-attention"},{"name":"SwiGLU feed-forward","problem":"parameter-matched-swiglu-block"},{"name":"Sigmoid routing with bias balancing","problem":"aux-loss-free-moe-routing"},{"name":"Multi-token prediction layer","problem":"multi-token-prediction-loss"}],"capstone":"glm45-dense-then-moe-stack","lessons":["aieng:06.02","ieng:16.06"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l06-02","t":"Mixture of experts","c":"AI Engineering"},{"href":"../inference-eng-course/index.html#l16-06","t":"Medusa, EAGLE & Multi-Token Prediction","c":"Inference Engineering"}]},{"id":"gpt-2","kind":"paper","group":"Transformers and LLMs","title":"Language Models are Unsupervised Multitask Learners","authors":"Radford et al.","year":2019,"url":"https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf","blurb":"Trained a 1.5B-parameter decoder-only Transformer on a large web corpus and showed it could perform many tasks zero-shot from a prompt.","intro":"GPT-2 is the template for modern decoder-only models: byte-level BPE, learned token and position embeddings, pre-LN blocks with causal multi-head attention and a GELU MLP, a final LayerNorm, and an output layer tied to the token embeddings. The steps go from the tokenizer to sampling; the capstone runs the forward pass and generates text greedily, including the context-window crop.","steps":[{"name":"Train a byte-level BPE vocabulary","problem":"train-deterministic-bpe-vocabulary"},{"name":"Encode with ranked merges","problem":"apply-ranked-bpe-merges"},{"name":"Causal multi-head self-attention","problem":"scaled-dot-product-attention-2"},{"name":"GELU and other activations","problem":"activation-functions"},{"name":"Layer normalization","problem":"layer-norm"},{"name":"Language-model loss and perplexity","problem":"perplexity-computation"},{"name":"Temperature, top-k and top-p sampling","problem":"text-generation-sampling"}],"capstone":"gpt2-greedy-generate","lessons":["air-fanout-v1:06.03","aieng:05.01","aieng:05.03"],"lesson_links":[{"href":"../ai-research-track-web/index.html#l06-03","t":"GPT From Scratch","c":"AI Research"},{"href":"../ai-engineering-course/index.html#l05-01","t":"Masked attention","c":"AI Engineering"},{"href":"../ai-engineering-course/index.html#l05-03","t":"Trace the shapes through a transformer","c":"AI Engineering"}]},{"id":"gpt-oss","kind":"paper","group":"Transformers and LLMs","title":"gpt-oss-120b & gpt-oss-20b Model Card","authors":"OpenAI","year":2025,"url":"https://arxiv.org/abs/2508.10925","blurb":"OpenAI's open-weight MoE reasoning models: alternating banded and dense attention with learned sinks, YaRN-extended RoPE, and MXFP4 expert weights.","intro":"gpt-oss is a pre-norm MoE decoder. Attention layers alternate between a 128-token band and full causal attention, use grouped-query attention, and give every head a learned sink logit. RoPE is extended to 131k tokens with YaRN. Each MoE layer routes tokens to the top 4 experts, whose SwiGLU activations are clamped, and the expert weights are stored in MXFP4. The steps build each of these components; the capstone wires one full block.","steps":[{"name":"Attention with learned sinks","problem":"attention-with-sink-logits"},{"name":"Banded (sliding-window) GQA","problem":"causal-grouped-query-attention"},{"name":"RoPE with YaRN scaling","problem":"rope-scores-with-context-extension"},{"name":"Top-k expert routing","problem":"sparse-moe-top-k-expert-routing"},{"name":"Dispatch and combine","problem":"moe-token-dispatch-and-expert-aggregation"},{"name":"MXFP4 dequantization","problem":"mxfp4-dequantize"}],"capstone":"gpt-oss-block","lessons":["aieng:06.02","aieng:07.02","ieng:11.01"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l06-02","t":"Mixture of experts","c":"AI Engineering"},{"href":"../ai-engineering-course/index.html#l07-02","t":"Sparse attention","c":"AI Engineering"},{"href":"../inference-eng-course/index.html#l11-01","t":"Precision, Memory & Hardware Support","c":"Inference Engineering"}]},{"id":"grpo","kind":"paper","group":"Reinforcement learning and alignment","title":"DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models","authors":"Shao et al.","year":2024,"url":"https://arxiv.org/abs/2402.03300","blurb":"Introduced Group Relative Policy Optimization, which replaces PPO's value network with rewards normalised across a group of sampled answers, the RL algorithm behind later open reasoning models.","intro":"For each question GRPO samples a group of answers, scores them, and uses each answer's reward relative to the group as its advantage, so no critic is trained. The loss keeps PPO's clipped ratio and adds a KL penalty to a reference model directly. The paper also compares outcome supervision, one reward per answer, with process supervision, a reward per reasoning step. The steps build group-relative advantages and their normalisation choices, KL estimators, the leave-one-out baseline and token aggregation; the capstone computes process-supervised advantages and the full loss.","steps":[{"name":"Group-relative advantages","problem":"normalize-grpo-group-advantages"},{"name":"GRPO loss","problem":"grpo-group-relative-advantage"},{"name":"KL estimators","problem":"score-kl-regularized-policy-batch"},{"name":"REINFORCE leave-one-out","problem":"rloo-reinforce-leave-one-out","note":"A closely related critic-free baseline."},{"name":"Sequence vs token loss aggregation","problem":"compare-sequence-and-token-length-normalization"}],"capstone":"grpo-process-supervision-loss","lessons":["air-fanout-v1:07.04","dlcore:08.07"],"lesson_links":[{"href":"../ai-research-track-web/index.html#l07-04","t":"PPO, LLM Reasoning, Importance Ratio, Advantage","c":"AI Research"},{"href":"../deep-learning/index.html#l08-07","t":"Learning from preferences","c":"Deep Learning"}]},{"id":"gru","kind":"paper","group":"Sequence models and embeddings","title":"Learning Phrase Representations using RNN Encoder-Decoder for Statistical Machine Translation","authors":"Cho et al.","year":2014,"url":"https://arxiv.org/abs/1406.1078","blurb":"Proposed the RNN encoder-decoder and the gated recurrent unit, a simpler two-gate alternative to the LSTM.","intro":"The GRU merges the LSTM's cell and hidden state and uses two gates: an update gate that interpolates between the old state and a candidate, and a reset gate that controls how much of the old state the candidate sees. The same paper introduced the encoder-decoder used for translation. The steps build the cell, the encoder-decoder and masked pooling; the capstone is a bidirectional GRU classifier that handles padding correctly.","steps":[{"name":"GRU over a sequence","problem":"gru-cell"},{"name":"Encoder-decoder with teacher forcing","problem":"sequence-to-sequence-forward-pass"},{"name":"Pad and truncate a batch","problem":"padding-and-truncation"},{"name":"Masked mean pooling","problem":"masked-mean-pooling"}],"capstone":"bigru-text-classifier","lessons":["dlcore:05.02","dlcore:05.03"],"lesson_links":[{"href":"../deep-learning/index.html#l05-02","t":"LSTMs and GRUs","c":"Deep Learning"},{"href":"../deep-learning/index.html#l05-03","t":"Sequence-to-sequence and attention","c":"Deep Learning"}]},{"id":"instructgpt","kind":"paper","group":"Reinforcement learning and alignment","title":"Training language models to follow instructions with human feedback","authors":"Ouyang et al.","year":2022,"url":"https://arxiv.org/abs/2203.02155","blurb":"Aligned GPT-3 with user intent through supervised fine-tuning, a reward model trained on human rankings, and PPO against that reward with a KL penalty.","intro":"The recipe has three stages. Supervised fine-tuning on demonstrations gives a starting policy; a reward model learns from human comparisons of sampled responses; and reinforcement learning maximises the learned reward while a KL penalty keeps the policy near the SFT model and a pretraining term limits regressions. The steps build the SFT loss mask, preference-data cleaning, the Bradley-Terry reward loss, KL-regularised rewards and an RLHF PPO step; the capstone runs the reward-model and RL stages end to end on a toy problem with exact expectations.","steps":[{"name":"Assistant-only SFT loss mask","problem":"build-assistant-only-sft-loss-mask"},{"name":"Canonical preference pairs","problem":"canonicalize-pairwise-preference-data"},{"name":"Bradley-Terry reward model loss","problem":"bradley-terry-reward-model-loss"},{"name":"KL-regularised rewards","problem":"score-kl-regularized-policy-batch"},{"name":"PPO step with a reference-policy KL","problem":"ppo-with-reference-policy-kl"}],"capstone":"instructgpt-rm-and-ppo-ptx","lessons":["dlcore:08.07"],"lesson_links":[{"href":"../deep-learning/index.html#l08-07","t":"Learning from preferences","c":"Deep Learning"}]},{"id":"latent-diffusion","kind":"paper","group":"Generative models","title":"High-Resolution Image Synthesis with Latent Diffusion Models","authors":"Rombach et al.","year":2021,"url":"https://arxiv.org/abs/2112.10752","blurb":"Moved diffusion into the latent space of a pretrained autoencoder and conditioned it through cross-attention, the recipe behind Stable Diffusion.","intro":"A perceptual autoencoder compresses images to a small latent grid once, and the diffusion model only ever sees latents, which cuts training and sampling cost sharply. Text or other conditions enter the denoiser through cross-attention, with latent positions as queries and condition tokens as keys and values. The steps build the autoencoders, attention over latent positions, cross-attention in a decoder block, classifier-free guidance and the DDIM update; the capstone wires them into a guided sampler that decodes its final latent.","steps":[{"name":"Autoencoder","problem":"autoencoder-forward-pass"},{"name":"VAE-regularised latents","problem":"variational-autoencoder-forward-pass","note":"The paper's KL-regularised autoencoder keeps latents close to a standard normal."},{"name":"Self-attention over spatial positions","problem":"spatial-self-attention-block"},{"name":"Cross-attention inside a block","problem":"transformer-decoder-block","note":"The same query-from-one-sequence, keys-from-another pattern conditions the denoiser on text."},{"name":"Classifier-free guidance","problem":"classifier-free-guidance"},{"name":"Deterministic DDIM step","problem":"ddim-step"}],"capstone":"latent-diffusion-guided-sampling","lessons":["dlcore:07.05","dlcore:07.07","ieng:26.08"],"lesson_links":[{"href":"../deep-learning/index.html#l07-05","t":"Diffusion: sampling with DDPM and DDIM","c":"Deep Learning"},{"href":"../deep-learning/index.html#l07-07","t":"Guidance and conditioning","c":"Deep Learning"},{"href":"../inference-eng-course/index.html#l26-08","t":"Diffusion Inference: Denoising & Sampling","c":"Inference Engineering"}]},{"id":"llada","kind":"paper","group":"Generative models","title":"Large Language Diffusion Models","authors":"Nie et al.","year":2025,"url":"https://arxiv.org/abs/2502.09992","blurb":"Trains an 8B masked diffusion language model from scratch and shows it competes with autoregressive models of similar size, including on in-context learning and instruction following.","intro":"LLaDA replaces next-token prediction with masked diffusion: a bidirectional Transformer predicts all masked tokens of a sequence corrupted at a random rate $t$, with a $1/t$-weighted loss. Sampling starts from an all-mask answer and unmasks it over several steps. The steps build the corruption and loss, guidance and the bidirectional mask predictor; the capstone is the semi-autoregressive sampler with low-confidence remasking.","steps":[{"name":"BERT-style masking, for contrast","problem":"masked-language-modeling"},{"name":"Masked diffusion loss","problem":"masked-diffusion-lm-loss"},{"name":"Bidirectional mask predictor (encoder block)","problem":"transformer-encoder-block"},{"name":"Classifier-free guidance","problem":"classifier-free-guidance"},{"name":"Response-only masks for SFT","problem":"build-assistant-only-sft-loss-mask"}],"capstone":"llada-semi-autoregressive-sampler","lesson_links":[]},{"id":"llama","kind":"paper","group":"Transformers and LLMs","title":"LLaMA: Open and Efficient Foundation Language Models","authors":"Touvron et al.","year":2023,"url":"https://arxiv.org/abs/2302.13971","blurb":"Showed that smaller decoder-only models trained on more tokens can match much larger ones, using a block design (RMSNorm, RoPE, SwiGLU) that most open models now share.","intro":"The LLaMA block is a pre-norm decoder block with three substitutions: RMSNorm for LayerNorm, rotary position embeddings applied to queries and keys, and a SwiGLU feed-forward network. LLaMA 2 added grouped-query attention for its larger models. Each step builds one of these parts in isolation; the capstone stacks them into a full forward pass, and the last step shows how the model is decoded with a KV cache.","steps":[{"name":"RMSNorm","problem":"rmsnorm-forward-pass"},{"name":"Rotary position embeddings","problem":"rotary-position-embedding-rope","note":"Both the interleaved and the rotate-half layouts."},{"name":"SwiGLU feed-forward","problem":"parameter-matched-swiglu-block","note":"Why the hidden width is about $\\tfrac{8}{3}D$."},{"name":"RMSNorm plus gated MLP","problem":"norm-gated-linear-transform"},{"name":"Grouped-query attention","problem":"causal-grouped-query-attention"},{"name":"From MHA to GQA weights","problem":"grouped-query-attention-gqa"},{"name":"Decoding with a KV cache","problem":"autoregressive-decoding-with-kv-cache"}],"capstone":"llama-decoder-forward","lessons":["air-fanout-v1:08.01","aieng:04.01","aieng:04.03"],"lesson_links":[{"href":"../ai-research-track-web/index.html#l08-01","t":"Llama 4 From Scratch","c":"AI Research"},{"href":"../ai-engineering-course/index.html#l04-01","t":"Positional embeddings","c":"AI Engineering"},{"href":"../ai-engineering-course/index.html#l04-03","t":"Transformer architecture","c":"AI Engineering"}]},{"id":"lora","kind":"paper","group":"Training and optimization","title":"LoRA: Low-Rank Adaptation of Large Language Models","authors":"Hu et al.","year":2021,"url":"https://arxiv.org/abs/2106.09685","blurb":"Fine-tuned large models by freezing the pretrained weights and training a low-rank update, cutting trainable parameters by orders of magnitude with no added inference latency.","intro":"A frozen weight $W_0$ gets a trainable update $\\frac{\\alpha}{r}AB$ with $A$ random and $B$ zero, so training starts exactly at the pretrained model. Only the thin factors receive gradients and optimiser state, and after training the update can be merged into $W_0$. The steps build a linear layer, low-rank approximation and the SVD that underlies it; the capstone fine-tunes adapters on a frozen layer and merges them.","steps":[{"name":"A linear layer","problem":"custom-linear-layer"},{"name":"SVD components","problem":"svd-components"},{"name":"Best low-rank approximation","problem":"low-rank-approximation","note":"What a rank-$r$ update can and cannot represent."}],"capstone":"lora-finetune-and-merge","lessons":["air-fanout-v1:10.02","ieng:26.02","mlmaths:07.07"],"lesson_links":[{"href":"../ai-research-track-web/index.html#l10-02","t":"LoRA & QLoRA","c":"AI Research"},{"href":"../inference-eng-course/index.html#l26-02","t":"Multi-LoRA Serving","c":"Inference Engineering"},{"href":"../ml-maths-course/index.html#l07-07","t":"Singular Values as Matrix Stretch","c":"ML Maths"}]},{"id":"lstm","kind":"paper","group":"Sequence models and embeddings","title":"Long Short-Term Memory","authors":"Hochreiter & Schmidhuber","year":1997,"url":"https://doi.org/10.1162/neco.1997.9.8.1735","blurb":"Adds a gated, additively updated memory cell to recurrent networks so error signals can flow across long time lags.","intro":"The LSTM keeps a cell state that is updated additively and protected by multiplicative gates: input and output gates in the original paper, and the forget gate added by Gers et al. in 2000, which every modern LSTM includes. The steps build the gates, a single cell forward and backward, and a bidirectional LSTM; the capstone evaluates an LSTM language model over a padded batch.","steps":[{"name":"Stable sigmoid (the gate nonlinearity)","problem":"sigmoid-stable"},{"name":"LSTM cell: forward and backward","problem":"lstm-cell"},{"name":"Bidirectional LSTM over a padded batch","problem":"lstm-cell-2"},{"name":"Perplexity with a padding mask","problem":"perplexity-computation"},{"name":"Gradient clipping","problem":"gradient-clipping"}],"capstone":"lstm-language-model-loss","lessons":["dlcore:05.02"],"lesson_links":[{"href":"../deep-learning/index.html#l05-02","t":"LSTMs and GRUs","c":"Deep Learning"}]},{"id":"mamba","kind":"paper","group":"Sequence models and embeddings","title":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","authors":"Gu and Dao","year":2023,"url":"https://arxiv.org/abs/2312.00752","blurb":"Made state-space models input-dependent so they can select what to remember, matching transformers on language modelling with linear-time training and constant-memory decoding.","intro":"A state-space layer updates a fixed-size hidden state with a linear recurrence. Mamba makes the step size and the input and output projections depend on the current token, which lets the model hold or discard information by content, and computes the recurrence with a hardware-aware parallel scan. The steps build the recurrent and parallel views of linear attention, the selective scan and its Mamba-2 simplification; the capstone is the full gated Mamba block with its causal convolution.","steps":[{"name":"Linear attention: parallel and recurrent forms","problem":"parallel-and-recurrent-linear-attention","note":"The closest attention relative: a fixed-size state updated per token."},{"name":"Selective scan (S6)","problem":"selective-ssm-scan"},{"name":"Mamba-2 gated state scan","problem":"mamba-2-gated-state-scan","note":"The follow-up's scalar-decay form, which links SSMs back to attention."}],"capstone":"mamba-block-forward","lessons":[],"lesson_links":[]},{"id":"pagedattention","kind":"paper","group":"Efficient inference","title":"Efficient Memory Management for Large Language Model Serving with PagedAttention","authors":"Kwon et al.","year":2023,"url":"https://arxiv.org/abs/2309.06180","blurb":"Applied virtual-memory paging to the KV cache, nearly eliminating memory waste in LLM serving and enabling the vLLM engine's large throughput gains.","intro":"Each sequence's keys and values are stored in fixed-size blocks allocated on demand from a shared pool, with a block table translating logical positions to physical blocks. That removes the over-reservation and fragmentation of contiguous allocation, lets sequences share prefix blocks with copy-on-write, and lets the scheduler batch many more requests. The steps build the block allocator, capacity planning, attention over a paged cache, prefix caching and a continuous-batching scheduler; the capstone runs a paged decode loop that appends, allocates and attends.","steps":[{"name":"KV-cache capacity in blocks","problem":"plan-kv-cache-capacity"},{"name":"Block allocator with copy-on-write","problem":"pagedattention-block-allocation"},{"name":"Attention over a paged cache","problem":"paged-kv-cache-gather"},{"name":"Prefix caching","problem":"prefix-cache-matching-and-reuse"},{"name":"Continuous batching","problem":"simulate-continuous-batching","note":"The scheduling that paging makes practical."}],"capstone":"paged-attention-decode-loop","lessons":["ieng:08.01","ieng:08.03","ieng:08.04","ieng:14.05"],"lesson_links":[{"href":"../inference-eng-course/index.html#l08-01","t":"Why Contiguous KV Allocation Breaks","c":"Inference Engineering"},{"href":"../inference-eng-course/index.html#l08-03","t":"PagedAttention","c":"Inference Engineering"},{"href":"../inference-eng-course/index.html#l08-04","t":"Allocate, Share & Reclaim KV Blocks","c":"Inference Engineering"},{"href":"../inference-eng-course/index.html#l14-05","t":"Paged Attention, FlashInfer & Serving Backends","c":"Inference Engineering"}]},{"id":"ppo","kind":"paper","group":"Reinforcement learning and alignment","title":"Proximal Policy Optimization Algorithms","authors":"Schulman et al.","year":2017,"url":"https://arxiv.org/abs/1707.06347","blurb":"Got most of the stability of trust-region policy optimisation with a simple clipped objective that allows several epochs of minibatch updates per rollout.","intro":"PPO alternates between collecting a rollout and optimising a surrogate objective on it for several epochs. Clipping the probability ratio between the new and old policies stops each update from moving the policy too far from the one that collected the data. Advantages come from generalised advantage estimation with a learned value function, trained jointly with an entropy bonus. The steps build discounted returns, GAE, the actor-critic loss and the clipped surrogate; the capstone is the full multi-epoch update.","steps":[{"name":"Discounted returns","problem":"discounted-returns"},{"name":"Generalised advantage estimation","problem":"gae-advantages"},{"name":"Actor-critic loss with entropy","problem":"actor-critic-a2c-loss-with-entropy"},{"name":"Clipped surrogate objective","problem":"ppo-clipped-surrogate-objective"}],"capstone":"ppo-update-epochs","lessons":["air-fanout-v1:07.04","dlcore:08.06"],"lesson_links":[{"href":"../ai-research-track-web/index.html#l07-04","t":"PPO, LLM Reasoning, Importance Ratio, Advantage","c":"AI Research"},{"href":"../deep-learning/index.html#l08-06","t":"Actor-critic methods","c":"Deep Learning"}]},{"id":"resnet","kind":"paper","group":"Convolutional networks","title":"Deep Residual Learning for Image Recognition","authors":"He et al.","year":2015,"url":"https://arxiv.org/abs/1512.03385","blurb":"Made very deep networks trainable by having each block learn a residual added to an identity shortcut, winning ImageNet 2015 with 152 layers.","intro":"A residual block computes $x + F(x)$, so its default behaviour is the identity and gradients have a direct path through every block. When a block changes resolution or width, the shortcut becomes a strided 1×1 projection. The steps build convolution, batch norm, pooling and both block types; the capstone stacks a stem, residual stages, global average pooling and a classifier.","steps":[{"name":"Strided, padded convolution","problem":"2d-convolution"},{"name":"Batch normalisation (train and eval)","problem":"batch-normalization"},{"name":"He initialisation","problem":"weight-initialization","note":"The initialisation the same authors derived for ReLU networks."},{"name":"Max pooling","problem":"max-pool-2d"},{"name":"Basic block with a projection shortcut","problem":"resnet-residual-block"},{"name":"Bottleneck block","problem":"residual-block","note":"The 1×1, 3×3, 1×1 block used in ResNet-50 and deeper."},{"name":"Global average pooling","problem":"adaptive-average-pool-2d"}],"capstone":"resnet-tiny-forward","lessons":["dlcore:03.04","dlcore:02.01"],"lesson_links":[{"href":"../deep-learning/index.html#l03-04","t":"Residual networks","c":"Deep Learning"},{"href":"../deep-learning/index.html#l02-01","t":"Batch normalisation","c":"Deep Learning"}]},{"id":"rope","kind":"paper","group":"Transformers and LLMs","title":"RoFormer: Enhanced Transformer with Rotary Position Embedding","authors":"Su et al.","year":2021,"url":"https://arxiv.org/abs/2104.09864","blurb":"Encoded position by rotating query and key vectors, so attention scores depend only on relative offsets; now the default in most open LLMs.","intro":"RoPE splits each query and key into 2-D pairs and rotates pair $i$ by angle $m\\theta_i$ at position $m$. The dot product of a rotated query and key then depends on their positions only through $m - n$, giving relative position information with no extra parameters and no change to the attention kernel. The steps build RoPE in both memory layouts, at arbitrary positions, on a subset of dimensions, for ragged decode batches and for multimodal inputs; the capstone computes attention scores with the frequency rescalings used to extend context length.","steps":[{"name":"RoPE in both layouts","problem":"rotary-position-embedding-rope","note":"Interleaved pairs versus split halves: same maths, different weights."},{"name":"RoPE at arbitrary positions","problem":"rotary-position-embedding"},{"name":"Partial rotary embeddings","problem":"rotary-query-and-key-embeddings"},{"name":"RoPE during decoding","problem":"rotary-position-embeddings-for-decoding"},{"name":"Multimodal RoPE coordinates","problem":"assign-multimodal-rope-coordinates"}],"capstone":"rope-scores-with-context-extension","lessons":["aieng:04.01"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l04-01","t":"Positional embeddings","c":"AI Engineering"}]},{"id":"seq2seq","kind":"paper","group":"Sequence models and embeddings","title":"Sequence to Sequence Learning with Neural Networks","authors":"Sutskever, Vinyals & Le","year":2014,"url":"https://arxiv.org/abs/1409.3215","blurb":"Showed that a deep LSTM encoder and decoder can translate end to end, with source reversal and beam search as key tricks.","intro":"One LSTM reads the source (reversed) into a fixed-size state; a second LSTM, initialised with that state, generates the translation one token at a time, and beam search picks the output. The steps build the LSTM cell, batching and teacher-forced training, and beam search; the capstone translates with the full pipeline.","steps":[{"name":"LSTM cell","problem":"lstm-cell"},{"name":"Pad and truncate a batch","problem":"padding-and-truncation"},{"name":"Encoder-decoder with teacher forcing","problem":"sequence-to-sequence-forward-pass"},{"name":"LSTM language model loss","problem":"lstm-language-model-loss"},{"name":"Beam search with length normalisation","problem":"beam-search-decoding"}],"capstone":"seq2seq-lstm-beam-translate","lessons":["dlcore:05.03"],"lesson_links":[{"href":"../deep-learning/index.html#l05-03","t":"Sequence-to-sequence and attention","c":"Deep Learning"}]},{"id":"speculative-decoding","kind":"paper","group":"Efficient inference","title":"Fast Inference from Transformers via Speculative Decoding","authors":"Leviathan, Kalman and Matias","year":2022,"url":"https://arxiv.org/abs/2211.17192","blurb":"Sped up sampling from large language models two to three times, with an identical output distribution, by verifying a small model's guesses in parallel.","intro":"Decoding is memory-bound, so scoring several positions costs the large model about as much as scoring one. A small draft model proposes a few tokens, the target model scores them all in one pass, and a modified rejection-sampling rule accepts a prefix and corrects the first mismatch so the output follows the target distribution exactly. The steps build ordinary sampling, the acceptance test and residual resampling in numpy and JAX; the capstone runs the complete draft-verify loop with two bigram models.","steps":[{"name":"Temperature, top-k and top-p sampling","problem":"text-generation-sampling"},{"name":"Exact speculative sampling","problem":"perform-exact-speculative-sampling"},{"name":"Verifying draft tokens","problem":"speculative-decoding-and-token-verification"},{"name":"Accept, reject and resample in JAX","problem":"speculative-decoding-acceptance"}],"capstone":"speculative-decoding-loop","lessons":["aieng:07.04","ieng:16.02","ieng:16.03"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l07-04","t":"Speculative decoding","c":"AI Engineering"},{"href":"../inference-eng-course/index.html#l16-02","t":"Draft Models, Target Models & Parallel Verification","c":"Inference Engineering"},{"href":"../inference-eng-course/index.html#l16-03","t":"Acceptance, Rejection & Draft Length","c":"Inference Engineering"}]},{"id":"switch-transformer","kind":"paper","group":"Transformers and LLMs","title":"Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity","authors":"Fedus, Zoph and Shazeer","year":2021,"url":"https://arxiv.org/abs/2101.03961","blurb":"Simplified mixture-of-experts to top-1 routing with fixed expert capacity and a load-balancing loss, scaling parameter count far beyond compute.","intro":"Each token's feed-forward computation goes to one of many experts chosen by a learned router, so parameters grow with the number of experts while FLOPs per token stay fixed. Static shapes force a capacity per expert, which means some tokens can be dropped, and an auxiliary loss keeps the router from collapsing onto a few experts. The steps build routing with load statistics, dispatch and combine, and the communication pattern of expert parallelism; the capstone is a full Switch layer.","steps":[{"name":"Top-k routing with load statistics","problem":"sparse-moe-top-k-expert-routing"},{"name":"Capacity-limited routing with balance and z-losses","problem":"top-k-moe-router-with-load-statistics","note":"The router z-loss comes from the follow-up ST-MoE paper."},{"name":"Dispatch and weighted combine","problem":"moe-token-dispatch-and-expert-aggregation"},{"name":"Expert parallelism across devices","problem":"expert-parallel-routing-across-gpus"}],"capstone":"switch-ffn-layer-top1","lessons":["aieng:06.02","ieng:19.02","ieng:19.04"],"lesson_links":[{"href":"../ai-engineering-course/index.html#l06-02","t":"Mixture of experts","c":"AI Engineering"},{"href":"../inference-eng-course/index.html#l19-02","t":"Token Routing & Expert Activation","c":"Inference Engineering"},{"href":"../inference-eng-course/index.html#l19-04","t":"Load Imbalance & Hot Experts","c":"Inference Engineering"}]},{"id":"tiny-recursive-model","kind":"paper","group":"Sequence models and embeddings","title":"Less is More: Recursive Reasoning with Tiny Networks","authors":"Jolicoeur-Martineau","year":2025,"url":"https://arxiv.org/abs/2510.04871","blurb":"A two-layer network applied recursively to a latent scratchpad and an answer, trained with deep supervision, beats much larger models on Sudoku, mazes and ARC-AGI puzzles.","intro":"TRM simplifies the earlier Hierarchical Reasoning Model to one tiny network and three nested loops: latent recursion (update the scratchpad $z$ several times, then the answer $y$), deep recursion (repeat that, backpropagating only through the last pass), and deep supervision (repeat the whole thing with a loss each time and a learned halting signal). The steps review the small pieces it reuses; the capstone runs the full supervision loop.","steps":[{"name":"MLP forward pass","problem":"multi-layer-perceptron-forward-pass"},{"name":"RMSNorm and a gated MLP","problem":"norm-gated-linear-transform","note":"The block TRM's tiny network is made of."},{"name":"Cross-entropy from logits","problem":"cross-entropy-logits"},{"name":"Binary cross-entropy for the halting head","problem":"log-loss-binary-cross-entropy"},{"name":"Early stopping logic","problem":"early-stopping"}],"capstone":"tiny-recursive-model-supervision","lesson_links":[]},{"id":"u-net","kind":"paper","group":"Convolutional networks","title":"U-Net: Convolutional Networks for Biomedical Image Segmentation","authors":"Ronneberger, Fischer & Brox","year":2015,"url":"https://arxiv.org/abs/1505.04597","blurb":"An encoder-decoder with skip connections at every resolution that produces precise per-pixel segmentations from very few training images.","intro":"U-Net contracts the image with convolutions and pooling, expands it again with up-convolutions, and at each level concatenates the encoder's feature map into the decoder so fine detail survives. The original uses unpadded convolutions (hence cropping) and a weighted loss that separates touching cells. The steps build each operation and a one-level U-Net; the capstone is the original valid-convolution design with its weighted loss.","steps":[{"name":"Convolution","problem":"2d-convolution"},{"name":"Max pooling","problem":"max-pool-2d"},{"name":"Transposed convolution (up-convolution)","problem":"transposed-convolution"},{"name":"Centre crop","problem":"zero-pad-and-center-crop"},{"name":"Skip connection: upsample, align, concatenate","problem":"u-net-skip-connection"},{"name":"A one-level U-Net forward pass","problem":"tiny-u-net-forward-pass"},{"name":"Segmentation metrics","problem":"mean-iou-for-segmentation"}],"capstone":"u-net-valid-conv-segmentation","lessons":["dlcore:03.01","dlcore:03.02"],"lesson_links":[{"href":"../deep-learning/index.html#l03-01","t":"Convolution","c":"Deep Learning"},{"href":"../deep-learning/index.html#l03-02","t":"Pooling and downsampling","c":"Deep Learning"}]},{"id":"vae","kind":"paper","group":"Generative models","title":"Auto-Encoding Variational Bayes","authors":"Kingma and Welling","year":2013,"url":"https://arxiv.org/abs/1312.6114","blurb":"Trained a latent-variable generative model with ordinary backpropagation by maximising a lower bound on the likelihood and rewriting the sampling step so gradients pass through it.","intro":"An encoder maps each input to a Gaussian over latents, a decoder maps a latent back to a distribution over inputs, and the loss is the negative evidence lower bound: reconstruction error plus the KL divergence from the encoder's Gaussian to the prior. Sampling $z = \\mu + \\sigma\\epsilon$ with fixed noise $\\epsilon$ makes the whole thing differentiable. The steps build the autoencoder, the reparameterised sample, the closed-form KL and the reconstruction loss; the capstone runs one full training step with gradients derived by hand.","steps":[{"name":"Plain autoencoder","problem":"autoencoder-forward-pass","note":"The deterministic version the VAE adds noise and a prior to."},{"name":"The reparameterisation trick","problem":"reparameterized-gaussian-sample"},{"name":"KL divergence to a standard normal","problem":"diagonal-gaussian-kl-divergence"},{"name":"Bernoulli reconstruction loss","problem":"log-loss-binary-cross-entropy"},{"name":"VAE forward pass and ELBO","problem":"variational-autoencoder-forward-pass"}],"capstone":"vae-training-step","lessons":["dlcore:07.01"],"lesson_links":[{"href":"../deep-learning/index.html#l07-01","t":"Autoencoders and VAEs","c":"Deep Learning"}]},{"id":"vgg","kind":"paper","group":"Convolutional networks","title":"Very Deep Convolutional Networks for Large-Scale Image Recognition","authors":"Simonyan & Zisserman","year":2014,"url":"https://arxiv.org/abs/1409.1556","blurb":"Showed that depth built from nothing but stacked 3×3 convolutions and 2×2 pooling steadily improves image classification.","intro":"VGG networks are described by a single configuration list of convolution widths and pooling layers, followed by three fully connected layers. The steps cover the 3×3 convolution, the VGG block, pooling, initialisation and dropout in the classifier; the capstone builds any VGG variant from its list and counts its parameters.","steps":[{"name":"Convolution with padding","problem":"2d-convolution"},{"name":"VGG block: stacked 3×3 convs, then pool","problem":"vgg-convolution-block"},{"name":"Max pooling","problem":"max-pool-2d"},{"name":"Initialisation for deep ReLU stacks","problem":"weight-initialization"},{"name":"Dropout in the classifier","problem":"dropout"}],"capstone":"vgg-from-config","lessons":["dlcore:03.03","dlcore:03.01"],"lesson_links":[{"href":"../deep-learning/index.html#l03-03","t":"Classic CNNs: LeNet, AlexNet, VGG","c":"Deep Learning"},{"href":"../deep-learning/index.html#l03-01","t":"Convolution","c":"Deep Learning"}]},{"id":"vision-transformer","kind":"paper","group":"Transformers and LLMs","title":"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale","authors":"Dosovitskiy et al.","year":2020,"url":"https://arxiv.org/abs/2010.11929","blurb":"Classifies images with an almost unmodified Transformer encoder by treating fixed-size image patches as tokens.","intro":"ViT's only image-specific component is the patch embedding: cut the image into $P \\times P$ patches, flatten each, and project it to the model width. A learned `[CLS]` token and a learned position table are added, a pre-LN encoder runs over the sequence, and a linear head reads `[CLS]`. The steps build the input side and the attention sublayer; the capstone runs the full model from pixels to logits.","steps":[{"name":"Cut an image into patches","problem":"reshaping-arrays"},{"name":"Patch embedding with a class token","problem":"vit-patchify"},{"name":"Projection, class token and positions","problem":"vision-transformer-patch-embedding"},{"name":"2-D position embeddings (alternative)","problem":"2d-sinusoidal-positional-embedding","note":"The paper found 1-D learned positions work as well; this is the fixed 2-D variant later models use."},{"name":"Pre-norm self-attention sublayer","problem":"vit-multi-head-self-attention"},{"name":"Encoder block","problem":"transformer-encoder-block"}],"capstone":"vit-classifier-forward","lessons":["dlcore:04.05"],"lesson_links":[{"href":"../deep-learning/index.html#l04-05","t":"Vision Transformers","c":"Deep Learning"}]},{"id":"word2vec","kind":"paper","group":"Sequence models and embeddings","title":"Distributed Representations of Words and Phrases and their Compositionality","authors":"Mikolov et al.","year":2013,"url":"https://arxiv.org/abs/1310.4546","blurb":"Learns word vectors by predicting context words, made fast with negative sampling and subsampling of frequent words.","intro":"The skip-gram model learns one input vector and one output vector per word so that a word's input vector predicts the output vectors of its neighbours. A full softmax over the vocabulary is too slow, so the paper replaces it with negative sampling: a logistic loss that separates the true context from a few words drawn from a flattened unigram distribution. The steps build the vocabulary, the training data, the loss and the evaluation; the capstone runs a full SGD epoch.","steps":[{"name":"Build a vocabulary","problem":"vocabulary-building"},{"name":"Subsampling, dynamic windows and the noise distribution","problem":"word2vec-training-pairs"},{"name":"One negative-sampling update","problem":"word2vec","note":"The gradient of the SGNS loss for a single pair."},{"name":"Repeated ids in embedding gradients","problem":"fancy-indexing"},{"name":"Nearest neighbours in the learned space","problem":"embedding-similarity"}],"capstone":"word2vec-sgns-epoch","lessons":["dlcore:06.04"],"lesson_links":[{"href":"../deep-learning/index.html#l06-04","t":"Word embeddings","c":"Deep Learning"}]},{"id":"yolo","kind":"paper","group":"Vision and detection","title":"You Only Look Once: Unified, Real-Time Object Detection","authors":"Redmon et al.","year":2015,"url":"https://arxiv.org/abs/1506.02640","blurb":"Framed detection as one regression from the image to a grid of boxes and class probabilities, running in real time with a single network pass.","intro":"YOLO divides the image into a grid; each cell predicts a few boxes with confidences and one class distribution, and everything is trained with a weighted sum-squared loss. At test time, class-specific scores are thresholded and duplicates removed with non-maximum suppression. The steps build IoU, box encodings, NMS and a modern box-regression loss; the capstone is the YOLO v1 training loss.","steps":[{"name":"IoU between box sets","problem":"iou-matrix"},{"name":"Box encoding and decoding","problem":"box-encode-and-decode"},{"name":"Non-maximum suppression","problem":"non-maximum-suppression"},{"name":"Generalised IoU loss","problem":"generalized-iou-loss","note":"What later YOLO versions use instead of squared error on coordinates."}],"capstone":"yolo-v1-loss","lessons":["dlcore:04.02","dlcore:04.03"],"lesson_links":[{"href":"../deep-learning/index.html#l04-02","t":"Object detection basics","c":"Deep Learning"},{"href":"../deep-learning/index.html#l04-03","t":"Detection losses and matching","c":"Deep Learning"}]}];                      // paper implementations and projects (src/builds/*.json)

function inl(s){
  const math = []; s = String(s).replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { math.push(m); return `\u0000${math.length - 1}\u0000`; });
  s = esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => esc(math[+i]));
}

function render(src){
  const lines = String(src).split('\n'); let out = '', i = 0;
  // Indented lines right after a list item belong to it: nested lists or continuation text, rendered recursively.
  const sub = () => { const b = []; while (i < lines.length && /^\s{2,}\S/.test(lines[i])){ b.push(lines[i].replace(/^\s{2,4}/, '')); i++; } return b.length ? render(b.join('\n')) : ''; };
  while (i < lines.length){
    const L = lines[i];
    if (!L.trim()){ i++; continue; }
    if (L.startsWith('## ')){ out += `<h2>${inl(L.slice(3))}</h2>`; i++; continue; }
    if (L.startsWith('- ')){ out += '<ul>'; while (i < lines.length && lines[i].startsWith('- ')){ out += `<li>${inl(lines[i].slice(2))}`; i++; out += sub() + '</li>'; } out += '</ul>'; continue; }
    if (L.startsWith('```')){ const c = []; i++; while (i < lines.length && !lines[i].startsWith('```')){ c.push(lines[i]); i++; } i++; out += `<pre class="code">${esc(c.join('\n'))}</pre>`; continue; }
    if (/^\d+\. /.test(L)){ out += '<ol>'; while (i < lines.length && /^\d+\. /.test(lines[i])){ out += `<li>${inl(lines[i].replace(/^\d+\. /,''))}`; i++; out += sub() + '</li>'; } out += '</ol>'; continue; }
    if (L.startsWith('> ')){ out += `<div class="take"><div class="lab">Key takeaway</div><p>${inl(L.slice(2))}</p></div>`; i++; continue; }
    if (L.startsWith('|')){ out += '<div class="tbl"><table>';             // GFM tables; the |---| separator row is skipped
      while (i < lines.length && lines[i].startsWith('|')){ const r = lines[i].trim(); i++; if (/^\|[\s:|-]+\|?$/.test(r)) continue;
        out += '<tr>' + r.replace(/^\|\s*/, '').replace(/\s*\|$/, '').split(/\s+\|\s+/).map(c => `<td>${inl(c)}</td>`).join('') + '</tr>'; }
      out += '</table></div>'; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(## |- |> |\||\d+\. |```)/.test(lines[i])){ p.push(lines[i]); i++; }
    out += `<p>${inl(p.join(' '))}</p>`;
  }
  return out;
}

async function quizPage(arg){

  const qs = (q.sections.find(x => x.section === sec.name) || {}).questions || [], k = `${pid}:${si}`, best = st.quiz[k];
  $('#view').innerHTML = `<div class="rv" style="max-width:760px">
    <div class="lab">${esc(pl.title)} · Section ${+si + 1}</div>

    <form id="qz">${qs.map((x, i) => `<fieldset class="card blk qq" data-i="${i}" style="margin-top:14px;border:1px solid var(--line)"><legend class="lab" style="padding:0 6px">Question ${i + 1}</legend>
      <p class="q" style="font-size:17px">${inl(x.q)}</p>${x.options.map((o, j) => `<label style="display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer" data-j="${j}"><input type="radio" name="q${i}" value="${j}" style="margin-top:5px"><span>${inl(o)}</span></label>`).join('')}
      <div class="why" hidden></div></fieldset>`).join('')}
    <div class="done-zone" style="margin-top:24px"><button type="submit" class="btn">Check answers</button><p><a href="#plan-${pl.id}">← Back to the plan</a></p></div></form></div>`;
  math($('#view'));

      f.querySelectorAll('label').forEach(l => { const j = +l.dataset.j; l.style.background = j === x.answer ? 'var(--go-soft)' : (pick && j === +pick.value ? 'var(--bad-soft)' : ''); });

}

// ---------- runner: one Web Worker, killed and respawned on timeout ----------
const RUN = {w: null, ready: null, cb: null};
function boot(){
  if (RUN.w) return RUN.ready;
  RUN.w = new Worker('runner.js');
  RUN.ready = new Promise((res, rej) => {
    RUN.w.onmessage = e => { const m = e.data; if (m.type === 'ready') res(); else if (m.type === 'status') RUN.cb?.status(m.text); else RUN.cb?.done(m); };
    RUN.w.onerror = e => { RUN.w = null; rej(new Error(e.message || 'Python failed to start')); };
  });
  return RUN.ready;
}
function exec(p, code, tests){
  return new Promise(async res => {
    const say = s => { const r = $('#res'); if (r) r.innerHTML = `<span class="st">${esc(s)}</span>`; };
    say(RUN.w ? 'Running…' : 'Starting Python (first run downloads ~10 MB)…');
    try { await boot(); } catch(e){ return res({error: String(e.message)}); }
    let timer;
    const arm = ms => { clearTimeout(timer); timer = setTimeout(() => { RUN.w.terminate(); RUN.w = null; RUN.cb = null; res({error: `Time limit: still running after ${ms / 1000} s. Look for an infinite loop or a very slow step.`}); }, ms); };
    RUN.cb = {status: s => { say(s); arm(90000); }, done: m => { clearTimeout(timer); RUN.cb = null; res(m); }};
    say('Running…'); arm(10000);
    RUN.w.postMessage({id: p.id, code, fn: p.fn, tests, runtime: p.rt, pkgs: p.pkgs, tol: p.tol});
  });
}
let busy = false;
async function go(p, l, all){
  if (busy || !ed) return; busy = true;
  const k = key(l.id), code = ed.getValue(); st.code[k] = code; lsSet();
  ['run', 'submit'].forEach(id => $('#' + id) && ($('#' + id).disabled = true));
  const tests = all ? p.tj : p.tj_ex;   // JSON text: keeps 3.0 a float
  const r = await exec(p, code, tests);
  busy = false; ['run', 'submit'].forEach(id => $('#' + id) && ($('#' + id).disabled = false));
  if (cur.k !== k) return;
  const box = $('#res'); if (!box) return;
  const out = r.stdout ? `<div class="lab" style="margin-top:12px">Printed output</div><pre>${esc(r.stdout.slice(0, 4000))}</pre>` : '';
  if (r.error){ box.innerHTML = `<div class="sum no">Error</div><pre>${esc(r.error)}</pre>${out}`; return; }
  const ok = r.results.filter(x => x.ok).length, n = r.results.length, pass = ok === n;
  const rows = r.results.map((x, i) => {
    if (x.ok) return all ? '' : `<div class="t good"><span class="k">✓</span><span class="v">Example ${i+1} passed</span></div>`;
    return `<div class="t bad"><span class="k">✗</span><span class="v">${all && i >= p.nex ? 'Hidden test' : 'Example'} ${i+1}</span>
      ${x.inp ? `<span class="k">input</span><span class="v">${esc(x.inp)}</span>` : ''}
      <span class="k">why</span><span class="v">${esc(x.why)}</span>${x.got ? `<span class="k">got</span><span class="v">${esc(x.got)}</span>` : ''}</div>`;
  }).join('');
  box.innerHTML = `<div class="sum ${pass ? 'ok' : 'no'}">${pass ? CHECK : ''}${all ? (pass ? `All ${n} tests passed` : `${ok} / ${n} tests passed`) : (pass ? `Examples pass (${n}/${n}). Now Submit.` : `${ok} / ${n} examples pass`)}</div>${rows}${out}`;
  if (all && pass) solved(l, p);
}
function solved(l, p){
  const k = key(l.id), before = xp(), was = isDone(l.id);
  if (!was){
    st.done[k] = true; st.at[k] = now();
    if (!st.sol[k]) st.grades[k] = {g: DG[p.d], at: now()};
    st.rev[k] = {box: 0, due: addDays(today(), BOX[0]), n: 0};
    lsSet(); confetti(90); award(xp() - before, 'Problem solved', before);
    const m = DATA.find(x => x.n === l.mod);
    if (modDone(m) === m.lessons.length) setTimeout(() => { toast(`<b>${esc(m.name)}</b> topic cleared`, true); confetti(240); }, 450);
    else if (todaySolved() === GOAL) setTimeout(() => toast('<b>Goal</b> Daily goal reached'), 600);
  } else if (st.rev[k]?.due && st.rev[k].due <= today()){
    const r = st.rev[k], b = Math.min((r.box || 0) + 1, BOX.length - 1);
    st.rev[k] = {box: b, due: addDays(today(), BOX[b]), n: (r.n || 0) + 1, at: now()};
    bump(); award(5, `Reviewed · back in ${BOX[b]} days`, before);
  } else { toast('Solved again'); return; }
  rerender();
}

  q = q.toLowerCase().trim();
  const hits = ALL.filter(l => !q || (l.t + ' ' + l.tags.join(' ') + ' ' + l.rt).toLowerCase().includes(q)).slice(0, 12);
  $('#palres').innerHTML = hits.map((l, i) => `<a href="#l${key(l.id)}" class="${i===0?'on':''}"><span class="id">${l.d}</span><span class="tt"><b>${esc(l.t)}</b><span>${esc(l.tags.join(' · '))} · ${RT[l.rt] || l.rt}</span></span></a>`).join('') || '<div style="padding:16px;color:var(--muted)">No matches</div>';
}
$('#sbtn').onclick = openPal;
$('#pal').onclick = e => { if (e.target.id === 'pal' || e.target.closest('a')) closePal(); };
$('#palin').oninput = e => palRender(e.target.value);
$('#palin').onkeydown = e => { if (e.key === 'Enter'){ const a = $('#palres a.on') || $('#palres a'); if (a){ location.hash = a.getAttribute('href'); closePal(); } } if (e.key === 'Escape') closePal(); };
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPal(); }
  else if (e.key === 'Escape') closePal();
});

// ---------- toasts, confetti (as in the courses) ----------
function toast(html, big){ const t = document.createElement('div'); t.className = 'toast' + (big ? ' big' : ''); t.innerHTML = html; $('#toasts').appendChild(t); setTimeout(() => t.remove(), big ? 3200 : 2200); }
function confetti(n){
  if (RM) return; const cv = $('#cf'), x = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#C03A73', '#8A9573', '#1B9EA6', '#DBA292', '#F1CF4E', '#B66DD0', '#272727'];
  const ps = Array.from({length: n}, () => ({x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .62, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, s: Math.random() * 6 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)]}));
  let f = 0; (function tick(){ x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .42; p.vx *= .985; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); });
    if (++f < 130) requestAnimationFrame(tick); else x.clearRect(0, 0, cv.width, cv.height); })();
}

// ---------- routing ----------
function route(){
  const h = location.hash.slice(1);
  ed = null;
  if (h === 'all'){ cur = {page: 'all', mod: null, k: null}; allPage(); }
  else if (h === 'review'){ cur = {page: 'review', mod: null, k: null}; reviewPage(); }
  else if (h === 'plans'){ cur = {page: 'plans', mod: null, k: null}; plansPage(); }
  else if (h === 'papers' || h === 'projects'){ cur = {page: h, mod: null, k: null}; buildsPage(h.slice(0, -1)); }
  else if (h.startsWith('build-')){ const b = BUILDS.find(x => x.id === h.slice(6)); cur = {page: b && b.kind === 'project' ? 'projects' : 'papers', mod: null, k: null}; buildPage(h.slice(6)); }
  else if (h.startsWith('quiz-')){ cur = {page: 'plans', mod: null, k: null}; quizPage(h.slice(5)); }
  else if (h === 'interview'){ cur = {page: 'interview', mod: null, k: null}; roundsPage(); }
  else if (h.startsWith('round-')){ cur = {page: 'interview', mod: null, k: null}; roundPage(h.slice(6)); }
  else if (h.startsWith('plan-')){ cur = {page: 'plans', mod: null, k: null}; planPage(h.slice(5)); }
  else if (/^t\d\d$/.test(h)){ cur = {page: 'topic', mod: h.slice(1), k: null}; topicPage(h.slice(1)); }
  else if (/^l[a-z0-9-]+$/.test(h) && ALL.some(l => key(l.id) === h.slice(1))){
    const k = h.slice(1), l = ALL.find(x => key(x.id) === k);
    cur = {page: daily().id === l.id ? 'daily' : 'problem', mod: l.mod, k}; chrome(); return problemPage(k);
  }
  else { cur = {page: 'home', mod: null, k: null}; home(); }
  chrome();
}
// Re-draw in place (after a hint, a reveal, a solve): keep the editor text, the results panel and the scroll position.
function rerender(){
  const y = scrollY, k = cur.k, res = $('#res')?.innerHTML;
  if (ed && k){ st.code[k] = ed.getValue(); lsSet(); }
  Promise.resolve(route()).then(() => { if (k && cur.k === k && res && $('#res')) $('#res').innerHTML = res; scrollTo(0, y); });
}
let lastHash = location.hash;
addEventListener('hashchange', () => { route(); if (location.hash !== lastHash) scrollTo(0, 0); lastHash = location.hash; });
route();
addEventListener('load', () => math($('#view')));   // KaTeX loads deferred: pages drawn before it get rendered here
</script>
