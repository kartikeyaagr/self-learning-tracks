<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hands-on ML, AI and math coding problems with tests, hints and full solutions. Python runs in the browser.">
<meta name="theme-color" content="#F7F7F8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Practice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --panel:#EFEFF1; --side:#FAFAFA; --ink:#272727; --muted:#6E6E6E; --faint:#9C9CA3;
  --line:#E8E8EA; --line2:#C9C9CF; --accent:#C03A73; --accent-ink:#FFFFFF; --accent-soft:#FCEEF4; --accent-line:#F1C6D8;
  --go:#2F8A5F; --go-soft:#E7F5EE; --go-line:#ABD3C1; --flame:#C8643A; --flame-soft:#FBEFE8; --gold:#9A7414; --gold-soft:#FFF8ED;
  --bad:#B9524A; --bad-soft:#FBEDEB; --paper:#FFF8ED; --paper-line:#EADDBE; --kraft:#5F5647;
  --btn-a:#272727; --btn-b:#272727; --btn-ink:#FFFFFF; --btn-edge:#272727;
  --shadow:rgba(59,59,59,.09) 0 1px 2px, rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.01) 0 0 0 1px;
  --lift:rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.09) 0 4px 8px, rgba(59,59,59,.1) 0 8px 16px, rgba(59,59,59,.01) 0 0 0 1px;
  --dg-sh:#272727; --dot:rgba(39,39,39,.08); --strip:#272727; --strip-ink:#F4F4F5;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --num:"Geist", system-ui, sans-serif;
  --pix:"Pixelify Sans", "Geist Mono", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#F28DB8; --accent-ink:#2A0A18; --accent-soft:#2E1621; --accent-line:#4F2638;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#F28DB8; --accent-ink:#2A0A18; --accent-soft:#2E1621; --accent-line:#4F2638;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.lab{font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
#readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:700;letter-spacing:-.03em;font-size:17px;white-space:nowrap}
.brand b{font-family:var(--pix);font-weight:500;color:var(--accent);letter-spacing:0}
.ibtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
#crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--muted);margin-left:8px}
#crumbs a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#crumbs a:hover{color:var(--ink)}
#crumbs .sep{color:var(--line2)}
.grow{flex:1}
.sbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;min-width:220px}
.sbtn span{flex:1;text-align:left}
kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 13px var(--mono);white-space:nowrap;text-decoration:none}
.chip.st{color:var(--flame)} .chip.st.off{color:var(--faint)}
.chip .lv{font-family:var(--num);font-size:15px;color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:18px 12px 40px;border-right:1px solid var(--line);scrollbar-width:thin}
.side .nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:14.5px;font-weight:500;color:var(--muted)}
.side .nv:hover{background:var(--panel);color:var(--ink)}
.side .nv[aria-current]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.side .nv .cnt{margin-left:auto;font:600 11px var(--mono);background:var(--flame);color:#fff;border-radius:999px;padding:1px 7px}
.side .part{margin:22px 10px 8px;display:flex;justify-content:space-between}
.side .mr{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink)}
.side .mr:hover{background:var(--panel)}
.side .mr .n{font:500 12px var(--mono);color:var(--faint)}
.side .mr .c{font:500 11px var(--mono);color:var(--faint)}
.side .mr.full .c{color:var(--go)}
.side .mr[aria-current]{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600}
.side .mr[aria-current] .n{color:var(--accent)}
.side .ls{margin:4px 0 8px 22px;padding-left:12px;border-left:1px solid var(--line)}
.side .li{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:8px;text-decoration:none;font-size:13.5px;line-height:1.4;color:var(--muted)}
.side .li:hover{color:var(--ink);background:var(--panel)}
.side .li[aria-current]{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.sd{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid var(--line2)}
.sd.on{background:var(--go);border-color:var(--go)}
#scrim{display:none}
main{min-width:0;padding:28px 36px 90px}

/* shared components */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--btn-edge);background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--btn-ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 var(--btn-edge),0 8px 18px -8px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 var(--btn-edge),0 3px 8px -4px rgba(0,0,0,.4)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:0 2px 0 var(--line2)}
.btn.go{background:linear-gradient(180deg,#22B26F,#0F8C52);border-color:#0A6B3E;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0A6B3E,0 8px 18px -8px rgba(15,140,82,.6)}
.btn .xp{font:600 12px var(--mono);padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill.k{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.a{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.ok{background:var(--go-soft);border-color:transparent;color:var(--go)}
.pill.ip{background:var(--flame-soft);border-color:transparent;color:var(--flame)}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:7px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--go)}
.seg i.cur{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:44px 0 14px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.03em}

/* home */
.hero{position:relative;overflow:hidden;padding:52px 48px 48px;min-height:440px;background-color:var(--panel);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.hero .copy{position:relative;z-index:2;max-width:540px}
.hero h1{font-size:clamp(40px,5.6vw,72px);line-height:.98;letter-spacing:-.055em;margin:16px 0 18px;font-weight:700}
.hero h1 .px{font-family:var(--pix);font-weight:500;letter-spacing:-.02em;color:var(--accent)}
.hero p.sub{font-size:18px;color:var(--muted);max-width:470px;margin:0 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.float{position:absolute;z-index:1;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);padding:16px}
.float.f1{right:46px;top:44px;width:310px;transform:rotate(3deg)}
.float.f2{right:280px;top:270px;width:250px;transform:rotate(-5deg);background:#1B1B1E;color:#F4F4F6;border-color:#000}
.float.f3{right:28px;top:236px;width:236px;transform:rotate(-1.5deg)}
.float.f4{right:250px;top:58px;width:200px;transform:rotate(-8deg);background:var(--accent);color:#fff;border-color:transparent}
.float .lab{margin-bottom:8px}
.float.f2 .lab,.float.f4 .lab{color:rgba(255,255,255,.7)}
.float.f2 .seg i{background:rgba(255,255,255,.14)} .float.f2 .seg i.on{background:#3FCB86}
.float.f4 .big{font:700 34px/1 var(--num)}
.float svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 7s ease-in-out infinite}
  .float.f2{animation-delay:-2s}.float.f3{animation-delay:-4s}.float.f4{animation-delay:-5.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .num{font:800 40px/1 var(--num);letter-spacing:-.05em;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}
.stat .num small{font:500 13px var(--mono);color:var(--muted)}
.stat .sub{font-size:13.5px;color:var(--muted)}
.wk{display:flex;gap:6px;margin-top:10px}
.wk span{flex:1;text-align:center;font:500 10px var(--mono);color:var(--faint)}
.wk span i{display:block;height:22px;border-radius:7px;background:var(--panel);margin-bottom:4px;border:1px solid var(--line)}
.wk span i.on{background:var(--flame);border-color:var(--flame)}
.wk span.today{color:var(--ink)}
.ring{position:absolute;right:18px;top:18px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.cont{padding:26px;display:flex;flex-direction:column;gap:12px}
.cont h3{font-size:28px;line-height:1.1;letter-spacing:-.04em;margin:4px 0 0}
.cont ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.cont .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.heat{padding:22px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:16px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.hm i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--card));border-color:transparent}
.hm i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--card));border-color:transparent}
.hm i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--card));border-color:transparent}
.hm i.l4{background:var(--accent);border-color:transparent}
.hm i.fut{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font:500 11px var(--mono);color:var(--faint)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{padding:16px;display:flex;flex-direction:column;gap:8px}
.bdg .ic{width:46px;height:46px;display:grid;place-items:center;font:700 17px var(--num);border-radius:14px;color:#fff;background:linear-gradient(160deg,var(--gold),#C2700A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #9A5806}
.bdg b{font-size:14.5px;letter-spacing:-.01em}
.bdg span{font-size:12.5px;color:var(--muted);line-height:1.35}
.bdg.lock{opacity:.55}
.bdg.lock .ic{background:var(--panel);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line2)}
.parth{display:flex;align-items:baseline;gap:14px;margin:34px 0 12px}
.parth h3{margin:0;font-size:19px;letter-spacing:-.03em}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:18px 18px 16px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.mcard .tp{display:flex;justify-content:space-between;align-items:center}
.mcard .no{font:500 26px/1 var(--mono);letter-spacing:-.04em;color:var(--faint)}
.mcard.done .no{color:var(--go)} .mcard.ip .no{color:var(--accent)}
.mcard h4{margin:4px 0 0;font-size:17px;line-height:1.25;letter-spacing:-.02em}
.mcard .ft{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.foot-note{margin-top:40px;font-size:13px;color:var(--faint);max-width:720px}

/* module page */
.mhead{padding:36px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.mhead h1{font-size:clamp(34px,4.4vw,56px);line-height:1;letter-spacing:-.05em;margin:10px 0 14px}
.mhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.mhead .big{font:500 110px/0.8 var(--mono);letter-spacing:-.08em;color:var(--line2);text-align:right}
.path{position:relative;max-width:760px;margin:36px auto 0;padding:10px 0}
.pnode{position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;margin:0 0 26px;transform:translateX(var(--dx,0))}
.pnode .o{flex:none;position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--num);background:var(--card);border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2);color:var(--muted);transition:transform .1s}
.pnode:hover .o{transform:translateY(-2px)}
.pnode.done .o{background:var(--go);border-color:#0A7A47;color:#fff;box-shadow:0 5px 0 #0A6B3E}
.pnode.cur .o{background:var(--accent);border-color:#0F5FA6;color:#fff;box-shadow:0 5px 0 #0D5290}
.pnode.cur .o::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);opacity:.5}
@media (prefers-reduced-motion:no-preference){.pnode.cur .o::after{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}}
.pnode .t{padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;flex:1;max-width:420px}
.pnode .t b{display:block;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pnode .t span{font:500 11.5px var(--mono);color:var(--muted)}
.pnode.cur .t{border-color:var(--accent)}
.mnav{display:flex;justify-content:space-between;gap:12px;max-width:760px;margin:30px auto 0}

/* lesson page */
.lgrid{display:grid;grid-template-columns:minmax(0,760px) 230px;gap:44px;justify-content:center}
.lhead{padding:28px 32px 26px;margin-bottom:30px}
.lhead .back{font-size:14px;color:var(--muted);text-decoration:none}
.lhead .back:hover{color:var(--ink)}
.lhead .idrow{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.lhead .lid{font:600 20px/1 var(--mono);color:var(--accent)}
.lhead h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.045em;margin:0 0 18px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.lhead .seg{margin-top:20px}
.prose{font-size:17px;line-height:1.72}
.prose>p{margin:0 0 18px}
.prose h2{counter-increment:h;font-size:24px;letter-spacing:-.035em;line-height:1.2;margin:46px 0 14px;display:flex;align-items:baseline;gap:12px}
.prose h2::before{content:counter(h,decimal-leading-zero);font:500 13px var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:7px;transform:translateY(-3px)}
.prose{counter-reset:h fig}
.prose ul,.prose ol{padding-left:22px;margin:0 0 18px}
.prose li{margin:6px 0}
.prose li>p{margin:4px 0}.prose li>ul,.prose li>ol{margin:4px 0 6px}
.prose ul li::marker{color:var(--accent)}
.prose ol li::marker{font:600 14px var(--mono);color:var(--accent)}
.prose code{font:500 .86em var(--mono);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.prose strong{font-weight:650}
.code{font:13.5px/1.6 var(--mono);background:#16161A;color:#E9E9EE;padding:18px 20px;border-radius:14px;overflow-x:auto;margin:0 0 20px;border:1px solid #000}
.take{margin:26px 0;padding:20px 22px 20px 22px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);position:relative}
.take .lab{color:var(--accent);margin-bottom:8px}
.take p{margin:0;font-weight:550;font-size:17px}
.ex{margin:26px 0;padding:20px 22px;border-radius:16px;background:var(--card);border:1px dashed var(--line2)}
.ex .lab{color:var(--gold);margin-bottom:10px}
.ex p{margin:0 0 8px;font-size:16px}.ex p:last-child{margin:0}
.tbl{overflow-x:auto;margin:0 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel)}
.dg{counter-increment:fig;margin:26px 0;padding:22px 20px 14px;border-radius:18px;background-color:var(--card);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.dg figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.5}
.dg figcaption::before{content:"FIG " counter(fig,decimal-leading-zero);font:600 11px var(--mono);letter-spacing:.1em;color:var(--ink);margin-right:10px}
.dg-scroll{overflow-x:auto;padding-bottom:4px}
.dg-scroll svg{display:block;margin:0 auto}
.dg-hint{font:500 11px var(--mono);color:var(--faint);margin-top:6px}
.layers{display:flex;flex-direction:column;gap:0;max-width:560px;margin:0 auto}
.lay{padding:12px 16px;border-radius:12px;background:var(--card);border:1.3px solid var(--ink);box-shadow:0 3px 0 var(--dg-sh);display:flex;flex-direction:column}
.lay strong{font-size:15px}
.lay span{font-size:13.5px;color:var(--muted)}
.lay.hot{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.lay.hot strong{color:var(--accent)}
.lay-arr{text-align:center;color:var(--faint);font-size:14px;line-height:22px}
.wip{padding:14px 18px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-size:15px;margin-bottom:18px}

.blk{margin-top:44px;padding:26px}
.blk .lab{margin-bottom:10px}
.blk h3{margin:0 0 6px;font-size:21px;letter-spacing:-.03em;line-height:1.3}
.q{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.4;margin:0 0 16px}
textarea{width:100%;min-height:140px;resize:vertical;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.saved{font:500 12px var(--mono);color:var(--faint)}
.sample{margin-top:18px;padding:18px 20px;border-radius:14px;background:var(--go-soft);border:1px solid color-mix(in srgb,var(--go) 30%,transparent)}
.sample .lab{color:var(--go);margin-bottom:8px}
.sample p{margin:0;font-size:16px}
.grade{margin-top:18px}
.grade .gb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gbtn{padding:12px 10px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--line2);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.gbtn small{font:500 11px var(--mono);color:var(--muted)}
.gbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.gbtn[data-g="1"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.gbtn[data-g="2"][aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 3px 0 var(--gold);color:var(--gold)}
.gbtn[data-g="3"][aria-pressed="true"]{background:var(--go-soft);border-color:var(--go);box-shadow:0 3px 0 var(--go);color:var(--go)}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.srcs li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.srcs .fav{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 15px var(--num);color:var(--accent)}
.srcs .tx{flex:1;min-width:0}
.srcs a{font-weight:600;text-decoration:none;line-height:1.35;display:block}
.srcs a:hover{color:var(--accent)}
.srcs .n{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.srcs .h{font:500 11px var(--mono);color:var(--faint)}
.rep{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.rep.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.done-zone{margin-top:44px;padding:30px 26px;text-align:center;border-radius:22px;background:var(--panel)}
.done-zone p{margin:10px 0 0;font:500 12px var(--mono);color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pn a{padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s}
.pn a:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.pn a b{font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pn a.nx{text-align:right;grid-column:2}
.pn a.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rail{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:14px}
.rail .card{padding:16px}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--line);text-decoration:none;font-size:13.5px;color:var(--muted);line-height:1.4}
.toc a.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}

/* review */
.rv{max-width:680px;margin:0 auto}
.rvtop{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:8px 0 18px}
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;min-height:340px;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:30px;border-radius:22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.face.fr{background:var(--card);border:1px solid var(--line);box-shadow:var(--lift)}
.face.bk{transform:rotateY(180deg);background:#1B1B1E;color:#F2F2F4;border:1px solid #000;box-shadow:var(--lift)}
.face.bk .lab{color:#9A9AA3}
.face .q{font-size:22px}
.face .hint{margin-top:auto;font:500 12px var(--mono);color:var(--faint)}
.face .mine{font-size:14.5px;color:#BDBDC5;border-top:1px solid #333;padding-top:12px}
.rvbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.empty{padding:44px 30px;text-align:center}
.empty .big{font:700 56px/1 var(--num);color:var(--line2)}

/* palette, toasts */
#pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,10,14,.42);backdrop-filter:blur(3px)}
#pal.on{display:flex}
.palbox{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font:18px var(--body);background:transparent;color:var(--ink);outline:none}
#palres{max-height:52vh;overflow-y:auto;padding:8px}
#palres a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none}
#palres a.on{background:var(--accent-soft)}
#palres .id{font:500 12px var(--mono);color:var(--accent);width:44px;flex:none}
#palres .tt{flex:1;min-width:0}
#palres .tt b{display:block;font-weight:600;font-size:15px}
#palres .tt span{font-size:12.5px;color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px;border-radius:999px;background:#1B1B1E;color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:tin .3s ease-out}
.toast b{font-family:var(--num);font-weight:500;color:#7CC7FF}
.toast.big{padding:16px 24px;font-size:16px;background:linear-gradient(180deg,#22B26F,#0F8C52)}
.toast.big b{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:85;width:100%;height:100%}

@media (max-width:1279px){.lgrid{grid-template-columns:minmax(0,760px)}.rail{display:none}.float.f2{right:262px;width:230px}}
@media (max-width:1180px){.float{display:none}.hero{min-height:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .side.open{transform:none;box-shadow:20px 0 60px -20px rgba(0,0,0,.4)}

  main{padding:22px 24px 80px}

}

  .top{padding:0 12px;gap:8px}

  .ring{right:12px;top:12px}
  .cont{padding:20px}.cont h3{font-size:23px}
  .mhead{padding:24px 22px;grid-template-columns:1fr}.mhead .big{display:none}
  .pnode{--dx:0!important;gap:14px}.pnode .o{width:52px;height:52px;font-size:17px}
  .lhead{padding:22px 20px;border-radius:18px}

  .pn{grid-template-columns:1fr}.pn a.nx{grid-column:1}

/* ---- taste pass: fanout brand system (Taste Engine extraction) + slop-rubric fixes ---- */
body{font-variant-numeric:tabular-nums}
.lab{font:500 11px/1.5 var(--mono);letter-spacing:.08em}
.brand{font-weight:600;letter-spacing:-.02em}
.side{background:var(--side)}
.side .nv[aria-current],.side .mr[aria-current]{border:0;box-shadow:var(--shadow);border-radius:8px}
.card{border:0;border-radius:12px;box-shadow:var(--shadow)}
.panel{border-radius:16px}
.btn{min-height:40px;padding:0 16px;border-radius:8px;background:var(--btn-a);border:1px solid var(--btn-edge);font-weight:500;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.16);transition:opacity .15s ease,transform .08s}
.btn:hover{filter:none;opacity:.9}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:var(--shadow)}

.pill.k{border:1px solid var(--accent-line)} .pill.ok{border:1px solid var(--go-line)} .pill.a{border:1px solid var(--paper-line);background:var(--paper);color:var(--kraft)} .pill.ip{border:1px solid color-mix(in srgb,var(--flame) 30%,transparent)}
.chip{border:0;border-radius:8px;box-shadow:var(--shadow);font:500 12.5px var(--mono)}
.chip .lv{font:600 12.5px var(--mono);color:var(--accent)}
.sbtn{border-radius:8px;border-color:var(--line)}

/* home: title -> (note + body) -> session strip, one continuous panel */

.cover{height:104px;border-radius:7px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;background-color:var(--c);color:var(--ci);background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(0,0,0,.07) 13px 14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.08)}

.palbox{border-radius:14px}
@media (max-width:1180px){.hero{padding-top:36px}}
@media (max-width:959px){.hrow{grid-template-columns:minmax(0,1fr);gap:26px}.note{max-width:460px}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.08)}.week{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.hero{padding:28px 20px 0}.hero h1{margin-bottom:24px}.strip{margin:30px -20px 0}.strip>div{padding:14px 16px 16px}.strip .v{font-size:23px}.note{transform:none}.stamps{grid-template-columns:repeat(2,minmax(0,1fr))}.mods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:84px;padding:10px}.cover .cn{font-size:22px}.mcard h4{font-size:14.5px}.mcard .ft span+span{display:none}}
.hm{grid-template-rows:repeat(7,16px);grid-auto-columns:minmax(0,1fr);gap:4px}
.hm i{aspect-ratio:auto;height:16px}
.stp span span{display:none}
.stp{padding:9px 10px}


/* illustrated covers */
.cover{position:relative;overflow:hidden;height:132px;background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.2px);background-size:10px 10px}
.cover .ill{position:absolute;right:6px;bottom:4px;width:62%;max-width:150px;height:auto;color:var(--ci)}
.cover .ill .f{fill:currentColor}
.cover .ill .h{fill:currentColor;fill-opacity:.22}
.cover .ill .g{fill:var(--c);stroke:none}
.cover .tp,.cover .tg{position:relative;z-index:1}
.cover.big{width:240px;height:180px;border-radius:12px;padding:16px 18px;transform:rotate(2deg);box-shadow:var(--lift)}
.cover.big .ill{width:78%;max-width:none;right:10px;bottom:8px}
.cover.big .cn{font-size:34px}
@media (max-width:640px){.cover{height:108px}.cover .ill{width:66%}.cover.big{display:none}}

/* ---------- practice: problem lists, filters, editor, results ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 16px;text-decoration:none;transition:transform .12s,box-shadow .12s}
.prow.num{grid-template-columns:22px 18px minmax(0,1fr) auto}
.prow:hover{transform:translateY(-1px);box-shadow:var(--lift)}
.prow b{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.prow .tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.prow .tg span{font:500 11px var(--mono);color:var(--muted)}
.prow .rt{display:flex;gap:6px;align-items:center}
.pill.Easy{background:var(--go-soft);border-color:transparent;color:var(--go)}
.pill.Medium{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.Hard{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.filters{display:flex;flex-direction:column;gap:12px;padding:18px;margin-bottom:16px}
.filters .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=search],.filters select{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:14px var(--body);padding:0 12px}
.filters input[type=search]{flex:1;min-width:200px}
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font:500 12px var(--mono);color:var(--muted);cursor:pointer}
.tchip b{color:var(--faint);font-weight:500;margin-left:4px}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .tchip[aria-pressed="true"] b{color:inherit;opacity:.75}
.tchip:disabled{opacity:.4;cursor:default}
.cnt-line{font:500 12px var(--mono);color:var(--muted);margin:0 0 10px}
.mcard .dif{display:flex;gap:6px;font:500 11px var(--mono);color:var(--muted)}
.mcard .dif i{font-style:normal}
.pcover{height:84px;border-radius:12px;background:var(--c);color:var(--ci);display:flex;align-items:flex-end;justify-content:space-between;padding:10px 12px;font:500 30px/1 var(--mono);letter-spacing:-.04em}
.pcover .ck{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}

.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.pgrid .lhead{margin-bottom:24px}
.ide{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.ide .card{padding:0;overflow:hidden}
.ide .bar2{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.ide .bar2 .lab{margin-right:auto}
.ide .btn{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.CodeMirror{height:min(52vh,520px);font:13.5px/1.6 var(--mono);background:var(--card);color:var(--ink)}
.CodeMirror-gutters{background:var(--card);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--faint)}
.CodeMirror-cursor{border-left-color:var(--ink)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:var(--accent-soft)!important}
.cm-s-default .cm-keyword{color:var(--accent);font-weight:600} .cm-s-default .cm-def{color:var(--go)}
.cm-s-default .cm-string{color:var(--gold)} .cm-s-default .cm-comment{color:var(--faint);font-style:italic}
.cm-s-default .cm-number{color:var(--flame)} .cm-s-default .cm-builtin,.cm-s-default .cm-variable-2{color:var(--accent)}
.cm-s-default .cm-operator,.cm-s-default .cm-variable{color:var(--ink)} .cm-s-default .cm-property{color:var(--ink)}
.res{padding:14px 16px;font-size:14px;max-height:340px;overflow:auto}
.res .sum{font-weight:650;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.res .sum.ok{color:var(--go)} .res .sum.no{color:var(--bad)}
.res .t{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font:12.5px/1.5 var(--mono)}
.res .t .k{color:var(--muted)} .res .t .v{white-space:pre-wrap;word-break:break-word}
.res .t.bad .k:first-child{color:var(--bad)} .res .t.good .k:first-child{color:var(--go)}
.res pre{margin:8px 0 0;white-space:pre-wrap;font:12.5px/1.5 var(--mono);background:var(--panel);padding:10px 12px;border-radius:10px;max-height:180px;overflow:auto}
.res .st{color:var(--muted);font:500 12.5px var(--mono)}
.exs{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
.exs .e{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:12.5px/1.55 var(--mono)}
.exs .e .k{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.exs .e .v{white-space:pre-wrap;word-break:break-word;margin:2px 0 6px}
.reveal{margin-top:16px}
.reveal .card{padding:20px 22px;margin-top:12px}
.reveal .hint{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);margin-top:8px;font-size:15px;line-height:1.55}
.reveal .hint b{font:600 12px var(--mono);color:var(--gold);flex:none;padding-top:3px}
.reveal .rbtns{display:flex;gap:10px;flex-wrap:wrap}
.reveal .btn.ghost{min-height:40px;font-size:14px}
.solcode{margin:12px 0 0}
.links{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.links a{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-decoration:none;font-size:14.5px}
.links a:hover{border-color:var(--accent)}
.links a span{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.colab{padding:22px}
.colab p{color:var(--muted);font-size:14.5px;margin:6px 0 16px}
.katex{font-size:1.05em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}
@media (max-width:1100px){.pgrid{grid-template-columns:minmax(0,1fr)}.ide{position:static}}
@media (max-width:640px){.prow{grid-template-columns:14px minmax(0,1fr)}.prow .rt{grid-column:2}.prow.num{grid-template-columns:22px 14px minmax(0,1fr)}.prow.num .rt{grid-column:3}.CodeMirror{height:340px}}

const PLANS = [{"id":"alphago","group":"Build from Scratch","title":"Build AlphaGo from Scratch","blurb":"Rebuild the AlphaGo Zero loop piece by piece in NumPy: Go rules on small boards, a residual policy-value network, PUCT tree search, and the targets and updates that turn self-play into training data. Every search exercise is fully deterministic, so you can check your tree statistics number for number.","prereq":"You should be fluent with Python and NumPy arrays and know what a convolution, a softmax and gradient descent do; no prior knowledge of Go is needed.","next":"Next, work through the reinforcement learning problems on value functions and policy gradients to see how search-based training relates to model-free methods.","sections":[{"name":"Go Rules","problems":["find-go-group-and-its-liberties","score-terminal-position-with-tromp-taylor-rules","build-legal-go-action-mask","apply-go-action-with-captures-and-repetition"]},{"name":"Policy-Value Network","problems":["encode-alphago-zero-board-history","apply-alphago-residual-block","policy-and-value-heads","assemble-compact-dual-head-network"]},{"name":"Neural-Guided MCTS","problems":["initialize-legal-mcts-edge-statistics","select-action-with-puct","back-up-mcts-simulation-path"]},{"name":"Self-Play and Training Targets","problems":["mix-dirichlet-noise-into-root-priors","turn-root-visits-into-search-policy","alphago-policy-value-loss"]},{"name":"Putting the Pipeline Together","problems":["sample-recent-self-play-replay-batch","apply-dihedral-go-symmetry","apply-one-policy-value-head-training-step","run-deterministic-neural-guided-mcts"]}]},{"id":"calculus","group":"ML Math","title":"Calculus for ML","blurb":"The calculus that training actually runs on, written as code: limits and continuity, derivatives and the chain rule, integrals over densities, Jacobians and Hessians, and the optimisation and autodiff machinery built from them.","prereq":"Comfortable Python and NumPy broadcasting, plus school-level deriv // Inline markdown with $math$ kept verbatim (KaTeX renders it after insertion).
function inl(s){
  const math = []; s = String(s).replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { math.push(m); return `\u0000${math.length - 1}\u0000`; });
  s = esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => esc(math[+i]));
}

// ---------- markdown (the courses' renderer, plus math) ----------
function render(src){
  const lines = String(src).split('\n'); let out = '', i = 0;
  // Indented lines right after a list item belong to it: nested lists or continuation text, rendered recursively.
  const sub = () => { const b = []; while (i < lines.length && /^\s{2,}\S/.test(lines[i])){ b.push(lines[i].replace(/^\s{2,4}/, '')); i++; } return b.length ? render(b.join('\n')) : ''; };
  while (i < lines.length){
    const L = lines[i];
    if (!L.trim()){ i++; continue; }
    if (L.startsWith('## ')){ out += `<h2>${inl(L.slice(3))}</h2>`; i++; continue; }
    if (L.startsWith('- ')){ out += '<ul>'; while (i < lines.length && lines[i].startsWith('- ')){ out += `<li>${inl(lines[i].slice(2))}`; i++; out += sub() + '</li>'; } out += '</ul>'; continue; }
    if (L.startsWith('```')){ const c = []; i++; while (i < lines.length && !lines[i].startsWith('```')){ c.push(lines[i]); i++; } i++; out += `<pre class="code">${esc(c.join('\n'))}</pre>`; continue; }
    if (/^\d+\. /.test(L)){ out += '<ol>'; while (i < lines.length && /^\d+\. /.test(lines[i])){ out += `<li>${inl(lines[i].replace(/^\d+\. /,''))}`; i++; out += sub() + '</li>'; } out += '</ol>'; continue; }
    if (L.startsWith('> ')){ out += `<div class="take"><div class="lab">Key takeaway</div><p>${inl(L.slice(2))}</p></div>`; i++; continue; }
    if (L.startsWith('|')){ out += '<div class="tbl"><table>';             // GFM tables; the |---| separator row is skipped
      while (i < lines.length && lines[i].startsWith('|')){ const r = lines[i].trim(); i++; if (/^\|[\s:|-]+\|?$/.test(r)) continue;
        out += '<tr>' + r.replace(/^\|\s*/, '').replace(/\s*\|$/, '').split(/\s+\|\s+/).map(c => `<td>${inl(c)}</td>`).join('') + '</tr>'; }
      out += '</table></div>'; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(## |- |> |\||\d+\. |```)/.test(lines[i])){ p.push(lines[i]); i++; }
    out += `<p>${inl(p.join(' '))}</p>`;
  }
  return out;
}

}

  }
  const d = isDone(l.id), colab = !!p.colab, hn = st.hints[k] || 0, sol = !!st.sol[k], ex = !!st.expl[k];
  const shown = p.shown.map((e, i) => `<div class="e"><div class="k">Example ${i+1} · input</div><div class="v">${esc(e.in)}</div><div class="k">Expected output</div><div class="v" style="margin:2px 0 0">${esc(e.out)}</div></div>`).join('');
  $('#view').innerHTML = `
  <div class="pgrid">
    <article>
      <header class="panel lhead">
        <a class="back" href="#t${m.n}">← ${esc(m.name)}</a>
        <div class="idrow"><span class="lab">Problem ${l.idx+1} of ${m.lessons.length}</span>${d ? '<span class="pill ok">✓ Solved</span>' : ''}${st.rev[k]?.due && st.rev[k].due <= today() && d ? '<span class="pill ip">Due for review</span>' : ''}</div>
        <h1>${esc(p.t)}</h1>
        <div class="meta">${dpill(p.d)}${rtpill(p.rt)}${p.tags.map(t => `<span class="pill k">${esc(t)}</span>`).join('')}</div>
      </header>
      <div class="prose" id="prose">${render(p.st)}</div>
      ${shown ? `<div class="lab" style="margin:26px 0 10px">Examples</div><div class="exs">${shown}</div>` : ''}
      <section class="reveal" id="help">
        <div class="lab">Stuck?</div>
        ${p.hints.slice(0, hn).map((h, i) => `<div class="hint"><b>Hint ${i+1}</b><span>${inl(h)}</span></div>`).join('')}
        <div class="rbtns" style="margin-top:12px">
          ${hn < p.hints.length ? `<button type="button" class="btn ghost" id="hint">Show hint ${hn + 1} of ${p.hints.length}</button>` : ''}
          <button type="button" class="btn ghost" id="solb">${sol ? 'Hide solution' : 'Show solution'}</button>
          <button type="button" class="btn ghost" id="exb">${ex ? 'Hide explanation' : 'Show explanation'}</button>
        </div>
        ${sol ? `<div class="card"><div class="lab">Solution</div><pre class="code solcode">${esc(p.sol)}</pre>${!d ? '<p style="color:var(--muted);font-size:13.5px;margin:0">You opened the solution, so solving this now earns the base +10 XP without the difficulty bonus.</p>' : ''}</div>` : ''}
        ${ex ? `<div class="card prose" id="expl">${render(p.ex_md)}</div>` : ''}
      </section>
      ${p.lessons.length ? `<section class="card blk"><div class="lab">Learn the idea</div><h3>Course lessons on this</h3><div class="links">${p.lessons.map(x => `<a href="${esc(x.href)}">${esc(x.t)}<span>${esc(x.c)}</span></a>`).join('')}</div></section>` : ''}
      ${plansWith(p.id).length ? `<section class="card blk"><div class="lab">In study plans</div><div class="links">${plansWith(p.id).map(pl => `<a href="#plan-${pl.id}">${esc(pl.title)}<span>${esc(pl.group)}</span></a>`).join('')}</div></section>` : ''}
      ${p.related.length ? `<section class="card blk"><div class="lab">Try similar problems</div><div class="links">${p.related.map(r => ALL.find(x => x.id === r)).filter(Boolean).map(x => `<a href="#l${key(x.id)}">${esc(x.t)}<span>${x.d}${isDone(x.id) ? ' · solved' : ''}</span></a>`).join('')}</div></section>` : ''}
      <nav class="pn" aria-label="Problem navigation">
        ${prev ? `<a class="card" href="#l${key(prev.id)}"><span class="lab">← Previous</span><b>${esc(prev.t)}</b></a>` : ''}
        ${next ? `<a class="card nx${d?' hl':''}" href="#l${key(next.id)}"><span class="lab">Next →</span><b>${esc(next.t)}</b></a>` : ''}
      </nav>
    </article>
    <aside class="ide">
      ${colab ? `<div class="card colab"><div class="lab">Runs in Colab</div><h3 style="margin:8px 0 0;font-size:20px;letter-spacing:-.02em">${RT[p.rt]}</h3>
          <p>This runtime can't run in a browser. The notebook has the statement, the starter code and the same tests. Run it in Colab, then mark the problem solved here.</p>
          ${p.gpu ? '<p style="margin-top:-8px">Needs a GPU: in Colab choose <b>Runtime → Change runtime type → GPU</b>.</p>' : ''}
          ${p.gpu_only ? '<p style="margin-top:-8px">The tests were generated from a CPU reference implementation of the same spec. The reference solution kernel itself only runs on a GPU, so it has not been executed by the site build.</p>' : ''}
          <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="${esc(p.colab)}" target="_blank" rel="noopener">Open in Colab ↗</a>
          ${d ? '' : `<button type="button" class="btn ghost" id="mark">All tests passed · mark solved</button>`}</div></div>
          <div class="card"><div class="bar2"><span class="lab">Starter code</span></div><pre class="code" style="margin:0;border-radius:0">${esc(p.starter)}</pre></div>`
      : `<div class="card"><div class="bar2"><span class="lab">${p.rt === 'sql' ? 'query.sql' : 'solution.py'}</span>
          <button type="button" class="btn ghost" id="reset" title="Restore the starter code">Reset</button>
          <button type="button" class="btn ghost" id="run" title="Run the examples (⌘↵)">Run</button>
          <button type="button" class="btn" id="submit" title="Run all tests (⌘⇧↵)">Submit</button></div>
          <textarea id="code" aria-label="Code editor">${esc(st.code[k] ?? p.starter)}</textarea></div>
        <div class="card"><div class="bar2"><span class="lab">Results</span></div><div class="res" id="res"><span class="st">Run checks your code on the ${p.nex} example${p.nex===1?'':'s'}. Submit checks all ${p.ntests} tests. Python starts the first time you run.</span></div></div>`}
    </aside>
  </div>`;
  math($('#prose')); if (ex) math($('#expl')); math($('#help'));
  $('#hint') && ($('#hint').onclick = () => { st.hints[k] = hn + 1; lsSet(); rerender(); });
  $('#solb').onclick = () => { st.sol[k] = !sol; lsSet(); rerender(); };
  $('#exb').onclick = () => { st.expl[k] = !ex; lsSet(); rerender(); };
  if (colab){ $('#mark') && ($('#mark').onclick = () => solved(l, p)); return; }
  ed = CodeMirror.fromTextArea($('#code'), {mode: p.rt === 'sql' ? 'text/x-sqlite' : 'python', lineNumbers: true, indentUnit: 4, matchBrackets: true,
    extraKeys: {Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    '), 'Cmd-Enter': () => go(p, l, false), 'Ctrl-Enter': () => go(p, l, false),
      'Shift-Cmd-Enter': () => go(p, l, true), 'Shift-Ctrl-Enter': () => go(p, l, true)}});
  edSlug = k;
  let t; ed.on('change', () => { clearTimeout(t); t = setTimeout(() => { st.code[k] = ed.getValue(); lsSet(); }, 400); });
  $('#reset').onclick = () => { ed.setValue(p.starter); delete st.code[k]; lsSet(); };
  $('#run').onclick = () => go(p, l, false);
  $('#submit').onclick = () => go(p, l, true);
  boot().catch(() => {});                                          // warm Python up while the learner reads; Run reports any failure
}

// ---------- runner: one Web Worker, killed and respawned on timeout ----------
const RUN = {w: null, ready: null, cb: null};
function boot(){
  if (RUN.w) return RUN.ready;
  RUN.w = new Worker('runner.js');
  RUN.ready = new Promise((res, rej) => {
    RUN.w.onmessage = e => { const m = e.data; if (m.type === 'ready') res(); else if (m.type === 'status') RUN.cb?.status(m.text); else RUN.cb?.done(m); };
    RUN.w.onerror = e => { RUN.w = null; rej(new Error(e.message || 'Python failed to start')); };
  });
  return RUN.ready;
}
function exec(p, code, tests){
  return new Promise(async res => {
    const say = s => { const r = $('#res'); if (r) r.innerHTML = `<span class="st">${esc(s)}</span>`; };
    say(RUN.w ? 'Running…' : 'Starting Python (first run downloads ~10 MB)…');
    try { await boot(); } catch(e){ return res({error: String(e.message)}); }
    let timer;
    const arm = ms => { clearTimeout(timer); timer = setTimeout(() => { RUN.w.terminate(); RUN.w = null; RUN.cb = null; res({error: `Time limit: still running after ${ms / 1000} s. Look for an infinite loop or a very slow step.`}); }, ms); };
    RUN.cb = {status: s => { say(s); arm(90000); }, done: m => { clearTimeout(timer); RUN.cb = null; res(m); }};
    say('Running…'); arm(10000);
    RUN.w.postMessage({id: p.id, code, fn: p.fn, tests, runtime: p.rt, pkgs: p.pkgs, tol: p.tol});
  });
}
let busy = false;
async function go(p, l, all){
  if (busy || !ed) return; busy = true;
  const k = key(l.id), code = ed.getValue(); st.code[k] = code; lsSet();
  ['run', 'submit'].forEach(id => $('#' + id) && ($('#' + id).disabled = true));
  const tests = all ? p.tj : p.tj_ex;   // JSON text: keeps 3.0 a float
  const r = await exec(p, code, tests);
  busy = false; ['run', 'submit'].forEach(id => $('#' + id) && ($('#' + id).disabled = false));
  if (cur.k !== k) return;
  const box = $('#res'); if (!box) return;
  const out = r.stdout ? `<div class="lab" style="margin-top:12px">Printed output</div><pre>${esc(r.stdout.slice(0, 4000))}</pre>` : '';
  if (r.error){ box.innerHTML = `<div class="sum no">Error</div><pre>${esc(r.error)}</pre>${out}`; return; }
  const ok = r.results.filter(x => x.ok).length, n = r.results.length, pass = ok === n;
  const rows = r.results.map((x, i) => {
    if (x.ok) return all ? '' : `<div class="t good"><span class="k">✓</span><span class="v">Example ${i+1} passed</span></div>`;
    return `<div class="t bad"><span class="k">✗</span><span class="v">${all && i >= p.nex ? 'Hidden test' : 'Example'} ${i+1}</span>
      ${x.inp ? `<span class="k">input</span><span class="v">${esc(x.inp)}</span>` : ''}
      <span class="k">why</span><span class="v">${esc(x.why)}</span>${x.got ? `<span class="k">got</span><span class="v">${esc(x.got)}</span>` : ''}</div>`;
  }).join('');
  box.innerHTML = `<div class="sum ${pass ? 'ok' : 'no'}">${pass ? CHECK : ''}${all ? (pass ? `All ${n} tests passed` : `${ok} / ${n} tests passed`) : (pass ? `Examples pass (${n}/${n}). Now Submit.` : `${ok} / ${n} examples pass`)}</div>${rows}${out}`;
  if (all && pass) solved(l, p);
}
function solved(l, p){
  const k = key(l.id), before = xp(), was = isDone(l.id);
  if (!was){
    st.done[k] = true; st.at[k] = now();
    if (!st.sol[k]) st.grades[k] = {g: DG[p.d], at: now()};
    st.rev[k] = {box: 0, due: addDays(today(), BOX[0]), n: 0};
    lsSet(); confetti(90); award(xp() - before, 'Problem solved', before);
    const m = DATA.find(x => x.n === l.mod);
    if (modDone(m) === m.lessons.length) setTimeout(() => { toast(`<b>${esc(m.name)}</b> topic cleared`, true); confetti(240); }, 450);
    else if (todaySolved() === GOAL) setTimeout(() => toast('<b>Goal</b> Daily goal reached'), 600);
  } else if (st.rev[k]?.due && st.rev[k].due <= today()){
    const r = st.rev[k], b = Math.min((r.box || 0) + 1, BOX.length - 1);
    st.rev[k] = {box: b, due: addDays(today(), BOX[b]), n: (r.n || 0) + 1, at: now()};
    bump(); award(5, `Reviewed · back in ${BOX[b]} days`, before);
  } else { toast('Solved again'); return; }
  rerender();
}

// ---------- search palette ----------
function openPal(){ $('#pal').classList.add('on'); $('#palin').value = ''; palRender(''); setTimeout(() => $('#palin').focus(), 20); }
function closePal(){ $('#pal').classList.remove('on'); }
function palRender(q){
  q = q.toLowerCase().trim();
  const hits = ALL.filter(l => !q || (l.t + ' ' + l.tags.join(' ') + ' ' + l.rt).toLowerCase().includes(q)).slice(0, 12);
  $('#palres').innerHTML = hits.map((l, i) => `<a href="#l${key(l.id)}" class="${i===0?'on':''}"><span class="id">${l.d}</span><span class="tt"><b>${esc(l.t)}</b><span>${esc(l.tags.join(' · '))} · ${RT[l.rt] || l.rt}</span></span></a>`).join('') || '<div style="padding:16px;color:var(--muted)">No matches</div>';
}
$('#sbtn').onclick = openPal;
$('#pal').onclick = e => { if (e.target.id === 'pal' || e.target.closest('a')) closePal(); };
$('#palin').oninput = e => palRender(e.target.value);
$('#palin').onkeydown = e => { if (e.key === 'Enter'){ const a = $('#palres a.on') || $('#palres a'); if (a){ location.hash = a.getAttribute('href'); closePal(); } } if (e.key === 'Escape') closePal(); };
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPal(); }
  else if (e.key === 'Escape') closePal();
});

// ---------- toasts, confetti (as in the courses) ----------
function toast(html, big){ const t = document.createElement('div'); t.className = 'toast' + (big ? ' big' : ''); t.innerHTML = html; $('#toasts').appendChild(t); setTimeout(() => t.remove(), big ? 3200 : 2200); }
function confetti(n){
  if (RM) return; const cv = $('#cf'), x = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#C03A73', '#8A9573', '#1B9EA6', '#DBA292', '#F1CF4E', '#B66DD0', '#272727'];
  const ps = Array.from({length: n}, () => ({x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .62, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, s: Math.random() * 6 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)]}));
  let f = 0; (function tick(){ x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .42; p.vx *= .985; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); });
    if (++f < 130) requestAnimationFrame(tick); else x.clearRect(0, 0, cv.width, cv.height); })();
}

// ---------- routing ----------
function route(){
  const h = location.hash.slice(1);
  ed = null;
  if (h === 'all'){ cur = {page: 'all', mod: null, k: null}; allPage(); }
  else if (h === 'review'){ cur = {page: 'review', mod: null, k: null}; reviewPage(); }
  else if (h === 'plans'){ cur = {page: 'plans', mod: null, k: null}; plansPage(); }
  else if (h.startsWith('plan-')){ cur = {page: 'plans', mod: null, k: null}; planPage(h.slice(5)); }
  else if (/^t\d\d$/.test(h)){ cur = {page: 'topic', mod: h.slice(1), k: null}; topicPage(h.slice(1)); }
  else if (/^l[a-z0-9-]+$/.test(h) && ALL.some(l => key(l.id) === h.slice(1))){
    const k = h.slice(1), l = ALL.find(x => key(x.id) === k);
    cur = {page: daily().id === l.id ? 'daily' : 'problem', mod: l.mod, k}; chrome(); return problemPage(k);
  }
  else { cur = {page: 'home', mod: null, k: null}; home(); }
  chrome();
}
// Re-draw in place (after a hint, a reveal, a solve): keep the editor text, the results panel and the scroll position.
function rerender(){
  const y = scrollY, k = cur.k, res = $('#res')?.innerHTML;
  if (ed && k){ st.code[k] = ed.getValue(); lsSet(); }
  Promise.resolve(route()).then(() => { if (k && cur.k === k && res && $('#res')) $('#res').innerHTML = res; scrollTo(0, y); });
}
let lastHash = location.hash;
addEventListener('hashchange', () => { route(); if (location.hash !== lastHash) scrollTo(0, 0); lastHash = location.hash; });
route();
