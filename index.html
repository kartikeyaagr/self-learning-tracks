<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='7' fill='%23272727'/%3E%3Crect x='6' y='6' width='6' height='6' rx='1.6' fill='%23fff'/%3E%3Crect x='14' y='6' width='6' height='6' rx='1.6' fill='%232E80D9'/%3E%3Crect x='6' y='14' width='6' height='6' rx='1.6' fill='%23fff'/%3E%3Crect x='14' y='14' width='6' height='6' rx='1.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens are the courses' own (system-design-101/index.html :root), so the hub reads as part of the same site.
   .acc elements take a track's accent: --acc-l / --acc-d come from hub-data.js. */
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --panel:#EFEFF1; --ink:#272727; --muted:#6E6E6E; --faint:#9C9CA3;
  --line:#E8E8EA; --line2:#C9C9CF; --accent:#2E80D9; --accent-ink:#FFFFFF;
  --go:#2F8A5F; --flame:#C8643A; --paper:#FFF8ED; --paper-line:#EADDBE; --kraft:#5F5647;
  --btn-a:#272727; --btn-ink:#FFFFFF; --btn-edge:#272727; --dot:rgba(39,39,39,.08);
  --shadow:rgba(59,59,59,.09) 0 1px 2px, rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.01) 0 0 0 1px;
  --lift:rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.09) 0 4px 8px, rgba(59,59,59,.1) 0 8px 16px, rgba(59,59,59,.01) 0 0 0 1px;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --pix:"Pixelify Sans", "Geist Mono", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#111112; --card:#19191B; --panel:#202023; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#6AA8EC; --accent-ink:#0A1522;
  --go:#6CC49A; --flame:#E89470; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE; --dot:rgba(255,255,255,.06);
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  color-scheme:dark } }
.acc{ --accent:var(--acc-l) }
@media (prefers-color-scheme: dark){ .acc{ --accent:var(--acc-d) } }

*{ box-sizing:border-box }
body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 var(--body); -webkit-font-smoothing:antialiased }
a{ color:inherit; text-decoration:none }
.lab{ font:500 11px/1.5 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.card{ background:var(--card); border-radius:12px; box-shadow:var(--shadow) }
.logo{ display:inline-flex; flex:none } .logo svg{ width:26px; height:26px }

/* ---------- top bar (same as the course header) ---------- */
.top{ position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:12px; height:60px; padding:0 20px;
  background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:saturate(1.4) blur(12px); -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line) }
.brand{ display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:-.02em; font-size:17px }
.sitenav{ display:flex; gap:2px; margin-left:10px }
.sitenav a{ font-size:14px; font-weight:500; color:var(--muted); padding:6px 10px; border-radius:8px }
.sitenav a:hover, .sitenav a[aria-current]{ color:var(--ink); background:var(--card); box-shadow:var(--shadow) }
@media (max-width:820px){ .sitenav{ display:none } }
.brand b{ font:400 1.05em/1 var(--pix); color:var(--accent); letter-spacing:0 }
.chip{ display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:8px; background:var(--card); box-shadow:var(--shadow);
  font:500 12.5px var(--mono); white-space:nowrap }
.chip b{ font-weight:600; color:var(--ink) }
.chip.st{ color:var(--flame) } .chip.off{ color:var(--faint) }
main{ max-width:1040px; margin:0 auto; padding:28px 24px 100px }

/* ---------- hero: dotted panel + paper note (same as the course home) ---------- */
.hero{ position:relative; padding:40px 44px 44px; background-color:var(--panel); background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size:18px 18px; border-radius:12px }
.hero h1{ font-size:clamp(34px, 4.2vw, 54px); line-height:1.02; letter-spacing:-.04em; font-weight:600; margin:14px 0 30px; max-width:640px }
.hero h1 .px{ font:400 1.04em/1 var(--px, var(--pix)); letter-spacing:-.01em; color:var(--accent) }
.note{ display:block; max-width:460px; background:var(--paper); border:1px solid var(--paper-line); border-radius:10px; padding:18px 20px 20px; box-shadow:var(--lift); transform:rotate(-1.2deg); transition:transform .2s }
.note:hover{ transform:rotate(-.4deg) translateY(-2px) }
.note .lab{ color:var(--kraft) }
.note h3{ font-size:24px; font-weight:600; letter-spacing:-.03em; line-height:1.12; margin:8px 0 6px }
.note p{ margin:0 0 16px; color:var(--muted); font-size:14.5px; line-height:1.5 }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:40px; padding:0 16px; border-radius:8px; border:1px solid var(--btn-edge);
  background:var(--btn-a); color:var(--btn-ink); font-weight:500; font-size:15px; box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 1px 2px rgba(0,0,0,.16) }
.btn .xp{ font:500 11px var(--mono); padding:2px 6px; border-radius:4px; background:rgba(127,127,127,.2) }

/* ---------- stats (same as the course home) ---------- */
.stats{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-top:16px }
.stat{ padding:18px 20px }
.stat .num{ font:700 36px/1 var(--body); letter-spacing:-.05em; margin:12px 0 10px; display:flex; align-items:baseline; gap:8px }
.stat .num small{ font:500 13px var(--mono); color:var(--muted); letter-spacing:0 }
.seg{ display:flex; gap:3px } .seg i{ flex:1; height:6px; border-radius:2px; background:var(--line) } .seg i.on{ background:var(--go) } .seg i.fl{ background:var(--flame) }

/* ---------- course cards: each opens that course's own page ---------- */
.sh{ margin:44px 0 16px } .sh h2{ margin:4px 0 0; font-size:26px; letter-spacing:-.03em; font-weight:600 }
.courses{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px }
.course{ display:flex; flex-direction:column; gap:12px; padding:20px; transition:box-shadow .15s, transform .15s }
.course:hover{ box-shadow:var(--lift); transform:translateY(-2px) }
.course .hd{ display:flex; align-items:center; gap:12px }
.course .logo svg{ width:34px; height:34px }
.course h3{ margin:0; font-size:19px; font-weight:600; letter-spacing:-.02em; line-height:1.2 }
.course .lvl{ font:500 12px var(--mono); color:var(--accent) }
.course .bar{ height:6px; border-radius:3px; background:var(--line); overflow:hidden } .course .bar i{ display:block; height:100%; background:var(--accent) }
.course .next{ font-size:14px; color:var(--muted); line-height:1.45; flex:1 } .course .next b{ color:var(--ink); font-weight:500 }
.course .ft{ display:flex; justify-content:space-between; align-items:center; font:500 12px var(--mono); color:var(--muted); padding-top:12px; border-top:1px solid var(--line) }
.course .ft span:last-child{ color:var(--ink); font:500 14px var(--body) }
.course .due{ color:var(--flame) }

/* ---------- roadmap: layers of courses, each with the study plans that practise it ---------- */
.layer{ position:relative; display:grid; grid-template-columns:120px minmax(0,1fr); gap:20px; padding:22px 0; border-top:1px solid var(--line) }
.layer:first-child{ border-top:0; padding-top:4px }
.layer .ln{ font:500 11px/1.5 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.layer .ln b{ display:block; font:600 22px/1.15 var(--body); letter-spacing:-.03em; text-transform:none; color:var(--ink); margin-top:6px }
.layer .ln span{ display:block; margin-top:8px; font:13px/1.45 var(--body); letter-spacing:0; text-transform:none }
.plans{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px }
.plan{ display:inline-flex; align-items:center; gap:8px; padding:6px 10px 6px 12px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); font-size:13.5px; transition:box-shadow .15s }
.plan:hover{ box-shadow:var(--lift) }
.plan i{ font:500 11px var(--mono); font-style:normal; color:var(--muted) }
.plan.done i{ color:var(--go) }
.plans .lab{ align-self:center; margin-right:4px }
@media (max-width:820px){ .layer{ grid-template-columns:1fr; gap:10px } .layer .ln span{ display:none } }

@media (max-width:820px){ .stats{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px } }
@media (max-width:640px){
  .top{ padding:0 12px; gap:8px } .brand .wd{ display:none } .chip{ padding:0 9px; height:32px; font-size:12px } .chip .xl{ display:none }
  main{ padding:16px 16px 80px }
  .hero{ padding:28px 20px 24px } .note{ transform:none }
  .stat{ padding:14px } .stat .num{ font-size:30px }
  .courses{ grid-template-columns:1fr }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Tracks home"><span class="logo"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--ink)"/><rect x="6" y="6" width="6" height="6" rx="1.6" fill="var(--bg)"/><rect x="14" y="6" width="6" height="6" rx="1.6" fill="var(--accent)"/><rect x="6" y="14" width="6" height="6" rx="1.6" fill="var(--bg)"/><rect x="14" y="14" width="6" height="6" rx="1.6" fill="var(--bg)"/></svg></span><span class="wd">Tracks <b id="nT">5</b></span></a>
  <nav class="sitenav" aria-label="Site"><a href="./" aria-current="page">Roadmap</a><a href="practice/index.html">Practice</a><a href="practice/index.html#plans">Study plans</a></nav>
  <span id="chips" style="display:flex;gap:8px;margin-left:auto"></span>
</header>
<main>
  <section class="hero acc" id="hero"></section>
  <div class="stats" id="stats"></div>
  <div class="sh"><div class="lab">The roadmap</div><h2>From foundations to systems</h2></div>
  <div id="roadmap"></div>
  <div class="sh"><div class="lab">Practise everything</div><h2>Practice Lab</h2></div>
  <div class="courses" id="practice"></div>
</main>

<script src="hub-data.js"></script>
<script>
/* ---------- helpers: ports of the course engine (see inference-eng-course/index.html) so numbers match ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dk = d => { const x = new Date(d); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); };
const today = dk(Date.now());
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return dk(x); };
const key = id => id.replace('.', '-');                   // lesson id "03.02" -> storage/route key "03-02"
const GB = {1: 3, 2: 8, 3: 15};                           // XP per answer grade, same in every course
const DAILY_GOAL = 2;                                     // lessons per day, the courses' own default

function load(k){                                         // a course's saved state; never throws
  try { const v = JSON.parse(localStorage.getItem(k) || '{}'); return v && typeof v === 'object' ? v : {}; }
  catch { return {}; }
}
const obj = o => (o && typeof o === 'object') ? o : {};
function dayCounts(st, c = {}){
  Object.entries(obj(st.at)).forEach(([k, t]) => { if (obj(st.done)[k] && t) { const d = dk(t); c[d] = (c[d] || 0) + 1; } });
  Object.entries(obj(st.act)).forEach(([d, n]) => c[d] = (c[d] || 0) + (+n || 0));
  return c;
}
function streak(c){ let d = today; if (!c[d]) d = addDays(d, -1); let n = 0; while (c[d]) { n++; d = addDays(d, -1); } return n; }
function level(t, x){ let i = 0; while (i < t.LV.length - 1 && x >= t.LV[i+1]) i++; return {i, name: t.LVN[i]}; }

/* ---------- one view object per track ---------- */
const views = TRACKS.map((t, idx) => {
  const st = load(t.key), done = obj(st.done), rev = obj(st.rev), at = obj(st.at);
  const isDone = id => !!done[key(id)];
  const lessons = t.modules.flatMap(m => m.lessons.map(([id, title, mins], i) => ({id, title, mins, i, mod: m})));
  const n = lessons.filter(l => isDone(l.id)).length;
  const reviews = Object.values(rev).reduce((a, r) => a + (+obj(r).n || 0), 0);
  const xp = n * 10 + Object.values(obj(st.grades)).reduce((a, g) => a + (GB[obj(g).g] || 0), 0) + reviews * 5;
  const due = lessons.filter(l => isDone(l.id) && (!obj(rev[key(l.id)]).due || rev[key(l.id)].due <= today)).length;
  const stamps = [...Object.values(at), ...Object.values(rev).map(r => obj(r).at)].filter(Boolean).map(s => +new Date(s));
  return { t, idx, st, n, total: lessons.length, xp, due, lvl: level(t, xp),
           next: lessons.find(l => !isDone(l.id)) || null,       // first unfinished lesson in course order
           last: stamps.length ? Math.max(...stamps) : 0,        // ms of most recent activity, 0 = never opened
           days: dayCounts(st) };
});

// Most recently studied unfinished track (momentum); a new visitor gets the first unfinished one in roadmap order.
// If every track is finished, open the one with the most reviews due.
function pickContinue(views){
  const open = views.filter(v => v.next);
  if (!open.length) return [...views].sort((a, b) => b.due - a.due)[0];
  return open.reduce((best, v) => v.last > best.last ? v : best);   // ties (all 0) keep the earliest = roadmap order
}

/* ---------- render ---------- */
const allDays = views.reduce((c, v) => { Object.entries(v.days).forEach(([d, n]) => c[d] = (c[d] || 0) + n); return c; }, {});
const totalXP = views.reduce((a, v) => a + v.xp, 0), totalDue = views.reduce((a, v) => a + v.due, 0);
const totalAll = views.reduce((a, v) => a + v.total, 0);
const todayDone = views.reduce((a, v) => a + Object.entries(obj(v.st.at)).filter(([k, t]) => obj(v.st.done)[k] && t && dk(t) === today).length, 0);
const curStreak = streak(allDays);
const href = (v, h = '') => `${v.t.dir}/index.html${h}`;
const acc = v => `--acc-l:${v.t.accent[0]};--acc-d:${v.t.accent[1]}`;
const logo = v => `<span class="logo acc" style="${acc(v)}" aria-hidden="true">${v.t.logo}</span>`;
const FLAME = `<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8.6 1.2c.3 2-.6 3.2-1.6 4.3C6 6.6 5 7.7 5 9.6 5 11.5 6.4 13 8 13s3-1.4 3-3.2c0-1-.4-1.8-.9-2.4.9.2 1.9 1.3 1.9 3C12 13 10.2 15 8 15s-4-1.9-4-4.8C4 6 8 5.4 8.6 1.2Z"/></svg>`;

$('#chips').innerHTML = `
  <span class="chip st ${curStreak ? '' : 'off'}" title="Day streak across all tracks">${FLAME}${curStreak}<span class="xl"> days</span></span>
  <span class="chip" title="XP across all tracks"><b>${totalXP}</b> XP</span>
  <span class="chip ${totalDue ? '' : 'off'}" title="Review cards due"><b>${totalDue}</b><span class="xl"> due</span></span>`;

// Hero: one "continue" note for the track you're most likely to want next.
const C = pickContinue(views), cur = C.next;
const hr = new Date().getHours(), hello = hr < 5 ? 'Up late' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
$('#hero').style.cssText = acc(C) + `;--px:${C.t.pix}`;
const units = [...new Set(TRACKS.map(t => t.unit))].map(u => `${views.filter(v => v.t.unit === u).reduce((a, v) => a + v.total, 0)} ${u}`).join(' · ');
$('#nT').textContent = TRACKS.filter(t => t.layer).length;
$('#hero').innerHTML = `<div class="lab">${hello} · ${TRACKS.filter(t => t.layer).length} courses · ${units}</div>
  <h1>Everything you're learning, <span class="px">in one place.</span></h1>` + (cur
  ? `<a class="note" href="${href(C, '#l' + key(cur.id))}"><div class="lab">${C.n ? 'Continue' : 'Start here'} · ${esc(C.t.name)} · ${cur.id} · ${cur.mins} min</div>
       <h3>${esc(cur.title)}</h3><p>${esc(cur.mod.name)} · ${C.t.unit.slice(0, -1)} ${cur.i + 1} of ${cur.mod.lessons.length}</p>
       <span class="btn">${C.n ? 'Continue' : 'Start learning'} <span class="xp">+10 XP</span></span></a>`
  : `<a class="note" href="${href(C, '#review')}"><div class="lab">${esc(C.t.name)} · complete</div><h3>All ${C.total} ${C.t.unit} done.</h3>
       <p>Keep it fresh with the review deck.</p><span class="btn">Open review deck</span></a>`);

// Stats row: same four-up cards as the course home, totalled across tracks.
const monday = addDays(today, -((new Date().getDay() + 6) % 7));
const week = [...Array(7)].map((_, i) => addDays(monday, i));
$('#stats').innerHTML = `
  <div class="card stat"><div class="lab">Streak</div><div class="num">${curStreak}<small>days</small></div>
    <div class="seg" title="This week">${week.map(d => `<i class="${allDays[d] ? 'fl' : ''}"></i>`).join('')}</div></div>
  <div class="card stat"><div class="lab">Today</div><div class="num">${todayDone}<small>/ ${DAILY_GOAL} done</small></div>
    <div class="seg">${[...Array(DAILY_GOAL)].map((_, i) => `<i class="${i < todayDone ? 'on' : ''}"></i>`).join('')}</div></div>
  <div class="card stat"><div class="lab">Experience</div><div class="num">${totalXP}<small>XP</small></div>
    <div class="seg">${views.map(v => `<i class="${v.xp ? 'on' : ''}" title="${esc(v.t.name)}: ${v.xp} XP"></i>`).join('')}</div></div>
  <div class="card stat"><div class="lab">Review</div><div class="num">${totalDue}<small>due</small></div>
    <div class="seg">${views.map(v => `<i class="${v.due ? 'fl' : ''}" title="${esc(v.t.name)}: ${v.due} due"></i>`).join('')}</div></div>`;

// Course cards: each one opens the course's own home page.
const card = v => `
  <a class="card course acc" style="${acc(v)}" href="${href(v)}">
    <div class="hd">${logo(v)}<div><h3>${esc(v.t.name)}</h3><div class="lvl">Lv${v.lvl.i + 1} · ${esc(v.lvl.name)} · ${v.xp} XP</div></div></div>
    <div class="bar" role="progressbar" aria-label="${esc(v.t.name)} progress" aria-valuenow="${v.n}" aria-valuemin="0" aria-valuemax="${v.total}"><i style="width:${100 * v.n / v.total}%"></i></div>
    <div class="next">${v.next ? `${v.n ? 'Next' : 'Starts with'}: <b>${esc(v.next.title)}</b>` : '<b>Complete.</b> Every lesson done.'}</div>
    <div class="ft"><span>${v.n}/${v.total} ${v.t.unit}${v.due ? ` · <span class="due">${v.due} due</span>` : ''}</span><span>Open →</span></div>
  </a>`;

// Roadmap: each layer lists its courses, then the study plans (Practice Lab) that drill the same material.
const solved = obj(load('practice').done);
$('#roadmap').innerHTML = LAYERS.map(L => {
  const vs = views.filter(v => v.t.layer === L.n);
  const ps = L.plans.map(id => PLANS.find(p => p.id === id)).filter(Boolean);
  return `<section class="layer"><div class="ln">Layer ${L.n}<b>${esc(L.name)}</b><span>${esc(L.blurb)}</span></div>
    <div><div class="courses">${vs.map(card).join('')}</div>
    ${ps.length ? `<div class="plans"><span class="lab">Practice</span>${ps.map(p => { const d = p.problems.filter(x => solved[x]).length;
      return `<a class="plan${d === p.problems.length ? ' done' : ''}" href="practice/index.html#plan-${p.id}">${esc(p.title)}<i>${d}/${p.problems.length}</i></a>`; }).join('')}</div>` : ''}</div></section>`;
}).join('');
$('#practice').innerHTML = views.filter(v => !v.t.layer).map(card).join('') + `
  <a class="card course" href="practice/index.html#plans"><div class="hd"><div><h3>${PLANS.length} study plans</h3><div class="lvl" style="color:var(--muted)">Curated problem sequences</div></div></div>
    <div class="next">From NumPy and SQL sheets to building AlphaGo, a diffusion model and an LLM from scratch.</div>
    <div class="ft"><span>${PLANS.reduce((a, p) => a + p.problems.length, 0)} problem slots</span><span>Browse →</span></div></a>` + [
  ['papers', 'papers', 'Paper implementations', 'Rebuild influential models step by step, ending in a capstone.'],
  ['projects', 'projects', 'Projects', 'Build complete systems in Colab, one tested step at a time.'],
  ['interview', 'rounds', 'Interview prep', 'Timed rounds by role with a readiness report.']].filter(([, k]) => EXTRAS[k]).map(([h, k, t, d]) => `
