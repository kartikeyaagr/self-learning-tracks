he waiting queue.\n3. **Schedule**: next step, the scheduler checks the token budget and free KV blocks. It may schedule the whole prompt or a chunk of it.\n4. **Allocate**: the KV manager assigns blocks; if the prompt prefix is cached, those blocks are reused and those tokens skipped.\n5. **Execute**: the model runner builds one flat batch of all scheduled tokens across requests and runs the forward pass. Attention writes new K and V into the assigned blocks.\n6. **Sample**: logits for each request's last scheduled position are sampled.\n7. **Output**: tokens are detokenized and streamed back.\n8. **Repeat**: next step, this request contributes one decode token, alongside others.\n\n## Why this matters\nEach component maps to a later module: scheduling (07), KV blocks (08), prefix caching (10), runtime and graphs (15). When a metric looks wrong, you can now ask which component owns it.\n\n> Takeaway: a request is tokenized, queued, scheduled under a token budget, given KV blocks, run in a shared batch, sampled and streamed. Every engine has the same pieces under different names.", "s": "The API server receives the request, applies the chat template and tokenizes, and hands it to the engine core as a new request in the waiting queue. On the next step the scheduler allocates KV blocks and schedules its prompt tokens (possibly in chunks). The model runner builds input tensors and runs the forward pass with the attention backend writing K and V into the allocated blocks. The sampler picks the first token, the output processor detokenizes, and the API server streams it as an SSE chunk."}, {"id": "06.06", "t": "Lab: PyTorch vs vLLM", "f": "https://fanout.sh/inference-eng/curriculum/06-06", "k": ["lab"], "x": ["Lab"], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "The paper's comparison with HF baselines."], ["vLLM documentation", "https://docs.vllm.ai/en/latest/", "Engine used in the lab."]], "q": "You see vLLM win by 15 times at concurrency 64 but only 1.5 times at concurrency 1. Explain both numbers.", "n": ["Run your Module 01 server and vLLM with the same model, dtype and workload.", "Use your harness to sweep concurrency 1 to 128.", "Compare TTFT, TPOT, throughput and max concurrency before SLO failure.", "Explain each gap using engine features.", "Keep these results as the baseline for Module 09."], "ak": "", "a": "## Setup\n- Same model, revision and dtype in both servers.\n- Same workload file (for example 1k in, 256 out) and fixed output length.\n- Same GPU, warm-up and duration.\n\n## Runs\nSweep concurrency 1, 4, 16, 64, 128 against each server.\n\n## What you should see\n| Concurrency | Naive tok/s | vLLM tok/s | Ratio |\n| 1 | 40 | 120 | ~3x |\n| 16 | 40 | 1,700 | ~40x |\n| 64 | 40 | 5,500 | ~140x |\n\nYour numbers will differ. The pattern is what matters: modest gains at 1, huge at high concurrency.\n\n## Explain the gaps\n- At concurrency 1: CUDA graphs and better kernels cut overhead.\n- At higher concurrency: continuous batching shares each weight read across many sequences.\n- Max concurrency: paged KV fits many more sequences than per-request allocation.\n\n## Report\nCharts for throughput and p95 TTFT vs concurrency for both servers, and a paragraph tying each difference to an engine feature.\n\n> Takeaway: most of an engine's advantage appears under concurrency. That is batching and memory management at work, which the next two modules explain in detail.", "s": "At concurrency 1 the gain comes only from lower per-step overhead and better kernels (CUDA graphs, fused attention), since both run one sequence. At concurrency 64, vLLM batches all sequences into every decode step and uses paged KV memory to fit them, while the naive server processes them one at a time, so throughput scales with batch size for vLLM and stays flat for the naive server."}]}, {"n": "07", "name": "Continuous Batching & Scheduling", "lessons": [{"id": "07.01", "t": "One-by-One Serving vs Static Batching", "f": "https://fanout.sh/inference-eng/curriculum/07-01", "k": ["batching"], "x": [], "r": [["Anyscale: How continuous batching enables 23x throughput", "https://www.anyscale.com/blog/continuous-batching-llm-inference", "Static vs continuous batching explained."], ["Orca", "https://www.usenix.org/conference/osdi22/presentation/yu", "Motivation for iteration-level scheduling."]], "q": "With static batching, a batch has requests needing 20, 50 and 500 output tokens. What happens to the GPU and to the first two requests?", "n": ["One-by-one serving: GPU at batch 1, users queue.", "Static batching: group requests, run until all finish. Better throughput, but padding waste.", "Short requests are held hostage by the longest one in their batch.", "New arrivals wait for the whole batch to end.", "Output lengths vary a lot in LLM traffic, so static batching wastes much of the batch."], "ak": "", "a": "## One by one\nEach request runs alone. Latency is good for the first user and terrible for everyone queued behind. The GPU runs at batch 1, using a fraction of its bandwidth advantage.\n\n## Static batching\nCollect `B` requests, pad them to the same length, run until every one finishes.\n\n%%flow Static batch with very different output lengths.\nStart 3 requests -> Short ones finish -(slots idle)-> *Wait for longest -> Batch ends -> New batch starts\n%%\n\n| Step range | Active requests | Wasted slots |\n| 1 to 20 | 3 | 0 |\n| 21 to 50 | 2 | 1 |\n| 51 to 500 | 1 | 2 |\n\nOver 500 steps, two thirds of slot-steps are idle once the short ones finish.\n\n## Why LLMs make it worse\nImage models have fixed-size outputs, so static batches work. LLM outputs range from a few tokens to thousands, and you do not know the length in advance. Static batching then wastes a lot and inflates latency for short requests.\n\n> Takeaway: static batching helps throughput but wastes slots and holds short requests hostage. The fix is to let requests join and leave the batch every step.", "s": "All three start together and the batch runs until the 500-token request finishes. The first two finish early but their slots stay idle (padding) for the remaining steps, so GPU work is wasted, and new requests cannot join until the whole batch ends, so they wait. Users of short requests may also wait if results are returned only when the batch completes."}, {"id": "07.02", "t": "Iteration-Level Scheduling", "f": "https://fanout.sh/inference-eng/curriculum/07-02", "k": ["scheduling"], "x": [], "r": [["Orca", "https://www.usenix.org/conference/osdi22/presentation/yu", "Introduced iteration-level scheduling and selective batching."], ["vLLM: Architecture overview", "https://docs.vllm.ai/en/latest/design/arch_overview.html", "How the engine loop schedules per step."]], "q": "What is the scheduling unit in iteration-level scheduling, and what does that enable?", "n": ["Schedule at the granularity of one forward pass, not one request.", "After each step: drop finished sequences, admit new ones, decide prompt chunks.", "Orca introduced this, plus \"selective batching\" to batch ops that allow it.", "Attention is per sequence (different lengths), linear layers are batched over all tokens.", "This is the foundation of continuous batching."], "ak": "", "a": "## The idea\nInstead of scheduling requests, schedule iterations. Every forward pass, the scheduler decides which sequences participate.\n\n%%flow The engine loop.\nPick sequences -> *Run one iteration -> Emit tokens -> Remove finished -> Pick sequences\n%%\n\n## Handling different lengths\nSequences in a step have different context lengths. Orca's insight was \"selective batching\":\n- Linear layers (QKV, MLP, LM head) do not care which sequence a token belongs to. Flatten all tokens into one matrix and run one big matmul.\n- Attention depends on each sequence's own history. Run it per sequence, or with a kernel that handles variable lengths in one launch.\n\n## Mixing prefill and decode\nA step can contain decode tokens from running sequences and prompt tokens from a new one. Flattened, it is just a list of tokens. Each token knows its sequence and position.\n\n| Sequence | Tokens this step | Kind |\n| A | 1 | decode |\n| B | 1 | decode |\n| C | 512 | prefill |\n| Total | 514 | one forward pass |\n\n## Cost\nThe scheduler runs on the CPU every step, so it must be fast. With steps of 10 to 30 ms, a few milliseconds of scheduling overhead is significant, which is why engines optimize this loop heavily.\n\n> Takeaway: scheduling per iteration lets the batch change every step. Linear layers batch all tokens together; attention handles each sequence's history.", "s": "One model iteration (one forward pass that produces one token per running sequence). After every iteration the scheduler can remove finished sequences and add waiting ones, so the batch composition changes step by step, finished slots are refilled immediately, and new requests start without waiting for others to finish."}, {"id": "07.03", "t": "Continuous Batching", "f": "https://fanout.sh/inference-eng/curriculum/07-03", "k": ["batching"], "x": [], "r": [["Anyscale: How continuous batching enables 23x throughput", "https://www.anyscale.com/blog/continuous-batching-llm-inference", "Measured gains."], ["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "Continuous batching plus paged memory."]], "q": "Describe continuous batching in one paragraph and give its main effect on throughput and on TTFT.", "n": ["Continuous batching = iteration-level scheduling with requests joining and leaving freely.", "The batch stays full as long as there is demand and KV memory.", "New requests start on the next step instead of waiting for a batch to end.", "Side effect: a big prefill in a step slows that step for every decoding user.", "Memory management (paged KV) is what lets the batch grow large."], "ak": "", "a": "## How it works\n%%flow Continuous batching over time.\nStep n: A, B, C decoding -> C finishes -> Step n+1: A, B decode + D prefill -> *Step n+2: A, B, D decoding\n%%\n\n- Finished sequences leave right away and free their KV.\n- Waiting requests are admitted when there is room in the token budget and KV pool.\n- Their prompt is processed (fully or in chunks) as part of the next step.\n\n## Effects\n| Metric | Static batching | Continuous batching |\n| GPU batch occupancy | drops as requests finish | stays high |\n| TTFT for new arrivals | wait for current batch | next step or two |\n| Short request latency | tied to longest in batch | own length only |\n| Throughput | moderate | often several times higher |\n\n## The interference cost\nWhen a new request's 4k-token prompt is processed in a step, that step takes much longer. Every decoding user sees a long gap between tokens. This shows up as spikes in ITL p99. Chunked prefill (Module 10) limits it by splitting long prompts across steps.\n\n## Prerequisites\nContinuous batching only pays off if many sequences fit in memory at once. With contiguous per-request KV allocation, memory fragments and the batch stays small. Paged KV (Module 08) is what makes large continuous batches practical.\n\n> Takeaway: continuous batching keeps the batch full every step. It raises throughput and cuts TTFT, at the cost of prefill interference that needs its own handling.", "s": "Continuous batching keeps a running batch that changes every step: finished sequences leave immediately, and waiting requests join as soon as there is a slot and KV memory, with their prefill folded into the next step. This keeps the GPU's batch full, raising throughput several times over static batching, and lowers TTFT because new requests do not wait for a batch to finish."}, {"id": "07.04", "t": "Token Budgets, Max Sequences & Max Batched Tokens", "f": "https://fanout.sh/inference-eng/curriculum/07-04", "k": ["scheduling", "tuning"], "x": [], "r": [["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Chunked prefill and batch size tuning."], ["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Token budgets for stall-free scheduling."]], "q": "What does max_num_batched_tokens limit, and what happens to TTFT and ITL if you set it very low or very high?", "n": ["Token budget (max batched tokens): tokens processed per step, prefill plus decode.", "Max sequences (max num seqs): how many sequences can be in the running batch.", "Budget too small: slow prefills, higher TTFT. Too large: long steps, ITL spikes, activation memory.", "Max seqs too high: per-user TPOT suffers; too low: throughput left on the table.", "Tune both against your SLO with your harness."], "ak": "", "a": "## Two limits per step\n- **max_num_seqs**: how many sequences can be running. Caps the decode batch.\n- **max_num_batched_tokens**: total tokens in one forward pass. Each decode sequence contributes one; prefills contribute their prompt (or chunk) length.\n\n## How the scheduler fills a step\n1. Add one decode token for each running sequence (up to max seqs).\n2. Use the remaining token budget for prompt tokens of waiting or partially prefilled requests.\n3. Stop when the budget or free KV blocks run out.\n\n! Example: budget 2,048, 100 running sequences\n! Decode uses 100 tokens. 1,948 tokens remain for prefill.\n! A new 6,000-token prompt is split across about 4 steps. Its TTFT is 4 steps, and each step stays bounded.\n\n## Trade-offs\n| Setting | Low value | High value |\n| max_num_batched_tokens | smooth ITL, slower TTFT | fast TTFT, ITL spikes, more activation memory |\n| max_num_seqs | better TPOT per user, lower throughput | higher throughput, worse TPOT |\n\n## Tuning approach\n1. Pick SLOs for TTFT and TPOT.\n2. Sweep max_num_batched_tokens (for example 512, 2k, 8k) at your target load.\n3. Pick the smallest budget that meets the TTFT SLO.\n4. Sweep max_num_seqs and pick the largest that still meets TPOT.\n\n> Takeaway: the token budget trades TTFT against ITL stability; max sequences trades throughput against per-user speed. Tune both against the SLO, not in isolation.", "s": "It caps how many tokens (decode tokens plus prompt tokens) one step may process. Very low: long prompts are split into many small chunks, so TTFT rises, but decode steps stay short and ITL stays smooth. Very high: big prefills run in one step, lowering TTFT for that request but causing long steps and ITL spikes for everyone else, plus a higher activation memory peak."}, {"id": "07.05", "t": "Queueing, Fairness, Cancellation & Preemption", "f": "https://fanout.sh/inference-eng/curriculum/07-05", "k": ["scheduling"], "x": [], "r": [["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Preemption modes."], ["Fairness in Serving Large Language Models (VTC)", "https://arxiv.org/abs/2401.00588", "Fair scheduling across clients."]], "q": "A client disconnects mid-stream. What should the engine do and why does it matter for capacity?", "n": ["Default policy is first come, first served; simple but one heavy user can hurt others.", "Fairness policies (per-tenant quotas, virtual token counters) protect light users.", "Priorities let interactive traffic jump ahead of batch traffic.", "Cancellation must free KV right away when clients disconnect.", "Preemption evicts running sequences when KV runs out: recompute later or swap to CPU."], "ak": "", "a": "## Queueing policy\nRequests that cannot be scheduled wait. The order matters:\n- **FCFS**: fair in arrival order, simple, default in most engines.\n- **Priority**: interactive before batch; paid tiers before free.\n- **Fair share**: track tokens served per tenant and favor those who got less. The VTC paper formalizes this for LLMs.\n\n## Cancellation\nUsers close tabs and agents time out. If the engine keeps generating, it burns decode steps and holds KV for no one. Make sure the API layer propagates disconnects and the engine aborts the request, freeing its blocks in the same step.\n\n## Preemption\nWhen decode needs new KV blocks and none are free, the scheduler must evict something.\n\n%%flow Preemption under KV pressure.\nKV full -> Pick victim (usually newest) -> *Free its blocks -> Later: recompute prefix or swap back\n%%\n\n- **Recompute**: drop the victim's KV and redo its prefill later. Costs compute, no extra memory.\n- **Swap**: copy its KV to CPU memory and copy back later. Costs PCIe bandwidth and CPU memory.\n\nEngines usually pick the most recently admitted request as the victim, so older requests finish.\n\n## Signs of trouble\nFrequent preemptions mean the engine is overcommitting memory. Tail latency for preempted requests can be several times normal. Lower max seqs, add KV capacity, or shed load earlier.\n\n> Takeaway: queue order, cancellation and preemption decide who waits and who pays when the server is busy. Get cancellation right first; it is free capacity.", "s": "The engine should detect the disconnect, abort the request, stop generating for it and free its KV blocks immediately. Otherwise it keeps spending decode steps and KV memory on tokens nobody will read, reducing capacity for live users. In busy chat products a meaningful share of requests are abandoned, so this matters."}, {"id": "07.06", "t": "Build a Tiny Scheduler Simulator", "f": "https://fanout.sh/inference-eng/curriculum/07-06", "k": ["scheduling", "lab"], "x": [], "r": [["Vidur: A Large-Scale Simulation Framework for LLM Inference", "https://arxiv.org/abs/2405.05465", "A full-featured inference simulator."], ["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Scheduling policies worth simulating."]], "q": "What inputs and outputs should a minimal continuous-batching simulator have to answer \"what happens to TTFT if I halve max_num_batched_tokens?\"", "n": ["Simulate the engine loop with a simple step-time model instead of a GPU.", "Step time ~ a + b x decode tokens + c x prefill tokens (+ attention term).", "Fit the coefficients from a few real measurements.", "Replay request traces under different policies and compare TTFT and TPOT.", "Simulators are fast and let you try ideas before touching an engine."], "ak": "", "a": "## Why simulate\nReal sweeps take hours. A simulator replays thousands of requests in seconds and lets you test scheduling ideas safely. Production teams use simulators like Vidur to explore configurations.\n\n## The model\n```\nstep_time = a + b * n_decode + c * n_prefill_tokens + d * total_context_read\n```\nFit `a, b, c, d` from a handful of real measurements on your GPU.\n\n## The loop\n```\nt = 0; waiting = []; running = []\nwhile trace or waiting or running:\n    waiting += arrivals_until(t)\n    budget = max_batched_tokens - len(running)\n    batch = running[:max_seqs]\n    for r in waiting:                 # admit with chunking\n        chunk = min(r.remaining_prompt, budget)\n        if chunk == 0 or not kv_fits(r): break\n        schedule_prefill(r, chunk); budget -= chunk\n    dt = step_time(batch, prefills); t += dt\n    advance(batch, prefills, t)       # record first token, token times, finish\n```\n\n## Experiments\n1. FCFS vs shortest-prompt-first on TTFT p95.\n2. Token budget 512 vs 2k vs 8k on TTFT and ITL p99.\n3. Chunked prefill on vs off with a few very long prompts mixed in.\n\n## Validate\nRun one configuration in both the simulator and a real engine. If p50 and p95 agree within 10 to 20%, trust the simulator for relative comparisons.\n\n> Takeaway: a few dozen lines of simulation explain most scheduler trade-offs. Fit step time to real data and validate against one real run.", "s": "Inputs: a request trace (arrival time, prompt length, output length), a cost model for step time as a function of decode tokens and prefill tokens, KV capacity in tokens, and scheduler parameters (token budget, max seqs, chunked prefill on or off). Outputs: per-request TTFT, TPOT, E2E, and per-step batch composition, so you can compare percentiles across settings."}, {"id": "07.07", "t": "Lab: Tune TTFT vs Throughput", "f": "https://fanout.sh/inference-eng/curriculum/07-07", "k": ["lab"], "x": ["Lab"], "r": [["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "The relevant flags."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Rate sweeps with SLO views."]], "q": "You must hit p95 TTFT under 800 ms and p95 TPOT under 40 ms at the highest possible rate. Which knobs do you sweep and in what order?", "n": ["Choose a realistic mixed workload and an SLO for TTFT and TPOT.", "Sweep token budget, then max sequences, then load.", "Plot each setting's TTFT p95 vs TPOT p95 at fixed load: a trade-off frontier.", "Pick the setting with the most goodput under the SLO.", "Record why the winner wins using engine metrics."], "ak": "", "a": "## Setup\n- Workload: mixed, for example 70% chat (500 in / 300 out) and 30% RAG (4k in / 150 out).\n- SLO: p95 TTFT < 800 ms, p95 TPOT < 40 ms.\n- Harness from Module 04, engine metrics scraped.\n\n## Sweep plan\n1. Fix load at a moderate rate. Sweep `max_num_batched_tokens` over 512, 1k, 2k, 4k, 8k.\n2. At the best budget, sweep `max_num_seqs` over 64, 128, 256, 512.\n3. At the best pair, sweep request rate upward until the SLO breaks.\n\n## Plot\nScatter TTFT p95 (x) against TPOT p95 (y) for each configuration, labeled with throughput. Draw the SLO box. The best configuration inside the box with the highest goodput wins.\n\n| Budget | Max seqs | TTFT p95 | TPOT p95 | Goodput tok/s |\n| 512 | 256 | 1,400 | 31 | 2,900 |\n| 2k | 256 | 650 | 36 | 4,100 |\n| 8k | 256 | 420 | 52 | 3,100 |\n\n## Write-up\nState the winning configuration, the max SLO-safe rate, and use engine metrics (waiting queue, KV usage, step time) to explain why it beat its neighbors.\n\n> Takeaway: tuning is a search for the most goodput inside the SLO box. Sweep one knob at a time, in order of impact, and explain the winner with metrics.", "s": "First set max_num_batched_tokens (with chunked prefill on) to the smallest value meeting the TTFT target at the expected load. Then raise max_num_seqs until TPOT p95 approaches 40 ms. Then increase request rate until either target breaks, and record that as capacity. Re-check prefix caching and gpu_memory_utilization if KV becomes the limit."}]}, {"n": "08", "name": "PagedAttention & KV Memory Management", "lessons": [{"id": "08.01", "t": "Why Contiguous KV Allocation Breaks", "f": "https://fanout.sh/inference-eng/curriculum/08-01", "k": ["memory"], "x": [], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "Quantifies KV waste in earlier systems."], ["vLLM blog: Easy, Fast, and Cheap LLM Serving with PagedAttention", "https://blog.vllm.ai/2023/06/20/vllm.html", "Accessible summary."]], "q": "Name the three kinds of memory waste in contiguous per-request KV allocation.", "n": ["Contiguous allocation reserves one block of memory per sequence, sized for the maximum length.", "Most sequences end far short of the maximum: reserved space is wasted.", "Allocations of different sizes leave gaps: external fragmentation.", "The vLLM paper found earlier systems used only a fraction of KV memory for real tokens.", "Less usable memory means smaller batches and lower throughput."], "ak": "", "a": "## The naive approach\nGive each sequence one contiguous buffer for K and V, sized for prompt plus maximum output (or the model's max length). Simple, and kernels can read it with simple pointer math.\n\n## Where it wastes memory\n%%layers Three kinds of waste.\nReservation | space for tokens the sequence has not generated yet, and may never\nInternal fragmentation | unused tail when the sequence ends early\nExternal fragmentation | free gaps between buffers too small for a new request\n%%\n\n! Example: max length 4k, typical use 600 tokens\n! Each sequence reserves 4,096 slots and uses about 600. Utilization is about 15%.\n! With a 40 GB KV pool that could hold 300k tokens, you fit only about 75 sequences instead of 500.\n\n## Why it limits throughput\nDecode throughput depends on how many sequences run per step. If most KV memory is reserved but empty, the batch is small and the GPU's bandwidth advantage goes unused.\n\n## What we want\n- Allocate memory as tokens are generated, not up front.\n- Any free memory should be usable by any sequence.\n- Sequences with the same prefix should share memory.\n\nPaging, borrowed from operating systems, gives all three.\n\n> Takeaway: contiguous KV allocation wastes most of the cache through reservation and fragmentation. Fixing it is the biggest single capacity win in LLM serving.", "s": "Reservation waste: space reserved up to max length that the sequence never uses. Internal fragmentation: unused space at the end of each allocation once the sequence finishes short. External fragmentation: free memory split into gaps between allocations, none large enough for a new sequence even when the total free is sufficient."}, {"id": "08.02", "t": "KV Blocks, Fragmentation & Block Tables", "f": "https://fanout.sh/inference-eng/curriculum/08-02", "k": ["memory", "paging"], "x": [], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "Block tables and paging design."], ["vLLM: Paged attention design", "https://docs.vllm.ai/en/latest/design/paged_attention.html", "Kernel-level view of blocks."]], "q": "With block size 16 and a sequence of 1,000 tokens, how many blocks are used and how much is wasted? How does a block table find token 517?", "n": ["Split KV memory into fixed-size blocks (e.g. 16 tokens each).", "Each sequence has a block table: logical block index to physical block id.", "Blocks need not be contiguous; any free block can serve any sequence.", "Waste is at most one partly filled block per sequence.", "Block size trades waste against per-block overhead and kernel efficiency."], "ak": "", "a": "## Blocks\nDivide the KV pool into blocks of `B` tokens (16 is common). Each block holds K and V for B tokens across all layers' KV heads (or one block per layer, depending on the engine).\n\n## Block tables\nEach sequence keeps a list of physical block ids, like a page table:\n\n| Logical block | Physical block |\n| 0 | 812 |\n| 1 | 37 |\n| 2 | 1,504 |\n| 3 | 9 |\n\nToken at position `p` lives in logical block `p // B`, slot `p % B`. The attention kernel takes the block table as input and gathers K and V from scattered blocks.\n\n## Waste\nOnly the last block of each sequence can be partly empty. With B = 16, average waste is about 8 tokens per sequence, tiny compared with contiguous reservation.\n\n## Choosing block size\n| Block size | Waste | Table size | Kernel efficiency |\n| 1 to 8 | minimal | large tables | more gather overhead |\n| 16 | small | moderate | good default |\n| 64 to 128 | more per sequence | small tables | longer contiguous reads |\n\nSome kernels and hardware prefer larger blocks; engines expose block size as a setting.\n\n> Takeaway: fixed-size blocks plus a per-sequence block table make any free block usable by any sequence. Waste drops to under one block per sequence.", "s": "ceil(1000/16) = 63 blocks; the last holds 8 tokens so 8 slots are wasted (under 1%). Token 517 is in logical block 517 // 16 = 32 at offset 517 % 16 = 5. The block table maps logical block 32 to some physical block id, and the kernel reads slot 5 of that physical block."}, {"id": "08.03", "t": "PagedAttention", "f": "https://fanout.sh/inference-eng/curriculum/08-03", "k": ["attention", "paging"], "x": [], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "Original paper."], ["vLLM: Paged attention design", "https://docs.vllm.ai/en/latest/design/paged_attention.html", "How the kernel walks blocks."]], "q": "What does a PagedAttention kernel need as input that a standard attention kernel does not, and what does it cost?", "n": ["PagedAttention computes attention over K and V stored in non-contiguous blocks.", "Inputs: query, the KV block pool, block tables, context lengths.", "Each thread block walks a sequence's block table and reads its blocks.", "Small overhead per step, large gain in usable memory and batch size.", "FlashInfer and FlashAttention now support paged KV layouts too."], "ak": "", "a": "## The kernel's job\nDecode attention for each sequence: one query against all its K and V. With paging, K and V are scattered across physical blocks.\n\n%%flow Paged decode attention for one sequence.\nQuery -> Block table -(physical ids)-> *Gather K,V blocks -> Scores and softmax -> Weighted V\n%%\n\n## Inputs\n- `query`: `[num_seqs, num_heads, head_dim]`\n- `key_cache`, `value_cache`: the whole block pool\n- `block_tables`: `[num_seqs, max_blocks_per_seq]`\n- `context_lens`: `[num_seqs]`\n\n## How it runs\nEach GPU thread block takes one sequence and head (or a slice of the sequence for long contexts), loops over that sequence's blocks via the table, loads K, computes scores, keeps an online softmax, and accumulates weighted V. Long sequences can be split across thread blocks and reduced at the end.\n\n## Costs and wins\n- Indirection: one table lookup per block. Small.\n- Non-contiguous reads: each block is contiguous inside, so with B = 16 reads stay reasonably efficient.\n- Win: KV utilization near 100%, so batches are several times larger.\n\n## Beyond decode\nPrefill also writes into blocks, and prefill attention with paged KV is supported by modern kernels, which matters for prefix caching and chunked prefill.\n\n> Takeaway: PagedAttention trades a little kernel complexity for near-complete use of KV memory. Larger batches more than repay the indirection.", "s": "It needs the block table for each sequence (mapping logical to physical blocks) and the sequence lengths, and reads K and V from non-contiguous blocks. The cost is extra indexing and less perfectly contiguous memory access, which makes the kernel slightly slower per byte than ideal contiguous attention, but the memory saved allows much larger batches, which is a big net win."}, {"id": "08.04", "t": "Allocate, Share & Reclaim KV Blocks", "f": "https://fanout.sh/inference-eng/curriculum/08-04", "k": ["paging", "prefix"], "x": [], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "Sharing and copy-on-write."], ["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "Hash-based block reuse."]], "q": "Two requests share a 1,000-token system prompt. How does block sharing work, and what happens when one of them writes a new token into a shared, partially filled block?", "n": ["A free list holds unused blocks; allocation pops, freeing pushes back.", "Reference counts let several sequences share the same physical block.", "Shared prefixes (system prompts, parallel samples, beam search) share blocks.", "Copy-on-write when a sequence must modify a shared block.", "Finished sequences' blocks can stay cached for future prefix hits, evicted LRU."], "ak": "", "a": "## Allocation\nThe KV manager keeps a free list of block ids. When a sequence needs a new block (every B tokens), it pops one. When the sequence finishes, its blocks return to the pool.\n\n## Sharing\nBlocks carry a reference count.\n- **Parallel sampling**: generate n completions of one prompt; all n share the prompt's blocks.\n- **Beam search**: beams share common history.\n- **Common prefixes**: many requests with the same system prompt share those blocks.\n\n%%flow Two sequences sharing a prefix.\nSeq A table -> *Shared blocks 0-62 (refcount 2) -> Seq A own block\nSeq B table -> *Shared blocks 0-62 (refcount 2) -> Seq B own block\n%%\n\n## Copy-on-write\nFull blocks are never modified, so sharing them is safe. If the shared prefix ends mid-block, the first sequence to append copies that block first. Engines often avoid this by sharing only full blocks.\n\n## Reclaim and caching\nInstead of discarding a finished sequence's blocks, keep them indexed by content (a hash of the tokens in the block and its prefix). A future request with the same prefix reuses them. When memory is needed, evict cached blocks with refcount zero, least recently used first.\n\n> Takeaway: a free list, refcounts and copy-on-write let sequences share KV safely. Keeping freed blocks as a cache turns sharing into prefix caching.", "s": "Both block tables point to the same physical blocks for the shared prefix, with a reference count of 2 on each. Full blocks are read-only and can be shared freely. If the last shared block is partially filled and a request must append to it, copy-on-write duplicates that block for the writer so the other request's view is unchanged. Blocks are freed when their reference count drops to zero."}, {"id": "08.05", "t": "Preemption, Recomputation & KV Pressure", "f": "https://fanout.sh/inference-eng/curriculum/08-05", "k": ["paging", "scheduling"], "x": [], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "Swapping vs recomputation analysis."], ["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Preemption behaviour and settings."]], "q": "When is recomputation a better preemption strategy than swapping to CPU, and when is swapping better?", "n": ["KV pressure arises because outputs grow unpredictably after admission.", "When blocks run out, the scheduler preempts sequences to free memory.", "Recompute: discard KV, redo prefill later. Swap: move KV to CPU and back.", "Preemption keeps the server alive but hurts tail latency of victims.", "Avoid it by admitting conservatively (watermarks) and sizing for realistic output lengths."], "ak": "", "a": "## Why pressure happens\nThe scheduler admits a request when its prompt fits. It cannot know how long the output will be. As running sequences grow, the pool can fill even though nothing new was admitted.\n\n## What engines do\n%%flow Handling a full KV pool.\nNeed block, none free -> Evict cached blocks -> Still none -> *Preempt a running sequence -> Requeue it\n%%\n\n## Recompute vs swap\n| | Recompute | Swap |\n| Extra memory | none | CPU RAM for KV |\n| Cost | prefill compute again | PCIe transfer both ways |\n| Best for | short sequences | long sequences |\n| Complexity | low | higher |\n\nPCIe Gen5 gives roughly 50 to 60 GB/s per direction in practice. Swapping 1 GB of KV costs around 20 ms each way. Recomputing a 1k-token prefix on a fast GPU may cost similar time; a 16k-token prefix costs much more.\n\n## Avoiding preemption\n- Keep a free-block watermark so new admissions leave room for growth.\n- Lower max seqs if preemptions are frequent.\n- Use KV quantization or more GPUs.\n- Set realistic max_tokens defaults so runaway generations do not hog memory.\n\n> Takeaway: preemption is the safety valve for KV pressure. Recompute short victims, swap long ones, and tune admission so the valve rarely opens.", "s": "Recomputation is better when the preempted sequence is short or the GPU has spare compute, since redoing a short prefill is fast and needs no PCIe transfer or CPU memory. Swapping is better for long sequences, where recomputing a long prefix costs much more than copying the KV over PCIe, provided there is CPU memory and PCIe bandwidth to spare."}, {"id": "08.06", "t": "Visual Lab: Build a Paged KV Allocator", "f": "https://fanout.sh/inference-eng/curriculum/08-06", "k": ["lab"], "x": ["Lab"], "r": [["vLLM: Paged attention design", "https://docs.vllm.ai/en/latest/design/paged_attention.html", "Reference for layouts."], ["nano-vllm", "https://github.com/GeeeekExplorer/nano-vllm", "A small engine with a readable block manager."]], "q": "What invariants should your allocator's tests check?", "n": ["Implement a block pool with a free list, refcounts and per-sequence block tables.", "Support allocate, append token, fork (share), free, and copy-on-write.", "Add a content-hash index to reuse blocks for shared prefixes.", "Visualize the pool as a grid colored by owner.", "Test invariants under random workloads."], "ak": "", "a": "## API to implement\n```\nclass BlockPool:\n    def allocate(seq_id, n_tokens) -> list[int]\n    def append(seq_id) -> int | None      # new block when last fills\n    def fork(src_id, dst_id)              # share all blocks, refcount++\n    def free(seq_id)\n    def lookup_prefix(token_ids) -> list[int]  # cached full blocks\n```\n\n## Steps\n1. Pool of N blocks, free list, refcount array.\n2. Block tables as Python lists per sequence.\n3. `append` adds a block every `block_size` tokens; copy-on-write if the last block is shared.\n4. Hash each full block by `(parent_hash, tokens)` and keep freed blocks in an LRU cache.\n5. Drive it with a random workload: arrivals, token appends, finishes, forks.\n\n## Visualize\nDraw the pool as a grid. Color blocks by owning sequence, shade shared blocks, gray cached-free blocks, white truly free. Animate a run and watch fragmentation stay at zero while the pool fills.\n\n## Tests\n- Free + used = pool size, always.\n- Table length = ceil(tokens / block_size).\n- Shared blocks have refcount equal to number of owners.\n- Prefix lookup returns the same blocks for identical prefixes.\n\n## Stretch\nPlug it into your generation loop from Module 03 with a gather step before attention. You now have the core of paged KV.\n\n> Takeaway: a paged allocator is a free list, refcounts and tables. Building one makes every engine's KV manager easy to read.", "s": "Every physical block is either free or owned with refcount at least 1, never both; the sum of free and used blocks equals the pool size; a sequence's block table covers exactly ceil(len / block_size) blocks; freeing a sequence decrements refcounts and returns blocks only at zero; and no two sequences write to the same block without copy-on-write."}]}, {"n": "09", "name": "Optimize One GPU", "lessons": [{"id": "09.01", "t": "Establish a Tunable vLLM Baseline", "f": "https://fanout.sh/inference-eng/curriculum/09-01", "k": ["tuning", "vllm"], "x": [], "r": [["vLLM: Engine arguments", "https://docs.vllm.ai/en/latest/configuration/engine_args.html", "Flags to pin."], ["vLLM: Metrics", "https://docs.vllm.ai/en/latest/usage/metrics.html", "Metrics to record."]], "q": "What makes a baseline \"tunable\" rather than just a first measurement?", "n": ["Start from defaults, but write every flag explicitly in a config file.", "Measure with the target workload at three loads: light, expected, peak.", "Record engine metrics alongside latency and throughput.", "Identify the binding constraint before changing anything.", "Change one variable at a time from here on."], "ak": "", "a": "## Make it explicit\nWrite all flags into a config file or launch script, including defaults you rely on. Defaults change between versions and you want to know what you ran.\n\n## Measure at three points\n| Load | Purpose |\n| Light (10% of capacity) | latency floor with real engine |\n| Expected | the production operating point |\n| Peak (2x expected) | headroom and failure behavior |\n\nAt each, record TTFT/TPOT percentiles, throughput, goodput, KV usage, waiting queue and preemptions.\n\n## Find the binding constraint\n- TTFT fails first: prefill or queueing.\n- TPOT fails first: decode speed or batch too large.\n- KV hits 100%: memory.\n\n## Plan the tuning\nThe constraint picks the next lesson:\n- Memory: 09.02.\n- Scheduling: revisit 07.04.\n- Prefill: Module 10.\n- Precision: Module 11.\n\n> Takeaway: a tunable baseline is pinned, measured at several loads, and annotated with the binding constraint. Every later change is judged against it.", "s": "It is fully pinned (model, engine version, every flag written down), measured on the target workload with the harness at several loads, and recorded with engine metrics. That way each later change touches one variable and can be compared directly, and you know which constraint (TTFT, TPOT, KV memory) binds first."}, {"id": "09.02", "t": "Tune GPU Memory & KV Capacity", "f": "https://fanout.sh/inference-eng/curriculum/09-02", "k": ["memory", "tuning"], "x": [], "r": [["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Memory-related tuning."], ["vLLM: Quantized KV cache", "https://docs.vllm.ai/en/latest/features/quantization/quantized_kvcache.html", "FP8 KV cache."]], "q": "List four ways to increase KV capacity on a single GPU and the cost of each.", "n": ["KV capacity decides max concurrency, which often decides throughput.", "Knobs: memory utilization fraction, KV dtype, weight precision, max model length, batched tokens, graph capture sizes.", "Each knob has a cost: OOM risk, quality, long-context support or speed.", "Measure KV tokens available (startup log) and max SLO-safe load after each change.", "Stop when KV is no longer the binding constraint."], "ak": "", "a": "## The knobs\n| Knob | Gain | Cost |\n| gpu_memory_utilization 0.90 to 0.95 | +5% of GPU memory to KV | less room for spikes, other processes |\n| kv_cache_dtype fp8 | ~2x KV tokens | small accuracy risk; check support |\n| FP8 or INT4 weights | frees half or more of weight memory | quality, kernel speed varies |\n| Lower max_model_len | may allow more seqs if long ones dominate | rejects long requests |\n| Lower max_num_batched_tokens | smaller activation peak | slower prefill |\n| Fewer CUDA graph sizes | a little memory | some speed at uncaptured sizes |\n\n## Procedure\n1. Read KV capacity (tokens) from the startup log.\n2. Apply one change.\n3. Re-read capacity and rerun the expected and peak loads.\n4. Check quality if you changed precision.\n\n! Example: 8B on a 48 GB GPU\n! Baseline BF16 weights and KV: ~22 GB KV pool, ~170k tokens.\n! FP8 KV: ~340k tokens. Peak-load preemptions disappear; p95 TTFT at peak drops 40%.\n\n## When to stop\nOnce KV usage at peak stays below about 85% and preemptions are zero, memory is no longer the constraint. Move to the next bottleneck.\n\n> Takeaway: KV capacity is bought with memory fraction, precision or length limits. Change one at a time and stop once memory no longer binds.", "s": "Raise gpu_memory_utilization (less safety margin against OOM); quantize the KV cache to FP8 (small quality risk, kernel support needed); quantize weights to FP8 or INT4 to free space (quality risk); lower max_model_len or max_num_batched_tokens to reduce reserved or activation memory (limits long requests or TTFT). Disabling CUDA graphs saves a little memory but costs speed."}, {"id": "09.03", "t": "Find the SLO-Safe Configuration & Headroom", "f": "https://fanout.sh/inference-eng/curriculum/09-05", "k": ["slo", "capacity"], "x": [], "r": [["Google SRE Book: Handling Overload", "https://sre.google/sre-book/handling-overload/", "Planning for load beyond normal."], ["DistServe", "https://arxiv.org/abs/2401.09670", "SLO attainment as a capacity criterion."]], "q": "Why should you run production at less than the measured SLO-safe maximum load, and how much headroom is typical?", "n": ["The SLO-safe maximum: highest load where e.g. 99% of requests meet the SLO.", "Find it with a fine-grained rate sweep around the knee.", "Headroom covers bursts, mix shifts, slow autoscaling and failures.", "Typical target: 60 to 80% of SLO-safe maximum.", "Recheck when model, engine version or traffic mix changes."], "ak": "", "a": "## Finding the safe maximum\nRun a coarse rate sweep to find the knee, then a fine sweep around it in small steps. For each rate, compute SLO attainment. The SLO-safe maximum is the highest rate with attainment above your target (say 99%).\n\n## Why headroom\n- **Bursts**: Poisson traffic at average rate R often has short periods at 1.5R or more.\n- **Mix shift**: a new feature with longer prompts changes capacity overnight.\n- **Failures**: losing one of four replicas puts 33% more load on the rest.\n- **Autoscaling lag**: new GPU replicas take minutes to start.\n\n## How much\n| Situation | Run at |\n| Stable traffic, fast autoscaling | ~80% |\n| Bursty traffic or slow scale-up | ~60 to 70% |\n| Strict SLO, revenue critical | ~50 to 60% |\n\n## Write it down\nA one-line capacity statement: \"One H100 running config X serves 9 req/s of workload Y at 99% SLO attainment. We plan 6.5 req/s per replica.\"\n\n> Takeaway: measure the SLO-safe maximum precisely, then plan to run well below it. Headroom is what keeps the SLO when traffic or hardware misbehaves.", "s": "Real traffic bursts, prompt mixes shift, and hardware or replicas fail, so running at the measured maximum means any spike breaks the SLO. Teams typically plan to run at 60 to 80% of the measured SLO-safe capacity, leaving room for bursts and for autoscaling to react."}, {"id": "09.04", "t": "Project: Optimize One GPU", "f": "https://fanout.sh/inference-eng/curriculum/09-06", "k": ["project"], "x": ["Project"], "r": [["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Tuning reference."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Sweep tool."]], "q": "What would a convincing before-and-after report for single-GPU optimization contain?", "n": ["Goal: maximize SLO-safe capacity of one GPU for a fixed workload.", "Start from the tunable baseline; change one variable per experiment.", "Track each change's effect in a table.", "Explain gains with engine metrics, verify quality where precision changed.", "End with a capacity statement including headroom."], "ak": "", "a": "## The task\nGiven a model, a GPU, a workload and an SLO, raise the maximum request rate the GPU can serve while meeting the SLO.\n\n## Process\n1. Baseline (09.01).\n2. Fix the binding constraint, one change at a time:\n   memory (09.02), scheduling (07.04), prefix caching (if prompts share prefixes).\n3. After each change, rerun the expected-load point and the rate sweep near the knee.\n4. Keep changes that help; revert ones that do not.\n\n## Change log\n| # | Change | SLO-safe req/s | Delta | Why |\n| 0 | baseline | 5.0 | | |\n| 1 | FP8 KV cache | 6.8 | +36% | preemptions gone |\n| 2 | token budget 2k | 7.4 | +9% | TTFT p95 improved |\n| 3 | max seqs 384 | 7.9 | +7% | larger decode batch |\n\n## Deliverable\nReport with config diffs, the change log, before and after charts, quality check results, and the final capacity statement.\n\n> Takeaway: optimize one GPU methodically: baseline, one change at a time, measured against the SLO, explained with metrics. The change log is the real result.", "s": "The baseline and final configs (full flags), the workload and SLO, a goodput vs load chart for both, a table of each change with its individual effect, engine metrics explaining each gain, quality checks for any precision change, and the final SLO-safe capacity with planned headroom."}]}, {"n": "10", "name": "Prefill & Prefix Optimization", "lessons": [{"id": "10.01", "t": "Reproduce the Long-Prompt Interference Problem", "f": "https://fanout.sh/inference-eng/curriculum/10-01", "k": ["prefill", "interference"], "x": [], "r": [["Sarathi-Serve: Taming Throughput-Latency Tradeoff", "https://arxiv.org/abs/2403.02310", "Describes generation stalls from prefills."], ["DistServe", "https://arxiv.org/abs/2401.09670", "Prefill-decode interference measurements."]], "q": "Describe an experiment that shows long-prompt interference and the metric that reveals it.", "n": ["A long prefill in a mixed step makes that step slow for every decoding user.", "The effect shows as ITL p99 spikes, not in averages.", "Reproduce it: steady short requests plus periodic long prompts.", "Plot step time over time to see the stalls directly.", "This motivates chunked prefill and, at larger scale, disaggregation."], "ak": "", "a": "## The problem\nWith continuous batching, a new request's prefill runs in the same step as everyone's decode. A 16k-token prefill on an 8B model can take a few hundred milliseconds. During that step, no decoding user gets a token.\n\n%%flow One long prompt stalls everyone.\nDecode steps ~15 ms -> *Long prefill step ~400 ms -> Decode steps resume\n%%\n\n## Reproduce it\n1. Background load: 20 concurrent chat requests (300 in, 300 out).\n2. Every 10 seconds, send one 16k-token prompt.\n3. Disable chunked prefill (or set a very large token budget).\n4. Record every token's arrival for the chat users.\n\n## What you see\n| Metric (chat users) | No long prompts | With long prompts |\n| ITL p50 | 15 ms | 16 ms |\n| ITL p99 | 25 ms | 380 ms |\n| TPOT p95 | 17 ms | 30 ms |\n\nAverages barely change. The tail tells the story: users see the stream freeze.\n\n> Takeaway: long prefills stall decoding users. Measure ITL p99 with mixed traffic to see it; averages hide it.", "s": "Run a steady stream of short chat requests and measure ITL. Then inject occasional 16k-token prompts while keeping the chat load constant. Without chunked prefill, each long prompt's prefill runs in a single step lasting hundreds of milliseconds, so ITL p99 for the chat users jumps sharply while their p50 barely moves. The ITL tail (and per-step time trace) reveals it."}, {"id": "10.02", "t": "Chunked Prefill & Choosing the Chunk Size", "f": "https://fanout.sh/inference-eng/curriculum/10-02", "k": ["prefill", "chunked"], "x": [], "r": [["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Chunked prefill and stall-free batching."], ["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Chunked prefill settings."]], "q": "How does chunked prefill fix interference, and what is the cost of a chunk size that is too small?", "n": ["Split long prompts into chunks; run one chunk per step with decodes.", "Step time stays bounded, so ITL stays smooth.", "In vLLM the chunk size is effectively max_num_batched_tokens minus decode tokens.", "Too small: slower TTFT and lower prefill efficiency. Too large: stalls return.", "Pick the largest chunk that keeps step time under your ITL target."], "ak": "", "a": "## How it works\n%%flow A 6k prompt with a 2k chunk budget.\nStep 1: decodes + chunk 1 -> Step 2: decodes + chunk 2 -> *Step 3: decodes + chunk 3 -> First token\n%%\n\nEach chunk's attention covers itself and all earlier chunks of the same prompt (already in the KV cache). Decoding sequences get one token every step.\n\n## Choosing the size\n| Chunk budget | Step time | TTFT of long prompt | ITL p99 of others |\n| 512 | short | high | best |\n| 2,048 | moderate | moderate | good |\n| 8,192 | long | low | worse |\n| unlimited | very long | lowest | stalls |\n\nRule of thumb: measure step time for a full chunk plus your typical decode batch. Pick the largest chunk whose step time keeps ITL under target.\n\n## Efficiency notes\n- Matmuls with a few hundred tokens or more already use the GPU well, so 512 to 2k chunks lose little efficiency.\n- Each chunk re-reads the KV of earlier chunks for attention, adding some cost for very long prompts.\n- Chunked prefill pairs naturally with a token budget scheduler: decodes first, then prefill chunks with whatever budget remains.\n\n> Takeaway: chunked prefill bounds step time so decodes never stall. Size the chunk from your ITL target, then accept the resulting TTFT.", "s": "It splits a long prompt into chunks of at most N tokens and processes one chunk per step alongside the ongoing decodes, so each step stays bounded and decoding users keep getting tokens. A chunk that is too small means many steps to finish the prompt, which raises that request's TTFT and loses some prefill efficiency, since small matmuls use the GPU less well and attention over previous chunks must be re-read each step."}, {"id": "10.03", "t": "Find Repeated Prefix Computation", "f": "https://fanout.sh/inference-eng/curriculum/10-04", "k": ["prefix"], "x": [], "r": [["SGLang: Efficient Execution of Structured Language Model Programs", "https://arxiv.org/abs/2312.07104", "Prefix sharing in LLM programs."], ["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "Block-level prefix matching."]], "q": "How would you measure how much prefill work in your traffic is repeated?", "n": ["Many requests share prefixes: system prompts, few-shot examples, documents, chat history.", "Each repeated prefix is prefill work that could be skipped.", "Measure: longest common prefix with earlier requests, in tokens, at block granularity.", "The share of repeated prompt tokens bounds the benefit of prefix caching.", "Prompt layout matters: put shared content first, variable content last."], "ak": "", "a": "## Where repetition comes from\n- **System prompts**: the same instructions on every request.\n- **Few-shot examples**: fixed examples before the question.\n- **Multi-turn chat**: each turn resends the whole conversation.\n- **RAG**: popular documents retrieved for many queries.\n- **Agents**: tool descriptions and long scratchpads repeated across calls.\n\n## Measuring it\n```\nseen = PrefixTrie(block_size=16)\nreused = total = 0\nfor prompt in logs:\n    ids = tokenize(prompt)\n    reused += seen.longest_match(ids)\n    total += len(ids)\n    seen.insert(ids)\nprint(\"max reuse\", reused / total)\n```\n\n## Layout matters\nCaching works on exact token prefixes. If you put a timestamp or user id at the start of the prompt, nothing after it can match. Put stable content first:\n\n| Order | Prefix reuse |\n| user id, system prompt, question | none |\n| system prompt, user id, question | system prompt reused |\n| system prompt, docs, history, question | most of the prompt reused |\n\n> Takeaway: measure repeated prefixes in real traffic before turning on caching. Reorder prompts so shared content comes first.", "s": "From logs, tokenize each request's prompt and compute, for each request, the length of the longest prefix matching any earlier request (at block granularity, e.g. 16 tokens). The sum of matched tokens divided by total prompt tokens is the maximum achievable prefix hit rate; it is an upper bound because cache size and eviction limit what is actually kept."}, {"id": "10.04", "t": "Automatic Prefix Caching", "f": "https://fanout.sh/inference-eng/curriculum/10-05", "k": ["prefix", "caching"], "x": [], "r": [["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "Hash chain and eviction."], ["SGLang paper (RadixAttention)", "https://arxiv.org/abs/2312.07104", "Tree-based alternative."]], "q": "How does block-hash-based prefix caching decide that a new request can reuse cached KV, and why must the hash include the parent block?", "n": ["Keep KV blocks of finished requests and index them by a hash of content plus prefix.", "New requests reuse the longest cached prefix and prefill only the rest.", "Hash = f(parent hash, block tokens, extras like LoRA id or image hash).", "Eviction: LRU among blocks with refcount zero.", "Benefit: lower TTFT and more throughput, proportional to hit rate."], "ak": "", "a": "## Mechanism\n%%flow Prefix cache lookup.\nPrompt -> Split into full blocks -> Hash chain h1, h2, h3... -> *Lookup each hash -> Reuse hits, prefill the rest\n%%\n\nEach block's hash covers the block's tokens and the parent block's hash. Two prompts that agree on the first 1,000 tokens share the first 62 block hashes (with 16-token blocks).\n\nExtra keys go into the hash too: LoRA adapter id, multimodal input hashes, and sometimes a cache salt for tenant isolation.\n\n## Eviction\nCached blocks with no active users are kept in an LRU list. When the allocator needs blocks and the free list is empty, it evicts the least recently used cached block. Cached blocks cost nothing until memory is needed.\n\n## Effect\n| Hit rate (prompt tokens) | TTFT effect | Throughput effect |\n| 0% | none (tiny overhead) | none |\n| 50% | about half the prefill | noticeable gain on prefill-heavy loads |\n| 90% | prefill mostly skipped | large gain for RAG, agents, chat |\n\n## Caveats\n- Only full blocks match; the last partial block is always recomputed.\n- Cached blocks compete with active requests for memory.\n- Metrics to watch: prefix cache hit rate and query rate on /metrics.\n\n> Takeaway: hash-chained blocks let new requests reuse the KV of any earlier matching prefix. Hit rate is the number that predicts the gain.", "s": "The prompt is split into full blocks; each block's hash is computed from its tokens plus the hash of the previous block. The engine looks up each hash in a table of cached blocks and reuses blocks until the first miss. Including the parent hash is required because a block's K and V depend on all earlier tokens, so identical tokens after different prefixes produce different KV."}, {"id": "10.05", "t": "Shared Prompts, RAG Context & Multi-Turn Reuse", "f": "https://fanout.sh/inference-eng/curriculum/10-06", "k": ["prefix", "rag"], "x": [], "r": [["Mooncake: A KVCache-centric Disaggregated Architecture", "https://arxiv.org/abs/2407.00079", "Large-scale KV reuse in production chat."], ["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "How reuse works."]], "q": "In a multi-turn chat, why does prefix caching help each new turn, and what can break it between turns?", "n": ["System prompts: one prefix shared by all requests; almost always hits.", "Multi-turn: each turn's prompt starts with the previous prompt and reply.", "RAG: shared only if documents appear in the same order and position.", "Routing affects hit rate: the same conversation should go to the same replica.", "Template and history-trimming changes silently break reuse."], "ak": "", "a": "## Three patterns\n| Pattern | What repeats | Typical hit rate |\n| Shared system prompt | first 500 to 3,000 tokens | high |\n| Multi-turn chat | whole history before the new message | very high if routed sticky |\n| RAG | popular documents | depends on ordering |\n\n## Multi-turn details\nTurn n's prompt equals turn n-1's prompt plus the assistant reply plus the new user message. The reply's KV was produced during decode, so it is already in the cache, as long as it has not been evicted.\n\n## Making RAG cacheable\n- Put retrieved documents in a stable order (for example by document id).\n- Place each document at a consistent position after the system prompt.\n- Note that a document only reuses cache when everything before it also matches. Research on position-independent caching exists but standard engines need exact prefixes.\n\n## Routing\nWith several replicas, a random load balancer splits a conversation across replicas and destroys reuse. Session-sticky or prefix-aware routing (Module 23) keeps related requests together.\n\n## Things that break reuse\n- Changing whitespace or template rendering between turns.\n- Trimming early history: everything after the trim point changes position.\n- Injecting a timestamp near the start.\n\n> Takeaway: shared prompts, multi-turn history and RAG documents can all hit the cache, if prompts are laid out stably and requests are routed to where the cache lives.", "s": "Each turn resends the whole conversation, so everything before the new user message matches the previous turn's prompt plus its generated reply, which is already in the cache. It breaks if the earlier cache entries were evicted (long gaps or memory pressure), if the request lands on a different replica, or if the client changes earlier content (trimming history, re-rendering the template differently)."}, {"id": "10.06", "t": "RadixAttention, Eviction & Cache Churn", "f": "https://fanout.sh/inference-eng/curriculum/10-07", "k": ["prefix", "sglang"], "x": [], "r": [["SGLang: Efficient Execution of Structured Language Model Programs", "https://arxiv.org/abs/2312.07104", "RadixAttention."], ["SGLang GitHub repository", "https://github.com/sgl-project/sglang", "Implementation."]], "q": "What does a radix tree give SGLang's prefix cache that a flat hash table of blocks does not, and what is cache churn?", "n": ["RadixAttention keeps cached KV in a radix tree keyed by token sequences.", "Longest-prefix match is a tree walk; shared prefixes are shared nodes.", "Eviction removes least recently used leaves first, keeping hot shared roots.", "Cache-aware scheduling: run requests with shared prefixes close together.", "Churn: working set larger than cache; hit rate drops and eviction overhead rises."], "ak": "", "a": "## The radix tree\nEach edge holds a run of tokens and points to their KV blocks. A request's prompt is matched by walking from the root. Branches appear where prompts diverge.\n\n%%flow A radix tree of cached prompts.\nRoot -> *System prompt -> Doc A -> Question 1\nRoot -> *System prompt -> Doc B -> Question 2\n%%\n\n## Eviction\nLeaves are evicted first, least recently used. Shared nodes near the root (system prompts) stay because many requests keep them warm.\n\n## Cache-aware scheduling\nSGLang can reorder the waiting queue to favor requests whose prefixes are already cached (longest-prefix-match first). This raises hit rate but can hurt fairness; engines bound the reordering.\n\n## Churn\nIf the set of prefixes in active use is bigger than the cache, entries are evicted before reuse.\n| Working set vs cache | Behavior |\n| smaller | high hit rate, stable |\n| similar | hit rate sensitive to traffic order |\n| much larger | low hit rate, churn |\n\nSigns: hit rate falling as load rises, eviction counts high. Fixes: more KV memory (FP8 KV, more GPUs), prefix-aware routing so each replica sees a smaller working set, or tiered cache to CPU (Module 20).\n\n> Takeaway: a radix tree makes prefix matching and LRU eviction natural. Hit rate depends on the working set fitting the cache; route and size to avoid churn.", "s": "A radix tree stores cached sequences as shared paths, so finding the longest matching prefix is a single walk, sharing is explicit, and eviction can remove leaves (least recently used) without breaking parents still in use. It also helps schedule requests that share a prefix together. Cache churn is when entries are evicted before they are reused, because the working set is larger than the cache, so you pay to store KV that never hits."}, {"id": "10.07", "t": "Lab: Optimize a Mixed Long-Prompt Workload", "f": "https://fanout.sh/inference-eng/curriculum/10-08", "k": ["lab"], "x": ["Lab"], "r": [["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Chunked prefill."], ["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "Prefix caching."]], "q": "For a workload of chat plus long RAG prompts with a shared system prompt, which two features do you enable and what do you measure to prove each helped?", "n": ["Workload: chat traffic plus long RAG prompts sharing a system prompt and some documents.", "Run four configs: neither feature, chunked prefill, prefix caching, both.", "Measure chat ITL p99, RAG TTFT p95, hit rate and goodput.", "Tune the chunk budget once both are on.", "Report each feature's contribution separately."], "ak": "", "a": "## Workload\n- 70% chat: 2k-token shared system prompt + short user message, 300-token output.\n- 30% RAG: same system prompt + 6k tokens of documents drawn from a pool of 50, 150-token output.\n- Open-loop Poisson arrivals at your expected rate.\n\n## Runs\n| Config | Chunked prefill | Prefix caching |\n| A | off | off |\n| B | on | off |\n| C | off | on |\n| D | on | on |\n\n## Expected pattern\n| Metric | A | B | C | D |\n| Chat ITL p99 | bad | good | moderate | good |\n| RAG TTFT p95 | high | higher | low | low |\n| Hit rate | 0 | 0 | high | high |\n| Goodput | low | medium | medium | best |\n\n## Then tune\nWith D, sweep the chunk budget (1k, 2k, 4k) and pick the one with the best goodput.\n\n## Report\nTable of the four configurations, the tuned result, and a sentence per feature explaining its effect with metrics (hit rate, step-time trace).\n\n> Takeaway: chunked prefill protects decode latency; prefix caching removes repeated prefill. On mixed long-prompt traffic you want both, measured separately.", "s": "Chunked prefill, proven by lower ITL p99 for chat users when long prompts arrive; and prefix caching, proven by the prefix hit rate metric and lower TTFT for requests with the shared system prompt or repeated documents. Measure each alone and together against the same workload and SLO."}]}, {"n": "11", "name": "Quantization & KV Compression", "lessons": [{"id": "11.01", "t": "Precision, Memory & Hardware Support", "f": "https://fanout.sh/inference-eng/curriculum/11-01", "k": ["quantization"], "x": [], "r": [["NVIDIA: Hopper architecture tuning guide", "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html", "Datatype support on H100."], ["A Survey of Quantization Methods for Efficient Neural Network Inference", "https://arxiv.org/abs/2103.13630", "Background on quantization."]], "q": "Why does quantizing weights from BF16 to INT4 speed up decode on almost any GPU, but may not speed up prefill?", "n": ["Fewer bits per value: less memory, less bandwidth, sometimes faster math.", "Weight-only quantization (W4A16, W8A16) helps memory-bound decode.", "Weight and activation quantization (W8A8, FP8) can also speed compute-bound prefill, if tensor cores support it.", "Hardware support varies: FP8 on Ada/Hopper and newer, FP4 on Blackwell.", "Always measure quality; the cheapest model that fails your eval is not a saving."], "ak": "", "a": "## Formats\n| Format | Bits | Typical use |\n| FP32 | 32 | rarely used for LLM inference |\n| BF16 / FP16 | 16 | default serving precision |\n| FP8 (E4M3) | 8 | weights + activations on Hopper and newer |\n| INT8 | 8 | weights, or weights + activations with SmoothQuant |\n| INT4 / FP4 | 4 | weights only (INT4) or native on Blackwell (FP4) |\n\n## What gets quantized\n- **Weights only** (W4A16): store weights in 4 bits, dequantize to BF16 inside the matmul. Saves memory and bandwidth.\n- **Weights and activations** (W8A8): both in 8 bits, use INT8 or FP8 tensor cores. Faster math as well.\n- **KV cache**: store K and V in FP8 or INT8. Saves KV memory and attention bandwidth.\n\n## Hardware support\nTensor cores only accelerate formats they implement. A100 has INT8 and BF16 but no FP8. H100 adds FP8. Blackwell adds FP4. On hardware without native support, a format can still save memory, but computation runs in a wider format after conversion.\n\n## Where speed comes from\n| Phase | Bound by | Gains from |\n| Decode, small batch | weight bandwidth | fewer weight bits |\n| Decode, large batch | mix | weight + KV bits |\n| Prefill | compute | low-precision tensor cores |\n\n> Takeaway: quantization cuts bytes and, with hardware support, FLOP cost. Match the format to the phase you are bound by and to what your GPU can actually compute.", "s": "Decode is memory bound, so reading 4 times fewer weight bytes per step directly cuts step time, even if the GPU dequantizes to BF16 before the math. Prefill is compute bound, and if the hardware has no INT4 tensor core path, the math still runs in BF16 plus dequantization overhead, so prefill may be no faster or even slower."}, {"id": "11.02", "t": "BF16, FP8, INT8 & 4-Bit Inference", "f": "https://fanout.sh/inference-eng/curriculum/11-02", "k": ["quantization"], "x": [], "r": [["LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale", "https://arxiv.org/abs/2208.07339", "Outliers and mixed precision."], ["FP8 Formats for Deep Learning", "https://arxiv.org/abs/2209.05433", "E4M3 and E5M2 definitions."]], "q": "Compare per-tensor, per-channel and per-group scaling for weight quantization, and say which INT4 methods usually use.", "n": ["Quantize: q = round(x / scale); dequantize: x = q x scale.", "Scale granularity: per tensor, per channel, per group, per token (activations).", "FP8 has an exponent, so it handles range better than INT8 at the same bits.", "4-bit needs fine-grained group scales to keep accuracy.", "Outlier channels in activations are the main obstacle to 8-bit activations."], "ak": "", "a": "## The basic operation\n```\nscale = max(|x|) / q_max          # e.g. q_max = 127 for INT8\nq = round(x / scale)              # store q in low precision\nx_hat = q * scale                 # dequantize\n```\nError comes from rounding and from outliers that stretch the scale.\n\n## Granularity\n| Granularity | One scale per | Accuracy | Overhead |\n| Per tensor | whole matrix | lowest | none |\n| Per channel | output row | good | tiny |\n| Per group (e.g. 128) | block of inputs | best at 4-bit | scales ~3% of weights |\n| Per token | activation row | good for activations | computed at runtime |\n\n## FP8 vs INT8\nFP8 E4M3 has 4 exponent bits, so small and large values both keep relative precision. INT8 spaces values evenly, so outliers hurt more. In practice, FP8 with per-tensor or per-channel scales often matches BF16 closely, which is why FP8 W8A8 is a common default on H100-class GPUs.\n\n## 4-bit\nUniform 4-bit has only 16 levels. Group-wise scales (and sometimes zero points) keep accuracy usable. Calibration-based methods (GPTQ, AWQ, next lesson) choose the quantized values carefully.\n\n## Typical quality impact\n| Format | Typical quality vs BF16 |\n| FP8 W8A8 | near lossless on most tasks |\n| INT8 W8A8 (SmoothQuant) | small loss |\n| INT4 W4A16 (AWQ/GPTQ) | small to moderate loss, task dependent |\n\nTreat these as starting expectations; your eval decides.\n\n> Takeaway: precision loss comes from rounding and outliers. Finer scales and FP formats fight both. 8-bit is usually safe; 4-bit needs good methods and checking.", "s": "Per-tensor uses one scale for the whole matrix: cheap but outliers force a coarse scale for everything. Per-channel uses one scale per output channel: better accuracy, still cheap. Per-group uses one scale per small group (e.g. 128 weights) along the input dimension: best accuracy at low bits but more scale storage and dequant work. INT4 methods like GPTQ and AWQ typically use per-group scaling with group size 128."}, {"id": "11.03", "t": "AWQ, GPTQ & SmoothQuant", "f": "https://fanout.sh/inference-eng/curriculum/11-03", "k": ["quantization"], "x": [], "r": [["GPTQ", "https://arxiv.org/abs/2210.17323", "Accurate post-training quantization."], ["AWQ", "https://arxiv.org/abs/2306.00978", "Activation-aware weight quantization."], ["SmoothQuant", "https://arxiv.org/abs/2211.10438", "Smoothing activation outliers for W8A8."]], "q": "In one sentence each, what problem do GPTQ, AWQ and SmoothQuant solve?", "n": ["All three are post-training methods using a small calibration set.", "GPTQ: quantize column by column, update remaining weights to cancel error.", "AWQ: protect salient channels by scaling them before quantization.", "SmoothQuant: shift activation outliers into weights to enable W8A8.", "Calibration data should resemble your traffic."], "ak": "", "a": "## GPTQ\nQuantizes one layer at a time. For each column of weights, round it, measure the error that rounding introduces on calibration activations, and adjust the not-yet-quantized columns to compensate. Uses an approximation of the Hessian (second-order information). Produces good INT4 and INT3 weights.\n\n## AWQ\nObserves that a small share of weight channels (about 1%) matter most, identified by large activation magnitudes. Instead of keeping them in high precision, AWQ multiplies those channels by a scale before quantization (and divides the activations correspondingly), so they get finer effective precision. Simple, fast, and robust for INT4.\n\n## SmoothQuant\nTargets W8A8. Activations have outlier channels that make per-tensor INT8 inaccurate. SmoothQuant applies a per-channel scale `s` so `X W = (X / s)(s W)`, moving difficulty from activations into weights, which tolerate it better. Then both are quantized to INT8.\n\n## Comparison\n| Method | Quantizes | Typical bits | Main idea |\n| GPTQ | weights | 4 (or 3) | error compensation |\n| AWQ | weights | 4 | protect salient channels |\n| SmoothQuant | weights + activations | 8 | migrate outliers |\n\n## Practical notes\n- Pre-quantized checkpoints for popular models are widely available; check the format your engine supports.\n- Use calibration text similar to your traffic (code for code models).\n- Kernel availability (Marlin and similar for INT4) decides real speed.\n\n> Takeaway: GPTQ compensates rounding error, AWQ protects important channels, SmoothQuant tames activation outliers. Pick by bit width and kernel support.", "s": "GPTQ quantizes weights layer by layer, adjusting remaining weights to compensate for rounding error using second-order information from calibration data. AWQ finds the small fraction of weight channels that matter most (by activation magnitude) and scales them up before quantizing so they lose less precision. SmoothQuant moves outlier magnitude from activations into weights with a per-channel scale, so both can be quantized to 8 bits."}, {"id": "11.04", "t": "Quantized GEMM & Dequantization Overhead", "f": "https://fanout.sh/inference-eng/curriculum/11-04", "k": ["kernels", "quantization"], "x": [], "r": [["Marlin: mixed-precision GEMM kernel", "https://github.com/IST-DASLab/marlin", "Fast INT4 x FP16 kernel for batched inference."], ["Horace He: Making Deep Learning Go Brrrr", "https://horace.io/brrr_intro.html", "Compute vs memory bound."]], "q": "Why can a W4A16 model be faster than BF16 at batch 1 but slower at batch 256?", "n": ["A quantized GEMM loads low-bit weights, dequantizes in registers, and multiplies.", "Weight-only kernels win when memory bound (small batch), may lose when compute bound.", "W8A8 FP8 or INT8 kernels use low-precision tensor cores, so they also win when compute bound.", "Kernel quality varies; the format's real speed depends on the kernel your engine picks.", "Benchmark at your actual batch sizes, not just batch 1."], "ak": "", "a": "## Inside a weight-only kernel\n%%flow W4A16 GEMM tile.\nLoad 4-bit weights -> *Dequantize in registers -> BF16 tensor core MMA -> Accumulate FP32\n%%\n\nLoading is cheap (few bytes). Dequantization is extra arithmetic per weight. When memory bound, that arithmetic is free because the kernel is waiting on memory anyway.\n\n## The crossover\n| Batch (tokens) | BF16 GEMM | W4A16 GEMM | W8A8 FP8 GEMM |\n| 1 to 16 | memory bound | ~2 to 3.5x faster | ~1.8x faster |\n| 64 to 128 | mixed | ~1.2 to 2x faster | ~1.5x faster |\n| 256+ | compute bound | ~same or slower | ~1.5 to 2x faster |\n\nIllustrative; real numbers depend on the kernel. The shape: weight-only gains shrink as batch grows; FP8 W8A8 gains hold because the math itself is faster.\n\n## Choosing\n- Low concurrency, memory-limited GPUs: INT4 weight-only is great.\n- High-throughput serving on H100-class GPUs: FP8 W8A8 is often the better default.\n- Always check which kernel the engine selects; the startup log usually says.\n\n> Takeaway: weight-only quantization wins when memory bound and fades when compute bound. Activation quantization keeps winning only with tensor core support. Benchmark at your batch sizes.", "s": "At batch 1 the matmul is memory bound, so reading 4-bit weights cuts time nearly 4 times and dequantization hides under memory latency. At batch 256 the matmul becomes compute bound; the math still runs in BF16 and dequantizing each weight tile adds instructions, so the kernel can run slower than a plain BF16 GEMM."}, {"id": "11.05", "t": "KV Cache Quantization", "f": "https://fanout.sh/inference-eng/curriculum/11-05", "k": ["kv-cache", "quantization"], "x": [], "r": [["KIVI: A Tuning-Free Asymmetric 2bit Quantization for KV Cache", "https://arxiv.org/abs/2402.02750", "Low-bit KV with per-channel keys."], ["vLLM: Quantized KV cache", "https://docs.vllm.ai/en/latest/features/quantization/quantized_kvcache.html", "FP8 KV in practice."]], "q": "What are the two benefits of an FP8 KV cache, and what can go wrong?", "n": ["KV cache often uses more memory than weights at high concurrency or long context.", "FP8 KV halves memory and attention bandwidth.", "Keys have per-channel outliers; values are smoother. Methods like KIVI quantize them differently.", "Scales: per tensor (simple), per head or per token (more accurate).", "Check quality on long-context tasks, where KV error accumulates."], "ak": "", "a": "## Why quantize KV\nAt 128 KB per token in BF16, 200 sequences of 4k tokens hold 100 GB of KV. That is several times the weights of an 8B model. Halving KV bytes doubles capacity and halves decode attention traffic.\n\n## FP8 KV\nStore K and V in FP8 (E4M3) with scales. The attention kernel loads FP8, converts, and computes. Most modern engines support it on Ada, Hopper and newer GPUs.\n\n## Lower bits\nResearch methods push to 4 or 2 bits:\n- Keys have outlier channels; quantize them per channel.\n- Values are smoother; quantize them per token.\n- Keep the most recent tokens in full precision.\n\nThese need specialized kernels and are less common in production engines.\n\n## Measuring impact\n| Check | Why |\n| KV tokens at startup | confirm capacity doubled |\n| Long-context accuracy (needle tests, long QA) | errors accumulate over length |\n| Decode TPOT at long context | attention bandwidth savings |\n| Kernel used | avoid slow fallbacks |\n\n> Takeaway: KV quantization is often the cheapest capacity win. FP8 is the safe default; lower bits need special handling of key outliers and careful evaluation.", "s": "It halves KV memory, roughly doubling the number of tokens that fit (more concurrency or longer context), and it halves bytes read by decode attention, speeding long-context decode. Things that can go wrong: quality loss if scales are poor (especially for keys with outlier channels), attention kernels without FP8 support falling back to slow paths, and calibration needed for per-tensor scales."}, {"id": "11.06", "t": "Measure Capacity & Performance Changes", "f": "https://fanout.sh/inference-eng/curriculum/11-06", "k": ["quantization", "benchmarking"], "x": [], "r": [["vLLM: Quantization", "https://docs.vllm.ai/en/latest/features/quantization/index.html", "Supported formats and hardware."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Sweep tool."]], "q": "After switching to FP8 weights, throughput at batch 1 improved 1.7 times but SLO-safe capacity improved only 1.2 times. Give plausible explanations.", "n": ["Measure quantization at three levels: kernel, single-request latency, SLO-safe capacity.", "Gains at batch 1 rarely equal gains at production load.", "Freed memory helps only if KV was the constraint.", "Report capacity and goodput, not just tokens per second at one point.", "Keep the same workload and SLO as the baseline."], "ak": "", "a": "## Three levels of measurement\n| Level | Question | Tool |\n| Kernel | is the GEMM faster? | micro-benchmark |\n| Request | did TTFT/TPOT improve? | single-request run |\n| System | did SLO-safe capacity improve? | rate sweep |\n\nOnly the system level answers whether the change saves money.\n\n## Why gains shrink at the system level\n- GEMMs are only part of step time; attention, norms, sampling and CPU work stay the same.\n- At production batch sizes, weight-only gains shrink.\n- Capacity may be bound by TTFT, not decode.\n- More free memory only helps if KV usage was near full.\n\n## A good report\n| Metric | BF16 | FP8 | Change |\n| Weights GB | 16 | 8.5 | -47% |\n| KV tokens | 330k | 390k | +18% |\n| TPOT batch 1 | 7.0 ms | 4.3 ms | -39% |\n| TTFT p95 @ load | 520 ms | 410 ms | -21% |\n| SLO-safe req/s | 9.0 | 11.0 | +22% |\n\n> Takeaway: measure quantization where it pays: SLO-safe capacity on your workload. Kernel and batch-1 speedups are upper bounds.", "s": "At the operating load the batch is large and closer to compute bound, where FP8 gains are smaller than at batch 1; capacity may be limited by TTFT (prefill) or the scheduler rather than decode s
