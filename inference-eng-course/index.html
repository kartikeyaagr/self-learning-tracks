ut to the tool schema prevents malformed calls.\n\n## Risks\n- Overly strict grammars can push the model into unnatural tokens.\n- Complex schemas (deep recursion, large enums) cost more per step.\n- Prefix caching still works; only sampling changes.\n\n| Metric | Unconstrained | Constrained |\n| JSON validity | 95 to 99% | 100% |\n| TPOT overhead | 0 | small |\n\n> Takeaway: constrained decoding masks invalid tokens each step, guaranteeing format at small cost when masks are precomputed and overlapped.", "s": "A grammar (from a JSON schema or regex) is compiled into a state machine. At each step, the engine computes which vocabulary tokens are allowed from the current state and masks the rest to minus infinity before sampling, so only valid continuations can be chosen. The cost is computing that mask each step (precomputation and caching keep it small) and occasionally constraining the model away from its preferred tokens, which can affect quality."}, {"id": "26.02", "t": "Multi-LoRA Serving", "f": "https://fanout.sh/inference-eng/curriculum/26-02", "k": ["lora"], "x": [], "r": [["S-LoRA", "https://arxiv.org/abs/2311.03285", "Serving thousands of LoRA adapters."], ["Punica", "https://arxiv.org/abs/2310.18547", "SGMV kernel for multi-tenant LoRA."], ["LoRA paper", "https://arxiv.org/abs/2106.09685", "Low-rank adaptation."]], "q": "How can one engine batch requests for 50 different LoRA adapters in the same step?", "n": ["LoRA adds low-rank matrices A (d x r) and B (r x d) to selected layers.", "Multi-LoRA serving shares base weights across all adapters.", "Batched kernels apply different adapters to different requests in one step.", "Adapter memory is small; keep many on GPU, page others from CPU.", "Overhead grows with rank and number of distinct adapters per batch."], "ak": "", "a": "## LoRA in one line\n```\ny = x W + (x A) B * scale    # A: d x r, B: r x d, r small (8 to 64)\n```\n\n## Batching across adapters\n%%flow One linear layer with mixed adapters.\nBatch tokens -> Base GEMM (shared W) -> *Segmented LoRA kernel (per-request A, B) -> Add -> Output\n%%\n\n## Memory\nA rank-16 adapter on all attention and MLP projections of an 8B model is tens of MB. Hundreds fit in GPU memory beside the base model; thousands can live in CPU memory and be loaded on demand.\n\n## Performance\n| Factor | Effect |\n| Rank | higher rank, more FLOPs |\n| Distinct adapters per batch | more segments, slight overhead |\n| Adapter swaps | latency on first use |\n\n## Cache interaction\nPrefix cache keys must include the adapter id, since KV differs per adapter.\n\n> Takeaway: multi-LoRA serving shares the base model and applies per-request adapters with batched low-rank kernels. Hundreds of fine-tunes can share one GPU pool.", "s": "The base model weights are shared; each request carries an adapter id. For each linear layer, the base matmul runs on the whole batch, then a batched low-rank kernel (like SGMV or BGMV) applies each request's own A and B matrices to its tokens and adds the result. Adapters live in GPU memory (or are swapped in from CPU) in a pool, so many can be active at once."}, {"id": "26.03", "t": "Vision-Language & Multimodal Inference", "f": "https://fanout.sh/inference-eng/curriculum/26-03", "k": ["multimodal"], "x": [], "r": [["LLaVA: Visual Instruction Tuning", "https://arxiv.org/abs/2304.08485", "A common VLM architecture."], ["vLLM: Multimodal inputs", "https://docs.vllm.ai/en/latest/features/multimodal_inputs.html", "Serving multimodal models."]], "q": "Why do images often dominate TTFT in vision-language models, and what can you cache?", "n": ["VLMs: a vision encoder turns images into embeddings, projected into the LLM's token space.", "Images become many tokens (hundreds to thousands each), inflating prefill.", "Encoder compute runs on GPU too; schedule it alongside LLM steps.", "Cache encoder outputs and image-token KV by image hash.", "Preprocessing (decode, resize) on CPU can bottleneck; parallelize it."], "ak": "", "a": "## Pipeline\n%%flow VLM request.\nImage -(CPU decode, resize)-> Vision encoder (GPU) -> Projector -> *Image tokens + text tokens -> LLM prefill -> Decode\n%%\n\n## Cost\n| Item | Typical |\n| Tokens per image | 256 to several thousand (resolution dependent) |\n| Encoder time | milliseconds to tens of ms per image |\n| Extra prefill | same as that many text tokens |\n\n## Optimizations\n- **Encoder cache**: hash images; reuse embeddings.\n- **Prefix cache with image hashes**: reuse KV for repeated images and prompts.\n- **Resolution control**: fewer tiles, fewer tokens.\n- **Separate encoder workers**: run encoders on separate GPUs at scale (encoder disaggregation).\n- **CPU preprocessing**: thread pools to avoid stalling the engine loop.\n\n> Takeaway: in VLMs, images are expensive prompts. Control resolution, cache embeddings and KV by image hash, and keep preprocessing off the critical path.", "s": "Each image is encoded by a vision encoder into hundreds or thousands of tokens, and both encoding and the prefill over those image tokens take time, often more than the text prompt. You can cache the encoder output per image (by hash) and, through the prefix cache keyed with image hashes, the KV for image tokens, so repeated images skip both steps."}, {"id": "26.04", "t": "Agentic & Multi-Turn Inference", "f": "https://fanout.sh/inference-eng/curriculum/26-04", "k": ["agents"], "x": [], "r": [["SGLang paper", "https://arxiv.org/abs/2312.07104", "Programs with many LLM calls sharing prefixes."], ["Mooncake", "https://arxiv.org/abs/2407.00079", "KV reuse for long multi-turn contexts."]], "q": "How do agent workloads differ from chat for an inference service?", "n": ["Agents: many dependent calls per task, long shared prefixes, short outputs.", "Prefix caching and session-affinity routing give large wins.", "Optimize per-call TTFT and E2E; task latency adds up.", "Tool execution gaps: keep KV warm (or offloaded) between calls.", "Priorities: an agent's later calls should not starve behind new tasks."], "ak": "", "a": "## Workload shape\n| Property | Chat | Agent |\n| Calls per task | 1 | 5 to 100+ |\n| Prompt length | short to medium | long and growing |\n| Output | medium to long | often short (tool calls) |\n| Reuse | moderate | very high |\n| Key metric | TTFT, TPOT | per-call E2E, task time |\n\n## What helps\n- **Prefix caching** with sticky routing: most of each call's prompt is the previous call's prompt.\n- **KV retention between calls**: tool calls take seconds; evicting the session's KV in between wastes prefill. Offload to CPU instead of dropping.\n- **Short-output optimization**: TTFT dominates; prefill speed and caching matter more than decode.\n- **Structured output** for reliable tool calls.\n- **Scheduling**: favor in-progress tasks to finish them.\n\n> Takeaway: agent traffic is long, repetitive prompts with short outputs in dependent chains. Prefix reuse, KV retention and TTFT matter most.", "s": "Agents make many sequential calls per task, each with a long, growing prompt (instructions, tool definitions, history, tool outputs) and often short outputs, and the next call waits for the previous one plus tool execution. So prefix reuse is very high, TTFT and E2E per call matter more than streaming speed, and total task latency is the sum of many calls. Bursty fan-out (parallel tool calls) is also common."}, {"id": "26.05", "t": "Reasoning Model Inference", "f": "https://fanout.sh/inference-eng/curriculum/26-05", "k": ["reasoning"], "x": [], "r": [["DeepSeek-R1", "https://arxiv.org/abs/2501.12948", "Reasoning model trained with RL."], ["vLLM: Reasoning outputs", "https://docs.vllm.ai/en/latest/features/reasoning_outputs.html", "Separating reasoning content in the API."]], "q": "A reasoning model generates 5,000 thinking tokens before a 200-token answer. What does this do to capacity and what levers exist?", "n": ["Reasoning models produce long hidden or visible thinking before answers.", "Workload becomes decode-heavy with very long outputs.", "KV per request grows with thinking length; concurrency drops.", "Levers: thinking budgets, speculative decoding, FP8 KV, decode-optimized pools.", "Measure cost per answered request, not per token."], "ak": "", "a": "## Shape\n| Metric | Chat model | Reasoning model |\n| Output tokens | 300 | 3,000 to 30,000 |\n| E2E | seconds | tens of seconds to minutes |\n| KV per request at end | small | large |\n| Bottleneck | mixed | decode |\n\n## Levers\n- **Budget**: cap thinking tokens or expose effort levels.\n- **Decode speed**: speculative decoding works well (reasoning text often has high acceptance); quantization.\n- **KV**: FP8 KV, more decode GPUs, disaggregation with decode-heavy pools.\n- **Timeouts**: E2E timeouts must allow long runs.\n- **UX**: stream reasoning or progress so TTFT stays meaningful.\n\n## Economics\nMeasure cost per solved task. A reasoning model may cost 10 times more per request but replace several retries or a larger model.\n\n> Takeaway: reasoning turns serving into long-output decode. Plan for KV growth, budget thinking tokens and optimize decode speed.", "s": "Output tokens grow 25 times, so decode time, KV memory per request (the thinking stays in context) and cost all rise sharply; concurrency per GPU falls and E2E latency becomes tens of seconds. Levers: decode speed optimizations (speculative decoding, quantization), thinking budgets or effort settings, larger KV capacity (FP8 KV, offload), and streaming the thinking or a summary so users see progress."}, {"id": "26.06", "t": "Batch Inference", "f": "https://fanout.sh/inference-eng/curriculum/26-06", "k": ["batch"], "x": [], "r": [["vLLM: Offline inference", "https://docs.vllm.ai/en/latest/serving/offline_inference.html", "Python API for batch jobs."], ["OpenAI Batch API guide", "https://platform.openai.com/docs/guides/batch", "Asynchronous batch interface design."]], "q": "How should you configure an engine differently for offline batch inference compared with interactive serving?", "n": ["Batch jobs care about throughput and cost, not per-request latency.", "Use the offline API; skip HTTP and streaming overhead.", "Max out batch size and memory; sort or group by length and shared prefix.", "Use preemptible or idle capacity; checkpoint results.", "Measure tokens per dollar for the whole job."], "ak": "", "a": "## Configuration\n| Setting | Interactive | Batch |\n| SLO | TTFT, TPOT | job completion time |\n| max_num_seqs | moderate | high |\n| Token budget | bounded for ITL | large |\n| Interface | HTTP streaming | offline Python API |\n| Memory utilization | safe margin | maximum |\n\n## Ordering inputs\n- Group by shared prefix to maximize cache hits.\n- Mix long and short to keep batches full, or sort by length to reduce tail waste at the end.\n\n## Operations\n- Shard input files; process shards independently.\n- Write results incrementally; resume after preemption.\n- Run on off-peak or spot capacity.\n\n```\nfrom vllm import LLM, SamplingParams\nllm = LLM(model=path, max_num_seqs=512)\nouts = llm.generate(prompts, SamplingParams(max_tokens=256))\n```\n\n> Takeaway: batch inference trades latency for throughput: big batches, prefix grouping, offline APIs and cheap capacity. Measure cost per job.", "s": "Drop latency SLOs and maximize throughput: very large batches (high max_num_seqs and max_num_batched_tokens), no chunked prefill concerns, sort or group inputs by length to reduce waste, maximize prefix sharing by grouping requests with common prefixes, use the offline engine API instead of HTTP, and run at full GPU memory utilization. Checkpoint progress for restartability."}, {"id": "26.07", "t": "RL Rollout Inference", "f": "https://fanout.sh/inference-eng/curriculum/26-07", "k": ["rl"], "x": [], "r": [["verl", "https://github.com/volcengine/verl", "RL training framework using vLLM/SGLang for rollouts."], ["OpenRLHF", "https://github.com/OpenRLHF/OpenRLHF", "RLHF framework with vLLM rollouts."]], "q": "What makes rollout generation in RL training different from production serving?", "n": ["RL training alternates rollout generation and model updates.", "Rollouts: many samples per prompt, high temperature, long outputs.", "Weights update every step: fast weight sync into the engine is essential.", "Long-tail generation lengths stall synchronous training steps.", "Techniques: parallel sampling sharing prompt KV, async or partial rollouts, colocated or separate rollout GPUs."], "ak": "", "a": "## The loop\n%%flow Synchronous RL step.\nPrompts -> *Rollout engine generates n samples each -> Reward / scoring -> Training update -> Sync weights to engine\n%%\n\n## Differences from serving\n| Aspect | Serving | RL rollouts |\n| Weights | fixed | change every step |\n| Samples per prompt | 1 | many |\n| Objective | latency SLO | step throughput |\n| Tail behavior | p99 users | slowest sample blocks step |\n\n## Techniques\n- **Parallel sampling** shares the prompt's KV across samples.\n- **Fast weight sync**: in-place updates over NCCL from trainer to engine, avoiding reload from disk.\n- **Tail handling**: cap lengths, or use asynchronous/partial rollouts so long samples continue into the next step.\n- **Placement**: colocate trainer and engine on the same GPUs (switching memory between them) or use separate rollout GPUs.\n\n> Takeaway: RL rollouts are throughput jobs with changing weights and many samples per prompt. Weight sync speed and length tails decide efficiency.", "s": "Rollouts generate many samples per prompt (for example 8 to 64) with high temperature and often long outputs; weights change every training step, so the inference engine must reload or sync weights quickly; the generation phase blocks training, so the slowest rollout (long tail of lengths) stalls the whole step; and throughput per training step matters, not per-user latency."}, {"id": "26.08", "t": "Diffusion Inference: Denoising & Sampling", "f": "https://fanout.sh/inference-eng/curriculum/26-diffusion-sampling", "k": ["diffusion"], "x": [], "r": [["Denoising Diffusion Probabilistic Models", "https://arxiv.org/abs/2006.11239", "DDPM."], ["Denoising Diffusion Implicit Models", "https://arxiv.org/abs/2010.02502", "DDIM, fewer-step sampling."], ["Hugging Face Diffusers", "https://huggingface.co/docs/diffusers/index", "Pipelines and schedulers."]], "q": "Why does diffusion inference behave so differently from LLM decode in terms of batching and bottlenecks?", "n": ["Diffusion generates by starting from noise and denoising over many steps.", "Each step runs the full network on the whole latent: compute bound.", "Latency is steps x step time; there is no token-by-token streaming.", "Samplers (DDIM, DPM-Solver and others) set how many steps are needed.", "Classifier-free guidance doubles work per step unless batched or distilled."], "ak": "", "a": "## The process\n%%flow Diffusion sampling.\nNoise latent -> *Denoise step 1..N (full network each) -> Clean latent -> VAE decode -> Image\n%%\n\n## Cost structure\n| Factor | Effect |\n| Steps N | linear in latency |\n| Resolution | more latent tokens, attention grows quadratically |\n| Guidance (CFG) | two passes per step (conditional and unconditional) |\n| VAE decode | one-time cost at the end |\n\n## Compared with LLM decode\n| | LLM decode | Diffusion |\n| Work per step | small, memory bound | large, compute bound |\n| State | KV cache grows | fixed latent |\n| Steps | output length (variable) | fixed by sampler |\n| Batching benefit | large | moderate |\n\n## Samplers\nBetter ODE/SDE solvers reach similar quality in 20 to 50 steps where early methods needed 1,000. Distilled models go down to 1 to 4 steps.\n\n> Takeaway: diffusion is a fixed number of heavy, compute-bound steps. Speed comes from fewer steps, cheaper steps and efficient guidance.", "s": "A diffusion model runs a fixed number of denoising steps over the whole image or latent at once, each step a full forward pass of a large network on many spatial tokens. Work per step is large and compute bound, with no growing KV cache. Latency is roughly steps times step time, and batching helps less because each step is already compute heavy."}, {"id": "26.09", "t": "Diffusion Step Budgets & Quality", "f": "https://fanout.sh/inference-eng/curriculum/26-diffusion-budgets", "k": ["diffusion"], "x": [], "r": [["DPM-Solver", "https://arxiv.org/abs/2206.00927", "Fast high-order sampler."], ["Progressive Distillation for Fast Sampling", "https://arxiv.org/abs/2202.00512", "Reducing step counts by distillation."]], "q": "How would you choose the number of denoising steps for a production image service?", "n": ["Fewer steps cut latency linearly but can reduce quality.", "Quality curves flatten: going from 50 to 25 steps often costs little.", "Distilled models trade some quality or flexibility for 1 to 8 steps.", "Measure with automatic metrics plus human or judge preferences.", "Other levers: lower resolution then upscale, caching across steps, quantization."], "ak": "", "a": "## The curve\n| Steps | Latency | Quality (typical shape) |\n| 50 | 1.0x | best |\n| 25 | 0.5x | nearly the same |\n| 10 | 0.2x | small drop |\n| 4 (distilled) | 0.08x | acceptable for many uses |\n\n## Measuring\n- Fixed prompt set covering your product's use.\n- Automatic metrics (FID, CLIP score) and pairwise preference tests.\n- Latency and GPU cost per image.\n\n## Other levers\n- **Step caching**: reuse features across adjacent steps (several research methods).\n- **Quantization**: FP8 for the denoiser.\n- **Resolution**: generate small, upscale.\n- **Guidance**: distilled guidance avoids the second pass.\n\n## Product tiers\nOffer fast previews with few steps and final renders with more.\n\n> Takeaway: step count is the main latency knob in diffusion. Find where the quality curve flattens and pick the smallest budget that meets your bar.", "s": "Generate images for a fixed prompt set at several step counts (for example 4, 8, 20, 30, 50) with your sampler and model, measure quality with automatic metrics (FID or CLIP-based scores) and human or model preference ratings, and measure latency and cost. Choose the smallest step count whose quality is within your acceptance threshold of the best, possibly offering different budgets per tier."}, {"id": "26.10", "t": "Elective Project: Choose One Specialized Workload", "f": "https://fanout.sh/inference-eng/curriculum/26-08", "k": ["project"], "x": ["Project"], "r": [["vLLM documentation", "https://docs.vllm.ai/en/latest/", "Features for most specialized workloads."], ["Hugging Face Diffusers", "https://huggingface.co/docs/diffusers/index", "For the diffusion option."]], "q": "How do you scope an elective project on a specialized workload so it produces a clear result?", "n": ["Choose one workload from this module.", "Define traffic shape and success metric (TTFT, task time, cost per image).", "Baseline on a standard setup.", "Apply two or three targeted optimizations.", "Report gains with quality checks."], "ak": "", "a": "## Options and example targets\n| Workload | Example metric | Example optimizations |\n| Structured output | TPOT overhead, validity | grammar backend, mask caching |\n| Multi-LoRA | adapters per GPU at SLO | adapter pool sizing, rank |\n| VLM | TTFT with images | encoder cache, resolution |\n| Agents | task completion time | prefix caching, sticky routing, KV retention |\n| Reasoning | cost per solved task | speculation, thinking budget |\n| Batch | tokens per dollar | batch size, prefix grouping |\n| RL rollouts | rollout time per step | parallel sampling, tail handling |\n| Diffusion | latency at quality bar | steps, quantization |\n\n## Deliverable\nWorkload definition, baseline, changes, results table, quality check, and a paragraph on what generalizes.\n\n> Takeaway: specialized workloads reward targeted optimizations. Scope tightly, measure the right metric and compare against a clean baseline.", "s": "Pick one workload (for example multi-LoRA, structured output, VLM, agents, reasoning, batch, RL rollouts or diffusion), define its realistic traffic and metric of success, build a baseline on a standard engine, apply two or three targeted optimizations from the lesson, and report the measured gain against the baseline with quality checks."}]}, {"n": "27", "name": "Read an Inference Engine", "lessons": [{"id": "27.01", "t": "Map the vLLM Codebase", "f": "https://fanout.sh/inference-eng/curriculum/27-01", "k": ["vllm", "internals"], "x": [], "r": [["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Source code."], ["vLLM: Architecture overview", "https://docs.vllm.ai/en/latest/design/arch_overview.html", "Official map of components."]], "q": "Which top-level areas of the vLLM repository would you read first to understand request handling, and why?", "n": ["Read the architecture docs first, then the code in request order.", "Key areas: entrypoints, engine/engine core, scheduler, KV cache manager, worker/model runner, attention backends, models, csrc kernels.", "Use a debugger or logging to follow one request.", "Note version: file layout changes between releases.", "Keep a personal map of files and their roles."], "ak": "", "a": "## Reading order\n%%layers vLLM code areas in request order (names change between versions).\nEntrypoints | API server, OpenAI schema, chat templates\nEngine / engine core | main loop, process boundaries, input/output processing\n*Core scheduler | waiting and running queues, token budget, preemption\nKV cache manager | block pool, prefix cache, allocation\nWorker / model runner | batch inputs, forward, sampling, CUDA graphs\nAttention backends | kernel dispatch per backend\nModel executor / models | model definitions, weight loading, layers\ncsrc | custom CUDA kernels\n%%\n\n## How to read\n1. Pin a release tag and check it out.\n2. Read the architecture and design docs.\n3. Start a server with debug logging; send one request.\n4. Set breakpoints in the scheduler's schedule function and the model runner's execute function.\n5. Write your own map: file, main class, what it owns.\n\n## Tips\n- Read tests: they show intended behavior in small examples.\n- Search for metrics names to find where they are computed.\n- Follow config objects to see which flags affect which component.\n\n> Takeaway: read an engine in the order a request travels through it. Pin a version, map files to roles, and confirm with a debugger.", "s": "The entrypoints (OpenAI-compatible API server) to see how requests arrive; the engine and engine core (the main loop and process structure); the core scheduler and KV cache manager (which requests run and where their KV goes); the worker and model runner (input preparation, forward pass, CUDA graphs); and the attention backends and model definitions. That order follows a request."}, {"id": "27.02", "t": "Follow One Request End-to-End", "f": "https://fanout.sh/inference-eng/curriculum/27-02", "k": ["vllm", "internals"], "x": [], "r": [["vLLM: Architecture overview", "https://docs.vllm.ai/en/latest/design/arch_overview.html", "Component map."], ["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Source."]], "q": "What artifacts should you produce from tracing one request through the engine?", "n": ["Trace one request from HTTP arrival to final token.", "Record each component, function and data structure it passes through.", "Note process boundaries and how data crosses them (IPC, shared memory).", "Time each stage with logs or a profiler.", "Produce a sequence diagram you can reuse to debug."], "ak": "", "a": "## Steps\n1. Add log lines (or breakpoints) at: request received, tokenized, added to engine, scheduled first time, first forward, first token sampled, detokenized, sent, finished.\n2. Run one request and collect timestamps.\n3. Write down the data structure at each point.\n\n## Example diagram\n%%seq One request through a modern engine.\nAPI > Engine core : new request (token ids, params)\nEngine core > Scheduler : add to waiting\nScheduler > KV manager : allocate blocks\nScheduler > Model runner : scheduled batch\nModel runner > Engine core : sampled token ids\nEngine core -> API : outputs to detokenize and stream\n%%\n\n## Questions to answer\n- Which process does tokenization run in?\n- How are outputs sent back across processes?\n- Where is the first token's time spent?\n\n> Takeaway: tracing one request with timestamps and data structures turns an unfamiliar codebase into a map you can debug with.", "s": "A sequence diagram of the request across processes and components, with function names; the data structures it is converted into at each stage (request object, scheduled batch, model input tensors, outputs); timestamps of each stage from logs or a profile; and notes on where queueing, allocation, execution and detokenization happen."}, {"id": "27.03", "t": "Follow the Scheduler & Request State", "f": "https://fanout.sh/inference-eng/curriculum/27-03", "k": ["scheduler", "internals"], "x": [], "r": [["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Scheduler source."], ["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Token-budget scheduling."]], "q": "What state does the scheduler keep per request, and how does it decide how many tokens a request gets this step?", "n": ["Find the scheduler's main schedule function and its output structure.", "Request state: computed tokens, target tokens, status, blocks.", "Order: running requests first, then waiting; budget and KV checks.", "Preemption path when blocks run out.", "Write a small test that exercises budget limits and preemption."], "ak": "", "a": "## The unified view\nModern schedulers treat prefill and decode the same: each request has `num_computed_tokens` and a target. Each step, they schedule `min(remaining, budget)` tokens. Decode is just remaining = 1.\n\n## Pseudocode of a step\n```\nbudget = max_num_batched_tokens\nfor r in running:\n    n = min(r.remaining_tokens, budget)\n    if not kv.can_allocate(r, n): preempt(lowest priority); continue\n    schedule(r, n); budget -= n\nfor r in waiting:\n    if budget == 0 or len(running) == max_num_seqs: break\n    hit = kv.prefix_hit(r)\n    n = min(r.remaining_tokens - hit, budget)\n    if kv.can_allocate(r, n): admit(r, n); budget -= n\n```\n\n## What to verify in code\n- How prefix hits reduce scheduled tokens.\n- Where `max_num_seqs` is enforced.\n- Which request is preempted and what happens to its state.\n\n> Takeaway: the scheduler is a loop over running then waiting requests, under a token budget and KV limits. Reading it explains most latency behavior.", "s": "Per request: status (waiting, running, preempted, finished), number of tokens computed so far, number of prompt and output tokens, assigned KV blocks, and sampling parameters. Each step it gives running requests their decode token (or next prefill chunk), then fills remaining token budget with waiting requests' prompt tokens, limited by free KV blocks and max sequences; it preempts if decode cannot get blocks."}, {"id": "27.04", "t": "Follow KV Allocation & Block Management", "f": "https://fanout.sh/inference-eng/curriculum/27-04", "k": ["kv-cache", "internals"], "x": [], "r": [["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "Design doc to compare against the code."], ["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "KV cache manager source."]], "q": "Where in the code would you confirm how prefix cache hits are found and how evicted blocks are chosen?", "n": ["Find the block pool, block hashing and the free-block queue.", "Trace allocate, append, free and prefix lookup for one request.", "Check eviction order and how cached blocks are reused.", "Compare with your own allocator from Module 08.", "Write a test that shows a prefix hit and an eviction."], "ak": "", "a": "## Things to find\n| Concept | What to look for |\n| Block | block id, ref count, hash |\n| Block pool | free queue, cached-block map |\n| Hashing | parent hash + token ids + extra keys |\n| Allocation | get new blocks for scheduled tokens |\n| Prefix lookup | longest chain of cached hashes |\n| Eviction | pop least recently used free block, remove from cache map |\n| Free | decrement refs, push to free queue |\n\n## Exercise\n1. Send request A with a 1,000-token prompt.\n2. Send request B with the same first 800 tokens.\n3. Log the number of cached tokens found for B: about 800 rounded down to a block boundary.\n4. Fill memory with other requests and confirm A's blocks get evicted in LRU order.\n\n> Takeaway: the KV manager is a block pool, a hash map and a free queue. Matching code to your own allocator makes it quick to understand.", "s": "In the KV cache manager and block pool: the function that computes block hashes for a request's tokens, the lookup that walks those hashes against the cached-block map to find the longest hit, and the free-block queue that orders cached blocks with zero references for eviction (least recently used first). Tests for the block pool show these behaviors directly."}, {"id": "27.05", "t": "Follow Model Execution & Attention Dispatch", "f": "https://fanout.sh/inference-eng/curriculum/27-05", "k": ["internals", "attention"], "x": [], "r": [["vLLM: Attention backends", "https://docs.vllm.ai/en/latest/design/attention_backends.html", "Backend structure."], ["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Model runner source."]], "q": "How does the model runner turn a scheduled batch into one forward pass, and where does the attention backend get per-request information?", "n": ["Model runner: build flat input ids and positions for all scheduled tokens.", "Attention metadata: per-request offsets, lengths, block tables, slot mapping.", "Backends implement metadata building and the attention forward.", "CUDA graphs are used when the batch shape matches a captured size.", "Sampling runs on the last position of each request."], "ak": "", "a": "## Step anatomy\n%%flow Model runner step.\nScheduled batch -> Flat input ids + positions -> *Attention metadata (offsets, block tables, slots) -> Forward (graph or eager) -> Logits at last positions -> Sampler\n%%\n\n## Metadata fields\n| Field | Meaning |\n| query_start_loc | where each request's tokens begin in the flat batch |\n| seq_lens | total context length per request |\n| block_table | physical blocks per request |\n| slot_mapping | KV slot for each new token |\n\n## Dispatch\nThe selected backend (FlashAttention, FlashInfer, Triton) provides a metadata builder and an attention implementation. Model layers call a generic attention op that forwards to the backend with this metadata.\n\n## Exercise\nLog metadata for a step with two decode requests and one prefill chunk. Check that offsets and slot mappings match what you expect.\n\n> Takeaway: the model runner flattens a mixed batch into one forward pass, and per-request structure lives in attention metadata. Reading it shows exactly how continuous batching becomes tensors.", "s": "It flattens all scheduled tokens across requests into one input-id tensor with matching positions, builds metadata (query start offsets per request, sequence lengths, block tables, slot mappings for where new KV goes), pads to a captured CUDA graph size if applicable, and calls the model. Each attention layer reads that metadata, built once per step by the backend's metadata builder, to run paged attention over each request's blocks."}, {"id": "27.06", "t": "Project: Modify and Profile One Engine Component", "f": "https://fanout.sh/inference-eng/curriculum/27-06", "k": ["project"], "x": ["Project"], "r": [["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Code to modify."], ["SGLang paper", "https://arxiv.org/abs/2312.07104", "Cache-aware scheduling idea."]], "q": "Give an example of a well-scoped modification for this project and how you would evaluate it.", "n": ["Pick one component: scheduler policy, eviction policy, a kernel, sampling, metrics.", "Make a small, testable change behind a flag.", "Write unit tests for the new behavior.", "Benchmark against the unmodified engine on two workloads.", "Profile to check overhead; report results honestly, including no-gain outcomes."], "ak": "", "a": "## Example ideas\n| Component | Change |\n| Scheduler | priority by prefix hit, shortest-job-first approximation |\n| KV eviction | frequency-aware instead of pure LRU |\n| Sampling | faster top-p kernel |\n| Metrics | new metric for per-tenant queue time |\n| Router | cache-aware routing in a multi-replica setup |\n\n## Process\n1. Fork at a pinned version.\n2. Implement behind a config flag.\n3. Unit tests.\n4. Benchmark on a workload that should benefit and one that should not.\n5. Profile scheduler or kernel time.\n6. Write-up: change, results, trade-offs.\n\n> Takeaway: a small, flagged, tested change with a fair benchmark teaches more about an engine than reading alone.", "s": "Example: change the scheduler to prioritize requests with the most prefix cache hits (longest-prefix-first) within a fairness bound. Evaluate on a shared-prefix workload and a random workload, measuring hit rate, TTFT p50 and p95, and fairness (max wait time), comparing against the unmodified engine with identical settings, plus a profile to confirm no added scheduler overhead."}]}, {"n": "28", "name": "Build a Mini Inference Engine", "lessons": [{"id": "28.01", "t": "Build the Model Runner & Generation Loop", "f": "https://fanout.sh/inference-eng/curriculum/28-01", "k": ["mini-engine"], "x": [], "r": [["nano-vllm", "https://github.com/GeeeekExplorer/nano-vllm", "A compact engine to compare against."], ["Hugging Face Llama modeling code", "https://github.com/huggingface/transformers/blob/main/src/transformers/models/llama/modeling_llama.py", "Reference model."]], "q": "What interface should your mini engine's model runner expose so that later lessons can add batching and paging without rewriting it?", "n": ["Implement a Llama-style model yourself or wrap one with control over attention and KV.", "Model runner interface: (token ids, positions, metadata) to last-token logits.", "Load weights from safetensors into your module.", "Generation loop on top: sample, append, stop conditions.", "Validate against Hugging Face outputs."], "ak": "", "a": "## Structure of the mini engine\n%%layers Mini engine components, built over this module.\nAPI | streaming HTTP (28.06)\nEngine loop | step: schedule, run, sample, emit\nScheduler | static then continuous batching (28.03, 28.04)\nKV manager | contiguous then paged (28.02, 28.05)\n*Model runner | this lesson\n%%\n\n## Model runner\n```\nclass ModelRunner:\n    def __init__(self, cfg, weights): ...\n    def forward(self, input_ids, positions, attn_meta) -> torch.Tensor:  # [num_seqs, vocab]\n```\n\n## Steps\n1. Implement embedding, RMSNorm, attention with RoPE and GQA, SwiGLU MLP, LM head.\n2. Load weights from safetensors with name mapping.\n3. Compare logits with Hugging Face for a few prompts (tolerance for BF16).\n4. Write a single-sequence generation loop with greedy and temperature sampling.\n\n> Takeaway: start with a clean model runner whose inputs are tokens, positions and metadata. Everything else in the engine builds on that interface.", "s": "A function that takes a flat batch of token ids with positions and per-sequence metadata (which tokens belong to which sequence, where their KV lives) and returns logits for the last token of each sequence. Keep the model code free of request logic so the scheduler and KV manager can change independently."}, {"id": "28.02", "t": "Add KV Cache", "f": "https://fanout.sh/inference-eng/curriculum/28-02", "k": ["mini-engine", "kv-cache"], "x": [], "r": [["Hugging Face: KV cache strategies", "https://huggingface.co/docs/transformers/main/en/kv_cache", "Reference behaviors."], ["kipply: Transformer Inference Arithmetic", "https://kipp.ly/transformer-inference-arithmetic/", "KV sizing."]], "q": "What tests prove your KV cache is correct?", "n": ["Add per-layer K and V buffers; write during prefill and each decode step.", "Attention reads cached K and V up to current length.", "Separate prefill and decode code paths, or unify with metadata.", "Test against full recompute for exact match under greedy decoding.", "Measure step time vs position before and after."], "ak": "", "a": "## Implementation\n- Allocate `[max_len, kv_heads, head_dim]` per layer per sequence (contiguous for now).\n- Prefill: compute K, V for all prompt tokens, write them, run causal attention.\n- Decode: compute K, V for one token, write at `pos`, attend over `[0, pos]`.\n\n## Tests\n| Test | Pass condition |\n| Greedy match | cached == uncached tokens for 5 prompts x 200 tokens |\n| Logit match | max abs diff below tolerance per step |\n| RoPE positions | decode position = prompt length + step |\n| Speed | step time roughly flat from position 100 to 2,000 |\n\n> Takeaway: a correct KV cache produces exactly the same tokens as recomputation and makes step time flat. Test both.", "s": "Greedy generation with and without the cache produces identical tokens for several prompts and lengths; logits at each decode step match a full recompute within tolerance; positions continue correctly after the prompt (RoPE); and step time stays nearly flat as the sequence grows."}, {"id": "28.03", "t": "Add Request Batching", "f": "https://fanout.sh/inference-eng/curriculum/28-03", "k": ["mini-engine", "batching"], "x": [], "r": [["Orca", "https://www.usenix.org/conference/osdi22/presentation/yu", "Selective batching."], ["PyTorch: scaled_dot_product_attention", "https://pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html", "Building block for attention."]], "q": "How do you batch sequences of different lengths in decode without padding attention for the short ones?", "n": ["Process multiple sequences per step.", "Linear layers: stack tokens from all sequences.", "Attention: per-sequence lengths; avoid padded attention over empty slots.", "Start with static batching: fixed set of requests until all finish.", "Measure throughput vs batch size."], "ak": "", "a": "## Static batching first\nAccept up to B requests, prefill each, then decode all together until each finishes. Finished sequences stop producing tokens but the batch waits for the longest.\n\n## Mixed lengths\n```\nx = embed(next_tokens)                       # [B, d]\nfor layer in layers:\n    q, k, v = proj(x)                        # [B, heads, hd]\n    write_kv(k, v, positions)\n    a = torch.stack([attend(q[i], K[i][:L[i]], V[i][:L[i]]) for i in range(B)])\n    x = layer_rest(x, a)\n```\nA Python loop over sequences is slow but correct; replace with a varlen kernel later.\n\n## Measure\n| Batch | Tokens/s | TPOT |\n| 1 | | |\n| 8 | | |\n| 32 | | |\n\nYou should see throughput rise nearly linearly at first, as in Module 03.\n\n> Takeaway: batching stacks tokens for matmuls and keeps attention per sequence. Static batching is the first step; continuous batching comes next.", "s": "Flatten one new token per sequence into a batch for all linear layers, and run attention per sequence (a loop or a variable-length kernel) using each sequence's own cache length. Only attention needs to know lengths; the matmuls just see a [num_seqs, hidden] matrix."}, {"id": "28.04", "t": "Add Continuous Batching & Scheduling", "f": "https://fanout.sh/inference-eng/curriculum/28-04", "k": ["mini-engine", "scheduling"], "x": [], "r": [["Anyscale: How continuous batching enables 23x throughput", "https://www.anyscale.com/blog/continuous-batching-llm-inference", "Concept and gains."], ["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Chunked prefill in the loop."]], "q": "What changes in your engine loop when you move from static to continuous batching?", "n": ["Add a waiting queue and a running set.", "Each step: retire finished, admit new within budget, schedule mixed prefill + decode.", "Support chunked prefill via a token budget.", "Handle cancellation and stop conditions per request.", "Compare throughput and latency with static batching on the same workload."], "ak": "", "a": "## The loop\n```\nwhile True:\n    retire_finished(); handle_cancellations()\n    batch = scheduler.schedule()           # decodes + prefill chunks within budget\n    if not batch: wait_for_requests(); continue\n    logits = runner.forward(*batch.tensors())\n    tokens = sampler(logits, batch.params)\n    batch.update(tokens)                   # append, stream, mark finished\n```\n\n## Mixed batch tensors\nFlatten all scheduled tokens. Metadata says, for each sequence, where its tokens start, its context length, and whether this step ends its prefill (so a token is sampled).\n\n## Evaluation\nRun your harness from Module 04 against static and continuous versions at concurrency 1 to 64.\n| Metric | Static | Continuous |\n| Throughput at 32 | | |\n| TTFT p95 at 32 | | |\n\n> Takeaway: continuous batching is a scheduler plus per-request state in the engine loop. It should raise throughput and cut TTFT immediately.", "s": "The loop no longer processes a fixed batch to completion. Each step it removes finished sequences, admits waiting requests if there is KV space and token budget, schedules their prefill (whole or chunked) alongside current decodes, runs one forward pass over the mixed batch, and emits tokens. Requests carry state (computed tokens, status) so they can join and leave at any step."}, {"id": "28.05", "t": "Add a Paged KV Allocator", "f": "https://fanout.sh/inference-eng/curriculum/28-05", "k": ["mini-engine", "paging"], "x": [], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "Design."], ["FlashInfer", "https://github.com/flashinfer-ai/flashinfer", "Paged attention kernels to call."]], "q": "What changes in the attention path when you switch from contiguous to paged KV?", "n": ["Replace per-sequence buffers with a shared block pool.", "Integrate the allocator from Module 08: block tables, refcounts, free list.", "Write new KV via slot mapping; read via block tables.", "Use a paged attention kernel or a gather step.", "Measure max concurrency before and after."], "ak": "", "a": "## Changes\n| Component | Contiguous | Paged |\n| Storage | per-sequence buffers | one pool [num_blocks, block, kv_heads, hd] |\n| Write | K[seq][pos] | pool[slot] |\n| Read | K[seq][:len] | gather via block table |\n| Admission | reserve max length | allocate as tokens arrive |\n\n## Kernel options\n1. Gather into a temporary contiguous tensor, then standard attention: easiest.\n2. Call a library paged attention kernel with block tables.\n3. Write a Triton paged decode kernel (stretch).\n\n## Measure\nMax concurrent sequences at 2k context before OOM or preemption, contiguous vs paged. Expect several times more with paging.\n\n> Takeaway: paging changes where KV is written and how it is read. With a paged kernel, the same memory serves many more sequences.", "s": "New K and V are written to slots given by a slot mapping (physical block id x block size + offset) rather than a contiguous position, and attention gathers K and V through each sequence's block table. You need either a gather step before standard attention (simple, slower) or a paged attention kernel (FlashInfer, FlashAttention with block tables, or your own Triton kernel)."}, {"id": "28.06", "t": "Add Streaming & an API", "f": "https://fanout.sh/inference-eng/curriculum/28-06", "k": ["mini-engine", "api"], "x": [], "r": [["FastAPI documentation", "https://fastapi.tiangolo.com/", "Async HTTP server."], ["OpenAI API reference: Chat completions", "https://platform.openai.com/docs/api-reference/chat", "Request and response format."]], "q": "How should the engine loop and the HTTP server communicate so streaming does not slow the GPU loop?", "n": ["Separate the engine loop from HTTP handling.", "Use queues: requests in, token outputs out per request.", "Detokenize incrementally on the server side.", "Implement the OpenAI chat completions shape with SSE streaming.", "Propagate client disconnects to abort requests."], "ak": "", "a": "## Architecture\n%%flow Server and engine separation.\nHTTP handlers (async) -(request queue)-> *Engine loop (thread/process) -(output queues)-> SSE writers\n%%\n\n## API\n- `POST /v1/chat/completions` with `stream: true` support.\n- Apply the chat template server side.\n- Return `usage` at the end.\n\n## Disconnects\nWhen a client disconnects, the handler sends an abort for that request id; the engine frees its KV on the next step.\n\n## Test\nRun your benchmark harness from Module 04 against your mini engine. It should work unchanged if the API matches.\n\n> Takeaway: keep the GPU loop free of network work. Queues between an async server and the engine loop give clean streaming and cancellation.", "s": "Run the engine loop in its own thread or process and the HTTP server in an async event loop. The server puts new requests on a queue to the engine and receives generated tokens via per-request output queues (or a shared output channel); detokenization and SSE writes happen on the server side, so the engine loop never waits on network I/O."}, {"id": "28.07", "t": "Add Prefix Caching & Metrics", "f": "https://fanout.sh/inference-eng/curriculum/28-07", "k": ["mini-engine", "prefix"], "x": [], "r": [["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "Reference design."], ["Prometheus Python client", "https://github.com/prometheus/client_python", "Exporting metrics."]], "q": "Which metrics should your mini engine export so you can compare it with vLLM?", "n": ["Add block hashing and a cached-block map to your allocator.", "On admission, reuse the longest cached prefix and skip its prefill.", "Keep freed blocks in an LRU for reuse; evict when needed.", "Export Prometheus metrics matching common engine metrics.", "Test hit rate on a shared-prefix workload."], "ak": "", "a": "## Prefix caching\n- Hash each full block with its parent hash.\n- On admission: walk hashes, take hits, increment refcounts, set `num_computed_tokens` to the hit length.\n- On finish: decrement refs; keep blocks in the cache with an LRU timestamp.\n\n## Metrics\n| Metric | Type |\n| requests_running / waiting | gauge |\n| kv_blocks_used / free | gauge |\n| prefix_cache_hit_tokens / query_tokens | counter |\n| preemptions | counter |\n| prompt_tokens / generation_tokens | counter |\n| ttft_seconds / tpot_seconds / e2e_seconds | histogram |\n\n## Test\nShared system prompt workload: hit rate should approach the shared fraction of prompt tokens, and TTFT should drop accordingly.\n\n> Takeaway: prefix caching is a hash map over your block pool, and metrics make the mini engine comparable with production engines.", "s": "Running and waiting requests, KV blocks used and free, prefix cache hit tokens and queries, preemptions, prompt and generation token counters, and histograms for TTFT, TPOT and E2E, all in Prometheus format at /metrics."}, {"id": "28.08", "t": "Project: Benchmark Your Engine Against vLLM", "f": "https://fanout.sh/inference-eng/curriculum/28-08", "k": ["project"], "x": ["Project"], "r": [["vLLM documentation", "https://docs.vllm.ai/en/latest/", "The comparison engine."], ["NVIDIA Nsight Systems User Guide", "https://docs.nvidia.com/nsight-systems/UserGuide/index.html", "Profiling both engines."]], "q": "Your mini engine reaches 40% of vLLM's throughput. How do you find out where the gap comes from?", "n": ["Benchmark mini engine and vLLM with the same harness, model and workload.", "Compare throughput, TTFT, TPOT and max concurrency.", "Profile both and break down step time.", "Attribute the gap to specific missing features or kernels.", "Close one gap and measure the improvement."], "ak": "", "a": "## Comparison table\n| Metric | Mini engine | vLLM | Ratio |\n| Throughput at 32 | | | |\n| TTFT p95 | | | |\n| TPOT p50 | | | |\n| Max concurrency at 2k | | | |\n\n## Typical gaps\n| Gap | Cause | Fix |\n| GPU idle time | Python loop, no graphs | CUDA graphs, async scheduling |\n| Attention | gather + SDPA | paged kernel |\n| Small ops | unfused | fused norms, RoPE |\n| Batch size | memory overhead | tighter KV pool |\n| Sampling | slow top-p | batched sampler |\n\n## Deliverable\nResults, profiles, gap attribution, one improvement implemented and measured.\n\n> Takeaway: benchmarking your own engine against a production one, and explaining the gap with profiles, is the best test of everything in this course.", "s": "Profile both on the same workload and compare step time breakdowns: kernel time for attention and GEMMs, small-op count (fusion), GPU idle gaps (CPU overhead, no CUDA graphs), scheduling overhead per step, and batch sizes achieved (KV capacity). Then close the biggest gap first, for example by adding CUDA graphs or a better attention kernel, and re-measure."}]}, {"n": "29", "name": "Reproduce Inference Research", "lessons": [{"id": "29.01", "t": "How to Read an Inference Systems Paper", "f": "https://fanout.sh/inference-eng/curriculum/29-01", "k": ["research"], "x": [], "r": [["S. Keshav: How to Read a Paper", "https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf", "Three-pass reading method."], ["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "A good paper to practice on."]], "q": "What three questions should you answer after a first pass over an inference systems paper?", "n": ["Read in passes: abstract and figures, then method, then evaluation details.", "Identify the bottleneck the paper attacks and the workload where it matters.", "Check baselines: are they strong and current?", "Note hardware, model sizes, batch sizes, metrics and SLOs used.", "List claims you could test and assumptions that might not hold for you."], "ak": "", "a": "## Three passes\n| Pass | Read | Goal |\n| 1 | title, abstract, figures, conclusion | what and why |\n| 2 | method, key algorithms | how |\n| 3 | evaluation, appendix | under what conditions it holds |\n\n## Questions for systems papers\n- Which bottleneck: memory, compute, communication, scheduling?\n- Which workload: prompt and output lengths, arrival pattern, model size?\n- Which baseline: is it a tuned current engine or an old version?\n- Which metric: throughput, latency percentile, goodput?\n- What is the cost: memory, complexity, quality?\n\n## Red flags\n- Baselines without continuous batching or paged KV.\n- Throughput without latency.\n- Only one model size or one hardware type.\n- No ablations.\n\n> Takeaway: read for the bottleneck, the mechanism and the evaluation conditions. The conditions decide whether the result applies to you.", "s": "What problem and bottleneck does it target (and under what workload)? What is the core mechanism, in one or two sentences? What baseline and setup produced the headline number (hardware, model, batch size, metric), and does that setting match yours?"}, {"id": "29.02", "t": "Choose a Paper & Reconstruct the Baseline", "f": "https://fanout.sh/inference-eng/curriculum/29-02", "k": ["research"], "x": [], "r": [["ML Reproducibility Challenge", "https://reproml.org/", "Community reproduction practice."], ["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Common baseline engine."]], "q": "Why is reconstructing the paper's baseline the most important step of a reproduction?", "n": ["Choose a paper with a clear mechanism, available code or enough detail, and feasible hardware.", "Reconstruct the baseline exactly: engine version, flags, model, hardware class.", "Match the paper's baseline numbers within a tolerance before going further.", "If you cannot match, document why (hardware, missing details).", "Also run a modern baseline to see if the gap still exists today."], "ak": "", "a": "## Picking a paper\n| Criterion | Why |\n| Clear mechanism | easier to implement and isolate |\n| Code available | saves weeks |\n| Hardware within reach | can actually run it |\n| Headline in a measurable metric | can verify |\n\nGood candidates: chunked prefill (Sarathi-Serve), prefix sharing (SGLang), speculative decoding variants, KV quantization (KIVI), disaggregation (DistServe) at small scale.\n\n## Baseline steps\n1. Extract every setup detail from the paper and appendix.\n2. Install the baseline engine version they used, if possible.\n3. Rebuild their workload (datasets, lengths, rates).\n4. Run and compare baseline numbers.\n\n| Metric | Paper baseline | Yours | Delta |\n| Throughput | | | |\n| p99 latency | | | |\n\n> Takeaway: reproduce the baseline before the technique. Without a matching baseline, a reproduced speedup proves nothing.", "s": "The headline result is a ratio against a baseline. If your baseline differs (version, flags, hardware), the ratio is meaningless: you might show a large gain against a weak baseline or none against a strong one. Matching the paper's baseline numbers first proves your setup is comparable before you test the technique."}, {"id": "29.03", "t": "Recreate the Paper Workload", "f": "https://fanout.sh/inference-eng/curriculum/29-03", "k": ["research", "workloads"], "x": [], "r": [["ShareGPT dataset (on Hugging Face)", "https://huggingface.co/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered", "Commonly used dataset."], ["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "Common workload generators."]], "q": "A paper evaluates on \"ShareGPT at 4 requests per second.\" What details must you pin down to recreate this workload?", "n": ["Workloads drive results; recreate them precisely.", "Pin dataset version, filtering, prompt construction and tokenization.", "Match output length handling and arrival process.", "Plot length distributions and compare with the paper's figures.", "Save the exact workload file for others."], "ak": "", "a": "## Details to pin\n| Detail | Example choices |\n| Dataset | ShareGPT version, filtered by language or length |\n| Prompt | first user turn, or full conversation |\n| Lengths | tokenized with model's tokenizer |\n| Truncation | cap at context limit |\n| Output | dataset reply length + ignore_eos, or free |\n| Arrival | Poisson at rate R, seed |\n| Count | number of requests, duration |\n\n## Validate\nPlot input and output length histograms. Compare with any distribution the paper reports (mean, median, max). Large differences change results.\n\n## Publish\nSave the workload as a file (prompt ids or text, target output lengths, arrival times). Reproductions become checkable.\n\n> Takeaway: most reproduction gaps come from workload differences. Pin every detail and compare length distributions with the paper.", "s": "Which ShareGPT version and filtering, how conversations were turned into prompts (first turn only or full history), tokenizer used to compute lengths, any length truncation or filtering, output length handling (use dataset output lengths with ignore_eos or let the model decide), number of requests, arrival distribution (Poisson with which seed), and warm-up."}, {"id": "29.04", "t": "Reproduce the Main Result", "f": "https://fanout.sh/inference-eng/curriculum/29-04", "k": ["research"], "x": [], "r": [["ML Reproducibility Challenge", "https://reproml.org/", "Reporting standards."], ["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Example of a reproducible systems result."]], "q": "Your reproduced speedup is 1.6 times where the paper claims 2.3 times. How do you decide if this counts as a successful reproduction?", "n": ["Implement or enable the technique on your reconstructed baseline.", "Run the paper's main experiment with repeated trials.", "Compare direction, magnitude and conditions with the paper.", "Explain any gap with specific differences.", "Report confidence intervals, not single runs."], "ak": "", "a": "## Running it\n1. Same workload, same baseline config, technique on.\n2. At least 3 runs each; interleave.\n3. Report mean and spread.\n\n## Comparing\n| Result | Paper | Yours |\n| Main metric gain | 2.3x | 1.6x (1.5 to 1.7) |\n| Conditions | A100, engine vX | H100, engine vY |\n\n## Explaining gaps\n| Possible cause | Check |\n| Hardware | ratio of bandwidth to compute differs |\n| Stronger baseline | newer engine already includes part of the gain |\n| Workload | length distribution differs |\n| Tuning | paper's flags not documented |\n\n## Verdicts\n- Reproduced: within the paper's stated variance.\n- Partially reproduced: clear gain, smaller, with explained differences.\n- Not reproduced: no significant gain under matched conditions.\n\n> Takeaway: a reproduction compares direction, magnitude and conditions. Explain gaps with specific differences and report repeat-run spread.", "s": "Check whether the direction and rough magnitude hold and whether the gap can be explained: different hardware, a stronger baseline, workload differences, or missing tuning. If you can trace the gap to a documented difference and the mechanism still shows a clear, repeatable gain, it is a partial reproduction worth reporting. If the gain disappears entirely under matched conditions, report that too."}, {"id": "29.05", "t": "Profile the Implementation", "f": "https://fanout.sh/inference-eng/curriculum/29-05", "k": ["research", "profiling"], "x": [], "r": [["NVIDIA Nsight Systems User Guide", "https://docs.nvidia.com/nsight-systems/UserGuide/index.html", "Timeline profiling."], ["NVIDIA Nsight Compute documentation", "https://docs.nvidia.com/nsight-compute/NsightCompute/index.html", "Kernel profiling."]], "q": "Why profile a technique after reproducing its speedup?", "n": ["Profile baseline and technique on the same workload.", "Check that the claimed mechanism shows up (bytes, idle time, kernel counts).", "Find new bottlenecks the technique introduced.", "Relate the gain to hardware ratios (bandwidth, FLOPs, interconnect).", "Use the profile to predict where the technique stops working."], "ak": "", "a": "## What to compare\n| Item | Baseline | Technique |\n| Step time breakdown | | |\n| Kernel count per step | | |\n| GPU idle share | | |\n| Bytes moved (key kernels) | | |\n| Communication time | | |\n\n## Confirming the mechanism\nIf the paper claims \"removes prefill stalls\", the step-time trace should show bounded steps. If it claims \"reduces KV reads\", decode attention bytes should drop.\n\n## New bottlenecks\nTechniques often move the bottleneck. After chunked prefill, the next limit might be scheduler overhead or attention re-reads of earlier chunks.\n\n> Takeaway: profiling shows why a technique works. It also shows what it costs and where it will stop helping.", "s": "To confirm the speedup comes from the mechanism the paper claims (for example fewer bytes moved or less idle time) rather than an unrelated side effect, to find where the remaining time goes, and to understand which hardware or workload properties the gain depends on, which predicts where it will fail."}, {"id": "29.06", "t": "Run Ablations", "f": "https://fanout.sh/inference-eng/curriculum/29-06", "k": ["research"], "x": [], "r": [["S. Keshav: How to Read a Paper", "https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf", "Critical reading of evaluations."], ["SGLang paper", "https://arxiv.org/abs/2312.07104", "Example with component ablations."]], "q": "What is an ablation, and design one for a technique that combines three ideas.", "n": ["Ablate each component to see its contribution.", "Vary key parameters (chunk size, draft length, block size) to see sensitivity.", "Check interactions: do components help more together?", "Ablations often show one part gives most of the benefit.", "Report ablations in a table with spread."], "ak": "", "a": "## Component ablation\n| Config | A | B | C | Gain |\n| baseline | | | | 1.0x |\n| A | x | | | |\n| B | | x | | |\n| C | | | x | |\n| A + B | x | x | | |\n| all | x | x | x | |\n\n## Parameter sweeps\nPick the most important parameter and sweep it over a wide range. Plot gain vs parameter. Look for a flat region (robust) or a sharp peak (fragile tuning).\n\n## Why it matters\nIf one component gives 90% of the gain, you can adopt it alone with less complexity. If components only help together, adopt them as a unit.\n\n> Takeaway: ablations tell you which parts of a technique matter. Often the simplest part gives most of the benefit.", "s": "An ablation removes or varies one component at a time to measure its individual contribution. For a technique combining A, B and C: run baseline, each of A, B and C alone, each pair, and all three, on the same workload, so you can see which components matter, whether they interact, and whether one gives most of the gain."}, {"id": "29.07", "t": "Find Where the Technique Stops Working", "f": "https://fanout.sh/inference-eng/curriculum/29-07", "k": ["research"], "x": [], "r": [["Optimizing Speculative Decoding for Serving LLMs Using Goodput", "https://arxiv.org/abs/2406.14066", "Speculation degrading under load."], ["DistServe", "https://arxiv.org/abs/2401.09670", "Where disaggregation helps."]], "q": "Give three axes along which you would search for where an inference technique stops helping, with an example.", "n": ["Every technique has a regime where it helps and one where it hurts.", "Sweep load, workload shape, model size and hardware.", "Find the crossover points and explain them with profiles.", "These boundaries are the most useful part of a reproduction.", "Report them as a map, not a single number."], "ak": "", "a": "## Axes to sweep\n| Axis | Example range |\n| Load | concurrency 1 to 256 |\n| Prompt length | 256 to 32k |\n| Output length | 32 to 4k |\n| Prefix sharing | 0 to 90% |\n| Model size | 1B to 70B |\n| Hardware | different GPU generations, interconnects |\n\n## Map\nPresent a heatmap of gain over two axes (for example load x prompt length). Mark where gain is below 1.\n\n## Explain each boundary\nUse the profile from 29.05. For speculation: at high load, compute is saturated, so verification wastes capacity. For chunked prefill: with only short prompts, there is nothing to chunk.\n\n> Takeaway: the limits of a technique are as valuable as its gains. Sweep the axes, map the crossover and explain it.", "s": "Load (concurrency or request rate): speculative decoding helps at low load and stops helping at high load. Workload shape (prompt and output lengths, prefix sharing): prefix caching does nothing without shared prefixes. Hardware and scale (GPU type, interconnect, model size): disaggregation stops paying on slow networks or at small scale."}, {"id": "29.08", "t": "Project: Compare Against Modern Engines & Publish", "f": "https://fanout.sh/inference-eng/curriculum/29-08", "k": ["project"], "x": ["Project"], "r": [["ML Reproducibility Challenge", "https://reproml.org/", "Report structure."], ["vLLM documentation", "https://docs.vllm.ai/en/latest/", "Modern baseline."]], "q": "What should a published reproduction report contain to be useful to others?", "n": ["Compare the technique against a current engine with its best settings.", "Many older paper gains are now built into engines; quantify what remains.", "Publish code, workload files and configs.", "Write clearly: claim, setup, results, limits.", "Share for review and update with feedback."], "ak": "", "a": "## Modern comparison\n| Config | Metric |\n| Paper baseline (old engine) | |\n| Paper technique | |\n| Current engine defaults | |\n| Current engine tuned | |\n| Current engine + technique (if applicable) | |\n\n## Report outline\n1. Claim and summary of findings.\n2. Setup and workload (with files).\n3. Baseline match.\n4. Main result and variance.\n5. Mechanism (profile).\n6. Ablations.\n7. Where it stops working.\n8. Comparison with current engines.\n9. Limitations.\n\n> Takeaway: a good reproduction says whether a result still matters with today's engines, and gives others everything needed to check it.", "s": "The paper and claim reproduced; full setup (hardware, versions, flags, workload file); baseline match; main result with spread; profile showing the mechanism; ablations; the map of where it helps and stops helping; a comparison against a current engine's default (does the gap still exist?); and code and data to rerun it."}]}, {"n": "30", "name": "Final Inference Engineering Capstone", "lessons": [{"id": "30.01", "t": "Define the Workload, Quality Target & SLO", "f": "https://fanout.sh/inference-eng/curriculum/30-01", "k": ["capstone"], "x": ["Capstone"], "r": [["Google SRE Book: Service Level Objectives", "https://sre.google/sre-book/service-level-objectives/", "Writing SLOs."], ["DistServe", "https://arxiv.org/abs/2401.09670", "Goodput under SLOs."]], "q": "Write a one-paragraph workload and SLO definition for a hypothetical support-chat product.", "n": ["Define the product and its traffic: lengths, sharing, rates, bursts.", "Write SLOs for TTFT, TPOT (or E2E) with percentiles and attainment.", "Set a measurable quality bar with an eval set.", "State constraints: budget, hardware availability, latency regions.", "Everything later in the capstone is judged against this."], "ak": "", "a": "## The capstone\nOver these ten lessons you design, build, optimize, harden and defend a complete inference system for one workload. Each lesson is one phase.\n\n## Definition template\n| Item | Your value |\n| Product | |\n| Prompt length distribution | |\n| Output length distribution | |\n| Prefix sharing | |\n| Peak / average rate | |\n| Burst profile | |\n| TTFT SLO | |\n| TPOT / E2E SLO | |\n| Attainment target | |\n| Quality eval and bar | |\n| Budget and constraints | |\n\n## Build the workload file\nTurn the definition into a replayable workload (Module 04) with arrival times and lengths.\n\n> Takeaway: a precise workload, SLO and quality bar make every later decision checkable. Write them before choosing anything.", "s": "Support chat for a SaaS product: requests have a 2,500-token shared system prompt plus 500 to 3,000 tokens of conversation history and retrieved docs, outputs average 250 tokens (p95 600). Peak 80 requests per second, average 30, with 2x bursts. SLO: p95 TTFT under 800 ms, p95 TPOT under 40 ms, 99% attainment. Quality: at least 95% of the BF16 reference model's score on our 400-question support eval, and 100% valid JSON for tool calls."}, {"id": "30.02", "t": "Choose the Model, Hardware & Engine", "f": "https://fanout.sh/inference-eng/curriculum/30-02", "k": ["capstone"], "x": ["Capstone"], "r": [["lm-evaluation-harness", "https://github.com/EleutherAI/lm-evaluation-harness", "Quality evaluation."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Benchmarking."]], "q": "What evidence should support your model, hardware and engine choices?", "n": ["Shortlist models that can meet the quality bar.", "Match hardware to the workload's bottleneck and the model's memory.", "Choose the engine with a fair comparison and selection matrix.", "Record each decision with evidence and the runner-up.", "Keep options open for later phases (precision, parallelism)."], "ak": "", "a": "## Decisions\n| Decision | Evidence | Lesson |\n| Model and size | eval scores | 11.07 |\n| Precision (initial) | eval + memory | 11.08 |\n| GPU type | per-dollar ratios + quick benchmark | 25.03 |\n| Engine | fair comparison, features | 17.06 |\n\n## Decision record\nFor each: chosen option, numbers, runner-up, why it lost, and what would make you revisit.\n\n> Takeaway: choose model, hardware and engine on measured evidence, and write the reasoning down so you can revisit it.", "s": "Model: eval scores against the quality bar for each candidate size and precision. Hardware: memory fit and per-dollar ratios matched to whether the workload is prefill or decode heavy, plus a quick benchmark. Engine: a fair comparison on your workload (goodput under SLO) and required features, recorded in a selection matrix."}, {"id": "30.03", "t": "Establish a Reproducible Baseline", "f": "https://fanout.sh/inference-eng/curriculum/30-03", "k": ["capstone"], "x": ["Capstone"], "r": [["vLLM: Engine arguments", "https://docs.vllm.ai/en/latest/configuration/engine_args.html", "Pinning configuration."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Rate sweeps."]], "q": "What makes the capstone baseline good enough to measure all later optimizations against?", "n": ["Default engine configuration with chosen model and GPU.", "Run the capstone workload across a rate sweep.", "Record goodput, SLO attainment, engine metrics.", "Measure run-to-run variance.", "Script everything so one command reproduces it."], "ak": "", "a": "## Deliverables\n- `baseline.yaml`: model, engine version, flags.\n- `run_baseline.sh`: starts engine, runs warm-up and sweep, writes results.\n- Results: goodput vs rate, TTFT/TPOT percentiles, engine metrics, env report.\n- Variance: 3 repeated runs at the expected rate.\n\n## Baseline summary\n| Metric | Value | Spread |\n| SLO-safe rate per GPU | | |\n| TTFT p95 at expected rate | | |\n| TPOT p95 at expected rate | | |\n| KV usage at expected rate | | |\n\n> Takeaway: a scripted, pinned baseline with known variance is the yardstick for the rest of the capstone.", "s": "It is fully pinned and scripted (one command reproduces it), uses the capstone workload file, measures the SLO metrics and goodput across a rate sweep, records engine and GPU metrics, and its run-to-run variance is known, so later gains can be judged against noise."}, {"id": "30.04", "t": "Profile and Identify the Bottleneck", "f": "https://fanout.sh/inference-eng/curriculum/30-04", "k": ["capstone"], "x": ["Capstone"], "r": [["NVIDIA Nsight Systems User Guide", "https://docs.nvidia.com/nsight-systems/UserGuide/index.html", "Profiling."], ["PyTorch Profiler recipe", "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html", "Profiling."]], "q": "How do you decide which optimization phase to do first after profiling?", "n": ["Use the workflow from Module 12 on the capstone baseline.", "Identify the binding constraint and its root cause.", "Estimate gains for candidate fixes.", "Rank by gain, effort and risk.", "Write a bottleneck report."], "ak": "", "a": "## Steps\n1. At expected load, which SLO fails first or which resource saturates?\n2. Engine metrics: queueing, KV usage, preemptions.\n3. Timeline: step breakdown, idle time.\n4. Kernel analysis for top kernels.\n5. Candidate fixes with Amdahl estimates.\n\n## Ranking table\n| Fix | Targets | Est. capacity gain | Effort | Risk |\n| FP8 KV | KV pressure | | low | low |\n| Chunk budget | TTFT tail | | low | low |\n| FP8 weights | decode speed | | low | quality |\n| Speculation | TPOT | | medium | load dependent |\n| TP 2 | TPOT, KV | | medium | cost |\n\n> Takeaway: profile, name the binding constraint and rank fixes by estimated gain. That order is your optimization plan.", "s": "Identify the binding constraint at the expected load (SLO metric that fails first, KV pressure, or throughput ceiling), break down step time and engine state to find its cause, and estimate each candidate fix's gain on SLO-safe capacity. Start with the fix with the largest expected gain per unit of effort and risk."}, {"id": "30.05", "t": "Optimize Memory, Scheduling & Caching", "f": "https://fanout.sh/inference-eng/curriculum/30-05", "k": ["capstone"], "x": ["Capstone"], "r": [["vLLM: Automatic prefix caching design", "https://docs.vllm.ai/en/latest/design/prefix_caching.html", "Prefix caching."], ["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Chunked prefill."]], "q": "Which three optimizations from this phase are most likely to help a support-chat workload with a shared system prompt?", "n": ["Apply memory tuning, scheduler tuning, chunked prefill and prefix caching.", "Change one thing at a time; keep a change log.", "Measure SLO-safe capacity after each change.", "Watch hit rate, KV usage and preemptions.", "Stop each line of work when it no longer moves capacity."], "ak": "", "a": "## Order\n1. Prefix caching (if prompts share prefixes).\n2. Chunked prefill and token budget.\n3. KV capacity: memory fraction, FP8 KV.\n4. Max sequences.\n\n## Change log\n| # | Change | SLO-safe rate | Delta | Evidence |\n| 0 | baseline | | | |\n| 1 | prefix caching | | | hit rate |\n| 2 | chunk budget | | | ITL p99 |\n| 3 | FP8 KV | | | preemptions |\n| 4 | max seqs | | | TPOT |\n\n> Takeaway: memory, scheduling and caching changes are cheap and often give the largest gains. Measure each against the baseline.", "s": "Prefix caching (with sticky or prefix-aware routing) to skip the shared system prompt and conversation history; chunked prefill with a tuned token budget to keep TPOT stable when long histories arrive; and FP8 KV or memory tuning to raise concurrency without preemptions."}, {"id": "30.06", "t": "Optimize Precision, Kernels & Runtime", "f": "https://fanout.sh/inference-eng/curriculum/30-06", "k": ["capstone"], "x": ["Capstone"], "r": [["lm-evaluation-harness", "https://github.com/EleutherAI/lm-evaluation-harness", "Evals."], ["Give Me BF16 or Give Me Death?", "https://arxiv.org/abs/2411.02355", "Quantization quality trade-offs."]], "q": "How do you make sure a precision change in the capstone does not break the quality bar?", "n": ["Try FP8 or INT4 weights within the quality bar.", "Check attention backend and CUDA graph settings.", "Try speculative decoding if load is moderate.", "Gate every precision change on the quality eval.", "Keep the change log going."], "ak": "", "a": "## Candidates\n| Change | Gate |\n| FP8 weights | quality eval |\n| INT4 weights | quality eval, batch-size check |\n| Attention backend | correctness, speed at your shapes |\n| CUDA graph sizes | startup time |\n| Speculative decoding | load-dependent benefit (16.08) |\n\n## Process\nFor each change: quality eval (if numerics change), SLO-safe capacity, startup time and memory.\n\n> Takeaway: precision and runtime changes add capacity but each must pass the quality gate. Speculation needs a load check.", "s": "Run the capstone quality eval (and format checks for tool calls) on the quantized configuration with production sampling settings and the same engine, compare against the BF16 reference with confidence intervals, and accept only if it stays above the bar set in 30.01. Also spot-check long-context and edge cases relevant to the product."}, {"id": "30.07", "t": "Decide on Multi-GPU or Disaggregation", "f": "https://fanout.sh/inference-eng/curriculum/30-07", "k": ["capstone"], "x": ["Capstone"], "r": [["vLLM: Parallelism and scaling", "https://docs.vllm.ai/en/latest/serving/parallelism_scaling.html", "Parallel options."], ["DistServe", "https://arxiv.org/abs/2401.09670", "Disaggregation trade-offs."]], "q": "Under what results from earlier phases would you move the capstone to multi-GPU replicas or disaggregation?", "n": ["Default: single-GPU replicas if the SLO is met.", "TP when per-replica latency or KV capacity is insufficient.", "Disaggregation when interference is the binding problem at scale.", "Compare options on goodput per GPU and per dollar.", "Document why you did or did not scale out."], "ak": "", "a": "## Decision tree\n%%flow Scaling decision.\nMeets SLO on 1 GPU? -(yes)-> *Replicas (data parallel)\nMeets SLO on 1 GPU? -(no: TPOT or KV)-> Tensor parallel 2 -> Re-measure\nInterference dominates at scale? -(yes, fast network)-> Prefill/decode disaggregation\n%%\n\n## Compare\n| Option | Goodput per GPU | Cost per M tokens | Complexity |\n| 1-GPU replicas | | | low |\n| TP 2 replicas | | | medium |\n| Disaggregated | | | high |\n\n> Takeaway: scale out only when single-GPU replicas cannot meet the SLO. Compare options on goodput per dollar and pick the simplest that works.", "s": "Move to tensor parallelism if single-GPU TPOT cannot meet the SLO or KV capacity is insufficient after other optimizations. Consider disaggregation if long prompts cause decode interference that chunked prefill cannot fix at the required load and the network between GPUs is fast. Otherwise stay with single-GPU replicas, which are simplest and usually most efficient."}, {"id": "30.08", "t": "Add Routing, Autoscaling & Observability", "f": "https://fanout.sh/inference-eng/curriculum/30-08", "k": ["capstone"], "x": ["Capstone"], "r": [["KEDA", "https://keda.sh/", "Autoscaling on Prometheus metrics."], ["OpenTelemetry documentation", "https://opentelemetry.io/docs/", "Tracing."]], "q": "What routing, autoscaling and observability setup fits the capstone's support-chat workload?", "n": ["Route for cache locality with load bounds.", "Autoscale on queue and KV signals with headroom.", "Size a warm pool from cold-start time and burst profile.", "Dashboards, alerts and traces as in Module 24.", "Replay the capstone trace with bursts to verify."], "ak": "", "a": "## Components\n| Area | Choice |\n| Routing | session affinity + least-loaded fallback |\n| Autoscaling | waiting tokens and KV usage; scale up fast, down slow |\n| Warm capacity | from burst size within cold-start window |\n| Dashboards | traffic, SLO latencies, saturation, errors |\n| Alerts | SLO burn rate, replica down, GPU errors |\n| Tracing | per request with token counts |\n\n## Verification\nReplay the capstone trace including bursts. Record SLO attainment per minute, replicas over time, GPU-hours.\n\n> Takeaway: routing for cache locality, autoscaling on queue and KV, and SLO-focused observability turn an optimized replica into an operable service.", "s": "Session-affinity or prefix-aware routing with load bounds, so conversation histories hit the cache; autoscaling on waiting requests and KV usage relative to measured capacity, with headroom for cold-start time and a small warm pool for bursts; and dashboards for traffic, TTFT/TPOT vs SLO, saturation and errors, with burn-rate alerts and request tracing including cached-token counts."}, {"id": "30.09", "t": "Failure-Test and Calculate Cost & Capacity", "f": "https://fanout.sh/inference-eng/curriculum/30-09", "k": ["capstone"], "x": ["Capstone"], "r": [["Principles of Chaos Engineering", "https://principlesofchaos.org/", "Failure testing."], ["Google SRE Book: Handling Overload", "https://sre.google/sre-book/handling-overload/", "Capacity and overload."]], "q": "What final capacity and cost numbers should the capstone report?", "n": ["Run the chaos experiments from Module 24 on the capstone system.", "Fix weaknesses and re-test.", "Compute fleet size for peak with headroom and spares.", "Compute monthly cost and cost per request and per million tokens.", "Show sensitivity to traffic growth and mix changes."], "ak": "", "a": "## Failure tests\n| Fault | Result | Recovery time | SLO impact |\n| Replica kill | | | |\n| Long-prompt burst | | | |\n| Slow replica | | | |\n| Retry storm | | | |\n\n## Capacity and cost\n| Item | Value |\n| Per-replica capacity | |\n| Peak replicas (with headroom) | |\n| Spares | |\n| Average replicas (autoscaled) | |\n| Monthly GPU cost | |\n| Cost per M output tokens | |\n| Cost per conversation | |\n\n## Sensitivity\n+50% traffic, 2x average prompt length: new replica counts and costs.\n\n> Takeaway: the capstone ends with numbers a business can use: capacity, cost and evidence the system survives failures.", "s": "Per-replica SLO-safe capacity for the workload; replicas needed at peak with headroom and failure spares; monthly GPU cost under the autoscaling policy and the resulting cost per million tokens and per conversation; and results of failure tests (recovery time, SLO impact) that justify the spare capacity."}, {"id": "30.10", "t": "Publish and Defend the Complete System", "f": "https://fanout.sh/inference-eng/curriculum/30-10", "k": ["capstone"], "x": ["Capstone"], "r": [["S. Keshav: How to Read a Paper", "https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf", "Reviewers read your work the same w
