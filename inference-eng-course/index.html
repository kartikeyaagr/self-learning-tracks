dependently to match the traffic's ratio of prompt to output tokens."}, {"id": "21.02", "t": "Size Prefill & Decode Worker Pools", "f": "https://fanout.sh/inference-eng/curriculum/21-02", "k": ["disaggregation", "capacity"], "x": [], "r": [["DistServe", "https://arxiv.org/abs/2401.09670", "Placement and sizing algorithm."], ["Splitwise", "https://arxiv.org/abs/2311.18677", "Pool provisioning."]], "q": "Traffic is 5 requests/s with 3,000-token prompts and 300-token outputs. A prefill GPU processes 20,000 tokens/s within TTFT SLO; a decode GPU sustains 2,500 output tokens/s within TPOT SLO. How many of each do you need?", "n": ["Prefill demand = request rate x prompt tokens (minus cache hits).", "Decode demand = request rate x output tokens, constrained by KV capacity and TPOT.", "Measure each pool's SLO-safe capacity separately.", "Ratio of pools follows the input/output token ratio of traffic.", "Re-balance as traffic changes; some systems let workers switch roles."], "ak": "", "a": "## Demand\n```\nprefill_tokens_per_s = rate * avg_prompt_tokens * (1 - prefix_hit_rate)\ndecode_tokens_per_s  = rate * avg_output_tokens\ndecode_concurrency   = rate * avg_decode_time      # Little's law, for KV sizing\n```\n\n## Capacity per GPU\nMeasure separately:\n- Prefill GPU: max prompt tokens/s keeping TTFT within SLO (including queueing).\n- Decode GPU: max output tokens/s keeping TPOT within SLO, and max concurrent sequences by KV.\n\n## Example\n| Item | Value |\n| Rate | 5 req/s |\n| Prefill demand | 15,000 tok/s |\n| Prefill GPU capacity | 20,000 tok/s |\n| Decode demand | 1,500 tok/s |\n| Decode GPU capacity | 2,500 tok/s |\n| Plan | 2 prefill, 1 to 2 decode |\n\n## Shifting ratios\nRAG traffic (long prompts, short answers) needs more prefill GPUs. Creative writing (short prompts, long outputs) needs more decode GPUs. Monitor both demands and adjust pool sizes.\n\n> Takeaway: size each pool from its own demand and measured SLO-safe capacity. The prefill to decode ratio follows traffic's prompt to output token ratio.", "s": "Prefill demand is 5 x 3,000 = 15,000 tokens/s, so 0.75 GPUs: round up to 1 (plus headroom, so 1 to 2). Decode demand is 5 x 300 = 1,500 tokens/s, so 0.6 GPUs: 1. With headroom for bursts, about 2 prefill and 1 to 2 decode GPUs. The ratio shifts as prompt and output lengths change."}, {"id": "21.03", "t": "Build Prefill & Decode Workers", "f": "https://fanout.sh/inference-eng/curriculum/21-03", "k": ["disaggregation"], "x": [], "r": [["vLLM: Disaggregated prefilling", "https://docs.vllm.ai/en/latest/features/disagg_prefill.html", "Experimental support and connectors."], ["NVIDIA Dynamo", "https://github.com/ai-dynamo/dynamo", "Framework for disaggregated serving."]], "q": "What must a decode worker receive from the prefill worker to continue a request, and in what order should things happen?", "n": ["Prefill worker: runs prompt, produces KV and first token.", "Decode worker: allocates blocks, receives KV, continues generation.", "A coordinator or router pairs prefill and decode workers per request.", "KV connectors abstract the transfer method (NVLink, RDMA, TCP, storage).", "Handle failures: if transfer fails, fall back to local prefill on the decode worker."], "ak": "", "a": "## Flow\n%%seq Disaggregated request flow.\nRouter > Prefill : request\nRouter > Decode : reserve blocks\nPrefill > Prefill : compute prompt KV, first token\nPrefill > Decode : KV blocks + first token\nDecode > Decode : join running batch\nDecode -> Router : streamed tokens\n%%\n\n## Components\n- **Router / coordinator**: picks a prefill and a decode worker, often by load and cache locality.\n- **Prefill worker**: engine configured for large token budgets and prefill-optimized parallelism.\n- **Decode worker**: engine configured for large decode batches and high KV capacity.\n- **KV connector**: moves KV between them.\n\n## Design points\n- Allocate decode-side blocks before transfer so KV lands directly in place.\n- Transfer layer by layer to overlap with prefill compute.\n- If the decode pool is full, hold the request at prefill or queue it.\n- Timeouts and fallback paths for failed transfers.\n\n> Takeaway: a disaggregated system is two engine pools plus a coordinator and a KV transfer path. The decode worker needs the prompt's KV and first token to carry on.", "s": "The KV cache for all prompt tokens (every layer), the first generated token (or the logits to sample it), the request's sampling parameters and state, and position information. Order: router sends request to prefill; prefill computes KV and first token; KV is transferred to blocks the decode worker allocated; decode worker adds the request to its running batch and continues generating; the first token can be streamed by prefill or decode."}, {"id": "21.04", "t": "Transfer KV Between Workers", "f": "https://fanout.sh/inference-eng/curriculum/21-04", "k": ["disaggregation", "kv-transfer"], "x": [], "r": [["Mooncake", "https://arxiv.org/abs/2407.00079", "RDMA-based KV transfer engine."], ["NVIDIA NIXL", "https://github.com/ai-dynamo/nixl", "Inference transfer library used for KV movement."]], "q": "Estimate the KV transfer time for a 4,000-token prompt of a 70B-class model (320 KB per token) over 400 Gb/s RDMA, and compare with its prefill time.", "n": ["KV size = tokens x KV bytes per token: often hundreds of MB to GBs.", "Transports: NVLink inside a node, RDMA (InfiniBand/RoCE) across nodes, TCP as fallback.", "Overlap transfer with prefill by sending each layer when done.", "Layout mismatches (different TP or block sizes) require reshaping during transfer.", "Transfer time adds directly to TTFT if not overlapped."], "ak": "", "a": "## Size\n```\nkv_bytes = prompt_tokens * 2 * layers * kv_heads * head_dim * bytes\n```\n| Model | Per token | 4k prompt |\n| 8B (GQA, BF16) | 128 KB | 0.5 GB |\n| 70B (GQA, BF16) | 320 KB | 1.3 GB |\n| 70B, FP8 KV | 160 KB | 0.65 GB |\n\n## Links\n| Link | Bandwidth | 1.3 GB takes |\n| NVLink (intra-node) | ~400+ GB/s | ~3 ms |\n| RDMA 400 Gb/s | ~50 GB/s | ~26 ms |\n| 100 Gb/s TCP | ~10 GB/s | ~130 ms |\n\n## Overlap\nSend layer `l`'s KV as soon as prefill finishes layer `l`. Then most of the transfer happens during prefill, and only the last layer's transfer is exposed.\n\n## Layout\nIf prefill uses TP 4 and decode TP 2, each decode GPU needs KV heads from two prefill GPUs. Connectors handle the reshaping, at some cost.\n\n> Takeaway: KV transfer is GBs per request but fast on RDMA or NVLink. Overlap it with prefill and use FP8 KV to halve it.", "s": "KV size is 4,000 x 320 KB = 1.28 GB. At 50 GB/s, about 26 ms. Prefill of 4,000 tokens for a 70B model on a TP-8 H100 node takes roughly 300 to 600 ms. Transfer is small relative to prefill, especially if overlapped layer by layer."}, {"id": "21.05", "t": "Measure Transfer Cost & the Crossover Point", "f": "https://fanout.sh/inference-eng/curriculum/21-05", "k": ["disaggregation"], "x": [], "r": [["DistServe", "https://arxiv.org/abs/2401.09670", "Goodput comparison."], ["Sarathi-Serve", "https://arxiv.org/abs/2403.02310", "Strong colocated baseline with chunked prefill."]], "q": "Under what conditions does colocated serving with chunked prefill beat disaggregation?", "n": ["Disaggregation adds transfer latency and coordination overhead.", "It wins when interference is the main SLO problem: long prompts, high load, tight TPOT.", "Colocated with chunked prefill is a strong baseline; compare against it, not naive colocation.", "Find the crossover: load or prompt length where disaggregation starts to win goodput.", "Measure with the same total GPUs in both setups."], "ak": "", "a": "## Fair comparison\nSame total GPUs. Colocated: N replicas with chunked prefill and tuned token budgets. Disaggregated: P prefill + D decode GPUs with P + D = N, best split.\n\n## Sweep\nVary request rate and prompt length. At each point measure goodput under the SLO.\n\n| Condition | Usually better |\n| Low load | colocated |\n| Short prompts | colocated |\n| Long prompts, high load, tight TPOT SLO | disaggregated |\n| Slow network between pools | colocated |\n| Very bursty mix shifts | colocated or role-switching workers |\n\n## The crossover chart\nPlot goodput vs request rate for both. The point where lines cross is where disaggregation starts paying. Report it for two or three prompt lengths.\n\n> Takeaway: disaggregation is not free. Compare against tuned colocated serving with the same GPUs and find the load and prompt length where it starts to win.", "s": "At low load, where interference is small and disaggregation's fixed overheads (KV transfer, extra hop, underused separate pools) dominate; with short prompts, where prefill is cheap and interference minor; when the network between pools is slow; or when traffic's prefill/decode ratio swings faster than pools can be rebalanced, leaving one pool idle."}, {"id": "21.06", "t": "Scale and Route Prefill/Decode Independently", "f": "https://fanout.sh/inference-eng/curriculum/21-06", "k": ["disaggregation", "autoscaling"], "x": [], "r": [["NVIDIA Dynamo", "https://github.com/ai-dynamo/dynamo", "Planner for disaggregated scaling."], ["llm-d", "https://github.com/llm-d/llm-d", "Kubernetes-native distributed inference with disaggregation."]], "q": "Which signals would you use to autoscale the prefill pool and the decode pool separately?", "n": ["Each pool scales on its own signals.", "Prefill: prompt tokens queued, TTFT; decode: KV usage, concurrency, TPOT.", "Routing picks prefill workers by load and cache hits, decode workers by KV headroom.", "Some systems let workers switch roles to follow mix shifts.", "Keep minimum capacity in both pools for bursts."], "ak": "", "a": "## Signals\n| Pool | Scale-up signals | Scale-down signals |\n| Prefill | prompt tokens waiting, TTFT p95 near SLO | idle prefill time high |\n| Decode | KV usage > 85%, TPOT p95 near SLO | low KV usage, low concurrency |\n\n## Routing\n- **Prefill choice**: least queued tokens, or best prefix cache hit.\n- **Decode choice**: most free KV blocks, low running batch.\n- **Pairing**: prefer pairs with fast links between them (same rack or node).\n\n## Role switching\nWhen the mix shifts (RAG surge), converting a decode worker to prefill avoids slow cold starts. Requires workers that can run either role and drain cleanly.\n\n> Takeaway: disaggregated pools scale and route on phase-specific signals. TTFT and queued prompt tokens drive prefill; KV usage and TPOT drive decode.", "s": "Prefill pool: queued prompt tokens or prefill queue wait time, and TTFT percentile against SLO. Decode pool: KV cache usage, running sequences per worker, and TPOT percentile against SLO. Scale each when its signals approach thresholds; request rate alone is insufficient because the prompt/output mix changes."}, {"id": "21.07", "t": "Project: Reproduce a Disaggregated Serving Architecture", "f": "https://fanout.sh/inference-eng/curriculum/21-07", "k": ["project"], "x": ["Project"], "r": [["vLLM: Disaggregated prefilling", "https://docs.vllm.ai/en/latest/features/disagg_prefill.html", "A runnable starting point."], ["DistServe", "https://arxiv.org/abs/2401.09670", "Results to compare against qualitatively."]], "q": "What is the minimum setup to demonstrate disaggregation's benefit, and what chart proves it?", "n": ["Build or configure one prefill and one decode worker with a KV connector.", "Baseline: the same GPUs as two colocated replicas with chunked prefill.", "Workload: long prompts, moderate outputs, tight TPOT SLO.", "Measure goodput, TTFT, ITL p99 and transfer time.", "Report the crossover and the overheads."], "ak": "", "a": "## Setup\n- 2 (or more) GPUs with NVLink or fast network.\n- Disaggregated: 1 prefill + 1 decode worker, KV connector between them, a simple router.\n- Colocated: 2 replicas, chunked prefill, tuned budget, least-loaded routing.\n\n## Workload\n4k to 8k-token prompts, 200 to 400 output tokens, Poisson arrivals over a range of rates. SLO: p95 TTFT < 2 s, p95 TPOT < 40 ms.\n\n## Results to collect\n| Metric | Colocated | Disaggregated |\n| Goodput at each rate | | |\n| ITL p99 | | |\n| TTFT p95 | | |\n| KV transfer time p95 | n/a | |\n\n## Report\nCharts: goodput vs rate, ITL p99 vs rate. Discuss the crossover, transfer overhead and how pool ratio would change for other prompt lengths.\n\n> Takeaway: reproducing disaggregation on two GPUs shows both its benefit (no interference) and its costs (transfer, pool sizing). The goodput crossover chart is the result.", "s": "At least two GPUs (one prefill, one decode) connected by a fast link, versus the same two GPUs as colocated replicas with chunked prefill, serving a workload with long prompts and a tight TPOT SLO. The proving chart is goodput (or SLO attainment) versus request rate for both setups, plus ITL p99 showing the interference removed."}]}, {"n": "22", "name": "Production Serving & Model Lifecycle", "lessons": [{"id": "22.01", "t": "Package the Inference Service", "f": "https://fanout.sh/inference-eng/curriculum/22-01", "k": ["production", "containers"], "x": [], "r": [["NVIDIA Container Toolkit install guide", "https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html", "GPU access from containers."], ["vLLM: Using Docker", "https://docs.vllm.ai/en/latest/deployment/docker.html", "Official images and usage."]], "q": "What goes into a production inference container image, and what should stay out of it?", "n": ["Package the engine, config and service code in a pinned container image.", "Keep weights outside the image; load from a model store or cached volume.", "Configuration (model, flags) comes from environment or config files per deployment.", "Expose health, readiness and metrics endpoints.", "Build reproducibly: same image hash means same behavior."], "ak": "", "a": "## Image contents\n%%layers A production inference image.\nBase | CUDA runtime, drivers come from host\nFramework | pinned PyTorch build\n*Engine | pinned vLLM / SGLang / TRT-LLM version\nService | config loader, auth, request logging, health and metrics\nEntrypoint | starts engine with flags from config\n%%\n\n## Weights outside\n| Option | Pros | Cons |\n| Bake into image | simple, immutable | huge images, slow pulls, rebuild per model |\n| Pull from object store at start | flexible | slow cold start |\n| Shared cache volume / local NVMe | fast restarts | cache management |\n\n## Config\nOne image, many deployments: model id, revision, dtype, parallelism and scheduler flags all come from a config file or environment variables. Store configs in version control.\n\n## Endpoints\n- `/health`: process alive.\n- `/ready` (or equivalent): model loaded and warmed up.\n- `/metrics`: Prometheus.\n\n> Takeaway: ship a pinned, reproducible engine image and keep weights and config outside it. Expose health, readiness and metrics from day one.", "s": "In: a pinned engine version with its CUDA and PyTorch stack, your server wrapper or config, health and metrics endpoints, and startup scripts. Out: model weights (pull from a model store or mount a cache volume, so images stay small and models can change independently), secrets (inject at runtime), and environment-specific settings (pass as config)."}, {"id": "22.02", "t": "Model Weights, Caches & Cold Starts", "f": "https://fanout.sh/inference-eng/curriculum/22-02", "k": ["cold-start"], "x": [], "r": [["Safetensors documentation", "https://huggingface.co/docs/safetensors/index", "Fast, memory-mapped weight loading."], ["Run:ai Model Streamer", "https://github.com/run-ai/runai-model-streamer", "Streams weights from storage to GPU concurrently."]], "q": "Break down the cold start of a new 70B replica and name the biggest lever to shorten it.", "n": ["Cold start = pull image + fetch weights + load to GPU + compile/capture + warm up.", "Weight fetch usually dominates for large models.", "Local NVMe caches and streaming loaders cut it substantially.", "Compilation caches avoid recompiling on every start.", "Cold start time sets how fast you can scale up or recover."], "ak": "", "a": "## Timeline\n| Phase | 8B model | 70B model |\n| Image pull (cached node) | seconds | seconds |\n| Weights from object store | ~15 to 60 s | several minutes |\n| Load into GPU | ~5 to 15 s | ~30 to 90 s |\n| Compile + graph capture | ~20 to 120 s | ~30 to 180 s |\n| Warm-up | seconds | seconds |\n\nRough ranges; measure yours.\n\n## Levers\n- **Weights**: pre-stage on local NVMe; parallel or streaming downloads; safetensors memory mapping.\n- **Compile**: cache compile artifacts keyed on versions and shapes.\n- **Graph capture**: capture only needed batch sizes.\n- **Image**: pre-pull images on GPU nodes.\n- **Keep warm**: maintain a pool of idle-but-loaded replicas for bursts (Module 23).\n\n## Measure\nLog timestamps for each phase on every start and chart them. Cold start regressions are common after engine upgrades.\n\n> Takeaway: cold start is mostly moving weights and compiling. Cache both close to the GPU, and measure each phase on every start.", "s": "Container pull (seconds to minutes), weight download (140 GB at 1 to 2 GB/s from object storage is over a minute, often several), loading weights into GPU memory (tens of seconds), compilation and CUDA graph capture (tens of seconds to minutes), and warm-up. The biggest lever is usually weight movement: keep weights on fast local NVMe or a nearby cache, use streaming loaders, and avoid re-downloading."}, {"id": "22.03", "t": "Warm-Up, Compilation & Readiness", "f": "https://fanout.sh/inference-eng/curriculum/22-03", "k": ["readiness"], "x": [], "r": [["Kubernetes: Liveness, readiness and startup probes", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/", "Probe types."], ["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Compile and graph settings."]], "q": "Why should readiness be reported only after warm-up requests, not after the model loads?", "n": ["Loading weights is not the same as ready to serve fast.", "Warm up with representative requests: short and long prompts, typical batch sizes.", "Report ready only after warm-up completes.", "Use a startup probe with a long timeout so slow starts are not killed.", "Liveness should check the process, not latency, to avoid restart storms."], "ak": "", "a": "## Three states\n| State | Meaning | Probe |\n| Starting | loading, compiling | startup probe (long timeout) |\n| Ready | warmed, accepting traffic | readiness probe |\n| Alive | process healthy | liveness probe |\n\n## Warm-up script\n1. Send a short request and a long request.\n2. Send a batch of concurrent requests covering typical batch sizes.\n3. Hit each feature you use (structured output, LoRA, multimodal).\n4. Then flip readiness to true.\n\n## Pitfalls\n- **Liveness based on latency**: under load, slow responses cause restarts, which cause more load.\n- **Readiness too early**: first users pay for compilation.\n- **Short startup timeouts**: large models get killed before they finish loading.\n\n> Takeaway: ready means warmed, not loaded. Warm up with realistic requests before taking traffic, and keep liveness checks simple.", "s": "The first requests after load trigger lazy compilation, kernel autotuning, allocator growth and cache population, so they can be many times slower. If the load balancer sends real traffic as soon as weights load, those users get very slow responses or timeouts. Running synthetic warm-up requests first and then reporting ready keeps real users on warmed replicas."}, {"id": "22.04", "t": "Health Checks, Draining & Graceful Shutdown", "f": "https://fanout.sh/inference-eng/curriculum/22-04", "k": ["reliability"], "x": [], "r": [["Kubernetes: Pod lifecycle and termination", "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-termination", "Termination grace period."], ["Google SRE Book: Handling Overload", "https://sre.google/sre-book/handling-overload/", "Graceful degradation."]], "q": "Describe a graceful shutdown sequence for an inference replica during a rolling deploy.", "n": ["Health checks: alive vs ready; deep checks can run a tiny generation.", "Draining: stop new traffic, finish in-flight streams.", "Drain timeout should exceed typical long-request E2E time.", "Abort leftovers cleanly so clients can retry elsewhere.", "Long streams make draining slow; plan grace periods accordingly."], "ak": "", "a": "## Shutdown sequence\n%%flow Graceful shutdown.\nSIGTERM -> *Readiness false -> Finish in-flight (up to drain timeout) -> Abort rest with retryable error -> Exit\n%%\n\n## Drain timeout\nLLM requests can stream for minutes. Set the termination grace period from your E2E distribution: for example p99 E2E plus margin. Long-running reasoning or agent requests may need longer, or a cap on max tokens.\n\n## Health checks\n| Check | Does | Frequency |\n| Liveness | process responds | frequent |\n| Readiness | engine accepting and not overloaded | frequent |\n| Deep check | tiny generation succeeds within budget | occasional |\n\nA deep check catches a wedged GPU or a hung engine loop that a simple HTTP check would miss.\n\n## Common failure\nPods killed before draining finishes cut off users mid-stream. Align the platform's grace period with the engine's drain logic.\n\n> Takeaway: drain before you exit: stop new traffic, finish streams, abort the rest cleanly. Size the grace period from real E2E latency.", "s": "Mark the replica not ready so the load balancer stops sending new requests; keep serving in-flight requests until they finish or a drain timeout (longer than typical E2E latency) passes; abort remaining requests with a clear error so clients can retry; flush metrics and logs; then exit and free the GPU."}, {"id": "22.05", "t": "Version Models & Engine Configurations", "f": "https://fanout.sh/inference-eng/curriculum/22-05", "k": ["versioning"], "x": [], "r": [["Hugging Face Hub: Model revisions", "https://huggingface.co/docs/hub/models-downloading", "Downloading a specific revision."], ["vLLM: Engine arguments", "https://docs.vllm.ai/en/latest/configuration/engine_args.html", "Flags to pin."]], "q": "What should a \"deployment version\" of an LLM service pin, beyond the model name?", "n": ["A deployment is weights + tokenizer/template + quantization + engine + flags + sampling defaults.", "Pin weights by revision hash, not by name.", "Version all of it as one config artifact.", "Log the version id with every request so behavior changes can be traced.", "Changes to any part need the same testing as a model change."], "ak": "", "a": "## What to pin\n| Item | Example |\n| Weights | model id + commit hash |\n| Tokenizer + template | from the same revision |\n| Quantization | method, bits, calibration set id |\n| Engine | version, image digest |\n| Flags | full flag set |\n| Sampling defaults | temperature, top-p, max tokens |\n| Speculation | method, draft model revision |\n\n## Store as config\n```\ndeploy_id: chat-v42\nmodel: org/model@abc123\nquant: fp8-w8a8 (calib: chat-mix-2k)\nengine: vllm@<version> image@sha256:...\nflags: {tp: 2, max_num_seqs: 256, kv_cache_dtype: fp8, ...}\n```\n\n## Why it matters\nAn engine upgrade can change numerics, defaults or kernels. A template change can change output style. Without full pinning, \"the model got worse\" is impossible to debug.\n\n> Takeaway: version the whole serving stack (engine, kernels, config, model), and tag every request with that version.", "s": "The exact weights revision (hash), tokenizer and chat template, quantization recipe and calibration, engine version and image hash, all engine flags (parallelism, scheduler, KV dtype, speculation), and default sampling parameters. Any of these can change outputs or performance, so they should be versioned together and recorded with every result and log."}, {"id": "22.06", "t": "Canary Releases, Shadow Traffic & Rollbacks", "f": "https://fanout.sh/inference-eng/curriculum/22-06", "k": ["releases"], "x": [], "r": [["Google SRE Workbook: Canarying releases", "https://sre.google/workbook/canarying-releases/", "Canary practice."], ["Argo Rollouts", "https://argoproj.github.io/argo-rollouts/", "Progressive delivery on Kubernetes."]], "q": "Compare shadow traffic and a canary for testing a new quantized model, and what you would watch in each.", "n": ["Offline evals first, then shadow, then canary, then full rollout.", "Shadow: duplicate traffic, compare outputs and performance, no user impact.", "Canary: small real traffic share, monitored, with automatic rollback.", "LLM-specific signals: output length, refusal rate, format errors, user feedback.", "Keep the old version warm until the new one is proven."], "ak": "", "a": "## Release ladder\n%%flow Safe rollout for a model or engine change.\nOffline evals -> Shadow traffic -> *Canary 1% -> 10% -> 50% -> 100% -> Retire old version\n%%\n\n## What to watch\n| Signal | Why |\n| TTFT / TPOT / errors | performance regressions |\n| Output length distribution | cost and behavior shifts |\n| Format errors (JSON, tools) | integration breakage |\n| Refusal or empty response rate | safety tuning shifts |\n| User feedback, retries, task success | real quality |\n\n## Rollback\n- Automatic triggers on error rate or latency SLO breaches.\n- Keep the old version's replicas warm during the canary, so rollback is a routing change, not a cold start.\n\n## Shadow traffic caveats\nShadow doubles GPU cost for the sampled share and may hit downstream side effects if responses trigger actions; strip tools or side effects for shadow calls.\n\n> Takeaway: move model and engine changes through shadow and canary stages with LLM-specific signals, and keep rollback a routing switch.", "s": "Shadow traffic sends a copy of real requests to the new version without returning its responses to users; it is safe and shows performance and output differences, but not user reaction. A canary sends a small share of real users to the new version and returns its responses; it shows real quality signals (feedback, retries, task success) but carries risk. Watch latency, errors, output length, and quality metrics in both; in the canary, also user-facing signals and a fast rollback trigger."}, {"id": "22.07", "t": "Multi-Model & Multi-Replica Serving", "f": "https://fanout.sh/inference-eng/curriculum/22-07", "k": ["multi-model"], "x": [], "r": [["S-LoRA: Serving Thousands of Concurrent LoRA Adapters", "https://arxiv.org/abs/2311.03285", "Multi-adapter serving."], ["vLLM: LoRA adapters", "https://docs.vllm.ai/en/latest/features/lora.html", "Serving multiple LoRA adapters."]], "q": "You must serve 12 fine-tuned variants of the same 8B base, each with low traffic. What are your options?", "n": ["Many low-traffic models waste GPUs if each gets dedicated replicas.", "Options: multi-LoRA on a shared base, co-locate several small models per GPU, or swap models on demand.", "Popular models get dedicated replicas; long-tail models share.", "A routing layer maps model names to replica pools.", "Track per-model traffic to decide placement."], "ak": "", "a": "## Placement strategies\n| Strategy | Good for | Trade-off |\n| Dedicated replicas | high-traffic models | idle cost at low traffic |\n| Multi-LoRA on one base | many LoRA fine-tunes | adapter overhead, rank limits |\n| Several models per GPU | small models | memory split, interference |\n| On-demand swapping | rare models | cold start latency |\n\n## Routing\nA gateway maps `model` in the request to a pool. Pools can be:\n- One model, many replicas.\n- One base with many adapters.\n- A shared pool that loads models on demand.\n\n## Deciding\nPlot traffic per model. Head models (most traffic) get dedicated pools sized by capacity planning. Tail models share. Revisit as traffic shifts.\n\n> Takeaway: match serving strategy to traffic per model. Share GPUs across the long tail with LoRA or co-location; give dedicated replicas only to models that need them.", "s": "Serve the base once with LoRA adapters and multi-LoRA batching, so all variants share weights and run in the same batches (best if fine-tunes are LoRA). If they are full fine-tunes, pack several models per GPU when memory allows, or use model swapping with fast loading for rarely used ones. Giving each variant its own GPU wastes capacity at low traffic."}, {"id": "22.08", "t": "Project: Productionize Your Optimized Server", "f": "https://fanout.sh/inference-eng/curriculum/22-08", "k": ["project"], "x": ["Project"], "r": [["Kubernetes: Liveness, readiness and startup probes", "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/", "Probes."], ["vLLM: Production stack", "https://github.com/vllm-project/production-stack", "Reference deployment for vLLM."]], "q": "List the production-readiness checks your server must pass.", "n": ["Take your optimized single-GPU config from Module 09 to a production-shaped deployment.", "Containerize, externalize weights and config, add probes and warm-up.", "Add graceful drain, metrics and dashboards.", "Run a rolling update under load and confirm no failed requests.", "Document cold start time and capacity."], "ak": "", "a": "## Checklist\n| Item | Done when |\n| Image | pinned, digest recorded |\n| Config | in git, versioned |\n| Weights | cached; cold start measured |\n| Probes | startup, readiness after warm-up, liveness |\n| Drain | rolling update under load drops zero requests |\n| Metrics | engine + GPU metrics on a dashboard |\n| Logs | request id, version id, tokens, latency |\n| Capacity | SLO-safe rate documented with headroom |\n| Rollback | tested; old version stays warm |\n\n## The rolling update test\nRun your harness at expected load. Trigger a rolling update. Success: no errors, TTFT p99 spike within a stated bound, all streams completed.\n\n> Takeaway: production-ready means reproducible, observable, drainable and tested under a live rollout. Speed alone does not count.", "s": "Pinned, versioned config and image; weights cached for fast start; startup, readiness and liveness probes with warm-up; graceful drain within the grace period; metrics exported and dashboards built; request logging with version id; load test at expected and peak load meeting the SLO; a canary and rollback procedure tested; and a cold start time measured and documented."}]}, {"n": "23", "name": "Routing, Autoscaling & Orchestration", "lessons": [{"id": "23.01", "t": "Load Balance Across Replicas", "f": "https://fanout.sh/inference-eng/curriculum/23-01", "k": ["routing"], "x": [], "r": [["Google SRE Book: Load Balancing in the Datacenter", "https://sre.google/sre-book/load-balancing-datacenter/", "Balancing policies."], ["vLLM: Production stack router", "https://github.com/vllm-project/production-stack", "Routing options for vLLM fleets."]], "q": "Why is round-robin load balancing a poor fit for LLM replicas?", "n": ["LLM requests vary in cost by 100x or more; request counts are a bad proxy for load.", "Round robin and random spread requests, not work.", "Least outstanding requests is a big step up.", "Token- or KV-aware balancing is better still.", "Balancing must also consider cache locality (next lessons)."], "ak": "", "a": "## Policies\n| Policy | Uses | Weakness |\n| Round robin | nothing | ignores cost |\n| Random | nothing | same |\n| Least connections / outstanding | in-flight count | ignores request size |\n| Least tokens / KV usage | engine metrics | needs fresh metrics |\n| Power of two choices | sample 2, pick less loaded | good with stale info |\n\n## Why cost varies\nA 50-token answer to a short prompt and a 4,000-token generation after a 30k prompt are both \"one request\". The second uses hundreds of times more GPU time and KV.\n\n## Practical setup\n- Start with least outstanding requests.\n- Add engine signals (waiting queue, KV usage) when available.\n- Use power-of-two-choices to avoid herding onto one replica when metrics lag.\n\n> Takeaway: balance work, not requests. Least-outstanding is the minimum; queue- and KV-aware routing is better.", "s": "Requests vary hugely in cost (prompt and output length), so equal request counts produce very unequal load: one replica can be stuck with several long generations while another is idle. Round robin also ignores KV cache state and prefix locality. Least-outstanding-requests or token-aware balancing does better."}, {"id": "23.02", "t": "Queue-Aware Routing", "f": "https://fanout.sh/inference-eng/curriculum/23-02", "k": ["routing"], "x": [], "r": [["The Power of Two Choices in Randomized Load Balancing", "https://www.eecs.harvard.edu/~michaelm/postscripts/mythesis.pdf", "Mitzenmacher's analysis."], ["vLLM: Metrics", "https://docs.vllm.ai/en/latest/usage/metrics.html", "Queue and KV metrics to route on."]], "q": "What is \"herding\" in queue-aware routing and how do you prevent it?", "n": ["Route using each replica's queue depth, running sequences and KV usage.", "Metrics are stale by seconds; routers must account for requests in flight.", "Herding: everyone picks the same \"best\" replica.", "Power-of-two-choices gives most of the benefit with stale data.", "Estimate request cost from prompt length (known) and expected output length."], "ak": "", "a": "## Signals\n| Signal | Source |\n| Waiting requests | engine /metrics |\n| Running sequences | engine /metrics |\n| KV usage | engine /metrics |\n| Requests sent recently | router's own count |\n| Prompt tokens of pending requests | router knows |\n\n## A simple score\n```\nscore = waiting_tokens + alpha * running_seqs + beta * kv_usage\npick = min(random.sample(replicas, 2), key=score)\n```\n\n## Herding\nFresh metrics every few seconds plus many routers equals synchronized decisions. Mitigations: two random choices, optimistic local accounting (add your own sends immediately), jitter.\n\n## Benefits\nQueue-aware routing cuts TTFT tails noticeably under bursty load, since requests avoid replicas with long queues or near-full KV.\n\n> Takeaway: route on queue and KV signals, but expect stale metrics; power-of-two choices and local accounting avoid herding.", "s": "When many routers see the same replica as least loaded (from metrics a few seconds old), they all send to it at once, overloading it while others go idle; the pattern then flips. Prevent it with power-of-two-choices (sample two replicas at random, pick the better), local tracking of requests each router has just sent, and short metric staleness windows."}, {"id": "23.03", "t": "Prefix- & Cache-Aware Routing", "f": "https://fanout.sh/inference-eng/curriculum/23-03", "k": ["routing", "prefix"], "x": [], "r": [["SGLang: Router", "https://docs.sglang.ai/", "Cache-aware routing across workers."], ["Consistent Hashing with Bounded Loads", "https://arxiv.org/abs/1608.01350", "Affinity with load limits."]], "q": "How do you balance cache affinity against load balance when routing?", "n": ["Prefix caches are per replica; routing decides whether requests hit them.", "Send requests with the same prefix (session, system prompt, document) to the same replica.", "Pure affinity creates hot spots; cap load per replica.", "Approaches: consistent hashing with bounded loads, approximate prefix trees in the router.", "Measure hit rate per replica and load imbalance together."], "ak": "", "a": "## Approaches\n| Approach | How |\n| Session affinity | hash conversation id to a replica |\n| Prefix hash | hash first N tokens (system prompt) |\n| Router-side prefix tree | router tracks which prefixes went where |\n| Engine-reported cache state | replicas publish cached block hashes |\n\n## Balancing affinity and load\n```\nbest = replica with longest expected prefix match\nif load(best) < threshold: route to best\nelse: route to least loaded\n```\n\n## Effect\n| Routing | Hit rate | Load balance |\n| Random | low | good |\n| Pure affinity | high | hot spots |\n| Affinity with bounded load | high | good |\n\n## Multi-turn chat\nSession affinity alone often captures most of the benefit: each conversation's history stays on one replica.\n\n> Takeaway: cache-aware routing turns per-replica caches into a fleet-wide win. Prefer the replica with the cache, unless it is overloaded.", "s": "Score each candidate replica by expected cache hit (length of prompt prefix it likely holds) and by its load. Send the request to the replica with the best hit if its load is under a threshold; otherwise fall back to the least-loaded replica (and let the cache build there). Consistent hashing on a prefix key (like session id or system-prompt hash) gives affinity with bounded imbalance."}, {"id": "23.04", "t": "Autoscale From Requests, Tokens & Queue Pressure", "f": "https://fanout.sh/inference-eng/curriculum/23-04", "k": ["autoscaling"], "x": [], "r": [["Kubernetes: Horizontal Pod Autoscaling", "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/", "Autoscaling on custom metrics."], ["KEDA", "https://keda.sh/", "Event-driven autoscaling with Prometheus triggers."]], "q": "Why is GPU utilization a poor autoscaling signal for LLM servers, and what would you use?", "n": ["Scale on signals that predict SLO breaches: queue, KV usage, concurrency vs capacity.", "GPU utilization and CPU usage are weak signals for LLM servers.", "Target utilization below capacity to leave headroom for cold-start time.", "Scale down slowly to avoid flapping; scale up fast.", "Combine reactive signals with schedules or forecasts for known peaks."], "ak": "", "a": "## Candidate signals\n| Signal | Quality |\n| GPU utilization % | poor: saturates early |\n| Requests per second | ok if mix stable |\n| In-flight requests per replica | good with known capacity |\n| Waiting queue / waiting tokens | good leading indicator |\n| KV cache usage | good for memory-bound loads |\n| TTFT p95 | lagging but tied to SLO |\n\n## Target\nIf one replica's SLO-safe capacity is 40 concurrent requests, target 28 (70%). The gap covers growth during the minutes it takes to start a new replica.\n\n## Policy\n- Scale up quickly when queue grows or KV usage passes a threshold.\n- Scale down slowly (minutes of low usage) to avoid flapping and wasted cold starts.\n- Use scheduled scaling for known daily peaks.\n\n## Implementation\nExport engine metrics to Prometheus, then drive the Kubernetes HPA or KEDA with custom metrics.\n\n> Takeaway: autoscale on queue, KV and concurrency relative to measured capacity, with headroom sized to your cold-start time.", "s": "nvidia-smi utilization is near 100% whenever any kernel runs, even at low load, and does not track how close the server is to its SLO. Better signals are queue depth (waiting requests or tokens), KV cache usage, in-flight requests per replica relative to measured capacity, and SLO-related latencies (TTFT p95), possibly combined with predicted traffic."}, {"id": "23.05", "t": "Warm Capacity & GPU Startup Time", "f": "https://fanout.sh/inference-eng/curriculum/23-05", "k": ["autoscaling", "cold-start"], "x": [], "r": [["Google SRE Book: Handling Overload", "https://sre.google/sre-book/handling-overload/", "Planning for spikes."], ["Run:ai Model Streamer", "https://github.com/run-ai/runai-model-streamer", "Faster weight loading."]], "q": "Your replicas take 5 minutes to become ready, and traffic can double in 2 minutes. What capacity strategy do you need?", "n": ["Cold start time decides how much headroom you need.", "Warm pools: replicas loaded and ready but lightly used, to absorb spikes.", "Trade: idle GPU cost vs SLO risk.", "Shorten startup to reduce the headroom you must pay for.", "Use admission control as the last line during spikes."], "ak": "", "a": "## The race\n%%flow Spike vs startup.\nTraffic doubles in 2 min -> Autoscaler reacts at 30 s -> *Replica ready at 5.5 min -> SLO missed for ~3 min\n%%\n\n## Options\n| Strategy | Cost | Effect |\n| Static headroom | always paying | absorbs spikes immediately |\n| Warm standby pool | paying for idle GPUs | fast take-over |\n| Faster startup | engineering | less headroom needed |\n| Predictive scaling | forecasting | capacity ready before peaks |\n| Load shedding | some rejected requests | protects the rest |\n\n## Sizing the warm pool\nLook at the largest traffic increase within one cold-start window. That increase is how much warm or idle capacity you need.\n\n> Takeaway: if spikes are faster than startup, you pay for warm capacity or you miss the SLO. Faster startup is the way to pay less.", "s": "Reactive autoscaling alone will miss the SLO during spikes, since new capacity arrives after the spike. You need standing headroom (run below capacity), a pool of warm standby replicas (loaded and warmed but receiving little traffic), and faster startup (local weight caches, compile caches). Load shedding or degraded modes cover what remains."}, {"id": "23.06", "t": "Ray Serve LLM", "f": "https://fanout.sh/inference-eng/curriculum/23-06", "k": ["ray", "orchestration"], "x": [], "r": [["Ray Serve LLM documentation", "https://docs.ray.io/en/latest/serve/llm/index.html", "Serving LLMs with Ray Serve."], ["Ray Serve documentation", "https://docs.ray.io/en/latest/serve/index.html", "Core serving concepts."]], "q": "What does Ray Serve add on top of an inference engine like vLLM?", "n": ["Ray Serve is a Python serving framework on Ray clusters.", "Its LLM APIs wrap engines like vLLM as autoscaled deployments.", "Handles replica placement, routing, autoscaling and multi-model apps.", "Useful when you already run Ray or need Python-level composition.", "Still need engine-level tuning; Ray manages replicas, not kernels."], "ak": "", "a": "## What it provides\n| Layer | Ray Serve role |\n| API | OpenAI-compatible ingress |\n| Routing | requests to replicas, model multiplexing |\n| Replicas | engine processes placed on GPUs across nodes |\n| Autoscaling | based on ongoing requests per replica |\n| Composition | chain models and Python logic |\n\n## Typical setup\nDefine an LLM config (model, engine args, autoscaling bounds), build an app, deploy it to a Ray cluster. Ray places each replica on GPUs, including multi-GPU or multi-node replicas.\n\n## When to choose it\n- Your team already uses Ray for training or data.\n- You need Python-native pipelines (retrieval, rerank, generate) in one app.\n- You want autoscaling without building it on Kubernetes yourself.\n\n## What it does not do\nIt does not make the engine faster. Your scheduler, quantization and kernel choices still determine per-replica capacity.\n\n> Takeaway: Ray Serve is an orchestration layer for engines: replicas, routing, autoscaling and composition. Tune the engine underneath as usual.", "s": "It provides the serving layer: deployments with replicas and autoscaling, request routing between them, composition of multiple models or steps in one application, multi-node placement of engine replicas (including tensor and pipeline parallel across nodes), and an OpenAI-compatible front end, all in Python on a Ray cluster."}, {"id": "23.07", "t": "Kubernetes, GPU Scheduling & KServe", "f": "https://fanout.sh/inference-eng/curriculum/23-07", "k": ["kubernetes"], "x": [], "r": [["Kubernetes: Schedule GPUs", "https://kubernetes.io/docs/tasks/manage-gpus/scheduling-gpus/", "Device plugins and GPU requests."], ["KServe documentation", "https://kserve.github.io/website/", "InferenceService and runtimes."]], "q": "How does Kubernetes give a pod a GPU, and what does KServe add for model serving?", "n": ["GPUs are extended resources exposed by the NVIDIA device plugin.", "Pods request whole GPUs; sharing needs MIG, time slicing or MPS.", "Node labels and affinity select GPU types; topology matters for multi-GPU pods.", "KServe: InferenceService CRD, runtimes (including vLLM), autoscaling, canaries.", "LLM-specific operators (e.g. llm-d, production stacks) add cache-aware routing and disaggregation."], "ak": "", "a": "## GPUs in Kubernetes\n```\nresources:\n  limits:\n    nvidia.com/gpu: 2\nnodeSelector:\n  gpu-type: h100\n```\nThe device plugin reports GPUs per node; the scheduler places pods; the runtime maps devices into the container.\n\n## Sharing GPUs\n| Method | Isolation | Use |\n| Whole GPU | full | most LLM serving |\n| MIG (A100/H100) | hardware partitions | small models |\n| Time slicing | none | dev/test |\n\n## Multi-GPU pods\nRequest all GPUs of a TP group in one pod so they land on one node with NVLink. Multi-node replicas need a coordinating operator (LeaderWorkerSet or similar).\n\n## KServe\nAn `InferenceService` declares the model, runtime and scaling. KServe handles deployment, routing, autoscaling and canary traffic splitting. A vLLM-based runtime serves LLMs with an OpenAI-style API.\n\n> Takeaway: Kubernetes schedules whole GPUs via device plugins; KServe and LLM-specific operators add serving workflows on top.", "s": "The NVIDIA device plugin advertises GPUs as an extended resource (nvidia.com/gpu); a pod requests a whole number of them and the scheduler places it on a node with free GPUs, with the container runtime exposing those devices. KServe adds a model-serving abstraction (InferenceService) with standard runtimes, autoscaling (including scale to zero), canary rollouts and a consistent inference API on top."}, {"id": "23.08", "t": "Lab: Hold an SLO Under Changing Traffic", "f": "https://fanout.sh/inference-eng/curriculum/23-08", "k": ["lab"], "x": ["Lab"], "r": [["KEDA", "https://keda.sh/", "Autoscaling on custom metrics."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Load generation."]], "q": "How do you judge whether your autoscaling setup passed the lab?", "n": ["Replay a trace: slow ramp up, plateau, sudden 2x spike, ramp down.", "Run with static peak capacity, reactive autoscaling, and autoscaling plus warm pool.", "Measure SLO attainment per minute and GPU-hours.", "Tune thresholds, headroom and scale-down delay.", "Report the cost vs SLO trade-off of each policy."], "ak": "", "a": "## Trace\n| Phase | Duration | Rate |\n| Ramp | 10 min | 1x to 3x |\n| Plateau | 10 min | 3x |\n| Spike | 5 min | 6x |\n| Ramp down | 10 min | 6x to 1x |\n\n## Policies\n| Policy | Description |\n| Static | sized for 6x peak |\n| Reactive | autoscale on queue and KV |\n| Reactive + warm pool | plus N warm standby replicas |\n\n## Results table\n| Policy | SLO attainment | Worst minute | GPU-hours |\n| Static | | | |\n| Reactive | | | |\n| Reactive + warm | | | |\n\nPlot SLO attainment and replica count over time on one chart.\n\n> Takeaway: autoscaling is judged by SLO attainment over time and GPU-hours spent. Warm capacity is usually what saves the spike.", "s": "Replay a traffic trace with a ramp and a spike, and measure SLO attainment over time (for example per minute), total GPU-hours used, and cold starts. It passes if SLO attainment stays above target (say 99%) through the trace except a bounded window during the spike, with GPU-hours lower than a static deployment sized for peak."}]}, {"n": "24", "name": "Observability, Reliability & Security", "lessons": [{"id": "24.01", "t": "Inference Metrics, Prometheus & Grafana", "f": "https://fanout.sh/inference-eng/curriculum/24-01", "k": ["observability"], "x": [], "r": [["Prometheus: Overview", "https://prometheus.io/docs/introduction/overview/", "Metrics collection."], ["Grafana documentation", "https://grafana.com/docs/grafana/latest/", "Dashboards."], ["vLLM: Metrics", "https://docs.vllm.ai/en/latest/usage/metrics.html", "Engine metrics."]], "q": "Name the four dashboard panels you would build first for an LLM service.", "n": ["Collect engine metrics, GPU metrics and gateway metrics into Prometheus.", "Dashboards: traffic, latency vs SLO, throughput, saturation, errors.", "Use histograms for latencies and compute percentiles across replicas from buckets.", "Label by model, version and replica.", "Alert on SLO burn rate, not on every spike."], "ak": "", "a": "## Sources\n| Source | Examples |\n| Gateway | requests, status codes, client-seen latency |\n| Engine | TTFT, TPOT, queue, KV usage, tokens |\n| GPU (DCGM) | memory, SM activity, power, errors |\n| Host | CPU, RAM, network |\n\n## First dashboard\n1. Traffic: requests/s and tokens/s by model.\n2. Latency: TTFT and TPOT p50/p95/p99 with SLO lines.\n3. Saturation: waiting requests, KV usage, preemptions per replica.\n4. Errors: 4xx/5xx, timeouts, aborted streams.\n\n## Percentiles across replicas\nUse histogram buckets and `histogram_quantile` over the sum of buckets. Averaging each replica's p95 is wrong.\n\n## Alerts\nAlert on SLO burn rate (how fast you consume the error budget), plus hard failures (replica down, GPU errors). Avoid alerting on single latency spikes.\n\n> Takeaway: measure traffic, latency against SLO, saturation and errors, labeled by model and version. Alert on burn rate.", "s": "Request rate and error rate by model; TTFT and TPOT percentiles (p50, p95, p99) against SLO lines; token throughput (prompt and generation tokens per second); and engine saturation (running and waiting requests, KV cache usage, preemptions) per replica."}, {"id": "24.02", "t": "GPU, Scheduler, KV & Cache Metrics", "f": "https://fanout.sh/inference-eng/curriculum/24-02", "k": ["observability", "gpu"], "x": [], "r": [["NVIDIA DCGM Exporter", "https://github.com/NVIDIA/dcgm-exporter", "GPU metrics for Prometheus."], ["NVIDIA Xid errors", "https://docs.nvidia.com/deploy/xid-errors/index.html", "Meaning of driver error codes."]], "q": "Which GPU-level metrics can warn about hardware problems before a crash?", "n": ["GPU: memory used, SM activity, DRAM activity, power, temperature, clocks, ECC, Xid errors.", "Scheduler: running, waiting, step time, batch size, token budget usage.", "KV: usage, preemptions, swaps, blocks free.", "Prefix cache: hit rate, evictions.", "Correlate layers: a TTFT spike plus KV at 100% plus preemptions tells a clear story."], "ak": "", "a": "## GPU health\n| Metric | Warning sign |\n| ECC correctable errors | rising trend |\n| ECC uncorrectable / Xid 48, 63, 64, 79 | act now |\n| Clocks below base under load | throttling |\n| Temperature | near limit |\n| NVLink errors | interconnect trouble |\n\n## Engine internals\n| Metric | Use |\n| Step time and batch size | throughput diagnosis |\n| Waiting requests | queueing |\n| KV usage, preemptions | memory pressure |\n| Prefix hit rate, evictions | cache effectiveness |\n| Speculation acceptance | whether speculation pays |\n\n## Correlate\nBuild a panel per replica showing TTFT p95, KV usage and preemptions together. Most incidents become obvious when these three are on one chart.\n\n> Takeaway: watch GPU health counters for early hardware warnings, and engine internals to explain latency changes.", "s": "Xid errors in driver logs, ECC error counts (correctable rising, uncorrectable any), retired or remapped memory pages, NVLink error counters, thermal throttling and clock drops, and power anomalies. DCGM exposes most of these as metrics; rising correctable errors or row remapping often precede failures."}, {"id": "24.03", "t": "Distributed Request Tracing", "f": "https://fanout.sh/inference-eng/curriculum/24-03", "k": ["tracing"], "x": [], "r": [["OpenTelemetry documentation", "https://opentelemetry.io/docs/", "Tracing standard and SDKs."], ["OpenTelemetry semantic conventions for generative AI", "https://opentelemetry.io/docs/specs/semconv/gen-ai/", "Standard attribute names for LLM calls."]], "q": "What spans would a trace of one RAG chat request contain, and which attributes are specific to LLM serving?", "n": ["Traces follow one request across services: gateway, retrieval, router, engine.", "Propagate trace context through every hop, including the engine.", "Record LLM attributes: tokens in, cached tokens, tokens out, TTFT, finish reason.", "Sample traces; keep all slow or failed ones.", "Traces explain individual slow requests that metrics only show in aggregate."], "ak": "", "a": "## A trace\n%%seq Spans in one RAG request.\nGateway > Retriever : retrieve (40 ms)\nGateway > Router : route (2 ms)\nRouter > Engine : queue wait (120 ms)\nEngine > Engine : prefill (300 ms)\nEngine -> Gateway : decode stream (3.1 s)\n%%\n\n## Attributes\n| Attribute | Example |\n| model, version | chat-v42 |\n| prompt tokens / cached | 5,200 / 4,800 |\n| output tokens | 310 |\n| ttft_ms, tpot_ms | 470, 10 |\n| replica | gpu-pod-7 |\n| finish reason | stop / length / abort |\n\n## Sampling\nKeep a small random sample plus every request that is slow, errored or aborted (tail-based sampling).\n\n## Privacy\nDo not put prompts or outputs in trace attributes by default; store ids and token counts.\n\n> Takeaway: traces show where one request's time went, across services. Add LLM-specific attributes and keep every slow trace.", "s": "Spans for gateway auth, retrieval, reranking, prompt assembly, routing, engine queue wait, prefill, decode, and streaming back, plus tool calls if any. LLM-specific attributes: model and version, prompt tokens, cached prompt tokens, output tokens, TTFT, TPOT, replica id, preemptions, and finish reason."}, {"id": "24.04", "t": "Admission Control, Backpressure & Load Shedding", "f": "https://fanout.sh/inference-eng/curriculum/24-04", "k": ["reliability", "overload"], "x": [], "r": [["Google SRE Book: Handling Overload", "https://sre.google/sre-book/handling-overload/", "Load shedding and graceful degradation."], ["Google SRE Book: Addressing Cascading Failures", "https://sre.google/sre-book/addressing-cascading-failures/", "How overload spreads."]], "q": "Why is rejecting some requests early better than accepting all of them during overload?", "n": ["Admission control: accept a request only if it can likely meet its SLO.", "Backpressure: signal upstream to slow down (429, Retry-After).", "Load shedding: drop the lowest-priority work first.", "Estimate request cost by prompt length and max tokens.", "Without these, overload collapses goodput for everyone."], "ak": "", "a": "## Overload without control\n%%flow Unbounded queue under overload.\nArrivals > capacity -> Queue grows -> *Latency rises for all -> Timeouts after GPU work -> Goodput collapses\n%%\n\n## Controls\n| Control | Where | Example |\n| Queue limit | engine or gateway | max waiting tokens |\n| Admission check | gateway | reject if est. wait > SLO |\n| Priority shedding | gateway | drop free tier first |\n| Max tokens caps | gateway | bound cost per request |\n| Rate limits | per tenant | tokens per minute |\n\n## Signals for admission\n- Waiting tokens per replica.\n- KV usage.\n- Recent TTFT vs SLO.\n\n## Client side\nReturn 429 or 503 with `Retry-After`. Clients should retry with exponential backoff and jitter, not immediately.\n\n> Takeaway: under overload, saying no early protects everyone else. Bound queues, shed low-priority work, and tell clients when to retry.", "s": "Accepted requests beyond capacity queue up, so every request's latency grows, many time out after consuming GPU time, and goodput collapses. Rejecting excess requests quickly (with a retryable status) keeps latency within SLO for the admitted ones and gives clients a clear signal to back off or retry elsewhere."}, {"id": "24.05", "t": "Timeouts, Cancellation, Retries & Priorities", "f": "https://fanout.sh/inference-eng/curriculum/24-05", "k": ["reliability"], "x": [], "r": [["Google SRE Book: Addressing Cascading Failures", "https://sre.google/sre-book/addressing-cascading-failures/", "Retries and cascading failure."], ["AWS Builders' Library: Timeouts, retries and backoff with jitter", "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", "Retry design."]], "q": "A client retries any request that takes over 10 seconds. What problem does this create for an LLM service?", "n": ["LLM latency depends on output length; fixed short timeouts are wrong.", "For streams, use time-to-first-token and idle-between-tokens timeouts.", "Propagate cancellation from client to engine so work stops.", "Retry only idempotent failures, with backoff, jitter and a retry budget.", "Priorities let interactive traffic preempt batch traffic."], "ak": "", "a": "## Timeouts that fit LLMs\n| Timeout | Typical setting |\n| Connect | short |\n| Time to first token | SLO-based, e.g. 10 s |\n| Idle between chunks | e.g. 30 s |\n| Total | based on max tokens x TPOT, plus margin |\n\n## Cancellation\nWhen a client disconnects or times out, the gateway must cancel the upstream request, and the engine must abort it and free KV. Verify end to end in a test.\n\n## Retries\n- Retry on connection failures and 429/503, not on 4xx validation errors.\n- Exponential backoff with jitter.\n- Retry budget: retries at most 10% of requests per client.\n- Prefer retrying on a different replica.\n\n## Priorities\nTag requests interactive, standard or batch. The scheduler serves higher priority first; under pressure, batch work is preempted or shed.\n\n> Takeaway: LLM timeouts must follow streaming behavior, cancellation must reach the engine, and retries need backoff and budgets to avoid storms.", "s": "Long generations legitimately exceed 10 seconds, so the client cancels and resends them, and if cancellation does not propagate, the server keeps generating the old one too. Load multiplies exactly when the server is slow, causing a retry storm. Fix with timeouts tied to expected E2E (or streaming idle timeouts), propagated cancellation, retry budgets, and backoff."}, {"id": "24.06", "t": "OOM, Worker, GPU & Cache Failure Recovery", "f": "https://fanout.sh/inference-eng/curriculum/24-06", "k": ["reliability", "failures"], "x": [], "r": [["NVIDIA Xid errors", "https://docs.nvidia.com/deploy/xid-errors/index.html", "GPU error codes."], ["PyTorch: Understanding CUDA Memory Usage", "https://pytorch.org/docs/stable/torch_cuda_memory.html", "Diagnosing OOMs."]], "q": "A replica crashes with CUDA OOM during a long prompt. Describe immediate and long-term responses.", "n": ["Failure types: OOM, engine hang, GPU hardware fault, NCCL failure, node loss, cache tier failure.", "Detect fast: liveness, deep health checks, GPU error metrics.", "Contain: remove from routing, fail in-flight requests as retryable.", "Recover: restart, reschedule on healthy GPUs, cordon bad nodes.", "Prevent: bound memory use, test long inputs, track recurring faults."], "ak": "", "a": "## Failure catalogue\n| Failure | Detect | Recover |\n| CUDA OOM | crash, error log | restart; cap prompt / batch tokens |\n| Engine hang | deep health check timeout | kill and restart |\n| GPU Xid / ECC fault | DCGM, logs | cordon node, move replica |\n| NCCL timeout (multi-GPU) | engine error | restart whole TP group |\n| Node lost | orchestrator | reschedule |\n| KV tier unavailable | connector errors | fall back to recompute |\n\n## Blast radius\n- TP groups fail together: one bad GPU takes down the replica.\n- Routers must drop failed replicas quickly to avoid sending traffic into errors.\n- Cache tiers should fail open: lose cache hits, not requests.\n\n## Postmortem habits\nRecord the trigger, timeline, user impact and fix. Recurrent GPU faults on one node mean hardware replacement.\n\n> Takeaway: list your failure modes, detect each quickly, fail requests in a retryable way, and remove the root cause so it does not recur.", "s": "Immediate: the orchestrator restarts the replica, the router stops sending to it while it is down, and in-flight requests fail with a retryable error so clients retry elsewhere. Long-term: find the triggering request (prompt length, batch composition), cap max prompt length or max batched tokens to bound activation memory, lower gpu memory utilization if needed, and add a test that reproduces the case."}, {"id": "24.07", "t": "Chaos Testing", "f": "https://fanout.sh/inference-eng/curriculum/24-07", "k": ["reliability", "chaos"], "x": [], "r": [["Principles of Chaos Engineering", "https://principlesofchaos.org/", "The method."], ["Chaos Mesh", "https://chaos-mesh.org/", "Kubernetes fault injection."]], "q": "Name three chaos experiments worth running on an LLM fleet and the expected safe outcome for each.", "n": ["Chaos testing injects failures deliberately to verify recovery.", "Start with a hypothesis: \"if X fails, the SLO holds within Y.\"", "Run in staging first, then carefully in production with small blast radius.", "LLM-specific chaos: long-prompt bursts, KV exhaustion, slow replicas, cache tier loss.", "Each experiment should end in a fix or a confirmed behavior."], "ak": "", "a": "## Method\n1. Define steady state (SLO attainment, error rate).\n2. Hypothesis: steady state holds when the fault occurs.\n3. Inject the fault with a limited blast radius.\n4. Observe; abort if impact exceeds bounds.\n5. Fix weaknesses and repeat.\n\n## Experiments\n| Fault | Hypothesis |\n| Kill a replica | traffic reroutes in < 10 s; errors retried |\n| Slow replica | routing avoids it |\n| Long-prompt burst | no OOM; others' ITL p99 bounded |\n| Fill KV with long outputs | preemption or shedding, no crash |\n| Cache tier down | TTFT rises, no errors |\n| Network partition in TP group | replica restarts cleanly |\n\n> Takeaway: chaos experiments turn assumed resilience into tested resilience. Include LLM-specific faults like long-prompt bursts and KV exhaustion.", "s": "Kill one replica under load: router stops sending within seconds, SLO dips briefly, in-flight requests retry successfully. Inject a slow replica (throttle its GPU or add latency): queue-aware routing shifts traffic away and p99 stays bounded. Send a burst of very long prompts: admission control and chunked prefill keep other users within SLO and no OOM occurs."}, {"id": "24.08", "t": "API, Network, Tenant & Model Security", "f": "https://fanout.sh/inference-eng/curriculum/24-08", "k": ["security"], "x": [], "r": [["OWASP Top 10 for LLM Applications", "https://owasp.org/www-project-top-10-for-large-language-model-applications/", "Common LLM risks."], ["vLLM: Security", "https://docs.vllm.ai/en/latest/usage/security.html", "Deployment security guidance."]], "q": "List four security concerns specific to multi-tenant LLM inference.", "n": ["Authenticate and rate-limit every request; set per-tenant token quotas.", "Isolate tenants' caches (cache salts or separate pools) to prevent leakage and timing side channels.", "Keep prompts and outputs out of logs by default; encrypt at rest and in transit.", "Protect weights: access control, integrity checks, no public engine endpoints.", "Validate inputs: max lengths, allowed parameters, safe structured-output grammars."], "ak": "", "a": "## Threats and controls\n| Threat | Control |\n| Unauthenticated access | API keys / OAuth at gateway; engines on private network |\n| Resource abuse | rate limits, max prompt and output tokens, quotas |\n| Cross-tenant cache leakage | per-tenant cache salt; separate pools for sensitive tenants |\n| Data in logs | log ids and counts, not content; retention limits |\n| Weight theft | storage access control, encrypted volumes |\n| Weight tampering | checksums, signed artifacts |\n| Prompt injection via tools | sandbox tools, least privilege |\n| Engine vulnerabilities | patch, do not expose engine ports publicly |\n\n## Prefix cache timing\nIf two tenants share a cache, one can measure TTFT to infer whether a prompt prefix is cached, which leaks information. Salting the cache hash per tenant removes cross-tenant hits.\n\n## Network\nEngine endpoints should never face the internet directly. Put them behind a gateway that handles auth, limits and validation.\n\n> Takeaway: secure the gateway, isolate tenants (including caches), keep content out of logs, and protect weights. Engines belong on private networks.", "s": "Cross-tenant data leakage through shared prefix caches (timing attacks revealing whether another tenant's prompt is cached, or bugs reusing KV across tenants); prompt and output data exposure in logs or traces; abuse and resource exhaustion (huge prompts, max tokens) as denial of service; and model weight theft or tampering. Also prompt injection affecting tool-using agents."}, {"id": "24.09", "t": "Project: Break and Recover the Service", "f": "https://fanout.sh/inference-eng/curriculum/24-09", "k": ["project"], "x": ["Project"], "r": [["Principles of Chaos Engineering", "https://principlesofchaos.org/", "Experiment design."], ["Google SRE Book: Postmortem Culture", "https://sre.google/sre-book/postmortem-culture/", "Writing up incidents."]], "q": "What should the final report of this project contain?", "n": ["Run your production-shaped service under load.", "Inject at least five faults from the chaos list.", "Measure impact and recovery time for each.", "Fix at least two weaknesses and re-test.", "Write runbook entries for each failure."], "ak": "", "a": "## Plan\n| # | Fault | Hypothesis | Measure |\n| 1 | kill replica | recover < 30 s | errors, SLO per minute |\n| 2 | long-prompt burst | no OOM | ITL p99, crashes |\n| 3 | client disconnect storm | KV freed | KV usage, running seqs |\n| 4 | slow replica | routed around | per-replica traffic |\n| 5 | retry storm | backoff holds | request multiplier |\n\n## For each\nChart SLO attainment and errors over time, mark fault start and end, and compute time to recovery.\n\n## Runbook entry template\nSymptom, likely cause, dashboards to check, mitigation steps, follow-up.\n\n> Takeaway: breaking your own service on purpose, and fixing what breaks, is the fastest way to make it reliable.", "s": "The service setup and SLO; a list of injected faults with hypotheses; for each, observed impact (SLO attainment, errors, recovery time) with charts; the weaknesses found and fixes applied; re-run results after fixes; and a runbook entry for each failure type."}]}, {"n": "25", "name": "Inference Economics & Capacity Planning", "lessons": [{"id": "25.01", "t": "Cost per Request & Cost per Million Tokens", "f": "https://fanout.sh/inference-eng/curriculum/25-01", "k": ["cost"], "x": [], "r": [["Artificial Analysis", "https://artificialanalysis.ai/", "Public price and speed comparisons of LLM APIs."], ["SemiAnalysis: inference cost articles", "https://semianalysis.com/", "Industry analysis of inference economics (some paywalled)."]], "q": "A GPU costs $2.50 per hour and sustains 3,000 output tokens/s at the SLO while running at 70% average utilization. What is the cost per million output tokens?", "n": ["Cost per token = GPU cost per hour / tokens served per hour.", "Use SLO-safe throughput and real average utilization, not peak benchmark numbers.", "Input and output tokens cost differently; price or attribute them separately.", "Include all costs: idle capacity, headroom, networking, storage, engineering.", "Cost per request depends on its token mix."], "ak": "", "a": "## The formula\n```\ncost_per_M_tokens = gpu_cost_per_hour / (tokens_per_second * 3600 * utilization) * 1e6\n```\n\n## Input vs output\nPrefill tokens are cheaper per token (processed in parallel) than decode tokens. API prices reflect this with lower input prices. To split costs, measure GPU-seconds spent on prefill and decode and divide by tokens of each kind.\n\n## Cost per request\n```\ncost = prompt_tokens * c_in + output_tokens * c_out\n```\nA RAG request with 6k in and 200 out can cost more than a chat with 300 in and 600 out, depending on the ratio.\n\n## What people forget\n| Cost | Effect |\n| Headroom (run at 70%) | +43% per useful token |\n| Idle off-peak hours | lower average utilization |\n| Warm standby | paid but unused |\n| Storage, network, egress | small but real |\n| Engineering and ops time | often largest |\n\n> Takeaway: cost per token is GPU cost divided by tokens actually served at the SLO, including idle time. Split input and output costs.", "s": "Effective throughput is 3,000 x 0.7 = 2,100 tokens/s, or 7.56 million tokens per hour. $2.50 / 7.56 is about $0.33 per million output tokens. Input tokens add cost too; a complete model would attribute GPU time to both prefill and decode."}, {"id": "25.02", "t": "Goodput per Dollar", "f": "https://fanout.sh/inference-eng/curriculum/25-02", "k": ["cost", "goodput"], "x": [], "r": [["DistServe", "https://arxiv.org/abs/2401.09670", "Goodput as the serving objective."], ["Google SRE Book: Service Level Objectives", "https://sre.google/sre-book/service-level-objectives/", "SLO basics."]], "q": "Why compare configurations by goodput per dollar instead of throughput per dollar?", "n": ["Goodput per dollar = SLO-meeting tokens (or requests) per second / cost per second.", "Compare hardware, models and configs on this single number.", "It changes with the SLO: tighter SLOs favor faster hardware or smaller models.", "Also report the SLO and workload, or the number means nothing.", "Use it to decide between more cheap GPUs and fewer fast ones."], "ak": "", "a": "## Formula\n```\ngoodput_per_dollar = goodput_tokens_per_s / (gpu_cost_per_hour / 3600)\n```\n\n## Example\n| Config | Throughput tok/s | SLO met | Goodput tok/s | $/hr | Goodput tok per $ |\n| A: overloaded | 6,000 | 60% | 3,600 | 2.5 | 5.2M |\n| B: tuned | 4,800 | 99% | 4,750 | 2.5 | 6.8M |\n| C: bigger GPU | 9,000 | 99% | 8,900 | 5.0 | 6.4M |\n\nB wins on goodput per dollar despite lower throughput than A and C.\n\n## SLO sensitivity\nTighten the TPOT SLO and A and B may both fail, making C the only option. Always state the SLO alongside the number.\n\n> Takeaway: buy goodput, not throughput. Goodput per dollar under a stated SLO is the number to compare configurations on.", "s": "Throughput per dollar rewards overloading the GPU, which raises raw tokens/s but makes many requests miss the SLO. Those tokens have less or no value to the product. Goodput per dollar counts only tokens from requests that met the SLO, so it measures what you are actually buying."}, {"id": "25.03", "t": "Compare GPU Price/Performance", "f": "https://fanout.sh/inference-eng/curriculum/25-03", "k": ["hardware", "cost"], "x": [], "r": [["NVIDIA H100 product page", "https://www.nvidia.com/en-us/data-center/h100/", "Specs for a common datacenter GPU."], ["Modal GPU Glossary", "https://modal.com/gpu-glossary", "Explanations of GPU specs."]], "q": "Which GPU specs predict decode performance and which predict prefill performance, and why does the answer to \"which GPU is cheapest\" depend on the workload?", "n": ["Specs that matter: HBM capacity, HBM bandwidth, tensor FLOPs per precision, interconnect.", "Decode-heavy: bandwidth and capacity per dollar.", "Prefill-heavy: FLOPs per dollar in supported low precisions.", "Large models: capacity and NVLink decide how many GPUs per replica.", "Benchmark your workload on candidates; spec sheets are a starting filter only."], "ak": "", "a": "## Spec to workload map\n| Spec | Drives |\n| HBM capacity | model fit, KV capacity, batch size |\n| HBM bandwidth | decode speed |\n| Tensor FLOPs (FP8/FP4) | prefill speed, large-batch decode |\n| NVLink / interconnect | tensor parallel efficiency |\n| Price per hour | denominator |\n\n## Ratios to compute\n```\nbandwidth_per_dollar = TB/s / ($/hr)\nflops_per_dollar = TFLOPs / ($/hr)\nmemory_per_dollar = GB / ($/hr)\n```\n\n## Workload decides\n| Workload | Favored |\n| Chat (short in, long out) | bandwidth and memory per dollar |\n| RAG (long in, short out) | FLOPs per dollar |\n| 70B+ models | capacity and NVLink |\n| Edge / small models | cheaper GPUs, consumer cards |\n\n## Then benchmark\nRun your harness on the two or three best candidates by ratio and compare goodput per dollar.\n\n> Takeaway: decode buys bandwidth, prefill buys FLOPs, big models buy capacity. Compute per-dollar ratios to shortlist, then benchmark goodput per dollar.", "s": "Decode is predicted by memory bandwidth and memory capacity (for KV and batch size); prefill by dense tensor throughput in your precision (BF16, FP8, FP4). A decode-heavy workload favors GPUs with the best bandwidth per dollar and enough memory; a prefill-heavy RAG workload favors the best FLOPs per dollar. So the cheapest GPU changes with prompt and output lengths."}, {"id": "25.04", "t": "Capacity Planning From Benchmark Data", "f": "https://fanout.sh/inference-eng/curriculum/25-04", "k": ["capacity"], "x": [], "r": [["Google SRE Book: Software Engineering in SRE (capacity planning)", "https://sre.google/sre-book/software-engineering-in-sre/", "Intent-based capacity planning."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Producing per-replica capacity numbers."]], "q": "You expect a peak of 120 requests/s. One replica's SLO-safe capacity for your workload is 9 req/s, and you plan to run at 70%. How many replicas do you need, and what else would you add?", "n": ["Inputs: forecast peak traffic and mix, per-replica SLO-safe capacity, target utilization, failure tolerance.", "Replicas = peak / (capacity x target utilization), rounded up, plus failure spares.", "Capacity must be measured on the forecast workload mix.", "Re-plan when the model, engine or mix changes.", "Track actual vs planned to calibrate."], "ak": "", "a": "## Formula\n```\nreplicas = ceil(peak_rate / (replica_capacity * target_util)) + failure_spares\n```\n\n## Inputs\n| Input | Source |\n| Peak rate and mix | traffic forecast |\n| Replica capacity | envelope from Module 05 / 09 |\n| Target utilization | headroom policy (60 to 80%) |\n| Failure spares | N+1 per zone, or a percentage |\n\n## Example\n| Item | Value |\n| Peak | 120 req/s |\n| Capacity | 9 req/s |\n| Target | 70% |\n| Base replicas | 20 |\n| Spares | 2 |\n| Total | 22 replicas |\n\n## Mix sensitivity\nIf average prompt length doubles, capacity per replica may drop by a third. Plan for a few mix scenarios and keep the capacity table per workload shape.\n\n> Takeaway: capacity planning is peak divided by SLO-safe capacity at target utilization, plus spares. The measured envelope is what makes it trustworthy.", "s": "Planned per-replica load is 9 x 0.7 = 6.3 req/s, so 120 / 6.3 is about 19.05, round up to 20 replicas. Add N+1 or N+2 for failures (one or two replicas down), so 21 to 22, and check that the workload mix assumed in the benchmark matches forecast traffic."}, {"id": "25.05", "t": "Peak Load, Failure Headroom & Idle Capacity", "f": "https://fanout.sh/inference-eng/curriculum/25-05", "k": ["capacity", "cost"], "x": [], "r": [["OpenAI Batch API guide", "https://platform.openai.com/docs/guides/batch", "Example of discounted deferred inference."], ["Google SRE Book: Handling Overload", "https://sre.google/sre-book/handling-overload/", "Headroom planning."]], "q": "Your traffic has a daily peak 4 times the overnight minimum. What strategies reduce the cost of capacity sitting idle overnight?", "n": ["Peaks set fleet size; averages set useful work; the gap is idle cost.", "Failure headroom (N+1) adds more standing capacity.", "Reduce idle cost: autoscale, backfill with batch work, multi-region shifting.", "Commitment pricing for the baseline, flexible capacity for peaks.", "Track average utilization of the fleet as a cost KPI."], "ak": "", "a": "## Where idle comes from\n| Source | Typical share |\n| Diurnal trough | large |\n| Headroom for bursts | 20 to 40% |\n| Failure spares | 5 to 15% |\n| Warm standby | small to moderate |\n\n## Strategies\n- **Autoscale** with a floor that covers the morning ramp.\n- **Backfill**: run batch inference, evals and data generation at low priority, preempted by interactive traffic.\n- **Shift**: route traffic across regions to flatten global peaks.\n- **Pricing**: reserved capacity for the always-on baseline; on-demand or spot for peaks and batch.\n\n## KPI\nFleet average utilization of SLO-safe capacity. Raising it from 35% to 55% cuts cost per useful token by about a third.\n\n> Takeaway: peaks and headroom create idle capacity. Autoscale it away or fill it with batch work, and track fleet utilization as a cost metric.", "s": "Autoscale down overnight (keeping enough warm capacity for morning ramps); fill idle GPUs with deferrable batch jobs (offline inference, evals, embeddings) at lower priority; shift workloads across regions or time zones; and use cheaper commitment pricing for the baseline and on-demand for peaks."}, {"id": "25.06", "t": "Project: Build the Cheapest System That Meets the SLO", "f": "https://fanout.sh/inference-eng/curriculum/25-06", "k": ["project"], "x": ["Project"], "r": [["GuideLLM", "https://github.com/vllm-project/guidellm", "Benchmarking capacity."], ["lm-evaluation-harness", "https://github.com/EleutherAI/lm-evaluation-harness", "Quality gating."]], "q": "Describe the steps to find the cheapest serving system for a given workload and SLO.", "n": ["Inputs: workload, SLO, quality bar, traffic forecast.", "Candidates: model sizes, precisions, GPUs, parallelism, engine features.", "Filter by quality, then measure SLO-safe capacity per GPU.", "Compute fleet size and monthly cost per candidate.", "Choose the cheapest; show sensitivity to traffic and mix changes."], "ak": "", "a": "## Steps\n1. **Requirements**: workload mix, SLO, quality threshold, peak and average traffic.\n2. **Quality filter**: models and precisions that pass evals (Module 11).\n3. **Hardware shortlist**: per-dollar ratios (25.03).\n4. **Benchmark**: SLO-safe capacity per replica for each combination.\n5. **Fleet sizing**: replicas at peak and average (25.04).\n6. **Cost**: monthly GPU cost with autoscaling assumptions.\n\n## Result table\n| Option | Model / precision | GPU | Replicas at peak | Monthly cost |\n| 1 | 8B FP8 | L40S | | |\n| 2 | 8B FP8 | H100 | | |\n| 3 | 14B INT4 | H100 | | |\n\n## Sensitivity\nRecompute for +50% traffic and for 2x prompt length. The winner should still be reasonable; if not, note the risk.\n\n> Takeaway: the cheapest system comes from combining quality gates, measured capacity and fleet math. Show the alternatives and how the choice changes with traffic.", "s": "Fix the workload and SLO; shortlist models (sizes, quantizations) that pass quality; shortlist hardware by per-dollar ratios; benchmark each feasible combination for SLO-safe capacity; compute replicas needed for forecast peak with headroom and spares; compute monthly cost including idle and autoscaling assumptions; pick the cheapest, and document the runner-up and sensitivities."}]}, {"n": "26", "name": "Specialized Inference Workloads", "lessons": [{"id": "26.01", "t": "Structured Output & Tool-Calling Inference", "f": "https://fanout.sh/inference-eng/curriculum/26-01", "k": ["structured-output"], "x": [], "r": [["XGrammar", "https://arxiv.org/abs/2411.15100", "Efficient grammar-constrained decoding."], ["Outlines", "https://github.com/dottxt-ai/outlines", "Structured generation library."], ["vLLM: Structured outputs", "https://docs.vllm.ai/en/latest/features/structured_outputs.html", "Using guided decoding in vLLM."]], "q": "How does grammar-constrained decoding guarantee valid JSON, and what does it cost per step?", "n": ["Structured output forces outputs to match a schema, regex or grammar.", "Implementation: token masks from a grammar state machine applied before sampling.", "Mask computation must be fast and overlapped with the GPU step.", "Tool calling relies on parsing model output into function calls, often with constrained decoding.", "Measure overhead: TPOT with and without constraints, and validity rate."], "ak": "", "a": "## How it works\n%%flow Constrained decoding step.\nGrammar state -> *Allowed token mask -> Apply to logits -> Sample -> Advance state\n%%\n\n## Making it fast\n- Precompile the grammar to a state machine.\n- Cache masks for common states; most tokens are context-independent.\n- Compute the next mask on the CPU while the GPU runs the forward pass.\n\nModern backends keep overhead to a small share of step time for typical JSON schemas.\n\n## Tool calling\nModels emit tool calls in a specific format (often JSON in special tags). The server parses them into the API's `tool_calls` field. Constraining the outp
