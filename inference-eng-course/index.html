<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 32-module, 226-lesson inference engineering course: KV cache, batching, quantization, kernels, distributed serving and production.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Inference Engineering Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;650&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --panel:#EFEFF1; --side:#FAFAFA; --ink:#272727; --muted:#6E6E6E; --faint:#9C9CA3;
  --line:#E8E8EA; --line2:#C9C9CF; --accent:#2E80D9; --accent-ink:#FFFFFF; --accent-soft:#EEF8FE; --accent-line:#CBE2F7;
  --go:#2F8A5F; --go-soft:#E7F5EE; --go-line:#ABD3C1; --flame:#C8643A; --flame-soft:#FBEFE8; --gold:#9A7414; --gold-soft:#FFF8ED;
  --bad:#B9524A; --bad-soft:#FBEDEB; --paper:#FFF8ED; --paper-line:#EADDBE; --kraft:#5F5647;
  --btn-a:#272727; --btn-b:#272727; --btn-ink:#FFFFFF; --btn-edge:#272727;
  --shadow:rgba(59,59,59,.09) 0 1px 2px, rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.01) 0 0 0 1px;
  --lift:rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.09) 0 4px 8px, rgba(59,59,59,.1) 0 8px 16px, rgba(59,59,59,.01) 0 0 0 1px;
  --dg-sh:#272727; --dot:rgba(39,39,39,.08); --strip:#272727; --strip-ink:#F4F4F5;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --num:"Geist", system-ui, sans-serif;
  --pix:"Pixelify Sans", "Geist Mono", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#6AA8EC; --accent-ink:#0A1522; --accent-soft:#15212E; --accent-line:#24384F;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#6AA8EC; --accent-ink:#0A1522; --accent-soft:#15212E; --accent-line:#24384F;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.lab{font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
#readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:700;letter-spacing:-.03em;font-size:17px;white-space:nowrap}
.brand b{font-family:var(--pix);font-weight:500;color:var(--accent);letter-spacing:0}
.ibtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
#crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--muted);margin-left:8px}
#crumbs a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#crumbs a:hover{color:var(--ink)}
#crumbs .sep{color:var(--line2)}
.grow{flex:1}
.sbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;min-width:220px}
.sbtn span{flex:1;text-align:left}
kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 13px var(--mono);white-space:nowrap;text-decoration:none}
.chip.st{color:var(--flame)} .chip.st.off{color:var(--faint)}
.chip .lv{font-family:var(--num);font-size:15px;color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:18px 12px 40px;border-right:1px solid var(--line);scrollbar-width:thin}
.side .nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:14.5px;font-weight:500;color:var(--muted)}
.side .nv:hover{background:var(--panel);color:var(--ink)}
.side .nv[aria-current]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.side .nv .cnt{margin-left:auto;font:600 11px var(--mono);background:var(--flame);color:#fff;border-radius:999px;padding:1px 7px}
.side .part{margin:22px 10px 8px;display:flex;justify-content:space-between}
.side .mr{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink)}
.side .mr:hover{background:var(--panel)}
.side .mr .n{font:500 12px var(--mono);color:var(--faint)}
.side .mr .c{font:500 11px var(--mono);color:var(--faint)}
.side .mr.full .c{color:var(--go)}
.side .mr[aria-current]{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600}
.side .mr[aria-current] .n{color:var(--accent)}
.side .ls{margin:4px 0 8px 22px;padding-left:12px;border-left:1px solid var(--line)}
.side .li{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:8px;text-decoration:none;font-size:13.5px;line-height:1.4;color:var(--muted)}
.side .li:hover{color:var(--ink);background:var(--panel)}
.side .li[aria-current]{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.sd{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid var(--line2)}
.sd.on{background:var(--go);border-color:var(--go)}
#scrim{display:none}
main{min-width:0;padding:28px 36px 90px}

/* shared components */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--btn-edge);background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--btn-ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 var(--btn-edge),0 8px 18px -8px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 var(--btn-edge),0 3px 8px -4px rgba(0,0,0,.4)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:0 2px 0 var(--line2)}
.btn.go{background:linear-gradient(180deg,#22B26F,#0F8C52);border-color:#0A6B3E;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0A6B3E,0 8px 18px -8px rgba(15,140,82,.6)}
.btn .xp{font:600 12px var(--mono);padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill.k{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.a{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.ok{background:var(--go-soft);border-color:transparent;color:var(--go)}
.pill.ip{background:var(--flame-soft);border-color:transparent;color:var(--flame)}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:7px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--go)}
.seg i.cur{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:44px 0 14px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.03em}

/* home */
.hero{position:relative;overflow:hidden;padding:52px 48px 48px;min-height:440px;background-color:var(--panel);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.hero .copy{position:relative;z-index:2;max-width:540px}
.hero h1{font-size:clamp(40px,5.6vw,72px);line-height:.98;letter-spacing:-.055em;margin:16px 0 18px;font-weight:700}
.hero h1 .px{font-family:var(--pix);font-weight:500;letter-spacing:-.02em;color:var(--accent)}
.hero p.sub{font-size:18px;color:var(--muted);max-width:470px;margin:0 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.float{position:absolute;z-index:1;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);padding:16px}
.float.f1{right:46px;top:44px;width:310px;transform:rotate(3deg)}
.float.f2{right:280px;top:270px;width:250px;transform:rotate(-5deg);background:#1B1B1E;color:#F4F4F6;border-color:#000}
.float.f3{right:28px;top:236px;width:236px;transform:rotate(-1.5deg)}
.float.f4{right:250px;top:58px;width:200px;transform:rotate(-8deg);background:var(--accent);color:#fff;border-color:transparent}
.float .lab{margin-bottom:8px}
.float.f2 .lab,.float.f4 .lab{color:rgba(255,255,255,.7)}
.float.f2 .seg i{background:rgba(255,255,255,.14)} .float.f2 .seg i.on{background:#3FCB86}
.float.f4 .big{font:700 34px/1 var(--num)}
.float svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 7s ease-in-out infinite}
  .float.f2{animation-delay:-2s}.float.f3{animation-delay:-4s}.float.f4{animation-delay:-5.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .num{font:800 40px/1 var(--num);letter-spacing:-.05em;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}
.stat .num small{font:500 13px var(--mono);color:var(--muted)}
.stat .sub{font-size:13.5px;color:var(--muted)}
.wk{display:flex;gap:6px;margin-top:10px}
.wk span{flex:1;text-align:center;font:500 10px var(--mono);color:var(--faint)}
.wk span i{display:block;height:22px;border-radius:7px;background:var(--panel);margin-bottom:4px;border:1px solid var(--line)}
.wk span i.on{background:var(--flame);border-color:var(--flame)}
.wk span.today{color:var(--ink)}
.ring{position:absolute;right:18px;top:18px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.cont{padding:26px;display:flex;flex-direction:column;gap:12px}
.cont h3{font-size:28px;line-height:1.1;letter-spacing:-.04em;margin:4px 0 0}
.cont ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.cont .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.heat{padding:22px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:16px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.hm i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--card));border-color:transparent}
.hm i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--card));border-color:transparent}
.hm i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--card));border-color:transparent}
.hm i.l4{background:var(--accent);border-color:transparent}
.hm i.fut{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font:500 11px var(--mono);color:var(--faint)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{padding:16px;display:flex;flex-direction:column;gap:8px}
.bdg .ic{width:46px;height:46px;display:grid;place-items:center;font:700 17px var(--num);border-radius:14px;color:#fff;background:linear-gradient(160deg,var(--gold),#C2700A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #9A5806}
.bdg b{font-size:14.5px;letter-spacing:-.01em}
.bdg span{font-size:12.5px;color:var(--muted);line-height:1.35}
.bdg.lock{opacity:.55}
.bdg.lock .ic{background:var(--panel);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line2)}
.parth{display:flex;align-items:baseline;gap:14px;margin:34px 0 12px}
.parth h3{margin:0;font-size:19px;letter-spacing:-.03em}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:18px 18px 16px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.mcard .tp{display:flex;justify-content:space-between;align-items:center}
.mcard .no{font:500 26px/1 var(--mono);letter-spacing:-.04em;color:var(--faint)}
.mcard.done .no{color:var(--go)} .mcard.ip .no{color:var(--accent)}
.mcard h4{margin:4px 0 0;font-size:17px;line-height:1.25;letter-spacing:-.02em}
.mcard .ft{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.foot-note{margin-top:40px;font-size:13px;color:var(--faint);max-width:720px}

/* module page */
.mhead{padding:36px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.mhead h1{font-size:clamp(34px,4.4vw,56px);line-height:1;letter-spacing:-.05em;margin:10px 0 14px}
.mhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.mhead .big{font:500 110px/0.8 var(--mono);letter-spacing:-.08em;color:var(--line2);text-align:right}
.path{position:relative;max-width:760px;margin:36px auto 0;padding:10px 0}
.pnode{position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;margin:0 0 26px;transform:translateX(var(--dx,0))}
.pnode .o{flex:none;position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--num);background:var(--card);border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2);color:var(--muted);transition:transform .1s}
.pnode:hover .o{transform:translateY(-2px)}
.pnode.done .o{background:var(--go);border-color:#0A7A47;color:#fff;box-shadow:0 5px 0 #0A6B3E}
.pnode.cur .o{background:var(--accent);border-color:#0F5FA6;color:#fff;box-shadow:0 5px 0 #0D5290}
.pnode.cur .o::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);opacity:.5}
@media (prefers-reduced-motion:no-preference){.pnode.cur .o::after{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}}
.pnode .t{padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;flex:1;max-width:420px}
.pnode .t b{display:block;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pnode .t span{font:500 11.5px var(--mono);color:var(--muted)}
.pnode.cur .t{border-color:var(--accent)}
.mnav{display:flex;justify-content:space-between;gap:12px;max-width:760px;margin:30px auto 0}

/* lesson page */
.lgrid{display:grid;grid-template-columns:minmax(0,760px) 230px;gap:44px;justify-content:center}
.lhead{padding:28px 32px 26px;margin-bottom:30px}
.lhead .back{font-size:14px;color:var(--muted);text-decoration:none}
.lhead .back:hover{color:var(--ink)}
.lhead .idrow{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.lhead .lid{font:600 20px/1 var(--mono);color:var(--accent)}
.lhead h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.045em;margin:0 0 18px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.lhead .seg{margin-top:20px}
.prose{font-size:17px;line-height:1.72}
.prose>p{margin:0 0 18px}
.prose h2{counter-increment:h;font-size:24px;letter-spacing:-.035em;line-height:1.2;margin:46px 0 14px;display:flex;align-items:baseline;gap:12px}
.prose h2::before{content:counter(h,decimal-leading-zero);font:500 13px var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:7px;transform:translateY(-3px)}
.prose{counter-reset:h fig}
.prose ul,.prose ol{padding-left:22px;margin:0 0 18px}
.prose li{margin:6px 0}
.prose ul li::marker{color:var(--accent)}
.prose ol li::marker{font:600 14px var(--mono);color:var(--accent)}
.prose code{font:500 .86em var(--mono);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.prose strong{font-weight:650}
.code{font:13.5px/1.6 var(--mono);background:#16161A;color:#E9E9EE;padding:18px 20px;border-radius:14px;overflow-x:auto;margin:0 0 20px;border:1px solid #000}
.take{margin:26px 0;padding:20px 22px 20px 22px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);position:relative}
.take .lab{color:var(--accent);margin-bottom:8px}
.take p{margin:0;font-weight:550;font-size:17px}
.ex{margin:26px 0;padding:20px 22px;border-radius:16px;background:var(--card);border:1px dashed var(--line2)}
.ex .lab{color:var(--gold);margin-bottom:10px}
.ex p{margin:0 0 8px;font-size:16px}.ex p:last-child{margin:0}
.tbl{overflow-x:auto;margin:0 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--card)}

.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}

.grade{margin-top:18px}

.gbtn{padding:12px 10px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--line2);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}

/* review */
.rv{max-width:680px;margin:0 auto}

/* palette, toasts */
#pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,10,14,.42);backdrop-filter:blur(3px)}

.toast.big{padding:16px 24px;font-size:16px;background:linear-gradient(180deg,#22B26F,#0F8C52)}
.toast.big b{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:85;width:100%;height:100%}

<script>
const DATA = [{"n": "IN", "name": "What Is Inference Engineering?", "lessons": [{"id": "IN.01", "t": "What Is Inference & Inference Engineering?", "f": "https://fanout.sh/inference-eng/curriculum/in-01", "k": ["basics"], "x": [], "r": [["Lilian Weng: Large Transformer Model Inference Optimization", "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "Survey of the main optimization families."], ["kipply: Transformer Inference Arithmetic", "https://kipp.ly/transformer-inference-arithmetic/", "The back-of-envelope maths behind inference costs."]], "q": "In two sentences, explain the difference between training a model and serving it, and name one metric an inference engineer owns.", "n": ["Inference is running a trained model on new inputs. For LLMs it means turning a prompt into generated tokens.", "Training is a one-off, throughput-only job. Inference runs forever, on live traffic, with latency targets.", "An inference engineer makes a given model faster, cheaper and more reliable without changing what it outputs (or while measuring how much it changes).", "The work spans math (memory, FLOPs), systems (scheduling, batching, caching), hardware (GPUs, interconnects) and operations (autoscaling, observability).", "The core trade-off is latency for one user vs throughput across all users. Most techniques move you along that curve."], "ak": "", "a": "## What inference means\nA model is trained once, then used many times. Using it is called inference: you feed in an input and get an output with the weights frozen. For a large language model (LLM), the input is a prompt and the output is a stream of tokens, produced one at a time.\n\nTraining is a batch job. It can take weeks, and nobody is waiting on a single step. Inference is the opposite. A real user is waiting, traffic changes every minute, and the bill for GPUs keeps running whether they are busy or idle. For a popular model, total inference spend usually ends up larger than the training spend.\n\n## What an inference engineer does\nAn inference engineer takes a model as given and makes serving it better along three axes:\n- **Latency**: how fast one user gets their first token and how fast the rest stream in.\n- **Throughput**: how many tokens per second a GPU (or a cluster) produces across all users.\n- **Cost**: dollars per million tokens, at a stated quality and latency target.\n\nThey also own reliability: the server must stay up, fail gracefully under overload and recover from GPU faults.\n\n%%flow Where inference sits relative to training.\nData -(train)-> Weights -(load)-> *Inference server -(tokens)-> Users\n%%\n\n## Why it is its own discipline\nServing an LLM is not like serving a web app. Each request has a different length, generation is sequential, and memory per request grows as it generates. A naive server wastes most of an expensive GPU. Techniques like continuous batching, KV caching, quantization and speculative decoding each recover a large share of that waste, and they interact in ways you only learn by measuring.\n\n| Concern | Training | Inference |\n| Goal | Best weights | Fast, cheap outputs |\n| Batch | Fixed and large | Changing, request driven |\n| Bottleneck | Usually compute | Often memory bandwidth |\n| Runs | Weeks, then stops | Continuously |\n\n> Takeaway: inference engineering is the job of serving a fixed model with the best latency, throughput and cost you can prove with measurements.", "s": "Training adjusts a model's weights using huge batches of data, usually offline, and is judged by final model quality. Inference runs the frozen weights on live requests, one token at a time, and is judged by latency, throughput and cost. An inference engineer owns metrics such as time to first token, tokens per second per GPU, or cost per million tokens."}, {"id": "IN.02", "t": "The Inference Stack: Model to GPU to Production", "f": "https://fanout.sh/inference-eng/curriculum/in-03", "k": ["stack"], "x": [], "r": [["vLLM documentation", "https://docs.vllm.ai/en/latest/", "A full engine you can map onto this stack."], ["Modal GPU Glossary", "https://modal.com/gpu-glossary", "Short definitions of GPU hardware and software terms."]], "q": "List the layers a single chat request passes through from the user's HTTP call to GPU kernels, and name one optimization that lives at each layer.", "n": ["Think of inference as a stack: API, routing, engine scheduler, KV memory, model runtime, kernels, hardware.", "Every layer has a characteristic optimization and a characteristic metric.", "Bottlenecks move between layers. Fixing the kernel layer does nothing if the scheduler leaves the GPU idle.", "Production adds a fleet layer on top: replicas, autoscaling, rollouts and observability.", "Knowing which layer a symptom comes from is most of debugging."], "ak": "", "a": "## The layers\nA chat request touches many layers before a token comes back. It helps to name them so you can say where a problem lives.\n\n%%layers The inference stack, top to bottom.\nAPI and gateway | auth, rate limits, OpenAI-compatible endpoints, streaming\nRouter and fleet | load balancing, cache-aware routing, autoscaling\n*Engine scheduler | which requests run this step, batching, preemption\nKV cache manager | paged blocks, prefix reuse, offload\nModel runtime | forward pass, CUDA graphs, compilation\nKernels | attention, GEMM, fused norms, quantized matmuls\nHardware | HBM, SMs, tensor cores, NVLink, PCIe\n%%\n\n## What each layer controls\n- **API**: request format, streaming protocol (usually server-sent events), timeouts.\n- **Router**: which replica gets a request. A router that knows which replica already has a prompt prefix cached can skip a lot of work.\n- **Scheduler**: decides every step which sequences advance. This is where continuous batching lives and where the latency vs throughput trade-off is set.\n- **KV manager**: stores the attention keys and values for every active token. It decides how many requests fit at once.\n- **Runtime**: launches the model's kernels. Overheads here (Python, kernel launches) matter most at small batch sizes.\n- **Kernels**: the math itself. Good kernels move fewer bytes and keep tensor cores busy.\n- **Hardware**: sets the ceilings: memory capacity, memory bandwidth, FLOPs, interconnect speed.\n\n## Reading symptoms by layer\n| Symptom | Likely layer |\n| High time to first token under load | Scheduler or queueing |\n| Out-of-memory with long prompts | KV manager |\n| Low GPU utilization at batch 1 | Runtime overhead |\n| Slow tokens at every batch size | Kernels or hardware bandwidth |\n| One replica hot, others idle | Router |\n\n> Takeaway: name the layer before you optimize. Most wasted effort comes from tuning a layer that is not the bottleneck.", "s": "Client and API gateway (rate limiting, auth), router or load balancer (cache-aware routing), inference engine scheduler (continuous batching), KV cache manager (paged allocation, prefix caching), model runtime (CUDA graphs, torch.compile), kernels (FlashAttention, quantized GEMM), and hardware (GPU memory and NVLink). Each layer has its own optimizations and its own metrics."}, {"id": "IN.03", "t": "Levels of Inference Engineering", "f": "https://fanout.sh/inference-eng/curriculum/in-04", "k": ["career"], "x": [], "r": [["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Where level-4 work often happens."], ["SGLang GitHub repository", "https://github.com/sgl-project/sglang", "A second engine worth reading."]], "q": "Describe what distinguishes a level-2 (engine user) from a level-4 (engine builder) inference engineer, with one concrete task each.", "n": ["Level 1: run a model locally and get tokens out. Know what a GPU, a tokenizer and a model checkpoint are.", "Level 2: operate a real engine. Benchmark correctly, tune flags, size hardware against an SLO.", "Level 3: optimize. Quantize, cache prefixes, profile, choose parallelism, run a fleet with routing and autoscaling.", "Level 4: build. Write kernels, change schedulers, read and modify engine code, reproduce papers.", "The course follows these levels. Pick a learner path based on which level you need."], "ak": "", "a": "## A ladder, not a checklist\nInference work ranges from \"get a model answering\" to \"write a faster attention kernel\". It helps to see it as levels, each building on the one below.\n\n| Level | You can | Typical task |\n| 1. Run | Load and query a model | Serve a 7B model on one GPU |\n| 2. Operate | Run and tune an engine | Find max concurrency under a p95 TTFT target |\n| 3. Optimize | Change how it runs | Quantize to FP8, add prefix caching, pick tensor parallel size |\n| 4. Build | Change the engine | Write a fused kernel, modify the scheduler |\n\n## How the course maps to the levels\n- Spaces 1 to 3 (foundations, how inference works, measurement) get you to level 2.\n- Spaces 4 and 5 (engines, single-GPU optimization) are level 3 on one GPU.\n- Space 6 (kernels, compilation, speculation) and Space 7 (multi-GPU) are the deep end of level 3 and the start of level 4.\n- Space 8 (production) is level 3 at fleet scale.\n- Spaces 9 and 10 (engine reading, mini engine, research) are level 4.\n\n## Four learner paths\n- **Applied inference engineer**: core path through production. Most people stop here.\n- **Runtime or performance engineer**: core path plus kernels, attention, compilation, speculation and engine internals.\n- **Distributed inference engineer**: core path plus multi-GPU, MoE, long context, disaggregation and routing.\n- **Research or engine engineer**: everything, including the mini engine and paper reproduction.\n\n> Takeaway: you do not need level 4 to be useful. Most production wins come from level 2 and 3 work done carefully with good measurements.", "s": "A level-2 engineer runs an existing engine like vLLM, tunes flags such as max batched tokens and GPU memory fraction, and benchmarks against an SLO, for example picking the cheapest GPU that meets p95 TTFT. A level-4 engineer changes the engine itself, for example writing a new attention kernel or modifying the scheduler, and proves the gain with profiles and ablations."}]}, {"n": "00", "name": "Inference Engineering Prerequisites", "lessons": [{"id": "00.01", "t": "Math for Memory, Throughput & Speedups", "f": "https://fanout.sh/inference-eng/curriculum/00-01", "k": ["math"], "x": [], "r": [["kipply: Transformer Inference Arithmetic", "https://kipp.ly/transformer-inference-arithmetic/", "Worked examples of FLOP and byte counts."], ["Horace He: Making Deep Learning Go Brrrr", "https://horace.io/brrr_intro.html", "Compute, memory and overhead as the three costs."]], "q": "A 70B-parameter model is stored in BF16. How much memory do the weights need, and what is the decode speed ceiling on a GPU with 3.35 TB/s of bandwidth at batch size 1?", "n": ["Memory for weights = parameters x bytes per parameter (FP32 4, BF16 2, FP8 1, INT4 0.5).", "A forward pass costs about 2 x parameters FLOPs per token.", "Decode at small batch is limited by bandwidth: tokens/s is roughly bandwidth divided by bytes read per step.", "Speedup claims should use the same baseline, same workload and same metric. Amdahl's law caps gains from optimizing one part.", "Keep units straight: GB vs GiB, tokens per second per request vs per GPU."], "ak": "", "a": "## Three numbers you compute constantly\nMost inference questions come down to three estimates.\n\n1. **Bytes of weights**: parameters times bytes per parameter. An 8B model in BF16 is 16 GB. In INT4 it is about 4 GB plus some scale factors.\n2. **FLOPs per token**: about 2 times the parameter count (one multiply and one add per weight). An 8B model needs about 16 GFLOPs per generated token.\n3. **Bytes moved per step**: during decode, every weight is read from GPU memory once per step, plus the KV cache for every active sequence.\n\n## Bandwidth sets the decode ceiling\nA GPU can do far more math per second than it can read bytes. An H100 offers roughly 990 TFLOPs of dense BF16 compute and about 3.35 TB/s of HBM bandwidth. At batch size 1, decoding one token of an 8B model does 16 GFLOPs but reads 16 GB. The math finishes in microseconds; the reading takes about 5 ms. So the ceiling is about 200 tokens per second, set by bandwidth.\n\nBatching helps because one weight read serves every sequence in the batch. With 32 sequences, you still read 16 GB once per step but produce 32 tokens.\n\n%%flow Why batching raises throughput during decode.\nRead weights once -(per step)-> *Use for B sequences -> B tokens out\n%%\n\n## Speedups and Amdahl's law\nIf attention is 30% of step time and you make it twice as fast, the step gets only 15% faster. Always ask what fraction of total time the optimized part was. Report speedups as ratios on the same workload: same model, same prompts, same output lengths, same hardware.\n\n! Example: fitting a model\n! A 13B model in BF16 needs 26 GB for weights.\n! On a 24 GB GPU it does not fit. In FP8 it needs 13 GB, leaving 11 GB for KV cache and activations.\n! Bandwidth ceiling at batch 1 on a 1 TB/s card: 1000 / 13 is about 77 tokens per second.\n\n> Takeaway: weights in bytes, 2 x params FLOPs per token, and bandwidth divided by bytes per step. These three estimates answer most capacity questions before you run anything.", "s": "70 billion parameters times 2 bytes is 140 GB, so it does not fit on one 80 GB GPU. If it did, each decode step must read all weights once, so the ceiling is about 3.35 TB/s divided by 140 GB, roughly 24 tokens per second at batch 1, ignoring KV reads and overheads."}, {"id": "00.02", "t": "Vectors, Matrices & Tensor Shapes", "f": "https://fanout.sh/inference-eng/curriculum/00-02", "k": ["math", "tensors"], "x": [], "r": [["PyTorch: Tensors tutorial", "https://pytorch.org/tutorials/beginner/basics/tensorqs_tutorial.html", "Tensor creation, shapes and operations."], ["Mathematics for Machine Learning (book)", "https://mml-book.github.io/", "Linear algebra background, free PDF."]], "q": "In a transformer layer with hidden size 4096, a batch of 8 sequences each 512 tokens long enters a linear layer with weight shape [4096, 11008]. What are the input and output shapes, and how many FLOPs does the matmul take?", "n": ["A tensor is an n-dimensional array. In LLMs the common activation shape is [batch, sequence, hidden].", "Matrix multiply [M, K] x [K, N] gives [M, N] and costs 2MKN FLOPs.", "Linear layers in transformers are matmuls where M is the number of tokens in flight.", "Attention adds a head dimension: [batch, heads, seq, head_dim].", "Most bugs and many performance surprises are shape bugs. Print shapes early."], "ak": "", "a": "## Shapes are the language of inference\nEvery tensor in a transformer has a shape, and knowing the shapes tells you both the memory and the compute cost of each step.\n\n- A token's hidden state is a vector of length `d_model` (for example 4096).\n- A batch of tokens is a matrix `[tokens, d_model]`, often written `[batch, seq, d_model]`.\n- A weight matrix maps one size to another, for example `[4096, 4096]` for an attention projection.\n\n## The matmul rule\nMultiplying `[M, K]` by `[K, N]` produces `[M, N]` and costs `2 * M * K * N` FLOPs. In a linear layer, `M` is the number of tokens being processed this step, `K` the input width, `N` the output width.\n\nThis is why prefill and decode differ so much. In prefill, `M` is the whole prompt (thousands of tokens). In decode, `M` is just the batch size (one new token per sequence). Same weights, very different `M`.\n\n| Phase | M (rows) | Weight reuse |\n| Prefill, 2,000-token prompt | 2,000 | Each weight used 2,000 times |\n| Decode, batch 16 | 16 | Each weight used 16 times |\n\n## Attention shapes\nAttention splits the hidden size into heads: `[batch, heads, seq, head_dim]`, where `heads * head_dim = d_model`. Scores are `Q @ K^T`, shape `[batch, heads, q_len, k_len]`. In decode `q_len` is 1 and `k_len` is the full context so far.\n\n```\nx      = [B, S, 4096]\nq = x @ Wq  -> [B, S, 4096] -> view [B, S, 32, 128] -> transpose [B, 32, S, 128]\nscores = q @ k.transpose(-1, -2) -> [B, 32, S, S]\n```\n\n> Takeaway: write the shapes down. `2MKN` for matmul FLOPs and the size of `M` explain most of the difference between prefill and decode.", "s": "Input is [8, 512, 4096], output is [8, 512, 11008]. FLOPs are 2 x 8 x 512 x 4096 x 11008, about 370 GFLOPs."}, {"id": "00.03", "t": "Dot Products, Softmax & Attention Math", "f": "https://fanout.sh/inference-eng/curriculum/00-03", "k": ["math", "attention"], "x": [], "r": [["Attention Is All You Need", "https://arxiv.org/abs/1706.03762", "The original scaled dot-product attention."], ["3Blue1Brown: Attention in transformers", "https://www.3blue1brown.com/lessons/attention", "Visual explanation of queries, keys and values."]], "q": "Why does attention divide scores by the square root of the head dimension, and why do implementations subtract the max before softmax?", "n": ["A dot product measures how aligned two vectors are. Attention scores are dot products between a query and every key.", "Softmax turns scores into weights that are positive and sum to 1.", "Scaled dot-product attention: softmax(Q K^T / sqrt(d)) V.", "Subtract the row max before exp for numerical safety. This trick also enables online softmax, used by FlashAttention.", "A causal mask sets future positions to minus infinity so a token only attends to earlier ones."], "ak": "", "a": "## Dot products\nThe dot product of two vectors multiplies them element by element and sums: `a . b = sum(a_i * b_i)`. It is large when the vectors point the same way. Attention uses it to ask \"how relevant is each earlier token to this one?\"\n\n## Softmax\nSoftmax turns a list of scores into probabilities: `softmax(x)_i = exp(x_i) / sum_j exp(x_j)`. Large scores dominate, small ones fade to near zero.\n\nTwo practical details matter for inference:\n- **Stability**: `exp` overflows for large inputs. Subtracting the max score first gives the same answer and keeps numbers small.\n- **Streaming**: if you track the running max and running sum, you can compute softmax over blocks without seeing all scores at once. This \"online softmax\" is what lets FlashAttention avoid storing the full score matrix.\n\n## Scaled dot-product attention\nFor each query, compute scores against every key, scale by `1/sqrt(d_head)`, apply a causal mask, softmax, then take a weighted sum of values.\n\n```\nscores = Q @ K.T / sqrt(d_head)      # [q_len, k_len]\nscores[future] = -inf                 # causal mask\nweights = softmax(scores, dim=-1)\nout = weights @ V                     # [q_len, d_head]\n```\n\n%%flow Scaled dot-product attention for one head.\nQ, K -(dot)-> Scores -(scale, mask)-> *Softmax -(weights)-> Weighted sum of V\n%%\n\n## Why the scaling\nIf entries of `q` and `k` have variance 1, their dot product has variance `d_head`. With `d_head = 128`, raw scores would be large and softmax would put almost all weight on one token. Dividing by `sqrt(128)` brings variance back to about 1.\n\n> Takeaway: attention is dot products, a scale, a mask and a softmax. The max-subtraction trick is both a safety measure and the foundation of fast attention kernels.", "s": "Dot products of random vectors grow with dimension, so dividing by sqrt(d) keeps score variance near 1 and stops softmax saturating into a near one-hot distribution. Subtracting the max keeps exp() from overflowing; it does not change the result because softmax is invariant to adding a constant to every input."}, {"id": "00.04", "t": "Probability, Sampling & Benchmark Statistics", "f": "https://fanout.sh/inference-eng/curriculum/00-04", "k": ["statistics", "sampling"], "x": [], "r": [["The Curious Case of Neural Text Degeneration (nucleus sampling)", "https://arxiv.org/abs/1904.09751", "Why top-p sampling exists."], ["The Tail at Scale", "https://research.google/pubs/the-tail-at-scale/", "Why tail latency matters for services."]], "q": "You run a benchmark twice and get p99 latency of 820 ms and 1,140 ms. What does this tell you, and what would you do before reporting a number?", "n": ["An LLM outputs a probability distribution over the vocabulary at each step. Sampling picks a token from it.", "Temperature reshapes the distribution; top-k and top-p cut off unlikely tokens.", "Benchmarks are samples too. Report percentiles (p50, p95, p99), not just means.", "Tail percentiles need many samples. p99 from 200 requests rests on 2 data points.", "Repeat runs and report spread. A 5% \"speedup\" inside run-to-run noise is not a result."], "ak": "", "a": "## Distributions over tokens\nAt each step the model produces a score (logit) for every vocabulary token. Softmax turns those into probabilities. Generation then picks one token:\n- **Greedy**: always take the most likely token. Deterministic but can repeat itself.\n- **Temperature**: divide logits by `T` before softmax. `T < 1` sharpens, `T > 1` flattens.\n- **Top-k**: keep only the k most likely tokens.\n- **Top-p (nucleus)**: keep the smallest set whose probabilities sum to p.\n\nSampling choices affect output length and therefore cost and latency. Two runs with different seeds can produce different lengths, which matters when you benchmark.\n\n## Statistics for benchmarks\nLatency is a distribution, not a number. Use percentiles:\n- **p50** is the typical user.\n- **p95 / p99** are the unlucky users, and often what SLOs are written against.\n\nPercentiles from small samples are noisy. If you measure 100 requests, p99 is basically the single slowest one. As a rule, collect at least a few thousand requests for stable p99s.\n\n## Comparing two configurations\n- Run each configuration several times.\n- Interleave runs (A, B, A, B) so drift in the machine affects both.\n- Report the median across runs and the min-max range.\n- Only call a difference real if it is larger than the run-to-run spread.\n\n! Example: noisy speedup\n! Config A: throughput 1,020, 990, 1,050 tokens/s. Config B: 1,060, 1,000, 1,070.\n! B's median (1,060) is 4% above A's (1,020), but the ranges overlap heavily. Not yet a result; run more.\n\n> Takeaway: generation is sampling from a distribution, and so is benchmarking. Use percentiles, enough samples and repeated runs before claiming a win.", "s": "The p99 is unstable, likely because too few requests were measured or the system was not at steady state. Run longer (thousands of requests), discard warm-up, repeat several times, and report the median of runs with a spread or confidence interval rather than one number."}, {"id": "00.05", "t": "Python & PyTorch for Inference", "f": "https://fanout.sh/inference-eng/curriculum/00-05", "k": ["pytorch"], "x": [], "r": [["PyTorch: inference_mode", "https://pytorch.org/docs/stable/generated/torch.inference_mode.html", "Disables autograd tracking for inference."], ["PyTorch: CUDA semantics", "https://pytorch.org/docs/stable/notes/cuda.html", "Asynchronous execution, streams and memory management."]], "q": "Name three PyTorch settings or habits that matter for inference but not for training, and say why.", "n": ["Use torch.inference_mode() to skip autograd bookkeeping.", "Choose dtype on load (torch_dtype=torch.bfloat16) and device placement up front.", "CUDA calls are asynchronous. Call torch.cuda.synchronize() before reading a timer.", "torch.cuda.memory_allocated and max_memory_allocated show what the model and activations really use.", "Python overhead matters at small batch sizes; engines hide it with CUDA graphs and compiled code."], "ak": "", "a": "## The PyTorch you need\nYou do not need to be a PyTorch expert to do inference work, but a few habits separate correct measurements from misleading ones.\n\n## Turn off training machinery\n`torch.inference_mode()` tells PyTorch you will never call backward, so it does not save tensors for gradients. This cuts memory and a little overhead.\n\n```\nimport torch\nwith torch.inference_mode():\n    out = model(input_ids)\n```\n\n## Pick dtype and device on load\nLoading a model in FP32 on the CPU, then converting, doubles peak memory and wastes time. Ask for the dtype you want and load straight to the GPU.\n\n```\nmodel = AutoModelForCausalLM.from_pretrained(name, torch_dtype=torch.bfloat16, device_map=\"cuda\")\n```\n\n## Time GPU work correctly\nPyTorch queues CUDA kernels and returns immediately. If you read a timer right after a call, you measure how long it took to queue work, not to do it.\n\n```\ntorch.cuda.synchronize(); t0 = time.perf_counter()\nout = model(x)\ntorch.cuda.synchronize(); dt = time.perf_counter() - t0\n```\n\nCUDA events (`torch.cuda.Event(enable_timing=True)`) are an alternative that times on the GPU itself.\n\n## Watch memory\n- `torch.cuda.memory_allocated()`: bytes held by tensors now.\n- `torch.cuda.max_memory_allocated()`: peak since last reset.\n- `torch.cuda.memory_reserved()`: bytes the caching allocator holds, including free blocks it keeps for reuse.\n\n## Know where Python costs you\nEach layer launches several small kernels. At batch size 1 the GPU can finish a kernel faster than Python can launch the next one. That is why engines use CUDA graphs and compilation, covered later.\n\n> Takeaway: inference_mode, the right dtype on load, and synchronizing before timing. Without these, your numbers are wrong before you start.", "s": "Use torch.inference_mode() (or no_grad) so autograd does not store activations. Load weights directly in BF16 or FP16 on the GPU instead of FP32 on CPU, halving memory and load time. Synchronize with torch.cuda.synchronize() before taking timings, because CUDA calls are asynchronous and timing without it measures only kernel launch."}, {"id": "00.06", "t": "Transformer Architecture Refresher", "f": "https://fanout.sh/inference-eng/curriculum/00-06", "k": ["transformer"], "x": [], "r": [["The Illustrated Transformer", "https://jalammar.github.io/illustrated-transformer/", "Visual walkthrough of the architecture."], ["Llama 2 paper", "https://arxiv.org/abs/2307.09288", "A concrete modern decoder-only architecture."], ["nanoGPT", "https://github.com/karpathy/nanoGPT", "Short readable GPT implementation."]], "q": "Sketch one decoder layer of a modern LLM like Llama and say which part dominates parameters and which part grows with context length.", "n": ["LLMs are decoder-only transformers: embeddings, N identical layers, final norm, LM head.", "Each layer has attention (mix information across tokens) and an MLP (transform each token independently).", "Modern variants use RMSNorm, rotary position embeddings (RoPE), gated MLPs (SwiGLU) and grouped-query attention (GQA).", "MLP weights dominate parameter count; attention cost and KV memory grow with sequence length.", "Residual connections let each layer add to a running hidden state instead of replacing it."], "ak": "", "a": "## The big picture\nA decoder-only LLM turns token ids into a probability distribution over the next token.\n\n%%flow A decoder-only transformer.\nToken ids -> Embedding -> *N decoder layers -> Final norm -> LM head -> Logits\n%%\n\n## One decoder layer\nEach layer reads the hidden state `h` and adds two updates to it.\n\n%%layers One Llama-style decoder layer.\nRMSNorm | normalize the hidden state\n*Self-attention | Q, K, V projections, RoPE, causal attention, output projection\nResidual add | h = h + attention(norm(h))\nRMSNorm | normalize again\n*Gated MLP | gate and up projections, SiLU, down projection\nResidual add | h = h + mlp(norm(h))\n%%\n\n## Where the parameters are\nFor a model with hidden size `d` and MLP width about `2.7d` (SwiGLU):\n- Attention projections: about `4d^2` parameters (less with GQA, which shares K and V heads).\n- MLP: three matrices of `d x 2.7d`, about `8d^2`.\n\nSo roughly two thirds of each layer's weights sit in the MLP. For a Llama-3-8B-sized model (`d = 4096`, 32 layers), that is most of the 8 billion.\n\n## What grows with context\n- **KV cache**: every past token stores a key and value per layer. Memory grows linearly with context.\n- **Attention compute**: each new token attends to all past tokens, so per-token cost grows linearly, and prefill cost grows quadratically with prompt length.\n\n## Modern changes that matter for inference\n- **GQA**: several query heads share one K/V head, shrinking KV cache by 4 to 8 times.\n- **RoPE**: positions are applied by rotating Q and K, so no position table is needed and extending context is easier.\n- **RMSNorm**: cheaper than LayerNorm (no mean subtraction).\n\n> Takeaway: attention mixes tokens, the MLP holds most weights. KV memory and attention cost scale with context; weight reads scale with model size.", "s": "Input goes through RMSNorm, then self-attention (Q, K, V projections, RoPE on Q and K, attention, output projection), plus a residual add; then RMSNorm, a gated MLP (gate, up, down projections with SiLU), plus a residual add. The MLP holds most parameters (around two thirds). Attention's KV cache and attention compute grow with context length."}, {"id": "00.07", "t": "Linux, SSH & Remote GPU Machines", "f": "https://fanout.sh/inference-eng/curriculum/00-07", "k": ["linux", "tooling"], "x": [], "r": [["nvidia-smi documentation", "https://docs.nvidia.com/deploy/nvidia-smi/index.html", "Every field and query flag."], ["tmux wiki", "https://github.com/tmux/tmux/wiki", "Keep sessions alive across disconnects."]], "q": "You rent a cloud GPU box. List the first five commands you run and what each tells you.", "n": ["Most inference work happens on remote Linux GPU machines over SSH.", "Use SSH keys and an ~/.ssh/config entry; forward ports with -L to reach a server running on the box.", "Run long jobs inside tmux or screen so a dropped connection does not kill them.", "Check disk early: model weights are tens to hundreds of GB.", "nvidia-smi is the first health check: GPU type, memory, driver, running processes."], "ak": "", "a": "## The working environment\nGPUs worth benchmarking are rarely on your laptop. You will rent machines from a cloud or a GPU provider and work over SSH.\n\n## Connect cleanly\nAdd an entry to `~/.ssh/config` so connecting is one word:\n\n```\nHost gpu\n  HostName 203.0.113.10\n  User ubuntu\n  IdentityFile ~/.ssh/id_ed25519\n  LocalForward 8000 localhost:8000\n```\n\n`LocalForward` makes a server on the GPU box's port 8000 reachable at `localhost:8000` on your laptop.\n\n## First checks on a new box\n```\nnvidia-smi                 # GPU model, memory, driver, CUDA version\nnproc; free -h; df -h      # CPU, RAM, disk\npython -c \"import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name())\"\n```\n\n## Keep work alive\nSSH sessions drop. Start `tmux new -s bench` and run everything inside it. Reattach with `tmux attach -t bench`.\n\n## Disk and downloads\nModel weights are large: 16 GB for an 8B model in BF16, 140 GB for a 70B. Put the Hugging Face cache on the biggest, fastest disk (`HF_HOME=/data/hf`). Download once, then reuse across runs.\n\n## Watch the machine while you work\n- `watch -n1 nvidia-smi` for a live view.\n- `htop` to see whether the CPU is a bottleneck (tokenization and Python can be).\n- `nvidia-smi topo -m` on multi-GPU boxes to see how GPUs are connected.\n\n> Takeaway: SSH config, tmux, a big disk for weights and nvidia-smi. Get these right once and every later lab is easier.", "s": "nvidia-smi (GPU model, driver, CUDA version, memory, processes); nproc and free -h (CPU cores and RAM); df -h (disk space for model weights); python -c \"import torch; print(torch.cuda.is_available(), torch.version.cuda)\" (PyTorch sees the GPU); and tmux new -s work so long jobs survive an SSH drop."}, {"id": "00.08", "t": "CUDA, Drivers, PyTorch & GPU Compatibility", "f": "https://fanout.sh/inference-eng/curriculum/00-08", "k": ["cuda", "setup"], "x": [], "r": [["CUDA Compatibility guide", "https://docs.nvidia.com/deploy/cuda-compatibility/index.html", "Driver vs runtime version rules."], ["PyTorch: Get Started locally", "https://pytorch.org/get-started/locally/", "Picking the right wheel for your CUDA version."]], "q": "nvidia-smi reports \"CUDA Version: 12.4\" but your PyTorch wheel was built for CUDA 12.8 and fails to see the GPU. Explain why and how to fix it.", "n": ["Stack: GPU hardware, kernel driver, CUDA runtime/toolkit, libraries (cuBLAS, cuDNN, NCCL), framework (PyTorch), engine (vLLM).", "The driver must be new enough for the CUDA runtime your framework was built with.", "nvidia-smi's \"CUDA Version\" is the max the driver supports, not what is installed.", "Each GPU generation has a compute capability (e.g. 8.0 A100, 9.0 H100). Some kernels and dtypes (FP8) need a minimum.", "Pin versions. Containers make the whole stack reproducible."], "ak": "", "a": "## The layers of the GPU software stack\n%%layers Software stack from hardware up.\nGPU hardware | compute capability, e.g. 8.0 A100, 8.9 L40S, 9.0 H100\nKernel driver | installed on the host, sets the max CUDA version supported\nCUDA runtime and libraries | cuBLAS, cuDNN, NCCL, often bundled in the PyTorch wheel\n*PyTorch | built against a specific CUDA version\nInference engine | vLLM, SGLang, TensorRT-LLM, built against a specific PyTorch\n%%\n\n## The rule that breaks most setups\nThe driver is the floor. A CUDA 12.x application needs a driver that supports 12.x. PyTorch wheels ship their own CUDA runtime libraries, so you usually do not need a separate CUDA toolkit installed. You do need a recent enough driver.\n\n`nvidia-smi` shows \"CUDA Version: X\" as the maximum the driver supports. `nvcc --version` shows an installed toolkit, if any. They are different things.\n\n## Compute capability\nEach GPU generation has a compute capability. Features depend on it:\n| GPU | Capability | Notable for inference |\n| A100 | 8.0 | BF16, TF32, no FP8 |\n| L40S / RTX 4090 | 8.9 | FP8 tensor cores |\n| H100 / H200 | 9.0 | FP8, TMA, warp-group MMA |\n| B200 | 10.0 | FP4 tensor cores |\n\nAn engine may refuse an FP8 model on an A100 because the hardware lacks FP8 tensor cores.\n\n## Make it reproducible\n- Pin exact versions of PyTorch and the engine.\n- Prefer the engine's official container image; it bundles a tested combination.\n- Record `nvidia-smi`, `torch.__version__`, `torch.version.cuda` and engine version in every benchmark result.\n\n> Takeaway: driver supports a max CUDA version, frameworks need a min. Match them, check compute capability for dtype support, and pin everything.", "s": "nvidia-smi shows the highest CUDA version the installed driver supports, not an installed toolkit. A PyTorch build for CUDA 12.8 needs a driver new enough for 12.8. Either upgrade the NVIDIA driver or install a PyTorch build for a CUDA version the driver supports, such as 12.4 or earlier."}, {"id": "00.09", "t": "Lab: Build Your Inference Engineering Setup", "f": "https://fanout.sh/inference-eng/curriculum/00-09", "k": ["lab"], "x": ["Lab"], "r": [["NVIDIA Container Toolkit install guide", "https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html", "Running GPU containers with Docker."], ["Hugging Face Hub documentation", "https://huggingface.co/docs/hub/index", "Downloading and caching models."]], "q": "Write the checklist your setup must pass before you trust any benchmark from it.", "n": ["Goal: a repeatable GPU environment you can rebuild in minutes.", "Use a container or a pinned virtual environment; record versions automatically.", "Cache weights on local NVMe and set HF_HOME.", "Write an env-report script and run it before every experiment.", "Finish with a smoke test: load a small model and generate tokens."], "ak": "", "a": "## What you are building\nA setup you trust. Every later lab assumes your numbers come from a known, repeatable environment.\n\n## Steps\n1. Provision a single-GPU Linux machine and connect with an SSH config entry.\n2. Check the GPU with `nvidia-smi` and note the driver version.\n3. Create a pinned environment: either the official vLLM container or a Python virtual environment with exact versions.\n4. Set `HF_HOME` to a large local disk and log in to Hugging Face if you need gated models.\n5. Write `env_report.py` that prints GPU name, memory, driver, `torch.__version__`, `torch.version.cuda`, and engine versions as JSON.\n6. Run a smoke test: load a small instruct model (1 to 3B parameters) and generate 50 tokens.\n\n```\ndocker run --gpus all -it --rm -v /data/hf:/root/.cache/huggingface -p 8000:8000 vllm/vllm-openai:<pinned-tag> --model Qwen/Qwen2.5-1.5B-Instruct\n```\n\n## What good looks like\n- A fresh machine goes from zero to generating tokens in under 15 minutes.\n- Every result file starts with the env report.\n- You know where weights live and how much disk is left.\n\n## Common problems\n- Driver too old for the container's CUDA: upgrade the driver or pick an older image.\n- Out of disk mid-download: weights are large; check `df -h` first.\n- Port not reachable: use SSH `LocalForward` instead of opening ports publicly.\n\n> Takeaway: invest an hour once in a pinned, documented setup. It pays back on every experiment that follows.", "s": "GPU visible to PyTorch with the expected name and memory; driver and CUDA versions recorded; model weights cached on fast local disk; a pinned environment (container or lockfile); a tmux session; a script that prints environment info into every result file; and a smoke test that generates tokens from a small model."}]}, {"n": "01", "name": "Run Your First LLM", "lessons": [{"id": "01.01", "t": "Choose & Download an Open Model", "f": "https://fanout.sh/inference-eng/curriculum/01-01", "k": ["models"], "x": [], "r": [["Hugging Face Hub: Models", "https://huggingface.co/docs/hub/models", "Model cards, files and licenses."], ["Safetensors documentation", "https://huggingface.co/docs/safetensors/index", "The safe, fast weight format most models ship in."]], "q": "You have one 24 GB GPU. Pick a model size and precision for a chat assistant and justify it with memory math.", "n": ["Pick by task quality, license, size and context length. Instruct or chat variants are tuned to follow prompts.", "Weight memory = params x bytes per param. Leave 20 to 40% of GPU memory for KV cache and overhead.", "Models ship as safetensors shards plus config.json, tokenizer files and a generation config.", "Read the model card: chat template, context length, license, recommended sampling settings.", "Download once with huggingface-cli or snapshot_download and reuse the cache."], "ak": "", "a": "## What to look at when picking a model\n- **Task fit**: an instruct or chat model for assistants, a base model for completion or fine-tuning.\n- **Size**: parameter count decides memory and speed. 1 to 3B for experiments, 7 to 14B for a capable single-GPU model, 70B+ for multi-GPU.\n- **Context length**: the maximum tokens per sequence the model was trained for.\n- **License**: some weights are gated or restrict commercial use.\n- **Architecture**: dense vs mixture-of-experts, attention type (GQA, MLA). This changes memory and speed.\n\n## Does it fit?\n| Model | BF16 weights | FP8 | INT4 |\n| 1.5B | 3 GB | 1.5 GB | ~1 GB |\n| 8B | 16 GB | 8 GB | ~5 GB |\n| 14B | 28 GB | 14 GB | ~8 GB |\n| 70B | 140 GB | 70 GB | ~38 GB |\n\nWeights are not the whole story. The KV cache, activations and CUDA context also need space. A good starting rule: weights should take at most 60 to 80% of GPU memory.\n\n## What is in a model repo\n- `config.json`: architecture hyperparameters (layers, hidden size, heads, KV heads, vocab, max positions).\n- `*.safetensors`: the weights, often split into shards.\n- `tokenizer.json`, `tokenizer_config.json`: the tokenizer and the chat template.\n- `generation_config.json`: default sampling settings.\n\n## Download\n```\nhuggingface-cli download Qwen/Qwen2.5-7B-Instruct --local-dir /data/models/qwen7b\n```\nKeep the cache on fast local disk. Loading from network storage can take minutes and dominates cold start.\n\n> Takeaway: choose by quality, license and fit. Do the bytes math first: if weights take more than about 80% of memory, there is no room left for users.", "s": "An 8B instruct model in BF16 needs about 16 GB for weights, leaving roughly 6 to 7 GB for KV cache and activations, which is enough for modest concurrency at a few thousand tokens of context. A 14B model would need 28 GB in BF16 and only fits if quantized to 8-bit or 4-bit. So an 8B BF16 model, or a larger model in FP8/INT4 if quality needs it."}, {"id": "01.02", "t": "Load, Tokenize & Inspect the Model", "f": "https://fanout.sh/inference-eng/curriculum/01-02", "k": ["tokenizer"], "x": [], "r": [["Hugging Face Tokenizers documentation", "https://huggingface.co/docs/tokenizers/index", "How BPE and other tokenizers work."], ["Hugging Face: Chat templates", "https://huggingface.co/docs/transformers/main/en/chat_templating", "Formatting conversations for chat models."]], "q": "Why does the same sentence produce a different number of tokens in two models, and why does that matter for cost and latency comparisons?", "n": ["A tokenizer maps text to integer ids from a fixed vocabulary, usually with byte-pair encoding.", "Chat models expect a chat template that wraps messages in special tokens. Skipping it degrades output.", "Inspect config.json: layers, hidden size, attention heads, KV heads, vocab size, max positions.", "Count parameters and check dtype after loading to confirm what you are actually running.", "Tokens, not characters or words, are the unit of cost, latency and context length."], "ak": "", "a": "## Tokenization\nModels work on token ids, not text. A tokenizer splits text into subword pieces using a learned vocabulary (often 32k to 200k entries). Common words become one token; rare words are split into several.\n\n```\nfrom transformers import AutoTokenizer\ntok = AutoTokenizer.from_pretrained(path)\nids = tok(\"Inference engineering is fun\")[\"input_ids\"]\nprint(len(ids), tok.convert_ids_to_tokens(ids))\n```\n\nRough rule for English: 1 token is about 0.75 words. Code and non-English text often use more tokens per character.\n\n## Chat templates\nChat models are trained on conversations wrapped in special markers. `apply_chat_template` builds the right string.\n\n```\nmsgs = [{\"role\": \"user\", \"content\": \"Explain KV cache in one line.\"}]\nprompt = tok.apply_chat_template(msgs, add_generation_prompt=True, tokenize=False)\n```\n\nForgetting the template is a common cause of rambling or broken output that looks like a model problem.\n\n## Inspect the model\n```\nmodel = AutoModelForCausalLM.from_pretrained(path, torch_dtype=torch.bfloat16, device_map=\"cuda\")\nprint(model.config)                      # layers, heads, kv heads, hidden size\nprint(sum(p.numel() for p in model.parameters()) / 1e9, \"B params\")\nprint(next(model.parameters()).dtype)\nprint(torch.cuda.memory_allocated() / 1e9, \"GB\")\n```\n\nThe config numbers you will use most: `num_hidden_layers`, `hidden_size`, `num_attention_heads`, `num_key_value_heads`, `max_position_embeddings`. They feed directly into KV cache math later.\n\n> Takeaway: always measure in tokens with the model's own tokenizer, always use the chat template, and read config.json before doing any capacity math.", "s": "Each model has its own tokenizer and vocabulary, so it splits text into different pieces; larger vocabularies tend to use fewer tokens per word. Since compute, memory and pricing scale with tokens, comparing models by requests or words without counting tokens per model gives misleading cost and speed comparisons."}, {"id": "01.03", "t": "Generate & Stream Your First Tokens", "f": "https://fanout.sh/inference-eng/curriculum/01-03", "k": ["generation"], "x": [], "r": [["Hugging Face: Generation with LLMs", "https://huggingface.co/docs/transformers/main/en/llm_tutorial", "generate() basics and pitfalls."], ["Hugging Face: Text generation strategies", "https://huggingface.co/docs/transformers/main/en/generation_strategies", "Greedy, sampling, beam search and streamers."]], "q": "Explain why streaming improves perceived latency without changing total generation time.", "n": ["model.generate runs the autoregressive loop: forward pass, pick next token, append, repeat.", "max_new_tokens bounds output length; stop tokens end generation early.", "Streaming sends tokens as they are produced. Users see the first token after TTFT instead of waiting for the end.", "Time the first token and the rest separately: they are different phases with different costs.", "Detokenizing token by token needs care: some tokens are partial characters."], "ak": "", "a": "## The generation loop\nGeneration is a loop. Each step runs the model on the sequence so far, takes the logits for the last position, picks a token and appends it.\n\n%%flow The autoregressive loop.\nPrompt -(forward)-> Logits -(sample)-> *Next token -(append)-> Prompt + token\n%%\n\nWith Hugging Face:\n```\ninputs = tok(prompt, return_tensors=\"pt\").to(\"cuda\")\nout = model.generate(**inputs, max_new_tokens=128, do_sample=True, temperature=0.7)\nprint(tok.decode(out[0][inputs.input_ids.shape[1]:], skip_special_tokens=True))\n```\n\n## Streaming\nA streamer receives tokens as they are generated:\n```\nfrom transformers import TextIteratorStreamer\nstreamer = TextIteratorStreamer(tok, skip_prompt=True)\nThread(target=model.generate, kwargs=dict(**inputs, max_new_tokens=128, streamer=streamer)).start()\nfor text in streamer: print(text, end=\"\", flush=True)\n```\n\nStreaming detokenization is tricky because a token may be only part of a multibyte character. Streamers buffer until they can emit valid text.\n\n## First timings\nMeasure two numbers:\n- **Time to first token (TTFT)**: from request to first token. Dominated by processing the prompt.\n- **Time per output token**: average gap between later tokens. Dominated by reading weights each step.\n\nOn one GPU with an 8B model you might see TTFT of 50 to 100 ms for a short prompt and 20 to 30 ms per token with plain Hugging Face. A real engine will beat both, which is what later modules explain.\n\n> Takeaway: generation is a loop of forward passes. Stream tokens to users and measure first-token time and per-token time separately.", "s": "Without streaming the user waits for the whole response. With streaming, tokens are sent as soon as each is generated, so the user starts reading after the first token (TTFT) instead of after the last. Total end-to-end time is the same or slightly longer, but the wait the user feels is much shorter."}, {"id": "01.04", "t": "Watch GPU Memory, Utilization & Power", "f": "https://fanout.sh/inference-eng/curriculum/01-04", "k": ["gpu", "monitoring"], "x": [], "r": [["nvidia-smi documentation", "https://docs.nvidia.com/deploy/nvidia-smi/index.html", "Fields and query options."], ["NVIDIA DCGM Exporter", "https://github.com/NVIDIA/dcgm-exporter", "GPU metrics for Prometheus, including SM activity."]], "q": "nvidia-smi shows 100% GPU utilization during decode at batch size 1. Does this mean the GPU is fully used? Explain.", "n": ["Memory used in nvidia-smi includes the PyTorch caching allocator's reserve and the CUDA context, not just tensors.", "\"GPU-Util\" means a kernel was running, not that the GPU was busy. It is a weak signal.", "Power draw and clock speed are better hints of real load. A busy GPU runs near its power limit.", "DCGM metrics like SM activity and DRAM activity give a truer picture.", "Log these alongside every benchmark so you can explain results later."], "ak": "", "a": "## What nvidia-smi tells you\n```\nnvidia-smi --query-gpu=name,memory.used,memory.total,utilization.gpu,power.draw,clocks.sm,temperature.gpu --format=csv -l 1\n```\n\n- **memory.used**: everything allocated on the GPU, including the CUDA context (a few hundred MB) and memory PyTorch has reserved but not handed out.\n- **utilization.gpu**: percent of time a kernel was running. It does not measure how much of the chip was busy.\n- **power.draw**: watts. Close to the power cap means the chip is working hard.\n- **clocks.sm**: falling clocks under load can mean thermal or power throttling.\n\n## Why GPU-Util misleads\nAn H100 has 132 streaming multiprocessors. A kernel that uses 10 of them still counts as \"utilized\". During batch-1 decode you often see high GPU-Util with modest power draw. That pattern means the GPU is waiting on memory or launching tiny kernels, not doing heavy math.\n\n| Signal | Means |\n| High util, low power | Small kernels or memory bound |\n| High util, high power | Real heavy work |\n| Low util | GPU idle: CPU, Python or queue bottleneck |\n| Clocks dropping | Throttling: check temperature and power cap |\n\n## Better metrics\nDCGM exposes `SM_ACTIVE`, `SM_OCCUPANCY`, `DRAM_ACTIVE` and `PIPE_TENSOR_ACTIVE`. DRAM activity near 100% during decode confirms you are bandwidth bound. Tensor pipe activity tells you how much of the matmul hardware is used.\n\n## Memory as seen by PyTorch\nCompare `torch.cuda.memory_allocated()` (tensors) with `memory_reserved()` (allocator pool) and nvidia-smi (everything). Engines like vLLM grab a fixed fraction of GPU memory up front for the KV cache, so nvidia-smi will show memory \"full\" even when idle. That is expected.\n\n> Takeaway: GPU-Util is not efficiency. Watch memory, power and clocks, and use DCGM or a profiler when you need the truth.", "s": "No. nvidia-smi's utilization counts the fraction of time at least one kernel was running, not how much of the GPU's compute or bandwidth it used. A batch-1 decode can keep a tiny kernel running constantly and show 100% while using a small fraction of the SMs and tensor cores. Use SM occupancy, achieved bandwidth or a profiler to judge real usage."}, {"id": "01.05", "t": "Serve the Model Over HTTP", "f": "https://fanout.sh/inference-eng/curriculum/01-05", "k": ["serving", "api"], "x": [], "r": [["FastAPI documentation", "https://fastapi.tiangolo.com/", "Building HTTP APIs in Python."], ["MDN: Using server-sent events", "https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events", "The streaming protocol most LLM APIs use."]], "q": "Your FastAPI server wraps model.generate. Two users send requests at the same time. What happens and why is it a problem?", "n": ["A minimal server: an HTTP endpoint that takes a prompt, runs generate, returns text.", "Streaming responses usually use server-sent events (SSE): \"data: ...\" lines over one HTTP response.", "OpenAI-compatible request and response shapes let existing clients work with your server.", "A naive server processes one request at a time. Concurrency queues up and the GPU sits mostly idle.", "This limitation is what motivates real inference engines with batching."], "ak": "", "a": "## A minimal server\n```\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\napp = FastAPI()\n\n@app.post(\"/v1/completions\")\ndef complete(req: dict):\n    def gen():\n        for text in stream_tokens(req[\"prompt\"], req.get(\"max_tokens\", 128)):\n            yield f\"data: {json.dumps({'text': text})}\\n\\n\"\n        yield \"data: [DONE]\\n\\n\"\n    return StreamingResponse(gen(), media_type=\"text/event-stream\")\n```\n\n## Server-sent events\nSSE keeps one HTTP response open and writes `data: ...` lines as tokens arrive. It is simple, works through most proxies, and is what OpenAI-compatible APIs use when `stream: true`.\n\n%%seq One streamed request.\nClient > Server : POST /v1/completions (stream)\nServer > GPU : prefill prompt\nServer -> Client : data: first token\nServer > GPU : decode step\nServer -> Client : data: next token\nServer -> Client : data: [DONE]\n%%\n\n## What breaks under load\nThis server handles one request at a time per model copy. If ten users arrive together:\n- The tenth waits for nine full generations.\n- The GPU runs at batch size 1 the whole time, using a fraction of its capacity.\n\nYou could batch requests that arrive together, but they finish at different times, and short ones wait for long ones. Solving this properly needs continuous batching and a KV cache manager. That is what vLLM and similar engines do, and why Module 06 moves to one.\n\n> Takeaway: a wrapper around generate is fine for a demo and wrong for production. One-at-a-time serving queues users and wastes the GPU.", "s": "With a single model and a blocking generate call, requests run one at a time: the second user waits for the first request to finish, so latency grows linearly with queue length. The GPU also runs at batch size 1, wasting most of its capacity. Real engines batch concurrent requests together at every step."}, {"id": "01.06", "t": "Lab: Build a Reproducible GPU Inference Server", "f": "https://fanout.sh/inference-eng/curriculum/01-06", "k": ["lab"], "x": ["Lab"], "r": [["Hugging Face: Generation with LLMs", "https://huggingface.co/docs/transformers/main/en/llm_tutorial", "Reference for the generate loop."], ["FastAPI documentation", "https://fastapi.tiangolo.com/", "Server framework used in the lab."]], "q": "Describe the three measurements your lab report must include and why each matters.", "n": ["Build a small HTTP server that streams tokens from a 1 to 8B model.", "Pin everything: model revision, dtype, library versions, sampling settings.", "Measure TTFT, time per output token and peak memory for one request.", "Send 1, 2, 4 and 8 concurrent requests and plot latency vs concurrency.", "Write down what you observe. You will compare against vLLM in Module 06."], "ak": "", "a": "## Goal\nA small, pinned server you can rebuild anywhere, plus a baseline you will beat in later modules.\n\n## Steps\n1. Choose a model and pin its revision (commit hash) in your config.\n2. Load in BF16 with `inference_mode` and the chat template.\n3. Expose `POST /v1/chat/completions` with SSE streaming.\n4. Write a client script that records, per request: send time, first-token time, each token time, end time, tokens out.\n5. Run with concurrency 1, 2, 4, 8 using fixed prompts and `max_tokens`.\n6. Record peak GPU memory and the env report.\n\n## Expected results\n- Concurrency 1: TTFT and per-token latency close to what you saw in 01.03.\n- Concurrency 8: average latency roughly 8 times worse, because requests queue.\n- Throughput in tokens per second barely improves with concurrency.\n\n| Concurrency | Expect TTFT | Expect throughput |\n| 1 | baseline | baseline |\n| 4 | ~4x worse at the tail | ~same |\n| 8 | ~8x worse at the tail | ~same |\n\n## Report\nOne page: setup, method, a latency vs concurrency chart, peak memory, and two sentences on why this server cannot scale. Keep the script; Module 04 turns it into a proper benchmark harness.\n\n> Takeaway: your first server is the baseline. Its flat throughput under concurrency is the problem the rest of the course solves.", "s": "TTFT and per-token latency for a single request (the best-case baseline), latency as concurrency rises from 1 to 8 (shows queueing in a naive server), and peak GPU memory with the model loaded (shows headroom for KV cache). Together they show the baseline and why a real engine is needed."}]}, {"n": "02", "name": "Understand One Token", "lessons": [{"id": "02.01", "t": "Trace the Transformer Forward Pass", "f": "https://fanout.sh/inference-eng/curriculum/02-01", "k": ["transformer"], "x": [], "r": [["The Illustrated GPT-2", "https://jalammar.github.io/illustrated-gpt2/", "Visual walkthrough of a decoder forward pass."], ["Hugging Face Llama modeling code", "https://github.com/huggingface/transformers/blob/main/src/transformers/models/llama/modeling_llama.py", "Reference implementation to trace."]], "q": "For one decode step of a 32-layer model, list the operations in order from token id to next-token logits.", "n": ["Forward pass: embed tokens, run N layers, normalize, project to vocabulary logits.", "Each layer is attention then MLP, each wrapped in a norm and a residual add.", "The LM head is a big matmul: hidden size x vocabulary (e.g. 4096 x 128k).", "In decode, only the newest token goes through the layers; earlier tokens are represented by cached K and V.", "Hooks or a profiler let you see every op and its time."], "ak": "", "a": "## From id to logits\n%%flow One forward pass.\nToken id -> Embedding -> *Layer 1..N -> Final RMSNorm -> LM head -> Logits [vocab]\n%%\n\n## Inside each layer\n1. `x = rmsnorm(h)`\n2. `q, k, v = x @ Wq, x @ Wk, x @ Wv`\n3. Apply RoPE to `q` and `k`\n4. Store `k, v` in the KV cache\n5. `a = attention(q, K_cache, V_cache)` then `a @ Wo`\n6. `h = h + a`\n7. `x = rmsnorm(h)`\n8. `m = (silu(x @ Wgate) * (x @ Wup)) @ Wdown`\n9. `h = h + m`\n\n## Prefill vs decode in the trace\n- In **prefill**, `h` has shape `[prompt_len, d]`. Every op processes all prompt tokens at once, and attention is prompt-by-prompt.\n- In **decode**, `h` has shape `[1, d]` per sequence. Attention reads all cached K and V for that sequence.\n\n## Where time goes\nTrace a decode step with the PyTorch profiler and you typically see:\n- Matmuls (QKV, output, gate, up, down, LM head) dominate.\n- Attention grows with context length.\n- Many small ops (norms, RoPE, residual adds) each take little time but add launch overhead.\n\n| Op | FLOPs share (short context) | Comment |\n| MLP matmuls | ~60% | three big matrices |\n| Attention projections | ~25% | smaller with GQA |\n| LM head | ~5 to 10% | large vocab |\n| Attention itself | small, grows with context | memory heavy |\n\n> Takeaway: a forward pass is embed, N x (attention + MLP), norm, LM head. In decode only the newest token runs through it, using cached K and V for the past.", "s": "Embedding lookup for the new token; then for each of 32 layers: RMSNorm, Q/K/V projections, RoPE on Q and K, append K and V to the cache, attention over all cached keys and values, output projection, residual add, RMSNorm, gate and up projections, SiLU and multiply, down projection, residual add; then a final RM
