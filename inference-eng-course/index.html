SNorm and the LM head matmul to vocabulary logits."}, {"id": "02.02", "t": "Q, K, V & Causal Attention During Inference", "f": "https://fanout.sh/inference-eng/curriculum/02-02", "k": ["attention"], "x": [], "r": [["Attention Is All You Need", "https://arxiv.org/abs/1706.03762", "Original attention formulation."], ["GQA: Training Generalized Multi-Query Transformer Models", "https://arxiv.org/abs/2305.13245", "Sharing K and V heads to cut memory."]], "q": "In decode, why do we only compute Q for the new token, but need K and V for every previous token?", "n": ["Query: what this token is looking for. Key: what each token offers. Value: what each token passes on.", "Causal masking means a token only sees itself and earlier tokens.", "Because of the mask, a past token's K and V never change. That makes the KV cache possible.", "Decode attention is one query against many keys: a matrix-vector product, memory bound.", "Multi-query and grouped-query attention share K/V heads to shrink the cache."], "ak": "", "a": "## The three roles\nEach token's hidden state is projected three ways:\n- **Query (Q)**: what this position wants to know.\n- **Key (K)**: a label describing what each position contains.\n- **Value (V)**: the content each position contributes if attended to.\n\nThe output for a token is a weighted sum of values, where weights come from softmax of its query against all keys.\n\n## Causal masking\nIn a decoder, token `t` may only attend to positions `0..t`. Future positions are masked to minus infinity before softmax. A consequence: a token's K and V depend only on itself and earlier tokens, so they never change after they are computed.\n\n## Attention during decode\nAt step `t`, only the new token needs a query. It attends over keys and values for positions `0..t`.\n\n%%flow Decode attention for one head.\nNew token q [1 x d] -(dot)-> K cache [t x d] -> Scores [1 x t] -(softmax)-> *Weights -(mix)-> V cache [t x d]\n%%\n\nThis is a matrix-vector product. It reads the entire K and V cache for that sequence and does little math per byte, so it is bandwidth bound.\n\n## Shrinking K and V\n| Variant | K/V heads | KV size vs MHA |\n| Multi-head (MHA) | = query heads (e.g. 32) | 1x |\n| Grouped-query (GQA) | e.g. 8 | 1/4 |\n| Multi-query (MQA) | 1 | 1/32 |\n\nGQA is the common choice in current open models: most of MQA's memory savings with little quality loss.\n\n> Takeaway: the causal mask makes past K and V immutable, so we cache them. Decode attention is one query reading the whole cache, which makes it memory bound.", "s": "The new token is the only one asking a question about the past, so it alone needs a query. Its answer is a weighted mix of all earlier tokens' values, weighted by how its query matches their keys, so all past K and V are required. Past tokens' K and V do not change when new tokens arrive because of the causal mask, which is why they can be cached."}, {"id": "02.03", "t": "MLP, RMSNorm & Residual Connections", "f": "https://fanout.sh/inference-eng/curriculum/02-03", "k": ["transformer"], "x": [], "r": [["GLU Variants Improve Transformer", "https://arxiv.org/abs/2002.05202", "SwiGLU and related gated MLPs."], ["Root Mean Square Layer Normalization", "https://arxiv.org/abs/1910.07467", "RMSNorm paper."]], "q": "Why is the MLP typically the largest compute cost in decode at short context, and how does SwiGLU change the weight count compared with a plain two-matrix MLP?", "n": ["The MLP transforms each token independently: up-project, nonlinearity, down-project.", "SwiGLU: down(silu(gate(x)) * up(x)). Three weight matrices.", "RMSNorm scales by root-mean-square with a learned gain. Cheap but a separate kernel unless fused.", "Residual connections add each sublayer's output to the running hidden state.", "Small elementwise ops are cheap in FLOPs but cost memory traffic and kernel launches; fusion helps."], "ak": "", "a": "## The MLP\nAfter attention mixes information between tokens, the MLP processes each token on its own. Modern LLMs use a gated variant, SwiGLU:\n\n```\nmlp(x) = W_down( silu(W_gate x) * (W_up x) )\n```\n\nWith hidden size `d` and intermediate size `f` (often around `2.7d` to `3.5d`), the MLP has `3 * d * f` weights. For `d = 4096`, `f = 14336` that is 176M parameters per layer, far more than attention.\n\n## RMSNorm\nRMSNorm normalizes a vector by its root-mean-square and multiplies by a learned gain:\n\n```\nrmsnorm(x) = x / sqrt(mean(x^2) + eps) * g\n```\n\nNo mean subtraction and no bias, so it is a bit cheaper than LayerNorm. It has almost no FLOPs, but it reads and writes the full hidden state. Run as its own kernel it costs a memory round trip and a launch; fused into the next matmul or with the residual add, it almost disappears.\n\n## Residual connections\nEach sublayer adds to the hidden state: `h = h + sublayer(norm(h))`. This \"pre-norm\" design keeps training stable. For inference, it means the residual stream is read and written twice per layer, and fusing add plus norm is a standard optimization.\n\n## Cost picture\n| Op | Weights | FLOPs per token | Memory traffic |\n| Gate, up, down | 3df | 6df | high (weights) |\n| RMSNorm | d | ~d | read + write h |\n| Residual add | 0 | d | read + write h |\n| SiLU * up | 0 | f | read + write f |\n\n> Takeaway: the MLP is where most weights and FLOPs live. Norms and residual adds are cheap math but cost memory passes, which is why engines fuse them.", "s": "The MLP processes every token through large matrices (hidden to about 2.7 to 4 times hidden and back), and at short context attention over the cache is cheap, so the MLP's matmuls dominate both FLOPs and weight bytes. SwiGLU uses three matrices (gate, up, down) instead of two, and shrinks the intermediate width to about 8/3 of hidden to keep total parameters similar."}, {"id": "02.04", "t": "Logits, Sampling & the Next Token", "f": "https://fanout.sh/inference-eng/curriculum/02-04", "k": ["sampling"], "x": [], "r": [["The Curious Case of Neural Text Degeneration", "https://arxiv.org/abs/1904.09751", "Introduces nucleus (top-p) sampling."], ["Hugging Face: Text generation strategies", "https://huggingface.co/docs/transformers/main/en/generation_strategies", "All common decoding strategies."]], "q": "Explain what happens in order when you set temperature 0.7, top-p 0.9 and a repetition penalty, and which step can be expensive at large batch sizes.", "n": ["The LM head outputs one logit per vocabulary entry for the last position.", "Logit processors run first: penalties, bans, grammar masks; then temperature, top-k, top-p, then sampling.", "Greedy (temperature 0) is deterministic; sampling needs a seed for reproducibility.", "Sampling over a 100k+ vocabulary for many sequences per step is not free. Engines use fused sampling kernels.", "Stop conditions: end-of-sequence token, stop strings, max tokens."], "ak": "", "a": "## From hidden state to token\nThe final hidden state of the last position goes through the LM head: `logits = h @ W_vocab`, shape `[vocab]`. Only the last position matters during decode. In prefill, engines compute logits only for the last prompt token to save work.\n\n## The sampling pipeline\n%%flow Typical order of operations.\nLogits -> Penalties and masks -> Temperature -> Top-k / top-p -> *Sample -> Token id\n%%\n\n- **Penalties**: repetition, frequency and presence penalties lower logits of tokens already used.\n- **Masks**: banned tokens, or grammar constraints for structured output, set logits to minus infinity.\n- **Temperature**: `logits / T`. Lower is more focused.\n- **Top-k / top-p**: keep the k best, or the smallest set with cumulative probability p.\n- **Sample**: draw from the remaining distribution. Temperature 0 means argmax.\n\n## Determinism\nGreedy decoding is deterministic in principle, but floating-point results can vary with batch composition, so even greedy outputs can differ slightly between runs on a batching server. Sampling needs a fixed seed per request to be reproducible.\n\n## Cost at scale\nWith a 128k vocabulary and 256 sequences per step, sampling touches 32 million logits. A naive top-p sorts each row. Engines use kernels that avoid full sorts (for example rejection-based top-p sampling) to keep sampling a small part of step time.\n\n## Stopping\nGeneration ends on an end-of-sequence token, a user stop string, or `max_tokens`. Stop strings require detokenizing as you go, since a string can span token boundaries.\n\n> Takeaway: logits go through penalties, masks, temperature and top-k/p before sampling. It is cheap per sequence but not free at large batch, and it changes output length and thus cost.", "s": "The engine takes the logits for the last position, applies the repetition penalty to tokens already seen, divides by temperature 0.7, applies softmax, sorts tokens by probability and keeps the smallest set summing to 0.9, renormalizes and samples. Sorting the full vocabulary for top-p across many sequences can be noticeably expensive, so engines use specialized sampling kernels."}, {"id": "02.05", "t": "Build a Tiny Autoregressive Generation Loop", "f": "https://fanout.sh/inference-eng/curriculum/02-05", "k": ["generation", "lab"], "x": [], "r": [["nanoGPT", "https://github.com/karpathy/nanoGPT", "Minimal generate() implementation to compare against."], ["Hugging Face: Generation with LLMs", "https://huggingface.co/docs/transformers/main/en/llm_tutorial", "Reference for the full API."]], "q": "Write pseudocode for a generation loop without a KV cache and state its cost per step as the sequence grows.", "n": ["Write the loop yourself: forward, take last logits, sample, append, check stop.", "Without a cache, every step re-runs the full sequence. Cost per step grows with length.", "Measure per-step latency and plot it against position: it rises steadily.", "This makes the case for the KV cache in Module 03.", "Keep the loop; you will extend it into a mini engine in Module 28."], "ak": "", "a": "## The loop\n```\n@torch.inference_mode()\ndef generate(model, tok, prompt, max_new=64, temp=0.8):\n    ids = tok(prompt, return_tensors=\"pt\").input_ids.cuda()\n    for _ in range(max_new):\n        logits = model(ids).logits[:, -1, :]\n        probs = torch.softmax(logits / temp, dim=-1)\n        nxt = torch.multinomial(probs, 1)\n        ids = torch.cat([ids, nxt], dim=1)\n        if nxt.item() == tok.eos_token_id: break\n    return tok.decode(ids[0])\n```\n\n## Measure it\nTime each iteration (with `torch.cuda.synchronize()`). Plot step time against current sequence length. Without a cache, each step runs the model over every token so far, so the line climbs.\n\n| Sequence length | Relative step time (no cache) |\n| 128 | 1x |\n| 512 | ~3 to 4x |\n| 2,048 | ~10x or more |\n\n## What you are seeing\nStep `t` processes `prompt + t` tokens. Summed over `n` new tokens, total work grows like `n^2`. Almost all of it is recomputing K and V for tokens whose K and V have not changed.\n\n## Then compare with the built-in\nRun `model.generate` with `use_cache=True` on the same prompt. Its step time stays roughly flat. The difference is the KV cache, which the next module builds by hand.\n\n> Takeaway: a cache-free loop is correct but recomputes everything each step. Seeing step time climb with length is the clearest argument for the KV cache.", "s": "ids = prompt; for step in range(max_new): logits = model(ids)[-1]; tok = sample(logits); ids.append(tok); if tok == eos: break. Each step reprocesses the whole sequence, so step t costs work proportional to (prompt + t), and total cost grows quadratically with output length."}, {"id": "02.06", "t": "Visual Lab: Trace One Token End-to-End", "f": "https://fanout.sh/inference-eng/curriculum/02-06", "k": ["lab"], "x": ["Lab"], "r": [["PyTorch Profiler recipe", "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html", "Capture op-level traces."], ["Perfetto UI", "https://ui.perfetto.dev/", "View Chrome-format traces from the profiler."]], "q": "For one generated token, list where it spends time from HTTP arrival to the client receiving it, and which parts are on the GPU.", "n": ["Follow one token across CPU and GPU: request, tokenize, schedule, forward, sample, detokenize, send.", "Capture a profiler trace of one decode step and open it in Perfetto.", "Identify gaps on the GPU timeline: they are CPU overhead.", "Label each kernel with the layer and op it belongs to.", "Write a one-paragraph explanation of where the time went."], "ak": "", "a": "## What to trace\nRecord one short request end to end: client send time, server receive, tokenize, first forward pass, each decode step, sample, detokenize, and client receive.\n\n%%seq One token's journey.\nClient > API : HTTP request\nAPI > Engine : tokenized prompt\nEngine > GPU : forward pass\nGPU > Engine : logits, sampled id\nEngine > API : detokenized text\nAPI -> Client : SSE chunk\n%%\n\n## Capture the GPU side\n```\nfrom torch.profiler import profile, ProfilerActivity\nwith profile(activities=[ProfilerActivity.CPU, ProfilerActivity.CUDA]) as p:\n    model(ids)\np.export_chrome_trace(\"step.json\")\n```\nOpen `step.json` in Perfetto. You will see a CPU row launching kernels and a GPU row executing them.\n\n## What to look for\n- **Gaps on the GPU row**: the GPU waiting for the CPU to launch the next kernel. Common at batch size 1.\n- **Big blocks**: matmuls for QKV, MLP and the LM head.\n- **Attention kernels**: grow with context length.\n- **Many tiny kernels**: norms, RoPE, adds. Candidates for fusion.\n\n## Write it up\nMake a table of the top ten kernels by time, their share of the step, and the layer they belong to. Note the total GPU-idle time inside the step. This is your first bottleneck report, and the habit carries through Module 12.\n\n> Takeaway: a token spends time on both CPU and GPU. Traces show where, and gaps on the GPU timeline are often the cheapest wins.", "s": "Network and HTTP parsing (CPU), tokenization of the prompt (CPU), queueing in the scheduler (CPU), prefill or decode forward pass (GPU: matmuls, attention, norms), sampling (GPU), detokenization (CPU), and SSE write and network back to the client (CPU). Only the forward pass and sampling run on the GPU."}]}, {"n": "03", "name": "Prefill, Decode, KV Cache & Memory", "lessons": [{"id": "03.01", "t": "Why Autoregressive Generation Recomputes Work", "f": "https://fanout.sh/inference-eng/curriculum/03-01", "k": ["kv-cache"], "x": [], "r": [["kipply: Transformer Inference Arithmetic", "https://kipp.ly/transformer-inference-arithmetic/", "KV cache sizing and cost."], ["Hugging Face: KV cache strategies", "https://huggingface.co/docs/transformers/main/en/kv_cache", "How transformers manages caches."]], "q": "Without a cache, how many token-positions of work does generating 100 tokens after a 900-token prompt take, compared with a cached approach?", "n": ["Each decode step depends on all previous tokens, so generation is sequential.", "Without caching, every step recomputes K and V for the entire prefix.", "Past K and V never change (causal mask), so recomputing them is pure waste.", "Caching turns quadratic total work into linear work at the cost of memory.", "That memory, the KV cache, becomes the main constraint on concurrency."], "ak": "", "a": "## Sequential by nature\nToken `t+1` depends on token `t`. You cannot compute step 50 before step 49 finishes. This is the root of most inference difficulty: the model must run once per output token.\n\n## Where the waste is\nA naive loop feeds the full sequence each step. Layer by layer, it recomputes the keys and values for every earlier token. But with a causal mask, the K and V for position `i` depend only on tokens `0..i`, which have not changed. Every recomputation produces the same numbers as last step.\n\n| Approach | Work at step t | Total for n new tokens |\n| No cache | prompt + t positions | ~ n x prompt + n^2/2 |\n| KV cache | 1 position (+ read cache) | ~ prompt + n |\n\n## The trade\nStore each token's K and V per layer once, and reuse them. Compute drops sharply, but memory grows with every token of every active request. A busy server holds gigabytes of KV state. Managing that memory is the central job of an inference engine, which is why Module 08 is all about it.\n\n%%flow Caching trades compute for memory.\nRecompute K,V each step -(cache them)-> *Store K,V per token -> Memory grows with context x users\n%%\n\n> Takeaway: generation is sequential and naive loops recompute the past. The KV cache removes that waste and makes memory the new bottleneck.", "s": "Without a cache, step t processes 900 + t positions, so total is about 100 x 900 + (0+...+99), roughly 95,000 token-positions. With a cache, prefill processes 900 positions once and each of the 100 decode steps processes one new position, about 1,000 total. Roughly 95 times less work, ignoring attention reads."}, {"id": "03.02", "t": "Understand & Measure the Prefill Phase", "f": "https://fanout.sh/inference-eng/curriculum/03-02", "k": ["prefill"], "x": [], "r": [["Horace He: Making Deep Learning Go Brrrr", "https://horace.io/brrr_intro.html", "Compute bound vs memory bound explained."], ["Splitwise: Efficient generative LLM inference using phase splitting", "https://arxiv.org/abs/2311.18677", "Measured differences between prefill and decode."]], "q": "Why is prefill usually compute bound while decode is memory bound? Use arithmetic intensity in your answer.", "n": ["Prefill processes the whole prompt in one forward pass and writes its KV cache.", "Prefill time grows with prompt length: linear for matmuls, quadratic for attention.", "Prefill is compute bound: many tokens per weight read.", "Prefill sets time to first token (TTFT), plus any queueing.", "Measure TTFT across prompt lengths to see the curve."], "ak": "", "a": "## What prefill does\nWhen a request arrives, the engine runs the full prompt through the model in one pass. Every layer computes Q, K and V for all prompt tokens, writes K and V into the cache, and computes attention among them. Only the last position's logits are needed to sample the first output token.\n\n## Why it is compute bound\nEach matmul has `M = prompt_len` rows. With a 2,000-token prompt, each weight loaded from memory is used 2,000 times. That gives high arithmetic intensity, so the GPU's tensor cores, not memory, set the speed.\n\n## How it scales\n- Linear layers: cost grows linearly with prompt length.\n- Attention: each token attends to all earlier ones, so cost grows with `prompt_len^2`. For short prompts this is small; for 32k+ prompts it dominates.\n\n## Measure it\nSend single requests with `max_tokens=1` and prompt lengths 128, 512, 2k, 8k, 32k. Record TTFT.\n\n| Prompt tokens | 8B on one H100 (rough) |\n| 512 | ~20 to 40 ms |\n| 2,048 | ~60 to 120 ms |\n| 8,192 | ~250 to 500 ms |\n| 32,768 | ~1.5 to 3 s |\n\nTreat these as order-of-magnitude. The shape matters: roughly linear, curving up at long lengths as attention takes over.\n\n> Takeaway: prefill processes the whole prompt in one compute-bound pass and sets TTFT. Its cost grows with prompt length, faster than linearly at long context.", "s": "In prefill, a matmul processes thousands of prompt tokens against each weight read, so arithmetic intensity (FLOPs per byte) is high and tensor cores stay busy; time is set by FLOPs. In decode each weight is used for only one token per sequence, so intensity is low and time is set by how fast weights and KV cache can be read."}, {"id": "03.03", "t": "Understand & Measure the Decode Phase", "f": "https://fanout.sh/inference-eng/curriculum/03-03", "k": ["decode"], "x": [], "r": [["Orca: A Distributed Serving System for Transformer-Based Generative Models", "https://www.usenix.org/conference/osdi22/presentation/yu", "Iteration-level scheduling for decode."], ["Lilian Weng: Large Transformer Model Inference Optimization", "https://lilianweng.github.io/posts/2023-01-10-inference-optimization/", "Overview of decode costs."]], "q": "Decode at batch 1 runs at 40 ms per token. At batch 32 it runs at 48 ms per token. Explain why throughput rose so much.", "n": ["Decode generates one token per sequence per step, using the KV cache.", "Each step reads all weights plus every active sequence's KV cache.", "At small batch, decode is memory bound: step time is almost flat as batch grows.", "Batching is the main lever for decode throughput, until compute or KV memory runs out.", "Decode speed per user is measured as time per output token (TPOT) or inter-token latency (ITL)."], "ak": "", "a": "## What decode does\nAfter prefill, each step feeds only the newest token of each sequence. Attention reads that sequence's cached K and V. One new K and V is appended per layer.\n\n## Why it is memory bound\nWith batch size `B`, linear layers have `M = B` rows. For `B = 1`, every weight is loaded to do 2 FLOPs. The GPU can do hundreds of FLOPs in the time it takes to load one byte, so it waits on memory.\n\n%%flow Step time is dominated by reading bytes.\nRead all weights -> Read KV for each sequence -> *Tiny matmuls -> 1 token per sequence\n%%\n\n## Batching is the lever\nStep time at small batch is roughly `(weight bytes + KV bytes) / bandwidth`. Adding sequences adds KV bytes and a little compute, but the weight read is shared.\n\n| Batch | Step time | Tokens/s total | Tokens/s per user |\n| 1 | 10 ms | 100 | 100 |\n| 16 | 11 ms | 1,450 | 90 |\n| 64 | 15 ms | 4,300 | 67 |\n| 256 | 35 ms | 7,300 | 29 |\n\nIllustrative numbers for an 8B model on one large GPU. Throughput keeps rising, but per-user speed falls as KV reads and compute grow. Somewhere along this curve you hit your latency target or run out of KV memory.\n\n## Measure it\nFix a short prompt and long output, vary concurrency, and record inter-token latency and total tokens per second.\n\n> Takeaway: decode is memory bound, so batching more sequences is nearly free at first. The limits are per-user latency and KV cache memory.", "s": "Decode is memory bound: each step reads all weights once regardless of batch size, and that read dominates time. At batch 32 the same weight read serves 32 sequences, so step time rises only slightly (more KV reads and some compute) while tokens per step rise 32 times. Throughput goes from 25 to about 670 tokens per second."}, {"id": "03.04", "t": "Build a KV Cache", "f": "https://fanout.sh/inference-eng/curriculum/03-04", "k": ["kv-cache", "lab"], "x": [], "r": [["Hugging Face: KV cache strategies", "https://huggingface.co/docs/transformers/main/en/kv_cache", "DynamicCache, StaticCache and others."], ["nanoGPT", "https://github.com/karpathy/nanoGPT", "A minimal model to add a cache to."]], "q": "What tensors does a per-layer KV cache hold, with what shapes, and what changes in the attention call once you use it?", "n": ["Allocate K and V buffers per layer: [batch, kv_heads, max_len, head_dim].", "Prefill writes positions 0..prompt_len-1; each decode step writes one more.", "Decode feeds only the new token; attention uses the cached prefix.", "Position ids (for RoPE) must continue from the cache length.", "Check correctness: cached and uncached greedy outputs must match."], "ak": "", "a": "## Data structure\nFor each layer `l`:\n```\nK[l] = torch.empty(B, n_kv_heads, max_len, head_dim, dtype=bf16, device=\"cuda\")\nV[l] = torch.empty_like(K[l])\nlength = 0\n```\n\n## Prefill\nRun the full prompt. In each layer, after projecting K and V (and applying RoPE to K), copy them into `K[l][:, :, :P]` and `V[l][:, :, :P]`. Set `length = P`.\n\n## Decode step\n```\nx = embed(new_token)                    # [B, 1, d]\nfor l in layers:\n    q, k, v = project(x)                # each [B, heads, 1, hd]\n    q, k = rope(q, k, pos=length)\n    K[l][:, :, length] = k; V[l][:, :, length] = v\n    a = attn(q, K[l][:, :, :length+1], V[l][:, :, :length+1])\n    x = layer_rest(x, a)\nlength += 1\n```\n\nNo causal mask is needed in decode: the cache only holds the past.\n\n## Check it\n1. Greedy outputs with and without the cache must match token for token.\n2. Plot step time vs position: it should stay roughly flat (a slow rise from attention reads), not climb like the no-cache loop.\n\n## What this design gets wrong\nPre-allocating `max_len` for every sequence wastes memory when most sequences are short, and it fragments when sequences finish at different times. Paged allocation fixes this in Module 08.\n\n> Takeaway: a KV cache is two buffers per layer and a length counter. Decode feeds one token and attends to the cached prefix, which makes step cost nearly flat.", "s": "Per layer, a key tensor and a value tensor of shape [batch, kv_heads, max_len, head_dim], plus a current length per sequence. In decode the model computes Q, K and V for only the new token, writes K and V at position len, then attends with Q against K[:, :, :len+1] and V[:, :, :len+1]. Input to the model becomes one token per sequence instead of the full sequence."}, {"id": "03.05", "t": "Calculate Model & Runtime Memory", "f": "https://fanout.sh/inference-eng/curriculum/03-05", "k": ["memory"], "x": [], "r": [["vLLM: Engine arguments", "https://docs.vllm.ai/en/latest/configuration/engine_args.html", "gpu-memory-utilization and related flags."], ["PyTorch: CUDA memory management", "https://pytorch.org/docs/stable/notes/cuda.html#memory-management", "Caching allocator behavior."]], "q": "Break down the memory on an 80 GB GPU running an 8B BF16 model in vLLM with gpu_memory_utilization 0.9.", "n": ["GPU memory = weights + KV cache + activations + workspace + CUDA context + fragmentation.", "Weights are fixed: params x bytes per param.", "Activations scale with tokens in a step (max batched tokens), not with total context.", "Engines reserve a fixed fraction of GPU memory and give what is left after weights and activations to the KV cache.", "More free memory means more KV blocks, which means more concurrent requests."], "ak": "", "a": "## The budget\n%%layers Memory on one GPU.\nCUDA context | ~0.5 to 1 GB per process\n*Weights | params x bytes per param\nActivations and workspace | peak temporary tensors for the largest step\nCUDA graphs | captured graph pools\n*KV cache pool | everything left within the configured fraction\nSafety margin | the rest\n%%\n\n## Weights\n`params x bytes`. 8B in BF16 is 16 GB. Quantized formats add a little for scales.\n\n## Activations\nTemporary tensors for one forward pass. They scale with the number of tokens processed in that step (prompt chunk plus decode tokens), times hidden size and MLP width. Engines bound this with a \"max batched tokens\" setting and measure the peak with a profiling pass at startup.\n\n## KV cache pool\nEngines like vLLM take `gpu_memory_utilization x total`, subtract weights, activation peak and graph memory, and hand the rest to the KV cache as fixed-size blocks. The log line reporting how many KV blocks or tokens fit is one of the most useful numbers at startup.\n\n! Example: 80 GB GPU, 8B model\n! Target 0.9 x 80 = 72 GB. Weights 16 GB. Activations and graphs ~4 GB. CUDA context ~1 GB.\n! KV pool ~51 GB. At 128 KB per token (see next lesson), that is about 400,000 tokens of cache.\n\n## Practical knobs\n- Raise `gpu_memory_utilization` for more KV space, if nothing else shares the GPU.\n- Lower max batched tokens to shrink activation peak.\n- Quantize weights to free space for KV.\n\n> Takeaway: weights are fixed, activations scale with tokens per step, and the KV cache gets the remainder. That remainder decides concurrency.", "s": "vLLM targets 72 GB in total. Weights take about 16 GB. Activations and temporary buffers for the largest batch take a few GB (measured by a profiling run), CUDA graphs and the CUDA context take around 1 to 2 GB. Whatever remains, roughly 50 GB, becomes the KV cache pool. The other 8 GB is left unused as a safety margin."}, {"id": "03.06", "t": "Calculate KV Memory, Context & Concurrency Limits", "f": "https://fanout.sh/inference-eng/curriculum/03-06", "k": ["memory", "kv-cache"], "x": [], "r": [["kipply: Transformer Inference Arithmetic", "https://kipp.ly/transformer-inference-arithmetic/", "KV cache formula with examples."], ["GQA paper", "https://arxiv.org/abs/2305.13245", "Why fewer KV heads shrink the cache."]], "q": "Compute KV cache bytes per token for a model with 32 layers, 8 KV heads, head dim 128, in BF16. How many 8k-token conversations fit in 40 GB?", "n": ["KV bytes per token = 2 x layers x kv_heads x head_dim x bytes per element.", "GQA cuts this by the ratio of query heads to KV heads.", "Concurrency at full context = KV pool / (bytes per token x context length).", "Real sequences are shorter than max; paged allocation lets you plan on average length, not max.", "KV quantization (FP8) halves bytes per token."], "ak": "", "a": "## The formula\n```\nkv_bytes_per_token = 2 * n_layers * n_kv_heads * head_dim * bytes_per_elem\n```\nThe 2 is for K and V.\n\n| Model shape | Layers | KV heads | Head dim | BF16 per token |\n| Llama-3-8B-like | 32 | 8 | 128 | 128 KB |\n| Llama-3-70B-like | 80 | 8 | 128 | 320 KB |\n| Same 8B with MHA (32 heads) | 32 | 32 | 128 | 512 KB |\n\nGQA's effect is obvious: four times fewer KV heads, four times less cache.\n\n## From bytes to users\n```\nmax_tokens_in_cache = kv_pool_bytes / kv_bytes_per_token\nconcurrent_seqs = max_tokens_in_cache / average_tokens_per_seq\n```\n\n! Example: 70B on 4 x 80 GB with tensor parallelism\n! Weights 140 GB spread across 4 GPUs leaves roughly 4 x (72 - 35 - 4) = 132 GB of KV pool.\n! At 320 KB per token, that is about 410,000 tokens. With 4k-token average sequences, about 100 concurrent requests.\n\n## Context length limits\nA single request cannot exceed the pool either. One 128k-token request on the 8B model needs 16 GB of KV cache. If the pool is 10 GB, it cannot run at all, regardless of how idle the server is.\n\n## Ways to fit more\n- FP8 KV cache: half the bytes.\n- Fewer bytes per weight frees pool space.\n- Prefix sharing: many requests share the same system prompt blocks.\n- Offloading cold KV to CPU memory (Module 20).\n\n> Takeaway: 2 x layers x KV heads x head dim x bytes. Multiply by tokens in flight and compare with the pool. This one formula answers most \"how many users fit\" questions.", "s": "Per token: 2 (K and V) x 32 layers x 8 heads x 128 dim x 2 bytes = 131,072 bytes, about 128 KB. An 8k-token sequence needs about 1 GB. So 40 GB holds about 40 such sequences at full length."}, {"id": "03.07", "t": "Lab: Cached vs Uncached Generation & Model Fit", "f": "https://fanout.sh/inference-eng/curriculum/03-07", "k": ["lab"], "x": ["Lab"], "r": [["vLLM documentation", "https://docs.vllm.ai/en/latest/", "Startup logs show KV cache size."], ["Hugging Face: KV cache strategies", "https://huggingface.co/docs/transformers/main/en/kv_cache", "Cache options to compare."]], "q": "Your measured max concurrency is 30% lower than your KV formula predicted. Name three plausible reasons.", "n": ["Compare your cache-free loop with your cached loop on the same prompts.", "Plot step time vs position for both.", "Predict KV bytes per token from config.json, then check against measured memory growth.", "Predict max concurrency for a context length and test it until OOM or preemption.", "Explain the gap between prediction and measurement."], "ak": "", "a": "## Part 1: cached vs uncached\nRun both generation loops from 02.05 and 03.04 with the same prompt and 256 new tokens. Record per-step time.\n\nExpected: the uncached loop's step time climbs steadily; the cached loop's is nearly flat. Total time differs by an order of magnitude for long outputs.\n\n## Part 2: predict memory growth\nFrom `config.json`, compute KV bytes per token. Then generate 1,000 tokens and read `torch.cuda.memory_allocated()` every 100 tokens. The slope should match your formula (if your cache grows dynamically) or show a single jump (if pre-allocated).\n\n## Part 3: model fit\nFor your GPU and model, predict:\n1. Weight memory.\n2. KV pool after a typical 10% safety margin and activations.\n3. Max concurrent sequences at 2k and 8k tokens.\n\nThen start an engine (or use your own loop with batching) and increase concurrency until you see out-of-memory or preemption. Record where it happens.\n\n| Item | Predicted | Measured |\n| Weights | | |\n| KV per token | | |\n| Max concurrency @ 2k | | |\n| Max concurrency @ 8k | | |\n\n## Write-up\nExplain any gap. Common causes: activation peak, allocator fragmentation, block rounding, reserved headroom. Being within 10 to 20% means your mental model is good.\n\n> Takeaway: predict first, then measure. When your formula and the GPU agree within 20%, you can size hardware without trial and error.", "s": "Activation and CUDA graph memory took more than assumed, leaving a smaller KV pool; block-level allocation wastes the unused part of each sequence's last block; and the engine reserves blocks for the maximum possible output length or keeps a watermark of free blocks to avoid preemption. Prompt lengths in the test may also be longer than the assumed average."}]}, {"n": "04", "name": "Benchmark Inference Correctly", "lessons": [{"id": "04.01", "t": "TTFT, TPOT, ITL, E2E & Throughput", "f": "https://fanout.sh/inference-eng/curriculum/04-01", "k": ["metrics"], "x": [], "r": [["NVIDIA: LLM inference benchmarking fundamentals", "https://developer.nvidia.com/blog/llm-benchmarking-fundamental-concepts/", "Definitions of TTFT, ITL and throughput."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Benchmark tool reporting these metrics."]], "q": "A request has TTFT 300 ms, produces 200 tokens, and finishes at 4.3 s. Compute TPOT and explain how ITL differs from TPOT.", "n": ["TTFT: request sent to first token received. Includes queueing and prefill.", "TPOT: average time per output token after the first, per request.", "ITL: each individual gap between tokens; a distribution, shows stalls.", "E2E latency: request sent to last token. Roughly TTFT + TPOT x (tokens - 1).", "Throughput: output tokens per second (or requests per second) across all requests. Say which."], "ak": "", "a": "## The five numbers\n%%flow Timeline of one streamed request.\nSent -(TTFT)-> First token -(ITL, ITL, ...)-> *Last token -> E2E = TTFT + rest\n%%\n\n- **TTFT (time to first token)**: queueing + prefill + first sample + network. What users feel as \"it started answering\".\n- **TPOT (time per output token)**: `(E2E - TTFT) / (output_tokens - 1)`. Average streaming speed for one request.\n- **ITL (inter-token latency)**: each gap between consecutive tokens. A distribution across all gaps.\n- **E2E latency**: total request time. Matters for non-streaming and agent calls.\n- **Throughput**: output tokens per second across the server, or requests per second. Some tools also report total tokens (input + output) per second, which looks much bigger. Always state which.\n\n## Which metric for which product\n| Product | Primary metric |\n| Chat UI | TTFT p95, then TPOT |\n| Code completion | E2E p95 (short outputs) |\n| Agents and tools | E2E per call |\n| Batch jobs | Throughput, cost per token |\n\n## Common mistakes\n- Measuring TTFT without streaming (you get E2E instead).\n- Mixing per-request and per-server throughput.\n- Averaging TPOT across requests with very different lengths without weighting.\n- Ignoring client-side network and detokenization.\n\n> Takeaway: TTFT for responsiveness, TPOT/ITL for streaming speed, E2E for whole calls, throughput for capacity. Name the metric and its percentile every time.", "s": "TPOT = (4.3 - 0.3) / (200 - 1), about 20 ms per token. ITL is the gap between each pair of consecutive tokens; TPOT is their average for the request. ITL keeps the distribution, so you can see stalls (for example a 400 ms gap when a long prefill ran) that the average hides."}, {"id": "04.02", "t": "Concurrency, Request Rate & Arrival Patterns", "f": "https://fanout.sh/inference-eng/curriculum/04-02", "k": ["load-testing"], "x": [], "r": [["Little's law", "https://en.wikipedia.org/wiki/Little%27s_law", "Concurrency = arrival rate x latency."], ["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "Serving benchmark with request-rate and Poisson arrivals."]], "q": "Explain the difference between a closed-loop benchmark at concurrency 32 and an open-loop benchmark at 10 requests per second, and which one can reveal queueing collapse.", "n": ["Closed loop: fixed number of in-flight requests. Good for finding capacity, hides queueing.", "Open loop: requests arrive at a set rate regardless of completions. Matches real traffic.", "Poisson arrivals model independent users; bursts are realistic and stress the scheduler.", "Little's law links them: in-flight = arrival rate x average latency.", "Report results as a curve over load, not a single point."], "ak": "", "a": "## Two ways to generate load\n- **Closed loop (concurrency C)**: C virtual users, each sends a request, waits for it to finish, sends the next. In-flight requests never exceed C.\n- **Open loop (rate R)**: requests arrive at R per second whether or not earlier ones finished. Arrival times are often drawn from a Poisson process (exponential gaps).\n\n## Why it matters\nIn closed loop, if the server slows down, the load generator slows down too. You never see an overload. Real users do not wait for each other. In open loop, if service rate drops below arrival rate, the queue grows every second and TTFT climbs without limit.\n\n%%flow Open-loop overload.\nArrivals 10/s -> *Queue grows -> Server serves 8/s -> TTFT rises every second\n%%\n\n## Little's law\n`L = lambda x W`: average in-flight requests equals arrival rate times average time in system. At 10 requests per second with 6 s average latency, you have 60 in flight. Use it to translate between closed and open loop and to sanity check results.\n\n## Arrival patterns to test\n- **Constant rate**: easy to reason about.\n- **Poisson**: realistic random arrivals.\n- **Bursty**: a spike of 5 times normal for 30 seconds. Tests queueing and admission control.\n- **Diurnal ramp**: slow rise and fall; tests autoscaling.\n\n> Takeaway: use closed loop to find capacity, open loop to see how latency behaves under real traffic. Little's law connects the two.", "s": "Closed loop keeps exactly 32 requests in flight: a new one starts only when one finishes, so load self-limits and latency cannot run away. Open loop sends requests on a schedule (10 per second, often Poisson) regardless of completions, like real users. If the server is slower than the arrival rate, the queue grows without bound and latency explodes. Only open loop reveals that collapse."}, {"id": "04.03", "t": "Short, Long, Shared-Prefix & Mixed Workloads", "f": "https://fanout.sh/inference-eng/curriculum/04-03", "k": ["workloads"], "x": [], "r": [["ShareGPT dataset (on Hugging Face)", "https://huggingface.co/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered", "Real chat lengths often used in benchmarks."], ["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "Supports random, ShareGPT and prefix workloads."]], "q": "Why can a benchmark of 128-token prompts with 128-token outputs mislead you about a RAG product, and what workload would you use instead?", "n": ["Workload shape (input length, output length, prefix sharing) changes results more than most tuning.", "Short in, long out stresses decode. Long in, short out stresses prefill.", "Shared-prefix workloads reward prefix caching; random prompts get no benefit.", "Mixed workloads expose interference: long prefills stall decode for everyone.", "Best: sample lengths from your own production logs."], "ak": "", "a": "## Workload shapes\n| Shape | Example | Bottleneck | Watch |\n| Short in, short out | classification | overhead, scheduling | requests/s |\n| Short in, long out | creative writing | decode bandwidth | TPOT, throughput |\n| Long in, short out | RAG, summarization | prefill compute | TTFT |\n| Long in, long out | long documents | both, KV memory | everything |\n| Shared prefix | same system prompt | cache hit rate | TTFT with cache |\n| Mixed | real product | interference | ITL p99 |\n\n## Why shape dominates\nAn engine tuned for short chats may look great until a 30k-token document arrives and its prefill freezes every other user's stream for a second. Prefix caching may look like a 5 times win on a shared-prompt benchmark and do nothing on random prompts.\n\n## Building realistic workloads\n1. Pull input and output token lengths from production logs (or a public chat dataset if you have none).\n2. Measure how many requests share a prefix and how long it is.\n3. Keep the mix: say 70% chat, 20% RAG, 10% long documents.\n4. Fix the random seed so the same workload replays exactly.\n\n## Output length control\nSet `max_tokens` and ignore end-of-sequence (many tools offer `ignore_eos`) when you want fixed output lengths. Otherwise, sampling differences change output length and thus every metric.\n\n> Takeaway: benchmark the workload you will serve. Input length, output length and prefix sharing change results more than most engine flags.", "s": "RAG prompts are long (often 2k to 8k tokens of retrieved context) with short outputs, so prefill dominates and TTFT is the key metric; a short-in, short-out benchmark mostly measures decode and hides prefill cost and interference. Use prompt and output lengths sampled from real logs, include shared system prompts so prefix caching is exercised, and test a mix with chat traffic."}, {"id": "04.04", "t": "Warm-Up, Steady State & Reproducible Runs", "f": "https://fanout.sh/inference-eng/curriculum/04-04", "k": ["methodology"], "x": [], "r": [["NVIDIA: LLM inference benchmarking fundamentals", "https://developer.nvidia.com/blog/llm-benchmarking-fundamental-concepts/", "Methodology guidance."], ["MLPerf Inference", "https://mlcommons.org/benchmarks/inference-datacenter/", "Example of strict, reproducible benchmark rules."]], "q": "List four things you must hold constant or record to make two benchmark runs comparable.", "n": ["First requests are slow: compilation, CUDA graph capture, allocator growth, cold caches.", "Warm up before measuring and discard that window.", "Measure at steady state: after the ramp and before the drain at the end.", "Fix seeds, workload files, versions and flags. Save them with results.", "Repeat runs and report spread."], "ak": "", "a": "## Why the first minute lies\nEarly requests pay one-time costs:\n- Kernel autotuning and `torch.compile` or CUDA graph capture.\n- The memory allocator growing its pools.\n- Cold prefix caches.\n- GPU clocks ramping up.\n\nInclude these and your averages look worse than reality. Exclude them carelessly and you hide real cold-start cost that users will see after a deploy.\n\n## Ramp, steady state, drain\n%%flow Benchmark phases.\nWarm-up -(discard)-> Ramp -> *Steady state (measure) -> Drain -(discard)->\n%%\n\nAt the start, few requests are in flight; at the end, the last requests finish with no new arrivals behind them. Both are unrepresentative. Measure in the middle, or use a duration long enough that the edges barely matter.\n\n## Reproducibility checklist\n- Model id and revision hash, dtype, quantization.\n- Engine version and every non-default flag.\n- GPU type, count, driver, CUDA, clocks or power cap.\n- Workload file and seed, arrival pattern, duration.\n- Prefix cache state (cold or warm).\n- Client machine and network path.\n\nStore all of it next to the results, preferably generated automatically.\n\n## Repeat\nRun each configuration at least three times. If results swing more than a few percent, find out why (thermals, noisy neighbors, background jobs) before comparing.\n\n> Takeaway: warm up, measure steady state, record everything, and repeat. A benchmark you cannot rerun is an anecdote.", "s": "The exact model revision, dtype and engine version and flags; the hardware and driver; the workload file (prompts, lengths, seed, arrival pattern); and the warm-up procedure and measurement window. Also record GPU clocks or power limits, and whether prefix caching was cold or warm."}, {"id": "04.05", "t": "P50, P95, P99 & Variance", "f": "https://fanout.sh/inference-eng/curriculum/04-05", "k": ["statistics"], "x": [], "r": [["The Tail at Scale", "https://research.google/pubs/the-tail-at-scale/", "Why tails dominate user experience at scale."], ["Gil Tene: How NOT to Measure Latency (talk)", "https://www.youtube.com/watch?v=lJ8ydIuPFeU", "Coordinated omission and percentile pitfalls."]], "q": "Your p50 TTFT improved by 20% after enabling a feature, but p99 got 40% worse. Should you ship it? What would you check?", "n": ["Means hide tails. Report p50, p95 and p99 for each latency metric.", "Percentiles need enough samples: thousands for a stable p99.", "Do not average percentiles across runs or servers; merge raw samples or use histograms.", "Coordinated omission: a closed-loop client that waits can hide stalls. Open-loop timing avoids it.", "Look at distributions (histograms, CDFs), not just three numbers."], "ak": "", "a": "## Why percentiles\nA mean of 200 ms could be every request at 200 ms or 95% at 100 ms and 5% at 2 s. Users in that 5% notice. SLOs are typically written as \"p95 TTFT under 500 ms\".\n\n## How many samples\nTo estimate p99 you need enough requests that the top 1% is not just a handful. With 10,000 requests, p99 rests on 100 samples. With 300 requests, it rests on 3.\n\n## Aggregation mistakes\n- **Averaging p99s** from two servers is not the p99 of the combined traffic. Merge raw samples or histograms.\n- **Per-request TPOT averages** weight short and long requests the same. Decide whether you care about requests or tokens.\n- **Coordinated omission**: if your client sends the next request only after the last finishes, a 5 s stall delays every request behind it, but those requests record normal latency because they started late. Schedule sends by the clock, not by completions.\n\n## Look at the shape\nPlot a CDF of TTFT. Bimodal shapes are common: cache hits vs misses, short vs long prompts, requests that waited behind a long prefill. Each mode has a different fix.\n\n| Metric | p50 | p95 | p99 |\n| TTFT ms | 120 | 410 | 1,900 |\n| ITL ms | 22 | 31 | 240 |\n\nA p99 ITL ten times p50 usually means occasional stalls, often from long prefills running beside decodes.\n\n> Takeaway: report tails with enough samples, aggregate raw data rather than percentiles, and look at the distribution's shape to find what causes the tail.", "s": "It depends on the SLO, which is usually written against a tail percentile, so the worse p99 probably fails it. Check which requests became slow (long prompts? specific arrival bursts?), whether the change is reproducible across runs, and whether the p99 is measured on enough samples. Often a scheduling change helps typical requests at the expense of long ones."}, {"id": "04.06", "t": "Goodput, SLOs & Failure Rates", "f": "https://fanout.sh/inference-eng/curriculum/04-06", "k": ["slo", "goodput"], "x": [], "r": [["DistServe: Disaggregating Prefill and Decoding for Goodput-optimized LLM Serving", "https://arxiv.org/abs/2401.09670", "Defines goodput for LLM serving."], ["Google SRE Book: Service Level Objectives", "https://sre.google/sre-book/service-level-objectives/", "SLIs, SLOs and error budgets."]], "q": "A server does 5,000 tokens/s at 64 concurrency, but only 70% of requests meet the TTFT SLO. Another does 4,000 tokens/s with 99% meeting it. Which is better and how would you express it?", "n": ["An SLO is a target on a metric, e.g. p95 TTFT under 500 ms and p95 TPOT under 50 ms.", "Goodput: throughput counting only requests that met every SLO.", "Raw throughput can rise while goodput falls, by overloading the server.", "Count failures (errors, timeouts, rejections) as misses, not as excluded samples.", "The useful capacity number is the highest load at which, say, 99% of requests meet the SLO."], "ak": "", "a": "## From throughput to goodput\nThroughput rewards cramming in more requests, even if each one gets slow. Products care about requests that arrive in time. Goodput counts only those.\n\n```\ngoodput = (tokens or requests that met all SLOs) / time\n```\n\n## Defining the SLO\nPick targets per product:\n- Chat: p95 TTFT < 500 ms, p95 TPOT < 50 ms.\n- Code completion: p95 E2E < 300 ms.\n- Batch: none on latency; maybe a completion deadline.\n\n## The capacity curve\n%%flow As load rises, throughput and goodput diverge.\nLow load -> Throughput up, goodput up -> *Knee -> Throughput flat, goodput falling\n%%\n\nSweep request rate. At each point record throughput, SLO attainment and goodput. The right operating point is the highest rate where attainment stays above your target (for example 99%).\n\n| Rate (req/s) | Throughput tok/s | SLO met | Goodput tok/s |\n| 4 | 2,000 | 100% | 2,000 |\n| 8 | 3,900 | 99% | 3,860 |\n| 12 | 5,100 | 80% | 4,080 |\n| 16 | 5,300 | 45% | 2,385 |\n\nHere the best goodput is near 12 req/s, but the SLO-safe operating point is about 8.\n\n## Failures count\nTimeouts, 5xx errors and rejected requests are SLO misses. Dropping them from the latency data makes overload look great.\n\n> Takeaway: optimize goodput under an explicit SLO, not raw throughput. The capacity of a server is the highest load at which it still meets the SLO.", "s": "The second, for a latency-sensitive product. Goodput counts only requests that meet the SLO: roughly 3,500 good tokens/s for the first vs 3,960 for the second. Report goodput (or max request rate at which 99% meet the SLO) rather than raw throughput."}, {"id": "04.07", "t": "Benchmarking With vLLM, SGLang & GuideLLM", "f": "https://fanout.sh/inference-eng/curriculum/04-07", "k": ["tools"], "x": [], "r": [["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "benchmark_serving and related scripts."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Sweeps rates and reports SLO-oriented metrics."], ["SGLang benchmark docs", "https://docs.sglang.ai/", "bench_serving and engine docs."]], "q": "You want to compare two engines fairly with an existing tool. What settings must match across both runs?", "n": ["Use an existing tool before writing your own; they handle streaming timing and arrival patterns.", "vLLM and SGLang ship serving benchmarks that hit any OpenAI-compatible server.", "GuideLLM sweeps rates automatically and reports TTFT, ITL and throughput per rate.", "Point all tools at the same endpoint type with the same dataset to compare engines.", "Check the tool's definitions: some count input tokens in throughput."], "ak": "", "a": "## Why use a tool\nCorrect streaming timing, Poisson arrivals, percentile math and dataset handling are easy to get subtly wrong. Established tools save time and are what others will compare with.\n\n## The common tools\n| Tool | Good for | Notes |\n| vLLM serving benchmark | quick rate or concurrency runs | ShareGPT, random, prefix datasets |\n| SGLang bench_serving | similar, SGLang-friendly defaults | also works against vLLM |\n| GuideLLM | automatic rate sweeps, SLO views | reports per-rate curves |\n| genai-perf (NVIDIA) | Triton and TensorRT-LLM | detailed token metrics |\n\n## Typical run\n```\npython benchmarks/benchmark_serving.py --backend openai-chat --base-url http://localhost:8000 \\\n  --model <model> --dataset-name random --random-input-len 1024 --random-output-len 256 \\\n  --request-rate 8 --num-prompts 2000 --seed 0\n```\nFlag names change between versions; check `--help` for your version.\n\n## Pitfalls\n- Different tools define throughput differently. Read the output labels.\n- Some tools default to `ignore_eos` off, so output length depends on the model.\n- Client CPU can become the bottleneck at very high rates. Watch it.\n- Running the client on the same GPU host can steal CPU from the engine.\n\n> Takeaway: start with an established benchmark tool, match every setting across engines, and read each tool's metric definitions before comparing numbers.", "s": "Same model weights and dtype, same tokenizer and chat template, same dataset with identical prompt and output lengths (fixed output via ignore_eos or max_tokens), same arrival pattern and rate or concurrency, same hardware, same warm-up and duration, and the same client tool measuring through the same OpenAI-compatible endpoint. Also align prefix caching and sampling settings."}, {"id": "04.08", "t": "Project: Build Your Inference Benchmark Harness", "f": "https://fanout.sh/inference-eng/curriculum/04-08", "k": ["project"], "x": ["Project"], "r": [["GuideLLM", "https://github.com/vllm-project/guidellm", "Reference design for a sweep tool."], ["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "Reference timing code."]], "q": "What should the output of your harness contain so that someone else can reproduce and trust a result?", "n": ["Build a harness you will reuse for every later lab.", "Inputs: endpoint, workload file, load pattern (rate or concurrency), duration, SLO.", "Record raw per-request, per-token timestamps; compute summaries afterwards.", "Output JSON plus charts: latency percentiles and goodput vs load.", "Embed env and config in every results file."], "ak": "", "a": "## Requirements\n1. **Workload**: load prompts and target output lengths from a file with a seed.\n2. **Load modes**: closed loop (concurrency) and open loop (Poisson rate).\n3. **Timing**: for each request, record send time, every token arrival, end time, input and output token counts, and errors. Use a monotonic clock.\n4. **Warm-up**: a configurable warm-up period excluded from results.\n5. **Sweep**: run a list of rates or concurrencies in one command.\n6. **Summary**: p50/p95/p99 of TTFT, TPOT, ITL, E2E; output tok/s; requests/s; SLO attainment and goodput.\n7. **Provenance**: env report and engine config in the output.\n\n## Structure\n%%flow Harness pipeline.\nWorkload file -> Load generator -> *Async client (SSE) -> Raw records -> Summaries and charts\n%%\n\nUse an async HTTP client so one process can hold hundreds of open streams. Parse SSE chunks yourself so you timestamp when each chunk arrives, not when your code gets around to it.\n\n## Validation\n- Run against your naive server from Module 01: throughput should be flat over concurrency.\n- Compare one point with an established tool: numbers should agree within a few percent.\n\n## Deliverable\nA repository with the harness, a README, and one results folder showing a sweep with charts.\n\n> Takeaway: your harness is the instrument for the rest of the course. Raw records plus provenance make every later claim checkable.", "s": "A results file with the environment report (hardware, driver, versions), full engine config, workload definition and seed, load pattern, raw per-request timing records (send, first token, every token, end, token counts, errors), and computed summaries: TTFT, TPOT, ITL and E2E percentiles, throughput, goodput against a stated SLO, plus charts over load."}]}, {"n": "05", "name": "Break One GPU", "lessons": [{"id": "05.01", "t": "Establish the Single-Request Baseline", "f": "https://fanout.sh/inference-eng/curriculum/05-01", "k": ["baseline"], "x": [], "r": [["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "Includes a latency benchmark for single batches."], ["kipply: Transformer Inference Arithmetic", "https://kipp.ly/transformer-inference-arithmetic/", "Expected latency from first principles."]], "q": "Why measure a single request on an idle server before any load test, and what two numbers do you take from it?", "n": ["Start every capacity study with one request at a time on an idle server.", "Record TTFT for representative prompt lengths and TPOT for steady decode.", "Compare with the bandwidth ceiling: weight bytes / memory bandwidth.", "If the baseline misses the SLO, scaling and batching cannot save you.", "Repeat a few times; the baseline should be very stable."], "ak": "", "a": "## Why a baseline\nUnder load, latency is baseline plus queueing plus interference. Without the baseline you cannot tell which part a regression came from.\n\n## What to measure\n- TTFT at your typical prompt length (and a long one).\n- TPOT for a long output (256+ tokens) at concurrency 1.\n- E2E for a typical request.\n\n## Compare with theory\nFor decode at batch 1: `ceiling TPOT ~ weight_bytes / bandwidth`. An 8B BF16 model on a 3.35 TB/s GPU: 16 GB / 3.35 TB/s = 4.8 ms. If you measure 7 ms, you are at about 70% of the ceiling, which is good. If you measure 25 ms, something (Python overhead, missing CUDA graphs, wrong kernels) is wasting most of the step.\n\n| Measurement | Value | Theory | Efficiency |\n| TPOT batch 1 | 7 ms | 4.8 ms | 69% |\n| TTFT 1k prompt | 45 ms | ~ 2 x 8e9 x 1k / 700 TFLOPs ~ 23 ms | ~50% |\n\n## Gate on the SLO\nIf baseline TPOT is 40 ms and your SLO is p95 TPOT under 30 ms, stop. Batching only makes per-user decode slower. Change the model size, precision or hardware first.\n\n> Takeaway: the single-request baseline is your floor. Compare it with the bandwidth ceiling to spot waste, and check it against the SLO before scaling anything.", "s": "It gives the best case the hardware and engine can deliver with no queueing or interference, so every later result can be expressed as degradation from it. Take TTFT for your typical prompt length and TPOT for steady decode. If these alone miss the SLO, no amount of scheduling will fix it; you need a smaller model, faster hardware or a different engine configuration."}, {"id": "05.02", "t": "Sweep Concurrency & Request Rate", "f": "https://fanout.sh/inference-eng/curriculum/05-02", "k": ["load-testing"], "x": [], "r": [["Anyscale: How continuous batching enables 23x throughput", "https://www.anyscale.com/blog/continuous-batching-llm-inference", "Throughput vs latency curves under batching."], ["GuideLLM", "https://github.com/vllm-project/guidellm", "Automatic rate sweeps."]], "q": "Describe the curves you expect for throughput and TPOT as concurrency rises from 1 to 256 on a real engine, and where the knee usually comes from.", "n": ["Sweep concurrency in powers of two (1, 2, 4 ... 256) with a fixed workload.", "Plot throughput vs concurrency and latency vs concurrency side by side.", "Throughput rises then plateaus; latency stays flat then rises.", "Sweep open-loop request rate too, to find where queues start growing.", "The usable point is where latency still meets the SLO, usually before the plateau."], "ak": "", "a": "## The sweep\nHold the workload fixed (say 1k in, 256 out). Run concurrency 1, 2, 4, 8, 16, 32, 64, 128, 256 for a few minutes each.\n\n## Expected shape\n| Concurrency | Throughput tok/s | TPOT ms | TTFT p95 ms |\n| 1 | 140 | 7 | 50 |\n| 8 | 1,050 | 7.6 | 70 |\n| 32 | 3,600 | 9 | 140 |\n| 128 | 8,500 | 15 | 600 |\n| 256 | 9,200 | 28 | 3,000 |\n\nIllustrative. The pattern: near-linear gains early, then diminishing returns while latency climbs.\n\n## What causes the knee\n- **Compute**: at large batches decode matmuls stop being memory bound.\n- **KV capacity**: the cache fills; new requests wait in queue, so TTFT jumps.\n- **Prefill interference**: more arrivals mean more prefills mixed into decode steps.\n\n## Rate sweep\nRepeat with open-loop Poisson arrivals at increasing rates. Below capacity, TTFT stays near baseline. Just above capacity, the queue grows and TTFT rises steadily with time. A long run makes this obvious: plot TTFT against request start time.\n\n> Takeaway: sweep load and plot throughput and latency together. The useful operating point sits before the knee, where latency still meets the SLO.", "s": "Throughput rises almost linearly at first, then bends and flattens; TPOT stays near baseline at low concurrency, then climbs. The knee appears when decode stops being purely bandwidth bound (compute starts to matter), when the KV cache fills and the engine queues or preempts, or when batched prefills start interfering with decode."}, {"id": "05.03", "t": "Sweep Prompt & Output Length", "f": "https://fanout.sh/inference-eng/curriculum/05-04", "k": ["workloads"], "x": [], "r": [["Splitwise", "https://arxiv.org/abs/2311.18677", "Phase characteristics across lengths."], ["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "Random dataset with controllable lengths."]], "q": "How does doubling prompt length affect TTFT, max concurrency and decode speed, and why?", "n": ["Prompt length drives TTFT and KV memory per sequence.", "Output length drives total decode steps and how long a sequence holds its KV.", "Longer contexts make each decode step slower, since attention reads more KV.", "Sweep both on a grid to map the GPU's envelope.", "Report throughput per configuration, but note it measures different things at each point."], "ak": "", "a": "## Two axes\nRun a grid: input lengths {256, 1k, 4k, 16k} x output lengths {64, 256, 1k}, at a fixed moderate concurrency.\n\n## What changes with input length\n- **TTFT**: grows with prompt length, faster than linear at long context.\n- **KV per sequence**: grows linearly. Max concurrency falls.\n- **Decode step time**: attention reads more KV per step. Matters once KV bytes rival weight bytes.\n\n## What changes with output length\n- **E2E**: grows linearly with output tokens.\n- **Occupancy**: each sequence holds KV longer, so fewer new requests fit.\n- **Throughput**: long outputs amortize prefill, so output tok/s often looks better.\n\n## Reading the grid\n| In \\ Out | 64 | 256 | 1,024 |\n| 256 | prefill-light, overhead heavy | balanced | decode heavy |\n| 4k | prefill heavy | mixed | KV pressure |\n| 16k | TTFT dominated | KV limited | concurrency very low |\n\n## When KV reads dominate\nAt 32k context with the 8B model from earlier, each sequence's KV is 4 GB. With 8 sequences, a decode step reads 32 GB of KV versus 16 GB of weights. Now attention, not weights, sets decode speed, and KV quantization or attention optimizations matter most.\n\n> Takeaway: prompt length sets TTFT and KV per user; output length sets how long KV is held. Map both, because the bottleneck shifts across the grid.", "s": "TTFT roughly doubles (more at long context because attention prefill is quadratic). Max concurrency roughly halves because each sequence holds twice the KV cache. Decode TPOT rises somewhat because each step's attention reads twice as much KV per sequence; at short context the weight read dominates so the effect is small, at long context it becomes large."}, {"id": "05.04", "t": "Find Saturation, SLO Failure & OOM Boundaries", "f": "https://fanout.sh/inference-eng/curriculum/05-05", "k": ["capacity"], "x": [], "r": [["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "Preemption and memory-related tuning."], ["DistServe", "https://arxiv.org/abs/2401.09670", "SLO attainment as the capacity criterion."]], "q": "Name the three boundaries you look for when stressing one GPU and the signal for each.", "n": ["Saturation: throughput plateau.", "SLO failure: the percentile you promise crosses its target.", "Memory boundary: KV exhausted, leading to queueing, preemption or OOM.", "These boundaries come at different loads. The lowest one sets capacity.", "Watch engine metrics: running vs waiting requests, KV usage, preemption count."], "ak": "", "a": "## Three boundaries\n%%flow As load rises you hit these, often in this order.\nLight load -> *SLO failure -> Saturation -> KV exhaustion / OOM\n%%\n\nOrder varies. With long contexts, KV exhaustion can come first. With tight latency SLOs, SLO failure comes well before saturation.\n\n## Signals to watch\n| Boundary | Signal |\n| Saturation | throughput flat while load rises |\n| SLO failure | p95 TTFT or TPOT above target; goodput falls |\n| KV exhaustion | KV usage near 100%, waiting queue grows, preemptions count up |\n| OOM | engine crash or failed allocations, often during long prefills |\n\nvLLM and SGLang expose metrics for running and waiting requests, KV cache usage and preemptions. Scrape them during every sweep.\n\n## Preemption is a warning\nWhen KV runs out, engines pause some sequences, free their blocks, and later recompute or swap them back. Throughput can look fine while the tail latency of preempted requests explodes.\n\n## Find the real OOM\nEngines pre-reserve memory, so true OOMs usually come from activation spikes: an unexpectedly long prefill, or a very large batch of prefill tokens. Test the longest prompt you allow, at the highest concurrency, deliberately.\n\n> Takeaway: capacity is the lowest of three boundaries: SLO, saturation and memory. Measure all three and watch preemptions; they appear before outright failure.", "s": "Saturation: throughput stops increasing as load rises. SLO failure: the chosen percentile of TTFT or TPOT crosses its target, or goodput starts falling. Memory boundary: the engine starts preempting requests, queueing because KV blocks are exhausted, or crashes with out-of-memory. Each happens at a different load and you operate below the lowest."}, {"id": "05.05", "t": "Lab: Map the GPU Operating Envelope", "f": "https://fanout.sh/inference-eng/curriculum/05-06", "k": ["lab"], "x": ["Lab"], "r": [["GuideLLM", "https://github.com/vllm-project/guidellm", "Tool for rate sweeps."], ["vLLM metrics documentation", "https://docs.vllm.ai/en/latest/usage/metrics.html", "Engine metrics to collect during sweeps."]], "q": "Summarize what an operating envelope chart shows and how a product team would use it.", "n": ["Combine the baseline, load sweep and length sweep into one map.", "For each workload shape, find the highest SLO-safe load.", "Label the binding constraint for each cell.", "Include headroom: run at 70 to 80% of the boundary in production.", "This map is the input for capacity planning in Module 25."], "ak": "", "a": "## Deliverable\nA table and chart: for each (input length, output length) pair, the maximum SLO-safe request rate, the throughput at that rate, and what limited it.\n\n## Steps\n1. Fix the SLO (for example p95 TTFT < 1 s, p95 TPOT < 50 ms).\n2. For each workload shape, run a rate sweep with your harness.\n3. Find the highest rate with 99% of requests meeting the SLO.\n4. Record engine metrics at that point: KV usage, waiting queue, preemptions.\n5. Label the limiting factor.\n\n## Example output\n| In / Out | Max req/s | Output tok/s | Limit |\n| 512 / 256 | 18 | 4,600 | TPOT SLO |\n| 2k / 256 | 11 | 2,800 | TTFT SLO |\n| 8k / 512 | 3 | 1,500 | KV memory |\n| 32k / 256 | 0.6 | 150 | KV memory |\n\n## Interpreting it\n- Rows limited by TTFT benefit from prefill optimizations (chunked prefill, prefix caching).\n- Rows limited by TPOT benefit from smaller or quantized models, or speculative decoding at low load.\n- Rows limited by KV memory benefit from KV quantization, more GPUs or offload.\n\n> Takeaway: the envelope turns many benchmarks into one decision tool: how much traffic of each shape one GPU can carry, and what would raise the limit.", "s": "For each workload shape (prompt and output length), it shows the maximum request rate or concurrency at which the SLO still holds, plus the throughput there and the binding constraint (SLO, compute or KV memory). A product team uses it to know how much traffic one GPU can take for their prompt sizes, and when they need more replicas or a different model."}]}, {"n": "06", "name": "Move to a Real Inference Engine", "lessons": [{"id": "06.01", "t": "Why Plain PyTorch Serving Breaks Down", "f": "https://fanout.sh/inference-eng/curriculum/06-01", "k": ["engines"], "x": [], "r": [["Efficient Memory Management for LLM Serving with PagedAttention", "https://arxiv.org/abs/2309.06180", "The vLLM paper, describing these problems."], ["Orca", "https://www.usenix.org/conference/osdi22/presentation/yu", "Iteration-level scheduling."]], "q": "List four specific inefficiencies of serving with model.generate behind an HTTP server.", "n": ["Static or no batching wastes the GPU and makes latency depend on others' lengths.", "Per-request KV allocation wastes memory through over-reservation and fragmentation.", "Python overhead and many small kernel launches dominate decode at small batch.", "No prefix reuse, no preemption, no admission control.", "Engines like vLLM, SGLang and TensorRT-LLM solve these together."], "ak": "", "a": "## The problems, one by one\n1. **Batching**: a plain server handles one request at a time, or batches requests that arrive together and waits for the longest to finish. Either way the GPU is idle much of the time.\n2. **Memory**: each request reserves KV space for its maximum length. Most never use it. Memory runs out long before compute does.\n3. **Overhead**: each decode step launches hundreds of small kernels from Python. At batch 1 the GPU often waits for the CPU.\n4. **Redundant work**: every request with the same system prompt recomputes it from scratch.\n5. **No control**: no queue, no priorities, no way to pause a request when memory is tight.\n\n## What an engine adds\n| Problem | Engine feature |\n| Idle GPU between requests | continuous batching |\n| KV over-reservation | paged KV blocks |\n| Launch overhead | CUDA graphs, compiled kernels |\n| Recomputed prompts | prefix caching |\n| Overload | scheduler with queueing and preemption |\n\n## Expected gain\nOn a mixed chat workload, moving from a naive server to vLLM often raises throughput by an order of magnitude at the same latency. The vLLM paper reported large gains over Hugging Face generation, mostly from batching and memory management.\n\n> Takeaway: the naive server fails on batching, memory, overhead and reuse at once. Real engines are built around fixing exactly these.", "s": "Requests run one at a time or in static batches, so the GPU is underused and short requests wait for long ones. KV cache is pre-allocated or grown per request, wasting and fragmenting memory. Python and kernel-launch overhead dominate small decode steps without CUDA graphs. There is no shared-prefix reuse, so identical system prompts are recomputed for every request."}, {"id": "06.02", "t": "Start a vLLM Engine", "f": "https://fanout.sh/inference-eng/curriculum/06-02", "k": ["vllm"], "x": [], "r": [["vLLM: Quickstart", "https://docs.vllm.ai/en/latest/getting_started/quickstart.html", "Starting the server."], ["vLLM: Engine arguments", "https://docs.vllm.ai/en/latest/configuration/engine_args.html", "Every flag."]], "q": "Name five vLLM startup flags you would set deliberately and what each controls.", "n": ["vllm serve <model> starts an OpenAI-compatible server.", "Key flags: max-model-len, gpu-memory-utilization, max-num-seqs, max-num-batched-tokens, tensor-parallel-size.", "Read the startup log: weight memory, KV cache size in tokens, CUDA graph capture.", "max-model-len too high wastes nothing per se but may fail if one max-length sequence cannot fit.", "Pin the version: defaults change between releases."], "ak": "", "a": "## Start it\n```\nvllm serve Qwen/Qwen2.5-7B-Instruct \\\n  --dtype bfloat16 --max-model-len 8192 \\\n  --gpu-memory-utilization 0.90 --max-num-seqs 256\n```\nThis exposes an OpenAI-compatible API on port 8000.\n\n## Flags that matter\n| Flag | Controls | Trade-off |\n| --max-model-len | longest prompt + output | larger needs more KV for one request |\n| --gpu-memory-utilization | memory fraction vLLM may use | higher means bigger KV pool, less safety |\n| --max-num-seqs | max concurrent sequences per step | higher throughput, higher per-user latency |\n| --max-num-batched-tokens | tokens processed per step | bounds prefill chunk and activation memory |\n| --tensor-parallel-size | GPUs per replica | fits bigger models, adds communication |\n| --enable-prefix-caching | reuse of shared prefixes | on by default in recent versions |\n| --quantization / --kv-cache-dtype | precision of weights / KV | memory vs quality |\n\n## Read the startup log\nLook for:\n- Model weight memory loaded.\n- KV cache size, usually reported as number of blocks and the max tokens or concurrency it supports.\n- CUDA graph capture for a set of batch sizes.\n- Any warnings about falling back to slower kernels.\n\n## Smoke test\n```\ncurl localhost:8000/v1/chat/completions -H 'Content-Type: application/json' \\\n  -d '{\"model\":\"Qwen/Qwen2.5-7B-Instruct\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}'\n```\n\n> Takeaway: a handful of flags set memory and batching behavior. Set them deliberately, read the startup log, and pin the version.", "s": "--model (weights), --dtype or --quantization (precision), --max-model-len (longest sequence, which caps KV per request), --gpu-memory-utilization (fraction of GPU memory vLLM may use, which sizes the KV pool), and --max-num-seqs or --max-num-batched-tokens (scheduler limits on batch size and tokens per step). Also --tensor-parallel-size for multi-GPU."}, {"id": "06.03", "t": "OpenAI-Compatible APIs & Streaming", "f": "https://fanout.sh/inference-eng/curriculum/06-03", "k": ["api"], "x": [], "r": [["OpenAI API reference: Chat completions", "https://platform.openai.com/docs/api-reference/chat", "The request and response schema."], ["vLLM: OpenAI-compatible server", "https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html", "Supported endpoints and extra parameters."]], "q": "What fields in a streamed chat completion response would you use to compute TTFT and token counts, and what is the stream_options usage flag for?", "n": ["Most engines expose /v1/chat/completions and /v1/completions in the OpenAI format.", "stream: true returns SSE chunks with delta content; the stream ends with data: [DONE].", "Set stream_options.include_usage to get exact token counts at the end.", "The chat endpoint applies the model's chat template server side.", "Engines add extra parameters (top_k, min_p, guided decoding) beyond the OpenAI spec."], "ak": "", "a": "## Request\n```\nPOST /v1/chat/completions\n{\"model\": \"m\", \"messages\": [{\"role\":\"user\",\"content\":\"...\"}],\n \"max_tokens\": 256, \"temperature\": 0.7, \"stream\": true,\n \"stream_options\": {\"include_usage\": true}}\n```\n\n## Streamed response\n```\ndata: {\"choices\":[{\"delta\":{\"role\":\"assistant\"}}]}\ndata: {\"choices\":[{\"delta\":{\"content\":\"Hello\"}}]}\ndata: {\"choices\":[{\"delta\":{\"content\":\" there\"}}]}\ndata: {\"choices\":[],\"usage\":{\"prompt_tokens\":12,\"completion_tokens\":2}}\ndata: [DONE]\n```\n\n## Measuring correctly\n- TTFT is the first chunk with non-empty `content`, not the first chunk (which may only carry the role).\n- One chunk may contain more than one token. Use `usage.completion_tokens` for counts and divide time accordingly.\n- Use the chat endpoint for chat models; the server applies the template.\n\n## Engine extensions\nvLLM and SGLang accept extra sampling and structured-output parameters in the same request body (for example `top_k`, `min_p`, JSON schema guidance). Clients that only know the OpenAI spec still work.\n\n## Why compatibility matters\nOne client and one benchmark harness can test any engine. Switching engines becomes a config change, which makes fair comparisons easy.\n\n> Takeaway: speak the OpenAI format, stream with SSE, and use the usage chunk for token counts. Your tools then work against any engine.", "s": "Each SSE chunk carries choices[0].delta.content; the time of the first chunk with non-empty content gives TTFT. Token counts come from the usage object; with stream_options {\"include_usage\": true} the server sends a final chunk containing prompt_tokens and completion_tokens, so you do not have to re-tokenize to count."}, {"id": "06.04", "t": "Read Engine Metrics & Request State", "f": "https://fanout.sh/inference-eng/curriculum/06-04", "k": ["metrics", "vllm"], "x": [], "r": [["vLLM: Metrics", "https://docs.vllm.ai/en/latest/usage/metrics.html", "Prometheus metrics exported by vLLM."], ["Prometheus: Overview", "https://prometheus.io/docs/introduction/overview/", "Scraping and querying metrics."]], "q": "During a load test you see num_requests_waiting rising and KV cache usage at 99%. What is happening and what are two fixes?", "n": ["Engines expose Prometheus metrics at /metrics.", "Running vs waiting requests: queue pressure.", "KV cache usage percent: memory pressure.", "Preemptions: memory pressure bad enough to evict running work.", "Histograms of TTFT, TPOT, E2E and prompt/generation lengths from the server's view."], "ak": "", "a": "## Where to look\n`GET /metrics` on the engine returns Prometheus text. Scrape it every few seconds during benchmarks.\n\n## The metrics that matter most\n| Metric (vLLM names vary by version) | Meaning |\n| num_requests_running | sequences in the current batch |\n| num_requests_waiting | admitted to the server, not yet scheduled |\n| kv_cache_usage (percent) | fraction of KV blocks in use |\n| num_preemptions | sequences evicted for lack of memory |\n| prefix cache hit rate | share of prompt tokens served from cache |\n| time_to_first_token histogram | server-side TTFT |\n| time_per_output_token histogram | server-side TPOT |\n| prompt / generation tokens totals | throughput counters |\n\n## Request states\nA request moves through states: waiting (queued), running (in the batch), possibly preempted (back to waiting), and finished.\n\n%%flow Request lifecycle inside the engine.\nWaiting -(scheduled)-> *Running -(KV full)-> Preempted -(rescheduled)-> Running -> Finished\n%%\n\n## Reading patterns\n- Waiting grows, KV near 100%: memory bound. More KV space or more replicas.\n- Waiting grows, KV low: scheduler limits (max-num-seqs) or compute bound.\n- Preemptions rising: you are overcommitting memory; tail latency will suffer.\n- Server TTFT much lower than client TTFT: time lost in network, proxy or client.\n\n> Takeaway: the engine's metrics tell you why latency rose. Waiting queue, KV usage and preemptions are the first three to check.", "s": "The KV cache is full, so the scheduler cannot admit new sequences and they queue, raising TTFT. Fixes: free KV space (quantize the KV cache to FP8, quantize weights, raise gpu-memory-utilization, lower max-model-len if long requests reserve too much), or add capacity (another replica) and route traffic away; also check if requests are generating longer outputs than expected."}, {"id": "06.05", "t": "Follow a Request Through vLLM", "f": "https://fanout.sh/inference-eng/curriculum/06-05", "k": ["vllm", "internals"], "x": [], "r": [["vLLM: Architecture overview", "https://docs.vllm.ai/en/latest/design/arch_overview.html", "Main components and how they connect."], ["vLLM V1 alpha release blog", "https://blog.vllm.ai/2025/01/27/v1-alpha-release.html", "The redesigned engine core."]], "q": "Describe the path of a chat request through vLLM from HTTP arrival to the first streamed token.", "n": ["API server: HTTP, chat template, tokenization, streaming output.", "Engine core: a loop that schedules, runs the model and processes outputs every step.", "Scheduler: picks which requests and how many tokens each run this step, within a token budget.", "KV cache manager: allocates and frees fixed-size blocks.", "Model runner and workers: build batched inputs, run the forward pass and sampling on the GPU."], "ak": "", "a": "## The components\n%%layers vLLM's main pieces (simplified).\nAPI server | HTTP, OpenAI schema, chat template, tokenizer, detokenizer\n*Engine core loop | schedule, execute, update, repeat\nScheduler | token budget per step, waiting and running queues, preemption\nKV cache manager | block allocation, prefix cache lookups\nModel runner / workers | input preparation, forward pass, sampling, CUDA graphs\n%%\n\n## A request's path\n1. **Arrive**: API server parses the request, applies the template, tokenizes.\n2. **Queue**: the engine core adds it to t
