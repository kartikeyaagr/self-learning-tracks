peed; and freed memory may not translate into more concurrency if KV was not the binding constraint. Overheads outside GEMMs (attention, sampling, CPU) also do not get faster."}, {"id": "11.07", "t": "Measure Quality Regression", "f": "https://fanout.sh/inference-eng/curriculum/11-07", "k": ["quality", "evals"], "x": [], "r": [["lm-evaluation-harness", "https://github.com/EleutherAI/lm-evaluation-harness", "Standard benchmark runner."], ["Give Me BF16 or Give Me Death? Accuracy-Performance Trade-Offs in LLM Quantization", "https://arxiv.org/abs/2411.02355", "Large study of quantized model quality."]], "q": "Why is perplexity on generic text not enough to approve a quantized model for production?", "n": ["Speed means nothing if quality falls below what the product needs.", "Use several signals: perplexity, standard benchmarks, product-specific evals, and side-by-side comparisons.", "Test the hard cases: math, code, long context, structured output, other languages.", "Run evals with the same sampling settings and engine as production.", "Set an acceptance threshold before testing."], "ak": "", "a": "## Layers of quality checks\n%%layers From cheap to convincing.\nPerplexity | fast sanity check on held-out text\nStandard benchmarks | MMLU-style, GSM8K-style, code tasks via an eval harness\n*Product evals | your own prompts with graded expected answers\nSide-by-side | human or model-judged comparison of BF16 vs quantized outputs\nOnline | canary with real users and quality metrics\n%%\n\n## What to test\n- Reasoning and math (sensitive to precision).\n- Code generation.\n- Long-context retrieval and QA.\n- JSON or tool-call validity.\n- Languages your users use.\n\n## Running evals correctly\n- Same engine and sampling settings as production.\n- Same chat template.\n- Enough samples for differences to be meaningful; report confidence intervals.\n\n## Acceptance rule\nDecide in advance, for example: \"no product eval drops more than 1 point; no standard benchmark more than 2 points.\" Then the decision is not argued after the fact.\n\n| Eval | BF16 | FP8 | INT4 AWQ |\n| Product QA (n=500) | 82.4 | 82.1 | 79.8 |\n| Math | 71.0 | 70.4 | 66.2 |\n| JSON validity | 99.6% | 99.5% | 98.9% |\n\n> Takeaway: approve quantization with evals that match your product and a threshold set beforehand. Perplexity alone hides the regressions users notice.", "s": "Perplexity measures average next-token prediction on some text, which can stay nearly unchanged while specific capabilities (math, code, long context, instruction following, rare languages) degrade. You should also run task evals that match your product, compare outputs on real prompts, and check long-context and structured-output behavior."}, {"id": "11.08", "t": "Project: Build the Quality/Speed/Memory Pareto Frontier", "f": "https://fanout.sh/inference-eng/curriculum/11-08", "k": ["project"], "x": ["Project"], "r": [["Give Me BF16 or Give Me Death?", "https://arxiv.org/abs/2411.02355", "Accuracy vs performance trade-offs."], ["lm-evaluation-harness", "https://github.com/EleutherAI/lm-evaluation-harness", "Quality measurements."]], "q": "What is a Pareto frontier in this context, and how do you choose a point on it?", "n": ["Evaluate several configs: BF16, FP8 W8A8, INT8, INT4 AWQ/GPTQ, each with BF16 or FP8 KV.", "For each, measure quality, SLO-safe capacity and memory.", "Plot quality vs capacity; mark the frontier.", "Pick the cheapest frontier point that passes your quality threshold.", "Document the decision with the data."], "ak": "", "a": "## Configurations\n| Weights | KV |\n| BF16 | BF16, FP8 |\n| FP8 W8A8 | BF16, FP8 |\n| INT4 AWQ | BF16, FP8 |\n| INT4 GPTQ | FP8 |\n\n## For each configuration\n1. Quality: product eval plus two standard benchmarks.\n2. Capacity: SLO-safe req/s with your harness.\n3. Memory: weight GB and KV tokens.\n\n## Plot\nQuality on the y axis, SLO-safe capacity on the x axis. Draw the quality threshold as a horizontal line. Points up and to the right are better. Connect the frontier.\n\n## Decide\nThe chosen point is the one with the highest capacity above the threshold. Write a short decision note: chosen config, its numbers, the next-best alternative and why it lost.\n\n> Takeaway: quantization is a choice on a frontier. Measure quality and capacity for each option, then pick the cheapest one that meets the bar.", "s": "Each configuration (precision of weights and KV, method) gives a point with quality, capacity (or cost) and memory. A configuration is on the frontier if no other one is better on all axes. You choose the cheapest point on the frontier that meets your quality threshold and SLO."}]}, {"n": "12", "name": "Profiling & GPU Performance", "lessons": [{"id": "12.01", "t": "Stop Guessing: Build a Profiling Workflow", "f": "https://fanout.sh/inference-eng/curriculum/12-01", "k": ["profiling"], "x": [], "r": [["NVIDIA Nsight Systems User Guide", "https://docs.nvidia.com/nsight-systems/UserGuide/index.html", "System-wide timelines."], ["PyTorch Profiler recipe", "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html", "Op-level profiling in PyTorch."]], "q": "Outline a profiling workflow that goes from \"the server is slow\" to a specific fix.", "n": ["Profile with a purpose: start from a measured symptom.", "Go top down: metrics, then timeline, then individual kernels.", "Separate CPU time, GPU idle time and GPU kernel time.", "Compare against theoretical limits to know how much is left.", "Change one thing at a time and re-measure end to end."], "ak": "", "a": "## Top-down workflow\n%%flow From symptom to fix.\nSymptom -> Engine metrics -> *Timeline (nsys / torch profiler) -> Kernel deep-dive (ncu) -> Hypothesis -> Change and re-measure\n%%\n\n## Step by step\n1. **Symptom**: a specific metric, workload and load level. \"TPOT p50 is 22 ms at concurrency 32 for 1k/256.\"\n2. **Metrics**: is it queueing or preemption? If so, profiling kernels will not help.\n3. **Timeline**: capture a few steady-state steps. Measure step time, GPU idle gaps, and the top kernels.\n4. **Kernels**: for the top 3 kernels, check achieved bandwidth or FLOPs against peak.\n5. **Hypothesis**: \"attention is 40% of step and runs at 30% of bandwidth; a better backend should help.\"\n6. **Verify**: change, rerun the same workload, compare.\n\n## Classify time\n| Category | Found by | Typical fix |\n| CPU overhead / GPU idle | gaps in timeline | CUDA graphs, async scheduling |\n| Memory-bound kernels | low FLOPs, high bandwidth | fewer bytes: quantization, fusion |\n| Compute-bound kernels | high tensor core use | lower precision, better kernels |\n| Communication | NCCL kernels | topology, parallelism choice |\n\n> Takeaway: profile from a measured symptom, top down. Classify time into overhead, memory, compute and communication; each has different fixes.", "s": "Reproduce with a fixed workload and measure the symptom. Check engine metrics to rule out queueing or memory pressure. Capture a system-level timeline (Nsight Systems or the PyTorch profiler) of steady-state steps to find GPU idle gaps and which kernels dominate. Drill into the top kernels with Nsight Compute to see whether they are memory or compute bound and how close to peak. Form a hypothesis, change one thing, and re-measure."}, {"id": "12.02", "t": "PyTorch Profiler & Memory Snapshots", "f": "https://fanout.sh/inference-eng/curriculum/12-02", "k": ["profiling", "pytorch"], "x": [], "r": [["PyTorch: Understanding CUDA Memory Usage", "https://pytorch.org/docs/stable/torch_cuda_memory.html", "Memory snapshots and the visualizer."], ["PyTorch Profiler recipe", "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html", "Profiling basics."]], "q": "What does the PyTorch memory snapshot show that torch.cuda.max_memory_allocated does not?", "n": ["torch.profiler records CPU ops and CUDA kernels with timings and shapes.", "Export to Chrome trace format and view in Perfetto.", "key_averages().table() gives a quick top-kernels summary.", "Memory snapshots record allocations with stack traces; view them in the PyTorch memory visualizer.", "Use a schedule (wait, warmup, active) to profile steady-state steps only."], "ak": "", "a": "## Profiling ops and kernels\n```\nfrom torch.profiler import profile, ProfilerActivity, schedule\nwith profile(activities=[ProfilerActivity.CPU, ProfilerActivity.CUDA],\n             schedule=schedule(wait=2, warmup=2, active=5), record_shapes=True) as p:\n    for _ in range(9):\n        step(); p.step()\nprint(p.key_averages().table(sort_by=\"cuda_time_total\", row_limit=15))\np.export_chrome_trace(\"trace.json\")\n```\n\nThe schedule skips the first steps (warm-up) and records only steady state.\n\n## Reading the summary\n| Column | Use |\n| CUDA time total | which kernels dominate |\n| Calls | many tiny calls signal launch overhead |\n| Input shapes | confirm batch and sequence sizes |\n\n## Memory snapshots\n```\ntorch.cuda.memory._record_memory_history(max_entries=100000)\nrun_workload()\ntorch.cuda.memory._dump_snapshot(\"mem.pickle\")\n```\nDrag the file into the PyTorch memory visualizer. You see a timeline of allocations and, for any block, the stack trace that created it. Useful for finding activation peaks, leaks and fragmentation.\n\n## Limits\nThe PyTorch profiler sees what PyTorch launches. Engines with custom C++ or CUDA paths may need Nsight Systems for the full picture.\n\n> Takeaway: the PyTorch profiler shows which ops and kernels cost time; memory snapshots show who allocated what and when. Profile steady state only.", "s": "It records every allocation and free with its size, time and Python stack trace, so you can see which code allocated memory, how the peak was formed, and where fragmentation occurs in the caching allocator. max_memory_allocated only reports a single peak number."}, {"id": "12.03", "t": "Nsight Systems", "f": "https://fanout.sh/inference-eng/curriculum/12-03", "k": ["profiling", "nsight"], "x": [], "r": [["NVIDIA Nsight Systems User Guide", "https://docs.nvidia.com/nsight-systems/UserGuide/index.html", "Capture and analysis."], ["NVTX documentation", "https://nvidia.github.io/NVTX/", "Annotating code ranges."]], "q": "In an Nsight Systems timeline of a decode step you see many short kernels separated by gaps of 5 to 10 microseconds. What is the likely cause and fix?", "n": ["Nsight Systems (nsys) records a system-wide timeline: CPU threads, CUDA API calls, kernels, memory copies, NCCL.", "Add NVTX ranges to label steps and phases.", "Look for GPU idle gaps, serialization, and unexpected host-device copies.", "Use it to find where to look, then use Nsight Compute for kernel detail.", "Capture short windows of steady state to keep files manageable."], "ak": "", "a": "## Capturing\n```\nnsys profile -t cuda,nvtx,osrt --capture-range=cudaProfilerApi -o step_trace python serve.py\n```\nStart and stop capture around steady-state steps with `torch.cuda.profiler.start()/stop()`, or use a delay and duration.\n\n## Annotate\n```\nimport torch.cuda.nvtx as nvtx\nnvtx.range_push(\"decode_step\"); run_step(); nvtx.range_pop()\n```\nRanges appear as labeled bars above the GPU rows, which makes the timeline readable.\n\n## What to look for\n| Pattern | Meaning |\n| Gaps between kernels | CPU launch bound |\n| One kernel dominating | target for optimization |\n| cudaMemcpy on the critical path | host-device copies to remove |\n| cudaStreamSynchronize often | unnecessary syncs |\n| NCCL kernels long | communication bound (multi-GPU) |\n| CPU thread busy in Python | scheduler or tokenizer overhead |\n\n## Decode at small batch\nThe classic picture: hundreds of microsecond-scale kernels, each followed by a small gap. Total kernel time might be 6 ms in a 10 ms step. The remaining 4 ms is overhead that CUDA graphs can remove.\n\n> Takeaway: Nsight Systems shows the whole timeline: CPU, GPU, copies and communication. Use it to find idle gaps and the kernels worth deeper study.", "s": "The GPU is waiting for the CPU to launch each kernel: launch overhead dominates because each kernel finishes faster than the next can be issued. Fixes are CUDA graphs (record the whole step once and replay it with one launch), kernel fusion to reduce the number of kernels, and moving scheduling work off the critical path."}, {"id": "12.04", "t": "Nsight Compute", "f": "https://fanout.sh/inference-eng/curriculum/12-04", "k": ["profiling", "nsight"], "x": [], "r": [["NVIDIA Nsight Compute documentation", "https://docs.nvidia.com/nsight-compute/NsightCompute/index.html", "Metrics and sections."], ["Roofline model (Wikipedia)", "https://en.wikipedia.org/wiki/Roofline_model", "Interpreting compute vs memory limits."]], "q": "Nsight Compute reports a decode attention kernel at 85% of DRAM bandwidth and 8% of compute throughput. What does that tell you and what would make it faster?", "n": ["Nsight Compute (ncu) profiles individual kernels in depth.", "Speed of Light section: percent of peak compute and memory throughput.", "Memory workload analysis: cache hit rates, bytes moved.", "Occupancy and warp stall reasons explain why a kernel underperforms.", "Profile only a few kernel launches; ncu replays kernels and is slow."], "ak": "", "a": "## Capturing\n```\nncu --set full -k regex:attention --launch-skip 50 --launch-count 3 -o attn python bench.py\n```\nSkip warm-up launches, capture a few, open the report in the GUI.\n\n## Sections that matter\n| Section | Tells you |\n| GPU Speed of Light | % of peak SM throughput and memory throughput |\n| Roofline | where the kernel sits vs compute and memory ceilings |\n| Memory Workload Analysis | DRAM bytes, L2 and L1 hit rates |\n| Occupancy | active warps vs maximum |\n| Warp State Statistics | why warps stall: memory, dependencies, barriers |\n\n## Reading Speed of Light\n- High memory %, low compute %: memory bound. Reduce bytes.\n- High compute %, low memory %: compute bound. Lower precision or better math.\n- Both low: latency bound or poor occupancy. Look at stalls and launch configuration.\n\n## Typical inference kernels\n| Kernel | Usual bound |\n| Decode GEMM, small batch | memory |\n| Prefill GEMM | compute |\n| Decode attention | memory |\n| Prefill attention (FlashAttention) | compute |\n| RMSNorm, RoPE, adds | memory |\n\n> Takeaway: Nsight Compute tells you how close a kernel is to the hardware limit and which limit it hits. That decides whether to cut bytes or FLOPs.", "s": "The kernel is memory bound and already near the bandwidth limit, so tuning its compute will not help. It can only get faster by moving fewer bytes: quantizing the KV cache (FP8), using GQA-aware kernels that read each KV head once for all its query heads, or avoiding redundant reads."}, {"id": "12.05", "t": "Profile Prefill vs Decode", "f": "https://fanout.sh/inference-eng/curriculum/12-05", "k": ["profiling"], "x": [], "r": [["Splitwise", "https://arxiv.org/abs/2311.18677", "Phase-level characterization."], ["PyTorch Profiler recipe", "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html", "Tool for both captures."]], "q": "In a profile of prefill and decode for the same model, which kernels' share of time changes most, and why?", "n": ["Profile a pure prefill step and a pure decode step separately.", "Prefill: GEMMs dominate, compute bound; attention grows with length squared.", "Decode: memory-bound GEMMs, KV-reading attention, more relative overhead.", "The same model has very different optimization targets per phase.", "Mixed steps (continuous batching) blend both profiles."], "ak": "", "a": "## Two captures\n1. Prefill only: one request, 4k-token prompt, `max_tokens=1`.\n2. Decode only: 32 sequences at 1k context, measure a decode step.\n\n## Typical breakdown\n| Kernel group | Prefill share | Decode share |\n| QKV / O projections | ~25% | ~25% |\n| MLP GEMMs | ~50% | ~45% |\n| Attention | ~15% (grows with length) | ~15 to 30% (grows with context x batch) |\n| Norms, RoPE, adds | ~5% | ~5 to 10% |\n| Sampling, LM head | small | ~5% |\n| GPU idle | small | can be 10%+ without graphs |\n\nIllustrative. The key differences: decode has more overhead and memory-bound attention.\n\n## What to optimize per phase\n| Phase | Target |\n| Prefill | FP8 tensor cores, FlashAttention, chunk sizing |\n| Decode | fewer bytes (quantized weights/KV), CUDA graphs, fused small ops, efficient paged attention |\n\n## Mixed steps\nIn continuous batching, a step mixes both. Profiling real traffic shows a blend; separate captures make each part's cost clear.\n\n> Takeaway: prefill and decode stress the GPU differently. Profile them separately so you know which optimizations help which phase.", "s": "In prefill, large GEMMs dominate and attention grows with prompt length squared, both compute bound. In decode, GEMMs remain large in share but become memory bound and much shorter per token, attention becomes a bandwidth-bound read of the KV cache, and small kernels (norms, RoPE, sampling) plus launch overhead take a much larger share of the step."}, {"id": "12.06", "t": "GPU Execution, Memory Hierarchy & Kernel Launches", "f": "https://fanout.sh/inference-eng/curriculum/12-06", "k": ["gpu"], "x": [], "r": [["CUDA C++ Programming Guide", "https://docs.nvidia.com/cuda/cuda-c-programming-guide/", "Execution and memory model."], ["Modal GPU Glossary", "https://modal.com/gpu-glossary", "Short definitions of SMs, warps and memory levels."]], "q": "Order the GPU memory levels from fastest and smallest to slowest and largest, and say where a FlashAttention kernel keeps its tiles.", "n": ["A GPU has many streaming multiprocessors (SMs); each runs many threads in groups of 32 (warps).", "Memory hierarchy: registers, shared memory/L1, L2, HBM. Each level is bigger and slower.", "Kernels are launched from the CPU; each launch has microseconds of overhead.", "Fast kernels keep data in fast memory and reuse it before going back to HBM.", "Occupancy (active warps per SM) helps hide memory latency."], "ak": "", "a": "## Execution model\n- **SM (streaming multiprocessor)**: an H100 has 132. Each has tensor cores, CUDA cores, registers and shared memory.\n- **Thread block**: a group of threads scheduled on one SM, sharing its shared memory.\n- **Warp**: 32 threads executing in lockstep.\n- **Kernel**: a function launched over a grid of thread blocks.\n\n## Memory hierarchy\n| Level | Size (H100-class) | Bandwidth | Scope |\n| Registers | ~256 KB per SM | highest | thread |\n| Shared memory / L1 | up to ~228 KB per SM | very high | block |\n| L2 cache | ~50 MB | high | whole GPU |\n| HBM | 80 GB | ~3.35 TB/s | whole GPU |\n\nRough values; check your GPU's datasheet.\n\n## Why it matters\nKernels are fast when they load data from HBM once, reuse it many times from shared memory and registers, and write results once. Unfused chains of small ops each round-trip through HBM. FlashAttention, fused norms and quantized GEMMs all follow the \"load once, reuse in fast memory\" pattern.\n\n## Kernel launches\nLaunching a kernel costs a few microseconds of CPU and driver time. A decode step with 500 kernels can spend milliseconds just launching. CUDA graphs record a sequence of launches and replay it with one call.\n\n> Takeaway: GPUs are fast when work stays in registers and shared memory. Every trip to HBM and every kernel launch costs time; good kernels minimize both.", "s": "Registers (per thread), shared memory and L1 (per SM, ~200 KB), L2 cache (tens of MB, shared), HBM global memory (tens of GB). FlashAttention loads tiles of Q, K and V from HBM into shared memory and registers, computes on them there, and writes only the output back to HBM, avoiding storing the full attention matrix in HBM."}, {"id": "12.07", "t": "Compute-Bound vs Memory-Bound & the Roofline Model", "f": "https://fanout.sh/inference-eng/curriculum/12-07", "k": ["roofline"], "x": [], "r": [["Roofline: An Insightful Visual Performance Model", "https://people.eecs.berkeley.edu/~kubitron/cs252/handouts/papers/RooflineVyNoYellow.pdf", "The original roofline paper."], ["Horace He: Making Deep Learning Go Brrrr", "https://horace.io/brrr_intro.html", "Compute, bandwidth and overhead."]], "q": "An H100 has about 990 TFLOPs of dense BF16 and 3.35 TB/s of HBM bandwidth. What arithmetic intensity is the ridge point, and is a batch-8 decode GEMM above or below it?", "n": ["Arithmetic intensity = FLOPs / bytes moved.", "Attainable FLOPs = min(peak FLOPs, intensity x bandwidth).", "Ridge point = peak FLOPs / bandwidth. Below it: memory bound. Above: compute bound.", "Decode GEMMs have intensity close to the batch size; prefill GEMMs close to the token count.", "Use the roofline to know how much speedup is possible before you optimize."], "ak": "", "a": "## The model\n```\nattainable_flops = min(peak_flops, intensity * bandwidth)\nintensity = flops / bytes_moved\n```\n\n%%flow Two regimes.\nLow intensity -(limited by bandwidth)-> *Ridge point -(limited by compute)-> High intensity\n%%\n\n## Ridge points\n| GPU (rough) | BF16 dense TFLOPs | HBM TB/s | Ridge FLOPs/byte |\n| A100 80GB | 312 | 2.0 | ~156 |\n| H100 SXM | 990 | 3.35 | ~295 |\n| H200 | 990 | 4.8 | ~206 |\n\n## Intensity of inference ops\nFor a BF16 GEMM `[M, K] x [K, N]` with K and N large, bytes are dominated by weights (2KN), FLOPs are 2MKN, so intensity is about M.\n| Op | M | Regime on H100 |\n| Decode, batch 8 | 8 | memory bound |\n| Decode, batch 256 | 256 | near ridge |\n| Prefill, 2k tokens | 2,048 | compute bound |\n| Decode attention | ~1 per KV head group | memory bound |\n\n## Using it\nPlot each top kernel on the roofline using Nsight Compute data. A kernel far below its roof has room to improve. A kernel on the roof can only get faster by changing the roof (lower precision, fewer bytes).\n\n> Takeaway: intensity tells you which ceiling applies. Decode is below the ridge, prefill above. The roofline shows how much headroom each kernel has.", "s": "Ridge = 990e12 / 3.35e12, about 295 FLOPs per byte. A BF16 GEMM with M = 8 does 2 x 8 x K x N FLOPs while reading about 2 x K x N bytes of weights, so intensity is about 8 FLOPs per byte, far below the ridge. It is memory bound."}, {"id": "12.08", "t": "Lab: Produce a Bottleneck Report", "f": "https://fanout.sh/inference-eng/curriculum/12-08", "k": ["lab"], "x": ["Lab"], "r": [["NVIDIA Nsight Systems User Guide", "https://docs.nvidia.com/nsight-systems/UserGuide/index.html", "Timeline capture."], ["NVIDIA Nsight Compute documentation", "https://docs.nvidia.com/nsight-compute/NsightCompute/index.html", "Kernel analysis."]], "q": "What sections does a good bottleneck report have?", "n": ["Pick one workload and load level where performance disappoints.", "Capture metrics, a timeline and kernel profiles.", "Break step time into categories and put top kernels on a roofline.", "Diagnose the bottleneck and rank fixes by estimated gain.", "Verify the top fix and report before and after."], "ak": "", "a": "## Template\n1. **Symptom**: metric, workload, load, target.\n2. **Environment**: GPU, engine, model, config.\n3. **Engine metrics**: queueing, KV usage, preemptions.\n4. **Step breakdown**: table of kernel groups and idle time for a steady-state step.\n5. **Top kernels**: achieved bandwidth or FLOPs vs peak.\n6. **Diagnosis**: overhead, memory, compute or communication bound.\n7. **Recommendations**: ranked, each with an estimate (Amdahl).\n8. **Verification**: result of applying the top recommendation.\n\n## Example breakdown\n| Category | ms per step | Share |\n| GEMMs | 6.1 | 55% |\n| Attention | 2.4 | 22% |\n| Small ops | 0.9 | 8% |\n| GPU idle | 1.7 | 15% |\n| Total | 11.1 | 100% |\n\nEstimate: CUDA graphs remove most idle time, so about 13% faster. FP8 weights speed GEMMs ~1.6x, so about 20% faster. Do both and verify.\n\n> Takeaway: a bottleneck report turns a profile into a ranked, estimated plan. Verifying the top item closes the loop and calibrates your estimates.", "s": "Symptom and workload; environment; engine metrics summary; timeline breakdown of a steady-state step (kernel groups, idle time); top kernels with roofline position and efficiency; diagnosis naming the bottleneck class; ranked recommendations with estimated gain; and the verification plan."}]}, {"n": "13", "name": "Triton & Kernel Engineering", "lessons": [{"id": "13.01", "t": "GPU Threads, Warps, Blocks & Memory Access", "f": "https://fanout.sh/inference-eng/curriculum/13-01", "k": ["cuda", "gpu"], "x": [], "r": [["CUDA C++ Best Practices Guide", "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/", "Coalescing and memory optimization."], ["Modal GPU Glossary", "https://modal.com/gpu-glossary", "Threads, warps, blocks and SMs."]], "q": "Why does it matter that adjacent threads in a warp read adjacent memory addresses?", "n": ["A kernel runs a grid of thread blocks; each block runs on one SM; threads execute in warps of 32.", "Threads in a block share fast shared memory and can synchronize.", "Coalesced access: adjacent threads touch adjacent addresses, combined into few transactions.", "Occupancy: enough active warps per SM to hide memory latency.", "Bank conflicts in shared memory and branch divergence within a warp slow kernels."], "ak": "", "a": "## The hierarchy\n%%layers CUDA execution hierarchy.\nGrid | all thread blocks of one kernel launch\n*Thread block | runs on one SM; shares shared memory; can sync\nWarp | 32 threads in lockstep\nThread | own registers\n%%\n\n## Memory access\n- **Coalescing**: a warp's 32 loads are merged into wide transactions when addresses are contiguous and aligned.\n- **Strided or random access** splits into many transactions and wastes bandwidth.\n- **Shared memory banks**: 32 banks; threads hitting the same bank at different addresses serialize.\n\n## Latency hiding\nHBM loads take hundreds of cycles. An SM hides that by switching to other warps. More warps in flight (occupancy) means more hiding, up to the limit set by registers and shared memory per block.\n\n## Divergence\nIf threads in a warp take different branches, both paths run with some threads masked off. Keep branches uniform per warp where possible.\n\n| Problem | Symptom in profiler | Fix |\n| Uncoalesced loads | low DRAM efficiency | change layout or indexing |\n| Bank conflicts | shared memory stalls | pad or swizzle |\n| Low occupancy | many memory stalls | fewer registers, smaller blocks |\n| Divergence | low warp efficiency | restructure branches |\n\n> Takeaway: GPUs reward many threads reading contiguous memory. Coalescing and occupancy are the first things to get right in any kernel.", "s": "The hardware combines a warp's memory requests into as few memory transactions as possible. If 32 threads read 32 consecutive 4-byte values, that is one or a few 128-byte transactions (coalesced). If they read scattered addresses, the warp needs many transactions, wasting bandwidth, which is the main limit for memory-bound inference kernels."}, {"id": "13.02", "t": "Triton Programming Model", "f": "https://fanout.sh/inference-eng/curriculum/13-02", "k": ["triton"], "x": [], "r": [["Triton tutorials", "https://triton-lang.org/main/getting-started/tutorials/index.html", "Official step-by-step kernels."], ["Triton: an intermediate language and compiler for tiled neural network computations", "https://www.eecs.harvard.edu/~htk/publication/2019-mapl-tillet-kung-cox.pdf", "The original paper."]], "q": "How does Triton's programming model differ from CUDA's, and what does that save you?", "n": ["Triton is a Python-embedded language for writing GPU kernels on blocks of data.", "Each program instance handles one tile; you index tiles with tl.program_id.", "tl.load / tl.store with masks handle bounds; tl.dot uses tensor cores.", "The compiler handles thread layout, coalescing and shared memory.", "Autotuning picks block sizes and warps for your shapes."], "ak": "", "a": "## The model\nA Triton kernel is a Python function decorated with `@triton.jit`. You launch a grid of program instances; each processes one block of data using vector operations.\n\n```\n@triton.jit\ndef add(x_ptr, y_ptr, out_ptr, n, BLOCK: tl.constexpr):\n    pid = tl.program_id(0)\n    offs = pid * BLOCK + tl.arange(0, BLOCK)\n    mask = offs < n\n    x = tl.load(x_ptr + offs, mask=mask)\n    y = tl.load(y_ptr + offs, mask=mask)\n    tl.store(out_ptr + offs, x + y, mask=mask)\n\ngrid = (triton.cdiv(n, 1024),)\nadd[grid](x, y, out, n, BLOCK=1024)\n```\n\n## CUDA vs Triton\n| Aspect | CUDA | Triton |\n| Unit of code | one thread | one block of data |\n| Shared memory | manual | compiler-managed |\n| Coalescing | your responsibility | mostly automatic |\n| Tensor cores | intrinsics or libraries | `tl.dot` |\n| Peak performance | highest ceiling | close for many kernels |\n\n## Autotuning\n```\n@triton.autotune(configs=[triton.Config({'BLOCK': 512}, num_warps=4),\n                          triton.Config({'BLOCK': 1024}, num_warps=8)], key=['n'])\n```\nTriton benchmarks each config on first call for a given key and caches the best.\n\n## Where it is used\ntorch.compile generates Triton kernels; vLLM and SGLang use Triton for several ops. It is the most practical path into kernel work.\n\n> Takeaway: Triton lets you write tiled GPU kernels in Python and leaves thread-level details to the compiler. It is the fastest way to get custom kernels that perform well.", "s": "In CUDA you write code per thread and manage thread indexing, shared memory and synchronization yourself. In Triton you write code per program instance operating on blocks (tiles) of data with tensor-like operations, and the compiler handles thread mapping, coalescing, shared memory and much of the tiling detail. You keep control of tile sizes and data layout while writing far less low-level code."}, {"id": "13.03", "t": "Coalescing, Tiling & Reductions", "f": "https://fanout.sh/inference-eng/curriculum/13-03", "k": ["triton", "kernels"], "x": [], "r": [["Triton tutorial: Matrix multiplication", "https://triton-lang.org/main/getting-started/tutorials/03-matrix-multiplication.html", "Tiled GEMM in Triton."], ["CUDA C++ Best Practices Guide", "https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/", "Memory optimizations."]], "q": "Explain why tiling a matrix multiply reduces HBM traffic.", "n": ["Coalescing: lay out data so a block's loads are contiguous.", "Tiling: load a tile into fast memory once, reuse it for many outputs.", "Bigger tiles mean more reuse but more shared memory and registers, lower occupancy.", "Reductions (sum, max) combine values within a tile, then across tiles.", "Softmax and norms are row reductions; keep one row per program if it fits."], "ak": "", "a": "## Tiling\nFor `C = A @ B`, each program computes a `BM x BN` tile of C. It loops over K in chunks of `BK`, loading an `BM x BK` tile of A and a `BK x BN` tile of B, and accumulates.\n\n```\nacc = tl.zeros((BM, BN), dtype=tl.float32)\nfor k in range(0, K, BK):\n    a = tl.load(A_tile_ptrs); b = tl.load(B_tile_ptrs)\n    acc += tl.dot(a, b)\n    advance pointers by BK\ntl.store(C_tile_ptrs, acc.to(tl.bfloat16))\n```\n\nEach element of A is loaded once per tile of C columns, not once per output element.\n\n## Choosing tile sizes\n| Tile | Reuse | Resources | Notes |\n| 64 x 64 | moderate | low | good occupancy |\n| 128 x 128 | high | high | best for big GEMMs |\n| 16 x N | low | low | small-M decode GEMMs |\n\nAutotune over a few options per shape.\n\n## Reductions\nA row softmax: load a row, compute its max, subtract, exp, sum, divide. If the row fits in one tile, it is one load and one store. If not, loop over chunks with an online max and sum (the same trick FlashAttention uses).\n\n## Coalescing in practice\nLoad along the contiguous dimension. For a row-major `[M, K]` matrix, iterate K inside a tile so each warp reads contiguous bytes.\n\n> Takeaway: tiling turns repeated HBM reads into reuse in fast memory. Reductions follow the same pattern: one pass, with running statistics if the data is large.", "s": "Without tiling each output element reads a full row of A and column of B from HBM, so the same data is read many times. With tiling, a block loads a tile of A and a tile of B into shared memory or registers once and uses each loaded element for many output elements in its tile. Traffic drops roughly by the tile size factor, raising arithmetic intensity."}, {"id": "13.04", "t": "Write Vector & Reduction Kernels", "f": "https://fanout.sh/inference-eng/curriculum/13-04", "k": ["triton", "lab"], "x": [], "r": [["Triton tutorial: Vector addition", "https://triton-lang.org/main/getting-started/tutorials/01-vector-add.html", "First kernel."], ["Triton tutorial: Fused softmax", "https://triton-lang.org/main/getting-started/tutorials/02-fused-softmax.html", "Row reduction kernel."]], "q": "For a vector add kernel on 100 million BF16 elements, what is the best possible time on a 3.35 TB/s GPU and how do you check whether your kernel achieves it?", "n": ["Start with a vector add and a row-sum to learn load, store, masks and grids.", "Measure achieved bandwidth = bytes moved / time and compare with peak.", "Check correctness against PyTorch with torch.testing.assert_close.", "Use triton.testing.do_bench for stable timings.", "Elementwise and reduction kernels are memory bound; bandwidth is the goal."], "ak": "", "a": "## Kernel 1: vector add\nUse the example from 13.02. Then benchmark:\n```\nms = triton.testing.do_bench(lambda: add[grid](x, y, out, n, BLOCK=1024))\ngbps = 3 * n * x.element_size() / (ms * 1e-3) / 1e9\n```\n\n## Kernel 2: row sum\n```\n@triton.jit\ndef row_sum(x_ptr, out_ptr, n_cols, stride, BLOCK: tl.constexpr):\n    row = tl.program_id(0)\n    offs = tl.arange(0, BLOCK)\n    x = tl.load(x_ptr + row * stride + offs, mask=offs < n_cols, other=0.0)\n    tl.store(out_ptr + row, tl.sum(x.to(tl.float32), axis=0))\n```\nLaunch one program per row with `BLOCK = next_power_of_2(n_cols)`.\n\n## Checks\n- `torch.testing.assert_close(out, x.sum(-1), rtol=1e-2, atol=1e-2)` for BF16 inputs.\n- Sweep sizes from small to large; small sizes are launch bound, large ones bandwidth bound.\n\n| Size | Expect |\n| 1k elements | microseconds, launch bound |\n| 10M | approaching peak bandwidth |\n| 100M+ | 80 to 90% of peak |\n\n> Takeaway: your first kernels are about bandwidth. Compute achieved GB/s, compare with peak, and check correctness against PyTorch every time.", "s": "It reads two arrays and writes one: 3 x 100M x 2 bytes = 600 MB. At 3.35 TB/s the minimum is about 0.18 ms. Time the kernel with CUDA events or triton.testing.do_bench and compute achieved bandwidth as bytes moved divided by time; a good kernel reaches 80 to 90% of peak."}, {"id": "13.05", "t": "Write Softmax & RMSNorm", "f": "https://fanout.sh/inference-eng/curriculum/13-05", "k": ["triton", "lab"], "x": [], "r": [["Triton tutorial: Fused softmax", "https://triton-lang.org/main/getting-started/tutorials/02-fused-softmax.html", "Fused row-wise softmax."], ["Triton tutorial: Layer normalization", "https://triton-lang.org/main/getting-started/tutorials/05-layer-norm.html", "Norm kernel reference."]], "q": "Why is a fused RMSNorm kernel faster than PyTorch's sequence of x.pow(2).mean(), rsqrt, multiply, multiply?", "n": ["Softmax and RMSNorm are row-wise reductions followed by elementwise work.", "Fusing them means one read and one write per element.", "Compute in FP32 inside the kernel for stability, store in BF16.", "Subtract the row max in softmax.", "Fuse residual add into RMSNorm for an extra saving."], "ak": "", "a": "## Fused softmax\n```\n@triton.jit\ndef softmax(x_ptr, y_ptr, n_cols, stride, BLOCK: tl.constexpr):\n    r = tl.program_id(0); offs = tl.arange(0, BLOCK); m = offs < n_cols\n    x = tl.load(x_ptr + r*stride + offs, mask=m, other=-float('inf')).to(tl.float32)\n    x = x - tl.max(x, axis=0)\n    e = tl.exp(x)\n    tl.store(y_ptr + r*stride + offs, (e / tl.sum(e, axis=0)).to(tl.bfloat16), mask=m)\n```\n\n## Fused RMSNorm (with residual)\n```\n@triton.jit\ndef add_rmsnorm(x_ptr, res_ptr, w_ptr, out_ptr, n, eps, BLOCK: tl.constexpr):\n    r = tl.program_id(0); offs = tl.arange(0, BLOCK); m = offs < n\n    x = tl.load(x_ptr + r*n + offs, mask=m, other=0.).to(tl.float32)\n    x += tl.load(res_ptr + r*n + offs, mask=m, other=0.).to(tl.float32)\n    tl.store(res_ptr + r*n + offs, x.to(tl.bfloat16), mask=m)   # new residual\n    rms = tl.sqrt(tl.sum(x*x, axis=0) / n + eps)\n    w = tl.load(w_ptr + offs, mask=m)\n    tl.store(out_ptr + r*n + offs, (x / rms * w).to(tl.bfloat16), mask=m)\n```\n\n## Bytes moved\n| Version | HBM passes over the row |\n| PyTorch unfused add + norm | ~6 to 8 |\n| Fused add + RMSNorm | ~3 (read x, read/write residual, write out) |\n\n## Verify\nCompare with a PyTorch reference in FP32, then measure bandwidth. Expect 2 to 4 times speedup on the norm itself.\n\n> Takeaway: row-wise kernels gain by fusing every step into one pass. Accumulate in FP32, store in BF16, and fuse neighbors like the residual add.", "s": "The unfused version launches several kernels and writes and reads intermediate tensors to HBM between them, moving the data several times. A fused kernel loads each row once, computes the mean square, scale and gain multiply in registers, and writes the output once, so it moves about the minimum bytes and launches one kernel."}, {"id": "13.06", "t": "Write RoPE & Fused Operators", "f": "https://fanout.sh/inference-eng/curriculum/13-06", "k": ["triton", "rope"], "x": [], "r": [["RoFormer: Enhanced Transformer with Rotary Position Embedding", "https://arxiv.org/abs/2104.09864", "RoPE paper."], ["Triton tutorials", "https://triton-lang.org/main/getting-started/tutorials/index.html", "Kernel patterns to build on."]], "q": "What does rotary position embedding do to Q and K, and why is it a good candidate for fusion with the QKV projection output?", "n": ["RoPE rotates pairs of dimensions by position-dependent angles.", "It is elementwise given cos and sin tables: cheap math, memory bound.", "Fuse it with neighboring ops: QKV split, RoPE, and KV cache write in one kernel.", "Other common fusions: SiLU x up (SwiGLU), add + norm, dequant + GEMM.", "Every fusion removes at least one HBM round trip and one launch."], "ak": "", "a": "## RoPE in brief\nFor dimension pair `(x1, x2)` at position `p` with frequency `f_i`:\n```\ntheta = p * f_i\nx1' = x1 * cos(theta) - x2 * sin(theta)\nx2' = x1 * sin(theta) + x2 * cos(theta)\n```\nApplied to Q and K, not V. The dot product of rotated Q and K depends on their position difference.\n\n## A fused kernel\nOne program per (token, head):\n1. Load Q or K slice for the head.\n2. Load `cos` and `sin` for the token's position (or compute them).\n3. Rotate pairs.\n4. Store Q for attention; store K directly into the paged KV cache at the token's slot.\n\nThis merges three passes (split, rotate, cache write) into one.\n\n## Other fusions worth knowing\n| Fusion | Saves |\n| SiLU(gate) * up | one intermediate tensor write and read |\n| Residual add + RMSNorm | one pass over hidden state |\n| RoPE + KV cache write | one pass over K |\n| Dequantize + GEMM | full-precision weight copy |\n| Bias + activation into GEMM epilogue | one pass over output |\n\n## Watch out\nModels differ in RoPE layout (interleaved pairs vs split halves) and scaling variants for long context. Match the model's reference implementation exactly and test against it.\n\n> Takeaway: RoPE is cheap elementwise math that becomes nearly free when fused with the QKV output and KV write. Look for fusions wherever a tensor goes to HBM only to be read straight back.", "s": "RoPE rotates each pair of dimensions of Q and K by an angle proportional to the token position, so dot products depend on relative position. It is purely elementwise on the projection output, so applying it right after the QKV GEMM (or while writing K into the KV cache) avoids an extra HBM read and write of Q and K."}, {"id": "13.07", "t": "Benchmark & Profile Against PyTorch", "f": "https://fanout.sh/inference-eng/curriculum/13-07", "k": ["benchmarking", "triton"], "x": [], "r": [["Triton: testing utilities (do_bench)", "https://triton-lang.org/main/python-api/triton.testing.html", "Benchmark helpers."], ["PyTorch Profiler recipe", "https://pytorch.org/tutorials/recipes/recipes/profiler_recipe.html", "Measure the op inside the model."]], "q": "Your Triton kernel is 3 times faster than PyTorch in a micro-benchmark but the end-to-end step improves only 2%. Why?", "n": ["Benchmark at the shapes the model actually uses: decode batch sizes and prefill lengths.", "Compare against the strongest baseline: eager PyTorch, torch.compile, and the engine's current kernel.", "Report time, achieved bandwidth or FLOPs, and percent of peak.", "Check end-to-end effect; small ops have small total impact.", "Test numerics across shapes, including edge cases."], "ak": "", "a": "## Micro-benchmark setup\n```\nfor M in [1, 8, 32, 128, 512, 4096]:\n    x = torch.randn(M, 4096, device=\"cuda\", dtype=torch.bfloat16)\n    t_ref = triton.testing.do_bench(lambda: ref(x))\n    t_new = triton.testing.do_bench(lambda: mine(x))\n```\nUse real hidden sizes and the M values from decode and prefill.\n\n## Baselines\n| Baseline | Why |\n| Eager PyTorch | the naive reference |\n| torch.compile | what the compiler gives for free |\n| Engine's existing kernel | what you actually need to beat |\n\n## Report\n| M | PyTorch us | compile us | engine us | mine us | % of peak BW |\n| 1 | 18 | 9 | 7 | 6 | low (launch bound) |\n| 128 | 25 | 12 | 10 | 8 | 70% |\n| 4096 | 210 | 110 | 95 | 80 | 88% |\n\n## End to end\nPlug the kernel in and measure step time. Estimate first: if the op is 4% of step time and you make it 2 times faster, expect about 2%.\n\n> Takeaway: benchmark at real shapes against the strongest baseline, then check end to end. A big micro-benchmark win on a small op is a small win overall.", "s": "The op was only a small fraction of step time, so even a large speedup on it barely moves the total (Amdahl's law). The micro-benchmark may also have used shapes or conditions (warm caches, large sizes) unlike the real model, or the real engine already used a fused or optimized version, so the baseline in the step was faster than eager PyTorch."}, {"id": "13.08", "t": "Challenge: Optimize a Real Inference Kernel", "f": "https://fanout.sh/inference-eng/curriculum/13-08", "k": ["project"], "x": ["Challenge"], "r": [["vLLM GitHub repository", "https://github.com/vllm-project/vllm", "Kernels in csrc and Triton ops."], ["Triton tutorials", "https://triton-lang.org/main/getting-started/tutorials/index.html", "Techniques to apply."]], "q": "How would you pick which kernel in a real engine to optimize for this challenge?", "n": ["Pick a kernel from a profile, not from intuition.", "Score candidates by step share x headroom to the roofline.", "Write a Triton version, verify numerics, benchmark at real shapes.", "Integrate and measure end-to-end TPOT or TTFT.", "Write up the result, including what did not work."], "ak": "", "a": "## Steps\n1. Profile your engine on a real workload (Module 12).\n2. Score kernels:\n\n| Kernel | Step share | % of roof | Headroom score |\n| fused MoE / GEMM | 45% | 75% | medium |\n| decode attention | 20% | 60% | high |\n| sampling | 4% | 20% | low share |\n| add + RMSNorm | 5% | 40% | medium |\n\n3. Pick one, write a Triton kernel, autotune at the real shapes.\n4. Check numerics against the reference on random and real inputs.\n5. Integrate behind a flag; measure end-to-end metrics.\n\n## Rules of the challenge\n- Beat the engine's current kernel at the shapes your workload uses.\n- Report percent of peak before and after.\n- Report end-to-end change with confidence intervals.\n\n> Takeaway: real kernel work starts from a profile and ends with an end-to-end number. The challenge is to move both the kernel and the step.", "s": "Profile a representative workload, list kernels by share of step time, and for each estimate headroom from its roofline position (how far below its memory or compute ceiling it runs). Choose the kernel with the largest share times headroom that you can realistically improve, such as a fused norm, a sampling kernel, or a decode attention variant at your shapes."}]}, {"n": "14", "name": "Attention Optimization", "lessons": [{"id": "14.01", "t": "Profile Attention & Its Memory Movement", "f": "https://fanout.sh/inference-eng/curriculum/14-01", "k": ["attention", "profiling"], "x": [], "r": [["FlashAttention", "https://arxiv.org/abs/2205.14135", "IO analysis of attention."], ["PyTorch: scaled_dot_product_attention", "https://pytorch.org/docs/stable/generated/torch.nn.functional.scaled_dot_product_attention.html", "Fused attention entry point."]], "q": "How much HBM traffic does naive attention generate for one head with sequence length 8k and head dim 128 in BF16, compared with the inputs?", "n": ["Naive attention materializes the S x S score matrix in HBM.", "Its memory traffic grows with sequence length squared and dwarfs Q, K and V.", "Profile: attention share of step time vs sequence length.", "In decode, attention reads the KV cache: traffic proportional to context x batch.", "The fix for prefill is IO-aware tiling (FlashAttention); for decode, efficient KV reads."], "ak": "", "a": "## Naive attention's data flow\n%%flow Naive implementation round-trips through HBM.\nQ, K -> Scores S x S (HBM) -> Softmax (HBM) -> *Multiply by V -> Output\n%%\n\n## Traffic estimate (one head)\n| Tensor | Size at S = 8k, d = 128, BF16 |\n| Q, K, V | 2 MB each |\n| Scores | 128 MB |\n| Softmax probs | 128 MB |\n| Output | 2 MB |\n\nWriting and reading the scores and probabilities costs several hundred MB per head per layer. Across 32 heads and 32 layers, that is enormous.\n\n## Profile it\nRun prefill with eager attention at lengths 1k, 4k, 16k. Attention's share of step time rises steeply. Switch to `scaled_dot_product_attention` (which dispatches to a fused kernel) and compare.\n\n## Decode is different\nIn decode the score matrix is tiny (1 x S). The cost is reading K and V for every cached token. Per step traffic for batch B and context S is roughly `B x S x kv_bytes_per_token`. Here the optimization target is bandwidth efficiency and fewer KV bytes.\n\n> Takeaway: prefill attention is dominated by materializing the score matrix; decode attention by reading the KV cache. Different problems, different kernels.", "s": "Q, K and V are each 8k x 128 x 2 bytes = 2 MB, 6 MB total. The score matrix is 8k x 8k x 2 bytes = 128 MB, written and read back at least twice (scores, softmax output), so hundreds of MB of extra traffic, about 50 to 100 times the inputs. That traffic dominates naive attention time."}, {"id": "14.02", "t": "Tiled Attention & Online Softmax", "f": "https://fanout.sh/inference-eng/curriculum/14-02", "k": ["attention"], "x": [], "r": [["Online normalizer calculation for softmax", "https://arxiv.org/abs/1805.02867", "The online softmax trick."], ["Self-attention Does Not Need O(n^2) Memory", "https://arxiv.org/abs/2112.05682", "Chunked attention with constant memory."]], "q": "Explain how online softmax lets you process attention in blocks of keys without storing all scores.", "n": ["Split K and V into blocks; process one block at a time for a tile of queries.", "Keep running max, running sum and running output per query row.", "When the max changes, rescale earlier sums and outputs.", "The final result is exact, not an approximation.", "This makes attention memory O(S) instead of O(S^2)."], "ak": "", "a": "## The recurrence\nFor one query row, process key blocks `j = 1..n`:\n```\nm_new = max(m, max(s_j))\nl = l * exp(m - m_new) + sum(exp(s_j - m_new))\nacc = acc * exp(m - m_new) + exp(s_j - m_new) @ V_j\nm = m_new\n# after all blocks\nout = acc / l\n```\n\n## Why it is exact\nSoftmax is invariant to subtracting a constant. Rescaling by `exp(m_old - m_new)` corrects earlier terms to the new reference max. The final output equals standard softmax attention up to floating-point rounding.\n\n## Tiling\n%%flow Tiled attention for a block of queries.\nLoad Q tile -> *Loop over K,V tiles: scores, update m, l, acc -> Normalize -> Write output once\n%%\n\nMemory per tile: one Q tile, one K tile, one V tile, one score tile, and running stats. All fit in shared memory and registers.\n\n> Takeaway: online softmax lets attention stream over key blocks with running statistics. It is exact and removes the S x S matrix from memory.", "s": "For each query row you keep a running max m, a running sum of exponentials l, and a running output accumulator. For each new block of keys you compute block scores, update the max, rescale the old sum and accumulator by exp(old_m - new_m), add the new block's exponentials and weighted values, and move on. At the end you divide the accumulator by l. Only one block of scores exists at a time."}, {"id": "14.03", "t": "FlashAttention", "f": "https://fanout.sh/inference-eng/curriculum/14-03", "k": ["attention", "flashattention"], "x": [], "r": [["FlashAttention", "https://arxiv.org/abs/2205.14135", "Original IO-aware attention."], ["FlashAttention-2", "https://arxiv.org/abs/2307.08691", "Better parallelism and partitioning."], ["FlashAttention-3", "https://arxiv.org/abs/2407.08608", "Hopper-specific optimizations."]], "q": "FlashAttention does more FLOPs than standard attention in the backward pass, yet it is faster. Why, and what changed in FlashAttention-2 and 3?", "n": ["FlashAttention fuses attention into one kernel using tiling and online softmax.", "It never stores the score matrix in HBM, cutting memory traffic sharply.", "Speedups of several times for long sequences; memory linear in length.", "FA2: better work partitioning and parallelism over sequence length.", "FA3: Hopper features (TMA, warp specialization, FP8)."], "ak": "", "a": "## What it does\nOne kernel computes `softmax(QK^T)V` for blocks of queries, streaming K and V tiles from HBM into shared memory, keeping scores and running stats on chip, and writing only the output.\n\n## Why it wins\n| | Standard | FlashAttention |\n| HBM writes of S x S | yes | none |\n| Memory | O(S^2) | O(S) |\n| Kernels | several | one |\n| Bottleneck | memory traffic | compute (for long S) |\n\nAt long sequence lengths, FlashAttention turns attention from memory bound into compute bound, which is where GPUs shine.\n\n## Versions\n- **FlashAttention-2**: parallelizes over sequence length as well as batch and heads, reduces non-matmul work, better split of work between warps. Roughly 2 times faster than v1.\n- **FlashAttention-3**: for H100. Uses TMA for asynchronous loads, overlaps softmax with matmuls across warp groups, adds FP8 paths.\n\n## In inference engines\nEngines use FlashAttention (or similar kernels) for prefill and for variable-length batches, often with paged KV support. Decode uses specialized variants, since one query per sequence changes the best tiling (next lesson).\n\n> Takeaway: FlashAttention is fast because it moves fewer bytes, not because it does less math. It is the standard prefill attention kernel.", "s": "It is faster because attention is limited by HBM traffic, not FLOPs; FlashAttention keeps tiles in on-chip memory and never writes the score matrix, so it moves far fewer bytes, even if it recomputes some values. FlashAttention-2 improved parallelism and work partitioning across warps and along the sequence. FlashAttention-3 targets Hopper, using asynchronous data movement (TMA), warp specialization and FP8 support to raise tensor core utilization."}, {"id": "14.04", "t": "Prefill Attention vs Decode Attention", "f": "https://fanout.sh/inference-eng/curriculum/14-04", "k": ["attention"], "x": [], "r": [["Flash-Decoding for long-context inference", "https://pytorch.org/blog/flash-decoding/", "Split-KV decode attention."], ["FlashInfer", "https://github.com/flashinfer-ai/flashinfer", "Kernels specialized for prefill, decode and paged KV."]], "q": "Why is a FlashAttention kernel tuned for prefill a poor fit for decode, and what technique helps long-context decode?", "n": ["Prefill: many queries per sequence, high reuse, compute bound.", "Decode: one query per sequence, low reuse, memory bound.", "Decode at small batch and long context underuses the GPU without splitting KV.", "Split-KV / flash-decoding: parallelize over the KV length, then reduce.", "GQA lets one KV load serve several query heads; good kernels exploit it."], "ak": "", "a": "## Shapes differ\n| | Prefill | Decode |\n| Queries per sequence | prompt length | 1 (per step) |\n| Keys per sequence | prompt length | full context |\n| Bound by | compute | memory bandwidth |\n| Parallelism source | query tiles | batch x heads (low at small batch) |\n\n## The decode problem\nWith batch 4, 8 KV heads, and one query each, a naive decode kernel launches 32 work items. An H100 has 132 SMs. Most sit idle while a few read long KV sequences.\n\n## Split-KV\n%%flow Flash-decoding.\nKV sequence -> *Split into chunks across blocks -> Partial softmax and output per chunk -> Reduce with log-sum-exp -> Output\n%%\n\nEach chunk produces a partial output plus its max and sum. A small reduction kernel combines them exactly, using the same rescaling as online softmax.\n\n## GQA-aware decode\nWith GQA, 4 or 8 query heads share one KV head. Loading that KV once and computing all its query heads together multiplies reuse, which matters a lot for a bandwidth-bound kernel.\n\n> Takeaway: decode attention needs its own kernels. Split the KV length for parallelism, share KV loads across grouped query heads, and aim for full bandwidth.", "s": "Prefill kernels tile over many queries per sequence, so each loaded K/V tile is reused by a big Q tile and tensor cores stay busy. In decode there is one query per sequence (or a few per KV head with GQA), so there is little reuse and too few query tiles to fill the GPU at small batch. Split-KV (flash-decoding) partitions the long KV sequence across many thread blocks, computes partial results in parallel, and reduces them, keeping all SMs busy."}, {"id": "14.05", "t": "Paged Attention, FlashInfer & Serving Backends", "f": "https://fanout.sh/inference-eng/curriculum/14-05", "k": ["attention", "backends"], "x": [], "r": [["FlashInfer", "https://github.com/flashinfer-ai/flashinfer", "Attention kernel library for serving."], ["FlashInfer paper", "https://arxiv.org/abs/2501.01005", "Design of a customizable attention engine."], ["vLLM: Attention backends", "https://docs.vllm.ai/en/latest/design/attention_backends.html", "Supported backends and selection."]], "q": "What does an engine's \"attention backend\" setting choose, and what should you consider when switching backends?", "n": ["Serving attention must handle paged KV, variable lengths and mixed prefill/decode batches.", "Libraries: FlashAttention (with paged support), FlashInfer, Triton kernels, vendor kernels.", "FlashInfer offers block-sparse and paged layouts, cascade attention for shared prefixes, and JIT-specialized kernels.", "Backend choice depends on GPU, model architecture and features needed.", "Benchmark backends at your workload's shapes; winners differ by context and batch."], "ak": "", "a": "## What a serving backend must handle\n- Paged KV with block tables.\n- Variable sequence lengths in one batch.\n- Mixed prefill chunks and decode tokens.\n- GQA, MQA or MLA head layouts.\n- Sliding window or other masks.\n- FP8 KV cache.\n- CUDA graph compatibility (fixed launch shapes).\n\n## Common options\n| Backend | Strengths |\n| FlashAttention (v2/v3) | fast prefill, paged support, broad use |\n| FlashInfer | serving-focused, paged/ragged layouts, cascade attention, many variants |\n| Triton kernels | portable, easy to modify |\n| Vendor (TensorRT-LLM, cuDNN) | tuned for NVIDIA hardware |\n\n## Cascade attention\nWhen many requests share a long prefix, compute attention over the shared part once per batch and the unique suffixes per request, then merge. This saves KV reads of the shared prefix. FlashInfer and others implement it.\n\n## Choosing\n1. List required features for your model (MLA? sliding window? FP8 KV?).\n2. Filter backends that support them on your GPU.\n3. Benchmark with your workload; the engine flag or environment variable selects the backend.\n\n> Takeaway: the attention backend is a real performance lever. Pick by features first, then by measured speed at your shapes.", "s": "It chooses which kernel library implements attention for prefill, decode and mixed batches with the engine's KV layout, for example FlashAttention, FlashInfer, or Triton-based kernels. When switching, check hardware support, dtype support (FP8 KV), features (paged KV, sliding window, MLA, cascade attention), correctness on your model, and performance at your shapes (batch, context, GQA ratio)."}, {"id": "14.06", "t": "Lab: Compare Attention Backends", "f": "https://fanout.sh/inference-eng/curriculum/14-06", "k": ["lab"], "x": ["Lab"], "r": [["vLLM: Attention backends", "https://docs.vllm.ai/en/latest/design/attention_backends.html", "How to select backends."], ["FlashInfer", "https://github.com/flashinfer-ai/flashinfer", "One of the backends."]], "q": "What grid of conditions should an attention backend comparison cover?", "n": ["Compare at least two attention backends in one engine.", "Cover a grid: context length, batch size, prefill vs decode, KV dtype.", "Measure kernel time and end-to-end metrics.", "Check outputs match the reference within tolerance.", "Recommend a backend per workload shape."], "ak": "", "a": "## Grid\n| Axis | Values |\n| Context | 1k, 8k, 32k |\n| Concurrency | 1, 16, 128 |\n| Phase focus | prefill-heavy, decode-heavy |\n| KV dtype | BF16, FP8 |\n\n## Measurements\n- End to end: TTFT p50/p95, TPOT p50/p95, throughput.\n- Profile: attention kernel time per step.\n- Correctness: greedy outputs on 50 prompts match reference, or logits within tolerance.\n\n## Expected findings\n- Differences are small at short context and grow at long context.\n- Decode at small batch and long context favors kernels with split-KV.\n- FP8 KV support differs between backends.\n\n## Deliverable\nA table of results and a recommendation: which backend for which workload, and why, using the profile data.\n\n> Takeaway: backends differ most at long context and small batch. Measure across a grid and choose per workload, not by reputation.", "s": "Prefill-heavy and decode-heavy workloads; short (1k) and long (32k) contexts; small and large batch sizes; BF16 and FP8 KV; and, if relevant, shared-prefix traffic. Measure both kernel time from a profile and end-to-end TTFT, TPOT and throughput, and verify outputs match."}]}, {"n": "15", "name": "Compilation & CUDA Graphs", "lessons": [{"id": "15.01", "t": "Eager Execution & Runtime Overhead", "f": "https://fanout.sh/inference-eng/curriculum/15-01", "k": ["runtime"], "x": [], "r": [["Horace He: Making Deep Learning Go Brrrr", "https://horace.io/brrr_intro.html", "Overhead as the third bottleneck."], ["PyTorch blog: Accelerating PyTorch with CUDA Graphs", "https://pytorch.org/blog/accelerating-pytorch-with-cuda-graphs/", "Launch overhead removal."]], "q": "At batch size 1 decode, kernel time is 6 ms but step time is 11 ms. Where do the other 5 ms go?", "n": ["Eager mode runs Python and dispatches each op one by one.", "Each op costs microseconds of CPU time; a decode step has hundreds of ops.", "When kernels are short (small batch decode), the GPU waits on the CPU.", "Overhead shows as GPU idle gaps in timelines.", "Fixes: fuse ops (fewer kernels) and capture graphs (fewer launches)."], "ak": "", "a": "## Where eager mode spends time\nEvery PyTorch op goes through Python, the dispatcher, autograd checks (even in inference mode, some), argument packing and a CUDA launch. Typically 5 to 20 microseconds of CPU per op.\n\n## When it matters\n| Situation | Kernel time per op | Overhead share |\n| Prefill, large batch | milliseconds | negligible |\n| Decode, batch 256 | tens of microseconds | small |\n| Decode, batch 1 | a few microseconds | can be half the step |\n\n## How to see it\nIn Nsight Systems or the PyTorch profiler: the GPU row has gaps between kernels, and the CPU row is continuously busy. Total GPU-busy time is clearly less than step time.\n\n## Fixes\n- **Fusion** (torch.compile, custom kernels): fewer ops, fewer launches.\n- **CUDA graphs**: record the whole step's kernel sequence once, replay with one launch.\n- **Async scheduling**: prepare the next step's inputs on the CPU while the GPU runs the current one.\n\n> Takeaway: at small batch, the CPU can be the bottleneck. Measure GPU idle time; if it is large, compilation and graphs are the cheapest wins.", "s": "CPU-side overhead: Python interpreting the model code, PyTorch dispatching each op, building kernel arguments and launching hundreds of kernels, plus scheduler work and synchronization between steps. The GPU sits idle between kernels waiting for launches. Compilation and CUDA graphs target exactly this."}, {"id": "15.02", "t": "torch.compile & Kernel Fusion", "f": "https://fanout.sh/inference-eng/curriculum/15-02", "k": ["compile"], "x": [], "r": [["PyTorch: Introduction to torch.compile", "https://pytorch.org/tutorials/intermediate/torch_compile_tutorial.html", "Usage and concepts."], ["PyTorch 2 paper (Dynamo and Inductor)", "https://dl.acm.org/doi/10.1145/3620665.3640366", "Design of the compiler stack."]], "q": "What does torch.compile do to a model's forward pass at a high level?", "n": ["torch.compile captures graphs with TorchDynamo and generates kernels with TorchInductor.", "Inductor fuses pointwise and reduction ops into Triton kernels.", "Matmuls go to cuBLAS or generated templates; modes like max-autotune search for faster ones.", "First call compiles (slow); later calls reuse compiled code.", "Engines like vLLM integrate torch.compile for parts of the model."], "ak": "", "a": "## The pipeline\n%%flow torch.compile stages.\nPython model -(TorchDynamo)-> FX graph -(AOTAutograd)-> *TorchInductor -> Triton kernels + library calls\n%%\n\n## Usage\n```\nmodel = torch.compile(model, mode=\"max-autotune-no-cudagraphs\", dynamic=False)\n```\nModes trade compile time for speed: `default`, `reduce-overhead` (adds CUDA graphs), `max-autotune` (searches kernel configs).\n\n## What fusion gives\nA chain like `x + residual -> rmsnorm -> * weight` becomes one generated kernel. SiLU and multiply in SwiGLU merge. Dtype casts disappear into neighbors.\n\n| Op chain | Eager kernels | Compiled kernels |\n| add + RMSNorm | ~5 | 1 |\n| SiLU(gate) * up | 3 | 1 |\n| RoPE on q, k | several | 1 to 2 |\n\n## Costs\n- Compile time: seconds to minutes at startup.\n- Recompiles when shapes or code paths change (next lesson).\n- Debugging is harder; generated code can be inspected with `TORCH_LOGS=output_code`.\n\n> Takeaway: torch.compile captures the model as a graph and generates fused kernels. It cuts kernel count and Python overhead at the cost of compile time.", "s": "TorchDynamo captures the Python code into an FX graph of tensor operations (falling back to Python where it cannot), AOTAutograd prepares the graph, and TorchInductor lowers it to optimized code, fusing elementwise and reduction ops into generated Triton kernels and calling libraries like cuBLAS for matmuls. The result runs fewer, larger kernels with less Python overhead."}, {"id": "15.03", "t": "Graph Breaks & Dynamic Shapes", "f": "https://fanout.sh/inference-eng/curriculum/15-03", "k": ["compile"], "x": [], "r": [["PyTorch: torch.compile troubleshooting", "https://pytorch.org/docs/stable/torch.compiler_troubleshooting.html", "Graph breaks and recompiles."], ["PyTorch: Dynamic shapes", "https://pytorch.org/docs/stable/torch.compiler_dynamic_shapes.html", "Symbolic shapes in compile."]], "q": "What is a graph break, give two causes, and how do dynamic shapes cause recompilation?", "n": ["Graph breaks split the graph and stop fusion across the break.", "Common causes: tensor-value control flow, .item(), unsupported Python, printing.", "Find them with TORCH_LOGS=graph_breaks or torch._dynamo.explain.", "Inference has varying batch sizes and lengths; static compilation recompiles per shape.", "Options: mark dims dynamic, pad to buckets, or compile only shape-stable parts."], "ak": "", "a": "## Graph breaks\nWhen Dynamo hits code it cannot capture, it splits:\n```\ndef f(x):\n    y = x * 2\n    if y.sum() > 0:    # depends on tensor value: break\n        y = y + 1\n    return y.relu()\n```\nEach piece compiles separately, and the boundary costs a sync or Python round trip.\n\nFind them:\n```\nTORCH_LOGS=\"graph_breaks\" python run.py\n```\n\n## Dynamic shapes\nInference inputs vary: batch size changes every step; prefill chunk length varies. Options:\n| Strategy | Pros | Cons |\n| Static, recompile per shape | best kernels | many compiles, startup time |\n| Dynamic dims | one compile | less specialization |\n| Bucketing (pad to sizes) | few compiles | padding waste |\n\nEngines usually compile with a dynamic token dimension for the main model body and capture CUDA graphs for a set of batch sizes, padding each step to the nearest captured size.\n\n## Practical rules\n- Keep data-dependent control flow out of the compiled region.\n- Avoid `.item()` and host syncs inside the model.\n- Check recompile counts in logs during a benchmark; they should stop after warm-up.\n\n> Takeaway: graph breaks and shape changes are the main ways compilation goes wrong. Keep the model trace-friendly and handle variable shapes with dynamic dims or buckets.", "s": "A graph break is where TorchDynamo cannot trace the Python code, so it ends the current graph, runs that code eagerly, and starts a new graph; fusion across the break is lost. Causes: data-dependent control flow (if on a tensor value), calls to unsupported functions or .item(). With static shapes, a new input shape (different batch size or sequence length) triggers a new compilation; marking dimensions dynamic avoids that at some optimization cost."}, {"id": "15.04", "t": "CUDA Graph Capture & Replay", "f": "https://fanout.sh/inference-eng/curriculum/15-04", "k": ["cuda-graphs"], "x": [], "r": [["PyTorch blog: Accelerating PyTorch with CUDA Graphs", "https://pytorch.org/blog/accelerating-pytorch-with-cuda-graphs/", "How capture and replay work."], ["CUDA C++ Programming Guide: CUDA Graphs", "https://docs.nvidia.com/cuda/cuda-c-programming-guide/index.html#cuda-graphs", "Underlying API."]], "q": "What constraints does CUDA graph capture impose, and how do engines handle variable batch sizes with it?", "n": ["CUDA graphs record a sequence of kernel launches and replay it with one call.", "Removes per-kernel launch overhead; big win for small-batch decode.", "Shapes and memory addresses are frozen at capture time.", "Engines capture graphs for a list of batch sizes and pad to the next size.", "Decode steps are graph-friendly; prefill with variable lengths often runs without graphs or with piecewise graphs."], "ak": "", "a": "## How it works\n```\nstatic_in = torch.zeros(B, 1, dtype=torch.long, device=\"cuda\")\ng = torch.cuda.CUDAGraph()\nwith torch.cuda.graph(g):\n    static_out = model_step(static_in)\n# later, every step:\nstatic_in.copy_(new_inputs); g.replay(); result = static_out.clone()\n```\n\n## Constraints\n- Same shapes on every replay.\n- Same memory addresses: inputs and outputs live in static buffers.\n- No CPU logic, `.item()`, prints or allocations inside the captured region.\n- Random number generation must use graph-safe generators.\n\n## Variable batch sizes\n| Running seqs | Graph used | Padding |\n| 5 | size 8 | 3 slots |\n| 30 | size 32 | 2 |\n| 130 | size 136 or 256 (depending on list) | some |\n\nPadding wastes a little compute, much less than the launch overhead saved.\n\n## Attention complication\nAttention depends on per-sequence lengths and block tables. Graph-compatible backends read these from static tensors updated before each replay, so the kernel launch shape stays fixed.\n\n## Piecewise graphs\nSome engines capture graphs for the parts between attention ops and run attention outside the graph, so prefill and mixed steps also benefit.\n\n> Takeaway: CUDA graphs remove launch overhead by replaying fixed kernel sequences. Engines capture a set of batch sizes and pad, which makes small-batch decode much faster.", "s": "A captured graph replays fixed kernels with fixed memory addresses and shapes; no CPU-side logic, host syncs or new allocations can happen inside it, and inputs must be copied into the same static buffers before replay. Engines capture one graph per batch size from a chosen set (e.g. 1, 2, 4, 8, 16 ... 512), and at runtime pad the batch up to the nearest captured size."}, {"id": "15.05", "t": "Graph Memory, Startup & Steady-State Trade-Offs", "f": "https://fanout.sh/inference-eng/curriculum/15-05", "k": ["cuda-graphs", "startup"], "x": [], "r": [["vLLM: Optimization and tuning", "https://docs.vllm.ai/en/latest/configuration/optimization.html", "CUDA graph and compile settings."], ["PyTorch: Compile time caching", "https://pytorch.org/tutorials/recipes/torch_compile_caching_tutorial.html", "Reusing compiled artifacts across runs."]], "q": "You capture CUDA graphs for 67 batch sizes and compile with max-autotune. Startup now takes 6 minutes and KV capacity dropped 3%. When is that worth it?", "n": ["More captured sizes: less padding, more memory and longer startup.", "Aggressive autotuning: faster kernels, much longer compile.", "Graph memory pools reduce KV capacity slightly.", "Startup time matters for autoscaling and recovery.", "Cache compilation artifacts and choose capture sizes from real batch distributions."], "ak": "", "a": "## The trade-offs\n| Choice | Steady state | Startup | Memory |\n| No graphs | slowest at small batch | fastest | most KV |\n| Few graph sizes | good | short | small cost |\n| Many graph sizes | best (least padding) | long | larger cost |\n| max-autotune compile | faster kernels | much longer | similar |\n\n## Deciding\n- **Long-lived, stable fleet**: optimize steady state.\n- **Spiky traffic with autoscaling**: optimize startup; each minute of startup is a minute of missing capacity during a spike.\n- **Frequent deploys**: startup cost multiplies.\n\n## Reducing startup cost\n- Capture graph sizes only up to your observed max batch.\n- Cache torch.compile artifacts between runs (same versions and shapes).\n- Warm up on a staging step before marking the replica ready (Module 22).\n\n## Measure\nRecord time from process start to ready, KV tokens available, and TPOT at batch 1 and 64 for each configuration.\n\n> Takeaway: compilation and graphs buy steady-state speed with startup time and memory. Choose based on how often replicas start, not on benchmarks alone.", "s": "It is worth it for long-lived replicas with stable traffic, where steady-state speed matters over hours and startup is rare. It is not worth it when you autoscale often or need fast recovery, because every new replica takes 6 minutes before serving; there, capture fewer sizes, use default compile, or cache compiled artifacts."}, {"id": "15.06", "t": "Lab: Compile and Capture an Inference Workload", "f": "https://fanout.sh/inference-eng/curriculum/15-06", "k": ["lab"], "x": ["Lab"], "r": [["PyTorch: Introduction to torch.compile", "https://pytorch.org/tutorials/intermediate/torch_compile_tutorial.html", "Compile modes."], ["PyTorch blog: Accelerating PyTorch with CUDA Graphs", "https://pytorch.org/blog/accelerating-pytorch-with-cuda-graphs/", "Graphs."]], "q": "Which three configurations do you compare and what do you expect at batch 1 vs batch 128?", "n": ["Use your own generation loop with a KV cache from Module 03.", "Compare eager, compiled, and compiled with CUDA graphs.", "Measure TPOT at batch 1, 8, 64 and 128, plus startup time.", "Profile each to show the change in GPU idle time.", "Explain where each gain came from."], "ak": "", "a": "## Steps\n1. Make your decode step a pure function of static tensors (input ids, positions, KV buffers, lengths).\n2. Eager baseline: measure TPOT at batch 1, 8, 64, 128.\n3. `torch.compile(step, dynamic=False)` per batch size; measure again.\n4. Capture CUDA graphs of the compiled step for each batch size; replay and measure.\n5. Profile one step of each configuration at batch 1.\n\n## Expected results\n| Batch | Eager | Compile | Compile + graphs |\n| 1 | 1.0x | ~1.3x | ~2x |\n| 8 | 1.0x | ~1.3x | ~1.7x |\n| 128 | 1.0x | ~1.15x | ~1.2x |\n\nIllustrative.\n\n## Also report\n- Compile and capture time.\n- Extra memory used.\n- GPU idle share in the profile for each config.\n\n> Takeaway: graphs win most at small batch, fusion helps everywhere a little. Measure startup and memory too, since that is what you pay.", "s": "Eager, torch.compile without graphs, and torch.compile with CUDA graphs. At batch 1, eager is slowest; compile helps through fusion; graphs give the biggest gain by removing launch overhead. At batch 128, all three are closer because kernels are long and overhead is a small share; compile still helps somewhat through fusion."}]}, {"n": "16", "name": "Speculative Decoding", "lessons": [{"id": "16.01", "t": "Why Autoregressive Decode Is Sequential", "f": "https://fanout.sh/inference-eng/curriculum/16-01", "k": ["speculative"], "x": [], "r": [["Fast Inference from Transformers via Speculative Decoding", "https://arxiv.org/abs/2211.17192", "Leviathan et al."], ["Accelerating Large Language Model Decoding with Speculative Sampling", "https://arxiv.org/abs/2302.01318", "Chen et al."]], "q": "Why can a model verify 5 proposed tokens in about the same time it takes to generate 1?", "n": ["Each token depends on the previous one, so standard decode needs one forward pass per token.", "At small batch each pass is memory bound and uses little of the GPU's compute.", "Scoring several tokens in one pass costs about the same as scoring one.", "If we can guess future tokens cheaply, the big model can check many at once.", "That is speculative decoding: guess with something cheap, verify in parallel."], "ak": "", "a": "## The sequential bottleneck\nToken `t+1` needs token `t`. So generating 200 tokens needs 200 forward passes of the full model. Each pass at batch 1 reads all weights for very little math.\n\n## Spare compute\nAt batch 1 on an 8B model, a decode step uses perhaps 1 to 5% of the GPU's FLOPs. Processing 4 or 8 tokens in the same pass (like a tiny prefill) adds little time, because weights are read once either way.\n\n| Tokens in one pass | Relative step time (memory-bound regime) |\n| 1 | 1.0 |\n| 4 | ~1.05 |\n| 8 | ~1.1 |\n| 64 | noticeably more |\n\n## The idea\nIf something cheap proposes the next few tokens, the big model can check all of them in a single pass. Every correct guess saves a full forward pass.\n\n%%flow Speculative decoding in one line.\nCheap proposer -(k guesses)-> *Target model verifies k in one pass -> Accept prefix -> Repeat\n%%\n\n> Takeaway: decode leaves compute idle. Verifying several guessed tokens in one pass uses that idle compute to skip forward passes.", "s": "Decode is memory bound: a step's time is dominated by reading the weights. Feeding 5 tokens instead of 1 through the same forward pass reads the weights once and does 5 times the (still small) compute, so the step takes nearly the same time, while producing logits for all 5 positions at once."}, {"id": "16.02", "t": "Draft Models, Target Models & Parallel Verification", "f": "https://fanout.sh/inference-eng/curriculum/16-02", "k": ["speculative"], "x": [], "r": [["Fast Inference from Transformers via Speculative Decoding", "https://arxiv.org/abs/2211.17192", "The algorithm and proof."], ["vLLM: Speculative decoding", "https://docs.vllm.ai/en/latest/features/spec_decode.html", "How engines run it."]], "q": "Walk through one round of draft-model speculative decoding with k = 4.", "n": ["A draft model (small, same tokenizer) proposes k tokens.", "The target model scores all k plus one more in one pass.", "Accept draft tokens while they pass a probabilistic test; stop at first rejection.", "Each round yields 1 to k+1 tokens; output distribution equals the target's.", "Speedup depends on acceptance rate and the draft's cost relative to the target."], "ak": "", "a": "## One round\n%%seq Draft and verify, k = 4.\nDraft > Draft : propose t1..t4 (4 small passes)\nDraft > Target : context + t1..t4\nTarget > Target : one pass, 5 distributions\nTarget > Engine : accept t1, t2; reject t3; sample t3'\n%%\n\nOutput this round: t1, t2, t3'. Three tokens for one target pass plus four cheap draft passes.\n\n## Requirements\n- Same tokenizer and vocabulary for draft and target.\n- The target's KV cache is updated for accepted tokens; rejected positions are rolled back.\n- The draft model keeps its own KV cache.\n\n## Expected tokens per round\nWith per-token acceptance probability `a` and draft length `k`, the expected number of tokens per round is `(1 - a^(k+1)) / (1 - a)`.\n\n| a | k = 4 | k = 8 |\n| 0.6 | 2.2 | 2.5 |\n| 0.8 | 3.4 | 4.3 |\n| 0.9 | 4.1 | 6.1 |\n\n## Speedup\nSpeedup is roughly tokens per round divided by (1 + k x draft_cost / target_cost). A draft that is 10% the cost of the target with a = 0.8, k = 4: 3.4 / 1.4 = 2.4 times.\n\n> Takeaway: draft k tokens cheaply, verify them in one target pass, keep the accepted prefix. Acceptance rate and draft cost decide the speedup.", "s": "The small draft model generates 4 tokens autoregressively from the current context (4 cheap passes). The target model runs one forward pass on the context plus those 4 tokens, producing distributions for 5 positions. Starting from the first, each draft token is accepted or rejected by comparing draft and target probabilities. At the first rejection, a corrected token is sampled and the rest discarded; if all 4 are accepted, a fifth token is sampled from the target's last distribution. The round yields between 1 and 5 tokens."}, {"id": "16.03", "t": "Acceptance, Rejection & Draft Length", "f": "https://fanout.sh/inference-eng/curriculum/16-03", "k": ["speculative"], "x": [], "r": [["Accelerating Large Language Model Decoding with Speculative Sampling", "https://arxiv.org/abs/2302.01318", "Rejection sampling scheme."], ["Fast Inference from Transformers via Speculative Decoding", "https://arxiv.org/abs/2211.17192", "Proof of correctness."]], "q": "State the acceptance rule for speculative sampling and explain why it preserves the target model's output distribution.", "n": ["Accept draft token x with probability min(1, p(x) / q(x)).", "On rejection, sample from normalized max(0, p - q).", "This is lossless: the output distribution equals the target's.", "Greedy case: accept while draft equals target argmax.", "Draft length k: longer gains more when acceptance is high, wastes more when low."], "ak": "", "a": "## The rule\nFor each draft position `i`, in order:\n```\nr = uniform(0, 1)\nif r < min(1, p_i(x_i) / q_i(x_i)): accept x_i\nelse:\n    sample y from normalize(max(0, p_i - q_i)); output y; stop\nif all accepted: sample one more token from p_{k+1}\n```\n\n## Why it is exact\nFor any token `x`, the probability of outputting `x` at a position is `q(x) * min(1, p/q) + P(reject) * residual(x)`, which works out to `p(x)`. So quality is unchanged; only speed changes.\n\n## Choosing k\n| Situation | Better k |\n| High acceptance (code, repetitive text) | larger (6 to 10) |\n| Low acceptance (creative, high temperature) | smaller (2 to 4) |\n| Expensive draft | smaller |\n| High batch (little spare compute) | smaller or off |\n\nSome engines adapt k per request or per step based on recent acceptance.\n\n## Measuring\nTrack acceptance rate per position and mean accepted length. Acceptance usually falls for later positions, since errors compound.\n\n> Takeaway: the min(1, p/q) rule plus residual sampling keeps outputs exactly target-distributed. Tune draft length to acceptan
