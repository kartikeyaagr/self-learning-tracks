ce rate and spare compute.", "s": "For a draft token x with draft probability q(x) and target probability p(x), accept with probability min(1, p(x)/q(x)). If rejected, sample from the normalized residual max(0, p - q). Combining the two cases gives exactly p(x) for every token, so the final output is distributed as if sampled from the target alone. With greedy decoding, the rule reduces to accepting while the draft token equals the target's argmax."}, {"id": "16.04", "t": "Speculation Under Different Concurrency Levels", "f": "https://fanout.sh/inference-eng/curriculum/16-04", "k": ["speculative", "batching"], "x": [], "r": [["vLLM: Speculative decoding", "https://docs.vllm.ai/en/latest/features/spec_decode.html", "Configuration and caveats."], ["Optimizing Speculative Decoding for Serving Large Language Models Using Goodput", "https://arxiv.org/abs/2406.14066", "Adaptive speculation under load."]], "q": "Why does speculative decoding give big speedups at batch 1 and can slow things down at batch 128?", "n": ["Speculation spends spare compute to cut latency.", "At low concurrency there is spare compute: large gains.", "At high concurrency compute is busy: rejected tokens waste capacity.", "Throughput can fall at high load even when latency per token improves.", "Adaptive policies reduce or disable speculation as batch size grows."], "ak": "", "a": "## The trade\n| Concurrency | Spare compute | Speculation effect |\n| 1 to 4 | lots | large TPOT gain |\n| 16 to 32 | some | moderate gain |\n| 128+ | little | small gain or loss |\n\n## Why loss is possible\nEvery verified position costs compute. With acceptance 0.7 and k = 4, about 1.6 of every 4 drafted tokens are rejected and their verification compute is wasted. When the GPU is compute bound, that waste displaces real tokens for other users.\n\n## Measuring it\nSweep concurrency with speculation on and off. Plot TPOT and throughput.\n\n%%flow Typical outcome.\nLow load: spec on wins TPOT -> *Crossover around moderate load -> High load: spec off wins throughput\n%%\n\n## Adaptive approaches\n- Lower k or disable speculation when the running batch exceeds a threshold.\n- Choose k per step to maximize expected goodput given current batch and acceptance.\n- Use speculation only for latency-sensitive tenants.\n\n> Takeaway: speculation trades spare compute for latency. It shines at low load and needs to back off at high load; measure the crossover on your hardware.", "s": "At batch 1 decode is memory bound and the GPU has lots of idle compute, so verifying k extra tokens per sequence is almost free. At batch 128 decode is close to compute bound; each verified token costs real compute, and rejected draft tokens are wasted work that could have served other users. Throughput can drop even if per-request latency improves slightly."}, {"id": "16.05", "t": "N-Gram & Prompt-Lookup Speculation", "f": "https://fanout.sh/inference-eng/curriculum/16-05", "k": ["speculative"], "x": [], "r": [["Prompt Lookup Decoding", "https://github.com/apoorvumang/prompt-lookup-decoding", "The original prompt lookup method."], ["vLLM: Speculative decoding", "https://docs.vllm.ai/en/latest/features/spec_decode.html", "N-gram speculator configuration."]], "q": "Why does prompt-lookup (n-gram) speculation work well for code editing and summarization, and poorly for open-ended chat?", "n": ["N-gram speculation needs no draft model: it copies from existing text.", "Match the last n tokens against the prompt (or history); propose what followed.", "Nearly free to run; no extra GPU memory.", "Great when outputs repeat inputs: code edits, extraction, RAG answers, summaries.", "Weak for creative or novel text."], "ak": "", "a": "## How it works\n```\nsuffix = generated[-n:]\npos = find_last(prompt + generated[:-n], suffix)\ndraft = (prompt + generated)[pos + n : pos + n + k] if pos else []\n```\nThe target model verifies the draft as in any speculative scheme.\n\n## Where it shines\n| Task | Why it works |\n| Code editing | output copies large parts of the input file |\n| Extraction / RAG | answers quote documents |\n| Summaries with quotes | repeated phrases |\n| Rewriting / translation of structured text | shared tokens |\n\nSpeedups of 2 times or more are reported for such tasks.\n\n## Where it does not\nOpen-ended chat, creative writing and reasoning traces rarely repeat the prompt. Acceptance is low, but because drafting is free, the cost is mainly the wasted verification compute, which matters only at high load.\n\n## Tuning\n- `n` (match length): longer is more precise but matches less often.\n- `k` (draft length): longer for highly repetitive outputs.\n\n> Takeaway: n-gram speculation is free drafting by copying from the prompt. Turn it on where outputs reuse inputs; it costs almost nothing to try.", "s": "It drafts by finding the last few generated tokens elsewhere in the prompt and copying what followed. Code editing and summarization often reproduce long spans of the input, so drafts are frequently right. Open-ended chat produces new text not present in the prompt, so matches are rare and drafts are mostly rejected."}, {"id": "16.06", "t": "Medusa, EAGLE & Multi-Token Prediction", "f": "https://fanout.sh/inference-eng/curriculum/16-06", "k": ["speculative"], "x": [], "r": [["Medusa", "https://arxiv.org/abs/2401.10774", "Multiple decoding heads with tree verification."], ["EAGLE", "https://arxiv.org/abs/2401.15077", "Feature-level speculative drafting."], ["Better & Faster Large Language Models via Multi-token Prediction", "https://arxiv.org/abs/2404.19737", "Training models to predict several tokens."]], "q": "How do Medusa heads and EAGLE differ in what they use to predict future tokens?", "n": ["Learned drafters use the target's own hidden states instead of a separate model.", "Medusa: extra heads predict tokens at offsets +1..+k; verify a tree of candidates.", "EAGLE: a light autoregressive head over target features; higher acceptance.", "Multi-token prediction (MTP): the model is trained with heads for future tokens, usable as drafters.", "Tree attention verifies several candidate continuations in one pass."], "ak": "", "a": "## Why learned drafters\nA separate draft model costs memory and its own KV cache, and must share the tokenizer. Heads attached to the target reuse its hidden states, which already \"know\" a lot about what comes next.\n\n## Medusa\n- Add `k` small heads to the last hidden state. Head `i` predicts the token at position `t+i`.\n- Take top candidates from each head to build a tree of possible continuations.\n- Verify the whole tree in one target pass using a tree-shaped attention mask.\n- Heads predict independently, so acceptance drops quickly for later positions.\n\n## EAGLE\n- A small transformer layer predicts the next hidden feature from the current feature and the sampled token, autoregressively.\n- Feature-level prediction is easier than token-level, giving higher acceptance.\n- Later versions build dynamic draft trees based on confidence.\n\n## Multi-token prediction\nSome models are trained with extra heads that predict tokens several steps ahead. At inference those heads serve as a built-in drafter with high acceptance.\n\n| Method | Extra model | Training needed | Typical acceptance |\n| Draft model | yes | none (if a small sibling exists) | medium |\n| Medusa | heads | heads only | medium |\n| EAGLE | small head | head only | high |\n| MTP | built in | part of pre-training | high |\n\n> Takeaway: learned drafters reuse the target's hidden states. EAGLE-style and MTP drafters usually reach the highest acceptance per unit of cost.", "s": "Medusa adds several extra decoding heads on the target model's last hidden state, each predicting the token at a further offset (t+1, t+2, ...), and verifies candidate combinations with tree attention. EAGLE trains a small autoregressive head that operates at the feature level, taking the target's hidden states (plus the sampled tokens) to predict the next features and tokens, which gives higher acceptance than independent heads."}, {"id": "16.07", "t": "DFlash & Dynamic Speculation", "f": "https://fanout.sh/inference-eng/curriculum/16-07", "k": ["speculative"], "x": [], "r": [["Optimizing Speculative Decoding for Serving Large Language Models Using Goodput", "https://arxiv.org/abs/2406.14066", "Choosing speculation length under load."], ["Medusa", "https://arxiv.org/abs/2401.10774", "Parallel heads as a block drafter."], ["fanout.sh lesson 16.07 (summary only)", "https://fanout.sh/inference-eng/curriculum/16-07", "Outline of the original lesson; the full text is paid."]], "q": "What is the trade-off between a drafter that proposes positions one at a time and one that fills a whole block in a single pass, and how does dynamic draft length help?", "n": ["Drafting costs time too; a drafter that walks positions serially adds latency every round.", "Block drafters fill several positions in one pass to keep drafting cost flat.", "Conditioning the drafter on the target's hidden features improves block drafts.", "Draft length should be a runtime decision, based on confidence and load.", "Reported speedups depend heavily on the setting: batch size, temperature, task."], "ak": "", "a": "## Note on this lesson\nThe original fanout lesson on DFlash is paywalled, and I could not verify the details of the DFlash method itself. These notes cover the ideas its outline lists: the drafter's own cost, block drafting, conditioning on the target, and draft length as a decision.\n\n## The drafter's own loop\nA round's time is drafting time plus verification time. A sequential drafter runs `k` small passes. Even if each is cheap, `k` serial steps add up, especially when the target pass itself is fast.\n\n## Filling a block instead of walking it\nA block drafter predicts positions `t+1..t+k` in one pass, as Medusa's heads do. Drafting cost stops growing with `k`. The risk is that each position is predicted without knowing the guesses before it, so acceptance falls for later positions.\n\n## Conditioning from the target\nGiving the drafter the target's hidden states (as EAGLE does) supplies rich context for free, which narrows the accuracy gap of block drafting.\n\n## The setting behind the numbers\nSpeedup claims depend on batch size, temperature, task type and hardware. Low batch, greedy decoding and code tasks flatter every method. Compare methods in your own setting.\n\n## Draft length as a decision\n| Signal | Effect on k |\n| High drafter confidence | draft longer |\n| Recent low acceptance | draft shorter |\n| Large running batch | shorter or off |\n| Latency-critical request | longer |\n\n> Takeaway: speculation has two costs, drafting and verification. Block drafting caps the first; dynamic draft length manages the second.", "s": "A sequential drafter conditions each guess on the previous one, so later guesses are more accurate, but it adds k serial steps to every round. A block (parallel) drafter fills all k positions in one pass, so drafting latency is flat, but guesses are less coordinated and acceptance can drop for later positions. Dynamic speculation picks the draft length per step or per request from confidence and load, drafting long when guesses are likely accepted and the GPU has spare compute, short or not at all otherwise."}, {"id": "16.08", "t": "Lab: Map Where Speculative Decoding Wins", "f": "https://fanout.sh/inference-eng/curriculum/16-08", "k": ["lab"], "x": ["Lab"], "r": [["vLLM: Speculative decoding", "https://docs.vllm.ai/en/latest/features/spec_decode.html", "Configure methods."], ["EAGLE", "https://arxiv.org/abs/2401.15077", "One method to include."]], "q": "Which variables define the map of where speculation helps, and what is the output?", "n": ["Compare speculation methods against a no-speculation baseline.", "Vary concurrency (1, 8, 32, 128), task type and temperature.", "Record TPOT, throughput, acceptance rate and mean accepted length.", "Produce a heatmap of gains and losses.", "Write a policy: when to enable which method."], "ak": "", "a": "## Grid\n| Axis | Values |\n| Method | none, n-gram, draft model, EAGLE-style |\n| k | 2, 4, 8 |\n| Concurrency | 1, 8, 32, 128 |\n| Task | code edit, chat, RAG |\n| Temperature | 0, 0.8 |\n\nTrim the grid if time is short: fix k at the best value per method.\n\n## Measure\nFor each cell: TPOT p50, throughput, acceptance rate, mean accepted length.\n\n## Expected shape\n| | conc 1 | conc 32 | conc 128 |\n| n-gram, code | big win | win | small |\n| n-gram, chat | small | none | small loss |\n| EAGLE, chat | big win | win | near zero or loss |\n\n## Deliverable\nA heatmap per method and a one-paragraph policy, for example: \"Enable EAGLE with k = 4 below 32 concurrent requests; n-gram for code-edit endpoints at all loads; off otherwise.\"\n\n> Takeaway: speculation is workload and load dependent. A measured map turns it from a gamble into a policy.", "s": "Method (draft model, n-gram, EAGLE-style), draft length, concurrency, task type (code, chat, RAG) and temperature. The output is a table or heatmap of TPOT and throughput change versus no speculation for each cell, plus acceptance rates, and a recommendation of which method and k to use per workload and load level."}]}, {"n": "17", "name": "Compare Inference Engines", "lessons": [{"id": "17.01", "t": "Design a Fair Engine Comparison", "f": "https://fanout.sh/inference-eng/curriculum/17-01", "k": ["benchmarking", "engines"], "x": [], "r": [["GuideLLM", "https://github.com/vllm-project/guidellm", "Engine-agnostic benchmark client."], ["MLPerf Inference", "https://mlcommons.org/benchmarks/inference-datacenter/", "Example of strict comparison rules."]], "q": "Name four ways an engine comparison is commonly unfair.", "n": ["Fix model weights, precision, hardware and workload across engines.", "Use one external benchmark client for all engines.", "Tune each engine reasonably (equal effort), or compare defaults explicitly labeled.", "Report goodput under the same SLO, not one throughput number.", "Publish configs so others can reproduce."], "ak": "", "a": "## Hold constant\n- Model weights and revision, precision (BF16 or the same FP8 recipe).\n- Hardware, driver, GPU count and parallelism.\n- Workload file, output length control, arrival pattern.\n- SLO and measurement window.\n- Benchmark client.\n\n## Two valid comparison styles\n| Style | Use when | Rule |\n| Out of the box | choosing defaults | document that defaults differ |\n| Tuned | choosing for production | equal tuning effort; publish flags |\n\n## Report\n- Goodput vs request rate under the SLO for each engine.\n- TTFT and TPOT percentiles at the expected load.\n- Startup time and memory use.\n- Features that changed the result (prefix caching, speculation).\n\n## Red flags in others' comparisons\n- No workload details.\n- Throughput only, no latency.\n- One engine on newer hardware or a newer version.\n- Different quantization.\n\n> Takeaway: a fair comparison fixes everything except the engine and measures goodput with one client. Otherwise you are comparing configurations, not engines.", "s": "Different defaults (one has prefix caching or chunked prefill on, the other off); different precision or quantization; tuning one engine and not the other; different workloads or output lengths (EOS not ignored); different versions or hardware; and measuring with each engine's own benchmark tool, which may define metrics differently."}, {"id": "17.02", "t": "vLLM vs SGLang Architecture", "f": "https://fanout.sh/inference-eng/curriculum/17-02", "k": ["vllm", "sglang"], "x": [], "r": [["SGLang paper", "https://arxiv.org/abs/2312.07104", "RadixAttention and frontend language."], ["vLLM: Architecture overview", "https://docs.vllm.ai/en/latest/design/arch_overview.html", "vLLM's components."], ["SGLang documentation", "https://docs.sglang.ai/", "Engine features."]], "q": "Name two architectural ideas that distinguish SGLang from vLLM historically, and one area where both have converged.", "n": ["Both: continuous batching, paged KV, prefix caching, chunked prefill, OpenAI API.", "vLLM: PagedAttention origin, block hash prefix caching, broad model and hardware support.", "SGLang: RadixAttention tree cache, cache-aware scheduling, structured program frontend.", "Both have moved toward CPU-overhead reduction (overlapped scheduling, separate processes).", "Performance differences depend on workload and version; benchmark both."], "ak": "", "a": "## Shared foundation\n| Feature | vLLM | SGLang |\n| Continuous batching | yes | yes |\n| Paged KV | blocks + block tables | token-level pages + radix tree |\n| Prefix caching | hash-chained blocks | radix tree |\n| Chunked prefill | yes | yes |\n| Speculative decoding | yes | yes |\n| Structured output | yes | yes |\n| TP / PP / EP / DP | yes | yes |\n\n## Distinguishing ideas\n- **vLLM**: PagedAttention, a plugin-friendly architecture with wide model and hardware coverage, a redesigned engine core with an isolated scheduler loop.\n- **SGLang**: RadixAttention and longest-prefix-first scheduling; a frontend for multi-call programs that shares prefixes across calls; emphasis on overlapping CPU scheduling with GPU execution.\n\n## Practical differences\nThese change release to release. Typical points to check:\n- Model support for your architecture on day one.\n- Performance on your workload (prefix-heavy traffic, MoE models).\n- Operational fit: metrics, configuration, deployment tooling.\n\n> Takeaway: vLLM and SGLang share most core techniques and differ in prefix cache design, scheduler details and ecosystem. Choose by benchmark and fit, not reputation.", "s": "SGLang introduced RadixAttention, a radix-tree prefix cache with cache-aware scheduling, and a frontend language for structured LLM programs; it also emphasized a lightweight, overlap-friendly scheduler. vLLM introduced PagedAttention and a block-based KV manager with hash-based prefix caching. Both now support continuous batching, chunked prefill, prefix caching, speculative decoding, structured output and multi-GPU parallelism."}, {"id": "17.03", "t": "TensorRT-LLM & Hardware-Specific Optimization", "f": "https://fanout.sh/inference-eng/curriculum/17-03", "k": ["tensorrt-llm"], "x": [], "r": [["TensorRT-LLM GitHub repository", "https://github.com/NVIDIA/TensorRT-LLM", "Source and docs."], ["NVIDIA Triton Inference Server", "https://github.com/triton-inference-server/server", "Common serving layer for TensorRT-LLM."]], "q": "What does TensorRT-LLM trade for its performance, compared with vLLM or SGLang?", "n": ["TensorRT-LLM is NVIDIA's inference library with tuned kernels for its GPUs.", "Strengths: kernel quality, FP8/FP4, fused attention, in-flight batching, NVIDIA-specific features.", "Costs: NVIDIA lock-in, engine build or conversion steps, more configuration.", "Often served behind NVIDIA Triton Inference Server or its own server.", "Worth benchmarking for stable, high-volume NVIDIA deployments."], "ak": "", "a": "## What it is\nA library and runtime from NVIDIA that implements LLM inference with kernels tuned for each NVIDIA architecture. It includes in-flight (continuous) batching, paged KV, quantization recipes, speculative decoding and multi-GPU support.\n\n## Where it can win\n- Newest NVIDIA hardware features soon after release (FP4 on Blackwell, Hopper-specific kernels).\n- Highly tuned GEMM and attention kernels.\n- Integrated quantization tooling.\n\n## What you pay\n| Aspect | TensorRT-LLM | vLLM / SGLang |\n| Hardware | NVIDIA only | NVIDIA, AMD, others vary |\n| Setup | heavier; engine build or conversion | load weights directly |\n| Iteration speed | slower to change config | fast |\n| Model coverage | strong for popular models | very broad |\n\n## When to consider it\n- Stable model, high volume, NVIDIA fleet, where a few percent efficiency is worth engineering time.\n- Use your fair comparison method from 17.01.\n\n> Takeaway: TensorRT-LLM trades flexibility and portability for NVIDIA-specific performance. Benchmark it when volume justifies the extra setup.", "s": "It ties you more closely to NVIDIA hardware and its toolchain, can require building or converting engines for a specific model, precision and GPU (with longer build steps and less flexibility to change shapes), and has a steeper setup. In return it offers highly tuned kernels, strong FP8 and FP4 support and in-flight batching on NVIDIA GPUs."}, {"id": "17.04", "t": "llama.cpp & Edge-Oriented Runtimes", "f": "https://fanout.sh/inference-eng/curriculum/17-04", "k": ["llama.cpp", "edge"], "x": [], "r": [["llama.cpp GitHub repository", "https://github.com/ggml-org/llama.cpp", "Source, GGUF format and server."], ["MLX", "https://github.com/ml-explore/mlx", "Apple Silicon array framework with LLM examples."]], "q": "Why would you choose llama.cpp over vLLM, and when would you not?", "n": ["llama.cpp: C/C++ runtime for CPUs, Apple Silicon and consumer GPUs.", "GGUF format with many quantization levels (2 to 8 bits).", "Optimized for single-user, low-memory, dependency-light deployment.", "Has a server mode with basic batching, but not built for large-scale concurrency.", "Edge constraints: memory capacity and bandwidth, power, no datacenter interconnect."], "ak": "", "a": "## The edge setting\n| Constraint | Datacenter | Edge |\n| Memory | 80+ GB HBM per GPU | 8 to 128 GB shared RAM |\n| Bandwidth | 3+ TB/s | 50 to 800 GB/s |\n| Users | thousands | one or a few |\n| Goal | cost per token | latency, privacy, offline |\n\n## llama.cpp\n- Pure C/C++ with backends for CPU (with SIMD), Metal, CUDA, Vulkan and others.\n- GGUF model files with many quantization types, letting a 7B model run in 4 to 5 GB.\n- Memory-mapped weights for fast startup.\n- An OpenAI-compatible server for local use.\n\n## Same physics\nDecode is still bandwidth bound. On a laptop with 100 GB/s, a 4 GB quantized model gives at most about 25 tokens per second. Quantization is not optional at the edge; it is how models fit and run.\n\n## Other edge runtimes\nMLX for Apple Silicon, ONNX Runtime, mobile-specific runtimes. Choice depends on the device.\n\n> Takeaway: llama.cpp is the tool for local and edge inference, where memory is small and users are few. The bandwidth math is the same; only the numbers are smaller.", "s": "For local or edge deployment: laptops, phones, CPUs, Apple Silicon or small GPUs, single-user use, minimal dependencies, and aggressive quantization formats (GGUF k-quants). Not for high-concurrency datacenter serving, where vLLM or SGLang's batching, paged KV and multi-GPU support give far higher throughput."}, {"id": "17.05", "t": "Compare Scheduling, KV, Quantization & Kernels", "f": "https://fanout.sh/inference-eng/curriculum/17-05", "k": ["engines"], "x": [], "r": [["vLLM documentation", "https://docs.vllm.ai/en/latest/", "Feature references."], ["SGLang documentation", "https://docs.sglang.ai/", "Feature references."]], "q": "Pick one dimension where engines differ and describe how you would test whether that difference matters for your workload.", "n": ["Compare engines feature by feature: scheduler, KV management, prefix cache, quantization, kernels, parallelism.", "For each dimension, design a workload that isolates it.", "Control everything else so the difference is attributable.", "Features that do not touch your workload do not matter.", "Record the outcome in a feature matrix with your measurements."], "ak": "", "a": "## Dimensions\n| Dimension | Questions |\n| Scheduler | token budget, chunked prefill, priority, CPU overhead overlap |\n| KV management | block size, preemption mode, offload |\n| Prefix cache | hash blocks vs radix tree, scheduling around hits |\n| Quantization | formats supported, kernel quality at your batch sizes |\n| Attention kernels | backend options, long-context decode |\n| Speculation | methods, adaptive k |\n| Parallelism | TP, PP, EP, DP; disaggregation |\n| Structured output | grammar backends, overhead |\n\n## Isolation workloads\n- Prefix cache: shared vs unique prompts.\n- Scheduler overhead: many tiny requests at high rate.\n- Long context: 32k prompts, low concurrency.\n- Quantization: FP8 vs BF16 on each engine.\n\n## Interpreting\nA feature difference matters only if your production workload exercises it. If 90% of your traffic is short chat without shared prefixes, a prefix-cache advantage is irrelevant.\n\n> Takeaway: compare engines one dimension at a time with workloads that isolate each. Weight each result by how much your traffic depends on it.", "s": "Prefix caching: vLLM uses block-hash caching, SGLang a radix tree with cache-aware scheduling. Build a workload with realistic shared prefixes (multi-turn chat with system prompts), run both engines with identical settings under load, and compare hit rate, TTFT p95 and goodput. Then repeat with no shared prefixes to confirm the difference comes from caching."}, {"id": "17.06", "t": "Project: Build an Engine Selection Matrix", "f": "https://fanout.sh/inference-eng/curriculum/17-06", "k": ["project"], "x": ["Project"], "r": [["GuideLLM", "https://github.com/vllm-project/guidellm", "Benchmark client for the measurements."], ["vLLM benchmarks directory", "https://github.com/vllm-project/vllm/tree/main/benchmarks", "Alternative client."]], "q": "What columns and rows should an engine selection matrix have, and how do you turn it into a decision?", "n": ["List must-haves: model, hardware, features.", "Measure goodput on two or three representative workloads per engine.", "Add operational criteria: startup, observability, upgrades, community.", "Weight criteria and score.", "Write a decision record with the data and the next-best option."], "ak": "", "a": "## Matrix layout\n| Criterion | Weight | vLLM | SGLang | TensorRT-LLM |\n| Supports our model and GPU | must | | | |\n| Goodput, chat workload | 30% | | | |\n| Goodput, RAG workload | 20% | | | |\n| TTFT p95 at expected load | 15% | | | |\n| Startup time | 10% | | | |\n| Metrics and ops tooling | 15% | | | |\n| Team familiarity | 10% | | | |\n\n## Process\n1. Filter by must-haves.\n2. Benchmark the remaining engines fairly (17.01).\n3. Score each criterion 1 to 5.\n4. Weighted sum; sanity check the winner.\n5. Decision record: winner, scores, risks, when to revisit (new versions, new models).\n\n> Takeaway: an engine choice should be a documented, weighted decision based on your workloads. Revisit it when versions or models change.", "s": "Rows are candidate engines; columns are must-have requirements (model and hardware support, features), measured performance on your workloads (goodput under SLO, TTFT, TPOT), operational factors (startup time, metrics, deployment tooling, stability), and team factors (familiarity, ability to modify). Filter out engines failing must-haves, then weight the remaining columns by importance and pick the highest score, recording the reasoning."}]}, {"n": "18", "name": "Multi-GPU & Distributed Parallelism", "lessons": [{"id": "18.01", "t": "Why and When to Scale Beyond One GPU", "f": "https://fanout.sh/inference-eng/curriculum/18-01", "k": ["parallelism"], "x": [], "r": [["Megatron-LM", "https://arxiv.org/abs/1909.08053", "Tensor model parallelism."], ["vLLM: Parallelism and scaling", "https://docs.vllm.ai/en/latest/serving/parallelism_scaling.html", "Supported parallel modes."]], "q": "Give three distinct reasons to use more than one GPU for a model, and the parallelism each typically leads to.", "n": ["Reason 1: memory. Weights plus KV do not fit on one GPU.", "Reason 2: latency. Splitting each layer across GPUs speeds up each step.", "Reason 3: throughput. More replicas serve more traffic.", "Reason 4: context. Very long sequences need their KV and attention split.", "Prefer the simplest option: replicas if the model fits; tensor parallel within a node if not."], "ak": "", "a": "## Reasons to scale out\n| Reason | Example | Typical choice |\n| Model too big | 70B BF16 (140 GB) on 80 GB GPUs | tensor parallel 2 to 4 |\n| Need lower TPOT | 8B with very strict latency | tensor parallel 2 |\n| Need more throughput | 8B serving 10x more users | data parallel replicas |\n| Very long context | 1M tokens | context parallel |\n| MoE with many experts | large sparse model | expert parallel |\n\n## The cost\nEvery split adds communication. Tensor parallelism needs all-reduces every layer. Pipeline parallelism needs activations passed between stages. Communication over slow links can erase the gain.\n\n## Rule of thumb\n1. If the model and enough KV fit on one GPU, run replicas (data parallel).\n2. If not, use tensor parallelism inside one node over NVLink.\n3. Beyond one node, add pipeline parallelism across nodes, or expert parallelism for MoE.\n\n> Takeaway: scale out for memory, latency, throughput or context. Each reason points to a different parallelism, and each adds communication you must measure.", "s": "The model does not fit in one GPU's memory (tensor or pipeline parallelism); you need lower latency per token than one GPU can give, by spreading each layer's work (tensor parallelism); or you need more total throughput than one replica (data parallelism, i.e. more replicas). Very long contexts can also need context parallelism."}, {"id": "18.02", "t": "GPU Topology, PCIe, NVLink & NCCL", "f": "https://fanout.sh/inference-eng/curriculum/18-02", "k": ["interconnect", "nccl"], "x": [], "r": [["NCCL User Guide", "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/index.html", "Collectives, environment variables and debugging."], ["NVIDIA NVLink and NVSwitch", "https://www.nvidia.com/en-us/data-center/nvlink/", "Interconnect specs."]], "q": "How would you check how the GPUs in a node are connected, and why does it matter for tensor parallelism?", "n": ["GPUs talk over NVLink (fast, inside a node), PCIe (slower) or network (between nodes).", "nvidia-smi topo -m shows the link type between each GPU pair.", "NCCL implements collectives (all-reduce, all-gather, all-to-all) over the best available path.", "NVLink bandwidth is hundreds of GB/s per GPU; PCIe Gen5 x16 is about 64 GB/s per direction.", "Between nodes: InfiniBand or RoCE, often 400 Gb/s per GPU."], "ak": "", "a": "## Link types\n| Link | Typical bandwidth per GPU | Where |\n| NVLink (H100, via NVSwitch) | ~900 GB/s total | inside an HGX node |\n| PCIe Gen5 x16 | ~64 GB/s each way | consumer and PCIe servers |\n| InfiniBand / RoCE NDR | ~50 GB/s (400 Gb/s) | between nodes |\n\n## Check topology\n```\nnvidia-smi topo -m\n```\n`NV18` means 18 NVLink links; `PIX`/`PXB` means a PCIe switch; `SYS` means crossing CPU sockets (slowest).\n\n## NCCL\nNCCL picks rings or trees over the available links. Useful settings:\n- `NCCL_DEBUG=INFO`: logs the chosen transport and topology.\n- `NCCL_P2P_DISABLE`, `NCCL_IB_HCA`: control paths (use only when debugging).\n\nTest raw collective speed with `nccl-tests` (`all_reduce_perf`) before blaming the engine.\n\n## Why it matters\nAn all-reduce of a 4096-wide BF16 activation for batch 64 is 0.5 MB. Over NVLink it takes microseconds; over PCIe tens of microseconds; repeated twice per layer for 80 layers, that difference decides whether TP helps.\n\n> Takeaway: know your topology before choosing parallelism. NVLink makes tensor parallelism cheap; PCIe and network links make it expensive.", "s": "Run nvidia-smi topo -m, which shows for each GPU pair whether they connect through NVLink (NV#), a PCIe switch (PIX/PXB) or across CPU sockets (SYS). Tensor parallelism does all-reduces every layer, so it needs high bandwidth and low latency; over NVLink it scales well, over PCIe or across sockets the communication can dominate step time."}, {"id": "18.03", "t": "Tensor Parallelism", "f": "https://fanout.sh/inference-eng/curriculum/18-03", "k": ["tensor-parallel"], "x": [], "r": [["Megatron-LM", "https://arxiv.org/abs/1909.08053", "Column and row parallel layers."], ["vLLM: Parallelism and scaling", "https://docs.vllm.ai/en/latest/serving/parallelism_scaling.html", "Tensor parallel in practice."]], "q": "In Megatron-style tensor parallelism of an MLP, which matrix is split by columns, which by rows, and where is the all-reduce?", "n": ["Tensor parallelism splits each layer's weights across GPUs.", "Attention: split by heads; MLP: column-split up/gate, row-split down.", "Two all-reduces per layer (after attention and after MLP).", "Each GPU holds 1/TP of weights and of KV heads: more memory for KV, faster per-step reads.", "Works best inside a node over NVLink; limited by KV heads (TP should divide KV heads, or replicate them)."], "ak": "", "a": "## Splitting the MLP\n%%flow Tensor-parallel MLP on 2 GPUs.\nx (replicated) -> *Gate/Up column shards -> SiLU * up (local) -> Down row shards -> All-reduce -> output\n%%\n\nNo communication until the down projection, then one all-reduce.\n\n## Splitting attention\nEach GPU takes a subset of heads (Q heads and their KV heads), computes attention locally, applies its slice of the output projection, then all-reduce.\n\n## Benefits\n| Effect | Why |\n| Fits bigger models | weights divided by TP |\n| More KV capacity | each GPU stores only its heads' KV |\n| Lower TPOT | each GPU reads 1/TP of weights per step |\n\n## Costs\n- Two all-reduces per layer per step.\n- At TP 8 on a small model, communication can exceed compute.\n- KV heads limit TP: with 8 KV heads, TP above 8 must replicate KV heads.\n\n| TP | Weight read per GPU | Comm per step | Typical use |\n| 1 | 100% | none | fits on one GPU |\n| 2 | 50% | moderate | 30 to 70B, lower latency |\n| 4 | 25% | more | 70B BF16 |\n| 8 | 12.5% | high | 400B+ or MoE |\n\n> Takeaway: tensor parallelism splits each layer across GPUs with two all-reduces per layer. Great inside a node with NVLink; communication caps how far it scales.", "s": "The first matrices (gate and up projections) are split by columns, so each GPU computes part of the intermediate activations with no communication. The down projection is split by rows, so each GPU produces a partial sum of the full output. One all-reduce sums those partial outputs at the end of the MLP. Attention is split by heads in the same way, with one all-reduce after the output projection."}, {"id": "18.04", "t": "Collectives & Communication Overhead", "f": "https://fanout.sh/inference-eng/curriculum/18-04", "k": ["nccl", "communication"], "x": [], "r": [["NCCL User Guide", "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/index.html", "Collective algorithms."], ["nccl-tests", "https://github.com/NVIDIA/nccl-tests", "Measure collective bandwidth and latency."]], "q": "Estimate the all-reduce cost per decode step for a 80-layer model with hidden size 8192 at batch 32 with TP 4 over NVLink at 400 GB/s effective bus bandwidth.", "n": ["Collectives: all-reduce (TP), all-gather, reduce-scatter, all-to-all (MoE), send/recv (PP).", "Cost = latency per call + bytes / bandwidth.", "In decode, messages are small, so latency dominates.", "Overlap communication with compute where possible; use custom all-reduce kernels for small messages.", "Measure with nccl-tests and in profiles (NCCL kernels in Nsight Systems)."], "ak": "", "a": "## The collectives\n| Collective | What it does | Used by |\n| All-reduce | sum across GPUs, everyone gets result | tensor parallel |\n| All-gather | everyone gets everyone's piece | sequence/context parallel |\n| Reduce-scatter | sum, each keeps a slice | TP variants |\n| All-to-all | each sends distinct data to each | expert parallel |\n| Send / recv | point to point | pipeline parallel |\n\n## Cost model\n```\ntime = alpha + bytes_per_gpu / bandwidth\nring all-reduce bytes_per_gpu ~ 2 * (P-1)/P * message_size\n```\n`alpha` is per-call latency, often 5 to 20 microseconds.\n\n## Decode is latency bound\nDecode messages are small (batch x hidden x 2 bytes). With 160 all-reduces per step, latency adds up to milliseconds. Engines use custom all-reduce kernels for small messages over NVLink that cut latency well below generic NCCL calls.\n\n## Prefill is bandwidth bound\nPrefill messages are large (tokens x hidden). Bandwidth matters; overlapping communication with the next computation helps.\n\n## Measure\n- `all_reduce_perf` from nccl-tests across message sizes.\n- In Nsight Systems, NCCL kernel time per step.\n\n> Takeaway: communication costs latency per call plus bytes over bandwidth. Decode pays mostly latency, prefill mostly bandwidth; count calls per step.", "s": "Each all-reduce moves 32 x 8192 x 2 bytes = 512 KB. A ring all-reduce sends about 2 x (TP-1)/TP of the data per GPU, about 768 KB, taking roughly 2 microseconds at 400 GB/s plus around 10 to 20 microseconds of latency. Two per layer times 80 layers is 160 all-reduces, roughly 2 to 3.5 ms per step, mostly latency. That is significant against a 15 to 25 ms step."}, {"id": "18.05", "t": "Run and Benchmark Two-GPU Inference", "f": "https://fanout.sh/inference-eng/curriculum/18-05", "k": ["tensor-parallel", "lab"], "x": [], "r": [["vLLM: Parallelism and scaling", "https://docs.vllm.ai/en/latest/serving/parallelism_scaling.html", "Running with tensor-parallel-size."], ["nccl-tests", "https://github.com/NVIDIA/nccl-tests", "Baseline communication speed."]], "q": "You run an 8B model with TP 1 on one GPU and TP 2 on two GPUs. TPOT improves 1.5 times but throughput per GPU drops. Is that a bad result?", "n": ["Run the same model at TP 1 (one GPU, and two replicas) and TP 2.", "Compare TPOT at low load, max SLO-safe throughput, and throughput per GPU.", "Check topology and NCCL logs first.", "TP buys latency and memory; replicas buy throughput.", "Profile NCCL time per step at TP 2."], "ak": "", "a": "## Setup\n- Model that fits on one GPU (for example 8B BF16).\n- Config A: TP 1 on one GPU.\n- Config B: two independent TP-1 replicas behind a load balancer.\n- Config C: TP 2 on two GPUs.\n\n```\nvllm serve <model> --tensor-parallel-size 2\n```\n\n## Measure\n| Metric | A | B | C |\n| TPOT at concurrency 1 | | | |\n| SLO-safe req/s | | | |\n| Req/s per GPU | | | |\n| KV tokens | | | |\n| NCCL share of step | 0 | 0 | |\n\n## Expected pattern\n- C has the best TPOT and the most KV per replica.\n- B has the most total throughput for a model this size.\n- C's throughput per GPU is lower than A's because of communication.\n\n## Decide\nPick C when the SLO needs its latency or long contexts need its KV capacity; otherwise B.\n\n> Takeaway: for a model that fits on one GPU, TP trades throughput per GPU for latency and KV capacity. Measure both and let the SLO decide.", "s": "Not necessarily. TP 2 cuts per-step weight reads in half, so latency improves, but communication overhead means two GPUs give less than double the throughput of one. If your SLO needs the lower TPOT, TP 2 is right; if you only need throughput and TP 1 meets the SLO, two TP-1 replicas give more total throughput per GPU."}, {"id": "18.06", "t": "Pipeline Parallelism", "f": "https://fanout.sh/inference-eng/curriculum/18-06", "k": ["pipeline-parallel"], "x": [], "r": [["GPipe", "https://arxiv.org/abs/1811.06965", "Pipeline parallelism with micro-batches."], ["vLLM: Parallelism and scaling", "https://docs.vllm.ai/en/latest/serving/parallelism_scaling.html", "pipeline-parallel-size."]], "q": "Why does pipeline parallelism add little communication but can hurt latency, and how do engines keep all stages busy?", "n": ["Pipeline parallelism splits the model by layers into stages on different GPUs.", "Communication: activations between stages once per step, small and point to point.", "Good across nodes where links are slow.", "Bubbles: stages idle unless multiple micro-batches are in flight.", "Does not reduce per-token latency; mainly a way to fit large models."], "ak": "", "a": "## How it works\n%%flow Two-stage pipeline.\nTokens -> *Stage 1: layers 1-40 (GPU 0) -(activations)-> Stage 2: layers 41-80 (GPU 1) -> Logits\n%%\n\n## Communication\nOnly the hidden states of in-flight tokens cross between stages, once per step. Far less than TP's all-reduces every layer. That makes PP suitable over InfiniBand between nodes.\n\n## Bubbles\nWith one batch, stage 2 waits while stage 1 works, and vice versa. Engines run several micro-batches (virtual engines) so each stage always has work.\n\n| Micro-batches in flight | Stage utilization |\n| 1 | ~1/P |\n| P | high |\n\n## When to use\n- Model too large for one node's GPUs with TP.\n- Combine: TP inside nodes, PP across nodes (for example TP 8 x PP 2 for a very large model on two nodes).\n\n## Downsides\n- Per-request latency does not improve.\n- Load balance between stages matters: uneven layer splits leave GPUs idle.\n\n> Takeaway: pipeline parallelism splits layers into stages with little communication. Use it to span nodes; keep stages busy with multiple micro-batches.", "s": "Each stage holds a contiguous set of layers and only sends the activations of the tokens in flight to the next stage once per step, which is small. But a single request must pass through all stages sequentially, so per-token latency does not improve and adds transfer hops. Engines keep stages busy by having several micro-batches in flight, so while stage 2 processes batch A, stage 1 processes batch B."}, {"id": "18.07", "t": "Data Parallelism", "f": "https://fanout.sh/inference-eng/curriculum/18-07", "k": ["data-parallel"], "x": [], "r": [["vLLM: Data parallel deployment", "https://docs.vllm.ai/en/latest/serving/data_parallel_deployment.html", "DP in vLLM including with EP."], ["DeepSeek-V3 Technical Report", "https://arxiv.org/abs/2412.19437", "DP attention with EP experts at scale."]], "q": "For serving, what is data parallelism and when is it combined with expert parallelism?", "n": ["Data parallelism in serving: independent replicas, each with full weights.", "No per-step communication; scales throughput linearly if routing is balanced.", "Needs a router to spread requests (and ideally preserve cache locality).", "For MoE: data-parallel attention plus expert-parallel MLPs is a common design.", "Simplest and most efficient option when the model fits per replica."], "ak": "", "a": "## Plain replicas\nEach replica (one GPU or a TP group) holds the full model and serves its own requests. Adding replicas adds throughput almost linearly. No inter-replica communication during steps.\n\n## Routing matters\nA load balancer chooses a replica per request. Least-loaded routing keeps queues even; prefix-aware routing keeps cache hits high (Module 23).\n\n## DP inside one engine\nSome engines run several DP ranks as one service, coordinating them (for example to keep all ranks stepping together when combined with EP).\n\n## DP attention + EP for MoE\n%%flow MoE with DP attention and EP experts.\nRequests split across DP ranks -> *Attention local per rank (own KV) -> All-to-all dispatch -> Experts spread over all GPUs -> All-to-all combine\n%%\n\nAttention weights are small in big MoE models, so replicating them is cheap, and each rank's KV stays local. Experts are huge, so they are sharded.\n\n> Takeaway: data parallelism is replicas: simplest, near-linear throughput. For MoE, pair data-parallel attention with expert-parallel experts.", "s": "In serving, data parallelism means running several full replicas of the model, each handling different requests, with no communication between them during a step. For large MoE models, attention can be data parallel (each replica holds its own KV and requests) while the expert layers are spread across all GPUs with expert parallelism, so a DP group shares the experts through all-to-all communication."}, {"id": "18.08", "t": "Context Parallelism", "f": "https://fanout.sh/inference-eng/curriculum/18-08", "k": ["context-parallel", "long-context"], "x": [], "r": [["Ring Attention with Blockwise Transformers", "https://arxiv.org/abs/2310.01889", "Ring attention."], ["Striped Attention", "https://arxiv.org/abs/2311.09431", "Load-balanced ring attention for causal masks."]], "q": "How does ring attention let several GPUs process one very long prompt, and what does each GPU store?", "n": ["Context parallelism splits one sequence across GPUs along its length.", "Each GPU stores the KV of its chunk; total KV capacity scales with GPUs.", "Ring attention rotates KV blocks between GPUs and overlaps transfer with compute.", "Causal masks make naive splits unbalanced; striped or zig-zag layouts fix it.", "Mainly for long-context prefill; decode with CP needs partial results gathered."], "ak": "", "a": "## The problem\nA 1M-token prompt needs enormous KV memory and quadratic attention compute. One GPU cannot hold it or process it quickly.\n\n## Splitting the sequence\nGive each of P GPUs a contiguous chunk (or a striped set) of tokens. Linear layers run locally on each chunk. Attention needs all keys for each query.\n\n## Ring attention\n%%flow One round of ring attention on 4 GPUs.\nGPU0 holds KV0 -> computes Q0 x KV0, sends KV0 to GPU1 -> *receives KV3 -> computes Q0 x KV3 -> ... after 4 rounds, done\n%%\n\nTransfers overlap with computation, so with enough compute per block, communication is hidden.\n\n## Load balance\nWith a causal mask, the first chunk attends to little and the last to everything. Striped or zig-zag token assignment gives each GPU an even mix of early and late tokens.\n\n## In serving\n- Prefill of very long prompts: CP shortens TTFT and spreads KV.\n- Decode: the new token's query attends to KV spread across GPUs; each computes a partial result and they combine with log-sum-exp.\n\n> Takeaway: context parallelism splits a single long sequence across GPUs. Ring-style KV passing with online softmax keeps it exact and overlaps communication.", "s": "The sequence is split into chunks, one per GPU; each GPU holds Q, K and V for its chunk. GPUs pass K and V blocks around a ring; at each step every GPU computes attention between its queries and the KV block it currently holds, accumulating with online softmax, while sending that block on. After P steps every query has seen all keys. Each GPU stores only its chunk's KV plus one block in transit."}, {"id": "18.09", "t": "Lab: Choose and Benchmark a Parallelism Strategy", "f": "https://fanout.sh/inference-eng/curriculum/18-09", "k": ["lab"], "x": ["Lab"], "r": [["vLLM: Parallelism and scaling", "https://docs.vllm.ai/en/latest/serving/parallelism_scaling.html", "Configuring TP, PP and DP."], ["nccl-tests", "https://github.com/NVIDIA/nccl-tests", "Communication baselines."]], "q": "For a 70B model on one 8-GPU H100 node serving chat traffic, which configurations would you test and how do you choose?", "n": ["List configurations that fit: TP x replicas (x PP across nodes).", "For each, measure node-level goodput under the SLO and TPOT at low load.", "Check memory: weights per GPU and KV capacity per replica.", "Profile communication share per step.", "Choose by goodput per node within the SLO."], "ak": "", "a": "## Candidate configurations (70B, 8 x 80 GB)\n| Config | Replicas | Weights per GPU (BF16) | KV per replica |\n| TP 8 | 1 | 17.5 GB | large |\n| TP 4 | 2 | 35 GB | medium |\n| TP 2, FP8 weights | 4 | 35 GB | smaller |\n\n## Measurements\n- Node goodput at the SLO (sum across replicas).\n- TPOT p50 at concurrency 1.\n- Max concurrency per replica before KV pressure.\n- NCCL share of step time.\n\n## Typical outcome\n| Config | TPOT low load | Node goodput |\n| TP 8 | best | lowest |\n| TP 4 x 2 | good | higher |\n| TP 2 x 4 (FP8) | ok | often highest if quality allows |\n\n## Write-up\nRecommend a configuration, show the goodput and TPOT charts, and state when you would switch (stricter TPOT SLO pushes toward higher TP).\n\n> Takeaway: for a fixed node, more replicas usually mean more throughput and higher TP means lower latency. Measure node goodput and pick the most replicas the SLO allows.", "s": "TP 8 as one replica, TP 4 x 2 replicas, and TP 2 x 4 replicas if weights in FP8 fit (70 GB over 2 GPUs leaves some KV room). Measure SLO-safe goodput for the node, TPOT at low load, and KV capacity per replica. Choose the configuration with the highest node goodput that meets the TPOT SLO."}]}, {"n": "19", "name": "Mixture-of-Experts Inference", "lessons": [{"id": "19.01", "t": "How MoE Inference Differs From Dense Models", "f": "https://fanout.sh/inference-eng/curriculum/19-01", "k": ["moe"], "x": [], "r": [["Mixtral of Experts", "https://arxiv.org/abs/2401.04088", "A widely used MoE architecture."], ["Switch Transformers", "https://arxiv.org/abs/2101.03961", "Sparse expert routing at scale."]], "q": "A MoE model has 235B total parameters and 22B active per token. What does each number mean for memory and for decode speed?", "n": ["MoE layers replace the dense MLP with many expert MLPs and a router.", "Each token uses only top-k experts: compute scales with active parameters.", "Memory scales with total parameters: all experts must be resident.", "At large batch, most experts get some tokens each step, so most expert weights are read.", "MoE shifts the bottleneck from compute toward memory capacity and communication."], "ak": "", "a": "## The architecture\n%%flow An MoE layer.\nToken hidden state -> *Router (top-k) -> Selected experts (MLPs) -> Weighted sum -> Output\n%%\n\nAttention stays dense. The MLP becomes N experts (for example 64 to 256), and each token goes to k of them (often 2 to 8), plus sometimes a shared expert.\n\n## Two parameter counts\n| Count | Determines |\n| Total parameters | memory, number of GPUs |\n| Active parameters | FLOPs per token |\n\n## Decode behavior\n- Batch 1: only k experts per layer are read: fast for the model's size.\n- Large batch: tokens spread over experts, so nearly all experts are read each step. Weight bandwidth looks like the full model, but each expert sees only a fraction of the batch: small, inefficient matmuls.\n\n## What changes for inference engineers\n- Memory capacity, not compute, often sets the GPU count.\n- Expert placement and communication (all-to-all) become central.\n- Load balance across experts affects step time.\n- Grouped GEMM kernels are needed to run many small expert matmuls efficiently.\n\n> Takeaway: MoE decouples compute (active parameters) from memory (total parameters). Serving it well is about memory, expert placement and communication.", "s": "All 235B parameters must be stored (470 GB in BF16), so memory and GPU count are set by the total. Each token only uses about 22B parameters, so compute per token is like a 22B dense model. At small batch decode, only the selected experts' weights are read, so bandwidth cost per token is also near 22B; at large batch, different tokens select different experts, so most experts are read every step."}, {"id": "19.02", "t": "Token Routing & Expert Activation", "f": "https://fanout.sh/inference-eng/curriculum/19-02", "k": ["moe", "routing"], "x": [], "r": [["Mixtral of Experts", "https://arxiv.org/abs/2401.04088", "Top-2 routing."], ["DeepSeek-V3 Technical Report", "https://arxiv.org/abs/2412.19437", "Fine-grained experts, shared experts and auxiliary-loss-free balancing."]], "q": "Describe top-k routing for one token, and what \"expert activation statistics\" you would collect during serving.", "n": ["The router is a small linear layer producing one score per expert.", "Top-k selection picks experts; their outputs are combined with normalized weights.", "Some models add shared experts that every token uses.", "Expert usage is uneven and depends on the input domain.", "Log per-expert token counts per layer to understand load."], "ak": "", "a": "## Routing for one token\n```\nscores = h @ W_router            # [num_experts]\ntopk_vals, topk_idx = scores.topk(k)\nweights = softmax(topk_vals)     # or normalize sigmoid scores\nout = sum(w * expert[i](h) for w, i in zip(weights, topk_idx))\n```\n\n## For a batch\nThe engine groups tokens by expert: a permutation that sorts tokens so each expert's tokens are contiguous, runs each expert on its group, then un-permutes and combines.\n\n%%flow Batch routing.\nTokens -> Router -> *Permute by expert -> Expert GEMMs -> Unpermute and combine\n%%\n\n## Activation statistics\n| Statistic | Why |\n| Tokens per expert per step | load balance, step time |\n| Max / mean ratio | imbalance severity |\n| Distribution by workload (code vs chat) | placement decisions |\n| Stability over time | whether static placement works |\n\nTraining adds balancing losses, but serving traffic still shows uneven usage, especially for domain-specific inputs.\n\n> Takeaway: routing sends each token to a few experts and groups tokens by expert for compute. Measure how tokens spread over experts; it drives placement and step time.", "s": "The router computes a score per expert from the token's hidden state (a small linear layer), applies softmax (or sigmoid), picks the top-k experts, and normalizes their weights; the token's MLP output is the weighted sum of those experts' outputs. Collect per-layer counts of tokens routed to each expert per step and over time, to see load balance, hot experts, and how activation depends on the workload."}, {"id": "19.03", "t": "Expert Parallelism & Expert Placement", "f": "https://fanout.sh/inference-eng/curriculum/19-03", "k": ["moe", "expert-parallel"], "x": [], "r": [["DeepSeek-V3 Technical Report", "https://arxiv.org/abs/2412.19437", "Expert parallelism at large scale."], ["vLLM: Expert parallel deployment", "https://docs.vllm.ai/en/latest/serving/expert_parallel_deployment.html", "EP configuration."]], "q": "With 256 experts per layer over 32 GPUs, how does expert parallelism work, and what does placement decide?", "n": ["Expert parallelism (EP) places different experts on different GPUs.", "Tokens travel to their experts via all-to-all, and back.", "Each GPU stores a fraction of experts, so huge MoE models fit.", "Placement affects balance and traffic; hot experts can be replicated.", "EP is usually combined with DP attention or TP attention."], "ak": "", "a": "## How EP runs a layer\n%%seq One MoE layer with EP.\nGPU A > GPU A : route tokens\nGPU A > GPU B : all-to-all dispatch tokens for B's experts\nGPU B > GPU B : run local experts\nGPU B > GPU A : all-to-all combine results\n%%\n\n## Memory\n256 experts per layer across 32 GPUs gives 8 experts per GPU per layer. A model with 600B+ parameters fits when no single GPU could hold its experts.\n\n## Placement choices\n| Strategy | Effect |\n| Round robin | simple; ignores load |\n| Spread hot experts | balances compute |\n| Replicate hot experts | balances load, costs memory |\n| Group co-activated experts | fewer GPUs per token, less traffic |\n\n## Comparing with TP for MoE\nTP splits every expert across GPUs: each expert's matmul becomes tiny, and all-reduces happen every layer. EP keeps experts whole, giving bigger per-expert matmuls, but needs all-to-all. Large MoE deployments favor EP; small MoE models can use TP.\n\n> Takeaway: expert parallelism spreads whole experts across GPUs and moves tokens to them. Placement decides balance and traffic.", "s": "Each GPU holds 8 experts per layer. After routing, tokens are sent with all-to-all to the GPUs holding their chosen experts, computed there, and sent back with another all-to-all. Placement decides which experts live on which GPU: grouping often co-activated experts, spreading hot experts, or replicating popular ones changes communication volume and load balance."}, {"id": "19.04", "t": "Load Imbalance & Hot Experts", "f": "https://fanout.sh/inference-eng/curriculum/19-04", "k": ["moe"], "x": [], "r": [["DeepSeek-V3 Technical Report", "https://arxiv.org/abs/2412.19437", "Redundant experts for load balancing at inference."], ["Switch Transformers", "https://arxiv.org/abs/2101.03961", "Capacity factor and token dropping."]], "q": "Why does one hot expert slow down the whole MoE layer under expert parallelism, and name two mitigations.", "n": ["Step time per layer is set by the most loaded GPU.", "Expert usage is skewed and varies with traffic.", "Replicating hot experts spreads their load.", "Dynamic rebalancing uses recent statistics to move or replicate experts.", "Capacity limits (dropping overflow tokens) trade quality for balance; avoid in serving if possible."], "ak": "", "a": "## Why imbalance hurts\n%%flow Imbalanced EP layer.\nGPU 1: 120 tokens -> *GPU 2: 900 tokens (hot expert) -> GPU 3: 140 tokens -> All wait for GPU 2\n%%\n\nThe layer is as slow as its busiest GPU. With 3 to 5 times imbalance, most GPUs idle much of the layer.\n\n## Measuring\n- Tokens per GPU per layer per step; max / mean.\n- GPU idle time inside MoE layers in a profile.\n\n## Mitigations\n| Method | Cost |\n| Replicate hot experts (redundant experts) | extra memory |\n| Periodic rebalancing of placement | migration work, statistics collection |\n| Larger batches | imbalance averages out somewhat |\n| Capacity factor / token dropping | quality loss |\n\n## In practice\nProduction MoE systems collect expert load statistics continuously and rebalance on an interval, replicating the hottest experts onto spare slots.\n\n> Takeaway: in expert parallelism the hottest GPU sets the pace. Measure load per GPU and replicate or rebalance hot experts.", "s": "All GPUs must finish their experts before the combine all-to-all completes and the next layer starts, so the GPU with the most tokens sets the layer time; others wait idle. Mitigations: replicate hot experts on more GPUs and split their tokens (as in redundant-expert schemes), and rebalance placement periodically from observed statistics; capacity limits that drop or reroute overflow tokens also exist but can affect quality."}, {"id": "19.05", "t": "All-to-All Communication & Grouped GEMM", "f": "https://fanout.sh/inference-eng/curriculum/19-05", "k": ["moe", "kernels"], "x": [], "r": [["DeepEP", "https://github.com/deepseek-ai/DeepEP", "Efficient expert-parallel communication library."], ["MegaBlocks", "https://arxiv.org/abs/2211.15841", "Block-sparse kernels for MoE."]], "q": "Why does MoE need grouped GEMM kernels, and why is all-to-all latency critical for decode?", "n": ["All-to-all dispatches tokens to experts and combines results: twice per MoE layer.", "Prefill: large messages, bandwidth bound. Decode: small messages, latency bound.", "Specialized libraries offer high-throughput (prefill) and low-latency (decode) all-to-all modes.", "Grouped GEMM runs many variable-size expert matmuls in one kernel.", "Overlap communication with computation (e.g. split batches) to hide it."], "ak": "", "a": "## Communication\n| Phase | Message size | Bound by | Approach |\n| Prefill | large | bandwidth | high-throughput kernels, NVLink + RDMA |\n| Decode | small | latency | low-latency kernels, fewer hops |\n\nLibraries like DeepEP provide both modes and integrate with engines.\n\n## Overlap\nSplit the batch into two micro-batches: while one is in all-to-all, the other runs attention or experts. This hides a large part of communication time.\n\n## Grouped GEMM\n```\nfor each expert e: Y_e = X_e @ W_e     # many small, variable-size GEMMs\n```\nOne kernel launch handles all groups, assigning tiles to experts according to their token counts. Benefits: one launch, better SM utilization, fused permutation in some implementations.\n\n## Decode efficiency\nAt small batch each expert sees few tokens: GEMMs are tiny and memory bound. Expert weights are read for little work. Larger EP batches (via DP attention aggregating many requests) improve this.\n\n> Takeaway: MoE serving depends on two kernels besides attention: all-to-all and grouped GEMM. Decode needs low-latency communication; prefill needs bandwidth.", "s": "Each expert gets a different, often small, number of tokens; launching one GEMM per expert wastes time and underuses the GPU. A grouped GEMM runs all experts' matmuls in one kernel with per-group sizes. In decode, few tokens per step means small messages, so all-to-all time is dominated by latency, and with two all-to-alls per MoE layer over dozens of layers it can rival compute time; low-latency all-to-all kernels and overlapping with compute are needed."}, {"id": "19.06", "t": "Lab: Profile and Optimize an MoE Workload", "f": "https://fanout.sh/inference-eng/curriculum/19-06", "k": ["lab"], "x": ["Lab"], "r": [["vLLM: Expert parallel deployment", "https://docs.vllm.ai/en/latest/serving/expert_parallel_deployment.html", "EP options."], ["Mixtral of Experts", "https://arxiv.org/abs/2401.04088", "A model to test with."]], "q": "What would you measure in an MoE profile to decide between more TP and more EP?", "n": ["Serve an MoE model under TP and under EP (if available) on the same GPUs.", "Profile step time split: attention, experts, communication.", "Collect expert load statistics and imbalance.", "Measure goodput and TPOT for each configuration.", "Try one optimization: hot expert replication, batch size or backend."], "ak": "", "a": "## Steps\n1. Choose a MoE model that fits your GPUs (a Mixtral-class or smaller recent MoE).\n2. Run config A: TP across all GPUs. Config B: EP for experts (with DP or TP attention).\n3. Benchmark a chat workload with your harness.\n4. Profile a steady-state step in each.\n\n## Profile table\n| Component | Config A (TP) | Config B (EP) |\n| Attention | | |\n| Expert GEMMs | | |\n| All-reduce | | |\n| All-to-all | | |\n| Idle (imbalance) | | |\n\n## Optimization\nPick one: increase max batch to enlarge per-expert GEMMs; enable an optimized MoE kernel or communication backend; or replicate the hottest experts if supported. Measure goodput before and after.\n\n## Report\nRecommend TP or EP for this model and GPU count, backed by the profile and goodput numbers.\n\n> Takeaway: MoE performance is a balance of attention, small expert GEMMs and communication. Profile all three before choosing a parallel layout.", "s": "The share of step time in MoE layers versus attention; per-expert GEMM sizes and efficiency; all-to-all (EP) versus all-reduce (TP) time; load imbalance across GPUs; and KV capacity per replica. If expert GEMMs are tiny and all-reduce heavy under TP, EP with larger per-expert batches may win; if all-to-all latency dominates at small scale, TP may be better."}]}, {"n": "20", "name": "Long-Context & Tiered KV Systems", "lessons": [{"id": "20.01", "t": "Measure Long-Context Scaling", "f": "https://fanout.sh/inference-eng/curriculum/20-01", "k": ["long-context"], "x": [], "r": [["Lost in the Middle", "https://arxiv.org/abs/2307.03172", "Quality behavior over long contexts."], ["kipply: Transformer Inference Arithmetic", "https://kipp.ly/transformer-inference-arithmetic/", "KV and attention scaling."]], "q": "Describe how TTFT, TPOT and max concurrency change as context goes from 4k to 128k tokens on one GPU.", "n": ["Long context hurts all three: TTFT, TPOT and concurrency.", "Prefill attention grows with length squared; linear parts grow linearly.", "Decode attention reads all KV: TPOT grows with context.", "KV per sequence grows linearly: concurrency shrinks.", "Measure a sweep of context lengths before designing a long-context service."], "ak": "", "a": "## Sweep\nContext lengths 4k, 16k, 32k, 64k, 128k. For each: TTFT (one request), TPOT (one request, long output), and max concurrency before KV exhaustion.\n\n## Typical shape (8B, one large GPU, illustrative)\n| Context | TTFT | TPOT | Max sequences in KV |\n| 4k | 0.2 s | 7 ms | ~100 |\n| 32k | 2.5 s | 10 ms | ~12 |\n| 128k | 20+ s | 20 ms | ~3 |\n\n## Where time goes at long context\n- Prefill: attention becomes the majority of FLOPs beyond a few tens of thousands of tokens.\n- Decode: KV bytes per step exceed weight bytes once context x batch is large.\n\n## Quality check\nLong-context accuracy can degrade (information in the middle of long contexts is used less well). Test retrieval and QA at the lengths you serve.\n\n> Takeaway: long context raises TTFT super-linearly, TPOT linearly and cuts concurrency proportionally. Measure all three and plan around KV memory.", "s": "TTFT grows faster than linearly because attention prefill cost grows with length squared, so 128k can take tens of seconds. TPOT grows roughly linearly with context because each decode step reads the whole KV cache, which eventually outweighs weights. Max concurrency falls inversely with context: 32 times longer context means about 32 times fewer sequences fit."}, {"id": "20.02", "t": "Long-Context Prefill & Attention Bottlenecks", "f": "https://fanout.sh/inference-eng/curriculum/20-02", "k": ["long-context", "prefill"], "x": [], "r": [["FlashAttention-3", "https://arxiv.org/abs/2407.08608", "Fast attention for long sequences."], ["Ring Attention", "https://arxiv.org/abs/2310.01889", "Splitting long sequences across GPUs."]], "q": "For a 128k-token prompt, roughly what fraction of prefill FLOPs is attention for an 8B model with 32 layers and hidden size 4096?", "n": ["At long lengths, attention dominates prefill FLOPs.", "Prefill of very long prompts can take tens of seconds on one GPU.", "Chunked prefill keeps other users' decode flowing but does not cut total work.", "Options: faster attention kernels, FP8 attention, context parallelism, prefix caching for repeated documents.", "Sparse or sliding-window attention models reduce cost by design."], "ak": "", "a": "## The arithmetic\n- Linear layers: `2 x params x tokens`.\n- Causal attention: about `2 x layers x tokens^2 x d_model` (QK^T and PV, halved by the mask).\n\n| Prompt | Linear FLOPs | Attention FLOPs | Attention share |\n| 8k | 1.3e14 | 1.7e13 | ~12% |\n| 32k | 5.1e14 | 2.7e14 | ~35% |\n| 128k | 2.0e15 | 4.4e15 | ~68% |\n\n## Consequences\n- TTFT grows quickly past 32k.\n- Long prefills monopolize GPU time; chunked prefill spreads them out but the total stays.\n- Prefix caching is especially valuable: a cached 100k-token document saves seconds.\n\n## Options\n| Option | Effect |\n| FlashAttention-3 / FP8 attention | faster kernels |\n| Context parallelism | split across GPUs, shorter TTFT |\n| Prefix caching / KV reuse | skip repeated prefill |\n| Sliding-window or sparse models | less attention by design |\n\n> Takeaway: past a few tens of thousands of tokens, attention dominates prefill. Speed it up with better kernels and more GPUs, or avoid it with caching.", "s": "Linear layers cost about 2 x 8B x 128k, about 2e15 FLOPs. Attention scores and weighted sum cost about 4 x layers x seq^2 x hidden / 2 for causal, roughly 2 x 32 x (128k)^2 x 4096, about 4.4e15 FLOPs. So attention is around two thirds of prefill FLOPs at this length."}, {"id": "20.03", "t": "KV Quantization & Context-Saving Techniques", "f": "https://fanout.sh/inference-eng/curriculum/20-03", "k": ["long-context", "kv-cache"], "x": [], "r": [["StreamingLLM (attention sinks)", "https://arxiv.org/abs/2309.17453", "Keeping initial tokens for stable streaming."], ["H2O: Heavy-Hitter Oracle", "https://arxiv.org/abs/2306.14048", "Evicting low-importance KV."], ["DeepSeek-V2 (MLA)", "https://arxiv.org/abs/2405.04434", "Multi-head latent attention compresses KV."]], "q": "Compare FP8 KV, sliding-window attention and KV eviction (like H2O or StreamingLLM) as ways to fit long contexts.", "n": ["Lossless or near lossless: FP8 KV, architectures with GQA or MLA.", "Architectural limits: sliding-window or local attention layers.", "Lossy runtime methods: evict or compress tokens by importance.", "MLA stores a compressed latent per token instead of full K and V.", "Evaluate on tasks needing details from far back in the context."], "ak": "", "a": "## Techniques\n| Technique | Memory saving | Quality risk | Needs |\n| FP8 KV | 2x | small | kernel support |\n| INT4 / 2-bit KV | 4 to 8x | moderate | special kernels |\n| GQA / MQA | 4 to 32x vs MHA | built into model | model choice |\n| MLA | large | built into model | model choice |\n| Sliding window layers | bounded | built into model | model choice |\n| Eviction (H2O, sinks) | configurable | can lose details | engine support |\n\n## MLA\nMulti-head latent attention projects K and V into a small latent vector per token, stored in the cache, and reconstructs per-head K and V (or absorbs the projection into the query) at attention time. Cache per token is much smaller than GQA.\n\n## Eviction methods\nKeep the first few tokens (attention sinks), the most recent window, and tokens with high accumulated attention. Drop the rest. Good for streaming chat; risky for retrieval over long documents.\n\n> Takeaway: prefer lossless savings (FP8 KV, efficient architectures) first. Lossy eviction can fit more but must be tested on tasks that need distant details.", "s": "FP8 KV halves memory with little quality loss and keeps all tokens. Sliding-window attention (a model architecture choice) keeps only the last W tokens' KV for some or all layers, bounding memory, but only works if the model was trained that way. KV eviction methods drop tokens judged unimportant (keeping attention sinks and heavy hitters) to fit a budget; they work with existing models but are lossy and can miss details needed later."}, {"id": "20.04", "t": "CPU, SSD & Remote KV Offload", "f": "https://fanout.sh/inference-eng/curriculum/20-04", "k": ["kv-offload"], "x": [], "r": [["LMCache", "https://github.com/LMCache/LMCache", "KV cache offload and sharing layer for engines."], ["Mooncake", "https://arxiv.org/abs/2407.00079", "KV cache pooled across CPU memory and SSD."]], "q": "When does offloading KV to CPU memory make sense, and what limits it?", "n": ["GPU HBM is small; CPU RAM is 5 to 20 times larger; SSD larger still.", "Offload KV that may be reused: past turns, popular documents, preempted requests.", "Reloading must beat recomputation: compare transfer time with prefill time.", "Bandwidth: PCIe Gen5 ~50 GB/s per GPU; NVLink-C2C on Grace systems much higher; SSD ~5 to 10 GB/s per drive.", "Remote KV stores share caches across replicas over the network."], "ak": "", "a": "## The tiers\n| Tier | Capacity (per GPU, rough) | Bandwidth to GPU |\n| HBM | 80 to 190 GB | ~3 to 8 TB/s |\n| CPU DRAM | 0.5 to 2 TB per node | ~50 GB/s (PCIe Gen5) |\n| Local NVMe SSD | several TB | ~5 to 25 GB/s |\n| Remote store | large | network bound |\n\n## Reload vs recompute\n```\nreload_time = kv_bytes / link_bandwidth\nrecompute_time ~ prefill time for that prefix\n```\n! Example: 32k-token prefix on an 8B model\n! KV = 32k x 128 KB = 4 GB. Over PCIe at 50 GB/s: ~80 ms.\n! Recompute prefill for 32k tokens: ~2 to 3 s. Reloading wins by a wide margin.\n\nFor short prefixes, recompute may win since prefill is fast and reloading has fixed overhead.\n\n## Integration\nEngines integrate offload via connectors (for example LMCache with vLLM): on eviction, write KV to CPU or disk; on a prefix hit in a lower tier, load it back before or during the step.\n\n> Takeaway: offload KV to bigger, slower tiers when reuse is likely and reloading beats recomputing. Long prefixes almost always favor reloading.", "s": "When KV could be reused later (multi-turn chats, repeated documents, preempted requests) but there is not enough GPU memory to keep it; recomputing a long prefix costs more than reloading it. It is limited by PCIe (or NVLink-C2C) bandwidth for moving KV back, by CPU memory capacity, and by the latency it adds to TTFT if loading is not overlapped with compute."}, {"id": "20.05", "t": "Tiered KV Storage & Cache Movement", "f": "https://fanout.sh/inference-eng/curriculum/20-05", "k": ["kv-offload"], "x": [], "r": [["LMCache", "https://github.com/LMCache/LMCache", "Layer-wise KV loading and storage backends."], ["CachedAttention / AttentionStore", "https://arxiv.org/abs/2403.19708", "Hierarchical KV caching for multi-turn conversations."]], "q": "How can an engine hide the latency of loading KV from CPU memory for a request with a cached prefix?", "n": ["A tiered KV system moves blocks between HBM, CPU RAM, SSD and remote storage.", "Hide transfer time: async copies, pinned memory, separate streams, layer-wise pipelining.", "Prefetch based on signals: a conversation is active, a document is popular.", "Write-back on eviction should not block the critical path.", "Track hit rates per tier and transfer bandwidth."], "ak": "", "a": "## Movement paths\n%%flow KV block movement.\nGPU HBM -(evict, async)-> CPU DRAM -(evict)-> SSD / remote\nSSD / remote -(prefetch)-> CPU DRAM -(load, layer-wise)-> *GPU HBM\n%%\n\n## Hiding latency\n- **Pinned host memory**: allows fast async DMA.\n- **Separate CUDA streams**: copies run alongside compute.\n- **Layer-wise loading**: load layer `l+1`'s KV while computing layer `l`.\n- **Deferred scheduling**: mark the request \"loading\" and run others until its KV is ready.\n\n## Prefetching\nPredict what will be needed: when a user is typing in a conversation, start loading its history; keep popular documents in CPU memory.\n\n## Metrics\n| Metric | Meaning |\n| Hit rate per tier | where reuse comes from |\n| Load bandwidth achieved | link efficiency |\n| Requests waiting on loads | exposed latency |\n| Eviction write-back rate | pressure on lower tiers |\n\n> Takeaway: tiered KV works when movement is asynchronous and overlapped with compute. Prefetch where you can and measure exposed load time.", "s": "Start the transfer as soon as the request is scheduled (or even when it arrives), and overlap it with other work: copy layer by layer so attention for layer 1 can start while later layers load, or schedule the request for a later step and run other requests meanwhile. Use asynchronous copies on separate CUDA streams and pinned host memory."}, {"id": "20.06", "t": "Cache Admission, Eviction & Locality", "f": "https://fanout.sh/inference-eng/curriculum/20-06", "k": ["caching"], "x": [], "r": [["Mooncake", "https://arxiv.org/abs/2407.00079", "Production KV caching policies."], ["Wikipedia: Cache replacement policies", "https://en.wikipedia.org/wiki/Cache_replacement_policies", "LRU, LFU and variants."]], "q": "Why might \"cache everything, evict LRU\" be a poor policy for a lower KV tier, and what would you use instead?", "n": ["Admission: decide what is worth caching at all.", "Eviction: decide what to drop; LRU is a baseline, not always best.", "Value of an entry ~ probability of reuse x recompute cost saved / size.", "Locality: route related requests to the same place so caches stay small and hot.", "Measure hit rate, bytes written vs bytes reused, and TTFT saved."], "ak": "", "a": "## Admission\n| Rule | Rationale |\n| Admit on second occurrence | one-off prompts never pollute |\n| Admit only prefixes longer than N tokens | short ones are cheap to recompute |\n| Admit active conversations | next turn is likely |\n\n## Eviction\nScore entries by expected savings per byte:\n```\nvalue = p_reuse * recompute_cost / size\n```\nLRU approximates `p_reuse` with recency. LFU or frequency-plus-recency variants protect popular system prompts and documents from being flushed by bursts of one-off traffic.\n\n## Locality\nWithout affinity, each replica's cache must hold every popular prefix. With prefix-aware routing, each replica holds a fraction, so the same memory covers more of the working set.\n\n## Measuring cache economics\n| Metric | Good sign |\n| Hit rate | rising with capacity |\n| Bytes reused / bytes written | well above 1 |\n| Prefill tokens saved per second | large |\n\n> Takeaway: cache what is likely to be reused, evict by value per byte, and route for locality. A bigger cache without these policies mostly stores junk.", "s": "Most prefixes are never reused, so caching everything spends bandwidth writing one-off KV and pushes out valuable entries (cache pollution). Better: admit only entries likely to be reused (seen more than once, long prefixes, active conversations), weigh eviction by size and recompute cost rather than recency alone, and route requests so each replica sees a stable subset of prefixes."}, {"id": "20.07", "t": "Lab: Push Context Beyond GPU Memory", "f": "https://fanout.sh/inference-eng/curriculum/20-07", "k": ["lab"], "x": ["Lab"], "r": [["LMCache", "https://github.com/LMCache/LMCache", "Offload layer to use in the lab."], ["vLLM: KV connector / offloading docs", "https://docs.vllm.ai/en/latest/", "Engine integration points."]], "q": "What result would show that your tiered KV setup is worth it?", "n": ["Build a workload whose reusable KV exceeds GPU memory: long multi-turn chats or many repeated documents.", "Run GPU-only prefix caching, then add a CPU (and optionally SSD) tier.", "Measure TTFT, hit rate per tier, transfer bandwidth and goodput.", "Also run a no-reuse workload to check for overhead.", "Report when the tier helps and when it does not."], "ak": "", "a": "## Workload\n- 200 conversations, each growing to 20k+ tokens over 10 turns.\n- Turns arrive interleaved, so most conversations' KV is evicted from GPU between turns.\n\n## Configurations\n| Config | Description |\n| A | prefix caching, GPU only |\n| B | GPU + CPU tier (offload connector) |\n| C | GPU + CPU + SSD tier |\n\n## Measure\n- TTFT p50/p95 per turn number.\n- Hit rate in GPU, CPU, SSD tiers.\n- Transfer bandwidth and requests waiting on loads.\n- Goodput under the SLO.\n- Overhead on a no-reuse workload.\n\n## Expected\nTurn 1 is the same everywhere. Later turns: A recomputes long histories; B and C reload them, cutting TTFT several times for long histories.\n\n> Takeaway: a KV tier beyond GPU memory pays off when reusable KV exceeds HBM. Prove it with per-tier hit rates and per-turn TTFT, and check it costs nothing when there is no reuse.", "s": "On a multi-turn or repeated-document workload whose total KV exceeds GPU memory, TTFT p95 and goodput improve compared with GPU-only caching, with hit rate in the CPU tier showing where the gain comes from, and with no regression on a workload with no reuse."}]}, {"n": "21", "name": "Prefill/Decode Disaggregation", "lessons": [{"id": "21.01", "t": "Why Separate Prefill and Decode", "f": "https://fanout.sh/inference-eng/curriculum/21-01", "k": ["disaggregation"], "x": [], "r": [["DistServe", "https://arxiv.org/abs/2401.09670", "Disaggregation for goodput."], ["Splitwise", "https://arxiv.org/abs/2311.18677", "Phase splitting across machines."]], "q": "Give two reasons to run prefill and decode on separate GPU pools.", "n": ["Colocated prefill and decode interfere: one phase's work delays the other.", "Chunked prefill reduces but does not remove interference.", "Disaggregation runs prefill on one pool and decode on another, transferring KV between them.", "Each pool gets its own parallelism, batch policy and scaling.", "Cost: KV transfer, more complex scheduling and routing."], "ak": "", "a": "## The problem with colocation\n- Prefill steps are long and compute heavy; decode steps short and memory bound.\n- Mixed in one batch, a prefill makes the decode step slower; many decodes make the prefill chunk wait.\n- Meeting tight TTFT and tight TPOT together forces compromises.\n\n## The idea\n%%flow Disaggregated serving.\nRequest -> *Prefill pool (compute bound) -(KV transfer)-> Decode pool (memory bound) -> Streamed tokens\n%%\n\n## Benefits\n| Benefit | Why |\n| No interference | separate GPUs |\n| Phase-specific tuning | TP for prefill latency, large batches for decode |\n| Independent scaling | ratio of prefill to decode GPUs follows traffic |\n| Hardware choice | compute-rich GPUs for prefill, memory-rich for decode |\n\n## Costs\n- Moving KV between pools (bandwidth, latency).\n- Two pools to size and route.\n- Under light load, colocation can be cheaper.\n\n> Takeaway: disaggregation removes prefill-decode interference and lets each phase run its own way, at the cost of KV transfer and extra complexity.", "s": "They interfere when colocated: long prefills stall decode steps (ITL spikes) and decode batches slow prefills, so it is hard to meet both TTFT and TPOT SLOs. And they have different resource profiles (prefill compute bound, decode memory bound), so separate pools can use different parallelism, batch sizes or even hardware, and be scaled in
