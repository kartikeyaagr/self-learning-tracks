; $c_v\\approx0.5$. Actor and critic often share a network body with two heads, the same design as AlphaGo Zero's policy-value network (09.03).\n- **Entropy bonus.** $\\mathcal H(\\pi)=-\\sum_a\\pi(a\\mid s)\\log\\pi(a\\mid s)$ rewards keeping probability spread across actions; $c_e\\approx0.01$. Without it, the policy often becomes deterministic early on a mediocre action and stops exploring. Too large and it never commits.\n\n## Failure modes and where this leads\n| Symptom | Likely cause | Fix\n| Entropy collapses in the first few hundred updates | step size too large, no entropy bonus | lower LR, raise $c_e$, normalise advantages\n| Value loss dominates, policy barely moves | rewards on a large scale | normalise rewards or returns, tune $c_v$\n| Learning stalls on long-horizon tasks | $\\lambda$ or $\\gamma$ too small, critic biased | raise $\\lambda$, check bootstrapping at truncation\n| High variance, unstable | $\\lambda$ near 1, small batches | lower $\\lambda$, more parallel environments\n\nA2C uses each batch for one gradient step, because the policy gradient is only valid for data from the current policy. **PPO** reuses a batch for several epochs by weighting with the importance ratio $\\pi_\\theta/\\pi_{\\text{old}}$ and clipping it to $[1-\\epsilon,1+\\epsilon]$; **GRPO**, used for LLM reasoning, removes the critic and computes advantages relative to a group of samples for the same prompt. Both are covered in the AI Research course's Reinforcement Learning chapter, and RLHF with PPO is the subject of the next lesson.\n\n> Takeaway: an actor-critic follows the policy gradient weighted by advantages from a learned critic; GAE mixes multi-step TD errors with weight $(\\gamma\\lambda)^l$ to set the bias-variance balance, and the A2C loss adds value regression and an entropy bonus that keeps exploration alive.","q":"Your actor-critic implementation computes `loss = -(logp * (returns - values)).mean() + 0.5 * ((returns - values)**2).mean()` with a single shared network, and training is unstable: the policy seems to chase the critic. What is the bug, and what else would you check in this loss?","s":"The advantage `returns - values` is not detached, so the policy term backpropagates into the critic. Gradient descent on $-\\log\\pi\\cdot(R-V)$ with respect to $V$ pushes $V$ up whenever $\\log\\pi$ is negative (always, for a stochastic policy), and in general moves the critic to make the policy loss small rather than to predict returns. With a shared body, the policy and value objectives then fight through the same features. Fix: `adv = (returns - values).detach()`, optionally normalised per batch, and use the non-detached values only in the value loss. Other checks: add an entropy bonus (missing here) so the policy does not collapse; make sure `returns` are computed with bootstrapping from $V(s_{T})$ at truncation and none at true terminals; consider GAE instead of raw returns for lower variance; and check the relative scale of the value loss, since on a shared network a large value loss can swamp the policy gradient.","r":[["Schulman et al.: High-Dimensional Continuous Control Using Generalized Advantage Estimation","https://arxiv.org/abs/1506.02438","GAE: the derivation as a sum of TD errors and the bias-variance role of lambda."],["Mnih et al.: Asynchronous Methods for Deep Reinforcement Learning","https://arxiv.org/abs/1602.01783","A3C: the actor-critic loss with an entropy bonus, the basis of A2C."],["OpenAI Spinning Up: Intro to Policy Optimization","https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html","The policy gradient theorem, baselines and advantage functions, with code."],["Schulman et al.: Proximal Policy Optimization Algorithms","https://arxiv.org/abs/1707.06347","Where actor-critic goes next: the clipped surrogate used with GAE."]],"k":["actor-critic","GAE","policy gradient"],"x":["NumPy","PyTorch"],"p":["actor-critic-a2c-loss-with-entropy","gae-advantages","reinforce-with-baseline","reinforce-gradient"],"ak":""},{"id":"08.07","t":"Learning from preferences","n":["When a reward is hard to write down, collect pairwise human judgements instead and fit a reward model; comparisons are easier and more consistent for people than absolute scores.","The Bradley-Terry model sets $P(y_w\\succ y_l)=\\sigma(r(y_w)-r(y_l))$; the reward model is trained with $-\\log\\sigma(r_w-r_l)$, and only reward differences are identified.","RLHF maximises $\\mathbb E[r_\\phi(x,y)]-\\beta\\,\\mathrm{KL}(\\pi\\|\\pi_\\text{ref})$ with PPO; the KL keeps the policy where the reward model is trustworthy.","DPO uses the closed-form optimum of that objective to turn it into a classification loss on preference pairs, $-\\log\\sigma\\big(\\beta[\\Delta_w-\\Delta_l]\\big)$ with $\\Delta=\\log\\pi-\\log\\pi_\\text{ref}$; no reward model or sampling needed.","Reward hacking (over-optimising a proxy), length bias and label noise are the main failure modes; the KL coefficient $\\beta$ is the key control."],"a":"## When you cannot write the reward\nEvery method so far assumed a reward function. For many tasks nobody can write one: \"a helpful, harmless answer\", \"a backflip that looks natural\", \"a good summary\". People can, however, look at two outputs and say which is better, faster and more consistently than they can assign absolute scores. **Learning from preferences** turns those comparisons into a reward model, then optimises a policy against it. Christiano et al. (2017) did this for Atari and simulated robots with under 1 percent of interactions labelled; InstructGPT (2022) applied it to language models, which made RLHF the standard final stage of LLM training. (The AI Research add-on on training LLMs at scale covers the full post-training pipeline; this lesson covers the objectives.)\n\n%%flow The RLHF pipeline: people compare, a reward model generalises their judgements, RL optimises against it.\nPrompts -(sample two answers)-> Human comparisons -(Bradley-Terry fit)-> *Reward model -(PPO with KL)-> Tuned policy\n%%\n\n## Bradley-Terry: from comparisons to a reward\nThe **Bradley-Terry model** says each item has a latent score and the probability that one beats another is a logistic function of the difference:\n\n$$P(y_w\\succ y_l\\mid x)=\\sigma\\big(r(x,y_w)-r(x,y_l)\\big)$$\n\nFit a reward model $r_\\phi$ (for LLMs, the pretrained model with its unembedding replaced by a scalar head, read at the last token) by maximum likelihood on comparison data:\n\n$$\\mathcal L_{\\text{RM}}=-\\,\\mathbb E_{(x,y_w,y_l)}\\log\\sigma\\big(r_\\phi(x,y_w)-r_\\phi(x,y_l)\\big)$$\n\nOnly differences enter, so adding a constant to all rewards changes nothing: the reward is identified only up to a per-prompt shift, and its absolute values are meaningless until you normalise them. Practical details matter: canonicalise pairs so the winner is always first, drop ties or model them separately, deduplicate, and sometimes add a margin when annotators rate one answer as much better. Reward-model accuracy on held-out pairs is typically only 65 to 75 percent, because human labels are noisy; this is the ceiling the rest of the pipeline inherits.\n\n! Example: one reward-model loss\n! For a prompt, the reward model scores the preferred answer 1.2 and the rejected one 0.4.\n! $P(\\text{preferred wins})=\\sigma(0.8)=0.69$, so the loss is $-\\ln0.69=0.37$ nats.\n! The gradient pushes the two scores apart with weight $1-0.69=0.31$; a pair already separated by 5 gets weight 0.007, so easy pairs barely contribute.\n\n## RLHF: optimise the reward, but stay close\nWith a reward model, the policy (the LLM) is tuned by RL to maximise\n\n$$\\max_\\pi\\ \\mathbb E_{x,\\,y\\sim\\pi}\\big[r_\\phi(x,y)\\big]-\\beta\\,\\mathrm{KL}\\big(\\pi(\\cdot\\mid x)\\,\\|\\,\\pi_{\\text{ref}}(\\cdot\\mid x)\\big)$$\n\nwhere $\\pi_{\\text{ref}}$ is the supervised fine-tuned starting model. The KL term is essential. The reward model is only accurate near the distribution it was trained on, so an unconstrained optimiser finds outputs it scores highly for the wrong reasons: **reward hacking**, an instance of Goodhart's law. Gao et al. measured that true quality first rises and then falls as KL from the reference grows, while proxy reward keeps rising. In practice the KL is added per token as a penalty $-\\beta\\log(\\pi/\\pi_\\text{ref})$ to the reward, and PPO (an actor-critic from lesson 08.06) does the optimisation, with a value head and GAE over tokens. That means four models in memory: policy, reference, reward model and critic.\n\n## DPO: the same objective as classification\nRafailov et al. (2023) observed that the KL-regularised objective has a closed-form optimum:\n\n$$\\pi^*(y\\mid x)=\\frac{1}{Z(x)}\\,\\pi_{\\text{ref}}(y\\mid x)\\,\\exp\\!\\big(r(x,y)/\\beta\\big)\\ \\Longleftrightarrow\\ r(x,y)=\\beta\\log\\frac{\\pi^*(y\\mid x)}{\\pi_{\\text{ref}}(y\\mid x)}+\\beta\\log Z(x)$$\n\nSubstituting this reward into the Bradley-Terry likelihood, the intractable $\\log Z(x)$ cancels in the difference, leaving a loss on the policy alone:\n\n$$\\mathcal L_{\\text{DPO}}=-\\,\\mathbb E\\,\\log\\sigma\\Big(\\beta\\big[(\\log\\pi_\\theta(y_w\\mid x)-\\log\\pi_{\\text{ref}}(y_w\\mid x))-(\\log\\pi_\\theta(y_l\\mid x)-\\log\\pi_{\\text{ref}}(y_l\\mid x))\\big]\\Big)$$\n\n```python\ndef dpo_loss(lp_w, lp_l, ref_w, ref_l, beta=0.1):   # summed token log-probs per sequence\n    margin = beta * ((lp_w - ref_w) - (lp_l - ref_l))\n    return -torch.nn.functional.logsigmoid(margin).mean()\n```\n\nThe policy is its own implicit reward model. Training is supervised: two forward passes per pair (policy and frozen reference), no sampling, no critic, no reward model. That simplicity made DPO and its variants the default for many open models.\n\n! Example: one DPO loss\n! $\\beta=0.1$. The policy gives the chosen answer log-prob $-12$ (reference $-13$) and the rejected answer $-15$ (reference $-14$).\n! Implicit reward differences: chosen $+1$, rejected $-1$; margin $=0.1\\cdot(1-(-1))=0.2$.\n! Loss $=-\\ln\\sigma(0.2)=0.598$; the per-pair gradient weight is $\\sigma(-0.2)=0.45$, larger when the implicit reward model ranks the pair wrongly.\n\n## Trade-offs and failure modes\n| Aspect | RLHF with PPO | DPO\n| Data | comparisons for the RM, then fresh on-policy samples | a fixed set of comparisons\n| Models in memory | policy, reference, reward model, critic | policy, reference\n| Strength | on-policy exploration; reward model reusable | simple, stable, cheap\n| Typical failure | reward hacking, PPO instability | overfits the pairs; can lower the likelihood of both answers; off-policy drift\n\nCommon to both: **length bias** (annotators and reward models favour longer answers, so policies get verbose), sensitivity to label noise, and the choice of $\\beta$ (around 0.1 for DPO; smaller allows larger departures from the reference). For tasks with checkable answers, such as maths and code, verifiable rewards remove the learned reward model altogether; that RLVR setting, with GRPO, is covered in the AI Research course.\n\n> Takeaway: preference learning fits a Bradley-Terry reward model to pairwise human comparisons and optimises a policy against it under a KL leash to the reference model; DPO solves the same KL-regularised objective in closed form, turning it into a logistic loss on log-probability ratios of preferred versus rejected answers.","q":"After DPO training, your model's win rate against the reference improves, but you notice the log-probability of the chosen answers on the training set went down, not up. Is this a bug? Explain using the DPO loss, and say what risk it signals.","s":"It is not necessarily a bug. The DPO loss depends only on the margin $\\beta[(\\log\\pi(y_w)-\\log\\pi_\\text{ref}(y_w))-(\\log\\pi(y_l)-\\log\\pi_\\text{ref}(y_l))]$. It can be increased by pushing the rejected answer's likelihood down faster than the chosen one's, even while both fall. The chosen and rejected answers for a prompt are usually similar, sharing most tokens, so gradients that push down $y_l$ also push down $y_w$; the loss is satisfied as long as $y_l$ falls more. The risk is that probability mass leaves both answers and goes somewhere the data says nothing about, possibly to off-distribution or degenerate outputs, which is a form of over-optimisation that the implicit KL does not fully prevent with a finite dataset. Monitor chosen and rejected log-probabilities and KL from the reference; mitigations include a higher $\\beta$, early stopping, adding an SFT (negative log-likelihood) term on chosen answers, or on-policy variants that refresh the pairs.","r":[["Christiano et al.: Deep Reinforcement Learning from Human Preferences","https://arxiv.org/abs/1706.03741","The original reward-model-from-comparisons method on Atari and MuJoCo."],["Ouyang et al.: Training Language Models to Follow Instructions with Human Feedback","https://arxiv.org/abs/2203.02155","InstructGPT: SFT, reward modelling and PPO with a per-token KL penalty."],["Rafailov et al.: Direct Preference Optimization","https://arxiv.org/abs/2305.18290","The closed-form optimum and the derivation of the DPO loss (sections 4 and 5)."],["Nathan Lambert: Reinforcement Learning from Human Feedback (book)","https://rlhfbook.com/","Free book covering reward models, regularisation, PPO and direct alignment methods in practice."]],"k":["RLHF","Bradley-Terry","DPO"],"x":["PyTorch"],"p":["bradley-terry-reward-model-loss","dpo-closed-form-loss","canonicalize-pairwise-preference-data","ppo-with-reference-policy-kl","score-kl-regularized-policy-batch"],"ak":""}]},{"n":"09","name":"Search and self-play","lessons":[{"id":"09.01","t":"Game trees and the rules of Go","n":["Go is a two-player, zero-sum, deterministic, perfect-information game: in principle minimax solves it, in practice its tree (branching factor around 250, games of about 150 moves) is far too big.","Stones that touch orthogonally form a group; a group's liberties are the empty points next to it, and a group with no liberties is captured and removed.","A move is legal only if the point is empty, it does not leave your own group without liberties after captures (in most rule sets), and it does not repeat an earlier board position (superko).","The game ends after two consecutive passes; area scoring counts stones plus empty regions that reach only your colour, plus komi for White.","A board is a 361-point array plus history; groups and liberties come from flood fill, and Zobrist hashing makes repetition checks cheap. The action space is 362 (every point plus pass)."],"a":"## Where this module is going\nThis module builds the AlphaGo Zero algorithm from the ground up: the game and its rules (this lesson), Monte Carlo tree search (09.02), the policy-value network that guides it (09.03), and the self-play training loop that ties them together (09.04). It uses Module 08 throughout: MCTS is bandits (08.05) applied at every node of a tree, the network is an actor-critic-style two-headed model (08.06), and the training loop is a form of policy iteration (08.02).\n\n## Game trees and why Go was hard\nGo belongs to the cleanest class of games: two players alternate, both see everything, there is no chance, and one player's win is the other's loss. Such a game is a tree whose nodes are positions and whose edges are moves. **Minimax** assigns each leaf its result and backs values up, maximising at your turns and minimising at the opponent's; the root value is the game's exact outcome under perfect play. Alpha-beta pruning makes this practical for chess with a hand-built evaluation function at a depth limit.\n\n| Game | Branching factor | Typical length | Rough tree size\n| Chess | about 35 | about 80 plies | $35^{80}\\approx10^{123}$\n| Go 19x19 | about 250 | about 150 plies | $250^{150}\\approx10^{360}$\n\nGo defeated that approach for two reasons. The tree is far wider, so even a few plies of full-width search is expensive. And there was no good hand-written evaluation function: whether a group is alive or a region is territory depends on long tactical sequences, and simple material counting means nothing. AlphaGo's answer was to *learn* both a move prior (to narrow the tree) and an evaluation (to cut it off), and search selectively with MCTS.\n\n## The rules, precisely\nThe board has $19\\times19=361$ intersections. Black moves first; players alternately place a stone of their colour on an empty point or pass.\n- **Groups.** Same-coloured stones connected horizontally or vertically (not diagonally) form a group, which lives or dies together.\n- **Liberties.** The empty points orthogonally adjacent to any stone of the group. A lone stone in the centre has 4, on an edge 3, in a corner 2.\n- **Capture.** After you place a stone, every *opponent* group with zero liberties is removed. Only then is your own group checked.\n- **Suicide.** A move that leaves your own group with no liberties after captures is illegal under most rules, including the Chinese rules AlphaGo Zero used. (Tromp-Taylor rules allow it and simply remove your group.)\n- **Ko and superko.** The simple ko rule forbids recapturing immediately when that would restore the previous position. **Positional superko** generalises it: no move may recreate any earlier board position. Without it, cycles of captures could repeat forever.\n- **End and scoring.** Two consecutive passes end the game. **Area scoring** counts each player's stones on the board plus the empty regions that border only that player's stones. White receives **komi** (7.5 points in AlphaGo Zero's games) to offset Black's first-move advantage; the half point rules out draws.\n\n%%flow Order of operations for one move; checking suicide before removing captured stones is the classic bug.\nPlace stone -(remove opponent groups with 0 liberties)-> Check own group -(no liberties?)-> *Illegal: suicide\nCheck own group -(board seen before?)-> *Illegal: superko\n%%\n\n## Representing the board\nA position is a flat array of 361 cells holding 0 (empty), 1 (black) or 2 (white), plus whose turn it is, the pass count and a history of earlier positions. The action space is 362: one action per point plus pass, which is exactly the size of AlphaGo Zero's policy output. Groups and liberties come from a flood fill:\n\n```python\ndef group_and_liberties(board, p, N=19):          # board: list of N*N ints, p: index of a stone\n    colour, stack, group, libs = board[p], [p], {p}, set()\n    while stack:\n        q = stack.pop(); r, c = divmod(q, N)\n        for rr, cc in ((r-1, c), (r+1, c), (r, c-1), (r, c+1)):\n            if 0 <= rr < N and 0 <= cc < N:\n                n = rr * N + cc\n                if board[n] == 0: libs.add(n)\n                elif board[n] == colour and n not in group:\n                    group.add(n); stack.append(n)\n    return group, libs\n```\n\nA legal-move mask runs this logic for every empty point: tentatively place, remove captured opponent groups, reject suicide, reject repetition. For repetition you need to compare against every earlier position quickly. **Zobrist hashing** assigns a random 64-bit number to each (point, colour) pair; a position's hash is the XOR of the numbers of its stones, updated incrementally by XOR-ing stones in and out, so a superko check is a set lookup.\n\n! Example: a capture and a ko\n! A white stone sits on the edge with two black stones beside it along the edge, so its only liberty is the point directly inward from it.\n! Black plays on that liberty. Step 1: the white stone now has 0 liberties and is removed. Step 2: Black's new stone has a liberty again (the point just emptied), so the move is legal, not suicide.\n! If the captured stone could immediately recapture the black stone in the same way, recreating the position before Black's move, that recapture is forbidden by the ko rule; White must play elsewhere first.\n\n## What the network sees\nA single board does not satisfy the Markov property (lesson 08.01) for Go: legality depends on history through superko, and recent moves carry information about intent. AlphaGo Zero's input is a $19\\times19\\times17$ stack: 8 binary planes for the current player's stones over the last 8 positions, 8 for the opponent's, and one constant plane for the colour to move. Encoding is from the perspective of the player to move, so the network always answers \"how good is this for me?\". Because the rules are symmetric under the 8 rotations and reflections of the board (the dihedral group), every position also gives 8 equivalent training examples and 8 equivalent ways to evaluate it (lesson 09.03).\n\n> Takeaway: Go is a perfect-information game whose tree is too wide and whose positions are too hard to evaluate by hand for minimax; its rules reduce to groups, liberties, capture-before-suicide, superko and area scoring, implemented with flood fill, a 362-action mask and Zobrist hashes over a history of planes.","q":"Your Go engine sometimes reports that a move capturing an opponent group is illegal as suicide. The bug report shows the placed stone had no empty neighbours at the moment it was placed. Explain the bug in terms of the order of rule checks, and explain why this specific order is what the rules require.","s":"The engine checks the new stone's liberties before removing captured opponent groups. When a stone is placed into a point surrounded by opponent stones, its group may have zero liberties at that instant, but if that placement takes the last liberty of an adjacent opponent group, that group is removed first, which empties points next to the new stone and gives it liberties. The rules define a move as: place the stone, remove all opponent groups with no liberties, then check your own group. Only if your group still has no liberties after captures is the move suicide (illegal under Chinese rules). Capturing therefore always takes precedence, which is what makes moves that fill an opponent's last liberty from 'inside' legal. Fix the order: place, scan the up-to-four adjacent opponent groups and remove any with no liberties, then flood-fill your own group, then run the superko check on the resulting board.","r":[["John Tromp: The Game of Go (Tromp-Taylor rules)","https://tromp.github.io/go.html","A complete, machine-friendly statement of the rules in ten short lines, with area scoring."],["Sensei's Library: Superko","https://senseis.xmp.net/?Superko","Positional versus situational superko and why repetition rules exist."],["Silver et al.: Mastering the game of Go without human knowledge","https://www.nature.com/articles/nature24270","AlphaGo Zero; the Methods section specifies the rules, komi and the 17-plane input encoding."],["Chess Programming Wiki: Zobrist Hashing","https://www.chessprogramming.org/Zobrist_Hashing","Incremental XOR position hashing as used for repetition detection."]],"k":["game trees","Go rules"],"x":["NumPy"],"p":["apply-go-action-with-captures-and-repetition","find-go-group-and-its-liberties","build-legal-go-action-mask","score-terminal-position-with-tromp-taylor-rules","encode-alphago-zero-board-history"],"ak":""},{"id":"09.02","t":"Monte Carlo tree search","n":["MCTS grows a search tree selectively: each simulation selects a path with a bandit rule, expands one leaf, evaluates it, and backs the value up the path.","Each edge stores a visit count $N$, total value $W$, mean value $Q=W/N$ and prior $P$; values are always from the perspective of the player to move, so they flip sign at each level.","AlphaGo Zero selects with PUCT: $a=\\arg\\max_a Q(s,a)+c_\\text{puct}P(s,a)\\frac{\\sqrt{\\sum_bN(s,b)}}{1+N(s,a)}$, an optimism bonus weighted by the network's prior.","There are no random rollouts in AlphaGo Zero: a leaf is evaluated once by the value head, and the policy head supplies the priors for its children.","Dirichlet noise on the root priors guarantees exploration in self-play; the final move is chosen from root visit counts, not from $Q$."],"a":"## Search without a full tree\nLesson 09.01 showed that full-width minimax is hopeless for Go. **Monte Carlo tree search** builds only the part of the tree that looks relevant, spending more simulations on promising lines and fewer on bad ones, and converges towards minimax values where it searches deeply. The idea that made it work, **UCT** (Kocsis and Szepesvari, 2006), is to treat move choice at every node as a multi-armed bandit (lesson 08.05): pick the child with the best upper confidence bound. Early Go programs evaluated leaves with random playouts to the end of the game, which reached strong amateur level. AlphaGo replaced playouts with neural networks; AlphaGo Zero dropped playouts entirely.\n\n## What each edge stores\nFor every edge $(s,a)$ in the tree:\n- $N(s,a)$: how many simulations took this edge.\n- $W(s,a)$: sum of the values backed up through it; $Q(s,a)=W/N$ is the mean.\n- $P(s,a)$: the prior probability from the policy head, computed once when $s$ was expanded.\n\n## One simulation, four phases\n1. **Select.** Start at the root and repeatedly pick the child edge maximising the selection score until reaching an unexpanded node.\n2. **Expand.** Run the network on that leaf position to get a policy $p$ (362 move probabilities) and a value $v\\in[-1,1]$. Mask illegal moves, renormalise, and create child edges with $P=p$, $N=W=0$.\n3. **Evaluate.** The leaf's value is $v$, from the perspective of the player to move at the leaf. A terminal position is scored by the rules instead.\n4. **Backup.** Walk back up the path, adding the value to each edge's $W$ and 1 to its $N$, **negating the value at each level**, since a position good for the player to move is bad for the player who moved into it.\n\n%%seq One AlphaGo Zero simulation: no rollouts; the network is called once per simulation, at the new leaf.\nSearch > Tree : select by PUCT from the root\nTree -> Search : path to an unexpanded leaf\nSearch > Network : evaluate leaf position\nNetwork -> Search : priors p, value v\nSearch > Tree : expand leaf with legal priors\nSearch > Tree : back up v, flipping sign per level\n%%\n\n## The PUCT rule\nAlphaGo Zero selects with a variant of the predictor-UCB rule:\n\n$$a^*=\\arg\\max_a\\Big[Q(s,a)+c_\\text{puct}\\,P(s,a)\\,\\frac{\\sqrt{\\sum_bN(s,b)}}{1+N(s,a)}\\Big]$$\n\nThe first term exploits what the search has found. The second is an exploration bonus that is large for moves the network likes (high $P$) and has not tried much (small $N$), and that shrinks as the move is visited. Compare UCB1's $\\sqrt{\\ln t/N}$: PUCT decays faster in $N$ and is shaped by the prior, so the network decides where to look and the search decides what is actually good. $c_\\text{puct}$ is a tuned constant; public reimplementations use values around 1 to 5, sometimes growing slowly with visit count. Unvisited edges start with $Q=0$ in AlphaGo Zero; later engines use a \"first play urgency\" value somewhat below the parent's $Q$ so that search does not waste visits on every low-prior move.\n\n! Example: one PUCT decision\n! Root with 100 total visits ($\\sqrt{100}=10$), $c_\\text{puct}=1.5$.\n! Move A: $Q=0.50$, $P=0.20$, $N=40$. Bonus $=1.5\\cdot0.20\\cdot10/41=0.073$; score $0.573$.\n! Move B: $Q=0.30$, $P=0.50$, $N=10$. Bonus $=1.5\\cdot0.50\\cdot10/11=0.682$; score $0.982$.\n! B is searched next despite its lower mean: the network rates it highly and it has few visits. If B's $Q$ stays at 0.3, its bonus shrinks with every visit until A takes over.\n\n```python\ndef select(node, c_puct):\n    sqrt_total = math.sqrt(sum(e.N for e in node.edges))\n    return max(node.edges, key=lambda e: e.Q + c_puct * e.P * sqrt_total / (1 + e.N))\n\ndef backup(path, v):                  # path: edges from root to leaf; v from the leaf player's view\n    for edge in reversed(path):\n        v = -v                         # the edge's mover is the opponent of whoever moves next\n        edge.N += 1; edge.W += v; edge.Q = edge.W / edge.N\n```\n\n## Root noise, move choice and practical details\n- **Dirichlet noise.** In self-play, the root priors are mixed with noise: $P(s_0,a)=(1-\\varepsilon)p_a+\\varepsilon\\eta_a$, $\\eta\\sim\\mathrm{Dir}(\\alpha)$, with $\\varepsilon=0.25$ and $\\alpha=0.03$ for Go. A small $\\alpha$ concentrates the noise on a few random moves, so every move occasionally gets a real look even if the network gives it near-zero prior. Noise is applied at the root only and not in competitive play.\n- **Choosing the move.** After all simulations (1,600 per move in AlphaGo Zero), the move is chosen from root visit counts, $\\pi(a)\\propto N(s_0,a)^{1/\\tau}$. Visit counts are robust: a move with a high $Q$ from only a few visits might be a lucky estimate, while a high $N$ means the search kept confirming it. Lesson 09.04 covers the temperature $\\tau$.\n- **Tree reuse.** After a move is played, the subtree below it becomes the new root, keeping its statistics.\n- **Parallelism.** Many simulations run concurrently, and leaf evaluations are batched on the GPU (AlphaGo Zero batched 8). A **virtual loss**, temporarily counting an in-flight path as a loss, stops parallel threads from all descending the same line.\n\n> Takeaway: MCTS repeats select, expand, evaluate and back up; AlphaGo Zero selects with PUCT, which adds a prior-weighted, visit-decaying bonus to each edge's mean value, evaluates new leaves with the value head instead of rollouts, flips value signs on the way up, and plays from root visit counts.","q":"A teammate's MCTS converts each leaf value to the root player's perspective once and adds that same number to every edge on the path; selection at every node then maximises $Q+U$. Search looks fine when it only expands the root's children, but deeper searches approve moves that lose to a simple reply. What game is the search actually solving, and why does the depth-1 case hide it?","s":"At nodes where the opponent is to move, the edges now store the root player's value, and selection picks the edge that maximises it. The search therefore models an opponent who chooses the reply that is best for the root player: it is solving a cooperative game, not minimax. A move whose only refutation is one strong reply looks excellent, because the search assumes the opponent will never play that reply. With only the root's children expanded, every selection happens at a root-player node, where maximising the root player's value is correct, so the bug is invisible; it appears as soon as the tree contains opponent decisions. The fix is to store each edge's value from the perspective of the player who chose it: back up $v$ from the leaf player's view and negate it at every level, so that each node's maximisation is that node's player looking after their own interests.","r":[["Silver et al.: Mastering the game of Go without human knowledge","https://www.nature.com/articles/nature24270","AlphaGo Zero; the Methods section gives the exact select, expand, backup and play rules, PUCT and the root noise."],["Silver et al.: Mastering Chess and Shogi by Self-Play (AlphaZero)","https://arxiv.org/abs/1712.01815","The same search for chess and shogi, with how the Dirichlet alpha scales with the number of legal moves."],["Chess Programming Wiki: UCT","https://www.chessprogramming.org/UCT","UCT as bandits in a tree, with history and variants such as first-play urgency."]],"k":["MCTS","PUCT"],"x":["NumPy"],"p":["select-action-with-puct","run-deterministic-neural-guided-mcts","back-up-mcts-simulation-path","initialize-legal-mcts-edge-statistics","mix-dirichlet-noise-into-root-priors"],"ak":""},{"id":"09.03","t":"Policy-value networks","n":["AlphaGo Zero uses one residual network with two heads: a policy head giving 362 move logits and a value head giving $v\\in[-1,1]$ for the player to move.","The policy target is the MCTS visit distribution $\\pi$, not the move played; the value target is the final game result $z=\\pm1$ from the same player's perspective.","The loss is $(z-v)^2-\\pi^\\top\\log p+c\\|\\theta\\|^2$ with $c=10^{-4}$: value regression, policy cross-entropy to the search, and L2 regularisation.","Sharing one body regularises both heads: the value head alone overfits to game outcomes, while the policy target gives dense supervision on every move.","Illegal moves are masked out of the policy before it becomes MCTS priors, and the 8 board symmetries multiply the training data and average out evaluation noise."],"a":"## From two networks to one\nThe original AlphaGo (2016) used several networks: a policy network trained by supervised learning on about 30 million positions from human games (predicting the expert move about 57 percent of the time), a second policy network improved by policy-gradient self-play, a value network trained on self-play outcomes, and a fast rollout policy for playouts. AlphaGo Zero replaced all of them with a single network $f_\\theta(s)=(p,v)$, trained from random initialisation with no human data. The paper's ablation found that the combined residual network both predicted game outcomes better and played markedly stronger than separate policy and value networks of the same kind.\n\n## Architecture\n%%layers AlphaGo Zero's network (20-block version); every convolution is followed by batch norm and ReLU.\nInput | $19\\times19\\times17$ planes: 8 history planes per player, 1 colour plane\nStem | 3x3 convolution, 256 filters\n*Residual tower | 19 residual blocks: conv 3x3, BN, ReLU, conv 3x3, BN, skip add, ReLU\nPolicy head | 1x1 conv to 2 filters, BN, ReLU, fully connected to 362 logits\nValue head | 1x1 conv to 1 filter, BN, ReLU, FC to 256, ReLU, FC to 1, tanh\n%%\n\nThe residual tower is a plain ResNet (covered in this course's Convolutional Networks module) at constant $19\\times19$ resolution: no pooling, because every point matters and moves are tied to exact locations. With 3x3 kernels, 39 convolutional layers give a receptive field that covers the whole board many times over. The stronger 40-block version doubles the depth. The heads are deliberately tiny: almost all computation and capacity is shared.\n\n## Training targets\nEach self-play position $s_t$ yields a training example $(s_t,\\pi_t,z_t)$:\n- $\\pi_t$ is the **search policy**: root visit counts normalised, $\\pi(a)\\propto N(s_t,a)$. MCTS with 1,600 simulations is a much stronger player than the raw network, so $\\pi_t$ is a better policy than $p$. Training $p$ towards $\\pi$ distils the search into the network.\n- $z_t\\in\\{-1,+1\\}$ is the **final game result** from the perspective of the player to move at $s_t$. It is the Monte Carlo return of lesson 08.03, with no discounting and no bootstrapping.\n\nThe loss sums value regression, policy cross-entropy and L2 regularisation:\n\n$$\\ell=(z-v)^2-\\pi^\\top\\log p+c\\,\\|\\theta\\|^2,\\qquad c=10^{-4}$$\n\n```python\ndef pv_loss(logits, v, pi, z, legal):            # logits: (B, 362), v: (B,), pi: (B, 362), z: (B,)\n    logits = logits.masked_fill(~legal, -1e9)     # never put probability on illegal moves\n    policy = -(pi * torch.log_softmax(logits, -1)).sum(-1).mean()\n    value = ((z - v) ** 2).mean()\n    return value + policy                         # L2 via optimizer weight decay\n```\n\nThe two terms are weighted equally. The value term is in squared units of $[-1,1]$, while cross-entropy on 362 classes can start near $\\ln362=5.9$, so the policy term dominates early; that was fine in AlphaGo Zero, and in other settings it is worth monitoring both. Later work (KataGo) adds auxiliary heads, such as final ownership of each point and score margin, which give denser supervision than a single $\\pm1$ per game.\n\n! Example: the loss on one position\n! Three legal moves. Search policy $\\pi=(0.7, 0.2, 0.1)$, network policy $p=(0.5, 0.3, 0.2)$, network value $v=0.6$, and the player to move went on to win, $z=+1$.\n! Value term: $(1-0.6)^2=0.16$.\n! Policy term: $-(0.7\\ln0.5+0.2\\ln0.3+0.1\\ln0.2)=0.485+0.241+0.161=0.887$.\n! Total before L2: 1.047. The policy gradient on the logits is $p-\\pi=(-0.2, 0.1, 0.1)$, moving probability towards the move the search preferred.\n\n## Why the value head needs help\nA single game of about 200 positions supplies only one bit of outcome information, shared by highly correlated consecutive positions. Trained alone, a value network memorises games: the original AlphaGo found its value network overfitting badly when trained on whole games, and had to sample one position per game. In AlphaGo Zero two things help. The shared tower is also trained by the policy head, which receives a full 362-way target at every position, so the features cannot specialise to memorising outcomes. And self-play produces a vast, constantly refreshed stream of games (lesson 09.04).\n\n## Masking and symmetry\n- **Masking.** The network outputs logits for all 362 actions, including occupied points and ko violations. Before the policy is used as MCTS priors, illegal moves are set to $-\\infty$ (or their probabilities zeroed and the rest renormalised). Training targets $\\pi$ are already zero on illegal moves, so masking the logits in the loss as well prevents wasted probability mass.\n- **Symmetry.** The rules are invariant under the 8 rotations and reflections of the board. During training, each example is transformed by a random one of the 8 (the planes and the policy target transform together, while the pass move and value are unchanged). During search, each leaf is evaluated under a random symmetry, which averages out the network's orientation-specific errors.\n\n> Takeaway: AlphaGo Zero's network is one ResNet with a 362-way policy head and a tanh value head, trained to match the MCTS visit distribution and the final game result with $(z-v)^2-\\pi^\\top\\log p+c\\|\\theta\\|^2$; sharing the body, masking illegal moves and symmetry augmentation keep both heads honest.","q":"Why is the policy target the MCTS visit distribution $\\pi$ rather than a one-hot vector on the move actually played? Give two concrete reasons, considering how the move is chosen in self-play and what the network learns from each target.","s":"First, the played move is sampled from $\\pi$ (with temperature, and for the first 30 moves stochastically), so a one-hot target would add sampling noise: an exploratory move with 3 percent of the visits would be taught as if it were the search's choice. The full distribution is the less noisy, expected version of that target. Second, $\\pi$ carries much more information: it ranks all moves the search considered, says how close the alternatives were and spreads probability across equally good moves, so the network learns calibrated priors rather than overconfident ones. That matters because those priors steer future searches; a peaked, wrong prior starves good moves of visits under PUCT. More generally, the visit distribution is the output of a policy improvement operator (the search), and matching it with cross-entropy is distillation of that improved policy, the same role the greedy improvement step plays in policy iteration.","r":[["Silver et al.: Mastering the game of Go without human knowledge","https://www.nature.com/articles/nature24270","Methods: network architecture, the loss and the separate-versus-dual network comparison."],["He et al.: Deep Residual Learning for Image Recognition","https://arxiv.org/abs/1512.03385","The residual block that the tower is built from."],["Wu: Accelerating Self-Play Learning in Go (KataGo)","https://arxiv.org/abs/1902.10565","Auxiliary ownership and score targets, global pooling and other upgrades to the AlphaGo Zero network."]],"k":["policy-value network","distillation"],"x":["PyTorch"],"p":["policy-and-value-heads","alphago-policy-value-loss","apply-alphago-residual-block","assemble-compact-dual-head-network","apply-one-policy-value-head-training-step"],"ak":""},{"id":"09.04","t":"The AlphaGo Zero training loop","n":["AlphaGo Zero is a loop: self-play with MCTS generates $(s,\\pi,z)$ examples, the network trains on recent examples, and an evaluator decides which network generates the next games.","MCTS acts as a policy improvement operator and training as policy evaluation plus distillation: a sample-based, neural version of policy iteration.","Moves are sampled with $\\pi\\propto N^{1/\\tau}$: $\\tau=1$ for the first 30 moves for opening diversity, then $\\tau\\to0$ (most-visited move); Dirichlet root noise adds exploration everywhere.","Training samples uniformly from the last 500,000 games with random symmetries; a new checkpoint replaces the self-play network only if it wins at least 55 percent of 400 evaluation games.","Resignation saves compute but needs a false-positive check (10 percent of games played to the end); AlphaZero later dropped evaluation gating altogether."],"a":"## The loop\nThe previous three lessons supplied the pieces: rules and encoding (09.01), PUCT search (09.02) and a policy-value network (09.03). AlphaGo Zero connects them in a loop that starts from random weights and no human games, and after three days of training the 20-block version beat the version of AlphaGo that defeated Lee Sedol, 100 games to 0.\n\n%%flow Three processes run continuously and asynchronously; the evaluator gates which weights generate data.\nBest network -(MCTS self-play)-> Replay buffer of games -(sample minibatches)-> *Training -(checkpoint)-> Evaluator -(wins 55 percent?)-> Best network\n%%\n\n1. **Self-play.** The current best network plays games against itself. Each move runs 1,600 MCTS simulations (about 0.4 seconds), records the root visit distribution $\\pi_t$, and samples a move. When the game ends, every stored position is labelled with the result $z_t=\\pm1$ from its player's perspective.\n2. **Training.** Positions are sampled uniformly from the most recent 500,000 games, transformed by a random board symmetry, and used in minibatches of 2,048 for SGD with momentum 0.9 and a stepped learning-rate schedule. Every 1,000 steps a checkpoint is saved.\n3. **Evaluation.** Each checkpoint plays 400 games against the current best network, with 1,600 simulations per move and no exploration noise. If it wins at least 55 percent, it becomes the new best network and starts generating self-play games.\n\nThe 20-block run used 4.9 million self-play games and 700,000 minibatches; the 40-block run, 29 million games over 40 days.\n\n## Why it works: search as policy improvement\nLesson 08.02's policy iteration alternated evaluation and greedy improvement. Here:\n- MCTS guided by $(p,v)$ produces a move distribution $\\pi$ that is stronger than $p$. Search is a **policy improvement operator**: it looks ahead and corrects the network's mistakes locally.\n- Training $p$ towards $\\pi$ **distils** the improved policy into the network, and training $v$ towards $z$ **evaluates** the improved policy, since $z$ comes from games played with search.\n- The next round of search uses the better network, producing a still better $\\pi$.\n\nThis pattern, called expert iteration (Anthony et al., 2017, developed independently at the same time), avoids the high variance of policy-gradient self-play: the network is never trained on rewards directly, only by supervised targets produced by search. It is closer to generalised policy iteration than to the actor-critic methods of lesson 08.06, though the two-headed network is structurally the same.\n\n## Exploration: temperature and noise\nA deterministic player facing itself would replay the same game. Two mechanisms keep self-play diverse:\n- **Temperature.** Moves are sampled from $\\pi(a)\\propto N(s_0,a)^{1/\\tau}$. For the first 30 moves $\\tau=1$, sampling in proportion to visits, so openings vary. After that $\\tau\\to0$, i.e. play the most-visited move, so the rest of the game reflects the search's best judgement and $z$ is a meaningful label.\n- **Dirichlet noise** at the root ($\\varepsilon=0.25$, $\\alpha=0.03$, lesson 09.02) ensures every move is occasionally searched even if the network has learned to ignore it, so blind spots can be discovered and corrected.\n\n! Example: the effect of temperature\n! At the root after 1,600 simulations, three candidate moves have visit counts $(800, 600, 200)$.\n! $\\tau=1$: probabilities $(0.50, 0.375, 0.125)$; the third move is still played one time in eight.\n! $\\tau=0.5$ (square the counts): $(0.62, 0.35, 0.04)$. As $\\tau\\to0$, the first move is played every time.\n! Evaluation games and matches use $\\tau\\to0$ throughout; self-play uses $\\tau=1$ only in the opening.\n\n## Saving compute: resignation\nMany self-play games are decided long before the end, and playing them out wastes simulations. AlphaGo Zero resigns when both the root value and the best child's value fall below a threshold $v_\\text{resign}$. To choose that threshold safely, 10 percent of games disable resignation and are played to the end; $v_\\text{resign}$ is set so that fewer than 5 percent of those games would have been resigned by a player who could still have won. Without this check, a value head that is wrong about some position type causes premature resignations, so those positions never get played out and the error is never corrected.\n\n## Variations and practical lessons\n| Choice | AlphaGo Zero | AlphaZero and later engines\n| Which network plays self-play | best checkpoint, gated at 55 percent | always the latest weights (AlphaZero)\n| Simulations per move | 1,600 | 800 (AlphaZero); randomised caps (KataGo)\n| Dirichlet $\\alpha$ | 0.03 for Go | scaled to the typical number of legal moves (0.3 for chess)\n| Targets | $\\pi$ and $z$ | plus ownership, score and other auxiliary targets (KataGo)\n\nSmall-scale reproductions (Leela Zero, Minigo, KataGo) found the loop robust but sensitive to a few things: a replay window too short overfits to the latest games and causes forgetting and cycles in strength; too few simulations make $\\pi$ barely better than $p$, so there is little to distil; value targets from games with heavy exploration noise are biased; and buggy rules (lesson 09.01) are learned and exploited faithfully. KataGo reported roughly a 50x reduction in compute versus AlphaGo Zero's approach by combining auxiliary targets, playout-cap randomisation and architectural changes. The same loop, with a learned model in place of the rules, became MuZero.\n\n> Takeaway: AlphaGo Zero alternates MCTS self-play, which turns the network's policy into a stronger search policy, with supervised training that distils that policy and learns game outcomes; temperature, root noise, a large replay window, gated evaluation and checked resignation keep the loop exploring and improving.","q":"To save compute, you cut self-play to 50 MCTS simulations per move while keeping everything else the same. Training loss goes down nicely, but playing strength plateaus early. Use the policy-iteration view of the loop to explain why, and say what you would change if compute really is limited.","s":"The loop improves only as far as search improves on the network. With 50 simulations on a 362-move board, the search barely explores beyond the network's top few priors, so the visit distribution $\\pi$ is close to $p$ itself. Training $p$ towards $\\pi$ then teaches the network what it already believes: the policy improvement step has almost no effect, and the loss falls because the target is easy, not because play improves. Value targets also come from weak, near-raw-network games, so $v$ learns to evaluate a weak policy. With limited compute, keep a strong improvement signal where it matters: KataGo's playout-cap randomisation runs a full search (say 600 or more simulations) on a random fraction of moves and records only those as policy targets, while the remaining moves use a cheap search just to keep the game going. Also reduce other costs first: a smaller network, resignation with false-positive checks, and a larger replay window to reuse data.","r":[["Silver et al.: Mastering the game of Go without human knowledge","https://www.nature.com/articles/nature24270","AlphaGo Zero; Methods describe self-play, the replay buffer, evaluation gating, temperature and resignation."],["Silver et al.: Mastering Chess and Shogi by Self-Play (AlphaZero)","https://arxiv.org/abs/1712.01815","The same loop without gating, applied to three games."],["Anthony, Tian and Barber: Thinking Fast and Slow with Deep Learning and Tree Search","https://arxiv.org/abs/1705.08439","Expert iteration: search as the expert, the network as the apprentice."],["Wu: Accelerating Self-Play Learning in Go (KataGo)","https://arxiv.org/abs/1902.10565","Playout-cap randomisation and other changes that cut self-play compute about 50x."]],"k":["self-play","expert iteration","AlphaGo Zero"],"x":["NumPy","PyTorch"],"p":["turn-root-visits-into-search-policy","sample-recent-self-play-replay-batch","apply-dihedral-go-symmetry","mix-dirichlet-noise-into-root-priors","alphago-policy-value-loss"],"ak":""}]}];

function inl(s){
  const math = []; s = String(s).replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { math.push(m); return `\u0000${math.length - 1}\u0000`; });
  s = esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => esc(math[+i]));
}

// ---------- game layer: XP, levels, streaks, badges ----------
const LV = [0, 100, 250, 500, 800, 1200, 1700, 2300];
const LVN = ["Novice", "Neuron", "Layer", "Network", "Architect", "Researcher", "Senior Researcher", "Fellow"];
const GB = {1: 3, 2: 8, 3: 15};
const doneCount = () => Object.values(st.done).filter(Boolean).length;
const revCount = () => Object.values(st.rev).reduce((a, r) => a + (r.n || 0), 0);
const xp = () => doneCount() * 10 + Object.values(st.grades).reduce((a, g) => a + (GB[g.g] || 0), 0) + revCount() * 5;
function level(x = xp()){ let i = 0; while (i < LV.length - 1 && x >= LV[i+1]) i++; const nx = LV[i+1]; return {i, name: LVN[i], x, from: LV[i], to: nx, pct: nx ? (x - LV[i]) / (nx - LV[i]) : 1}; }
function dayCounts(){
  const c = {};
  Object.entries(st.at).forEach(([k, t]) => { if (st.done[k] && t) { const d = dk(t); c[d] = (c[d] || 0) + 1; } });
  Object.entries(st.act).forEach(([d, n]) => c[d] = (c[d] || 0) + (n || 0));
  return c;
}
function streak(c = dayCounts()){
  let d = today(); if (!c[d]) d = addDays(d, -1); let n = 0;
  while (c[d]) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(c = dayCounts()){
  let best = 0; Object.keys(c).forEach(d => { if (c[addDays(d, -1)]) return; let n = 0, x = d; while (c[x]) { n++; x = addDays(x, 1); } best = Math.max(best, n); });
  return best;
}
const todayLessons = () => Object.entries(st.at).filter(([k, t]) => st.done[k] && t && dk(t) === today()).length;

  return [
    ['1', 'First step', 'Finish your first lesson', n >= 1],

}

const TW = (s, px=12) => Math.ceil(String(s).length * px * 0.56);

function parseLane(line){
  let title = ''; const m = line.match(/^\[([^\]]+)\]\s*(.*)$/); if (m){ title = m[1]; line = m[2]; }
  const parts = line.split(/\s+(?:-\(((?:[^()]|\([^()]*\))*)\)-|-)>\s+/);
  const nodes = [], labels = [];
  for (let k = 0; k < parts.length; k++){ if (k % 2 === 0) nodes.push(parts[k].trim()); else labels.push(parts[k] || ''); }
  return {title, nodes: nodes.map(n => ({t: n.replace(/^\*/,''), hot: n.startsWith('*')})), labels};
}
function box(x, y, w, h, n){
  const c = n.hot ? 'var(--accent)' : 'currentColor', f = n.hot ? 'var(--accent-soft)' : 'var(--card)', sh = n.hot ? 'var(--accent)' : 'var(--dg-sh)';

}
function flowSVG(lines, force){

  let S = 0; const tx = (L, k) => k === 0 ? (L.title ? L.title + ': ' : 'Start: ') + L.nodes[0].t : L.nodes[k-1].t + ' → ' + L.nodes[k].t + (L.labels[k-1] ? ' (' + L.labels[k-1] + ')' : '');
  if (force || W <= AV() * 1.15){

WG.bloom = el => {

WG.lru = el => {
  el.innerHTML = '<div class="wg-c"><label class="wg-s"><span>Policy</span><select data-id="p"><option value="LRU">LRU</option><option value="LFU">LFU</option><option value="FIFO">FIFO</option></select></label><label class="wg-s"><span>Capacity <output>3</output></span><input type="range" min="2" max="6" value="3" data-id="c"></label></div><div class="lru-keys" role="group" aria-label="Request a key">' + 'ABCDEF'.split('').map(k => `<button type="button" class="btn ghost sm" data-k="${k}">${k}</button>`).join('') + '</div><div class="wg-btns"><button type="button" class="btn ghost sm" data-a="hot">30 skewed requests</button><button type="button" class="btn ghost sm" data-a="scan">One-off scan (G to N)</button><button type="button" class="btn ghost sm" data-a="reset">Reset</button></div><div class="wg-o"></div>';
  let S, hits, miss, last; const R = rng(3);
  const reset = () => { S = []; hits = 0; miss = 0; last = 'Request keys and watch what gets evicted.'; };
  const pol = () => el.querySelector('[data-id="p"]').value, cap = () => +el.querySelector('[data-id="c"]').value;
  const victim = () => { const p = pol(); if (p === 'FIFO') return S.reduce((a, b) => a.ins < b.ins ? a : b); if (p === 'LRU') return S.reduce((a, b) => a.used < b.used ? a : b); return S.reduce((a, b) => (a.n < b.n || (a.n === b.n && a.used < b.used)) ? a : b); };
  let clock = 0;
  const req = (k, quiet) => { clock++; const e = S.find(x => x.k === k);
    if (e){ e.used = clock; e.n++; hits++; if (!quiet) last = `<b>${k}</b>: hit`; return; }
    miss++; let ev = ''; while (S.length >= cap()){ const v = victim(); S = S.filter(x => x !== v); ev = v.k; }
    S.push({k, ins: clock, used: clock, n: 1}); if (!quiet) last = `<b>${k}</b>: miss${ev ? `, evicted <b>${ev}</b>` : ''}`; };
  const draw = () => { el.querySelector('output').textContent = cap(); while (S.length > cap()){ const v = victim(); S = S.filter(x => x !== v); }
    const v = S.length >= cap() ? victim() : null, p = pol();
    const ord = [...S].sort((a, b) => p === 'FIFO' ? b.ins - a.ins : p === 'LRU' ? b.used - a.used : (b.n - a.n) || (b.used - a.used));
    el.querySelector('.wg-o').innerHTML = stats([['Hit rate', hits + miss ? pct(hits / (hits + miss), 0) : '–', `${hits} hits, ${miss} misses`]]) +
      `<div class="lru-row" aria-label="Cache contents">${[...Array(cap())].map((_, i) => { const e = ord[i]; return e ? `<div class="slot${e === v ? ' ev' : ''}"><b>${e.k}</b><small>${p === 'LFU' ? e.n + '× used' : p === 'LRU' ? 'used t' + e.used : 'in at t' + e.ins}</small>${e === v ? '<em>evicted next</em>' : ''}</div>` : '<div class="slot empty">empty</div>'; }).join('')}</div><p class="bf-msg" aria-live="polite">${last}</p>`; };
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k) req(b.dataset.k);
    else if (b.dataset.a === 'hot'){ for (let i = 0; i < 30; i++){ const r = R(); req(r < .45 ? 'A' : r < .7 ? 'B' : r < .85 ? 'C' : 'DEF'[Math.floor(R() * 3)], true); } last = 'Ran 30 requests where A, B and C are popular.'; }
    else if (b.dataset.a === 'scan'){ 'GHIJKLMN'.split('').forEach(k => req(k, true)); last = 'A one-off scan of G to N. Under LRU it flushes the popular keys; LFU keeps them.'; }
    else if (b.dataset.a === 'reset') reset();
    else return; draw(); });
  el.querySelector('.wg-c').addEventListener('input', draw); reset(); draw();
};

WG.hll = el => {
  const NV = v => Math.round(Math.pow(10, v / 10));
  controls(el, [
    {id: 'p', label: 'Precision p (registers = 2ᵖ)', min: 4, max: 16, v: 14, f: v => `${v} → ${nf(Math.pow(2, v))}`},
    {id: 'n', label: 'Distinct items actually added', min: 20, max: 60, v: 50, f: v => nf(NV(v))}
  ], (V, out) => {
    const m = 1 << V.p, n = NV(V.n), reg = new Uint8Array(m), R = rng(V.p * 1000 + V.n);
    for (let i = 0; i < n; i++){ const h = (R() * 4294967296) >>> 0, idx = h >>> (32 - V.p), w = (h << V.p) >>> 0; const rho = w === 0 ? 33 - V.p : Math.clz32(w) + 1; if (rho > reg[idx]) reg[idx] = rho; }
    let s = 0, z = 0; for (let i = 0; i < m; i++){ s += Math.pow(2, -reg[i]); if (!reg[i]) z++; }
    const al = m === 16 ? 0.673 : m === 32 ? 0.697 : m === 64 ? 0.709 : 0.7213 / (1 + 1.079 / m); let E = al * m * m / s; if (E <= 2.5 * m && z) E = m * Math.log(m / z);
    const se = 1.04 / Math.sqrt(m), mem = m * 6 / 8, mf = b => b < 1024 ? nf(b) + ' B' : nf(b / 1024, b < 10240 ? 1 : 0) + ' KB';
    const T = 40, nt = Math.min(n, 20000), errs = [...Array(T)].map((_, t) => { const r = new Uint8Array(m), Rr = rng(t * 7919 + V.p); for (let i = 0; i < nt; i++){ const h = (Rr() * 4294967296) >>> 0, ix = h >>> (32 - V.p), w = (h << V.p) >>> 0, rho = w === 0 ? 33 - V.p : Math.clz32(w) + 1; if (rho > r[ix]) r[ix] = rho; }
      let s2 = 0, z2 = 0; for (let i = 0; i < m; i++){ s2 += Math.pow(2, -r[i]); if (!r[i]) z2++; } let e = al * m * m / s2; if (e <= 2.5 * m && z2) e = m * Math.log(m / z2); return (e - nt) / nt; });
    const lim = Math.max(3 * se, ...errs.map(Math.abs)) * 1.1, W = 640, H = 220, ml = 54, pw = W - ml - 14, sy = v => 14 + (1 - (v + lim) / (2 * lim)) * (H - 40), within = errs.filter(e => Math.abs(e) <= se).length;
    out.innerHTML = stats([['Estimate', nf(E), 'true count ' + nf(n)], ['Error this run', (E >= n ? '+' : '−') + pct(Math.abs(E - n) / n, 2)], ['Memory', mf(mem), 'vs ' + mf(n * 8) + ' for 8-byte IDs']]) +
      `<div class="lab" style="margin:4px 0 8px">40 repeated runs with ${nf(nt)} items: error of each run. Shaded band = ±1 standard error (1.04/√m = ${pct(se, 2)}); ${within} of 40 runs land inside it.</div><div class="wg-ch"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatter of HyperLogLog errors across 40 runs, mostly inside plus or minus one standard error">
      <rect x="${ml}" y="${sy(se)}" width="${pw}" height="${sy(-se) - sy(se)}" fill="var(--c1)" opacity=".12"/><line x1="${ml}" x2="${ml + pw}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line2)"/>
      ${[-2 * se, -se, 0, se, 2 * se].filter(v => Math.abs(v) < lim).map(v => `<text x="${ml - 8}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v > 0 ? '+' : v < 0 ? '−' : ''}${pct(Math.abs(v), 1)}</text>`).join('')}
      ${[2 * se, -2 * se].map(v => `<line x1="${ml}" x2="${ml + pw}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--c1)" stroke-dasharray="4 4" opacity=".5"/>`).join('')}
      ${errs.map((e, i) => `<circle cx="${ml + (i + .5) / T * pw}" cy="${sy(e)}" r="5" fill="${Math.abs(e) <= se ? 'var(--c1)' : 'var(--c2)'}" stroke="var(--card)" stroke-width="1.5"><title>Run ${i + 1}: ${e >= 0 ? '+' : '−'}${pct(Math.abs(e), 2)}</title></circle>`).join('')}

  });

WG.geohash = el => {
  const B32 = '0123456789bcdefghjkmnpqrstuvwxyz', PT = {n: 'Example point (central London)', lat: 51.5074, lng: -0.1278};
  let h = '';
  const box = s => { let a = [-90, 90], o = [-180, 180], ev = true; for (const ch of s){ const v = B32.indexOf(ch); for (let b = 4; b >= 0; b--){ const bit = v >> b & 1, r = ev ? o : a, mid = (r[0] + r[1]) / 2; if (bit) r[0] = mid; else r[1] = mid; ev = !ev; } } return {a, o}; };
  const enc = (lat, lng, n) => { let s = ''; for (let i = 0; i < n; i++){ for (const ch of B32){ const b = box(s + ch); if (lat >= b.a[0] && lat < b.a[1] && lng >= b.o[0] && lng < b.o[1]){ s += ch; break; } } } return s; };
  el.innerHTML = '<div class="gh-bar"><button type="button" class="btn ghost sm" data-a="up">← Zoom out</button><button type="button" class="btn ghost sm" data-a="pt">Follow the example point</button></div><div class="wg-o"></div>';
  const draw = () => {
    const b = box(h), even = h.length % 2 === 0, cols = even ? 8 : 4, rows = even ? 4 : 8, dw = b.o[1] - b.o[0], dh = b.a[1] - b.a[0];
    const W = 600, H = Math.round(Math.min(380, Math.max(220, W * dh / dw))), cw = W / cols, chh = H / rows, ptc = enc(PT.lat, PT.lng, h.length + 1);
    let g = '';
    for (const ch of B32){ const c = box(h + ch), x = (c.o[0] - b.o[0]) / dw * W, y = (b.a[1] - c.a[1]) / dh * H, hot = ptc === h + ch;
      g += `<g class="gh-c${hot ? ' hot' : ''}" data-c="${ch}" tabindex="0" role="button" aria-label="Zoom into ${h + ch}"><rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${chh - 2}" rx="4"/><text x="${x + cw / 2}" y="${y + chh / 2 + 5}" text-anchor="middle" font-size="${Math.min(15, cw / 2.4)}">${ch}</text></g>`; }
    const inside = PT.lat >= b.a[0] && PT.lat < b.a[1] && PT.lng >= b.o[0] && PT.lng < b.o[1];
    if (inside) g += `<circle cx="${(PT.lng - b.o[0]) / dw * W}" cy="${(b.a[1] - PT.lat) / dh * H}" r="5" fill="var(--c2)" stroke="var(--card)" stroke-width="2" pointer-events="none"/>`;
    const km = (b.a[0] + b.a[1]) / 2, wkm = dw / cols * 111.32 * Math.cos(km * Math.PI / 180), hkm = dh / rows * 110.57, kf = v => v >= 10 ? nf(v) + ' km' : v >= 1 ? nf(v, 1) + ' km' : nf(v * 1000) + ' m';
    el.querySelector('.wg-o').innerHTML = stats([['Current prefix', h ? `<code>${h}</code>` : 'whole world'], ['Each cell below', `${kf(wkm)} × ${kf(hkm)}`, `${h.length + 1} character${h.length ? 's' : ''}`], ['Example point', `<code>${enc(PT.lat, PT.lng, Math.max(6, h.length + 1))}</code>`, 'orange dot when in view']]) +
      `<div class="wg-ch"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Geohash cells for prefix ${h || 'none'}; tap a cell to zoom in">${g}</svg></div>`;
    el.querySelector('[data-a="up"]').disabled = !h; el.querySelector('[data-a="pt"]').disabled = h.length >= 8;
  };
  el.addEventListener('click', e => { const c = e.target.closest('.gh-c'), b = e.target.closest('button');
    if (c && h.length < 8){ h += c.dataset.c; draw(); } else if (b?.dataset.a === 'up'){ h = h.slice(0, -1); draw(); } else if (b?.dataset.a === 'pt' && h.length < 8){ h = enc(PT.lat, PT.lng, h.length + 1); draw(); } });
  el.addEventListener('keydown', e => { const c = e.target.closest('.gh-c'); if (c && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); c.dispatchEvent(new MouseEvent('click', {bubbles: true})); } });
  draw();
};

WG.bucket = el => {
  el.innerHTML = '<div class="wg-x"></div><div class="wg-btns"><button type="button" class="btn sm" data-a="run">Start</button><button type="button" class="btn ghost sm" data-a="burst">Send a burst of 15</button></div><div class="bk-o"></div>';
  let tok = 10, hist = [], acc = 0, rej = 0, t = 0, timer = null, pend = 0, V; const R = rng(11), TK = 100, KEEP = 150;
  const cv = controls(el.querySelector('.wg-x'), [
    {id: 'c', label: 'Bucket capacity', min: 1, max: 20, v: 10, f: v => v + ' tokens'},
    {id: 'r', label: 'Refill rate', min: 1, max: 10, v: 3, f: v => v + ' per second'},
    {id: 'q', label: 'Traffic', opts: [[0, 'Quiet (1/s)'], [1, 'Steady (5/s)'], [2, 'Spiky']], v: 1}
  ], v => { V = v; tok = Math.min(tok, V.c); });
  const step = () => { t++; tok = Math.min(V.c, tok + V.r * TK / 1000);
    const rate = V.q === 0 ? 1 : V.q === 1 ? 5 : (Math.floor(t / 20) % 4 === 0 ? 18 : 1);
    let n = pend + (R() < rate * TK / 1000 ? 1 : 0) + (rate * TK / 1000 > 1 ? Math.floor(rate * TK / 1000) : 0); pend = 0;
    let a = 0, r = 0; while (n-- > 0){ if (tok >= 1){ tok -= 1; a++; } else r++; } acc += a; rej += r; hist.push({tok, a, r}); if (hist.length > KEEP) hist.shift(); };
  const draw = () => { const NW = el.clientWidth < 520, W = NW ? 420 : 640, H = 210, m = {l: 40, r: 10, t: 12, b: 42}, pw = W - m.l - m.r, ph = H - m.t - m.b, dx = pw / KEEP, sy = v => m.t + ph - v / V.c * ph;
    let g = ticks(0, V.c).map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join('');
    const off = KEEP - hist.length;
    g += `<polyline points="${hist.map((h, i) => `${(m.l + (off + i) * dx).toFixed(1)},${sy(h.tok).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--c1)" stroke-width="2"/>`;
    hist.forEach((h, i) => { const x = m.l + (off + i) * dx; for (let j = 0; j < h.a; j++) g += `<circle cx="${x}" cy="${H - m.b + 8 + j * 0}" r="2.6" fill="var(--go)"/>`; for (let j = 0; j < h.r; j++) g += `<rect x="${x - 2.5}" y="${H - m.b + 14 + Math.min(j, 3) * 0}" width="5" height="5" fill="var(--bad)"/>`; });
    el.querySelector('.bk-o').innerHTML = stats([['Tokens now', nf(tok, 1)], ['Allowed', nf(acc)], ['Rejected (429)', nf(rej)]]) + `<div class="wg-lg"><span><i style="background:var(--c1)"></i>Tokens in bucket</span><span><i style="background:var(--go);border-radius:50%;width:8px;height:8px"></i>Allowed</span><span><i style="background:var(--bad);width:7px;height:7px"></i>Rejected</span></div><div class="wg-ch"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Token level over the last 15 seconds with allowed and rejected requests">${g}<text x="${W - m.r}" y="${H - 2}" text-anchor="end" font-size="11" fill="var(--muted)">now</text><text x="${m.l}" y="${H - 2}" font-size="11" fill="var(--muted)">15 s ago</text></svg></div>`; };
  const run = () => { if (timer){ clearInterval(timer); timer = null; el.querySelector('[data-a="run"]').textContent = 'Start'; return; }
    el.querySelector('[data-a="run"]').textContent = 'Pause'; timer = setInterval(() => { if (!el.isConnected){ clearInterval(timer); return; } step(); draw(); }, TK); };
  el.querySelector('.wg-btns').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.a === 'run') run(); else { pend += 15; if (!timer){ step(); draw(); } } };
  el.querySelector('.wg-x').addEventListener('input', draw);
  for (let i = 0; i < 60; i++) step(); draw();
};

WG.quorum = el => controls(el, [
  {id: 'n', label: 'Replicas (N)', min: 1, max: 7, v: 3},
  {id: 'w', label: 'Write waits for (W)', min: 1, max: 7, v: 2},
  {id: 'r', label: 'Read asks (R)', min: 1, max: 7, v: 2}
], (V, out) => {
  const N = V.n, W = Math.min(V.w, N), R = Math.min(V.r, N), ov = Math.max(0, W + R - N);
  const row = (lab, f) => `<div class="qr"><span class="lab">${lab}</span>${[...Array(N)].map((_, i) => `<i class="${f(i)}">${i + 1}</i>`).join('')}</div>`;
  out.innerHTML = stats([[ov ? 'Reads see the latest write' : 'Stale reads possible', ov ? `yes, ${ov} replica${ov > 1 ? 's' : ''} overlap` : 'no overlap', `W + R = ${W + R} ${ov ? '>' : '≤'} N = ${N}`], ['Writes keep working with', `${N - W} down`], ['Reads keep working with', `${N - R} down`]]) +
    `<div class="qbox">${row('Write acked by', i => i < W ? 'w' : '')}${row('Read asks', i => i >= N - R ? (i < W ? 'r both' : 'r') : '')}</div>` +

// ---------- notes markup ----------
function render(src){
  const lines = src.split('\n'); let out = '', i = 0;
  while (i < lines.length){
    const L = lines[i];
    if (!L.trim()){ i++; continue; }
    if (L.startsWith('### ')){ out += `<h3 class="h3">${inl(L.slice(4))}</h3>`; i++; continue; }
    if (L.startsWith('## ')){ out += `<h2>${inl(L.slice(3))}</h2>`; i++; continue; }
    if (L.startsWith('- ')){ out += '<ul>'; while (i < lines.length && lines[i].startsWith('- ')){ out += `<li>${inl(lines[i].slice(2))}</li>`; i++; } out += '</ul>'; continue; }
    if (/^%%(flow|seq|layers|widget|state|tree|timeline|compare|matrix|bars)\b/.test(L)){ const mm = L.match(/^%%(\w+)\s*(.*)$/), b = []; i++; while (i < lines.length && lines[i].trim() !== '%%'){ if (lines[i].trim()) b.push(mm[1] === 'tree' ? lines[i].replace(/\s+$/, '') : lines[i].trim()); i++; } i++; out += diagram(mm[1], mm[2], b); continue; }
    if (L.startsWith('```')){ const c=[]; i++; while (i < lines.length && !lines[i].startsWith('```')){ c.push(lines[i]); i++; } i++; out += `<pre class="code">${esc(c.join('\n'))}</pre>`; continue; }
    if (/^\d+\. /.test(L)){ out += '<ol>'; while (i < lines.length && /^\d+\. /.test(lines[i])){ out += `<li>${inl(lines[i].replace(/^\d+\. /,''))}</li>`; i++; } out += '</ol>'; continue; }
    if (L.startsWith('> ')){ out += `<div class="take"><div class="lab">Key takeaway</div><p>${inl(L.replace(/^> (Takeaway: )?/,''))}</p></div>`; i++; continue; }
    if (L.startsWith('! ')){ const b = []; while (i < lines.length && lines[i].startsWith('! ')){ b.push(lines[i].slice(2)); i++; }
      const t = b[0].replace(/^Example:\s*/,''); out += `<div class="ex"><div class="lab">Worked example</div><p><strong>${inl(t)}</strong></p>${b.slice(1).map(x => `<p>${inl(x)}</p>`).join('')}</div>`; continue; }
    if (L.startsWith('| ')){ out += '<div class="tbl"><table>'; while (i < lines.length && lines[i].startsWith('| ')){ out += '<tr>' + lines[i].slice(2).replace(/\s*\|\s*$/,'').split(' | ').map(c => `<td>${inl(c)}</td>`).join('') + '</tr>'; i++; } out += '</table></div>'; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(## |### |- |> |! |\| |\d+\. |```|%%)/.test(lines[i])){ p.push(lines[i]); i++; }
    if (!p.length){ out += `<p>${inl(L)}</p>`; i++; continue; }
    out += `<p>${inl(p.join(' '))}</p>`;
  }
  return out;
}

function ringSVG(v, max, size = 54){ const r = size/2 - 5, C = 2 * Math.PI * r, p = Math.min(1, v / max);

}

function rate(v){
  const k = rq.shift(), before = xp(), r = st.rev[k] || {n: 0, box: 0};
  r.n = (r.n || 0) + 1; r.at = now();
  if (v === 1){ r.box = 0; r.due = today(); rq.push(k); }
  else if (v === 2){ r.box = Math.max(1, r.box || 0); r.due = addDays(today(), 1); }
  else { r.box = Math.min(5, (r.box || 0) + 1); r.due = addDays(today(), BOX[r.box]); }
  st.rev[k] = r; lsSet(); bump(); rsess++;
  if (db) db.doc('reviews/' + k).set(r).catch(() => {});
  rflip = false; award(5, v === 3 ? 'Recalled' : 'Reviewed', before); reviewPage();
  if (!rq.length) confetti(120);
}

// ---------- feedback: toasts, confetti ----------
function toast(html, big){ const t = document.createElement('div'); t.className = 'toast' + (big ? ' big' : ''); t.innerHTML = html; $('#toasts').appendChild(t); setTimeout(() => t.remove(), big ? 3200 : 2200); }
function confetti(n){
  if (RM) return; const cv = $('#cf'), x = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#2E80D9', '#8A9573', '#1B9EA6', '#DBA292', '#F1CF4E', '#B66DD0', '#272727'];
  const ps = Array.from({length: n}, () => ({x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .62, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, s: Math.random() * 6 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)]}));
  let f = 0; (function tick(){ x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .42; p.vx *= .985; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); });
    if (++f < 130) requestAnimationFrame(tick); else x.clearRect(0, 0, cv.width, cv.height); })();
}

// ---------- routing ----------
function route(){
  const h = location.hash.slice(1);
  if (/^m\d\d$/.test(h)){ cur = {page: 'module', mod: h.slice(1), k: null}; modulePage(h.slice(1)); }
  else if (/^l\d\d-\d\d$/.test(h)){ const k = h.slice(1); cur = {page: 'lesson', mod: k.slice(0, 2), k}; lessonPage(k); }
  else if (h === 'review'){ cur = {page: 'review', mod: null, k: null}; reviewPage(); }
  else { cur = {page: 'home', mod: null, k: null}; home(); }
  chrome(); onScroll();
}
function rerender(){ const y = scrollY; route(); scrollTo(0, y); }
function onScroll(){
  const rb = $('#readbar');
  if (cur.page !== 'lesson'){ rb.style.width = '0'; return; }
  const H = document.documentElement.scrollHeight - innerHeight; rb.style.width = (H > 0 ? Math.min(1, scrollY / H) * 100 : 0) + '%';
  const as = [...document.querySelectorAll('#toc a')]; let on = null;
  as.forEach(a => { const el = document.getElementById(a.dataset.to); if (el && el.getBoundingClientRect().top < innerHeight * 0.3) on = a; });

}
addEventListener('scroll', onScroll, {passive: true});
document.addEventListener('click', e => { const a = e.target.closest('#toc a'); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.to)?.scrollIntoView({behavior: RM ? 'auto' : 'smooth'}); });
let lastHash = location.hash;
const bucket = () => { const w = innerWidth || 800; return w < 641 ? 0 : w < 960 ? 1 : w < 1280 ? 2 : 3; };
let _b = bucket(); addEventListener('resize', () => { const b = bucket(); if (b !== _b){ _b = b; if (cur.page !== 'review') rerender(); } });
addEventListener('hashchange', () => { if (location.hash !== '#review') { rq = null; rflip = false; rsess = 0; } route(); if (location.hash !== lastHash) scrollTo(0, 0); lastHash = location.hash; });

}

    try { const t = st.notes[k]; t.trim() ? await db.doc('notes/' + k).set({text: t, at: now()}) : await db.doc('notes/' + k).delete(); if (el) el.textContent = 'Saved'; }
    catch(err){ if (el) el.textContent = 'Saved in this browser only'; }

// ---------- shared persistence ----------
(async () => {
  try { db = window.claude && await window.claude.use('db'); } catch(e){ db = null; }
  if (!db) return;
  const sync = () => { if (document.activeElement?.dataset?.note || cur.page === 'review' || $('#pal').classList.contains('on')) chrome(); else rerender(); };
  let first = true;
  db.collection('progress').onSnapshot(snap => {
    const d = {}, at = {}; snap.docs.forEach(s => { const v = s.data(); if (v?.done){ d[s.id] = true; if (v.at) at[s.id] = v.at; } });
    if (first){ Object.keys(st.done).forEach(k => { if (st.done[k] && !d[k]){ d[k] = true; at[k] = st.at[k] || now(); db.doc('progress/' + k).set({done: true, at: at[k]}).catch(() => {}); } }); first = false; }
    const changed = JSON.stringify(d) !== JSON.stringify(Object.fromEntries(Object.entries(st.done).filter(([, v]) => v)));
    st.done = d; st.at = at; lsSet(); changed ? sync() : chrome();
  }, () => {});
  db.collection('notes').onSnapshot(snap => {
    snap.docs.forEach(s => { const t = s.data()?.text; const el = document.getElementById('ans-' + s.id); if (t != null && document.activeElement !== el){ st.notes[s.id] = t; if (el) el.value = t; } });
    lsSet();
  }, () => {});
  db.collection('flags').onSnapshot(snap => {
    const f = {}; snap.docs.forEach(s => f[s.id] = true); st.flags = f; lsSet();
    document.querySelectorAll('[data-flag]').forEach(b => { const on = !!f[b.dataset.flag]; b.classList.toggle('on', on); b.textContent = on ? 'reported' : 'report'; });
  }, () => {});
  const coll = (name, field, map) => db.collection(name).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(s => { const v = s.data(); if (v) o[s.id] = map(v); });
    const ch = JSON.stringify(o) !== JSON.stringify(st[field]); st[field] = o; lsSet(); if (ch) sync();
  }, () => {});
  coll('grades', 'grades', v => ({g: v.g, at: v.at}));
  coll('reviews', 'rev', v => ({n: v.n, box: v.box, due: v.due, at: v.at}));
  coll('activity', 'act', v => v.n || 0);
})();
addEventListener('load', () => mathify($('#view')));
</script>
