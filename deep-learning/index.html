ns all of them.\n\n## Choice of target: epsilon, x0 or v\nThe network can output any of three quantities and the others follow algebraically:\n- $\\hat x_0=(x_t-\\sqrt{1-\\bar\\alpha_t}\\,\\hat\\epsilon)/\\sqrt{\\bar\\alpha_t}$\n- $v=\\sqrt{\\bar\\alpha_t}\\,\\epsilon-\\sqrt{1-\\bar\\alpha_t}\\,x_0$, and $\\hat x_0=\\sqrt{\\bar\\alpha_t}\\,x_t-\\sqrt{1-\\bar\\alpha_t}\\,\\hat v$\n\nThey are equivalent at the optimum but not in training. An MSE on $\\epsilon$ equals an MSE on $x_0$ weighted by SNR$(t)$, so it pays little attention to very noisy steps and, at $\\bar\\alpha_t\\to 0$, becomes useless: the input is pure noise, so predicting $\\epsilon$ is just copying the input, and converting to $\\hat x_0$ divides by $\\sqrt{\\bar\\alpha_t}\\approx 0$. Predicting $x_0$ has the mirror problem at low noise. **v-prediction** (Salimans and Ho, 2022) stays well scaled at both ends, which is why zero-terminal-SNR schedules and distilled samplers use it. A separate knob is per-step loss weighting; **Min-SNR-$\\gamma$** clips the effective weight at $\\gamma=5$ so the easy low-noise steps do not dominate the gradient, and reported roughly 3x faster convergence.\n\n! Example: converting a prediction\n! At a step with $\\bar\\alpha_t=0.25$, a pixel has $x_t=0.5$ and the network predicts $\\hat\\epsilon=0.4$.\n! $\\hat x_0=(0.5-\\sqrt{0.75}\\cdot0.4)/\\sqrt{0.25}=(0.5-0.346)/0.5=0.31$.\n! The equivalent v-target is $\\hat v=\\sqrt{0.25}\\cdot0.4-\\sqrt{0.75}\\cdot0.307=0.2-0.266=-0.07$.\n! Any sampler can take whichever form it needs from the same network output.\n\n## Telling the network which step it is on\nA single network handles all 1000 noise levels, so it must know $t$; the right amount of denoising at $t=50$ and $t=900$ is very different. The step index is encoded with the transformer-style **sinusoidal embedding**: for frequencies $\\omega_k=10000^{-k/(d/2)}$, the vector $[\\sin(t\\omega_k), \\cos(t\\omega_k)]$. An MLP (Linear, SiLU, Linear) maps it to a conditioning vector, and every residual block adds a projection of it to its feature maps, or uses it to produce a per-channel scale and shift after normalisation (FiLM / adaptive GroupNorm). Continuous-time models feed $\\log$SNR or $\\sigma$ instead of an integer step; the mechanism is the same.\n\n## The U-Net denoiser\nThe denoiser must output a tensor the same shape as its input and must combine global structure with pixel-exact detail. The U-Net (covered in this course's Computer Vision module for segmentation) does exactly that: a downsampling path, a bottleneck and an upsampling path with skip connections at every resolution. Diffusion U-Nets add:\n\n%%layers DDPM-style U-Net for 32x32 images; every block also receives the timestep embedding.\nInput 32x32x3 | conv to 128 channels\nDown path | 2 residual blocks per level, then downsample: 32, 16, 8, 4\n*Middle | residual, self-attention, residual at 4x4\nUp path | concatenate the skip from the same resolution, residual blocks, upsample\nOutput 32x32x3 | GroupNorm, SiLU, conv to the predicted noise\n%%\n\n- Residual blocks of GroupNorm, SiLU and 3x3 convolutions, with the time embedding injected between the two convolutions.\n- Self-attention at 16x16 and below, where it is affordable, so distant parts of the image agree.\n- A final conv often initialised to zero, so the untrained model starts near a sensible output.\n\nThe DDPM CIFAR-10 model has about 36M parameters and reached FID 3.17. Latent diffusion runs the same U-Net on a 64x64x4 VAE latent and adds cross-attention to text (lesson 07.07). The **Diffusion Transformer** (DiT) replaces the U-Net with a ViT over latent patches and injects $t$ and the class through adaLN-Zero; it scales more predictably with compute and underlies most recent large models.\n\n> Takeaway: diffusion training is plain regression: noise a clean sample to a random step in closed form and train one timestep-conditioned network (usually a U-Net or DiT) to predict the noise, or equivalently $x_0$ or $v$, with a weighting that decides which noise levels it learns best.","q":"You switch a working model from $\\epsilon$-prediction to zero-terminal-SNR, so at $t=T$ the input is pure noise. Training still uses $\\epsilon$-MSE, and samples come out as washed-out mush. Explain what the network learns at $t=T$ and what goes wrong when the sampler converts $\\hat\\epsilon$ into $\\hat x_0$.","s":"At $t=T$ with $\\bar\\alpha_T=0$, the input is $x_T=\\epsilon$ exactly. The $\\epsilon$-MSE optimum is therefore the identity: the network copies its input and learns nothing about the data at that step, while the loss there is trivially zero. The sampler, however, needs $\\hat x_0$ (or a mean) and computes $\\hat x_0=(x_t-\\sqrt{1-\\bar\\alpha_t}\\hat\\epsilon)/\\sqrt{\\bar\\alpha_t}$, which is $0/0$ at $t=T$ and wildly amplified near it: any small error in $\\hat\\epsilon$ is divided by a tiny $\\sqrt{\\bar\\alpha_t}$. The first, most important steps, which set global layout and brightness, are thus driven by noise or by whatever clipping you apply. Switching the target to $v$ (or $x_0$) fixes it: at $t=T$, $v=-x_0$, so the network must predict the data mean given no information, a well-posed and well-scaled target, and conversion to $\\hat x_0$ involves no division by $\\sqrt{\\bar\\alpha_t}$.","r":[["Ho, Jain and Abbeel: Denoising Diffusion Probabilistic Models","https://arxiv.org/abs/2006.11239","Section 3 derives the epsilon parameterisation and the simple loss; appendix B has the U-Net details."],["Salimans and Ho: Progressive Distillation for Fast Sampling of Diffusion Models","https://arxiv.org/abs/2202.00512","Section 4 and appendix D introduce v-prediction and compare parameterisations."],["Hang et al.: Efficient Diffusion Training via Min-SNR Weighting Strategy","https://arxiv.org/abs/2303.09556","Loss weighting across noise levels as a multi-task balance problem."],["Peebles and Xie: Scalable Diffusion Models with Transformers","https://arxiv.org/abs/2212.09748","DiT and adaLN-Zero conditioning, the transformer alternative to the U-Net."]],"k":["diffusion","U-Net","v-prediction"],"x":["PyTorch"],"p":["noise-prediction-loss","toy-diffusion-training-step","prediction-parameterization","sinusoidal-timestep-embedding","time-conditioned-residual-block"],"ak":""},{"id":"07.05","t":"Diffusion: sampling with DDPM and DDIM","n":["DDPM ancestral sampling runs all $T$ reverse steps: compute the posterior mean from $\\hat\\epsilon$, add fresh noise $\\sigma_t z$, repeat. 1000 network calls per sample.","The target of each step is the forward posterior $q(x_{t-1}\\mid x_t,x_0)$, a Gaussian with closed-form mean and variance $\\tilde\\beta_t=\\frac{1-\\bar\\alpha_{t-1}}{1-\\bar\\alpha_t}\\beta_t$, evaluated at the predicted $\\hat x_0$.","DDIM keeps the same marginals but uses a non-Markovian process, giving an update 'predict $\\hat x_0$, re-noise to the next level' whose stochasticity is a dial $\\eta$ (0 = deterministic).","Because the network was only trained on marginals $q(x_t\\mid x_0)$, DDIM can visit any decreasing subsequence of steps: 50 steps instead of 1000 with the same trained model.","Deterministic sampling makes noise-to-image a fixed map, enabling inversion, interpolation and reproducible seeds; quality at very low step counts needs better ODE solvers or distillation."],"a":"## Where we are\nLessons 07.03 and 07.04 gave us a schedule $\\bar\\alpha_t$ and a trained network $\\epsilon_\\theta(x_t, t)$. Sampling turns that network into images by running the reverse process from pure noise. The design question is how many network calls you spend: each one is a full forward pass of a large U-Net or DiT, so step count is roughly cost. (The Inference Engineering course, Specialized Inference Workloads, covers serving-side step budgets; this lesson covers the maths.)\n\n## The forward posterior\nThe reverse step is trained to match $q(x_{t-1}\\mid x_t, x_0)$, the forward process run backwards when you know the clean image. Bayes' rule on Gaussians gives it in closed form:\n\n$$q(x_{t-1}\\mid x_t,x_0)=\\mathcal N\\big(\\tilde\\mu_t,\\ \\tilde\\beta_t I\\big),\\quad \\tilde\\mu_t=\\frac{\\sqrt{\\bar\\alpha_{t-1}}\\,\\beta_t}{1-\\bar\\alpha_t}x_0+\\frac{\\sqrt{\\alpha_t}\\,(1-\\bar\\alpha_{t-1})}{1-\\bar\\alpha_t}x_t,\\quad \\tilde\\beta_t=\\frac{1-\\bar\\alpha_{t-1}}{1-\\bar\\alpha_t}\\beta_t$$\n\nAt sampling time we do not know $x_0$, so we plug in the network's estimate $\\hat x_0$. Substituting $\\hat x_0$ from $\\hat\\epsilon$ gives exactly the mean from lesson 07.04.\n\n## DDPM ancestral sampling\n1. Draw $x_T\\sim\\mathcal N(0, I)$.\n2. For $t=T,\\dots,1$: predict $\\hat\\epsilon=\\epsilon_\\theta(x_t,t)$, compute $\\mu=\\frac{1}{\\sqrt{\\alpha_t}}\\big(x_t-\\frac{\\beta_t}{\\sqrt{1-\\bar\\alpha_t}}\\hat\\epsilon\\big)$, then $x_{t-1}=\\mu+\\sigma_t z$ with $z\\sim\\mathcal N(0, I)$, and no noise on the final step.\n3. Return $x_0$, clipped to $[-1, 1]$.\n\nThe variance $\\sigma_t^2$ can be $\\beta_t$ or $\\tilde\\beta_t$; DDPM found both work similarly at $T=1000$ (they are the upper and lower bounds for the true reverse variance), while Improved DDPM learns an interpolation between them, which matters when you use fewer steps. Fresh noise is injected at every step, so the chain can correct earlier mistakes, but it needs all 1000 steps: skipping steps breaks the small-$\\beta$ Gaussian assumption.\n\n## DDIM: same model, different sampler\nSong, Meng and Ermon (2020) observed that the training loss only depends on the marginals $q(x_t\\mid x_0)$, never on the step-to-step process. Many forward processes share those marginals, including non-Markovian ones whose reverse step is\n\n$$x_{t'}=\\sqrt{\\bar\\alpha_{t'}}\\,\\hat x_0+\\sqrt{1-\\bar\\alpha_{t'}-\\sigma^2}\\;\\hat\\epsilon+\\sigma z,\\qquad \\hat x_0=\\frac{x_t-\\sqrt{1-\\bar\\alpha_t}\\,\\hat\\epsilon}{\\sqrt{\\bar\\alpha_t}}$$\n\nfor any earlier step $t'<t$. Read it as: estimate the clean image, then re-noise it to the next level, reusing the predicted noise direction for most of the noise. The free parameter is $\\sigma=\\eta\\sqrt{\\tfrac{1-\\bar\\alpha_{t'}}{1-\\bar\\alpha_t}}\\sqrt{1-\\tfrac{\\bar\\alpha_t}{\\bar\\alpha_{t'}}}$. With $\\eta=1$ and consecutive steps it reproduces DDPM; with $\\eta=0$ it is **deterministic**.\n\n%%flow One DDIM step: denoise to an estimate of x0, then jump straight to the next noise level.\nxt -(network)-> eps hat -(invert closed form)-> *x0 hat -(re-noise to t prime)-> x t prime\n%%\n\n```python\ndef ddim_step(model, xt, t, t_prev, abar, eta=0.0):\n    a, a_prev = abar[t], abar[t_prev]                 # t_prev < t; abar of \"step 0\" is 1\n    eps = model(xt, t)\n    x0 = ((xt - (1 - a).sqrt() * eps) / a.sqrt()).clamp(-1, 1)\n    sigma = eta * ((1 - a_prev) / (1 - a)).sqrt() * (1 - a / a_prev).sqrt()\n    dir_xt = (1 - a_prev - sigma**2).sqrt() * eps\n    return a_prev.sqrt() * x0 + dir_xt + sigma * torch.randn_like(xt)\n```\n\nClipping $\\hat x_0$ is a cheap guard against the network's early, very uncertain predictions pushing pixels out of range; it is standard for pixel-space models and must be removed for latent models, whose latents are not bounded.\n\n## Step skipping\nSince each DDIM update jumps between arbitrary levels, you can sample on a subsequence: 50 evenly spaced steps (every 20th) or 20 steps, with the same trained network. DDIM reported 10 to 50 times faster sampling at comparable quality, and deterministic DDIM degrades far more gracefully at low step counts than ancestral sampling. How you space the subsequence matters: spacing evenly in $t$ for a linear schedule wastes calls at high noise, and many samplers space steps in $\\log$SNR or use the EDM $\\sigma$ spacing (lesson 07.06), and always include the final step so the last update lands on clean data.\n\n! Example: one deterministic DDIM jump\n! Jump from a level with $\\bar\\alpha_t=0.5$ to $\\bar\\alpha_{t'}=0.8$. A pixel has $x_t=1.0$ and the network predicts $\\hat\\epsilon=0.6$; $\\eta=0$.\n! $\\hat x_0=(1.0-\\sqrt{0.5}\\cdot0.6)/\\sqrt{0.5}=(1.0-0.424)/0.707=0.814$.\n! $x_{t'}=\\sqrt{0.8}\\cdot0.814+\\sqrt{0.2}\\cdot0.6=0.728+0.268=0.997$.\n! The pixel moves towards its predicted clean value while keeping the same noise direction at a lower magnitude.\n\n## What determinism buys, and its limits\nWith $\\eta=0$ the sampler is a fixed function from $x_T$ to $x_0$. The same seed always gives the same image; interpolating between two noise vectors interpolates images smoothly; and running the update backwards (**DDIM inversion**) maps a real image to a noise vector that regenerates it, the basis of many editing methods. DDIM is in fact a first-order (Euler) discretisation of the probability-flow ODE introduced in the next lesson, which is why higher-order ODE solvers (Heun, DPM-Solver) get good images in 10 to 25 steps, and why distillation methods target 1 to 4 steps.\n\n| Sampler | Calls per image | Stochastic | Typical use\n| DDPM ancestral | 1000 | yes | reference quality, slow\n| DDIM, $\\eta=0$ | 20 to 100 | no | fast, invertible, reproducible\n| DDIM, $0<\\eta\\le1$ | 50 to 250 | partly | trades speed for robustness\n| Higher-order ODE solvers | 10 to 25 | no | default in modern pipelines\n\n> Takeaway: ancestral DDPM sampling walks all $T$ posterior steps with fresh noise; DDIM reuses the same network to predict $\\hat x_0$ and re-noise to any lower level, so it can skip steps and run deterministically, cutting sampling cost by 10 to 50 times.","q":"A DDIM sampler with 20 steps on a pixel-space model produces good images. Your teammate switches to DDPM ancestral sampling but keeps the same 20-step subsequence, using $\\sigma_t^2=\\beta_t$ from the original 1000-step schedule at each visited step. Images become noisy and grainy. Why?","s":"Ancestral DDPM is derived for consecutive steps with small $\\beta_t$: the reverse step's variance and the coefficient on $\\hat\\epsilon$ assume the chain removes only one step's worth of noise. On a 20-step subsequence each jump spans about 50 original steps, but the update still removes noise using one step's $\\beta_t$ and adds $\\sigma_t z$ sized for a single step. The mean therefore removes far too little noise per jump while fresh noise keeps being injected, so the sample arrives at $t=0$ with leftover noise. To use a subsequence with a stochastic sampler you must recompute the effective $\\beta$ between visited steps, $1-\\bar\\alpha_t/\\bar\\alpha_{t'}$, and the matching posterior variance, which is what DDIM's general formula with $\\eta=1$ does automatically.","r":[["Song, Meng and Ermon: Denoising Diffusion Implicit Models","https://arxiv.org/abs/2010.02502","Sections 3 and 4: non-Markovian forward processes, the eta family and step skipping."],["Ho, Jain and Abbeel: Denoising Diffusion Probabilistic Models","https://arxiv.org/abs/2006.11239","Algorithm 2 (ancestral sampling) and the posterior in equation 7."],["Nichol and Dhariwal: Improved Denoising Diffusion Probabilistic Models","https://arxiv.org/abs/2102.09672","Learned reverse variances and why they matter for fewer sampling steps."],["Hugging Face Diffusers: Schedulers","https://huggingface.co/docs/diffusers/api/schedulers/overview","How production code exposes DDPM, DDIM and ODE-solver samplers over the same model."]],"k":["diffusion","DDIM","sampling"],"x":["PyTorch"],"p":["ddim-step","ddpm-ancestral-step","posterior-mean-and-variance","toy-ddpm-sampler"],"ak":""},{"id":"07.06","t":"Score matching and flow matching","n":["The score $\\nabla_x\\log p(x)$ points towards higher density and does not need the normalising constant; Langevin dynamics turns a score into a sampler.","Denoising score matching learns the score of noised data by regressing $-\\epsilon/\\sigma$, which makes a noise predictor a score model: $s_\\theta(x_t,t)=-\\epsilon_\\theta(x_t,t)/\\sqrt{1-\\bar\\alpha_t}$.","In continuous time, diffusion is an SDE; its reverse needs only the score, and the probability-flow ODE $dx=[f-\\tfrac12 g^2\\nabla\\log p_t]\\,dt$ has the same marginals with no randomness.","Flow matching skips the SDE: pick a path from noise to data, e.g. $x_t=(1-t)x_0+t x_1$, and regress the velocity $x_1-x_0$; sampling integrates the learned ODE.","Straighter paths need fewer ODE steps, which is the main reason flow-matching models (SD3, Flux) sample well in 20 to 30 steps."],"a":"## Scores: densities without normalisation\nA generative model of images is hard to write as a density $p(x)$ because $p$ must integrate to 1 over a million-dimensional space. The **score** sidesteps that. For $p(x)=e^{-E(x)}/Z$, the score is $s(x)=\\nabla_x\\log p(x)=-\\nabla_x E(x)$: the constant $Z$ disappears. The score is a vector field pointing uphill in density. If you know it you can sample with **Langevin dynamics**:\n\n$$x_{k+1}=x_k+\\tfrac{\\eta}{2}\\,s(x_k)+\\sqrt{\\eta}\\,z_k,\\qquad z_k\\sim\\mathcal N(0,I)$$\n\nwhich, for small step $\\eta$ and many steps, produces samples from $p$. Gradient ascent alone would collapse onto the modes; the injected noise keeps the spread right.\n\n## Learning a score by denoising\nWe cannot regress the true score directly because we do not know it. **Denoising score matching** (Vincent, 2011) gets around this. Perturb data with Gaussian noise, $\\tilde x=x+\\sigma\\epsilon$. The score of the perturbation kernel is known, $\\nabla_{\\tilde x}\\log q(\\tilde x\\mid x)=-(\\tilde x-x)/\\sigma^2=-\\epsilon/\\sigma$, and minimising $\\mathbb E\\,\\|s_\\theta(\\tilde x,\\sigma)+\\epsilon/\\sigma\\|^2$ has the same minimiser as matching the score of the noised data distribution. That regression target is the noise, rescaled. So for the variance-preserving process:\n\n$$s_\\theta(x_t,t)=-\\frac{\\epsilon_\\theta(x_t,t)}{\\sqrt{1-\\bar\\alpha_t}}$$\n\nA DDPM noise predictor already is a score model. Song and Ermon (2019) arrived at diffusion from this side: one network conditioned on many noise levels $\\sigma_1>\\dots>\\sigma_L$ (large noise fills low-density regions where the data score is unlearnable), sampled by **annealed Langevin dynamics**, a few Langevin steps at each level from largest to smallest.\n\n! Example: a denoising score target in 1-D\n! A data point $x=2.0$ is perturbed with $\\sigma=0.5$ and $\\epsilon=0.4$, so $\\tilde x=2.2$.\n! Target score: $-\\epsilon/\\sigma=-0.8$, the same as $-(\\tilde x-x)/\\sigma^2=-0.2/0.25$.\n! It points from the noisy point back towards the data, with magnitude growing as $1/\\sigma$: small noise means a steep pull.\n\n## Continuous time: SDEs and the probability-flow ODE\nSong et al. (2021) unified both views. Let the step count go to infinity and the forward process becomes a stochastic differential equation $dx=f(x,t)\\,dt+g(t)\\,dw$; the variance-preserving DDPM chain is $f=-\\tfrac12\\beta(t)x$, $g=\\sqrt{\\beta(t)}$. A classical result says this SDE has a reverse-time SDE\n\n$$dx=\\big[f(x,t)-g(t)^2\\nabla_x\\log p_t(x)\\big]dt+g(t)\\,d\\bar w$$\n\nwhich needs only the score of each noisy marginal $p_t$, exactly what the network learns. Ancestral sampling is a discretisation of it. The same paper showed there is also a deterministic **probability-flow ODE** with identical marginals $p_t$:\n\n$$dx=\\big[f(x,t)-\\tfrac12 g(t)^2\\nabla_x\\log p_t(x)\\big]dt$$\n\n%%layers Three ways to use the same learned score, from most to least random.\nAnnealed Langevin | many noisy steps per noise level, corrects as it goes\nReverse SDE | one noisy step per level; ancestral DDPM is its discretisation\n*Probability-flow ODE | deterministic; DDIM is its Euler step; any ODE solver works\n%%\n\nThe ODE view explains the previous lesson: DDIM is an Euler step of this ODE. It also allows exact likelihoods (via the change-of-variables formula) and off-the-shelf higher-order solvers. Karras et al.'s **EDM** writes the process as $x=x_0+\\sigma\\epsilon$, where the ODE is simply $dx/d\\sigma=(x-D_\\theta(x;\\sigma))/\\sigma$ for a denoiser $D_\\theta$; with a Heun solver and a $\\sigma$ grid dense near the data it reaches state-of-the-art quality in about 35 network calls.\n\n## Flow matching\nIf sampling is integrating an ODE from noise to data, why not learn the ODE's velocity field directly? **Flow matching** (Lipman et al., 2022; rectified flow, Liu et al., 2022) does that. Pair a noise sample $x_0\\sim\\mathcal N(0,I)$ with a data sample $x_1$ and define a path between them, most simply the straight line\n\n$$x_t=(1-t)\\,x_0+t\\,x_1,\\qquad t\\in[0,1]$$\n\nwhose velocity is $u=x_1-x_0$. Train $v_\\theta(x_t,t)$ to match it:\n\n$$L_\\text{CFM}=\\mathbb E_{t,\\,x_0,\\,x_1}\\big\\|v_\\theta(x_t,t)-(x_1-x_0)\\big\\|^2$$\n\nAs with denoising score matching, regressing the per-pair (conditional) target gives the correct marginal velocity field in expectation, even though individual paths cross. Sampling draws $x_0$ and integrates $dx/dt=v_\\theta(x,t)$ from $t=0$ to 1, for example with Euler steps $x\\leftarrow x+\\Delta t\\,v_\\theta(x,t)$.\n\n```python\ndef cfm_loss(model, x1):                       # x1: batch of data\n    x0 = torch.randn_like(x1)\n    t = torch.rand(x1.shape[0], 1, 1, 1)\n    xt = (1 - t) * x0 + t * x1\n    return ((model(xt, t) - (x1 - x0)) ** 2).mean()\n```\n\nNotice the convention: here $t=0$ is noise and $t=1$ is data, the opposite of DDPM's step index. Libraries disagree, so check before reusing code.\n\n## Why straight paths matter\nAn ODE solver's error grows with path curvature. Diffusion's probability-flow paths curve noticeably, so few-step Euler sampling drifts off course. Linear interpolation paths are straight per pair; the learned marginal field is not perfectly straight, but it is much straighter, and \"reflow\" (retraining on the model's own noise-image pairs) straightens it further, towards one-step generation. Flow matching is also simpler: no $\\beta$ schedule, no $\\bar\\alpha$, no variance bookkeeping. Gaussian diffusion is a special case with a particular curved path and weighting, so the two families differ in path choice and time weighting more than in kind. Stable Diffusion 3 and Flux use rectified-flow objectives with time sampled from a logit-normal distribution that emphasises the middle of the path.\n\n> Takeaway: a noise predictor is a score model, the score defines a reverse SDE and a deterministic probability-flow ODE with the same marginals, and flow matching learns an ODE velocity field directly by regressing $x_1-x_0$ along straight noise-to-data paths, which makes few-step sampling easier.","q":"A flow-matching model trained with the straight path $x_t=(1-t)x_0+t x_1$ is sampled with 4 Euler steps and looks fine; a DDPM-trained model sampled with 4 DDIM (Euler) steps looks blurry and wrong. Both are well trained. Explain the difference in terms of the ODE each sampler integrates.","s":"Both samplers integrate an ODE whose marginals match the data, but the trajectories differ. DDPM's probability-flow ODE follows curved paths: early on, the estimate $\\hat x_0$ is a blurry average of many plausible images, and the trajectory bends as the prediction sharpens. A 4-step Euler integration takes large straight steps along the tangent at each point, so it overshoots the curve and ends somewhere off the data manifold, often near the blurry average. The flow-matching velocity field is trained on straight noise-to-data pairs, so its marginal trajectories are much less curved, and a straight Euler step along the tangent stays close to the true path. Euler's error scales with curvature times step size squared, so straighter paths tolerate far larger steps. Remedies for the diffusion model are a higher-order solver, step spacing concentrated where curvature is high, or distillation.","r":[["Song et al.: Score-Based Generative Modeling through Stochastic Differential Equations","https://arxiv.org/abs/2011.13456","The SDE view, the reverse SDE and the probability-flow ODE (sections 3 and 4)."],["Yang Song: Generative Modeling by Estimating Gradients of the Data Distribution","https://yang-song.net/blog/2021/score/","The author's own long-form explanation of score matching, Langevin and the SDE picture."],["Lipman et al.: Flow Matching for Generative Modeling","https://arxiv.org/abs/2210.02747","Conditional flow matching and why the per-sample target gives the right marginal field."],["Karras et al.: Elucidating the Design Space of Diffusion-Based Generative Models","https://arxiv.org/abs/2206.00364","EDM: the sigma-space ODE, Heun sampling and the step-spacing recipe."]],"k":["score matching","probability-flow ODE","flow matching"],"x":["PyTorch"],"p":["denoising-score-matching-loss","conditional-flow-matching-loss","gaussian-mixture-score","annealed-langevin-dynamics","karras-euler-sampler"],"ak":""},{"id":"07.07","t":"Guidance and conditioning","n":["A conditional diffusion model learns $\\epsilon_\\theta(x_t,t,c)$; the condition enters through embedding addition (classes), cross-attention (text tokens), adaptive normalisation (DiT) or input concatenation (images, masks).","Bayes gives $\\nabla\\log p(x\\mid y)=\\nabla\\log p(x)+\\nabla\\log p(y\\mid x)$, so classifier guidance adds a scaled gradient from a classifier trained on noisy inputs.","Classifier-free guidance trains one model with the condition dropped 10 to 20 percent of the time and samples with $\\hat\\epsilon=\\epsilon_u+w(\\epsilon_c-\\epsilon_u)$; $w>1$ sharpens adherence to $c$.","Guidance trades diversity for fidelity: FID usually bottoms out at a small $w$, and high $w$ oversaturates; rescaling the guided prediction's standard deviation reduces the artefacts.","CFG doubles the network calls per step (batched as one pass of size $2B$), and negative prompts are just a different unconditional branch."],"a":"## Conditioning: getting the prompt into the network\nAn unconditional model generates any image from the training distribution. Useful models generate an image *of something*: a class label, a caption, a sketch, the unmasked part of a photo. A conditional model simply learns $\\epsilon_\\theta(x_t, t, c)$ with the same loss as before (lesson 07.04); the work is in how $c$ reaches the network.\n\n| Condition | Mechanism | Example\n| Class label | Learned embedding added to the timestep embedding | ImageNet class-conditional U-Nets\n| Text | Cross-attention: image features are queries, text-encoder tokens are keys and values | Latent (Stable) Diffusion\n| Class or pooled text in a transformer | adaLN: the condition sets per-channel scale, shift and gate | DiT\n| Image-shaped input | Concatenate to $x_t$ along channels | Inpainting (image plus mask), super-resolution\n| Spatial control on a frozen model | Trainable copy of the encoder feeding residuals into the U-Net | ControlNet\n\nCross-attention is the workhorse for text. At each U-Net resolution, flattened image features of shape (HW, C) attend over the prompt's token embeddings (77 tokens for CLIP-based models), so each image location can pick up the words relevant to it. Latent diffusion runs all of this on the 64x64x4 VAE latent from lesson 07.01, which makes 512x512 text-to-image affordable.\n\n## Classifier guidance\nConditioning alone often gives images that only loosely match $c$. **Guidance** strengthens the condition at sampling time. Bayes' rule on scores gives\n\n$$\\nabla_{x_t}\\log p(x_t\\mid y)=\\nabla_{x_t}\\log p(x_t)+\\nabla_{x_t}\\log p(y\\mid x_t)$$\n\nThe first term is the unconditional score (lesson 07.06). Dhariwal and Nichol (2021) trained a separate classifier $p_\\phi(y\\mid x_t, t)$ on noisy images and added its gradient with a scale $s$: in $\\epsilon$ form, $\\hat\\epsilon=\\epsilon_\\theta(x_t)-s\\sqrt{1-\\bar\\alpha_t}\\,\\nabla_{x_t}\\log p_\\phi(y\\mid x_t)$. With $s>1$ this samples from a sharpened distribution, roughly $p(x)\\,p(y\\mid x)^s$, which pushes samples towards images the classifier is very sure about. It let diffusion beat GANs on ImageNet, but needs a classifier trained on every noise level, and its gradients can be adversarial rather than meaningful.\n\n## Classifier-free guidance\nHo and Salimans (2022) removed the classifier. Train a single network on both tasks by replacing $c$ with a null token $\\varnothing$ for a random 10 to 20 percent of training examples. At sampling time, run it twice per step and extrapolate:\n\n$$\\hat\\epsilon=\\epsilon_\\theta(x_t,\\varnothing)+w\\,\\big(\\epsilon_\\theta(x_t,c)-\\epsilon_\\theta(x_t,\\varnothing)\\big)$$\n\nThe difference $\\epsilon_c-\\epsilon_u$ is, up to scale, the score of an implicit classifier $\\nabla\\log p(c\\mid x_t)$, so this is classifier guidance where the classifier comes free from the generative model. $w=0$ is unconditional, $w=1$ is the plain conditional model, and $w>1$ moves past the conditional prediction, away from the unconditional one. (The original paper writes $(1+w)\\epsilon_c-w\\epsilon_u$, so its $w$ is this $w$ minus 1; check the convention in any code you read.) Stable Diffusion's default is $w=7.5$.\n\n%%flow Each sampling step runs the same network twice and extrapolates from the unconditional prediction.\nxt -(with prompt)-> eps cond -(w times difference)-> *Guided eps -> Sampler step\nxt -(null prompt)-> eps uncond -> *Guided eps\n%%\n\n```python\ndef cfg_eps(model, xt, t, cond, null, w):\n    x2 = torch.cat([xt, xt]); c2 = torch.cat([cond, null])\n    e_c, e_u = model(x2, t.repeat(2), c2).chunk(2)   # one batched pass of size 2B\n    return e_u + w * (e_c - e_u)\n```\n\n! Example: guidance on one pixel\n! At some step the conditional prediction is $\\epsilon_c=0.50$ and the unconditional one is $\\epsilon_u=0.30$.\n! With $w=1$: $\\hat\\epsilon=0.50$. With $w=7.5$: $\\hat\\epsilon=0.30+7.5\\cdot0.20=1.80$.\n! The guided noise estimate lies far outside the range either branch predicts. Applied over every pixel and step, that extrapolation is what makes guided images vivid, and at high $w$, oversaturated.\n\n## Costs and failure modes\n- **Diversity loss.** Guidance concentrates mass on the most \"typical\" images for the prompt. FID typically improves from $w=1$ to a modest value, often well below the scales used in practice, and then worsens, while precision and prompt alignment keep rising. Choose $w$ for the use case, not by FID alone.\n- **Oversaturation.** Large $w$ inflates the magnitude of the predicted $\\hat x_0$, giving burnt colours and harsh contrast. **CFG rescale** (Lin et al., 2023) rescales the guided prediction so its standard deviation matches the conditional one, then blends with factor $\\phi\\approx0.7$; dynamic thresholding (Imagen) clips $\\hat x_0$ by a high percentile instead.\n- **Compute.** Two network evaluations per step. Batching them as one pass of size $2B$ keeps latency close to one call on an under-utilised GPU, but the FLOPs double. Distilled models fold guidance into the weights to remove the second pass.\n- **Negative prompts.** Replace $\\varnothing$ by the embedding of an unwanted concept; the extrapolation then moves away from it instead of away from the generic image.\n- **Dropout matters.** A model never trained with null conditions has a meaningless $\\epsilon_u$ and CFG produces garbage; this is a training-time decision.\n\n> Takeaway: condition the denoiser through embeddings, cross-attention, adaLN or concatenation, then strengthen the condition at sampling time with classifier-free guidance, which extrapolates from an unconditional to a conditional prediction of the same network; the scale $w$ trades diversity and naturalness for prompt fidelity.","q":"You fine-tune a text-to-image model on a new dataset but forget to keep the 10 percent caption dropout. At sampling time with $w=7.5$, images are noisy and incoherent, while $w=1$ looks reasonable. Explain why, and what you would do short of retraining from scratch.","s":"CFG needs $\\epsilon_\\theta(x_t,\\varnothing)$ to be a good unconditional prediction. Without caption dropout during fine-tuning, the network never sees the null condition on the new data, and its null-branch behaviour drifts as the shared weights change: the unconditional prediction becomes arbitrary and no longer approximates the unconditional score. At $w=1$ the null branch cancels out ($\\hat\\epsilon=\\epsilon_c$), so samples look fine. At $w=7.5$ the sampler extrapolates 6.5 times the difference between a sensible and a meaningless prediction, which injects large, structured error at every step. The fix is to continue fine-tuning with caption dropout restored (typically 10 to 20 percent), which re-teaches the null branch on the new data. As a stopgap, use a low $w$, or take the unconditional branch from the original pre-fine-tuning model, accepting some mismatch.","r":[["Ho and Salimans: Classifier-Free Diffusion Guidance","https://arxiv.org/abs/2207.12598","Joint conditional and unconditional training, the guidance formula and the FID vs IS trade-off."],["Dhariwal and Nichol: Diffusion Models Beat GANs on Image Synthesis","https://arxiv.org/abs/2105.05233","Classifier guidance and the noise-aware classifier (section 4)."],["Rombach et al.: High-Resolution Image Synthesis with Latent Diffusion Models","https://arxiv.org/abs/2112.10752","VAE latent space plus cross-attention conditioning on text."],["Sander Dieleman: Guidance, a cheat code for diffusion models","https://sander.ai/2022/05/26/guidance.html","Why guidance works, the Bayes-rule view and the temperature analogy."]],"k":["classifier-free guidance","cross-attention","conditioning"],"x":["PyTorch"],"p":["classifier-free-guidance","dit-patchify-and-adaln-zero-block","transformer-decoder-block"],"ak":""}]},{"n":"08","name":"Reinforcement learning foundations","lessons":[{"id":"08.01","t":"Markov decision processes","n":["An MDP is $(\\mathcal S,\\mathcal A,P,R,\\gamma)$: states, actions, transition probabilities $P(s'\\mid s,a)$, rewards and a discount. The Markov property says the current state is all you need to predict what comes next.","The agent maximises the expected return $G_t=\\sum_{k\\ge0}\\gamma^k r_{t+k+1}$; $\\gamma$ sets an effective horizon of about $1/(1-\\gamma)$ steps.","$V^\\pi(s)$ and $Q^\\pi(s,a)$ are expected returns under a policy $\\pi$; they satisfy the Bellman expectation equation, a linear system you can solve exactly when the model is known.","The optimal values satisfy the Bellman optimality equation, with a max over actions; acting greedily with respect to $Q^*$ is optimal.","Most RL bugs at this level are bookkeeping: bootstrapping across episode ends, mixing up $r_t$ and $r_{t+1}$, or treating a time-limit truncation as a true terminal."],"a":"## Where this module sits\nThis module is the classical core of reinforcement learning: the problem definition (this lesson), exact solutions when the environment is known (08.02), learning values from experience (08.03, 08.04), exploration (08.05), policy-based learning (08.06) and learning rewards from human preferences (08.07). The AI Research course's Reinforcement Learning chapter introduces agents and environments and then goes deep on DQN, PPO and GRPO; this module gives the tabular foundations those methods approximate, and Module 09 uses them to build AlphaGo Zero.\n\n## The interaction loop\nAn agent observes a state $s_t$, picks an action $a_t$, and the environment returns a reward $r_{t+1}$ and a next state $s_{t+1}$. A **Markov decision process** formalises this as a tuple $(\\mathcal S,\\mathcal A,P,R,\\gamma)$:\n- $\\mathcal S$, $\\mathcal A$: states and actions (finite in this module; continuous later).\n- $P(s'\\mid s,a)$: transition probabilities. The **Markov property** says this depends only on the current $s$ and $a$, not on earlier history. If it does not hold, enlarge the state until it does: stacking the last 4 Atari frames to capture velocity, or 8 past Go positions to detect repetition (lesson 09.01).\n- $R(s,a)$ or $R(s,a,s')$: expected immediate reward.\n- $\\gamma\\in[0,1)$: discount factor.\n\n%%flow The agent-environment loop; the environment is a black box that samples from P and R.\nAgent -(action a)-> *Environment -(reward r, next state)-> Agent\n%%\n\nA **policy** $\\pi(a\\mid s)$ maps states to action probabilities. Deterministic policies are the special case with all mass on one action.\n\n## Returns and discounting\nThe agent's objective is the **return**, the discounted sum of future rewards:\n\n$$G_t=r_{t+1}+\\gamma r_{t+2}+\\gamma^2 r_{t+3}+\\dots=r_{t+1}+\\gamma G_{t+1}$$\n\nThe recursive form is the one you compute: walk backwards through an episode. Discounting keeps infinite sums finite in continuing tasks, encodes a preference for sooner rewards, and gives an effective horizon of about $1/(1-\\gamma)$ steps: 10 for $\\gamma=0.9$, 100 for 0.99. Episodic tasks end at a **terminal state**, after which all rewards are zero, so $G$ must not bootstrap past the end. A time limit is different: the state was not terminal, the episode was just cut, and value estimates should still bootstrap there. Mixing the two up silently biases values.\n\n! Example: returns for one episode\n! Rewards $r_1, r_2, r_3=1, 0, 2$, then the episode terminates; $\\gamma=0.9$.\n! Backwards: $G_2=2$; $G_1=0+0.9\\cdot2=1.8$; $G_0=1+0.9\\cdot1.8=2.62$.\n! With a batch holding several episodes back to back, the recursion must reset at each `done` flag, or rewards from the next episode leak into this one.\n\n## Value functions and the Bellman expectation equation\nThe **state value** $V^\\pi(s)=\\mathbb E_\\pi[G_t\\mid s_t=s]$ is the expected return from $s$ when following $\\pi$. The **action value** $Q^\\pi(s,a)=\\mathbb E_\\pi[G_t\\mid s_t=s,a_t=a]$ fixes the first action. They relate by $V^\\pi(s)=\\sum_a\\pi(a\\mid s)Q^\\pi(s,a)$. Expanding one step of the return gives the **Bellman expectation equation**:\n\n$$V^\\pi(s)=\\sum_a\\pi(a\\mid s)\\sum_{s'}P(s'\\mid s,a)\\big[R(s,a,s')+\\gamma V^\\pi(s')\\big]$$\n\nFor a fixed policy, this is linear. Stack values into a vector, let $P_\\pi$ be the state-to-state transition matrix under $\\pi$ and $r_\\pi$ the expected one-step reward; then $V=r_\\pi+\\gamma P_\\pi V$, so\n\n$$V^\\pi=(I-\\gamma P_\\pi)^{-1}r_\\pi$$\n\nThe inverse exists for $\\gamma<1$. This is exact policy evaluation, practical for a few thousand states ($O(|\\mathcal S|^3)$).\n\n```python\nimport numpy as np\ndef evaluate(P, R, pi, gamma):          # P: (S, A, S), R: (S, A), pi: (S, A)\n    P_pi = np.einsum('sa,sat->st', pi, P)\n    r_pi = (pi * R).sum(1)\n    return np.linalg.solve(np.eye(len(r_pi)) - gamma * P_pi, r_pi)\n```\n\n! Example: a two-state loop\n! From A, the only action gives reward 1 and moves to B; from B, reward 0 and back to A; $\\gamma=0.9$.\n! $V(A)=1+0.9V(B)$ and $V(B)=0.9V(A)$, so $V(A)=1+0.81V(A)$, giving $V(A)=1/0.19=5.26$ and $V(B)=4.74$.\n! A collects 1 every second step forever: $1+0.81+0.81^2+\\dots=5.26$, as the closed form says.\n\n## Optimality\nAn optimal policy has the highest value in every state at once, and for finite MDPs one always exists that is deterministic. Its values $V^*$, $Q^*$ satisfy the **Bellman optimality equation**:\n\n$$Q^*(s,a)=\\sum_{s'}P(s'\\mid s,a)\\big[R(s,a,s')+\\gamma\\max_{a'}Q^*(s',a')\\big]$$\n\nThe max makes it non-linear, so there is no single matrix solve; the next lesson's iterative methods handle it. Once you have $Q^*$, acting is trivial: $\\pi^*(s)=\\arg\\max_a Q^*(s,a)$. This is why so much of RL is about estimating $Q$: a good $Q$ is a policy, without needing a model of $P$.\n\n| Object | Definition | Needs a model to act?\n| $V^\\pi(s)$ | expected return from $s$ following $\\pi$ | yes, to look one step ahead\n| $Q^\\pi(s,a)$ | expected return after taking $a$ in $s$, then $\\pi$ | no\n| $V^*$, $Q^*$ | best achievable values | $Q^*$ no, $V^*$ yes\n| Advantage $A^\\pi(s,a)$ | $Q^\\pi(s,a)-V^\\pi(s)$ | used by actor-critic (08.06)\n\n> Takeaway: an MDP is states, actions, Markov transitions, rewards and a discount; values are expected discounted returns, the Bellman expectation equation is linear and solvable exactly for a fixed policy, and the Bellman optimality equation adds a max whose greedy solution is the optimal policy.","q":"A robot task has a 500-step time limit. Your value-learning code treats step 500 as terminal, so the target there is just $r$. Training converges, but the robot behaves badly near the end of each episode and values for identical states differ depending on the time step. Explain the bug using the definition of return and the Markov property, and give the fix.","s":"The state the agent observes does not include time, so under the Markov assumption a given state should have one value regardless of when it is reached. Treating the time-limit cutoff as terminal tells the learner that the return from that state is just the last reward, while the same state reached earlier has a long future. Values for identical states then conflict and the learned values near the cutoff are biased low; the policy acts as if the world ends, for example taking risky actions or stopping effort. The cutoff is a truncation, not a property of the environment. Fix: keep separate `terminated` and `truncated` flags and bootstrap with $r+\\gamma V(s')$ on truncation (only true terminals use $r$ alone). Alternatively, if the time limit really is part of the task, add the remaining time to the state so the problem is Markov again.","r":[["Sutton and Barto: Reinforcement Learning, An Introduction (2nd ed.)","https://www.andrew.cmu.edu/course/10-703/textbook/BartoSutton.pdf","Chapter 3: MDPs, returns, value functions and both Bellman equations."],["OpenAI Spinning Up: Key Concepts in RL","https://spinningup.openai.com/en/latest/spinningup/rl_intro.html","Compact notation for policies, returns, value functions and Bellman equations."],["David Silver: UCL Course on RL","https://www.davidsilver.uk/teaching/","Lecture 2 (MDPs) slides and video; the matrix form of policy evaluation."]],"k":["MDP","Bellman equation","return"],"x":["NumPy"],"p":["discounted-returns","bellman-expectation-equation","value-iteration-step"],"ak":""},{"id":"08.02","t":"Dynamic programming","n":["Dynamic programming solves a known MDP by repeatedly applying Bellman backups; it needs $P$ and $R$ and costs $O(|\\mathcal S|^2|\\mathcal A|)$ per sweep.","Iterative policy evaluation applies the Bellman expectation backup until values stop changing; it converges because the backup is a $\\gamma$-contraction in the max norm.","Policy improvement makes the policy greedy with respect to $Q^\\pi$; the policy improvement theorem guarantees the new policy is at least as good everywhere.","Policy iteration alternates full evaluation and improvement and usually converges in a handful of iterations; value iteration folds them into one max-backup per sweep.","Error after $k$ value-iteration sweeps shrinks like $\\gamma^k$, so $\\gamma=0.99$ needs roughly ten times more sweeps than $\\gamma=0.9$."],"a":"## Planning with a known model\nLesson 08.01 left two equations: Bellman expectation (linear, for a fixed policy) and Bellman optimality (with a max). **Dynamic programming** (DP) solves them when you know the model $P(s'\\mid s,a)$ and $R$, for example a gridworld, an inventory problem with known demand, or a board game's rules. DP is not learning from experience, but every RL algorithm in this module is an approximation of a DP update with samples in place of the model, so the structure is worth knowing exactly.\n\nThe basic operation is a **Bellman backup**: replace a state's value with the right-hand side of a Bellman equation using current estimates of its successors.\n\n## Iterative policy evaluation\nInstead of inverting $(I-\\gamma P_\\pi)$, start from any $V_0$ and sweep:\n\n$$V_{k+1}(s)=\\sum_a\\pi(a\\mid s)\\sum_{s'}P(s'\\mid s,a)\\big[R(s,a,s')+\\gamma V_k(s')\\big]$$\n\nWhy does it converge? The backup operator $T^\\pi$ is a **$\\gamma$-contraction** in the max norm: $\\|T^\\pi U-T^\\pi V\\|_\\infty\\le\\gamma\\|U-V\\|_\\infty$, because the only place $V$ enters is multiplied by $\\gamma$ inside an average. By the Banach fixed-point theorem it has a unique fixed point $V^\\pi$, and the error shrinks by at least a factor $\\gamma$ per sweep. Updating values in place (using new values as soon as they are computed) usually converges faster and is equally valid.\n\n## Policy improvement and policy iteration\nGiven $V^\\pi$, compute $Q^\\pi(s,a)=\\sum_{s'}P(s'\\mid s,a)[R+\\gamma V^\\pi(s')]$ and act greedily: $\\pi'(s)=\\arg\\max_aQ^\\pi(s,a)$. The **policy improvement theorem** says $V^{\\pi'}(s)\\ge V^\\pi(s)$ for every state: taking a better first action and then following $\\pi$ is already at least as good, and following $\\pi'$ thereafter only helps more. If nothing improves, $\\pi$ satisfies the optimality equation and is optimal.\n\n**Policy iteration** alternates the two to convergence:\n\n%%flow Policy iteration: evaluate the current policy exactly, then make it greedy; stop when it no longer changes.\nPolicy pi -(evaluate)-> V pi -(greedy w.r.t. Q)-> *Improved pi -(repeat until stable)-> Optimal pi\n%%\n\nBecause there are finitely many deterministic policies and each iteration strictly improves until it stops, policy iteration terminates in a finite number of iterations, in practice very few (often under 10 even for thousands of states), though each iteration contains a full evaluation.\n\n## Value iteration\nPolicy evaluation does not need to converge before improving. Truncate it to a single sweep and fold the greedy step into the backup, and you get **value iteration**:\n\n$$V_{k+1}(s)=\\max_a\\sum_{s'}P(s'\\mid s,a)\\big[R(s,a,s')+\\gamma V_k(s')\\big]$$\n\nThis is the Bellman optimality backup, also a $\\gamma$-contraction, so $\\|V_k-V^*\\|_\\infty\\le\\gamma^k\\|V_0-V^*\\|_\\infty$. Stop when the largest change in a sweep falls below a threshold $\\theta$, then extract the greedy policy.\n\n```python\nimport numpy as np\ndef value_iteration(P, R, gamma, tol=1e-8):     # P: (S, A, S), R: (S, A)\n    V = np.zeros(P.shape[0])\n    while True:\n        Q = R + gamma * P @ V                    # (S, A): one-step lookahead\n        V_new = Q.max(1)\n        if np.abs(V_new - V).max() < tol:\n            return V_new, Q.argmax(1)\n        V = V_new\n```\n\n! Example: how many sweeps?\n! Initial error $\\|V_0-V^*\\|_\\infty=10$ and you want error below $10^{-3}$, a factor of $10^{-4}$.\n! With $\\gamma=0.9$: $k\\ge\\ln(10^{-4})/\\ln(0.9)=87.4$, so 88 sweeps.\n! With $\\gamma=0.99$: $k\\ge\\ln(10^{-4})/\\ln(0.99)=916$ sweeps. A longer horizon makes every DP and TD method slower to propagate value, for the same reason.\n\n## Generalised policy iteration and the limits of DP\nPolicy iteration, value iteration and everything in between (a few evaluation sweeps per improvement, asynchronous updates of single states) are instances of **generalised policy iteration**: values are pushed towards the current policy's values, the policy is pushed towards greedy, and the two settle together at optimality. The same pattern reappears in Q-learning (08.04), actor-critic (08.06) and, strikingly, AlphaGo Zero, where search improves the policy and training evaluates it (09.04).\n\n| Method | Backup | Per iteration | Iterations\n| Policy evaluation | expectation, fixed $\\pi$ | $O(\\lvert S\\rvert^2\\lvert A\\rvert)$ per sweep | until $\\gamma^k$ small\n| Policy iteration | evaluation to convergence, then greedy | many sweeps | few\n| Value iteration | optimality (max) | one sweep | about $\\log(\\epsilon)/\\log\\gamma$\n\nDP has two hard limits. It needs the model, which you usually do not have; the next lessons replace the sum over $s'$ with sampled transitions. And it sweeps every state, which is impossible when states are Go positions (about $10^{170}$) or camera images; that motivates function approximation (deep RL, covered in AI Research) and focusing computation on states that matter (tree search, Module 09).\n\n> Takeaway: with a known model, Bellman backups are contractions, so repeated sweeps converge; policy iteration alternates exact evaluation with greedy improvement, value iteration does one max-backup per sweep, and both are the template that sample-based RL approximates.","q":"On a 10,000-state gridworld with $\\gamma=0.99$, value iteration takes about 1,800 sweeps to converge, while policy iteration converges in 6 iterations. Which is faster in wall-clock time, and what does the answer depend on? Suggest a middle ground.","s":"It depends on the cost of each policy-iteration evaluation. If evaluation is done exactly by solving the linear system, each iteration costs $O(|S|^3)\\approx 10^{12}$ operations for a dense matrix (much less if $P_\\pi$ is sparse, as in a gridworld where each state has a few successors and a sparse solver works well), versus about $|S|\\cdot|A|\\cdot$(successors) per value-iteration sweep. With sparse transitions, 6 sparse solves are often cheaper than 1,800 sweeps; with dense transitions, value iteration wins. If evaluation is iterative, each policy-iteration step itself needs hundreds of sweeps at $\\gamma=0.99$, so the total sweep counts become comparable. The middle ground is modified policy iteration: run a fixed small number $m$ of evaluation sweeps (say 10 to 50) between greedy improvements. It keeps policy iteration's fast policy convergence without paying for exact evaluation of early, poor policies.","r":[["Sutton and Barto: Reinforcement Learning, An Introduction (2nd ed.)","https://www.andrew.cmu.edu/course/10-703/textbook/BartoSutton.pdf","Chapter 4: policy evaluation, the improvement theorem, policy and value iteration, GPI."],["David Silver: UCL Course on RL","https://www.davidsilver.uk/teaching/","Lecture 3 (planning by DP), including the contraction-mapping proof."]],"k":["dynamic programming","value iteration","policy iteration"],"x":["NumPy"],"p":["value-iteration","policy-iteration","value-iteration-step","bellman-expectation-equation"],"ak":""},{"id":"08.03","t":"Monte Carlo and temporal-difference learning","n":["Without a model, estimate $V^\\pi$ from experience. Monte Carlo moves $V(s)$ towards the observed return $G_t$; it is unbiased but high-variance and must wait for the episode to end.","TD(0) moves $V(s)$ towards $r+\\gamma V(s')$, using its own estimate of the next state (bootstrapping): biased, lower-variance, and it learns online after every step.","The TD error $\\delta_t=r_{t+1}+\\gamma V(s_{t+1})-V(s_t)$ is the central quantity of the module: it drives TD, SARSA, Q-learning, actor-critic and GAE.","n-step returns and the $\\lambda$-return interpolate between TD(0) ($n=1$, $\\lambda=0$) and Monte Carlo ($n=\\infty$, $\\lambda=1$).","Eligibility traces implement the $\\lambda$-return online by spreading each TD error back over recently visited states with weight $(\\gamma\\lambda)^k$."],"a":"## From sweeps to samples\nDynamic programming (08.02) computes an expectation over next states using the model. Model-free **prediction** replaces that expectation with samples: run the policy, observe transitions, and nudge value estimates towards targets built from what happened. The general update is\n\n$$V(s_t)\\leftarrow V(s_t)+\\alpha\\,\\big[\\text{target}-V(s_t)\\big]$$\n\na running average with step size $\\alpha$. The methods in this lesson differ only in the target.\n\n## Monte Carlo\nThe obvious target is the actual return $G_t$ from that visit onward. **Every-visit** MC averages returns after all visits to $s$; **first-visit** MC uses only the first visit per episode (each is a consistent estimator). Properties:\n- **Unbiased**: $\\mathbb E[G_t\\mid s_t=s]=V^\\pi(s)$ by definition.\n- **High variance**: $G_t$ sums many random rewards and transitions; long episodes make it noisy.\n- **Episode-bound**: you cannot update until the episode ends, and it does not work for continuing tasks without truncation.\n- **No Markov assumption** needed: it only averages observed returns.\n\n## Temporal-difference learning\nTD(0) uses one real reward and the current estimate for the rest:\n\n$$V(s_t)\\leftarrow V(s_t)+\\alpha\\,\\delta_t,\\qquad \\delta_t=r_{t+1}+\\gamma V(s_{t+1})-V(s_t)$$\n\n$\\delta_t$ is the **TD error**: how much better or worse the step went than predicted. Using $V(s_{t+1})$ inside the target is **bootstrapping**. The target is biased while $V$ is wrong, but it depends on one reward and one transition, so its variance is far lower than MC's. TD updates after every step, works in continuing tasks, and exploits the Markov structure: information propagates through shared successor states. Under standard step-size conditions, tabular TD(0) converges to $V^\\pi$.\n\n! Example: one TD(0) update\n! $V(s)=0.5$, the agent receives $r=1$, lands in $s'$ with $V(s')=0.6$; $\\gamma=0.9$, $\\alpha=0.1$.\n! $\\delta=1+0.9\\cdot0.6-0.5=1.04$, so $V(s)\\leftarrow0.5+0.1\\cdot1.04=0.604$.\n! Monte Carlo would instead wait for the whole return, say $G=2.3$, and move $V(s)$ to $0.5+0.1\\cdot1.8=0.68$; that single return could just as easily have been 0.\n\n%%layers Targets from least to most bootstrapping; bias falls and variance rises as you go up.\nMonte Carlo | target $G_t$: all real rewards, no bootstrap\nn-step | target $r_{t+1}+\\dots+\\gamma^{n-1}r_{t+n}+\\gamma^nV(s_{t+n})$\n*TD(0) | target $r_{t+1}+\\gamma V(s_{t+1})$: one reward, then bootstrap\nDP | target is the full expectation over $s'$ from the model\n%%\n\n## n-step returns and the lambda-return\nBetween one step and all steps lie **n-step returns**:\n\n$$G_t^{(n)}=r_{t+1}+\\gamma r_{t+2}+\\dots+\\gamma^{n-1}r_{t+n}+\\gamma^nV(s_{t+n})$$\n\nIntermediate $n$ (often 3 to 10) usually beats both extremes: rewards propagate $n$ states per update rather than one, while variance stays moderate. Rainbow DQN, for example, uses 3-step targets. Rather than pick one $n$, the **$\\lambda$-return** averages all of them with geometric weights:\n\n$$G_t^\\lambda=(1-\\lambda)\\sum_{n=1}^{\\infty}\\lambda^{n-1}G_t^{(n)}$$\n\n$\\lambda=0$ gives TD(0) and $\\lambda=1$ gives Monte Carlo. The same exponentially weighted average of multi-step errors appears as Generalised Advantage Estimation in lesson 08.06.\n\n## Eligibility traces: the backward view\nComputing $G_t^\\lambda$ directly requires future rewards. **Eligibility traces** get the same effect online. Each state keeps a trace $e(s)$ that decays by $\\gamma\\lambda$ per step and is bumped when the state is visited; each TD error then updates all states in proportion to their trace:\n\n```python\ndef td_lambda_episode(env, V, policy, alpha, gamma, lam):\n    e = np.zeros_like(V); s = env.reset(); done = False\n    while not done:\n        s2, r, done = env.step(policy(s))\n        delta = r + (0 if done else gamma * V[s2]) - V[s]\n        e *= gamma * lam; e[s] += 1            # accumulating trace\n        V += alpha * delta * e                 # credit recent states\n        s = s2\n```\n\nA reward now gets credited to the state just left at full weight, the one before at $\\gamma\\lambda$, and so on. For offline updates over a whole episode this matches the $\\lambda$-return exactly; \"true online TD($\\lambda$)\" makes them match online too. With function approximation, $e$ becomes a trace over parameter gradients.\n\n| Method | Bias | Variance | Updates | Needs episode end\n| Monte Carlo | none | high | end of episode | yes\n| TD(0) | yes, from bootstrapping | low | every step | no\n| n-step TD | less | medium | after n steps | no\n| TD($\\lambda$) with traces | tunable | tunable | every step | no\n\n> Takeaway: model-free prediction moves values towards a target; Monte Carlo uses the full observed return (unbiased, noisy, episode-bound), TD(0) bootstraps from the next state's estimate (biased, low-variance, online), and n-step returns, $\\lambda$-returns and eligibility traces span everything in between.","q":"In a 1,000-step episodic task where the only reward arrives at the end, you compare Monte Carlo with TD(0) for value prediction, each run for the same small number of episodes. Which learns faster for states near the start, and why? How would TD($\\lambda$) with $\\lambda=0.9$ change the picture?","s":"TD(0) propagates the final reward back by only one state per visit: after the first episode only the second-to-last state has learned anything, and information reaches the start only after on the order of 1,000 episodes along the path (sooner if trajectories overlap and $\\alpha$ is large). Monte Carlo updates every visited state with the actual return after each episode, so states near the start get a useful, if noisy, signal immediately. With a sparse, delayed reward and few episodes, MC learns the early states faster; TD's lower variance only pays off once values have propagated. TD($\\lambda$) with $\\lambda=0.9$ spreads each TD error back over recently visited states with weight $(\\gamma\\lambda)^k$, so the final reward reaches tens of steps back in one episode (the trace falls to 1 percent after about 44 steps for $\\gamma\\lambda=0.9$). It propagates much faster than TD(0) while keeping lower variance than full MC; for very long chains, $\\lambda$ closer to 1 or n-step returns help further.","r":[["Sutton and Barto: Reinforcement Learning, An Introduction (2nd ed.)","https://www.andrew.cmu.edu/course/10-703/textbook/BartoSutton.pdf","Chapters 5, 6, 7 and 12: Monte Carlo, TD(0), n-step methods and eligibility traces; the random-walk comparisons."],["Sutton: Learning to Predict by the Methods of Temporal Differences","https://link.springer.com/article/10.1007/BF00992698","The 1988 paper that introduced TD learning and TD(lambda)."],["David Silver: UCL Course on RL","https://www.davidsilver.uk/teaching/","Lecture 4 (model-free prediction): the bias-variance picture of MC vs TD."]],"k":["TD learning","Monte Carlo","eligibility traces"],"x":["NumPy"],"p":["td-0-value-update","monte-carlo-policy-evaluation","discounted-returns"],"ak":""},{"id":"08.04","t":"Q-learning and SARSA","n":["Control without a model needs action values: with $Q(s,a)$ you can act greedily without knowing $P$.","SARSA is on-policy: its target $r+\\gamma Q(s',a')$ uses the action the behaviour policy actually takes next, so it learns the value of the exploring policy.","Q-learning is off-policy: its target $r+\\gamma\\max_{a'}Q(s',a')$ learns $Q^*$ whatever policy generated the data, which is what makes replay buffers possible.","Expected SARSA averages over the next action under the policy, removing the sampling noise of $a'$; with a greedy target policy it becomes Q-learning.","The max in Q-learning overestimates noisy values (maximisation bias); Double Q-learning separates selection from evaluation. DQN, covered in AI Research, is Q-learning with a network, replay and a target network."],"a":"## From prediction to control\nLesson 08.03 estimated $V^\\pi$ for a fixed policy. **Control** means finding a good policy. Knowing $V$ is not enough without a model, because choosing an action requires looking one step ahead through $P$. Learning $Q(s,a)$ instead removes the need: the greedy action is $\\arg\\max_aQ(s,a)$. The recipe is generalised policy iteration (08.02) with samples: update $Q$ with TD, and keep the policy (mostly) greedy with respect to it.\n\nThat raises the exploration problem straight away. A purely greedy agent never tries actions it currently rates poorly, so it never learns they were better. The standard fix is **$\\varepsilon$-greedy**: with probability $\\varepsilon$ take a uniformly random action, otherwise the greedy one. Lesson 08.05 treats exploration properly; here $\\varepsilon$ is usually decayed (say from 1.0 to 0.05) over training.\n\n## SARSA: on-policy TD control\nSARSA is named after the tuple it uses, $(s,a,r,s',a')$:\n\n$$Q(s,a)\\leftarrow Q(s,a)+\\alpha\\big[r+\\gamma Q(s',a')-Q(s,a)\\big]$$\n\nwhere $a'$ is the action the agent will actually take in $s'$, chosen by the same $\\varepsilon$-greedy policy. SARSA therefore evaluates and improves the policy it is executing, exploration included. It converges to $Q^*$ if exploration decays appropriately (greedy in the limit with infinite exploration, \"GLIE\"); with fixed $\\varepsilon$ it converges to the best $\\varepsilon$-greedy policy.\n\n## Q-learning: off-policy TD control\nQ-learning (Watkins, 1989) replaces the next action's value with the best next action's value:\n\n$$Q(s,a)\\leftarrow Q(s,a)+\\alpha\\big[r+\\gamma\\max_{a'}Q(s',a')-Q(s,a)\\big]$$\n\nThe target no longer depends on what the agent does next, so the data can come from any behaviour policy that keeps visiting all state-action pairs: an $\\varepsilon$-greedy version of itself, an old policy, a human, a replay buffer. Q-learning is a sampled version of value iteration's optimality backup and converges to $Q^*$ in the tabular case under standard step-size conditions.\n\n%%flow Same transition, different bootstrap: SARSA follows the next action it will really take; Q-learning assumes the best one.\n[SARSA] s, a -(r)-> s prime -(behaviour picks a prime)-> *Q of s prime, a prime\n[Q-learning] s, a -(r)-> s prime -(max over actions)-> *max Q of s prime\n%%\n\n| Aspect | SARSA | Expected SARSA | Q-learning\n| Target | $r+\\gamma Q(s',a')$ | $r+\\gamma\\sum_{a'}\\pi(a'\\mid s')Q(s',a')$ | $r+\\gamma\\max_{a'}Q(s',a')$\n| Learns | $Q$ of the behaviour policy | $Q$ of the target policy $\\pi$ | $Q^*$\n| On or off policy | on | either | off\n| Target variance | highest (samples $a'$) | lower | low, but biased upwards\n\n## Cliff walking: the difference in behaviour\nIn the classic cliff-walking gridworld, the shortest path runs along a cliff edge; stepping off costs $-100$ and every other step $-1$. With $\\varepsilon=0.1$, Q-learning learns the optimal edge-hugging path, because its target assumes greedy behaviour, but during training its random 10 percent of moves regularly push it off the cliff, so its online reward is worse. SARSA accounts for its own exploration and learns a safer path one row further from the edge, earning more reward while exploring. Neither is wrong: Q-learning answers \"what is optimal\", SARSA \"what is best given that I will keep exploring\". For a robot that keeps exploring in the real world, the SARSA answer is often the one you want.\n\n! Example: the two targets on one transition\n! In $s'$, $Q(s',\\cdot)=(2.0, 5.0)$, the reward was $r=1$, $\\gamma=0.9$, and the $\\varepsilon$-greedy policy happened to sample the exploratory action 1 (value 2.0). Current $Q(s,a)=3.0$, $\\alpha=0.5$.\n! SARSA target: $1+0.9\\cdot2.0=2.8$, so $Q(s,a)\\to3.0+0.5(2.8-3.0)=2.9$.\n! Q-learning target: $1+0.9\\cdot5.0=5.5$, so $Q(s,a)\\to3.0+0.5(5.5-3.0)=4.25$.\n! Expected SARSA with $\\varepsilon=0.1$ over 2 actions ($\\pi=(0.05, 0.95)$): target $1+0.9(0.05\\cdot2+0.95\\cdot5)=5.365$, no sampling noise from $a'$.\n\n```python\ndef q_update(Q, s, a, r, s2, done, alpha, gamma):\n    target = r if done else r + gamma * Q[s2].max()      # no bootstrap past a true terminal\n    Q[s, a] += alpha * (target - Q[s, a])\n```\n\n## Maximisation bias and the step to deep RL\n$\\mathbb E[\\max_a\\hat Q(s,a)]\\ge\\max_a\\mathbb E[\\hat Q(s,a)]$: when estimates are noisy, the max picks whichever is luckily high, so Q-learning's targets are biased upwards, and the bias compounds through bootstrapping. **Double Q-learning** keeps two estimates and uses one to choose the action and the other to evaluate it, $r+\\gamma Q_B(s',\\arg\\max_aQ_A(s',a))$. Optimistic initial values (e.g. $Q_0=+5$ when rewards are at most 1) are a cheap exploration aid in tabular settings: every untried action looks attractive until tried.\n\nReplacing the table with a neural network gives DQN, which adds an experience replay buffer (possible because Q-learning is off-policy) and a slowly updated target network to stabilise the bootstrapped target. The AI Research course covers DQN and its variants (double, dueling, prioritised replay) in depth.\n\n> Takeaway: SARSA bootstraps from the next action actually taken and learns the value of the exploring policy; Q-learning bootstraps from the best next action and learns $Q^*$ from any data, at the price of maximisation bias; Expected SARSA sits between them.","q":"You train a tabular Q-learning agent from a fixed log of transitions collected by a cautious human operator who never visits states near a hazard. The learned greedy policy confidently routes through the hazard region and fails. Q-learning is off-policy and 'learns $Q^*$ from any data', so what went wrong?","s":"Off-policy convergence to $Q^*$ requires that the behaviour data keep visiting every relevant state-action pair. The operator never visited the hazard region, so $Q$ there stays at its initial values and is never corrected by real rewards. If initial values are zero or optimistic and rewards elsewhere are negative per step, untried actions near the hazard look as good as or better than tried ones, and the max in the Q-learning target propagates those unearned values back to states that were visited. The greedy policy then exploits estimation error rather than real knowledge. This is the core failure of offline RL: distribution shift between the data and the learned policy. Remedies include collecting data that covers the region, initialising unvisited values pessimistically, or constraining the policy to actions well supported by the data (conservative or behaviour-regularised methods).","r":[["Sutton and Barto: Reinforcement Learning, An Introduction (2nd ed.)","https://www.andrew.cmu.edu/course/10-703/textbook/BartoSutton.pdf","Chapter 6.4 to 6.7: SARSA, Q-learning, Expected SARSA, cliff walking and Double Q-learning."],["Mnih et al.: Playing Atari with Deep Reinforcement Learning","https://arxiv.org/abs/1312.5602","Q-learning with a neural network and experience replay; the step from this lesson to deep RL."],["David Silver: UCL Course on RL","https://www.davidsilver.uk/teaching/","Lecture 5 (model-free control): GLIE, SARSA and Q-learning convergence."]],"k":["Q-learning","SARSA","off-policy"],"x":["NumPy"],"p":["q-learning-update","sarsa-update","expected-sarsa","epsilon-greedy-action-selection"],"ak":""},{"id":"08.05","t":"Bandits and exploration","n":["A multi-armed bandit is an MDP with one state: pick one of $K$ arms, get a random reward. It isolates the exploration-exploitation trade-off, measured by regret $R_T=T\\mu^*-\\sum_t\\mathbb E[\\mu_{a_t}]$.","Greedy and fixed-$\\varepsilon$ strategies have regret linear in $T$; the best achievable is logarithmic in $T$ (the Lai-Robbins lower bound).","UCB1 plays $\\arg\\max_a\\hat\\mu_a+\\sqrt{2\\ln t/N_a}$: optimism in the face of uncertainty, with a bonus that shrinks as an arm is tried.","Thompson sampling keeps a posterior per arm (Beta for Bernoulli rewards), samples one plausible mean per arm and plays the best sample; it is simple, Bayesian and usually the strongest in practice.","Contextual bandits (LinUCB) add features per round; they power recommendation and ad selection, and the same optimism bonus reappears in tree search as PUCT."],"a":"## The simplest RL problem\nIn a **multi-armed bandit**, each round you choose one of $K$ arms and receive a reward drawn from that arm's unknown distribution with mean $\\mu_a$. There is no state, so actions have no long-term consequences except what you learn from them. That isolates the hardest question in RL: should you **exploit** the arm that looks best now or **explore** others that might be better? Bandits model A/B tests that adapt while running, ad and recommendation selection, clinical dose finding and hyperparameter search, and their exploration rules reappear inside MCTS (lesson 09.02).\n\nPerformance is measured by **regret**, the expected reward lost relative to always playing the best arm $\\mu^*$:\n\n$$R_T=T\\mu^*-\\sum_{t=1}^{T}\\mathbb E[\\mu_{a_t}]=\\sum_a\\Delta_a\\,\\mathbb E[N_a(T)],\\qquad \\Delta_a=\\mu^*-\\mu_a$$\n\nRegret is the sum over bad arms of how often you play them times how bad they are. Lai and Robbins showed that any reasonable algorithm must play each suboptimal arm about $\\ln T/\\mathrm{KL}(\\mu_a\\|\\mu^*)$ times, so regret must grow at least logarithmically in $T$. Good algorithms achieve $O(\\log T)$; naive ones grow linearly.\n\n## Estimating arm values\nEach arm's estimate is a running mean, updated incrementally: $\\hat\\mu_a\\leftarrow\\hat\\mu_a+\\frac{1}{N_a}(r-\\hat\\mu_a)$. For non-stationary rewards, replace $1/N_a$ by a constant step size so old rewards are forgotten exponentially, exactly the TD-style update of lesson 08.03.\n\n## Epsilon-greedy and softmax\n**$\\varepsilon$-greedy** plays a random arm with probability $\\varepsilon$ and the best estimate otherwise. With fixed $\\varepsilon$, it plays each bad arm about $\\varepsilon T/K$ times forever, so regret is linear; decaying $\\varepsilon_t\\propto1/t$ fixes the rate but needs tuning to the unknown gaps. It also explores blindly: an arm known to be terrible gets as many random pulls as a promising one. **Softmax (Boltzmann)** exploration picks arm $a$ with probability $\\propto\\exp(\\hat\\mu_a/\\tau)$, which at least explores near-best arms more; the temperature $\\tau$ plays the role of $\\varepsilon$.\n\n## UCB: optimism in the face of uncertainty\n**UCB1** (Auer et al., 2002) plays the arm with the highest upper confidence bound:\n\n$$a_t=\\arg\\max_a\\ \\hat\\mu_a+\\sqrt{\\frac{2\\ln t}{N_a}}$$\n\nThe bonus comes from Hoeffding's inequality: with high probability the true mean lies below the bound. An arm is played either because its estimate is high (exploitation) or because it has been tried rarely (exploration), and the bonus shrinks like $1/\\sqrt{N_a}$. Each arm is played once first. UCB1 has $O(\\sum_a\\ln T/\\Delta_a)$ regret for rewards in $[0,1]$, deterministic behaviour and no tuning.\n\n! Example: one UCB1 decision\n! At $t=100$: arm A has $\\hat\\mu=0.60$ from 80 pulls; arm B has $\\hat\\mu=0.50$ from 20 pulls. $\\ln100=4.61$.\n! A: $0.60+\\sqrt{9.21/80}=0.60+0.34=0.94$. B: $0.50+\\sqrt{9.21/20}=0.50+0.68=1.18$.\n! UCB1 plays B: with only 20 samples, a true mean above 0.6 is still plausible. Each further pull of B shrinks its bonus until A wins again, unless B turns out better.\n\n## Thompson sampling\n**Thompson sampling** (1933, rediscovered around 2010) is Bayesian: keep a posterior over each arm's mean, draw one sample from each posterior, play the arm with the highest sample. For Bernoulli rewards (click or no click) the Beta prior is conjugate, so the update is two counters per arm:\n\n```python\nimport numpy as np\ndef thompson(successes, failures, rng):          # arrays of length K, Beta(1, 1) prior\n    theta = rng.beta(successes + 1, failures + 1)\n    return int(np.argmax(theta))\n# after playing arm a and seeing reward r in {0, 1}:\n#   successes[a] += r; failures[a] += 1 - r\n```\n\nAn arm is played with exactly the posterior probability that it is the best arm (probability matching). Uncertain arms produce wide samples and sometimes win; clearly bad arms almost never do. Thompson sampling achieves the Lai-Robbins rate for Bernoulli arms, handles delayed or batched feedback gracefully because its randomisation avoids playing the same arm for a whole batch, and usually beats UCB empirically.\n\n%%layers From blind to directed exploration; regret on a typical Bernoulli problem improves going down.\nGreedy | never explores; can lock onto a bad arm, linear regret\n$\\varepsilon$-greedy | explores uniformly at random; linear regret unless decayed\nUCB1 | explores arms whose upper bound is high; $O(\\log T)$ regret\n*Thompson sampling | explores in proportion to the probability of being best; $O(\\log T)$, strong in practice\n%%\n\n## Contextual bandits and beyond\nIn a **contextual bandit** each round comes with features $x_t$ (user, page, time), and the best arm depends on them. **LinUCB** models each arm's reward as linear, $\\mu_a(x)=\\theta_a^\\top x$, fits $\\theta_a$ by ridge regression, and adds a bonus $\\alpha\\sqrt{x^\\top A_a^{-1}x}$, the uncertainty of the prediction in direction $x$. Li et al. (2010) used it for Yahoo! news article recommendation. Contextual bandits are one-step RL; full RL adds the fact that actions change future states, so exploration must also be planned over time. The same optimism idea drives UCT and AlphaGo Zero's PUCT rule, where each tree node is a bandit over moves (lesson 09.02).\n\n> Takeaway: bandits isolate exploration; regret must grow at least like $\\log T$, which UCB (optimistic bonuses that shrink with $1/\\sqrt{N}$) and Thompson sampling (sample from the posterior, act greedily on the sample) achieve, while greedy and fixed-$\\varepsilon$ strategies waste a fixed fraction of pulls forever.","q":"An e-commerce team runs Thompson sampling over 5 page layouts, but conversions are reported in daily batches, so the algorithm picks the layout for every visitor of the day before seeing any of that day's results. They want to switch to UCB1 'because it is deterministic and easier to audit'. What happens to UCB1 under daily batching, and why does Thompson sampling cope better?","s":"UCB1 is deterministic given its counts. Within a day the counts do not change, so every visitor that day gets the same layout: the one with the highest upper bound at the start of the day. Exploration then happens one arm per day instead of continuously, so it takes many days to try the arms enough, and a whole day of traffic can be spent on an arm that a few hundred visitors would have ruled out. Regret grows with batch size. Thompson sampling draws a fresh posterior sample per visitor, so within one day traffic is spread across layouts in proportion to the probability that each is best, which is natural, well-calibrated batch exploration. If auditability matters, keep Thompson sampling with logged seeds and per-visitor assignment probabilities (which also enables unbiased offline evaluation), or use a batched UCB variant that spreads each batch across arms.","r":[["Lattimore and Szepesvari: Bandit Algorithms","https://tor-lattimore.com/downloads/book/book.pdf","Free textbook. Chapters 6 to 8 (explore-then-commit, UCB) and 36 (Thompson sampling); chapter 16 for lower bounds."],["Russo et al.: A Tutorial on Thompson Sampling","https://arxiv.org/abs/1707.02038","Beta-Bernoulli Thompson sampling, its extensions and when it beats UCB."],["Li et al.: A Contextual-Bandit Approach to Personalized News Article Recommendation","https://arxiv.org/abs/1003.0146","LinUCB and offline evaluation on Yahoo! front-page data."]],"k":["bandits","UCB","Thompson sampling"],"x":["NumPy"],"p":["ucb1-for-multi-armed-bandits","thompson-sampling-beta-bernoulli","epsilon-greedy-action-selection","softmax-boltzmann-exploration","linucb-contextual-bandit"],"ak":""},{"id":"08.06","t":"Actor-critic methods","n":["Policy-gradient methods optimise a parameterised policy directly: $\\nabla J=\\mathbb E[\\nabla_\\theta\\log\\pi_\\theta(a\\mid s)\\,A(s,a)]$, with the advantage $A$ telling each action whether it beat expectations.","An actor-critic pairs the policy (actor) with a learned value function (critic) that supplies a low-variance advantage estimate, such as the TD error $r+\\gamma V(s')-V(s)$.","Generalised Advantage Estimation is the $\\lambda$-weighted sum of TD errors, $\\hat A_t=\\sum_l(\\gamma\\lambda)^l\\delta_{t+l}$, computed backwards in one pass; $\\lambda$ trades bias for variance.","The A2C loss combines a policy term, a value regression term and an entropy bonus that keeps the policy from collapsing to deterministic too early.","PPO adds a clipped importance ratio to reuse each batch for several epochs, and GRPO drops the critic for group-relative advantages; both are covered in AI Research."],"a":"## Why learn the policy directly\nQ-learning (08.04) learns values and acts greedily. That struggles with continuous actions (the max over actions becomes an optimisation problem), cannot represent stochastic policies that are genuinely optimal (in games with hidden information, or when aliasing makes two states look the same), and small value changes can flip the greedy action discontinuously. **Policy-gradient methods** parameterise $\\pi_\\theta(a\\mid s)$, for example a softmax over action logits or a Gaussian over continuous actions, and do gradient ascent on expected return $J(\\theta)$.\n\nThe **policy gradient theorem** gives the gradient without differentiating the environment:\n\n$$\\nabla_\\theta J=\\mathbb E_{\\pi_\\theta}\\Big[\\sum_t\\nabla_\\theta\\log\\pi_\\theta(a_t\\mid s_t)\\,\\Psi_t\\Big]$$\n\nwhere $\\Psi_t$ can be the return $G_t$ (REINFORCE), $G_t-b(s_t)$ for any baseline $b$, or the advantage $A^\\pi(s_t,a_t)$. All give the same expected gradient, because $\\mathbb E_a[\\nabla\\log\\pi(a\\mid s)]\\,b(s)=0$, but very different variance. (The AI Research course derives REINFORCE; here we focus on the critic.)\n\n## The critic and the advantage\nThe best simple baseline is $V^\\pi(s)$, which turns $\\Psi_t$ into an advantage: did this action do better than the policy's average from this state? An **actor-critic** learns $V_\\phi(s)$ alongside the policy, using TD methods from lesson 08.03, and estimates the advantage with the TD error:\n\n$$\\hat A_t=\\delta_t=r_{t+1}+\\gamma V_\\phi(s_{t+1})-V_\\phi(s_t)$$\n\nThis is low-variance (one reward, one transition) but biased whenever $V_\\phi$ is wrong. Using the full return minus $V_\\phi(s_t)$ is unbiased but noisy. That is the same bias-variance dial as TD versus Monte Carlo, and GAE turns it continuously.\n\n%%flow The critic turns raw rewards into advantages; the actor follows advantage-weighted log-probability gradients.\nRollout s, a, r -> *Critic V -(TD errors, GAE)-> Advantages -(policy gradient)-> Actor update\nRollout s, a, r -(value targets)-> *Critic V\n%%\n\n## Generalised Advantage Estimation\nSchulman et al. (2015) define the advantage as an exponentially weighted average of n-step advantages, which collapses to a weighted sum of TD errors:\n\n$$\\hat A_t^{\\text{GAE}(\\gamma,\\lambda)}=\\sum_{l=0}^{\\infty}(\\gamma\\lambda)^l\\,\\delta_{t+l}$$\n\n$\\lambda=0$ gives the one-step TD advantage; $\\lambda=1$ gives $G_t-V(s_t)$. Typical settings are $\\gamma=0.99$, $\\lambda=0.95$. It is computed backwards over a rollout in a single pass, resetting at episode boundaries:\n\n```python\ndef gae(rewards, values, last_value, dones, gamma=0.99, lam=0.95):\n    adv = np.zeros_like(rewards); next_adv = 0.0; next_v = last_value\n    for t in reversed(range(len(rewards))):\n        nonterminal = 1.0 - dones[t]\n        delta = rewards[t] + gamma * next_v * nonterminal - values[t]\n        next_adv = delta + gamma * lam * nonterminal * next_adv\n        adv[t] = next_adv; next_v = values[t]\n    return adv, adv + values              # advantages and value targets\n```\n\n! Example: GAE over three steps\n! $\\gamma=0.9$, $\\lambda=0.8$ (so $\\gamma\\lambda=0.72$); rewards $(1, 0, 1)$; values $V=(0.5, 0.4, 0.6)$; the episode ends after step 3.\n! TD errors: $\\delta_2=1-0.6=0.4$; $\\delta_1=0+0.9\\cdot0.6-0.4=0.14$; $\\delta_0=1+0.9\\cdot0.4-0.5=0.86$.\n! Advantages backwards: $\\hat A_2=0.4$; $\\hat A_1=0.14+0.72\\cdot0.4=0.428$; $\\hat A_0=0.86+0.72\\cdot0.428=1.168$.\n! Value targets $\\hat A+V=(1.668, 0.828, 1.0)$; the last is exactly the final reward, as it should be at a terminal.\n\n## The A2C loss\nAdvantage actor-critic (A2C, the synchronous form of A3C) minimises one combined loss per batch:\n\n$$\\mathcal L=-\\frac1N\\sum_t\\log\\pi_\\theta(a_t\\mid s_t)\\,\\hat A_t\\;+\\;c_v\\frac1N\\sum_t\\big(V_\\phi(s_t)-\\hat R_t\\big)^2\\;-\\;c_e\\frac1N\\sum_t\\mathcal H\\big(\\pi_\\theta(\\cdot\\mid s_t)\\big)$$\n\n- **Policy term.** $\\hat A_t$ is treated as a constant (no gradient through the critic into the actor's term). Normalising advantages per batch to zero mean and unit variance is common and stabilises step sizes.\n- **Value term.** Regress $V_\\phi$ onto the targets $\\hat R_t=\\hat A_t+V(s_t)$
