<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Deep learning from the neuron up: training, CNNs and vision, sequence models and NLP, VAEs, GANs and diffusion, and reinforcement learning through AlphaGo-style search.">
<meta name="theme-color" content="#F7F7F8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Deep Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --panel:#EFEFF1; --side:#FAFAFA; --ink:#272727; --muted:#6E6E6E; --faint:#9C9CA3;
  --line:#E8E8EA; --line2:#C9C9CF; --accent:#0369A1; --accent-ink:#FFFFFF; --accent-soft:#EAF5FC; --accent-line:#BFDDF0;
  --go:#2F8A5F; --go-soft:#E7F5EE; --go-line:#ABD3C1; --flame:#C8643A; --flame-soft:#FBEFE8; --gold:#9A7414; --gold-soft:#FFF8ED;
  --bad:#B9524A; --bad-soft:#FBEDEB; --paper:#FFF8ED; --paper-line:#EADDBE; --kraft:#5F5647;
  --btn-a:#272727; --btn-b:#272727; --btn-ink:#FFFFFF; --btn-edge:#272727;
  --shadow:rgba(59,59,59,.09) 0 1px 2px, rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.01) 0 0 0 1px;
  --lift:rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.09) 0 4px 8px, rgba(59,59,59,.1) 0 8px 16px, rgba(59,59,59,.01) 0 0 0 1px;
  --dg-sh:#272727; --dot:rgba(39,39,39,.08); --strip:#272727; --strip-ink:#F4F4F5;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --num:"Geist", system-ui, sans-serif;
  --pix:"Pixelify Sans", "Geist Mono", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#5AB4E8; --accent-ink:#06192A; --accent-soft:#11222E; --accent-line:#1F3E52;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#5AB4E8; --accent-ink:#06192A; --accent-soft:#11222E; --accent-line:#1F3E52;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.lab{font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
#readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:700;letter-spacing:-.03em;font-size:17px;white-space:nowrap}
.brand b{font-family:var(--pix);font-weight:500;color:var(--accent);letter-spacing:0}
.ibtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
#crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--muted);margin-left:8px}
#crumbs a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#crumbs a:hover{color:var(--ink)}
#crumbs .sep{color:var(--line2)}
.grow{flex:1}
.sbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;min-width:220px}
.sbtn span{flex:1;text-align:left}
kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 13px var(--mono);white-space:nowrap;text-decoration:none}
.chip.st{color:var(--flame)} .chip.st.off{color:var(--faint)}
.chip .lv{font-family:var(--num);font-size:15px;color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:18px 12px 40px;border-right:1px solid var(--line);scrollbar-width:thin}
.side .nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:14.5px;font-weight:500;color:var(--muted)}
.side .nv:hover{background:var(--panel);color:var(--ink)}
.side .nv[aria-current]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.side .nv .cnt{margin-left:auto;font:600 11px var(--mono);background:var(--flame);color:#fff;border-radius:999px;padding:1px 7px}
.side .part{margin:22px 10px 8px;display:flex;justify-content:space-between}
.side .mr{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink)}
.side .mr:hover{background:var(--panel)}
.side .mr .n{font:500 12px var(--mono);color:var(--faint)}
.side .mr .c{font:500 11px var(--mono);color:var(--faint)}
.side .mr.full .c{color:var(--go)}
.side .mr[aria-current]{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600}
.side .mr[aria-current] .n{color:var(--accent)}
.side .ls{margin:4px 0 8px 22px;padding-left:12px;border-left:1px solid var(--line)}
.side .li{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:8px;text-decoration:none;font-size:13.5px;line-height:1.4;color:var(--muted)}
.side .li:hover{color:var(--ink);background:var(--panel)}
.side .li[aria-current]{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.sd{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid var(--line2)}
.sd.on{background:var(--go);border-color:var(--go)}
#scrim{display:none}
main{min-width:0;padding:28px 36px 90px}

/* shared components */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--btn-edge);background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--btn-ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 var(--btn-edge),0 8px 18px -8px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 var(--btn-edge),0 3px 8px -4px rgba(0,0,0,.4)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:0 2px 0 var(--line2)}
.btn.go{background:linear-gradient(180deg,#22B26F,#0F8C52);border-color:#0A6B3E;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0A6B3E,0 8px 18px -8px rgba(15,140,82,.6)}
.btn .xp{font:600 12px var(--mono);padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill.k{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.a{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.ok{background:var(--go-soft);border-color:transparent;color:var(--go)}
.pill.ip{background:var(--flame-soft);border-color:transparent;color:var(--flame)}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:7px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--go)}
.seg i.cur{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:44px 0 14px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.03em}

/* home */
.hero{position:relative;overflow:hidden;padding:52px 48px 48px;min-height:440px;background-color:var(--panel);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.hero .copy{position:relative;z-index:2;max-width:540px}
.hero h1{font-size:clamp(40px,5.6vw,72px);line-height:.98;letter-spacing:-.055em;margin:16px 0 18px;font-weight:700}
.hero h1 .px{font-family:var(--pix);font-weight:500;letter-spacing:-.02em;color:var(--accent)}
.hero p.sub{font-size:18px;color:var(--muted);max-width:470px;margin:0 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.float{position:absolute;z-index:1;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);padding:16px}
.float.f1{right:46px;top:44px;width:310px;transform:rotate(3deg)}
.float.f2{right:280px;top:270px;width:250px;transform:rotate(-5deg);background:#1B1B1E;color:#F4F4F6;border-color:#000}
.float.f3{right:28px;top:236px;width:236px;transform:rotate(-1.5deg)}
.float.f4{right:250px;top:58px;width:200px;transform:rotate(-8deg);background:var(--accent);color:#fff;border-color:transparent}
.float .lab{margin-bottom:8px}
.float.f2 .lab,.float.f4 .lab{color:rgba(255,255,255,.7)}
.float.f2 .seg i{background:rgba(255,255,255,.14)} .float.f2 .seg i.on{background:#3FCB86}
.float.f4 .big{font:700 34px/1 var(--num)}
.float svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 7s ease-in-out infinite}
  .float.f2{animation-delay:-2s}.float.f3{animation-delay:-4s}.float.f4{animation-delay:-5.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .num{font:800 40px/1 var(--num);letter-spacing:-.05em;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}
.stat .num small{font:500 13px var(--mono);color:var(--muted)}
.stat .sub{font-size:13.5px;color:var(--muted)}
.wk{display:flex;gap:6px;margin-top:10px}
.wk span{flex:1;text-align:center;font:500 10px var(--mono);color:var(--faint)}
.wk span i{display:block;height:22px;border-radius:7px;background:var(--panel);margin-bottom:4px;border:1px solid var(--line)}
.wk span i.on{background:var(--flame);border-color:var(--flame)}
.wk span.today{color:var(--ink)}
.ring{position:absolute;right:18px;top:18px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.cont{padding:26px;display:flex;flex-direction:column;gap:12px}
.cont h3{font-size:28px;line-height:1.1;letter-spacing:-.04em;margin:4px 0 0}
.cont ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.cont .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.heat{padding:22px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:16px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.hm i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--card));border-color:transparent}
.hm i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--card));border-color:transparent}
.hm i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--card));border-color:transparent}
.hm i.l4{background:var(--accent);border-color:transparent}
.hm i.fut{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font:500 11px var(--mono);color:var(--faint)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{padding:16px;display:flex;flex-direction:column;gap:8px}
.bdg .ic{width:46px;height:46px;display:grid;place-items:center;font:700 17px var(--num);border-radius:14px;color:#fff;background:linear-gradient(160deg,var(--gold),#C2700A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #9A5806}
.bdg b{font-size:14.5px;letter-spacing:-.01em}
.bdg span{font-size:12.5px;color:var(--muted);line-height:1.35}
.bdg.lock{opacity:.55}
.bdg.lock .ic{background:var(--panel);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line2)}
.parth{display:flex;align-items:baseline;gap:14px;margin:34px 0 12px}
.parth h3{margin:0;font-size:19px;letter-spacing:-.03em}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:18px 18px 16px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.mcard .tp{display:flex;justify-content:space-between;align-items:center}
.mcard .no{font:500 26px/1 var(--mono);letter-spacing:-.04em;color:var(--faint)}
.mcard.done .no{color:var(--go)} .mcard.ip .no{color:var(--accent)}
.mcard h4{margin:4px 0 0;font-size:17px;line-height:1.25;letter-spacing:-.02em}
.mcard .ft{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.foot-note{margin-top:40px;font-size:13px;color:var(--faint);max-width:720px}

/* module page */
.mhead{padding:36px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.mhead h1{font-size:clamp(34px,4.4vw,56px);line-height:1;letter-spacing:-.05em;margin:10px 0 14px}
.mhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.mhead .big{font:500 110px/0.8 var(--mono);letter-spacing:-.08em;color:var(--line2);text-align:right}
.path{position:relative;max-width:760px;margin:36px auto 0;padding:10px 0}
.pnode{position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;margin:0 0 26px;transform:translateX(var(--dx,0))}
.pnode .o{flex:none;position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--num);background:var(--card);border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2);color:var(--muted);transition:transform .1s}
.pnode:hover .o{transform:translateY(-2px)}
.pnode.done .o{background:var(--go);border-color:#0A7A47;color:#fff;box-shadow:0 5px 0 #0A6B3E}
.pnode.cur .o{background:var(--accent);border-color:#0F5FA6;color:#fff;box-shadow:0 5px 0 #0D5290}
.pnode.cur .o::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);opacity:.5}
@media (prefers-reduced-motion:no-preference){.pnode.cur .o::after{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}}
.pnode .t{padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;flex:1;max-width:420px}
.pnode .t b{display:block;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pnode .t span{font:500 11.5px var(--mono);color:var(--muted)}
.pnode.cur .t{border-color:var(--accent)}
.mnav{display:flex;justify-content:space-between;gap:12px;max-width:760px;margin:30px auto 0}

/* lesson page */
.lgrid{display:grid;grid-template-columns:minmax(0,760px) 230px;gap:44px;justify-content:center}
.lhead{padding:28px 32px 26px;margin-bottom:30px}
.lhead .back{font-size:14px;color:var(--muted);text-decoration:none}
.lhead .back:hover{color:var(--ink)}
.lhead .idrow{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.lhead .lid{font:600 20px/1 var(--mono);color:var(--accent)}
.lhead h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.045em;margin:0 0 18px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.lhead .seg{margin-top:20px}
.prose{font-size:17px;line-height:1.72}
.prose>p{margin:0 0 18px}
.prose h2{counter-increment:h;font-size:24px;letter-spacing:-.035em;line-height:1.2;margin:46px 0 14px;display:flex;align-items:baseline;gap:12px}
.prose h2::before{content:counter(h,decimal-leading-zero);font:500 13px var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:7px;transform:translateY(-3px)}
.prose{counter-reset:h fig}
.prose ul,.prose ol{padding-left:22px;margin:0 0 18px}
.prose li{margin:6px 0}
.prose ul li::marker{color:var(--accent)}
.prose ol li::marker{font:600 14px var(--mono);color:var(--accent)}
.prose code{font:500 .86em var(--mono);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.prose strong{font-weight:650}
.code{font:13.5px/1.6 var(--mono);background:#16161A;color:#E9E9EE;padding:18px 20px;border-radius:14px;overflow-x:auto;margin:0 0 20px;border:1px solid #000}
.take{margin:26px 0;padding:20px 22px 20px 22px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);position:relative}
.take .lab{color:var(--accent);margin-bottom:8px}
.take p{margin:0;font-weight:550;font-size:17px}

.tbl{overflow-x:auto;margin:0 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--card)}

.dg{counter-increment:fig;margin:26px 0;padding:22px 20px 14px;border-radius:18px;background-color:var(--card);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.dg figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.5}

.dg-scroll{overflow-x:auto;padding-bottom:4px}
.dg-scroll svg{display:block;margin:0 auto}
.dg-hint{font:500 11px var(--mono);color:var(--faint);margin-top:6px}
.layers{display:flex;flex-direction:column;gap:0;max-width:560px;margin:0 auto}
.lay{padding:12px 16px;border-radius:12px;background:var(--card);border:1.3px solid var(--ink);box-shadow:0 3px 0 var(--dg-sh);display:flex;flex-direction:column}
.lay strong{font-size:15px}
.lay span{font-size:13.5px;color:var(--muted)}
.lay.hot{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.lay.hot strong{color:var(--accent)}
.lay-arr{text-align:center;color:var(--faint);font-size:14px;line-height:22px}
.wip{padding:14px 18px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-size:15px;margin-bottom:18px}

.blk{margin-top:44px;padding:26px}

.blk h3{margin:0 0 6px;font-size:21px;letter-spacing:-.03em;line-height:1.3}

textarea{width:100%;min-height:140px;resize:vertical;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.saved{font:500 12px var(--mono);color:var(--faint)}
.sample{margin-top:18px;padding:18px 20px;border-radius:14px;background:var(--go-soft);border:1px solid color-mix(in srgb,var(--go) 30%,transparent)}
.sample .lab{color:var(--go);margin-bottom:8px}
.sample p{margin:0;font-size:16px}
.grade{margin-top:18px}
.grade .gb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gbtn{padding:12px 10px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--line2);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.gbtn small{font:500 11px var(--mono);color:var(--muted)}
.gbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.gbtn[data-g="1"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.gbtn[data-g="2"][aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 3px 0 var(--gold);color:var(--gold)}
.gbtn[data-g="3"][aria-pressed="true"]{background:var(--go-soft);border-color:var(--go);box-shadow:0 3px 0 var(--go);color:var(--go)}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.srcs li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.srcs .fav{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 15px var(--num);color:var(--accent)}
.srcs .tx{flex:1;min-width:0}
.srcs a{font-weight:600;text-decoration:none;line-height:1.35;display:block}
.srcs a:hover{color:var(--accent)}
.srcs .n{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.srcs .h{font:500 11px var(--mono);color:var(--faint)}
.rep{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.rep.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.done-zone{margin-top:44px;padding:30px 26px;text-align:center;border-radius:22px;background:var(--panel)}
.done-zone p{margin:10px 0 0;font:500 12px var(--mono);color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pn a{padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s}
.pn a:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.pn a b{font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pn a.nx{text-align:right;grid-column:2}
.pn a.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rail{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:14px}
.rail .card{padding:16px}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--line);text-decoration:none;font-size:13.5px;color:var(--muted);line-height:1.4}
.toc a.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}

/* review */
.rv{max-width:680px;margin:0 auto}
.rvtop{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:8px 0 18px}
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;min-height:340px;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:30px;border-radius:22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.face.fr{background:var(--card);border:1px solid var(--line);box-shadow:var(--lift)}

.rvbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.empty{padding:44px 30px;text-align:center}
.empty .big{font:700 56px/1 var(--num);color:var(--line2)}

/* palette, toasts */
#pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,10,14,.42);backdrop-filter:blur(3px)}
#pal.on{display:flex}
.palbox{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font:18px var(--body);background:transparent;color:var(--ink);outline:none}
#palres{max-height:52vh;overflow-y:auto;padding:8px}
#palres a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none}
#palres a.on{background:var(--accent-soft)}
#palres .id{font:500 12px var(--mono);color:var(--accent);width:44px;flex:none}
#palres .tt{flex:1;min-width:0}
#palres .tt b{display:block;font-weight:600;font-size:15px}
#palres .tt span{font-size:12.5px;color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px;border-radius:999px;background:#1B1B1E;color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:tin .3s ease-out}
.toast b{font-family:var(--num);font-weight:500;color:#7CC7FF}
.toast.big{padding:16px 24px;font-size:16px;background:linear-gradient(180deg,#22B26F,#0F8C52)}
.toast.big b{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:85;width:100%;height:100%}

@media (max-width:1279px){.lgrid{grid-template-columns:minmax(0,760px)}.rail{display:none}.float.f2{right:262px;width:230px}}

/* ---- taste pass: fanout brand system (Taste Engine extraction) + slop-rubric fixes ---- */

const DATA = [{"n":"01","name":"Neural network building blocks","lessons":[{"id":"01.01","t":"Neurons, layers and the MLP","n":["A neuron computes an affine function of its inputs followed by a nonlinearity, $h = \\phi(w^\\top x + b)$; a layer is many neurons sharing the same input, i.e. one matrix multiply plus an elementwise $\\phi$.","Without the nonlinearity, any stack of layers collapses to a single linear map, so depth buys nothing.","The universal approximation theorem says one wide hidden layer can approximate any continuous function on a compact set, but it says nothing about how wide, how to find the weights, or how well it generalises.","Depth helps because composition reuses features: some functions need exponentially many units with one hidden layer but only a modest number with several layers.","Count parameters and shapes before anything else: a dense layer from $n_{in}$ to $n_{out}$ has $n_{in} n_{out} + n_{out}$ parameters and costs about $n_{in} n_{out}$ multiply-adds per example."],"a":"## Where this course starts\nThis module builds a neural network from its smallest parts: the neuron, the activation, the loss, the backward pass that computes gradients, and the initial weights that let training start at all. Module 02 then covers what keeps deep networks trainable (normalisation, regularisation, schedules, diagnostics), and Module 03 applies all of it to convolutional networks. The maths of gradients and the optimiser update rules themselves (SGD, momentum, Adam) live in ML Maths; here they are tools.\n\n## One neuron, one layer\nA neuron takes a vector $x \\in \\mathbb{R}^{n}$, forms a weighted sum plus a bias, and passes it through a nonlinearity $\\phi$:\n\n$$h = \\phi(w^\\top x + b)$$\n\nWith $\\phi$ = step function this is Rosenblatt's perceptron; with $\\phi$ = sigmoid it is logistic regression. A **layer** is $m$ neurons reading the same input. Stack their weight vectors as rows of $W \\in \\mathbb{R}^{m \\times n}$ and the whole layer is one matrix multiply:\n\n$$h = \\phi(Wx + b), \\quad W: m \\times n, \\; b: m$$\n\nIn code you process a batch of $B$ examples at once, so inputs are a $B \\times n$ matrix and the layer computes `X @ W.T + b`, giving $B \\times m$. Getting these shapes right is most of the work in debugging a network.\n\n%%flow A two-layer MLP for 10-class classification: affine, nonlinearity, affine, then the loss turns logits into a number.\nx: B×784 -(W1, b1)-> z1: B×256 -(ReLU)-> h1: B×256 -(W2, b2)-> *logits: B×10 -(softmax + CE)-> loss\n%%\n\n## Why the nonlinearity is mandatory\nTwo linear layers compose to one: $W_2(W_1 x + b_1) + b_2 = (W_2 W_1)x + (W_2 b_1 + b_2)$. A 100-layer linear network has exactly the expressive power of logistic regression; it only has a different (and worse) optimisation landscape. The elementwise $\\phi$ breaks this. With ReLU, each hidden unit splits input space with a hyperplane, and the network becomes a piecewise-linear function whose number of linear pieces grows with width and, much faster, with depth.\n\n## Universal approximation, and what it does not say\nThe universal approximation theorem (Cybenko 1989 for sigmoids, Hornik and others for general non-polynomial activations) states that a network with **one** hidden layer and enough units can approximate any continuous function on a bounded domain to any accuracy. Three caveats make it less useful than it sounds:\n- **Width can be enormous.** The theorem is existential; the number of units needed can grow exponentially with input dimension.\n- **It says nothing about learning.** Gradient descent may never find the weights that exist.\n- **It says nothing about generalisation.** Fitting the training points is not the same as predicting new ones.\n\n## Why depth helps\nDeep networks win in practice for reasons the theorem doesn't cover:\n- **Compositional reuse.** Layer 2 builds on layer 1's features, layer 3 on layer 2's. In images: edges, then textures, then parts, then objects. A shallow net must build every high-level feature from raw pixels independently.\n- **Exponential efficiency for some functions.** Telgarsky showed functions computable by a network with $O(k^3)$ layers and constant width that need on the order of $2^k$ units if the network has only $O(k)$ layers. The classic intuition: a ReLU \"tent\" composed with itself $k$ times makes a sawtooth with $2^k$ teeth using $O(k)$ units, while one hidden layer needs a unit per tooth.\n- **Parameter efficiency.** At a fixed parameter budget, deeper-and-narrower usually beats shallow-and-wide on real data.\n\nDepth has a cost: gradients must travel through many layers and can vanish or explode. Most of Module 02 and the residual connection in 03.04 exist to pay that cost.\n\n## Counting parameters and compute\nA dense layer $n_{in} \\to n_{out}$ has $n_{in} n_{out}$ weights plus $n_{out}$ biases, and costs $n_{in} n_{out}$ multiply-adds (MACs) per example in the forward pass. The backward pass costs about twice that (one matmul for the input gradient, one for the weight gradient), so training is roughly 3× forward compute.\n\n```python\nimport numpy as np\n\ndef mlp_forward(X, params):\n    # params: list of (W, b) with W shaped (n_out, n_in)\n    h = X\n    for i, (W, b) in enumerate(params):\n        z = h @ W.T + b\n        h = np.maximum(z, 0) if i < len(params) - 1 else z   # no ReLU on logits\n    return h\n\nrng = np.random.default_rng(0)\nsizes = [784, 256, 10]\nparams = [(rng.normal(0, np.sqrt(2 / a), (b_, a)), np.zeros(b_)) for a, b_ in zip(sizes, sizes[1:])]\nprint(mlp_forward(rng.normal(size=(32, 784)), params).shape)   # (32, 10)\n```\n\n! Example: sizing an MNIST MLP\n! Layer 1: 784 × 256 weights + 256 biases = 200,960 parameters. Layer 2: 256 × 10 + 10 = 2,570. Total 203,530 parameters, about 0.8 MB in fp32.\n! Forward cost per image is about 203k MACs; a batch of 128 is about 26 million MACs, trivial for any GPU. Notice 99% of parameters sit in the first layer: wide inputs dominate MLP cost, which is one reason images moved to convolutions (Module 03).\n\n| Question | Answer |\n| What does one hidden layer guarantee? | Approximation exists, given enough units |\n| What does it not guarantee? | Reasonable width, learnability, generalisation |\n| Why go deeper? | Feature reuse, exponential savings on compositional functions |\n| What does depth cost? | Harder gradient flow; needs init, normalisation, residuals |\n\n> Takeaway: an MLP is alternating affine maps and elementwise nonlinearities; the nonlinearity is what gives it power, and depth is what makes that power cheap, at the price of harder optimisation.\n\nAI Research's \"Neural Network from Scratch\" lessons build these pieces in code step by step; this lesson is the conceptual frame for the rest of the course.","q":"A colleague removes every activation from a 10-layer, 512-wide MLP \"to make it train faster\" and finds training accuracy drops to that of logistic regression. Explain exactly why, and whether adding more layers would recover the lost accuracy.","s":"Without activations each layer is affine, and a composition of affine maps is affine: $W_{10}\\cdots W_1 x + c$ collapses to a single matrix $M$ and bias. The network therefore represents exactly the same function class as a single linear layer followed by softmax, which is multinomial logistic regression. Its decision boundaries are hyperplanes no matter how many parameters it has. Adding layers cannot help, because every extra linear layer is absorbed into $M$; at best it changes the optimisation dynamics (deep linear nets have non-convex landscapes and can train more slowly), never the expressive power. Accuracy comes back only by restoring a nonlinearity such as ReLU between the affine maps, which lets each layer bend the representation so later layers can separate classes that are not linearly separable in the input.","r":[["Deep Learning (Goodfellow, Bengio, Courville), Chapter 6","https://www.deeplearningbook.org/contents/mlp.html","Sections 6.1 and 6.4 on XOR, universal approximation and the argument for depth."],["Dive into Deep Learning: Multilayer Perceptrons","https://d2l.ai/chapter_multilayer-perceptrons/mlp.html","Short derivation of why hidden layers need nonlinearities, with runnable code."],["Telgarsky: Benefits of depth in neural networks","https://arxiv.org/abs/1602.04485","The sawtooth construction showing exponential separation between deep and shallow nets."],["CS231n: Neural Networks Part 1","https://cs231n.github.io/neural-networks-1/","Neuron model, layer sizing and the representational-power discussion."]],"k":["MLP","universal approximation","depth"],"x":["NumPy"],"p":["multi-layer-perceptron-forward-pass","evaluate-multi-layer-perceptron","simple-neural-network","evaluate-dense-layer","perceptron"],"ak":""},{"id":"01.02","t":"Activation functions","n":["Sigmoid and tanh saturate: for large $|x|$ their derivative goes to zero, and sigmoid's derivative never exceeds 0.25, so stacked sigmoids shrink gradients geometrically.","ReLU has gradient exactly 1 for positive inputs, which keeps deep gradients alive, but a unit whose input stays negative gets zero gradient forever (a dead unit).","GELU, $x\\Phi(x)$, and SiLU, $x\\sigma(x)$, are smooth ReLU-like gates that let small negative values through; they are the defaults in Transformers.","Write activations in numerically safe forms: compute sigmoid and softplus with branches or $\\log(1+e^{-|x|})$ so `exp` never overflows."],"a":"## What an activation is for\nThe previous lesson showed the nonlinearity is what makes depth meaningful. The choice of nonlinearity then decides two practical things: how gradients flow backward through many layers, and whether the forward computation stays finite in floating point. This lesson goes through the common choices in historical order, because each one fixes a failure of the last.\n\n## Sigmoid and tanh: smooth but saturating\n$$\\sigma(x) = \\frac{1}{1+e^{-x}}, \\qquad \\sigma'(x) = \\sigma(x)(1-\\sigma(x)) \\le 0.25$$\n$$\\tanh(x) = 2\\sigma(2x) - 1, \\qquad \\tanh'(x) = 1 - \\tanh^2(x) \\le 1$$\n\nBoth squash to a bounded range. Their problem is **saturation**: when $|x|$ is large the curve is flat, the derivative is near zero, and backprop multiplies the upstream gradient by that near-zero number. With sigmoid the best case is a factor of 0.25 per layer; ten layers gives at most $0.25^{10} \\approx 10^{-6}$. Sigmoid is also not zero-centred: its outputs are all positive, so the gradients on a downstream neuron's weights all share one sign, which makes updates zig-zag. Tanh fixes the centring but still saturates.\n\nSigmoid remains the right tool where you need a probability or a gate: the output of a binary classifier, LSTM gates, attention-free gating like squeeze-and-excitation (03.05).\n\n## ReLU and its variants\n$$\\mathrm{ReLU}(x) = \\max(0, x), \\qquad \\mathrm{ReLU}'(x) = \\mathbb{1}[x > 0]$$\n\nReLU made deep supervised nets practical (AlexNet, 2012). For active units the gradient passes through unchanged, so there is no per-layer shrinkage; it is also one comparison to compute. Its failure mode is the **dead unit**: if a unit's pre-activation is negative for every input (often after one large update pushes its bias very negative), its gradient is zero for every example and it never recovers. Fixes:\n- **Leaky ReLU**: $\\max(\\alpha x, x)$ with $\\alpha \\approx 0.01$, so negative inputs still carry a small gradient.\n- **ELU**: $\\alpha(e^x - 1)$ for $x<0$, smooth and with negative mean outputs.\n- Lower learning rate and proper initialisation (01.05) prevent most deaths in the first place.\n\n## GELU and SiLU: smooth gates\nModern Transformers and many CNNs use activations that behave like ReLU for large $|x|$ but are smooth near zero and allow small negative outputs:\n\n$$\\mathrm{GELU}(x) = x\\,\\Phi(x) \\approx 0.5x\\left(1 + \\tanh\\!\\left(\\sqrt{2/\\pi}\\,(x + 0.044715x^3)\\right)\\right)$$\n$$\\mathrm{SiLU}(x) = x\\,\\sigma(x) \\quad \\text{(also called Swish)}$$\n\nRead them as \"multiply the input by a soft probability that it should pass\". Both are non-monotonic: a minimum around $x \\approx -0.75$ (GELU) or $x \\approx -1.28$ (SiLU). Smoothness gives better-behaved second-order structure and empirically small but consistent accuracy gains in large models. Gated variants such as SwiGLU multiply two projections, one through SiLU; AI Research covers that in its SwiGLU lesson.\n\n| Activation | Range | Max derivative | Main failure |\n| Sigmoid | (0, 1) | 0.25 | saturation, not zero-centred |\n| Tanh | (-1, 1) | 1 | saturation |\n| ReLU | [0, ∞) | 1 | dead units |\n| Leaky ReLU | (-∞, ∞) | 1 | extra hyperparameter |\n| GELU / SiLU | about (-0.17 / -0.28, ∞) | about 1.1 | costlier to compute |\n\n%%flow How the choice of activation shows up in training: the derivative at each layer multiplies the backward signal.\nUpstream grad -(× φ'(z) at layer L)-> Layer L-1 -(× φ'(z))-> Layer L-2 -(sigmoid: ≤ 0.25 each)-> *Vanished at layer 1\n%%\n\n## Numerically safe forms\nNaive formulas overflow. `np.exp(-x)` for $x = -1000$ is `inf`; dividing gives 0 with a warning, and anything downstream that takes a log produces `-inf` or `nan`. The fixes all rely on never exponentiating a large positive number:\n\n```python\nimport numpy as np\n\ndef sigmoid(x):\n    # e^{-|x|} is always in (0, 1]: no overflow on either side\n    e = np.exp(-np.abs(x))\n    return np.where(x >= 0, 1 / (1 + e), e / (1 + e))\n\ndef softplus(x):            # log(1 + e^x), the smooth ReLU\n    return np.maximum(x, 0) + np.log1p(np.exp(-np.abs(x)))\n\ndef log_sigmoid(x):         # log σ(x) = -softplus(-x)\n    return -softplus(-x)\n\ndef tanh(x):\n    return np.tanh(x)       # library tanh is already stable; 2σ(2x)-1 loses precision near 0\n```\n\nTwo related rules carry into the next lesson: compute `log(softmax)` with log-sum-exp rather than taking the log of a softmax, and feed **logits** to loss functions (`BCEWithLogitsLoss`, `CrossEntropyLoss`) instead of probabilities, so the library can use these stable forms.\n\n! Example: how much gradient survives 6 layers\n! Suppose every pre-activation is near zero, the best case for sigmoid. Each layer multiplies the gradient by $\\sigma'(0) = 0.25$, so after 6 layers $0.25^6 \\approx 2.4 \\times 10^{-4}$ of the signal remains, before counting weights.\n! With tanh, $\\tanh'(0) = 1$, so near zero the signal survives; but if pre-activations drift to $|z| = 3$, $\\tanh'(3) \\approx 0.0099$ and six layers leave about $10^{-12}$.\n! With ReLU, active units pass a factor of exactly 1; the risk moves from shrinking gradients to units being off entirely.\n\n> Takeaway: pick ReLU-family or GELU/SiLU for hidden layers, keep sigmoid and tanh for outputs and gates, and always implement activations and their logs in forms that never exponentiate a large positive number.","q":"A 20-layer tanh network trains well at learning rate 1e-3 but at 1e-1 the loss stops improving within a few hundred steps, and inspecting activations shows most values at ±1. A ReLU version at 1e-1 stalls too, but its activations are mostly exactly 0. Explain both failures in terms of the activation derivatives, and suggest one fix for each.","s":"Tanh: the large learning rate pushes weights large, so pre-activations land deep in the flat tails where $\\tanh' = 1 - \\tanh^2 \\approx 0$. Every saturated layer multiplies the backward signal by nearly zero, so gradients to early layers vanish and learning stalls even though the units are not dead in principle. Fix: lower learning rate, Xavier initialisation, or normalisation layers that keep pre-activations near zero. ReLU: a big update drove many units' pre-activations negative for all inputs; their derivative is exactly 0, so they get no gradient and never come back (dead units). The signal is not shrinking smoothly, it is cut off. Fix: lower learning rate or warmup, He initialisation, or Leaky ReLU/GELU so negative inputs keep a small gradient. Both cases show that the activation's derivative profile determines which way a too-large step breaks training.","r":[["Hendrycks & Gimpel: Gaussian Error Linear Units (GELUs)","https://arxiv.org/abs/1606.08415","Definition of GELU, the tanh approximation and comparisons with ReLU and ELU."],["Ramachandran, Zoph, Le: Searching for Activation Functions","https://arxiv.org/abs/1710.05941","Where Swish ($x\\sigma(\\beta x)$) came from, found by automated search."],["CS231n: Neural Networks Part 1 (activation functions)","https://cs231n.github.io/neural-networks-1/","Sigmoid saturation, non-zero-centred outputs and dying ReLUs, concisely."],["PyTorch docs: torch.nn.GELU","https://pytorch.org/docs/stable/generated/torch.nn.GELU.html","The exact and tanh-approximate forms as implemented."]],"k":["activations","saturation","numerical stability"],"x":["NumPy"],"p":["activation-functions","derivatives-of-common-activation-functions","sigmoid-stable","continuity-of-activation-functions","sigmoid-boundedness-via-squeeze-theorem"],"ak":""},{"id":"01.03","t":"Loss functions for deep learning","n":["Most losses are negative log-likelihoods: cross-entropy assumes a categorical output, MSE a Gaussian with fixed variance, so the loss encodes what noise you believe in.","Softmax plus cross-entropy has the gradient $p - y$ with respect to the logits; compute it from logits with log-sum-exp, never by taking the log of probabilities.","MSE's gradient grows linearly with the error, so outliers dominate; Huber loss switches to a constant-magnitude gradient beyond a threshold $\\delta$.","Focal loss multiplies cross-entropy by $(1-p_t)^\\gamma$ to down-weight easy examples; margin losses (hinge, triplet) only push until a gap is reached and then stop."],"a":"## A loss is a modelling choice\nThe loss is the only signal the network gets about what you want. Most standard losses are the **negative log-likelihood** of the data under an assumed output distribution, which makes the choice less arbitrary than it looks:\n- Categorical output, $p = \\mathrm{softmax}(z)$: NLL is **cross-entropy**.\n- Bernoulli output, $p = \\sigma(z)$: NLL is **binary cross-entropy**.\n- Gaussian output with fixed variance: NLL is **mean squared error** up to constants.\n- Laplace output: NLL is **mean absolute error**.\n\nSo picking MSE means \"I believe errors are Gaussian\"; if they are heavy-tailed, the loss will over-react to outliers. The ML course covers logistic regression and the classical metrics; AI Research covers entropy and KL divergence. This lesson focuses on how the losses behave inside a deep network's training loop.\n\n## Cross-entropy from logits\nFor $C$ classes, logits $z \\in \\mathbb{R}^C$ and true class $y$:\n\n$$\\mathcal{L} = -\\log \\frac{e^{z_y}}{\\sum_j e^{z_j}} = -z_y + \\log\\sum_j e^{z_j}$$\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial z_j} = p_j - \\mathbb{1}[j = y]$$\n\nThe gradient is \"predicted probability minus target\", bounded in $[-1, 1]$ per logit. This clean form is why softmax and cross-entropy are always fused. The stable computation uses log-sum-exp with the max subtracted:\n\n```python\nimport numpy as np\n\ndef cross_entropy(logits, y):          # logits (B, C), y (B,) int labels\n    m = logits.max(axis=1, keepdims=True)\n    lse = m[:, 0] + np.log(np.exp(logits - m).sum(axis=1))\n    loss = lse - logits[np.arange(len(y)), y]\n    p = np.exp(logits - lse[:, None])\n    grad = p.copy(); grad[np.arange(len(y)), y] -= 1\n    return loss.mean(), grad / len(y)\n```\n\nBinary cross-entropy has the same trick: $\\mathcal{L} = \\max(z,0) - zy + \\log(1 + e^{-|z|})$. This is why PyTorch's `BCEWithLogitsLoss` and `CrossEntropyLoss` take raw logits. Feeding them probabilities (or applying softmax twice) is a common silent bug: training still runs but gradients are badly scaled.\n\n**Label smoothing** replaces the one-hot target with $1-\\varepsilon$ on the true class and $\\varepsilon/(C-1)$ elsewhere (one common convention). It stops the network driving logits to infinity to reach probability 1, which improves calibration.\n\n! Example: one cross-entropy step by hand\n! Logits $z = [2.0, 1.0, 0.1]$, true class 0. Exponentials: 7.389, 2.718, 1.105; sum 11.212.\n! Probabilities: $p = [0.659, 0.242, 0.099]$. Loss $= -\\ln 0.659 = 0.417$.\n! Gradient on logits: $[0.659 - 1, 0.242, 0.099] = [-0.341, 0.242, 0.099]$. The gradient sums to zero: raising the true logit and lowering the others are the same move.\n\n## Regression: MSE, MAE, Huber\nMSE $= \\frac{1}{2}(\\hat y - y)^2$ has gradient $\\hat y - y$, linear in the error. One target that is wrong by 100 contributes a gradient 100× larger than a typical example, so a few outliers steer the whole batch. MAE has gradient $\\pm 1$, robust but non-smooth at zero and slow to fine-tune. **Huber** blends them:\n\n$$\\mathcal{L}_\\delta(r) = \\begin{cases} \\tfrac{1}{2} r^2 & |r| \\le \\delta \\\\ \\delta(|r| - \\tfrac{1}{2}\\delta) & |r| > \\delta \\end{cases}$$\n\nQuadratic near zero, linear beyond $\\delta$, so the gradient magnitude is capped at $\\delta$. DQN uses it on TD errors for exactly this reason (Module 08); detection uses smooth-L1 (Huber with $\\delta = 1$) for box regression.\n\n## Focal and margin losses\n**Focal loss** targets class imbalance in dense detection, where a single image has around 100k candidate boxes and almost all are easy background:\n\n$$\\mathrm{FL}(p_t) = -\\alpha_t (1 - p_t)^\\gamma \\log p_t$$\n\nwith $p_t$ the probability of the true class and typically $\\gamma = 2$. An easy example at $p_t = 0.9$ has its loss scaled by $0.01$; a hard one at $p_t = 0.1$ by $0.81$. The thousands of easy negatives stop drowning out the rare positives.\n\n**Margin losses** don't model probabilities at all. They push until a required gap is reached and then contribute zero:\n- **Hinge** (SVM): $\\max(0, 1 - y \\cdot s)$ for labels $\\pm 1$.\n- **Triplet**: $\\max(0, d(a, p) - d(a, n) + m)$, pulling an anchor closer to a positive than to a negative by margin $m$; used for embeddings and face recognition.\n- **Contrastive / InfoNCE**: cross-entropy over similarities, one positive among many negatives (CLIP); really a softmax loss in disguise.\n\n| Loss | Gradient size for a bad example | Typical use |\n| Cross-entropy | bounded, about 1 per logit | classification, language models |\n| MSE | grows with error | clean regression |\n| Huber | capped at $\\delta$ | noisy regression, box offsets, TD errors |\n| Focal | CE scaled by $(1-p_t)^\\gamma$ | dense detection, extreme imbalance |\n| Hinge / triplet | constant until margin met, then 0 | SVMs, metric learning |\n\n%%flow Where the loss sits: it is the root of the computational graph, and its gradient is the first signal backprop sends.\nLogits -(softmax)-> Probabilities -(−log p_y)-> *Scalar loss -(∂L/∂z = p − y)-> Backward pass\n%%\n\n> Takeaway: choose the loss as a statement about your output distribution and your data's noise, compute it from logits in its stable form, and reach for Huber, focal or margin losses when outliers, imbalance or ranking make plain NLL misbehave.","q":"You train a classifier on 1% positives and 99% negatives with plain binary cross-entropy. It reaches 99% accuracy but almost never predicts the positive class. Explain, using gradients, why plain BCE behaves this way and how focal loss and class weighting each change the gradient contributions.","s":"Each example contributes a gradient of size $|p - y|$ on its logit. Early on the network learns to output a low probability for everything; then 99% of examples are easy negatives with small but non-zero gradients, and their sum still outweighs the few positives, so the optimiser keeps refining the negatives and accepts misclassifying positives. Accuracy looks great because predicting all-negative is 99% correct. Class weighting multiplies the positive examples' loss (and gradient) by a factor like 99, rebalancing the total gradient mass between classes regardless of difficulty. Focal loss instead scales each example by $(1-p_t)^\\gamma$: well-classified negatives with $p_t \\approx 0.95$ are scaled by about $0.0025$ at $\\gamma=2$, while misclassified positives keep most of their gradient. It reweights by difficulty, which handles imbalance indirectly because easy examples are mostly the majority class. In practice both are combined (the $\\alpha_t$ term) and the threshold is tuned on a validation set.","r":[["Lin et al.: Focal Loss for Dense Object Detection","https://arxiv.org/abs/1708.02002","Sections 3 and 5: the focal term, why easy negatives dominate, and the $\\gamma$ ablation."],["PyTorch docs: CrossEntropyLoss","https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html","Takes logits, supports class weights, ignore_index and label smoothing."],["PyTorch docs: HuberLoss","https://pytorch.org/docs/stable/generated/torch.nn.HuberLoss.html","Exact definition and its relation to SmoothL1Loss."],["Deep Learning (Goodfellow et al.), Chapter 6.2","https://www.deeplearningbook.org/contents/mlp.html","Cost functions as maximum likelihood and why saturating outputs need log-likelihood losses."]],"k":["cross-entropy","Huber","focal loss"],"x":["NumPy","PyTorch"],"p":["cross-entropy-logits","softmax-cross-entropy-gradient","log-loss-binary-cross-entropy","loss-functions","sigmoid-focal-loss"],"ak":""},{"id":"01.04","t":"Backpropagation through a computational graph","n":["Any computation built from simple operations forms a directed acyclic graph; each node only needs its local derivative to take part in backprop.","Reverse-mode autodiff runs the graph forward, then visits nodes in reverse topological order, multiplying the upstream gradient by each local derivative (the chain rule).","When a value feeds several consumers its gradient is the **sum** over all paths, so gradients must be accumulated with `+=`, and reset between steps.","Reverse mode gives the gradient of one scalar loss with respect to millions of parameters for about 2-3× the cost of the forward pass, at the price of storing intermediate activations."],"a":"## From chain rule to algorithm\nYou know the chain rule: if $L = f(g(x))$ then $\\frac{dL}{dx} = f'(g(x))\\,g'(x)$. Backpropagation is the chain rule applied systematically to a graph with millions of nodes, in an order that reuses work. ML Maths and AI Research's chain-rule lessons cover the calculus; here the point is the **algorithm** and the engineering around it, the thing PyTorch's autograd does every step.\n\n## The computational graph\nWrite any computation as a DAG: leaves are inputs and parameters, internal nodes are primitive operations (add, multiply, exp, tanh, matmul), and the root is the scalar loss. For each primitive you only need one rule: given the gradient of $L$ with respect to the node's output, produce the gradient with respect to each input. That rule needs only local information:\n- $c = a + b$: $\\bar a \\mathrel{+}= \\bar c$, $\\bar b \\mathrel{+}= \\bar c$ (addition routes gradient unchanged).\n- $c = a \\cdot b$: $\\bar a \\mathrel{+}= b\\,\\bar c$, $\\bar b \\mathrel{+}= a\\,\\bar c$ (multiplication swaps the inputs).\n- $c = \\tanh(a)$: $\\bar a \\mathrel{+}= (1 - c^2)\\,\\bar c$.\n- $C = AB$ (matrices): $\\bar A \\mathrel{+}= \\bar C B^\\top$, $\\bar B \\mathrel{+}= A^\\top \\bar C$.\n\nHere $\\bar v$ means $\\partial L / \\partial v$, the \"adjoint\". The global derivative falls out of composing local rules.\n\n%%flow Forward computes values left to right; backward sends adjoints right to left, each node applying only its local rule.\n[Forward] a, b -(mul)-> d = a·b -(add c)-> e = d + c -(mul f)-> *L = e·f\n[Backward] L̄ = 1 -(f̄ = e, ē = f)-> ē -(c̄ = ē, d̄ = ē)-> d̄ -(ā = b·d̄, b̄ = a·d̄)-> *Leaf grads\n%%\n\n## Why reverse order, and why accumulate\nA node's adjoint is complete only after **every** consumer has sent its contribution. Visiting nodes in reverse topological order guarantees that. If a value $x$ feeds two operations, its adjoint is the sum of the two path contributions, by the multivariate chain rule. That is why every rule above uses `+=`. Two classic bugs follow:\n- Using `=` instead of `+=`: a reused node (a weight shared across time steps, or $x$ in $x \\cdot x$) silently loses all but one path.\n- Forgetting to reset gradients between steps: PyTorch accumulates into `.grad` by design, which is why every loop calls `optimizer.zero_grad()`. The same behaviour is what makes gradient accumulation across micro-batches work (02.04).\n\n## A scalar autograd engine\nThe whole idea fits in a few dozen lines. Each value remembers its parents and a closure that applies its local rule:\n\n```python\nimport math\n\nclass Value:\n    def __init__(self, data, parents=()):\n        self.data, self.grad, self._parents, self._back = data, 0.0, parents, lambda: None\n    def __add__(self, o):\n        o = o if isinstance(o, Value) else Value(o); out = Value(self.data + o.data, (self, o))\n        def back(): self.grad += out.grad; o.grad += out.grad\n        out._back = back; return out\n    def __mul__(self, o):\n        o = o if isinstance(o, Value) else Value(o); out = Value(self.data * o.data, (self, o))\n        def back(): self.grad += o.data * out.grad; o.grad += self.data * out.grad\n        out._back = back; return out\n    def tanh(self):\n        t = math.tanh(self.data); out = Value(t, (self,))\n        def back(): self.grad += (1 - t * t) * out.grad\n        out._back = back; return out\n    def backward(self):\n        order, seen = [], set()\n        def visit(v):\n            if v not in seen:\n                seen.add(v); [visit(p) for p in v._parents]; order.append(v)\n        visit(self); self.grad = 1.0\n        for v in reversed(order): v._back()\n```\n\nKarpathy's micrograd is this design plus a few more operations and a tiny neural-network library on top; PyTorch is the same idea over tensors, with each primitive's backward written as a fused kernel.\n\n! Example: backprop by hand\n! Let $a = 3$, $b = -2$, $c = 5$, $f = -4$. Forward: $d = ab = -6$, $e = d + c = -1$, $L = ef = 4$.\n! Backward: $\\bar L = 1$. Multiply node: $\\bar e = f = -4$, $\\bar f = e = -1$. Add node routes unchanged: $\\bar d = \\bar c = -4$.\n! Multiply node: $\\bar a = b\\,\\bar d = (-2)(-4) = 8$, $\\bar b = a\\,\\bar d = 3 \\cdot (-4) = -12$.\n! Check one numerically: raising $a$ to 3.001 gives $d = -6.002$, $e = -1.002$, $L = 4.008$, a slope of 8. Finite differences like this are the standard way to test any hand-written backward.\n\n## Cost, memory, and why reverse mode\nFor a function $\\mathbb{R}^n \\to \\mathbb{R}$ (millions of parameters, one loss), reverse mode computes all $n$ partial derivatives in **one** backward pass costing a small constant times the forward pass, in practice 2-3× for matmul-heavy nets. Forward-mode autodiff would need $n$ passes, one per input direction. Forward mode wins only when outputs outnumber inputs. In Jacobian terms, reverse mode computes vector-Jacobian products, forward mode Jacobian-vector products.\n\nThe price is **memory**: the backward rules need forward values ($b$ for $\\bar a$, $t$ for tanh), so every intermediate activation is stored until its backward runs. For large models activations, not weights, often dominate memory. Activation checkpointing trades compute for memory by storing only some activations and recomputing the rest during backward.\n\n> Takeaway: backprop is reverse topological traversal applying local derivative rules and summing over paths; it gives every parameter's gradient for a few forward passes' compute, paid for with stored activations.","q":"In your scalar autograd engine, `y = x * x` with `x = 3` gives `x.grad == 3` after `y.backward()` instead of 6. The multiply's backward is `self.grad = other.data * out.grad; other.grad = self.data * out.grad`. Explain the bug through the graph structure and why the same bug would also break a recurrent network with shared weights.","s":"In `x * x` both inputs of the multiply node are the same object, so the node has two edges into `x`. The true derivative sums both paths: $\\partial y/\\partial x = x + x = 6$. With assignment, the second line overwrites the first: the first sets `x.grad = 3`, the second sets it to 3 again instead of adding, so one path's contribution is lost. Using `+=` gives 3 + 3 = 6. A recurrent network reuses the same weight matrix at every time step, so in the unrolled graph that weight has one consumer per step and its gradient must be the sum over all steps (backprop through time). With assignment, only the last-processed step's contribution would survive, so the weights would be trained as if the sequence had length 1. The general rule: any node with fan-out greater than one needs accumulation, and accumulated gradients must be zeroed before the next backward.","r":[["Karpathy: micrograd","https://github.com/karpathy/micrograd","A complete scalar autograd engine and neural-net library in about 150 lines; read engine.py."],["CS231n: Backpropagation, Intuitions","https://cs231n.github.io/optimization-2/","Gates as local gradient rules, patterns in backward flow, staged computation."],["Olah: Calculus on Computational Graphs","https://colah.github.io/posts/2015-08-Backprop/","Why reverse mode beats forward mode, with path-sum diagrams."],["Baydin et al.: Automatic Differentiation in Machine Learning: a Survey","https://arxiv.org/abs/1502.05767","Forward vs reverse mode, cost analysis, and how real AD systems are built."]],"k":["backprop","autodiff","computational graph"],"x":["Python"],"p":["run-reverse-mode-autodiff","backpropagation-through-computation-graph","accumulate-shared-path-gradients","topologically-sort-computation-dag","gradient-check-autodiff-graph"],"ak":""},{"id":"01.05","t":"Weight initialisation","n":["For a layer $z = Wx$ with independent zero-mean entries, $\\mathrm{Var}(z_i) = n_{in}\\,\\mathrm{Var}(w)\\,\\mathrm{Var}(x)$, so the weight variance must scale like $1/n_{in}$ to keep signals the same size layer after layer.","Xavier/Glorot sets $\\mathrm{Var}(w) = 2/(n_{in}+n_{out})$, a compromise between preserving forward activations and backward gradients, derived for tanh-like activations.","He/Kaiming sets $\\mathrm{Var}(w) = 2/n_{in}$ for ReLU, doubling the variance because ReLU zeroes half its inputs.","Initialising all weights to the same value (including zero) makes every hidden unit compute the same thing forever; random init exists to break symmetry."],"a":"## Why the starting point matters\nGradient descent needs a starting point, and for deep networks a bad one is fatal before the first update. If each layer multiplies the signal's scale by 0.9, a 50-layer network shrinks it by $0.9^{50} \\approx 0.005$; by 1.1, it grows by about 117×. The backward pass multiplies by the same weights transposed, so gradients vanish or explode the same way. Initialisation is about choosing the weight scale so that this per-layer factor is close to 1. Batch and layer normalisation (02.01, 02.02) and residual connections (03.04) make networks far less sensitive to init, but they don't remove the need for it.\n\n## Symmetry breaking\nIf every weight in a layer starts at the same value, every hidden unit receives the same input, computes the same output, and receives the same gradient. They stay identical forever and the layer behaves like a single unit. Random initialisation breaks this symmetry. Biases have no such problem and are usually set to zero.\n\n## The variance argument\nTake one pre-activation $z_i = \\sum_{j=1}^{n_{in}} w_{ij} x_j$, with weights and inputs independent, weights zero-mean. Then\n\n$$\\mathrm{Var}(z_i) = n_{in}\\,\\mathrm{Var}(w)\\,\\mathbb{E}[x_j^2]$$\n\nTo keep the scale constant across layers you need $n_{in}\\,\\mathrm{Var}(w) \\approx 1$ (adjusted for the activation). The backward pass sums over $n_{out}$ outputs instead, so preserving gradient variance needs $n_{out}\\,\\mathrm{Var}(w) \\approx 1$. Three classical schemes follow:\n\n| Scheme | Var(w) | Derived for | Default in |\n| LeCun | $1/n_{in}$ | linear / SELU | SELU networks |\n| Xavier (Glorot) | $2/(n_{in}+n_{out})$ | tanh, sigmoid near 0 | `nn.init.xavier_*` |\n| He (Kaiming) | $2/n_{in}$ | ReLU | CNNs with ReLU |\n\n**Xavier** averages the forward and backward conditions. **He** adds a factor 2 for ReLU: ReLU sets half its inputs to zero, so $\\mathbb{E}[\\mathrm{ReLU}(z)^2] = \\tfrac{1}{2}\\mathrm{Var}(z)$, and the weights must make up the lost half. He et al. showed this choice lets a 30-layer plain ReLU net converge where Xavier init stalls.\n\nFor a uniform distribution $U(-a, a)$ the variance is $a^2/3$, so Xavier-uniform uses $a = \\sqrt{6/(n_{in}+n_{out})}$ and He-uniform $a = \\sqrt{6/n_{in}}$. For convolutions, $n_{in} = C_{in} k^2$ (the fan-in of one output pixel).\n\n%%flow The per-layer gain decides everything: a factor slightly off 1 compounds over depth.\nInput var 1 -(gain g per layer)-> Layer 10: g^10 -(× g^40 more)-> *Layer 50: g^50 -(g = 0.9 → 0.005, g = 1.1 → 117)-> Vanish or explode\n%%\n\n```python\nimport numpy as np\n\ndef activation_stds(init_std, depth=50, width=512, seed=0):\n    rng = np.random.default_rng(seed)\n    h = rng.normal(size=(1000, width))\n    stds = []\n    for _ in range(depth):\n        W = rng.normal(0, init_std, (width, width))\n        h = np.maximum(h @ W, 0)\n        stds.append(h.std())\n    return stds\n\nfor s in (0.01, np.sqrt(2 / 512), 0.1):\n    print(f\"{s:.4f}\", f\"{activation_stds(s)[-1]:.3g}\")\n# 0.0100 -> collapses to ~0, 0.0625 (He) -> stays order 1, 0.1000 -> blows up\n```\n\n! Example: three inits for a 50-layer ReLU MLP of width 512\n! With ReLU each layer multiplies the second moment by about $n\\,\\sigma^2 / 2 = 256\\,\\sigma^2$.\n! $\\sigma = 0.01$: gain $0.0256$ per layer, so after 50 layers the variance is about $0.0256^{50} \\approx 10^{-80}$: every activation is effectively zero and so is every gradient.\n! $\\sigma = 0.1$: gain $2.56$ per layer, $2.56^{50} \\approx 10^{20}$: activations pass fp16's maximum of 65504 after about 20 layers.\n! $\\sigma = \\sqrt{2/512} = 0.0625$ (He): gain exactly 1; activations stay order one at every depth.\n\n## Practical notes\n- **Framework defaults differ.** PyTorch's `nn.Linear` and `nn.Conv2d` default to Kaiming-uniform with $a = \\sqrt{5}$, which works out to $U(-1/\\sqrt{n_{in}}, 1/\\sqrt{n_{in}})$, variance $1/(3n_{in})$: smaller than He. It trains fine with normalisation layers but is worth overriding in a deep plain ReLU net.\n- **Residual branches.** In a residual network the output is $x + F(x)$, so variance adds up with depth even if each branch is well initialised. Common fixes: zero-init the last BatchNorm scale in each block (each block starts as identity), or scale the residual projections by $1/\\sqrt{2N}$ for $N$ layers as GPT-2 does.\n- **Output layer.** Initialising logits small (or zero) means the initial loss is near $\\ln C$, which is the first sanity check in 02.05.\n- **Width scaling.** These rules fix the scale at initialisation only. How learning rates should scale with width (muP, the Maximal Update Parametrisation) is a separate question beyond this course; the practice problem on muP width invariants is a starting point.\n\n> Takeaway: choose the weight variance so each layer's gain is about 1, $2/n_{in}$ for ReLU and $2/(n_{in}+n_{out})$ for tanh, and break symmetry with randomness; with normalisation and residuals in place, init matters less but still decides whether step one is sane.","q":"You build a 40-layer plain (no residual, no normalisation) tanh network and initialise with He init because \"it's the modern default\". Training stalls immediately and activations in late layers are mostly near ±1. What went wrong, what init would you use instead, and why does the answer differ between tanh and ReLU?","s":"He init sets $\\mathrm{Var}(w) = 2/n_{in}$, which doubles the variance to compensate for ReLU discarding half its inputs. Tanh discards nothing; near zero it is approximately the identity, so with He init each layer's pre-activation variance roughly doubles until tanh saturates. Saturated units (outputs near ±1) have derivative $1 - \\tanh^2 \\approx 0$, so gradients vanish backward through 40 layers and training stalls. For tanh the right choice is Xavier/Glorot, $\\mathrm{Var}(w) = 2/(n_{in}+n_{out})$, or LeCun $1/n_{in}$, which keep the per-layer gain about 1 in the near-linear regime. The difference comes from the activation's second moment: ReLU halves $\\mathbb{E}[h^2]$ and needs a gain-2 correction, tanh roughly preserves it for small inputs and needs none. PyTorch encodes this as `nn.init.calculate_gain('relu') = sqrt(2)` versus `5/3` for tanh.","r":[["Glorot & Bengio: Understanding the difficulty of training deep feedforward neural networks","https://proceedings.mlr.press/v9/glorot10a.html","Origin of Xavier init, with measurements of activation and gradient variance by layer."],["He et al.: Delving Deep into Rectifiers","https://arxiv.org/abs/1502.01852","Section 2.2 derives the $2/n_{in}$ rule for ReLU and shows a 30-layer net that only trains with it."],["PyTorch docs: torch.nn.init","https://pytorch.org/docs/stable/nn.init.html","Exact formulas for xavier_*, kaiming_* and calculate_gain."],["Dive into Deep Learning: Numerical Stability and Initialization","https://d2l.ai/chapter_multilayer-perceptrons/numerical-stability-and-init.html","Vanishing and exploding gradients and the symmetry problem, with code."]],"k":["initialisation","variance preservation"],"x":["NumPy","PyTorch"],"p":["weight-initialization","multi-layer-perceptron-forward-pass","diagnose-mup-width-invariants"],"ak":""}]},{"n":"02","name":"Training deep networks","lessons":[{"id":"02.01","t":"Batch normalisation","n":["BatchNorm standardises each channel using the mean and variance of the current mini-batch, then applies a learned scale $\\gamma$ and shift $\\beta$ so the layer can undo the normalisation if that helps.","In training it uses batch statistics and updates running averages; in eval it uses the running averages, so `model.train()` versus `model.eval()` changes the output.","It lets you use much larger learning rates and makes training far less sensitive to initialisation; the modern explanation is a smoother loss landscape, not the original \"internal covariate shift\" story.","It breaks with small batches (noisy statistics), with train/eval distribution mismatch, and whenever examples in a batch should not influence each other."],"a":"## Why this module exists\nModule 01 gave you a network that can, in principle, train. This module covers what makes deep networks train **reliably**: normalisation layers (this lesson and 02.02), regularisation (02.03), the mechanics of mini-batch optimisation (02.04), and how to read the signs when training goes wrong (02.05). The optimiser update rules themselves are in ML Maths.\n\n## What BatchNorm computes\nFor a convolutional feature map of shape $(N, C, H, W)$, BatchNorm treats each channel $c$ separately and computes statistics over the batch **and** spatial dimensions, $N \\cdot H \\cdot W$ values per channel:\n\n$$\\mu_c = \\frac{1}{NHW}\\sum x_{n,c,h,w}, \\qquad \\sigma_c^2 = \\frac{1}{NHW}\\sum (x_{n,c,h,w} - \\mu_c)^2$$\n$$y = \\gamma_c \\frac{x - \\mu_c}{\\sqrt{\\sigma_c^2 + \\epsilon}} + \\beta_c$$\n\nFor an MLP activation of shape $(N, D)$ the statistics are over the batch only, one pair per feature. $\\gamma$ and $\\beta$ are learned per channel, so the layer can represent the identity if normalisation turns out to be unhelpful. Because $\\beta$ absorbs any constant offset, a convolution followed directly by BatchNorm needs no bias: set `bias=False`.\n\n%%flow Where BatchNorm sits in a typical CNN block, and the two different statistics it uses.\nConv (no bias) -(N×C×H×W)-> *BatchNorm -(γ, β per channel)-> ReLU -> Next conv\n[Train] Batch stats μ_B, σ²_B -(normalise)-> Output -(EMA update)-> Running μ, σ²\n[Eval] Running μ, σ² -(normalise)-> *Deterministic output\n%%\n\n## Train mode versus eval mode\nAt inference you may see a single example, so batch statistics are unavailable or meaningless. BatchNorm therefore keeps **running estimates** updated during training as an exponential moving average. In PyTorch, with `momentum=0.1`:\n\n$$\\hat\\mu \\leftarrow 0.9\\,\\hat\\mu + 0.1\\,\\mu_B$$\n\n(PyTorch's \"momentum\" is the weight on the new value, the opposite of the optimiser convention.) Normalisation in training uses the biased batch variance; the running variance stores the unbiased one. In `model.eval()` the layer uses the running estimates and becomes a fixed affine map, which can be folded into the preceding convolution's weights for deployment.\n\nThe most common BatchNorm bug is forgetting the mode switch. Evaluating in train mode makes predictions depend on which other examples share the batch, and updates the running stats with test data. Training in eval mode by accident freezes the statistics. Fine-tuning with tiny batches often deliberately keeps BN in eval mode (\"frozen BN\") for this reason.\n\n```python\nimport numpy as np\n\ndef batchnorm_train(x, gamma, beta, run_mu, run_var, momentum=0.1, eps=1e-5):\n    # x: (N, C, H, W); statistics per channel over N, H, W\n    mu = x.mean(axis=(0, 2, 3), keepdims=True)\n    var = x.var(axis=(0, 2, 3), keepdims=True)              # biased, used to normalise\n    n = x.size / x.shape[1]\n    run_mu[:] = (1 - momentum) * run_mu + momentum * mu.ravel()\n    run_var[:] = (1 - momentum) * run_var + momentum * var.ravel() * n / (n - 1)\n    xhat = (x - mu) / np.sqrt(var + eps)\n    return gamma[None, :, None, None] * xhat + beta[None, :, None, None]\n```\n\n## Why it helps\nThe original paper argued BN reduces **internal covariate shift**, the change in each layer's input distribution as earlier layers update. Later work (Santurkar et al., 2018) showed that injecting noise to increase that shift after BN barely hurts, and argued the real benefit is that BN makes the loss and its gradients smoother (smaller Lipschitz constants), so larger steps are safe. Other effects that are well established:\n- **Scale invariance.** The output of conv-then-BN doesn't change if you multiply the conv weights by a constant. The effective learning rate then depends on the weight norm, and weight decay interacts with it.\n- **Higher learning rates and robust init.** ResNets with BN train at learning rate 0.1 with SGD; without it they need careful init and smaller steps.\n- **Mild regularisation.** Each example is normalised with noisy batch statistics, a form of noise injection; BN networks often need less dropout.\n\n## Where it breaks\n- **Small batches.** With batch 2 per GPU the statistics are so noisy that accuracy drops sharply. Fixes: synchronised BN across devices, GroupNorm, or LayerNorm (02.02).\n- **Distribution mismatch.** If test data differ from training data, running statistics are wrong. Recomputing them on target data is a cheap adaptation trick.\n- **Sequences and autoregressive models.** Batch statistics mix information across examples and padding positions, and at generation time the batch is one token. This is why Transformers use LayerNorm.\n- **Information leakage.** In contrastive learning, BN can let the model cheat by detecting which examples share a batch.\n\n! Example: batch statistics for one channel\n! A channel holds values $[1, 3, 5, 7]$ across a batch of 4 (spatial size 1). $\\mu = 4$, biased $\\sigma^2 = (9+1+1+9)/4 = 5$, so $\\hat x = [-1.342, -0.447, 0.447, 1.342]$.\n! With $\\gamma = 2$, $\\beta = 0.5$: $y = [-2.18, -0.39, 1.39, 3.18]$.\n! Running mean starting from 0 with momentum 0.1 becomes 0.4; running variance from 1 becomes $0.9 + 0.1 \\cdot 5 \\cdot 4/3 = 1.567$, using the unbiased $20/3$. In eval mode, the same input would be normalised with these values, giving very different outputs until the running stats converge.\n\n> Takeaway: BatchNorm normalises each channel with batch statistics during training and running averages at eval, which buys larger learning rates and robustness to init; respect the train/eval switch and avoid it when batches are tiny or examples must stay independent.","q":"A model scores 92% validation accuracy when evaluated with batch size 256 but 61% when the same weights serve requests one at a time. The serving code never calls `model.eval()`. Explain what happens inside each BatchNorm layer in both settings, and why calling `eval()` fixes serving.","s":"Without `eval()` every BatchNorm layer stays in training mode and normalises with the statistics of the current batch. With 256 validation examples those statistics are close to the population statistics the network was trained against, so outputs look normal. With one example, each channel's batch mean over $N \\cdot H \\cdot W$ comes from a single image, and in an MLP layer with $N=1$ the variance is zero, so $\\hat x$ is roughly zero (or depends only on spatial variation within one image). The features the classifier sees bear little relation to training, so accuracy collapses. Training mode also keeps updating running averages with serving data. `model.eval()` makes each BN layer use the running mean and variance accumulated during training: a fixed per-channel affine transform independent of batch composition, so a single request produces the same output it would inside any batch.","r":[["Ioffe & Szegedy: Batch Normalization","https://arxiv.org/abs/1502.03167","Algorithms 1 and 2 give the training transform and the inference procedure with population statistics."],["Santurkar et al.: How Does Batch Normalization Help Optimization?","https://arxiv.org/abs/1805.11604","Experiments against the covariate-shift explanation and the smoothness argument."],["PyTorch docs: BatchNorm2d","https://pytorch.org/docs/stable/generated/torch.nn.BatchNorm2d.html","The momentum convention, biased vs unbiased variance, and track_running_stats."],["Dive into Deep Learning: Batch Normalization","https://d2l.ai/chapter_convolutional-modern/batch-norm.html","From-scratch implementation and discussion of train vs predict mode."]],"k":["batch norm","normalisation"],"x":["NumPy","PyTorch"],"p":["batch-normalization","apply-alphago-residual-block","resnet-residual-block"],"ak":""},{"id":"02.02","t":"Layer and RMS normalisation","n":["LayerNorm normalises each example (each token in a Transformer) over its own feature dimension, so it behaves identically in training and inference and has no dependence on batch size.","RMSNorm drops the mean subtraction and the bias: $y = g \\odot x / \\sqrt{\\mathrm{mean}(x^2) + \\epsilon}$; it is cheaper and works as well in large language models.","The backward pass of a normalisation layer is not elementwise: the gradient is projected to remove components along the mean and along the normalised vector itself.","Pre-LN Transformers (normalise inside the residual branch) train stably without warmup tricks; Post-LN can have exploding gradients near the output at initialisation."],"a":"## Normalise across features, not across the batch\nBatchNorm (02.01) ties each example's output to the rest of the batch. Layer normalisation removes that coupling by computing statistics over the **feature** dimension of one example. For a vector $x \\in \\mathbb{R}^D$ (one token's hidden state, for instance):\n\n$$\\mu = \\frac{1}{D}\\sum_i x_i, \\quad \\sigma^2 = \\frac{1}{D}\\sum_i (x_i - \\mu)^2, \\quad y = \\gamma \\odot \\frac{x - \\mu}{\\sqrt{\\sigma^2 + \\epsilon}} + \\beta$$\n\n$\\gamma, \\beta \\in \\mathbb{R}^D$ are learned. There are no running statistics, no train/eval difference, and a batch of one works exactly like a batch of a thousand. That is why every Transformer, RNN and most generative models use LayerNorm or a relative. For CNNs, **GroupNorm** sits in between: it normalises over groups of channels plus spatial positions within one image, and is the default in diffu
