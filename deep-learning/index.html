sion U-Nets where batches are small.\n\n| Norm | Statistics over | Batch-dependent | Typical home |\n| BatchNorm | N, H, W per channel | yes | CNN classifiers |\n| LayerNorm | features of one example | no | Transformers, RNNs |\n| RMSNorm | features, no mean | no | LLMs (Llama, Qwen, DeepSeek) |\n| GroupNorm | channel groups and H, W of one image | no | U-Nets, small-batch vision |\n\n%%layers What gets averaged together, for an activation tensor of shape (batch N, sequence T, features D).\nBatchNorm | one statistic per feature, pooled over all N × T positions\n*LayerNorm | one statistic per (n, t) token, pooled over its D features\nRMSNorm | same as LayerNorm but only the root mean square, no centring\n%%\n\n## RMSNorm\nZhang and Sennrich observed that LayerNorm's benefit comes mostly from rescaling, not recentring. RMSNorm keeps only the scale:\n\n$$r = \\sqrt{\\frac{1}{D}\\sum_i x_i^2 + \\epsilon}, \\qquad y = g \\odot \\frac{x}{r}$$\n\nThere is no $\\beta$ and no mean. It saves one reduction per call and some memory traffic, and in practice matches LayerNorm quality, so most open LLMs use it. It is usually computed in fp32 even when activations are bf16, because the sum of squares over $D = 4096$ elements can lose precision or overflow in half precision. AI Research's RMSNorm lesson and Inference Engineering's \"MLP, RMSNorm & Residual Connections\" go deeper on its role inside a decoder block.\n\n## The backward pass\nNormalisation couples all $D$ outputs to all $D$ inputs: changing one $x_j$ moves the mean and the variance, which moves every $y_i$. Let $\\hat x = (x - \\mu)/\\sigma$ with $\\sigma = \\sqrt{\\sigma^2 + \\epsilon}$, and let $\\bar{\\hat x} = \\gamma \\odot \\bar y$ be the upstream gradient after the scale. Then\n\n$$\\bar x = \\frac{1}{\\sigma}\\left(\\bar{\\hat x} - \\mathrm{mean}(\\bar{\\hat x}) - \\hat x \\cdot \\mathrm{mean}(\\bar{\\hat x} \\odot \\hat x)\\right)$$\n\nRead it as a projection: remove the component of the gradient that would only shift the mean (which normalisation undoes anyway) and the component along $\\hat x$ (which would only change the scale), then divide by $\\sigma$. For RMSNorm, with $\\hat x = x / r$, there is no mean term:\n\n$$\\bar x = \\frac{1}{r}\\left(\\bar{\\hat x} - \\hat x \\cdot \\mathrm{mean}(\\bar{\\hat x} \\odot \\hat x)\\right)$$\n\nThe parameter gradients are simple sums over the batch: $\\bar\\gamma = \\sum \\bar y \\odot \\hat x$, $\\bar\\beta = \\sum \\bar y$. A useful consequence: because the input gradient is orthogonal to $\\hat x$, scaling the input up by a constant scales the gradient down by the same constant, which is the scale invariance that keeps normalised networks stable.\n\n```python\nimport numpy as np\n\ndef layernorm_fwd_bwd(x, gamma, beta, dy, eps=1e-5):\n    mu = x.mean(-1, keepdims=True)\n    sigma = np.sqrt(x.var(-1, keepdims=True) + eps)\n    xhat = (x - mu) / sigma\n    y = gamma * xhat + beta\n    dxhat = dy * gamma\n    dx = (dxhat - dxhat.mean(-1, keepdims=True)\n          - xhat * (dxhat * xhat).mean(-1, keepdims=True)) / sigma\n    dgamma = (dy * xhat).reshape(-1, x.shape[-1]).sum(0)\n    dbeta = dy.reshape(-1, x.shape[-1]).sum(0)\n    return y, dx, dgamma, dbeta\n```\n\nCheck any hand-written version against finite differences or autograd before trusting it; sign and broadcasting slips here are common.\n\n## Pre-LN versus Post-LN\nThe original Transformer put LayerNorm **after** the residual add: $x_{l+1} = \\mathrm{LN}(x_l + F(x_l))$. Xiong et al. showed that at initialisation this places large gradients on the last layers, which is why Post-LN models needed long learning-rate warmup. Pre-LN puts it inside the branch, $x_{l+1} = x_l + F(\\mathrm{LN}(x_l))$, leaving a clean identity path from input to output (the same idea as ResNets in 03.04). Pre-LN trains stably with little warmup and is standard in GPT-style models, usually with one final norm before the output head.\n\n! Example: RMSNorm on one token\n! $x = [3, -1, 1, 1]$, $D = 4$. Mean of squares $= (9 + 1 + 1 + 1)/4 = 3$, so $r = \\sqrt{3} \\approx 1.732$ (ignoring $\\epsilon$).\n! $\\hat x = [1.732, -0.577, 0.577, 0.577]$; the root mean square of $\\hat x$ is exactly 1. With $g = 1$ this is the output.\n! LayerNorm on the same $x$: $\\mu = 1$, $\\sigma^2 = (4 + 4 + 0 + 0)/4 = 2$, so $\\hat x = [1.414, -1.414, 0, 0]$. Centring changed which features look large: the two 1s are now zero.\n\n> Takeaway: LayerNorm and RMSNorm normalise each token on its own, so they are batch-independent and identical at train and test time; their backward pass projects out the mean and scale directions, and placing them inside the residual branch (Pre-LN) keeps deep stacks stable.","q":"You switch a Transformer from LayerNorm to BatchNorm over the batch and sequence dimensions to \"normalise more data at once\". Training loss looks fine, but generation quality collapses and padded batches behave differently from unpadded ones. Explain both problems and why LayerNorm or RMSNorm avoids them.","s":"BatchNorm computes each feature's statistics over all tokens in the batch, including padding positions and tokens from other sequences. With padding, the pad embeddings enter the mean and variance, so the same real sequence gets different normalisation depending on how much padding its batch contains: outputs depend on batch composition. At generation time you decode one token at a time, often with batch size one, so the model either uses training-mode statistics of a single token (degenerate) or running averages accumulated over full teacher-forced batches, which do not match the distribution of incrementally generated states. LayerNorm and RMSNorm compute statistics over the $D$ features of each token separately. A token's output depends only on its own hidden state, so padding, batch size and decoding mode cannot change it, and training and inference run the identical computation.","r":[["Ba, Kiros, Hinton: Layer Normalization","https://arxiv.org/abs/1607.06450","Motivation for per-example statistics and the comparison with batch norm in RNNs."],["Zhang & Sennrich: Root Mean Square Layer Normalization","https://arxiv.org/abs/1910.07467","RMSNorm's definition, the re-centring ablation and speed measurements."],["Xiong et al.: On Layer Normalization in the Transformer Architecture","https://arxiv.org/abs/2002.04745","Why Post-LN needs warmup and Pre-LN does not, via gradient norms at init."],["PyTorch docs: LayerNorm","https://pytorch.org/docs/stable/generated/torch.nn.LayerNorm.html","normalized_shape semantics and elementwise affine parameters."]],"k":["layer norm","RMSNorm","Pre-LN"],"x":["NumPy","PyTorch"],"p":["layer-normalization","layer-norm","rmsnorm-forward-pass","norm-gated-linear-transform","layernorm-backward"],"ak":""},{"id":"02.03","t":"Dropout and regularisation","n":["Dropout zeroes each activation with probability $p$ during training; inverted dropout divides survivors by $1-p$ so the expected activation is unchanged and inference needs no rescaling.","Dropout approximately trains an ensemble of thinned subnetworks that share weights, and stops units relying on specific partners (co-adaptation).","With SGD, L2 regularisation and weight decay are the same thing; with Adam they are not, because the penalty gradient gets divided by the adaptive denominator. AdamW decouples them.","Data augmentation is the strongest regulariser for vision: label-preserving transforms (crops, flips, colour jitter) and label-mixing ones (mixup, CutMix) encode invariances the data alone doesn't show."],"a":"## Regularisation in deep networks\nA modern network has enough parameters to memorise its training set, even with random labels. Regularisation is anything that steers it toward solutions that generalise. The ML course covers the classical view (bias-variance, L1/L2 penalties, early stopping); this lesson covers the three tools that matter most for deep nets: dropout, weight decay done right, and data augmentation.\n\n## Dropout\nDuring training, each activation is kept with probability $1-p$ and zeroed otherwise, with a fresh random mask per example and per step. **Inverted dropout** rescales the survivors:\n\n$$\\tilde h = \\frac{m \\odot h}{1 - p}, \\qquad m_i \\sim \\mathrm{Bernoulli}(1-p)$$\n\nso $\\mathbb{E}[\\tilde h] = h$ and at inference the layer is the identity. (The original paper scaled weights by $1-p$ at test time instead; inverted dropout puts the cost in training so serving code doesn't change.) The backward pass uses the same mask: gradients flow only through kept units, multiplied by $1/(1-p)$.\n\n```python\nimport numpy as np\n\ndef dropout(h, p, training, rng):\n    if not training or p == 0:\n        return h, None\n    mask = (rng.random(h.shape) >= p) / (1 - p)   # keep with prob 1-p, pre-scaled\n    return h * mask, mask                         # backward: dh = dout * mask\n```\n\nWhy it works, in two views:\n- **Ensemble.** Each mask selects one of $2^n$ thinned networks that share weights; training samples them, and the scaled full network at test time approximates averaging their predictions.\n- **No co-adaptation.** A unit cannot rely on any specific other unit being present, so features must be useful in many contexts.\n\nPractical defaults: $p = 0.5$ on large fully connected layers (AlexNet, VGG), $0.1$ in Transformers (attention weights and residual branches), often none in CNNs with BatchNorm. For feature maps, **channel dropout** (Dropout2d) drops entire channels, since neighbouring pixels are so correlated that dropping single ones barely regularises. Dropout lengthens training (noisier gradients) and interacts badly with BatchNorm if placed before it, because BN's running variance is estimated under dropout noise that disappears at eval.\n\n## Weight decay and L2 are not the same in Adam\nL2 regularisation adds $\\frac{\\lambda}{2}\\|w\\|^2$ to the loss, adding $\\lambda w$ to the gradient. Weight decay shrinks the weights directly each step: $w \\leftarrow w - \\eta\\lambda w - \\eta g$. For plain SGD these are identical. For Adam they are not:\n\n$$\\text{Adam + L2:}\\quad w \\leftarrow w - \\eta \\frac{\\hat m(g + \\lambda w)}{\\sqrt{\\hat v} + \\epsilon}$$\n$$\\text{AdamW:}\\quad w \\leftarrow w - \\eta\\left(\\frac{\\hat m(g)}{\\sqrt{\\hat v} + \\epsilon} + \\lambda w\\right)$$\n\nWith L2 inside Adam, the decay term is divided by $\\sqrt{\\hat v}$, so weights with large historical gradients are barely regularised and weights with tiny gradients are regularised heavily, the opposite of what you want. Loshchilov and Hutter's AdamW applies the decay outside the adaptive scaling, so every weight shrinks at the same relative rate; it generalises better and makes the best $\\lambda$ largely independent of the learning rate. Typical: AdamW with $\\lambda = 0.01$ to $0.1$, and no decay on biases and normalisation parameters. ML Maths covers Adam itself.\n\n%%flow Where each regulariser acts in one training step.\nRaw batch -(augment: crop, flip, mixup)-> Model forward -(dropout masks)-> Loss -(backward)-> Gradients -(AdamW: decay applied outside Adam)-> *Updated weights\n%%\n\n## Data augmentation\nAugmentation creates new training examples by applying transforms that should not change the label. It is how you tell a vision model about invariances: a cat flipped left-right is still a cat.\n- **Geometric**: random resized crops (the single most effective ImageNet augmentation), horizontal flips, small rotations and translations.\n- **Photometric**: colour jitter, brightness, contrast, blur.\n- **Erasing**: Cutout and random erasing blank a patch so the model can't rely on one region.\n- **Label mixing**: mixup blends two images and their labels, $\\tilde x = \\lambda x_i + (1-\\lambda)x_j$ with the same $\\lambda$ on the one-hot labels; CutMix pastes a patch from one image into another and mixes labels by area.\n\nAugmentations must respect the task. Horizontal flips are fine for ImageNet and wrong for digit or text recognition; random crops can cut the object out entirely when it is small, and for detection the boxes must be transformed with the image. Augmentation is applied only to training data.\n\n| Tool | Acts on | Train/eval difference | Typical setting |\n| Dropout | activations | masks only in training | 0.1 to 0.5 |\n| Weight decay | weights | none | AdamW, 0.01 to 0.1 |\n| Augmentation | inputs | training data only | crops + flips baseline |\n| Early stopping | training length | none | stop at best validation |\n\n! Example: what inverted dropout preserves\n! A hidden vector $h = [2, 4, 6, 8]$ with $p = 0.5$. One sampled mask keeps units 1 and 4: $\\tilde h = [4, 0, 0, 16]$, sum 20, the same as the original sum of 20.\n! Another mask keeps only unit 3: $\\tilde h = [0, 0, 12, 0]$, sum 12. Individual draws vary, but averaged over masks each unit's expected value is exactly its original value, so the next layer sees the same mean at train and test time.\n\n> Takeaway: use inverted dropout where the model is over-parameterised and not already normalised, use AdamW rather than L2-in-Adam for weight decay, and treat augmentation as the main way to inject what you know about invariance.","q":"You fine-tune a model with Adam plus an L2 penalty and find that the embedding rows for rare tokens shrink much faster than the rows for frequent ones, hurting rare-token performance. Explain the mechanism, and how AdamW changes it.","s":"With L2 inside Adam, the penalty gradient $\\lambda w$ is added to the data gradient and the sum is divided by $\\sqrt{\\hat v}$, the running RMS of that weight's gradients. Frequent tokens' embedding rows receive large, frequent data gradients, so $\\hat v$ is large and the decay term is heavily damped. Rare tokens' rows receive data gradients only occasionally, so $\\hat v$ is small and the same $\\lambda w$ becomes a large normalised step that pulls the row toward zero every step, even when the token isn't in the batch. The effective regularisation strength is therefore inversely tied to gradient history. AdamW applies $w \\leftarrow w - \\eta\\lambda w$ outside the adaptive scaling, so every row decays by the same fraction per step regardless of its gradient statistics, and Adam's normalisation is applied only to the data gradient. Many setups also exclude embeddings from decay entirely.","r":[["Srivastava et al.: Dropout (JMLR 2014)","https://jmlr.org/papers/v15/srivastava14a.html","The ensemble interpretation, test-time scaling, and the co-adaptation experiments."],["Loshchilov & Hutter: Decoupled Weight Decay Regularization","https://arxiv.org/abs/1711.05101","Why L2 and weight decay differ for adaptive optimisers; the AdamW update."],["Zhang et al.: mixup","https://arxiv.org/abs/1710.09412","The mixup recipe and its effect on generalisation and calibration."],["Dive into Deep Learning: Dropout","https://d2l.ai/chapter_multilayer-perceptrons/dropout.html","Inverted dropout from scratch and where to apply it."]],"k":["dropout","weight decay","augmentation"],"x":["NumPy","PyTorch"],"p":["dropout","dropout-2","adamw-decoupled-weight-decay","mixup-augmentation","cutmix-augmentation"],"ak":""},{"id":"02.04","t":"Mini-batch training in practice","n":["A mini-batch gradient is an unbiased estimate of the full gradient whose variance shrinks like $1/B$; past a critical batch size, larger batches stop reducing the number of steps needed.","The linear scaling rule says: multiply the batch size by $k$, multiply the learning rate by $k$; it holds up to a limit and needs warmup to survive the first steps.","Warmup ramps the learning rate up over the first few hundred to few thousand steps, because early gradients are large, Adam's second-moment estimates are unreliable, and normalised networks are fragile at init.","Schedules (step, cosine, warmup-stable-decay) lower the learning rate later to reduce gradient noise and settle into a minimum; global-norm gradient clipping caps the size of any single step."],"a":"## Why mini-batches\nFull-batch gradient descent computes the exact gradient over all $N$ examples per step; stochastic gradient descent uses one. Mini-batches of $B$ examples sit between: the gradient estimate is unbiased, its variance falls like $1/B$, and a batch fills the GPU's parallel units. Batch size sets three things at once: **hardware efficiency** (too small leaves the GPU idle), **gradient noise** (which also acts as regularisation), and **memory** (activations scale linearly with $B$). The optimiser algorithms are covered in ML Maths; this lesson is about the knobs around them.\n\n## Batch size and learning rate\nIf you double $B$, the gradient noise halves, so you can take larger steps. Goyal et al.'s **linear scaling rule**: when the batch is multiplied by $k$, multiply the learning rate by $k$. They trained ResNet-50 on ImageNet with batch 8192 (learning rate $0.1 \\times 8192/256 = 3.2$) in one hour, matching batch-256 accuracy, but only with 5 epochs of warmup. The rule breaks down beyond a **critical batch size**, where noise is no longer the bottleneck and doubling $B$ no longer halves the number of steps; past it you pay twice the compute for the same progress. The critical size grows during training as the loss falls and can be estimated from the gradient noise scale (AI Research covers this for LLMs). For Adam, square-root scaling of the learning rate is often a better heuristic than linear.\n\nLarge batches have a reputation for generalising worse (\"sharp minima\", Keskar et al.); much of the gap disappears with retuned learning rate, warmup and longer schedules, but small-batch noise is a genuine regulariser for small datasets.\n\n## Warmup\nStarting at the full learning rate often diverges in the first hundred steps, especially with large batches, Adam, or Post-LN Transformers. Reasons:\n- At initialisation the loss is high and gradients can be large and poorly aligned.\n- Adam's $\\hat v$ is estimated from very few samples, so early normalised steps can be huge.\n- Normalisation layers and attention logits are most fragile before the network has settled.\n\nLinear warmup from near zero to the peak learning rate over a few hundred to a few thousand steps (often 1-5% of training) fixes this cheaply.\n\n## Schedules\nAfter warmup the learning rate should usually decrease. Large steps make fast progress but bounce around the minimum at a level set by gradient noise; small steps reduce that noise floor.\n- **Step decay**: divide by 10 at fixed epochs (classic ResNet: epochs 30, 60, 90). Loss drops sharply at each step.\n- **Cosine**: $\\eta_t = \\eta_{min} + \\tfrac{1}{2}(\\eta_{max} - \\eta_{min})(1 + \\cos(\\pi t / T))$. Smooth, one fewer hyperparameter; standard for vision and LLMs.\n- **Warmup-stable-decay (WSD)**: hold the peak, then decay quickly in the last 10-20%. You can branch off and decay at any point, which is convenient when you don't know the final step count.\n- **One-cycle**: ramp up then down within one run, found with a learning-rate range test.\n\n%%flow A typical modern schedule over one training run.\nStep 0: lr ≈ 0 -(linear warmup, about 2% of steps)-> *Peak lr -(cosine or stable phase)-> Late training -(decay)-> lr ≈ 0.1 × peak or less\n%%\n\n## Gradient clipping\nA single bad batch, or an exploding direction in an RNN or Transformer, can produce a gradient orders of magnitude larger than usual, and one such step can wreck a model. **Global-norm clipping** rescales the whole gradient when its norm exceeds a threshold $c$:\n\n$$g \\leftarrow g \\cdot \\min\\left(1, \\frac{c}{\\|g\\|_2}\\right), \\qquad \\|g\\|_2 = \\sqrt{\\textstyle\\sum_{\\text{all params}} \\|g_p\\|^2}$$\n\nIt preserves the direction and only limits the magnitude. Typical $c = 1.0$ for Transformers. Clipping per-element (value clipping) changes the direction and is rarely the right choice. Log the pre-clip norm: if clipping fires on most steps, the threshold is too low or the learning rate too high.\n\n## Gradient accumulation\nIf the batch you want doesn't fit in memory, run $k$ micro-batches, accumulate their gradients (autograd sums into `.grad`), and step once. Scale each micro-batch loss by $1/k$ so the result equals the large-batch mean, and when micro-batches have different numbers of valid tokens, weight by token count rather than averaging averages. BatchNorm still only sees micro-batch statistics, so accumulation is not exactly equivalent for BN networks.\n\n```python\nimport math, torch\n\ndef lr_at(step, peak, warmup, total, floor=0.0):\n    if step < warmup:\n        return peak * (step + 1) / warmup\n    t = (step - warmup) / max(1, total - warmup)\n    return floor + 0.5 * (peak - floor) * (1 + math.cos(math.pi * t))\n\nfor step, (x, y) in enumerate(loader):\n    for g in opt.param_groups: g[\"lr\"] = lr_at(step, 3e-4, 500, total_steps)\n    loss = loss_fn(model(x), y)\n    opt.zero_grad(set_to_none=True)\n    loss.backward()\n    gnorm = torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)   # returns pre-clip norm\n    opt.step()\n```\n\n! Example: scaling a recipe from 1 GPU to 8\n! A recipe trains with batch 256 and SGD learning rate 0.1. On 8 GPUs at 256 each, the global batch is 2048, so linear scaling gives learning rate 0.8.\n! Use 5 epochs of linear warmup from 0.1 to 0.8, then the original decay schedule with epochs unchanged. Each epoch now has 8× fewer steps, so the step-based warmup length must be recomputed from epochs, not copied.\n! If the learning rate needed to keep the loss stable stops growing with batch size, you have passed the critical batch size: more GPUs will finish epochs faster but need more epochs to reach the same loss.\n\n> Takeaway: choose batch size for hardware efficiency, scale the learning rate with it (linear for SGD, closer to square-root for Adam), always warm up, decay the learning rate later in training, and clip the global gradient norm as cheap insurance.","q":"You move a Transformer from batch 64 to batch 512 by multiplying the learning rate by 8 and keeping everything else, including a 100-step warmup. Loss spikes to NaN around step 50. Give two distinct reasons this happened and the changes you would make.","s":"First, the warmup was defined in steps for the old setup and is now too short in proportion to the much larger peak learning rate: the learning rate climbs eight times faster in absolute terms while Adam's second-moment estimates are still based on few steps and gradients at init are large, so early updates overshoot. Second, linear scaling is only approximately right, and for Adam it usually overestimates: the adaptive denominator already normalises gradient size, so the effective step grows nearly linearly with the learning rate regardless of noise, and 8× is likely beyond the stable range (closer to $\\sqrt 8 \\approx 2.8\\times$ is a safer start). Fixes: lengthen warmup (e.g. 1-2k steps or a fixed fraction of training), use square-root scaling and sweep upward, add global-norm clipping at 1.0 so a single bad step can't diverge, and monitor gradient norm to see where instability starts.","r":[["Goyal et al.: Accurate, Large Minibatch SGD","https://arxiv.org/abs/1706.02677","The linear scaling rule, gradual warmup, and the batch-8192 ResNet-50 results."],["Loshchilov & Hutter: SGDR","https://arxiv.org/abs/1608.03983","Cosine annealing and warm restarts."],["Pascanu, Mikolov, Bengio: On the difficulty of training recurrent neural networks","https://arxiv.org/abs/1211.5063","Why gradients explode and the norm-clipping remedy."],["PyTorch docs: clip_grad_norm_","https://pytorch.org/docs/stable/generated/torch.nn.utils.clip_grad_norm_.html","Global-norm clipping as implemented, including the returned total norm."]],"k":["batch size","learning-rate schedule","gradient clipping"],"x":["PyTorch"],"p":["mini-batch-training-loop","learning-rate-warmup-scheduler","gradient-clipping-global-norm-rescaling","gradient-accumulation","generate-warmup-stable-decay-schedule"],"ak":""},{"id":"02.05","t":"Diagnosing training","n":["Check the loss at step 0 before anything else: a $C$-class classifier with sensible init should start near $\\ln C$ (2.30 for 10 classes); anything far off means a bug in data, labels, init or the loss.","Overfitting a single small batch to near-zero loss is the fastest end-to-end test; if the model cannot memorise 16 examples, the bug is in the pipeline, not the hyperparameters.","Read loss curves by shape: a flat line, early divergence, oscillation, a train/validation gap and a plateau each point to a different cause.","Log per-layer gradient norms, update-to-weight ratios (around $10^{-3}$ is healthy for SGD) and the fraction of dead ReLUs; vanishing and exploding gradients show up there long before they show up in accuracy."],"a":"## Training fails silently\nA buggy network usually still trains: the loss goes down a bit, accuracy is mediocre, and nothing crashes. Karpathy's summary is that neural nets \"fail silently\". The defence is a fixed routine of checks that rule out whole classes of bugs before you spend compute on tuning. This lesson collects them and ties each back to the earlier lessons in this module.\n\n## Checks before training\n1. **Look at the data after the pipeline.** Decode a batch exactly as the model receives it: images after augmentation and normalisation, tokens after padding. Mislabelled or wrongly normalised inputs are the most common bug.\n2. **Check the initial loss.** With small output logits, a $C$-class classifier predicts roughly uniform probabilities, so the loss should be about $\\ln C$: 2.303 for 10 classes, 6.908 for 1000. A starting loss of 40 means exploding init or missing softmax scaling; a loss of 0 means label leakage.\n3. **Overfit one batch.** Take 8-32 examples, turn off augmentation and regularisation, and train until loss is near zero. Failure means a wiring bug: wrong axis in the loss, detached tensors, frozen parameters, labels shuffled independently of inputs.\n4. **Gradient check custom code.** Any hand-written backward (01.04, 02.02) should match central finite differences to a relative error of about $10^{-6}$ in float64.\n5. **Set a baseline.** A linear model or a known recipe tells you what \"working\" looks like.\n\n## Reading loss curves\n| Curve shape | Likely cause | First thing to try |\n| Flat from step 0 | lr far too low, dead network, frozen params, data bug | check gradients are non-zero; lr range test |\n| Decreases, then NaN or spike | lr too high, no warmup, fp16 overflow, log(0) | lower lr, add warmup and clipping |\n| Noisy, oscillating, not improving | lr too high for batch size | lower lr or increase batch |\n| Train falls, validation rises | overfitting | augmentation, dropout, weight decay, early stop |\n| Both plateau high | underfitting or too-small lr late in training | bigger model, longer schedule, check capacity |\n| Sudden drops at fixed epochs | step lr schedule | expected, not a bug |\n\nPlot the loss on a log scale and smooth it; raw per-step loss is noisy enough to hide trends. Always plot validation alongside training, and measure validation in eval mode (02.01).\n\n%%flow A debugging order that rules out cheap bugs before expensive tuning.\nInspect batch -(inputs ok)-> Initial loss ≈ ln C -(yes)-> Overfit 16 examples -(reaches ≈ 0)-> Full run + monitors -(gap or plateau)-> *Tune regularisation, lr, capacity\n%%\n\n## Monitoring inside the network\nLoss curves tell you something is wrong; internal statistics tell you where.\n- **Per-layer gradient norms.** In a healthy network they are within an order of magnitude or two of each other. Early-layer norms 1000× smaller than late-layer norms is vanishing gradients (saturating activations, 01.02; bad init, 01.05; missing residuals, 03.04). Norms that grow over training toward the input are exploding gradients; clipping (02.04) is the bandage, normalisation and init are the fix.\n- **Update-to-weight ratio.** $\\|\\eta\\,\\Delta w\\| / \\|w\\|$ per layer. Around $10^{-3}$ is a useful rule of thumb for SGD (CS231n); $10^{-1}$ means the layer is being rewritten each step, $10^{-6}$ means it is effectively frozen.\n- **Activation statistics.** Mean and standard deviation per layer at init and during training. Collapsing standard deviations mean signal is dying; tanh/sigmoid outputs piled at the extremes mean saturation.\n- **Dead units.** Fraction of ReLU units that are zero for every example in a large batch. A few percent is normal; 40% after a learning-rate spike means you lost capacity permanently.\n\n```python\nimport torch\n\ndef grad_report(model, x, y, loss_fn, lr, relu_layers):\n    acts = {}\n    hooks = [m.register_forward_hook(lambda m, i, o, n=n: acts.__setitem__(n, o.detach()))\n             for n, m in relu_layers.items()]\n    model.zero_grad(); loss_fn(model(x), y).backward()\n    for h in hooks: h.remove()\n    for name, p in model.named_parameters():\n        if p.grad is not None:\n            print(f\"{name:30s} grad {p.grad.norm():.2e}  update/weight {lr * p.grad.norm() / p.norm():.1e}\")\n    for n, a in acts.items():                       # unit dead if zero on every example\n        dead = (a.flatten(1) <= 0).all(0).float().mean()\n        print(f\"{n}: {dead:.1%} dead units\")\n```\n\n## NaNs and infinities\nA NaN anywhere poisons everything downstream within one step. Usual sources: learning rate too high, `log` or division of zero (use the logits-based losses from 01.03, add $\\epsilon$ to normalisation variances), fp16 overflow above 65504 (use bf16 or loss scaling), and bad data such as an empty mask making a mean divide by zero. `torch.autograd.set_detect_anomaly(True)` finds the first operation that produced a NaN, at a large speed cost, so use it only to localise the bug.\n\n! Example: reading the symptoms\n! A 10-class CNN starts at loss 2.31 (good), drops to 1.2 by step 2000, then stops. Per-layer gradient norms: last layer $3 \\times 10^{-2}$, first conv layer $4 \\times 10^{-7}$. Activation standard deviation falls from 1.0 at the input to 0.003 by layer 15.\n! Diagnosis: vanishing signal through depth, not a learning-rate problem. Raising the learning rate would make the last layers unstable while the first layers stay frozen.\n! Fixes in order of effort: He init for the ReLU layers, BatchNorm after each conv, then residual connections. After adding BN the first-layer gradient norm rises to about $10^{-3}$ and the loss keeps improving.\n\n> Takeaway: verify the initial loss and that the model can overfit one batch before tuning anything, read loss curves by shape, and monitor per-layer gradient norms, update ratios and dead units to locate vanishing or exploding signal.","q":"Your new model starts at loss 0.01 on a 100-class classification problem and quickly goes to 0.0001, but validation accuracy is 1%. Walk through what the initial loss tells you, the most likely class of bug, and two concrete checks you would run.","s":"With small initial logits a 100-class model should start near $\\ln 100 \\approx 4.6$. A starting loss of 0.01 means the model is almost certain of the correct label before learning anything, so the label is effectively available in the input or the loss is computed wrongly. Likely bugs: label leakage (a feature derived from the target, e.g. the class index encoded in the filename or a one-hot target concatenated into the input), comparing predictions against themselves, or a loss with the wrong reduction or axis (e.g. cross-entropy over the batch dimension so each \"class\" is an example). Validation at 1% (chance) confirms the model learned nothing transferable. Checks: decode one batch exactly as fed to the model and confirm the targets are not present in the inputs; compute the loss by hand for one example from the logits and label and compare with the framework value; shuffle the labels and confirm the initial loss becomes about 4.6 and cannot fall quickly.","r":[["Karpathy: A Recipe for Training Neural Networks","https://karpathy.github.io/2019/04/25/recipe/","The step-by-step routine: inspect data, verify init loss, overfit a batch, then regularise and tune."],["CS231n: Neural Networks Part 3","https://cs231n.github.io/neural-networks-3/","Gradient checks, loss-curve shapes, update/weight ratios and activation histograms."],["Google Research: Deep Learning Tuning Playbook","https://github.com/google-research/tuning_playbook","A systematic process for choosing what to tune and reading training curves."]],"k":["debugging","vanishing gradients","loss curves"],"x":["PyTorch"],"p":["learning-rate-sweep","finite-difference-gradient-checking","early-stopping","lr-range-test-and-one-cycle-policy","gradient-clipping"],"ak":""}]},{"n":"03","name":"Convolutional networks","lessons":[{"id":"03.01","t":"Convolution","n":["A convolutional layer slides a small kernel of shape $C_{in} \\times k \\times k$ over the input and takes a dot product at every position; $C_{out}$ such kernels give $C_{out}$ output channels.","Weight sharing and locality cut parameters from millions to thousands and make the layer translation-equivariant: shift the input, and the feature map shifts with it.","Output size is $\\lfloor (H + 2p - d(k-1) - 1)/s \\rfloor + 1$; padding controls border behaviour, stride downsamples, dilation spreads the kernel.","The receptive field grows with depth: each layer adds $(k-1)$ times the product of all earlier strides, so stacks of small kernels see large regions.","Parameters are $C_{out} C_{in} k^2$ but compute is that times the number of output positions, so early high-resolution layers dominate FLOPs while late layers dominate parameters."],"a":"## From dense layers to convolutions\nModule 01's MLP showed the cost of dense layers on images: a 224×224×3 input flattened to 150,528 numbers, connected to just 1000 hidden units, needs 150 million weights, and the network has to learn separately that a cat in the top-left and a cat in the bottom-right are both cats. Convolutional networks build in two assumptions about images:\n- **Locality**: useful features (edges, textures) depend on nearby pixels, so each output looks at a small window.\n- **Stationarity**: a feature detector useful in one place is useful everywhere, so the same weights are reused at every position.\n\nThis module applies the training machinery of Modules 01-02 to convolutional networks; Module 04 then uses them for detection and segmentation.\n\n## The operation\nFor an input of shape $(C_{in}, H, W)$ and a weight tensor $(C_{out}, C_{in}, k, k)$:\n\n$$y_{o,i,j} = b_o + \\sum_{c=1}^{C_{in}} \\sum_{u=0}^{k-1} \\sum_{v=0}^{k-1} w_{o,c,u,v}\\; x_{c,\\; s i + d u - p,\\; s j + d v - p}$$\n\nEvery output channel looks at **all** input channels. (Deep learning libraries compute cross-correlation, without flipping the kernel; since kernels are learned the distinction doesn't matter.) The output size per spatial dimension, with padding $p$, stride $s$, dilation $d$:\n\n$$H_{out} = \\left\\lfloor \\frac{H + 2p - d(k-1) - 1}{s} \\right\\rfloor + 1$$\n\n- **Padding** $p = (k-1)/2$ with $s = 1$ keeps the size (\"same\" padding) and lets border pixels influence as many outputs as central ones.\n- **Stride** $s = 2$ halves the resolution, a learned alternative to pooling (03.02).\n- **Dilation** $d$ inserts gaps in the kernel, enlarging its footprint without adding weights; used in segmentation to keep resolution.\n\n%%flow One conv layer as tensor shapes: the kernel's channel depth always equals the input's channel count.\nInput 3×224×224 -(64 kernels of 3×7×7, s=2, p=3)-> *Output 64×112×112 -(BN, ReLU)-> Next layer\n%%\n\n## Translation equivariance and its limits\nBecause weights are shared, shifting the input by one pixel shifts the output by one pixel: convolution is **translation-equivariant**. Classification wants **invariance** (same label regardless of position), which comes later from pooling and global averaging. Equivariance is exact only for stride 1; stride and pooling make outputs sensitive to sub-stride shifts, which is why CNN predictions can flicker when an image moves by a pixel.\n\n## Receptive field\nThe receptive field of a unit is the input region that can affect it. With $r_0 = 1$ and jump $j_0 = 1$:\n\n$$r_l = r_{l-1} + (k_l - 1)\\, j_{l-1}, \\qquad j_l = j_{l-1}\\, s_l$$\n\nThree stacked 3×3 stride-1 convs see $1 + 2 + 2 + 2 = 7$ pixels: the same as one 7×7 kernel (the VGG argument in 03.03). Strides multiply the growth of everything after them, which is how a 50-layer ResNet reaches a theoretical receptive field larger than the image. The **effective** receptive field is much smaller: influence is roughly Gaussian-weighted toward the centre, so the outer region of the theoretical field contributes little.\n\n## Cost: parameters versus compute\nParameters: $C_{out} C_{in} k^2$ (+ $C_{out}$ biases), independent of image size. Multiply-adds: that number times $H_{out} W_{out}$. Early layers have few channels but huge resolution, late layers many channels but tiny resolution, so early layers dominate compute and late layers dominate parameters.\n\nImplementations turn convolution into matrix multiplication. **im2col** unrolls every $C_{in} k^2$ input patch into a column, giving a $(C_{in} k^2) \\times (H_{out} W_{out})$ matrix; the weights reshape to $C_{out} \\times (C_{in} k^2)$; one GEMM gives the output. cuDNN also uses implicit-GEMM, FFT and Winograd algorithms, picking per layer shape.\n\n```python\nimport numpy as np\n\ndef conv2d(x, w, b, stride=1, pad=0):\n    # x: (C_in, H, W), w: (C_out, C_in, k, k) -> (C_out, H_out, W_out), via im2col\n    C, H, W = x.shape; O, _, k, _ = w.shape\n    x = np.pad(x, ((0, 0), (pad, pad), (pad, pad)))\n    Ho, Wo = (H + 2 * pad - k) // stride + 1, (W + 2 * pad - k) // stride + 1\n    cols = np.stack([x[:, i * stride:i * stride + k, j * stride:j * stride + k].ravel()\n                     for i in range(Ho) for j in range(Wo)], axis=1)   # (C*k*k, Ho*Wo)\n    return (w.reshape(O, -1) @ cols + b[:, None]).reshape(O, Ho, Wo)\n```\n\n! Example: sizing a ResNet stem\n! Input 3×224×224, 64 kernels of 7×7, stride 2, padding 3. $H_{out} = \\lfloor (224 + 6 - 6 - 1)/2 \\rfloor + 1 = 112$, so the output is 64×112×112.\n! Parameters: $64 \\cdot 3 \\cdot 49 = 9{,}408$ weights. Compute: $9{,}408 \\times 112 \\times 112 \\approx 118$ million multiply-adds per image.\n! Compare a late ResNet layer, 512→512 channels with 3×3 kernels at 7×7: 2.36 million weights (250× more) but $2.36\\text{M} \\times 49 \\approx 116$ million MACs, about the same compute.\n\n| Hyperparameter | Effect on output size | Effect on parameters |\n| Kernel size $k$ | shrinks by $k-1$ without padding | grows as $k^2$ |\n| Padding $p$ | grows by $2p$ | none |\n| Stride $s$ | divides by about $s$ | none |\n| Dilation $d$ | shrinks by $d(k-1)$ without padding | none |\n| Channels $C_{out}$ | sets output depth | grows linearly |\n\n> Takeaway: a conv layer is a small dense layer applied at every position with shared weights; know the output-size formula, how receptive fields compound, and that compute scales with resolution while parameters scale with channels.","q":"A network has two layers: a 3×3 conv with stride 2, then a 3×3 conv with stride 1. A colleague claims swapping their order (stride-1 first, then stride-2) leaves both the receptive field and the compute unchanged. Check both claims for a 64-channel to 64-channel network on a 128×128 input with same padding.","s":"Receptive field: with stride 2 first, $r_1 = 3$, $j_1 = 2$, then $r_2 = 3 + 2 \\cdot 2 = 7$. With stride 1 first, $r_1 = 3$, $j_1 = 1$, then $r_2 = 3 + 2 \\cdot 1 = 5$. So the claim is false: putting the stride first makes the later layer's kernel cover a wider input region. Compute: each layer has $64 \\cdot 64 \\cdot 9 = 36{,}864$ weights. Stride 2 first: layer 1 outputs 64×64 (4,096 positions), layer 2 also at 64×64, total $2 \\times 36{,}864 \\times 4{,}096 \\approx 302$M MACs. Stride 1 first: layer 1 at 128×128 (16,384 positions), layer 2 at 64×64, total $36{,}864 \\times (16{,}384 + 4{,}096) \\approx 755$M MACs. Parameters are identical, but downsampling early gives a larger receptive field for about 40% of the compute, at the cost of losing high-resolution detail sooner. This is the trade-off every CNN stem makes.","r":[["CS231n: Convolutional Neural Networks","https://cs231n.github.io/convolutional-networks/","The conv layer, output-size arithmetic, parameter sharing and im2col."],["Dumoulin & Visin: A guide to convolution arithmetic for deep learning","https://arxiv.org/abs/1603.07285","Every padding/stride/dilation case drawn out, with exact size relations."],["Luo et al.: Understanding the Effective Receptive Field","https://arxiv.org/abs/1701.04128","Why the effective receptive field is Gaussian-shaped and much smaller than the theoretical one."],["Dive into Deep Learning: Padding and Stride","https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html","Shape calculations with runnable code."]],"k":["convolution","receptive field","im2col"],"x":["NumPy","PyTorch"],"p":["2d-convolution","multichannel-2d-convolution","conv2d","dilated-2d-convolution"],"ak":""},{"id":"03.02","t":"Pooling and downsampling","n":["Max pooling takes the largest value in each window (2×2, stride 2 is standard), giving small-shift invariance and halving resolution with no parameters; its gradient goes only to the arg-max position.","Global average pooling collapses each channel to one number, replacing huge flatten-then-dense heads and letting the network accept any input size.","Strided convolution is learned downsampling; most modern CNNs use it, or pooling, at a few stage boundaries while doubling channels.","Transposed convolution upsamples by scattering each input value through the kernel; its output size is $(H-1)s - 2p + k$, and kernels not divisible by the stride cause checkerboard artifacts."],"a":"## Why downsample\nA classifier must turn a 224×224 image into one label. Reducing resolution step by step does three things: it cuts compute in later layers (cost scales with $H \\times W$), it grows the receptive field quickly (strides multiply it, 03.01), and it builds invariance to small shifts. The standard pattern is a few **stages**: at each boundary, halve the resolution and double the channels, so compute per layer stays roughly constant while features become more abstract.\n\n## Max and average pooling\nPooling applies a fixed reduction to each window per channel, with no parameters and no channel mixing:\n- **Max pooling** keeps the strongest response, which reads as \"is this feature present anywhere in the window\". 2×2 with stride 2 is the default; AlexNet used overlapping 3×3 windows with stride 2.\n- **Average pooling** keeps the mean, smoother and preserving more information, but diluting a strong local response.\n\nThe backward passes differ in a useful way. Average pooling spreads the upstream gradient equally over the window ($1/k^2$ each). Max pooling routes all of it to the position that held the maximum and gives zero to the rest, so implementations store the arg-max indices from the forward pass.\n\n```python\nimport numpy as np\n\ndef maxpool2x2(x):                      # x: (C, H, W), H and W even\n    C, H, W = x.shape\n    win = x.reshape(C, H // 2, 2, W // 2, 2).transpose(0, 1, 3, 2, 4).reshape(C, H // 2, W // 2, 4)\n    idx = win.argmax(-1)                # remember winners for backward\n    return win.max(-1), idx\n\ndef maxpool2x2_backward(dout, idx, shape):\n    C, H, W = shape\n    g = np.zeros((C, H // 2, W // 2, 4))\n    np.put_along_axis(g, idx[..., None], dout[..., None], axis=-1)\n    return g.reshape(C, H // 2, W // 2, 2, 2).transpose(0, 1, 3, 2, 4).reshape(C, H, W)\n```\n\n## Global average pooling\nAt the end of the network, **global average pooling** (GAP) reduces each $C \\times h \\times w$ feature map to a length-$C$ vector by averaging each channel over all positions. Compare heads:\n- VGG-16 flattens 512×7×7 = 25,088 values into a 4096-unit dense layer: about 103 million weights, three quarters of the whole model.\n- ResNet-50 applies GAP to 2048×7×7, giving 2048 values, then one 2048→1000 dense layer: about 2 million weights.\n\nGAP also makes the network size-agnostic (any input resolution gives a $C$-vector) and acts as a structural regulariser. **Adaptive** pooling generalises it: pick the output size (say 7×7) and the window adapts to the input.\n\n## Strided convolution instead of pooling\nSpringenberg et al. showed you can replace every pooling layer with a stride-2 convolution and lose nothing: the network learns how to downsample. ResNets downsample with stride-2 convs inside blocks; many modern designs use a stride-2 conv or a \"patchify\" stem. One caveat applies to both: subsampling without low-pass filtering aliases, so outputs can change noticeably under one-pixel shifts. Blurring before subsampling (anti-aliased pooling) restores much of the shift stability.\n\n%%flow A classic stage layout: resolution halves at each boundary while channels double, keeping compute per stage roughly flat.\n224×224×3 -(stem, s=2 + pool)-> 56×56×64 -(stage, s=2)-> 28×28×128 -(s=2)-> 14×14×256 -(s=2)-> 7×7×512 -(global avg pool)-> *512 -(dense)-> 1000 logits\n%%\n\n## Upsampling: transposed convolution\nSegmentation, generators and decoders need to go the other way. **Transposed convolution** (sometimes misnamed deconvolution) is the gradient of a convolution with respect to its input, used as a forward operation. Each input value multiplies the whole kernel and is added into the output at stride-spaced positions; overlapping contributions sum. Output size:\n\n$$H_{out} = (H - 1)s - 2p + d(k - 1) + p_{out} + 1$$\n\nwhich with $d = 1$ and no output padding is $(H-1)s - 2p + k$. The extra `output_padding` resolves the ambiguity that several input sizes map to the same strided-conv output size.\n\n**Checkerboard artifacts**: when $k$ is not divisible by $s$ (say $k = 3, s = 2$), some output pixels receive contributions from more input positions than their neighbours, imprinting a grid pattern. Fixes: use $k$ divisible by $s$ (4 with stride 2), or upsample with nearest-neighbour or bilinear interpolation and then apply a normal convolution, which U-Nets and many generators do. **Pixel shuffle** (sub-pixel convolution) is a third option: a conv produces $C \\cdot r^2$ channels and a reshape rearranges them into an $r$-times larger image.\n\n! Example: one DCGAN-style upsampling layer\n! Input 512×4×4, transposed conv to 256 channels with $k = 4$, $s = 2$, $p = 1$: $H_{out} = (4-1) \\cdot 2 - 2 + 4 = 8$, so 256×8×8. Four such layers take 4×4 to 64×64.\n! Because $4$ is divisible by $2$, every output pixel receives exactly $(k/s)^2 = 4$ kernel contributions, so overlap is even and no grid pattern is built in.\n! With $k = 3$, $s = 2$, $p = 1$, $p_{out} = 1$ the output is also 8×8, but output pixels alternate between 1, 2 and 4 contributions: the checkerboard.\n\n> Takeaway: downsample a few times with pooling or strided convs while doubling channels, finish with global average pooling instead of a giant dense head, and upsample with transposed convs whose kernel is divisible by the stride, or with resize-then-convolve.","q":"A segmentation decoder uses `ConvTranspose2d(k=3, stride=2, padding=1, output_padding=1)` and its outputs show a faint grid pattern even after long training. Explain the cause in terms of how many input contributions each output pixel receives, and give two alternative designs that keep the same output size.","s":"A transposed conv scatters each input value through the 3×3 kernel at stride 2. Along one dimension, output positions alternate between being covered by one kernel tap and two overlapping taps, since a width-3 kernel placed every 2 pixels overlaps by one. In 2-D this gives a periodic pattern of 1, 2 or 4 contributions per pixel, so even with identical weights the output has a built-in 2-pixel grid, and the network must learn weights that exactly cancel it, which it rarely does. Alternatives with the same 2× upsampling: (1) a kernel divisible by the stride, `ConvTranspose2d(k=4, stride=2, padding=1)`, which gives uniform overlap and also doubles the size; (2) nearest-neighbour or bilinear upsampling by 2 followed by a 3×3 conv with padding 1, which separates resizing from learning and is the standard U-Net choice; (3) a conv producing $4C$ channels followed by pixel shuffle with factor 2.","r":[["Dumoulin & Visin: A guide to convolution arithmetic","https://arxiv.org/abs/1603.07285","Pooling arithmetic and the transposed-convolution chapter with output-size relations."],["Odena, Dumoulin, Olah: Deconvolution and Checkerboard Artifacts","https://distill.pub/2016/deconv-checkerboard/","Interactive explanation of uneven overlap and the resize-convolution fix."],["Springenberg et al.: Striving for Simplicity: The All Convolutional Net","https://arxiv.org/abs/1412.6806","Replacing max pooling with strided convolution without accuracy loss."],["Dive into Deep Learning: Pooling","https://d2l.ai/chapter_convolutional-neural-networks/pooling.html","Max and average pooling with padding and stride, from scratch."]],"k":["pooling","transposed convolution","global average pooling"],"x":["NumPy"],"p":["max-pool-2d","pooling-layers","transposed-convolution","2d-transposed-convolution","adaptive-average-pool-2d"],"ak":""},{"id":"03.03","t":"Classic CNNs: LeNet, AlexNet, VGG","n":["LeNet-5 (1998) fixed the template still used today: conv, nonlinearity, pool, repeated, then dense layers; about 60k parameters for 32×32 digits.","AlexNet (2012) scaled the template to ImageNet with ReLU, dropout, heavy augmentation and two GPUs, cutting top-5 error from 26.2% to 15.3% and starting the deep learning era in vision.","VGG (2014) showed depth with only 3×3 kernels works: two 3×3 convs see a 5×5 region with 28% fewer parameters and an extra nonlinearity.","These networks put most parameters in the dense head (about 90% in VGG-16) and most compute in the convolutions; later designs removed the head and attacked compute."],"a":"## Why study old networks\nLeNet, AlexNet and VGG are rarely deployed now, but each one introduced a design decision every later CNN inherits, and their failure modes motivated what came next: residual connections (03.04) and efficient blocks (03.05). They also make good mental benchmarks for parameter and compute counting. AI Research's TensorFlow lessons train CNNs on MNIST and CIFAR-10 in code; this lesson is about the architecture choices.\n\n## LeNet-5: the template\nLeCun et al.'s LeNet-5 read 32×32 grayscale digits for cheque processing:\n- conv 5×5, 6 channels → 28×28×6, then subsample to 14×14×6\n- conv 5×5, 16 channels → 10×10×16, then subsample to 5×5×16\n- dense 400 → 120 → 84 → 10\n\nAbout 60 thousand parameters. The key ideas were already there: local receptive fields, shared weights, spatial subsampling, and end-to-end training by backprop. It used tanh-like activations and average-style subsampling; the modern re-implementation swaps in ReLU and max pooling.\n\n## AlexNet: scale, ReLU and regularisation\nKrizhevsky, Sutskever and Hinton won ILSVRC-2012 with 15.3% top-5 error against 26.2% for the next entry. The architecture was LeNet's shape, much larger: 5 conv layers (the first 11×11 with stride 4 and 96 channels), 3 dense layers of 4096, 4096 and 1000 units, about 60 million parameters. What made it work is as important as the layers:\n- **ReLU** instead of tanh: the paper reports reaching 25% training error on CIFAR-10 about six times faster.\n- **Dropout** 0.5 in the first two dense layers, without which it overfit badly.\n- **Data augmentation**: random 224×224 crops and flips from 256×256 images, plus PCA colour jitter.\n- **GPUs**: trained for five to six days on two 3 GB GTX 580s, with the model split across them.\n- **Overlapping max pooling** (3×3, stride 2) and local response normalisation; LRN was later dropped as BatchNorm superseded it.\n\n## VGG: depth from small kernels\nSimonyan and Zisserman asked what happens if you fix every conv to 3×3, stride 1, padding 1, and only vary depth. VGG-16 has 13 conv layers in 5 blocks (64, 128, 256, 512, 512 channels, each block ending in a 2×2 max pool) and the same 3-layer dense head. It placed second in ILSVRC-2014 classification. The argument for 3×3:\n- Two stacked 3×3 layers have a 5×5 receptive field; three have 7×7 (03.01).\n- Parameters for $C$ channels: three 3×3 layers $3 \\cdot 9C^2 = 27C^2$ versus one 7×7 layer $49C^2$, 45% fewer.\n- Each layer adds a ReLU, so the stack is more nonlinear than one big kernel.\n\nThe cost: VGG-16 has 138 million parameters and about 15.3 billion multiply-adds per 224×224 image. The first dense layer alone, $25{,}088 \\times 4096 \\approx 103$M weights, is three quarters of the parameter count.\n\n| Model | Year | Depth (weight layers) | Parameters | ImageNet top-5 error |\n| LeNet-5 | 1998 | 5 | about 60k | (digits only) |\n| AlexNet | 2012 | 8 | about 60M | 15.3% |\n| VGG-16 | 2014 | 16 | about 138M | about 7.3% (ensemble entry) |\n\n%%layers VGG-16 as five stages: each halves resolution and (up to 512) doubles channels; the dense head holds most parameters.\nInput | 224×224×3\nStages 1-2 | 2 × conv3-64, pool; 2 × conv3-128, pool → 56×56×128\nStages 3-5 | 3 × conv3-256, 3 × conv3-512, 3 × conv3-512, each then pool → 7×7×512\n*Dense head | 25,088 → 4096 → 4096 → 1000, about 124M of 138M parameters\n%%\n\n```python\nimport torch.nn as nn\n\ndef vgg_block(c_in, c_out, n_convs):\n    layers = []\n    for i in range(n_convs):\n        layers += [nn.Conv2d(c_in if i == 0 else c_out, c_out, 3, padding=1), nn.ReLU(inplace=True)]\n    return nn.Sequential(*layers, nn.MaxPool2d(2))\n\nfeatures = nn.Sequential(vgg_block(3, 64, 2), vgg_block(64, 128, 2), vgg_block(128, 256, 3),\n                         vgg_block(256, 512, 3), vgg_block(512, 512, 3))   # -> 512×7×7\n```\n\n## What they could not do\nGoing deeper than about 20 layers in this plain style stopped helping: VGG-19 barely beat VGG-16, and training very deep VGG-style nets needed staged initialisation from shallower trained ones (He init, 01.05, and BatchNorm, 02.01, eased this). The next lesson shows the problem was optimisation, not capacity, and how residual connections fixed it. The huge dense heads were replaced by global average pooling (03.02), and the compute cost motivated the efficient designs of 03.05.\n\n! Example: where VGG-16's parameters live\n! Conv layers: 13 layers totalling about 14.7M parameters. The largest, 512→512 at 3×3, is $512 \\cdot 512 \\cdot 9 \\approx 2.36$M each, and there are five of them.\n! Dense layers: $25{,}088 \\times 4096 + 4096 \\times 4096 + 4096 \\times 1000 \\approx 102.8 + 16.8 + 4.1 = 123.6$M.\n! So about 89% of parameters sit in the head, but over 99% of the multiply-adds are in the convolutions, mostly in the high-resolution early stages. Replacing the head with global average pooling plus one 512→1000 layer removes about 123M parameters and almost no compute.\n\n> Takeaway: LeNet set the conv-pool-dense template, AlexNet proved it scales with ReLU, dropout, augmentation and GPUs, and VGG showed stacks of 3×3 convs are the efficient way to grow receptive fields; their dense heads and depth limits set up the designs that followed.","q":"Someone proposes replacing each pair of 3×3 convolutions in a VGG block with a single 5×5 convolution \"since the receptive field is the same and there's one fewer layer to run\". For 256 input and output channels at 56×56, compare parameters, compute and expressiveness, and say which you would keep.","s":"Two 3×3 layers: $2 \\times 9 \\times 256^2 = 1{,}179{,}648$ weights. One 5×5 layer: $25 \\times 256^2 = 1{,}638{,}400$ weights, about 39% more. Compute scales the same way since both run at 56×56 (3136 positions): about 3.70 billion versus 5.14 billion multiply-adds. The receptive field is 5×5 in both cases, so the larger kernel buys no extra context. Expressiveness favours the pair: it applies two ReLUs, so it can represent functions of the 5×5 patch that a single linear filter plus one ReLU cannot, and the factorisation acts as a structured constraint that tends to generalise well. The only argument for 5×5 is one fewer kernel launch and one fewer stored activation map, which rarely outweighs 39% more FLOPs. Keep the two 3×3 convolutions.","r":[["Krizhevsky, Sutskever, Hinton: ImageNet Classification with Deep Convolutional Neural Networks","https://papers.nips.cc/paper/4824-imagenet-classification-with-deep-convolutional-neural-networks","Section 3 on ReLU, multi-GPU training and pooling; Section 4 on augmentation and dropout."],["Simonyan & Zisserman: Very Deep Convolutional Networks (VGG)","https://arxiv.org/abs/1409.1556","Section 2.3 gives the argument for stacks of 3×3 convolutions; Table 1 lists the configurations."],["Dive into Deep Learning: LeNet","https://d2l.ai/chapter_convolutional-neural-networks/lenet.html","LeNet-5 layer by layer with shapes, trained on Fashion-MNIST."],["Dive into Deep Learning: AlexNet","https://d2l.ai/chapter_convolutional-modern/alexnet.html","What changed from LeNet to AlexNet and why it mattered."]],"k":["LeNet","AlexNet","VGG"],"x":["PyTorch"],"p":["lenet-forward-pass","vgg-convolution-block","multichannel-2d-convolution"],"ak":""},{"id":"03.04","t":"Residual networks","n":["Plain networks deeper than about 20 layers trained **worse**, with higher training error, not just test error: a degradation problem in optimisation, not overfitting.","A residual block computes $y = x + F(x)$, so each block only has to learn a correction to the identity, and doing nothing is the easy default.","The identity path gives backprop a direct route: $\\partial L/\\partial x_l = \\partial L/\\partial x_L\\,(1 + \\partial(\\ldots)/\\partial x_l)$, so the gradient never has to pass through every weight layer.","Bottleneck blocks (1×1 reduce, 3×3, 1×1 expand) make 50-152 layer nets affordable; a 1×1 projection shortcut handles changes in shape."],"a":"## The degradation problem\nBy 2015, VGG (03.03), He initialisation (01.05) and BatchNorm (02.01) let 20-30 layer plain networks train. Going deeper should not hurt: a 56-layer net could copy a 20-layer net and make the extra 36 layers identity maps. In practice He et al. found the 56-layer plain network had **higher training error** than the 20-layer one on CIFAR-10, and plain-34 was worse than plain-18 on ImageNet. Since training error rose, this is not overfitting. With BN, gradients weren't vanishing either. The solver simply could not find the good solutions that exist; learning an identity mapping through a stack of conv-BN-ReLU layers is surprisingly hard.\n\n## The residual block\nThe fix is to make identity the default. A residual block computes\n\n$$y = x + F(x; W)$$\n\nwhere $F$ is two or three conv layers. To act as identity the block only needs $F = 0$, which weight decay and small init make easy. Each block learns a **residual**: a correction to its input. Stacking them, the output of block $L$ is the input of block $l$ plus a sum of corrections:\n\n$$x_L = x_l + \\sum_{i=l}^{L-1} F(x_i)$$\n\nand the gradient is\n\n$$\\frac{\\partial \\mathcal{L}}{\\partial x_l} = \\frac{\\partial \\mathcal{L}}{\\partial x_L}\\left(1 + \\frac{\\partial}{\\partial x_l}\\sum_{i=l}^{L-1} F(x_i)\\right)$$\n\nThe \"1\" means the gradient at the top reaches every earlier block directly, without being multiplied by any weight matrices. It cannot vanish just because some branches have small Jacobians. This is the same reasoning as the Pre-LN Transformer (02.02), which uses exactly this structure.\n\n%%flow A basic residual block: the shortcut carries x unchanged and the branch learns a correction that is added before the final ReLU.\nx -(conv3×3, BN, ReLU)-> h -(conv3×3, BN)-> F(x) -(+ x)-> *x + F(x) -(ReLU)-> y\n%%\n\n## Block designs\n- **Basic block** (ResNet-18/34): two 3×3 convs with BN and ReLU; the ReLU comes after the addition.\n- **Bottleneck block** (ResNet-50/101/152): 1×1 conv reduces channels by 4×, a 3×3 conv works at the reduced width, a 1×1 conv expands back. The expensive 3×3 runs on a quarter of the channels.\n- **Projection shortcut**: when a block changes resolution (stride 2) or channel count, $x$ no longer matches $F(x)$, so the shortcut becomes a 1×1 conv with stride 2 and BN. Elsewhere the shortcut is a free identity.\n- **Pre-activation** (ResNet v2): BN and ReLU move to the start of the branch, $y = x + F(\\mathrm{ReLU}(\\mathrm{BN}(x)))$, so the shortcut path is a pure identity with nothing after the addition. This trains 1000-layer nets and is the form diffusion U-Nets and Transformers follow.\n\n```python\nimport torch.nn as nn\n\nclass Bottleneck(nn.Module):\n    def __init__(self, c_in, c_mid, stride=1):\n        super().__init__()\n        c_out = 4 * c_mid\n        self.f = nn.Sequential(\n            nn.Conv2d(c_in, c_mid, 1, bias=False), nn.BatchNorm2d(c_mid), nn.ReLU(inplace=True),\n            nn.Conv2d(c_mid, c_mid, 3, stride, 1, bias=False), nn.BatchNorm2d(c_mid), nn.ReLU(inplace=True),\n            nn.Conv2d(c_mid, c_out, 1, bias=False), nn.BatchNorm2d(c_out))\n        nn.init.zeros_(self.f[-1].weight)          # block starts as identity\n        self.short = nn.Identity() if stride == 1 and c_in == c_out else nn.Sequential(\n            nn.Conv2d(c_in, c_out, 1, stride, bias=False), nn.BatchNorm2d(c_out))\n        self.act = nn.ReLU(inplace=True)\n    def forward(self, x):\n        return self.act(self.f(x) + self.short(x))\n```\n\nZero-initialising the last BN scale $\\gamma$ in each branch, as above, makes every block an exact identity at step 0, so a 100-block network initially behaves like a shallow one; Goyal et al. used it for large-batch training.\n\n## Why ResNets train\nSeveral complementary explanations hold up:\n- **Gradient highway**: the identity term above.\n- **Easier targets**: learning small corrections near zero is better-conditioned than learning a full mapping.\n- **Smoother loss surfaces**: Li et al.'s visualisations show deep plain nets have chaotic, non-convex landscapes, while skip connections keep them smooth and nearly convex near the minimum.\n- **Implicit ensemble**: a stack of $n$ blocks contains $2^n$ paths of different lengths, and most gradient flows through relatively short ones, so a deep ResNet behaves partly like an ensemble of shallower networks.\n\nThe results: ResNet-152 had lower complexity than VGG-16 (11.3 versus 15.3 billion FLOPs as reported) and an ensemble won ILSVRC-2015 at 3.57% top-5 error. ResNet-50 (25.6M parameters, about 3.8 billion multiply-adds) remains the standard vision baseline, and the residual connection is now in almost every deep architecture.\n\n! Example: why bottlenecks are cheaper\n! At 256 channels, a basic block with two 3×3 convs needs $2 \\times 9 \\times 256^2 = 1{,}179{,}648$ weights.\n! A bottleneck 256 → 64 → 64 → 256 needs $256 \\cdot 64 + 9 \\cdot 64^2 + 64 \\cdot 256 = 16{,}384 + 36{,}864 + 16{,}384 = 69{,}632$ weights, 17× fewer.\n! That saving is what let ResNet-50 use three layers per block and 16 blocks while staying cheaper than VGG-16.\n\n> Takeaway: residual blocks learn corrections on top of an identity shortcut, which turns the degradation problem into a non-problem by giving gradients a direct path; use bottlenecks for depth, projection shortcuts where shapes change, and zero-init the last layer of each branch.","q":"Explain why the degradation problem cannot be overfitting, then use the residual gradient formula to argue why a 100-block ResNet still gets useful gradients at its first block even if the branch Jacobians are all small. What happens to that argument if you add a ReLU after every addition (as the original ResNet does)?","s":"Overfitting means low training error but high test error. In the degradation experiments the deeper plain net had higher training error than the shallower one, even though it could represent the shallower solution by setting extra layers to identity, so the failure is in optimisation. In a ResNet, $\\partial L/\\partial x_1 = \\partial L/\\partial x_{100}\\,(1 + \\partial(\\sum F_i)/\\partial x_1)$. The leading 1 passes the top gradient to the first block unchanged, so small branch Jacobians reduce the correction terms without shrinking the base signal; in a plain network the gradient is a product of 100 Jacobians and vanishes if each has norm below one. With a ReLU after each addition the shortcut is no longer a pure identity: each step multiplies the gradient by a 0/1 mask, so units that are off block their component of the shortcut. In practice most units are active and the path is still short, so it trains well to about 150 layers, but at around 1000 layers this degrades, which is why pre-activation ResNets move all nonlinearities into the branch and keep the shortcut clean.","r":[["He et al.: Deep Residual Learning for Image Recognition","https://arxiv.org/abs/1512.03385","Figure 1 (degradation), Section 3 (residual blocks, projection shortcuts), Table 1 (ResNet-18 to 152)."],["He et al.: Identity Mappings in Deep Residual Networks","https://arxiv.org/abs/1603.05027","The gradient decomposition and the pre-activation block that trains 1001-layer nets."],["Li et al.: Visualizing the Loss Landscape of Neural Nets","https://arxiv.org/abs/1712.09913","Loss-surface plots with and without skip connections."],["Dive into Deep Learning: Residual Networks","https://d2l.ai/chapter_convolutional-modern/resnet.html","Residual blocks and ResNet-18 in code, with the function-class argument."]],"k":["ResNet","skip connections","bottleneck"],"x":["PyTorch"],"p":["resnet-residual-block","residual-block","apply-alphago-residual-block","time-conditioned-residual-block"],"ak":""},{"id":"03.05","t":"Efficient and attentive CNNs","n":["1×1 convolutions mix channels at each pixel; Inception uses them to cut channel counts before expensive 3×3 and 5×5 branches, often by around 10× in compute.","A depthwise-separable convolution splits a $k \\times k$ conv into a per-channel spatial filter plus a 1×1 channel mixer, reducing cost by a factor of about $1/C_{out} + 1/k^2$, roughly 8-9× for 3×3.","MobileNetV2's inverted residual expands channels, filters depthwise, then projects back with a linear (no ReLU) bottleneck, with the residual between the narrow ends.","Squeeze-and-excitation pools each channel to one number, passes the vector through a tiny gating MLP with a sigmoid, and rescales the channels: channel attention for about 10% more parameters and under 1% more compute."],"a":"## From accuracy to accuracy per FLOP\nAfter ResNet (03.04), the question shifted from \"can it train?\" to \"what does each multiply-add buy?\". Phones, cameras and serving budgets care about latency and energy, so a model that matches ResNet-50 at a tenth of the cost is worth more than one that beats it by half a point. This lesson covers the three ideas that dominate efficient CNN design: cheap channel mixing with 1×1 convs (Inception), factorised convolutions (depthwise-separable, MobileNet), and channel attention (squeeze-and-excitation). Module 04 continues with Vision Transformers, which push the attention idea further.\n\n## Inception and 1×1 reductions\nGoogLeNet (Szegedy et al., 2014) won ILSVRC-2014 with an Inception module: parallel 1×1, 3×3 and 5×5 conv branches plus a 3×3 max-pool branch, concatenated along channels, so each layer can choose its own mix of receptive-field sizes. Run naively, the 5×5 branch is enormous. The trick is a **1×1 convolution** before it: a per-pixel dense layer across channels that cuts depth from, say, 192 to 16, so the 5×5 conv runs on 16 channels. GoogLeNet reached higher accuracy than VGG with about 12× fewer parameters than AlexNet.\n\n%%flow An Inception module: four parallel branches, each 1×1-reduced where needed, concatenated along channels.\n[Branch 1] Input 192ch -(1×1, 64)-> *Concat\n[Branch 2] Input 192ch -(1×1, 96)-> Reduced -(3×3, 128)-> *Concat\n[Branch 3] Input 192ch -(1×1, 16)-> Reduced -(5×5, 32)-> *Concat\n[Branch 4] Input 192ch -(3×3 max pool)-> Pooled -(1×1, 32)-> *Concat\n%%\n\n## Depthwise-separable convolutions\nA standard conv does spatial filtering and channel mixing at once: cost $k^2 C_{in} C_{out}$ per output pixel. A **depthwise-separable** conv factorises it:\n1. **Depthwise**: one $k \\times k$ filter per input channel, no mixing across channels (a grouped conv with groups $= C_{in}$). Cost $k^2 C_{in}$.\n2. **Pointwise**: a 1×1 conv mixing channels. Cost $C_{in} C_{out}$.\n\n$$\\frac{k^2 C_{in} + C_{in} C_{out}}{k^2 C_{in} C_{out}} = \\frac{1}{C_{out}} + \\frac{1}{k^2}$$\n\nFor 3×3 kernels and hundreds of channels this is about $1/9$. MobileNet (2017) built a whole network from these blocks: about 4.2M parameters and 569M multiply-adds for 70.6% ImageNet top-1, against VGG-16's 138M parameters and about 15.3 billion for 71.5%. Xception reached a similar design from the Inception side, viewing depthwise-separable conv as an Inception module taken to the extreme.\n\n**MobileNetV2's inverted residual** improves on it. ResNet bottlenecks go wide → narrow → wide; V2 goes narrow → wide → narrow: a 1×1 expands channels by about 6×, a 3×3 depthwise filters in the wide space (cheap, since depthwise cost is linear in channels), and a 1×1 projects back down with **no ReLU**, because ReLU in a low-dimensional space destroys information. The residual connects the narrow ends, keeping the memory-heavy tensors small.\n\nThe caveat: FLOPs are not latency. Depthwise convs do very little arithmetic per byte loaded, so on GPUs they are memory-bound and run far below peak throughput; a MobileNet can be slower than its FLOP count suggests. Always benchmark on the target hardware.\n\n## Squeeze-and-excitation: channel attention\nConvolutions treat every channel equally regardless of the image. Hu et al.'s SE block lets the network reweight channels per input:\n1. **Squeeze**: global average pool each of the $C$ channels to one number, giving a $C$-vector summarising the whole image.\n2. **Excite**: a two-layer MLP $C \\to C/r \\to C$ (with $r = 16$), ReLU in between, sigmoid at the end, giving a gate in $(0, 1)$ per channel.\n3. **Scale**: multiply each channel of the feature map by its gate.\n\n```python\nimport torch.nn as nn\n\nclass SE(nn.Module):\n    def __init__(self, c, r=16):\n        super().__init__()\n        self.gate = nn.Sequential(nn.AdaptiveAvgPool2d(1), nn.Flatten(),\n                                  nn.Linear(c, c // r), nn.ReLU(inplace=True),\n                                  nn.Linear(c // r, c), nn.Sigmoid())\n    def forward(self, x):                       # x: (N, C, H, W)\n        return x * self.gate(x)[:, :, None, None]\n```\n\nInserted into every ResNet-50 block (on the branch, before the addition), SE adds about 2.5M parameters (10%) and under 1% compute, and the SE-based entry won ILSVRC-2017. It is a cheap form of attention: global context decides which features matter. EfficientNet (2019) combined MobileNetV2 blocks, SE and a **compound scaling** rule that grows depth, width and resolution together by fixed ratios; EfficientNet-B7 reached 84.3% top-1 while being 8.4× smaller than the previous best.\n\n| Idea | What it factorises or adds | Typical saving or cost |\n| 1×1 reduction (Inception) | cuts channels before big kernels | about 10× fewer MACs in a branch |\n| Depthwise-separable | spatial filter and channel mix separately | about 8-9× fewer MACs for 3×3 |\n| Inverted residual | expand, depthwise, linear project | small memory footprint between blocks |\n| Squeeze-and-excitation | per-image channel gates | +10% params, under 1% compute |\n\n! Example: the savings, counted\n! Inception's 5×5 branch on a 28×28×192 input, producing 32 channels. Direct: $28^2 \\times 32 \\times 25 \\times 192 \\approx 120.4$M MACs. With a 1×1 reduction to 16 channels first: $28^2 \\times 16 \\times 192 + 28^2 \\times 32 \\times 25 \\times 16 \\approx 2.4 + 10.0 = 12.4$M, about 10× less.\n! Depthwise-separable 3×3 conv with 256 in and out channels: standard $9 \\times 256^2 = 589{,}824$ weights; separable $9 \\times 256 + 256^2 = 2{,}304 + 65{,}536 = 67{,}840$, about 8.7× fewer, matching $1/256 + 1/9 \\approx 0.115$.\n\n> Takeaway: efficient CNNs separate what a standard conv does jointly, using 1×1 convs to mix channels cheaply and depthwise convs to filter space cheaply, and add channel attention like squeeze-and-excitation for a small cost; always check that FLOP savings turn into real latency on your hardware.","q":"You replace every 3×3 conv in a ResNet-50 with a depthwise-separable equivalent. FLOPs drop about 8×, but inference on a datacenter GPU gets only about 1.5× faster, and accuracy falls 3 points. Explain both effects, and say what MobileNetV2-style design changes address each.","s":"Speed: depthwise convs do $k^2$ multiply-adds per loaded input value per channel, very low arithmetic intensity, so on a GPU they are memory-bandwidth-bound and run at a small fraction of peak compute. FLOPs fall 8× but bytes moved fall much less, the 1×1 convs and memory traffic dominate, and the extra layers add kernel launches, so wall-clock improves only modestly. Accuracy: a depthwise-separable conv is a constrained, low-rank factorisation of the full conv, so at the same channel width each block has far fewer parameters and less capacity; ResNet's widths were tuned for full convs. MobileNetV2 addresses capacity by expanding channels about 6× before the depthwise conv (cheap, since depthwise cost is linear in width), and by using a linear bottleneck so the projection doesn't destroy information with ReLU. For speed, the answer is co-design: fuse depthwise and pointwise kernels, choose widths and resolutions benchmarked on the target hardware, or use plain dense convs where the GPU is compute-rich.","r":[["Szegedy et al.: Going Deeper with Convolutions (GoogLeNet)","https://arxiv.org/abs/1409.4842","Section 4 on the Inception module and 1×1 dimension reductions."],["Howard et al.: MobileNets","https://arxiv.org/abs/1704.04861","Depthwise-separable cost analysis (Section 3.1) and the width and resolution multipliers."],["Hu et al.: Squeeze-and-Excitation Networks","https://arxiv.org/abs/1709.01507","The SE block, where to insert it, and its parameter and compute overhead."],["Tan & Le: EfficientNet","https://arxiv.org/abs/1905.11946","Compound scaling of depth, width and resolution built on MBConv blocks with SE."]],"k":["depthwise separable","Inception","squeeze-and-excitation"],"x":["PyTorch"],"p":["depthwise-separable-convolution","inception-module","squeeze-and-excitation-block","conv2d"],"ak":""}]},{"n":"04","name":"Computer vision","lessons":[{"id":"04.01","t":"Images as arrays","n":["An image is a tensor with conventions: `uint8` HWC on disk, `float32` NCHW in most training code. Most silent bugs are convention mismatches (RGB vs BGR, HWC vs CHW, 0-255 vs 0-1), not model bugs.","Normalise with the statistics the model was trained with: divide by 255, then subtract the per-channel mean and divide by the per-channel std, computed on the training set only.","Classic filters (box, Gaussian, Sobel) are fixed convolutions. They explain what early CNN layers learn and are still useful for preprocessing and debugging.","Augmentation must preserve the label. Geometric transforms must also move the boxes or masks, and some (horizontal flip on text, rotation on digits like 6/9) change the label itself.","Train-time augmentation is random; eval-time preprocessing is deterministic (resize, centre crop, normalise) and must match what the model saw in training."],"a":"## Where this module sits\nModule 03 built the convolutional network itself. This module is about what goes in and out of it for real vision tasks: how pixels become tensors, how detectors and segmenters frame their outputs, and how transformers replaced convolutions in many backbones. This first lesson is the unglamorous part, and it is where a surprising share of production accuracy gets lost.\n\n## An image is a tensor with conventions\nA decoded JPEG is an array of shape $(H, W, 3)$ with dtype `uint8`, values 0 to 255. PyTorch layers expect `float32` in $(N, C, H, W)$ order; TensorFlow and JAX code often keeps channels last, $(N, H, W, C)$. A single 224×224 RGB image is 150,528 numbers; a batch of 256 in `float32` is about 154 MB before the network touches it, which is why data loaders keep images as `uint8` until the last moment.\n\nThree conventions cause most silent failures:\n- **Channel order.** OpenCV decodes to BGR; PIL and torchvision use RGB. Feeding BGR to an RGB-trained model does not crash; it just loses several points of accuracy because red and blue statistics are swapped.\n- **Axis order.** Converting HWC to CHW needs `transpose(2, 0, 1)`. Using `reshape(3, H, W)` has the right shape but scrambles pixels into stripes. Nothing errors.\n- **Value range.** Some pipelines expect 0-1 floats, some expect 0-255, some expect -1 to 1. Normalising twice or not at all both \"work\" and both hurt.\n\n## Colour spaces\nRGB is what cameras and screens use, but it entangles brightness with colour. Other spaces separate them:\n\n| Space | Channels | Typical use |\n| RGB | red, green, blue | model input, display |\n| Grayscale | luma $Y = 0.299R + 0.587G + 0.114B$ | edge detection, cheap models |\n| HSV | hue, saturation, value | colour jitter (shift hue without changing brightness) |\n| YCbCr | luma plus two chroma | JPEG compression, which stores chroma at lower resolution |\n\nThe grayscale weights are not equal because the eye is most sensitive to green. A second subtlety: stored pixel values are gamma-encoded (sRGB), so averaging two pixel values is not the same as averaging light intensities. For learning this rarely matters; for resizing and blending high-contrast edges it can.\n\n## Normalisation\nThe standard recipe is: convert to float, divide by 255, then for each channel $c$ compute $x' = (x - \\mu_c)/\\sigma_c$. The ImageNet statistics, $\\mu = (0.485, 0.456, 0.406)$ and $\\sigma = (0.229, 0.224, 0.225)$, are baked into almost every pretrained torchvision model. If you train from scratch on your own data, compute $\\mu$ and $\\sigma$ over the training split only; using validation images leaks information, mildly but measurably.\n\n```python\nimport numpy as np\nMEAN = np.array([0.485, 0.456, 0.406], dtype=np.float32)\nSTD  = np.array([0.229, 0.224, 0.225], dtype=np.float32)\n\ndef to_model_input(img_hwc_uint8):           # (H, W, 3) RGB uint8\n    x = img_hwc_uint8.astype(np.float32) / 255.0\n    x = (x - MEAN) / STD                      # broadcasts over the last axis\n    return x.transpose(2, 0, 1)               # (3, H, W), never reshape\n```\n\nWhy normalise at all? Zero-centred, unit-scale inputs keep the first layer's pre-activations in a sensible range at initialisation, so the variance-preserving init from module 01 actually holds.\n\n! Example: normalising one pixel\n! A red channel value of 200 becomes $200/255 = 0.784$, then $(0.784 - 0.485)/0.229 = 1.31$.\n! A pure black pixel (0) in the blue channel becomes $(0 - 0.406)/0.225 = -1.80$. So normalised inputs live roughly in $[-2.1, 2.6]$, not $[0, 1]$.\n\n## Filtering\nBefore CNNs, vision was hand-designed filters. They are worth knowing because first-layer CNN kernels learn very similar shapes:\n- **Box blur**: every weight $1/k^2$. Cheap, but produces ringing artefacts.\n- **Gaussian blur**: weights from $e^{-(x^2+y^2)/2\\sigma^2}$. It is separable, so a $k \\times k$ blur becomes a $k$-tap horizontal pass then a $k$-tap vertical pass: $2k$ multiplies per pixel instead of $k^2$.\n- **Sobel**: two 3×3 kernels that approximate $\\partial I/\\partial x$ and $\\partial I/\\partial y$; the gradient magnitude $\\sqrt{G_x^2 + G_y^2}$ highlights edges.\n\n
