Boundary handling (zero, reflect, replicate padding) changes the outputs at the border; this matters more for small images. Module 03 covers learned convolution, stride and padding in detail.\n\n## Augmentation\nAugmentation creates new training examples that the label should be invariant to. Common families:\n- **Geometric**: random resized crop (sample 8% to 100% of the area, then resize to 224), horizontal flip, small rotations and translations.\n- **Photometric**: brightness, contrast, saturation and hue jitter; blur; noise.\n- **Mixing**: mixup blends two images and their labels with weight $\\lambda \\sim \\text{Beta}(\\alpha, \\alpha)$; CutMix pastes a patch from one image into another and mixes labels by the pasted area.\n- **Policies**: RandAugment picks $N$ random operations at a shared magnitude $M$, reducing a large search space to two knobs.\n\n%%flow One image's path from disk to the network; augmentation runs on the cheap uint8 form, normalisation last.\nJPEG bytes -(decode)-> uint8 HWC -(random crop, flip, jitter)-> augmented -(to float, /255)-> *normalise -(transpose, batch)-> NCHW float32\n%%\n\nThe rule that matters is label preservation. Horizontal flips are fine for cats and wrong for text or for left-vs-right medical scans. For detection, every geometric transform must also transform the boxes; for segmentation it must transform the mask with nearest-neighbour interpolation so class ids stay integers. At evaluation time, use a fixed pipeline, typically resize the short side to 256 and centre crop 224, so results are reproducible.\n\n> Takeaway: treat preprocessing as part of the model. Channel order, axis order, value range, normalisation statistics and eval-time resizing must exactly match training, and every augmentation must keep the label true.\n","q":"A ResNet pretrained on ImageNet reports 76% top-1 accuracy, but in your pipeline (images loaded with OpenCV, converted with `reshape`, normalised with mean 0.5 and std 0.5) it gets 61%. List the likely causes, in the order you would check them, and how you would confirm each.","s":"First, axis order: `reshape` to (3, H, W) scrambles pixels without an error; confirm by converting a tensor back to an image and viewing it, then switch to `transpose(2, 0, 1)`. Second, channel order: OpenCV gives BGR, the model expects RGB; confirm by swapping channels (`img[..., ::-1]`) and re-running a small validation slice. Third, normalisation statistics: the model was trained with ImageNet means and stds, not 0.5/0.5; the shift is small per pixel but systematic. Fourth, eval resizing: check you resize the short side to 256 and centre crop 224 with the same interpolation as the reference. Change one thing at a time on a fixed 1,000-image slice so each fix's effect is visible.","r":[["torchvision: Transforming and augmenting images","https://pytorch.org/vision/stable/transforms.html","Reference for the standard train and eval pipelines, including how boxes and masks are transformed alongside images."],["Dive into Deep Learning: Image Augmentation","https://d2l.ai/chapter_computer-vision/image-augmentation.html","Runnable walkthrough of flips, crops and colour jitter and their effect on training."],["RandAugment (Cubuk et al., 2019)","https://arxiv.org/abs/1909.13719","How a two-parameter augmentation policy matches searched policies; read the method section."],["mixup: Beyond Empirical Risk Minimization","https://arxiv.org/abs/1710.09412","The original mixup paper; short, and explains why mixing labels regularises."]],"k":["preprocessing","augmentation"],"x":["NumPy","torchvision"],"p":["image-normalize","per-channel-mean-and-std","rgb-to-grayscale","gaussian-blur-2d","transform-pipeline"],"ak":""},{"id":"04.02","t":"Object detection basics","n":["A detector outputs a variable-size set of (box, class, score). Dense detectors predict at every feature-map location and then prune.","IoU, intersection over union, is the yardstick for everything: matching anchors to ground truth, deciding duplicates in NMS, and scoring at evaluation (mAP at IoU 0.5 to 0.95).","Anchors are reference boxes tiled over the feature map at several scales and aspect ratios. The network predicts a class and a small correction for each one.","Boxes are regressed as encoded offsets: centre shift divided by anchor size, and log of the size ratio. This makes targets scale-invariant and keeps widths positive.","Non-maximum suppression keeps the highest-scoring box and removes others that overlap it beyond a threshold. It is greedy and can delete real objects in crowds."],"a":"## The detection problem\nClassification answers \"what is in this image\". Detection answers \"what is where\": a list of boxes, each with a class and a confidence. The list has variable length, which is awkward for a network with fixed-size outputs. The standard trick is to predict far too many candidates at fixed positions and then prune.\n\nTwo families do this:\n- **Two-stage** (Faster R-CNN): a region proposal network suggests about 1,000-2,000 boxes, then a second head crops features for each (RoIAlign) and classifies and refines it. Accurate, slower.\n- **One-stage** (SSD, RetinaNet, YOLO): a single dense head predicts class scores and box offsets at every feature-map cell. Faster and simpler; with a good loss (next lesson) as accurate.\n\nAnchor-free detectors such as FCOS skip anchors and predict, at each location, the distances to the four box edges. The rest of this lesson still applies: IoU, encoding and NMS.\n\n%%flow A one-stage detector: dense predictions everywhere, then decode and prune.\nImage -> Backbone + FPN -(per cell)-> *Dense head -(decode offsets)-> Candidate boxes -(score > 0.05)-> NMS -> Detections\n%%\n\n## Box formats and IoU\nBoxes appear as corners $(x_1, y_1, x_2, y_2)$, as corner plus size $(x, y, w, h)$, or as centre plus size $(c_x, c_y, w, h)$, in pixels or normalised to $[0, 1]$. Mixing formats is a top-three detection bug, so convert at the edges and keep one format inside.\n\nIoU between boxes $A$ and $B$ is $|A \\cap B| / |A \\cup B|$. The intersection's corners are the max of the top-left corners and the min of the bottom-right corners, clamped at zero width and height when the boxes do not overlap. For $N$ predictions and $M$ ground-truth boxes, compute the full $N \\times M$ matrix with broadcasting; it feeds both matching and evaluation.\n\n! Example: IoU of two offset squares\n! $A = (0, 0, 10, 10)$ and $B = (5, 5, 15, 15)$. Intersection corners: $(5, 5)$ to $(10, 10)$, area 25.\n! Union: $100 + 100 - 25 = 175$. IoU $= 25/175 = 0.143$. Half-overlapping on each axis gives a low IoU, which is why 0.5 is already a demanding threshold.\n\n## Anchors and matching\nAt each cell of a feature map with stride $s$, place $A$ anchors centred on the cell, for example 3 scales × 3 aspect ratios (1:2, 1:1, 2:1). RetinaNet uses 9 anchors per location on pyramid levels with strides 8 to 128. On an 800×800 image the stride-8 level alone is 100×100 cells × 9 = 90,000 anchors; the whole pyramid has about 120,000.\n\nDuring training each anchor gets a target by IoU with the ground truth:\n- IoU ≥ 0.5 with some box: positive, assigned to the box it overlaps most.\n- IoU < 0.4 with every box: negative (background).\n- In between: ignored, so ambiguous anchors do not send noisy gradients.\n- Each ground-truth box is also matched to its single best anchor, so small or oddly shaped objects are never left without a positive.\n\nThe result is extreme imbalance: a typical image has a handful of objects and tens of thousands of background anchors. The next lesson's focal loss exists because of this.\n\n## Encoding box targets\nRather than predicting raw coordinates, the head predicts offsets relative to its anchor $(x_a, y_a, w_a, h_a)$:\n\n$$t_x = \\frac{x - x_a}{w_a}, \\quad t_y = \\frac{y - y_a}{h_a}, \\quad t_w = \\log\\frac{w}{w_a}, \\quad t_h = \\log\\frac{h}{h_a}$$\n\nDividing by anchor size makes a 4-pixel shift on a 16-pixel anchor and a 32-pixel shift on a 128-pixel anchor the same target, so one regression head works across scales. The log makes widths positive after decoding ($w = w_a e^{t_w}$) and turns \"twice as wide\" and \"half as wide\" into symmetric targets $\\pm 0.69$. Implementations often divide by fixed variances such as $(0.1, 0.1, 0.2, 0.2)$ so targets have roughly unit scale, and clamp $t_w, t_h$ at about $\\log(1000/16) \\approx 4.1$ before `exp` so a bad prediction cannot overflow.\n\n## Non-maximum suppression\nA good detector fires on many neighbouring anchors for the same object. NMS turns that cluster into one box:\n1. Sort candidates by score.\n2. Take the highest, keep it.\n3. Remove every remaining candidate whose IoU with it exceeds a threshold (commonly 0.5).\n4. Repeat until no candidates remain.\n\n```python\nimport numpy as np\ndef nms(boxes, scores, thr=0.5):           # boxes: (N, 4) x1, y1, x2, y2\n    order, keep = scores.argsort()[::-1], []\n    while order.size:\n        i, rest = order[0], order[1:]\n        keep.append(i)\n        tl = np.maximum(boxes[i, :2], boxes[rest, :2])\n        br = np.minimum(boxes[i, 2:], boxes[rest, 2:])\n        inter = np.prod(np.clip(br - tl, 0, None), axis=1)\n        area = lambda b: (b[:, 2] - b[:, 0]) * (b[:, 3] - b[:, 1])\n        iou = inter / (area(boxes[[i]]) + area(boxes[rest]) - inter)\n        order = rest[iou <= thr]\n    return keep\n```\n\nRun it per class; a common trick is to offset each class's boxes by a large class-dependent constant so one call handles all classes without cross-class suppression. Worst case is $O(N^2)$, so detectors keep only the top 1,000 candidates per level before NMS.\n\nNMS is greedy and blind: two people standing shoulder to shoulder can have IoU above 0.5, and the lower-scoring one is deleted. Soft-NMS decays overlapping scores instead of zeroing them; set-prediction detectors (DETR, next lesson) avoid NMS entirely.\n\n> Takeaway: dense detectors predict a correction for every anchor, label anchors by IoU, regress scale-invariant offsets, and rely on NMS to remove duplicates. Most detection bugs are box-format, encoding or threshold mistakes, not architecture.\n","q":"Your detector misses one of two people standing shoulder to shoulder, even though before NMS both had high-scoring boxes. Explain what happened and give two fixes with their costs.","s":"The two people's boxes overlap with IoU above the NMS threshold (say 0.5). NMS keeps the higher-scoring box and deletes every candidate overlapping it beyond the threshold, including the correct box for the second person, because NMS cannot tell a duplicate from a neighbour. Fix 1: raise the threshold (0.6-0.7). This keeps neighbours but lets more true duplicates survive, lowering precision on isolated objects. Fix 2: Soft-NMS, which multiplies overlapping scores by a decay (linear or Gaussian in IoU) instead of zeroing them, so the second box survives with a reduced score and can still be ranked; costs a little more compute and a new hyperparameter. A structural fix is a set-prediction detector (DETR) trained with one-to-one matching, which needs no NMS but trains much more slowly.","r":[["Faster R-CNN (Ren et al., 2015)","https://arxiv.org/abs/1506.01497","Introduces anchors and the region proposal network; section 3.1 defines the box encoding used almost everywhere."],["Dive into Deep Learning: Anchor Boxes","https://d2l.ai/chapter_computer-vision/anchor.html","Code for generating anchors, IoU matrices, labelling anchors and NMS."],["FCOS: Fully Convolutional One-Stage Object Detection","https://arxiv.org/abs/1904.01355","The anchor-free alternative; useful contrast for what anchors actually buy you."],["torchvision.ops.nms","https://pytorch.org/vision/stable/generated/torchvision.ops.nms.html","The production NMS interface and its box-format expectations."]],"k":["object detection","IoU"],"x":["NumPy"],"p":["iou-matrix","non-maximum-suppression","box-encode-and-decode","anchor-box-generation","soft-non-maximum-suppression"],"ak":""},{"id":"04.03","t":"Detection losses and matching","n":["Dense detectors see roughly 1,000 background anchors per object. Plain cross-entropy is dominated by easy negatives; focal loss multiplies each term by $(1-p_t)^\\gamma$ so confident, correct predictions contribute almost nothing.","Initialise the classification bias to a prior of about 0.01 foreground, or the first iterations produce a huge loss from 100k anchors all predicting 0.5.","L1 loss on box coordinates does not track IoU. IoU-based losses do, but plain $1 - \\text{IoU}$ has zero gradient when boxes do not overlap; GIoU, DIoU and CIoU add terms that still pull disjoint boxes together.","DETR treats detection as set prediction: a fixed set of queries is matched one-to-one to ground truth with the Hungarian algorithm, and unmatched queries learn to predict 'no object'. One-to-one matching is why it needs no NMS."],"a":"## Two problems the previous lesson left open\nThe anchor recipe from the last lesson produces two training problems. Classification is wildly imbalanced: about 100,000 anchors per image, of which perhaps 50 are positive. And box regression with L1 or smooth-L1 on encoded offsets optimises something only loosely related to what evaluation measures, which is IoU. This lesson covers the loss that fixed the first problem, the family that fixed the second, and the matching scheme that removed NMS altogether. Module 01 introduced focal loss as a general loss; here is why detection needed it.\n\n## Focal loss\nWrite $p_t$ for the predicted probability of the true class (so $p_t = p$ for positives and $1-p$ for negatives). Cross-entropy is $-\\log p_t$. An easy negative with $p_t = 0.99$ costs only 0.01, but 100,000 of them sum to 1,000, swamping 50 hard positives.\n\nFocal loss adds a modulating factor:\n\n$$\\text{FL}(p_t) = -\\alpha_t (1 - p_t)^{\\gamma} \\log p_t$$\n\nWith $\\gamma = 2$, the easy negative's weight is $(0.01)^2 = 10^{-4}$; a hard example with $p_t = 0.3$ keeps weight $0.49$. The paper's defaults are $\\gamma = 2$, $\\alpha = 0.25$ for positives (it looks backwards but compensates for the down-weighting of negatives), and the total is divided by the number of positive anchors, not the number of anchors.\n\nThe other half of the trick is initialisation. If the final classification bias starts at zero, every anchor predicts $p = 0.5$ and the first loss is enormous and unstable. Setting the bias to $b = -\\log((1-\\pi)/\\pi)$ with $\\pi = 0.01$ gives $b \\approx -4.6$, so every anchor starts by predicting \"background, probably\".\n\n! Example: how much each anchor counts\n! Easy negative, $p_t = 0.99$: CE $= 0.010$, FL with $\\gamma = 2$ and $\\alpha_t = 0.75$ $\\approx 0.75 \\times 10^{-4} \\times 0.010 = 7.5 \\times 10^{-7}$.\n! Hard positive, $p_t = 0.2$: CE $= 1.61$, FL $= 0.25 \\times 0.64 \\times 1.61 = 0.26$.\n! The ratio of hard to easy contribution goes from about 160× under CE to about 340,000× under focal loss.\n\n## IoU-based box losses\nTwo predictions with the same L1 error can have very different IoU, because L1 treats the four coordinates independently and ignores scale. Optimising IoU directly fixes that, but $1 - \\text{IoU}$ is flat (gradient zero) whenever the boxes do not overlap, which is common early in training.\n\n| Loss | Extra term | What it fixes |\n| IoU | none | aligns training with the metric; no gradient when disjoint |\n| GIoU | $-\\,\\lvert C \\setminus (A \\cup B)\\rvert / \\lvert C\\rvert$, $C$ the smallest enclosing box | gives gradient when disjoint; range $[-1, 1]$ |\n| DIoU | $-\\,\\rho^2(b, b^{gt}) / c^2$, centre distance over enclosing diagonal | pulls centres together directly; converges faster than GIoU |\n| CIoU | DIoU plus $\\alpha v$, $v = \\frac{4}{\\pi^2}(\\arctan\\frac{w^{gt}}{h^{gt}} - \\arctan\\frac{w}{h})^2$ | also matches aspect ratio |\n\nThe loss is $1 - \\text{(G/D/C)IoU}$. GIoU has a known weakness: when one box contains the other, the enclosing box equals the larger box, the extra term vanishes, and GIoU degenerates to IoU; DIoU's centre term still pushes. In practice detectors combine an IoU-family loss with an L1 term on the boxes.\n\n## Set prediction with Hungarian matching\nDETR reframes detection. A transformer decoder takes $N = 100$ learned query vectors and outputs 100 (class, box) predictions, where the class set includes \"no object\". Training needs to decide which prediction is responsible for which ground-truth box, and DETR uses a one-to-one assignment that minimises total cost:\n\n$$\\hat\\sigma = \\arg\\min_{\\sigma} \\sum_i \\Big[-\\hat p_{\\sigma(i)}(c_i) + \\lambda_{L1}\\lVert b_i - \\hat b_{\\sigma(i)}\\rVert_1 + \\lambda_{giou}\\big(1 - \\text{GIoU}(b_i, \\hat b_{\\sigma(i)})\\big)\\Big]$$\n\nwith $\\lambda_{L1} = 5$ and $\\lambda_{giou} = 2$. The Hungarian algorithm solves this in $O(N^3)$, cheap for 100 queries. Matched predictions get the classification and box losses; the remaining queries are trained to output \"no object\", with that class's weight reduced to 0.1 to offset the imbalance.\n\n```python\nfrom scipy.optimize import linear_sum_assignment\n# cost: (num_queries, num_gt) built from class prob, L1 and GIoU terms\nrows, cols = linear_sum_assignment(cost)   # query rows[k] <-> gt cols[k]\n```\n\n%%flow Many-to-one matching needs NMS at test time; one-to-one matching does not.\n[Dense detector] Anchors -(IoU > 0.5)-> Many anchors per object -> *NMS at test time\n[DETR] 100 queries -(Hungarian, one-to-one)-> One query per object -> *No NMS\n%%\n\nWhy no NMS? With IoU matching, several anchors are trained to fire on the same object, so duplicates are the intended behaviour and must be pruned. With one-to-one matching, a second query firing on an already-claimed object is penalised as a false positive, so the model learns (via self-attention between queries) to suppress its own duplicates. The cost: the original DETR needed about 500 epochs on COCO versus about 36 for Faster R-CNN, because matching is unstable early on. Deformable DETR and later variants cut this substantially.\n\n> Takeaway: focal loss handles foreground-background imbalance, IoU-family losses align box regression with the evaluation metric, and one-to-one Hungarian matching turns detection into set prediction so the model learns to avoid duplicates instead of relying on NMS.\n","q":"Why does DETR not need NMS while RetinaNet does? What would you expect if you trained DETR with RetinaNet-style matching (every query whose box has IoU above 0.5 with a ground truth is a positive for it)?","s":"RetinaNet's matching is many-to-one: every anchor with IoU above 0.5 is a positive for that object, so the network is explicitly trained to produce several high-scoring boxes per object, and NMS is required to collapse them. DETR's Hungarian matching is one-to-one: exactly one query is positive for each object and every other query is trained toward 'no object', so a duplicate prediction is a penalised false positive and the decoder learns to suppress duplicates through query-to-query self-attention. If you switched DETR to IoU-threshold matching, several queries would be rewarded for the same object, duplicates would reappear at test time, and you would need NMS again. You would also lose the clean set-prediction loss, since the 'no object' targets would depend on arbitrary thresholds.","r":[["Focal Loss for Dense Object Detection (Lin et al., 2017)","https://arxiv.org/abs/1708.02002","RetinaNet and focal loss; section 3 for the loss and section 4.1 for the prior-based bias initialisation."],["Generalized Intersection over Union (Rezatofighi et al., 2019)","https://arxiv.org/abs/1902.09630","Defines GIoU and shows why IoU is a better regression target than L1."],["Distance-IoU Loss (Zheng et al., 2019)","https://arxiv.org/abs/1911.08287","DIoU and CIoU, with the containment failure case of GIoU illustrated."],["End-to-End Object Detection with Transformers (DETR)","https://arxiv.org/abs/2005.12872","Set prediction and the Hungarian matching cost; section 3.1."]],"k":["focal loss","bipartite matching"],"x":["NumPy","SciPy"],"p":["sigmoid-focal-loss","hungarian-matching","generalized-iou-loss","complete-iou-loss"],"ak":""},{"id":"04.04","t":"Segmentation and U-Net","n":["Semantic segmentation predicts a class for every pixel; the output is a $C \\times H \\times W$ logit map at input resolution.","Encoder-decoder networks downsample to gain context and upsample to recover resolution. Detail lost in downsampling cannot be recovered by upsampling alone.","U-Net's skip connections concatenate encoder features into the decoder at each resolution, so the decoder gets both coarse 'what' and fine 'where'.","Pixel cross-entropy is dominated by the majority class when foreground is tiny. Dice loss measures overlap directly, so it is insensitive to how many background pixels there are; most recipes combine the two.","Evaluate with per-class IoU averaged over classes (mIoU), not pixel accuracy."],"a":"## Three segmentation tasks\n- **Semantic segmentation**: one class per pixel. Two touching cars are one \"car\" region.\n- **Instance segmentation**: separate masks for each object (Mask R-CNN adds a mask head to the detector from the previous lessons).\n- **Panoptic segmentation**: both at once: instances for countable things, semantic regions for stuff like road and sky.\n\nThis lesson covers the semantic case and the U-Net architecture, which remains the default for medical imaging and is also the backbone of the diffusion models in module 07.\n\n## From classifier to dense predictor\nA classification CNN ends with global pooling and a fully connected layer, throwing away spatial layout. The fully convolutional network (FCN) idea is to keep everything convolutional so the output is a spatial map, then upsample it to input size. A ResNet with total stride 32 turns a 512×512 image into a 16×16 map; upsampling that 32× gives blobby masks, because fine boundaries were lost when the features were downsampled. Upsampling alone cannot recover information that is no longer there.\n\nTwo ways to upsample, both from module 03:\n- **Transposed convolution**: learned, but prone to checkerboard artefacts when kernel size is not divisible by stride.\n- **Bilinear or nearest resize followed by a 3×3 convolution**: fixed interpolation, then learned refinement; fewer artefacts and the common modern choice.\n\n## U-Net\nU-Net (2015) has a contracting path and a symmetric expanding path. At each resolution the encoder applies two 3×3 conv layers and then downsamples 2×, doubling channels. The decoder upsamples 2×, **concatenates** the encoder feature map from the same resolution, and applies two more 3×3 convolutions. The final 1×1 convolution maps to $C$ class logits per pixel.\n\n%%layers A four-level U-Net on a 256×256 input. Each encoder level's output is copied across to the decoder level at the same resolution.\nLevel 1 | 256×256, 64 channels, skip to decoder level 1\nLevel 2 | 128×128, 128 channels, skip to decoder level 2\nLevel 3 | 64×64, 256 channels, skip to decoder level 3\n*Bottleneck | 32×32, 512 channels: widest context, coarsest position\nDecoder | upsample, concatenate skip, two 3×3 convs, repeat to 256×256, then 1×1 conv to C logits\n%%\n\nWhy concatenation and not addition? Concatenation lets the decoder learn how to combine the two sources; addition (as in FPN or ResNets) forces them into the same feature space. The cost is more channels in the first decoder convolution: at level 3 it sees 512 upsampled plus 256 skip = 768 input channels.\n\n%%flow One decoder step.\nDecoder 32×32×512 -(upsample ×2)-> 64×64×512 -(concat skip)-> 64×64×768 -(two 3×3 convs)-> *64×64×256\n%%\n\nA practical detail: the original paper used unpadded convolutions, so a 572×572 input produced a 388×388 output and skips had to be centre-cropped to align. Modern implementations use `padding=1`, but if the input side is not divisible by $2^{\\text{levels}}$ (say 250 with four levels), the upsampled map and the skip differ by a pixel. Pad the input to a multiple of 16, or pad or crop the upsampled tensor before concatenating.\n\n## Losses for imbalanced masks\nThe natural loss is cross-entropy at every pixel, averaged. It fails when foreground is rare: if a lesion covers 0.3% of pixels, predicting \"background\" everywhere gets 99.7% pixel accuracy and a low loss. Class-weighted cross-entropy helps; Dice loss attacks the problem directly.\n\nThe Dice coefficient between predicted set $P$ and ground truth $G$ is\n\n$$D = \\frac{2\\lvert P \\cap G\\rvert}{\\lvert P\\rvert + \\lvert G\\rvert}$$\n\nThe soft version replaces sets with probabilities: $D = (2\\sum p_i g_i + \\epsilon)/(\\sum p_i + \\sum g_i + \\epsilon)$, and the loss is $1 - D$, averaged over classes. Background pixels where both $p$ and $g$ are near zero contribute nothing to either numerator or denominator, so the loss is scale-free with respect to the amount of background. The $\\epsilon$ (around 1) keeps the loss defined for images where a class is absent. Dice gradients can be noisy when objects are tiny, so a common recipe is cross-entropy plus Dice with equal weight.\n\n```python\nimport numpy as np\ndef soft_dice_loss(probs, onehot, eps=1.0):        # both (C, H, W)\n    inter = (probs * onehot).sum(axis=(1, 2))\n    denom = probs.sum(axis=(1, 2)) + onehot.sum(axis=(1, 2))\n    return 1 - ((2 * inter + eps) / (denom + eps)).mean()\n```\n\n! Example: Dice versus IoU on one mask\n! Ground truth has 100 foreground pixels, the prediction has 80, and 60 overlap.\n! Dice $= 2 \\times 60 / (80 + 100) = 0.667$. IoU (Jaccard) $= 60 / (80 + 100 - 60) = 0.5$.\n! They are monotonically related, $D = 2J/(1+J)$: $2 \\times 0.5 / 1.5 = 0.667$. Dice is always at least IoU, so do not compare a Dice number from one paper with an IoU number from another.\n\n## Evaluation\nReport mean IoU: build a $C \\times C$ confusion matrix over all pixels of the validation set, compute per class $\\text{IoU}_c = TP_c / (TP_c + FP_c + FN_c)$, then average over classes. Accumulating over the whole set (rather than averaging per-image IoUs) avoids undefined values on images where a class is absent; state which convention you use.\n\n> Takeaway: segmentation needs both context and resolution. Encoders provide context, skip connections restore spatial detail, and overlap-based losses like Dice keep tiny foreground classes from being drowned out by background.\n","q":"You train a U-Net to segment small lesions that cover about 0.3% of pixels, using pixel-wise cross-entropy. Validation pixel accuracy is 99.7%, but almost every predicted mask is empty. Explain why, and what you would change in the loss and the evaluation.","s":"Predicting background everywhere is already 99.7% accurate, and with plain cross-entropy the gradient is averaged over all pixels, so the few lesion pixels contribute almost nothing; the model settles at the trivial solution. Change the loss so overlap with the rare class drives training: add soft Dice loss (whose value ignores true-negative background pixels), or use class-weighted or focal cross-entropy, typically CE plus Dice. Sampling crops that contain lesions also raises the foreground fraction. Change evaluation from pixel accuracy to per-class IoU or Dice on the lesion class (and mIoU), accumulated over the validation set; an all-background predictor scores 0 there, which exposes the failure immediately.","r":[["U-Net (Ronneberger et al., 2015)","https://arxiv.org/abs/1505.04597","The original architecture; figure 1 is the canonical diagram and section 3 covers the overlap-tile and weighting tricks."],["Fully Convolutional Networks for Semantic Segmentation","https://arxiv.org/abs/1411.4038","How classifiers become dense predictors, and the skip-fusion idea U-Net builds on."],["V-Net (Milletari et al., 2016)","https://arxiv.org/abs/1606.04797","Introduced the soft Dice loss for volumetric medical segmentation; section 3 derives the gradient."],["Dive into Deep Learning: Fully Convolutional Networks","https://d2l.ai/chapter_computer-vision/fcn.html","Hands-on FCN with transposed-convolution upsampling."]],"k":["segmentation","U-Net","Dice"],"x":["NumPy"],"p":["tiny-u-net-forward-pass","u-net-skip-connection","dice-loss","mean-iou-for-segmentation","transposed-convolution"],"ak":""},{"id":"04.05","t":"Vision Transformers","n":["ViT cuts an image into non-overlapping patches (16×16 on a 224 image gives 196), flattens and linearly projects each one, and feeds the sequence to a standard transformer encoder.","The patch projection is exactly a convolution with kernel size and stride equal to the patch size.","A learned class token is prepended and its final state feeds the classifier; learned position embeddings are added because attention by itself ignores order. Changing resolution means interpolating them.","With weaker built-in assumptions than CNNs, ViTs need either very large pretraining sets or strong augmentation and distillation (DeiT) to match CNNs.","Global attention costs $O(N^2)$ in tokens. Swin restricts attention to 7×7 windows, shifts the windows every other layer, and merges patches between stages, giving linear cost and a CNN-like feature pyramid."],"a":"## Images as token sequences\nLesson 05.04 and the AI Engineering course cover how a transformer block works. The question here is narrower: how do you turn an image into the token sequence a transformer expects, and what changes because the tokens are patches rather than words?\n\nThe Vision Transformer (ViT, 2020) answer is blunt. Split a $224 \\times 224 \\times 3$ image into $16 \\times 16$ patches: $224/16 = 14$ per side, 196 patches, each with $16 \\times 16 \\times 3 = 768$ values. Flatten each patch and multiply by a learned $768 \\times D$ matrix. That linear map on non-overlapping patches is identical to a convolution with kernel size 16 and stride 16, and that is how it is usually implemented.\n\n%%flow ViT-B/16 input pipeline, shapes per image.\nImage 224×224×3 -(16×16 patches)-> 196 × 768 -(linear)-> 196 × D -(+ CLS, + positions)-> 197 × D -> *Encoder × 12 -(CLS state)-> Class head\n%%\n\n```python\nimport numpy as np\ndef patchify(img, p=16):                       # img: (H, W, C)\n    H, W, C = img.shape\n    x = img.reshape(H // p, p, W // p, p, C)   # split both spatial axes\n    x = x.transpose(0, 2, 1, 3, 4)             # (rows, cols, p, p, C)\n    return x.reshape(-1, p * p * C)            # (num_patches, p*p*C), row-major order\n```\n\nThe transpose is the important line: reshaping straight to `(-1, p*p*C)` would mix rows from different patches, the same class of silent bug as the HWC/CHW mix-up in lesson 04.01.\n\n## Class token and position embeddings\nViT prepends a learned vector, the class token, giving 197 tokens. After the last layer, the class token's state goes through a small head to produce logits. It works because the class token attends to every patch in every layer, so it can act as a learned pooling. Global average pooling over the patch tokens works about as well and is common in later models.\n\nSelf-attention is permutation-equivariant: shuffle the patches and the outputs shuffle the same way. Position information must be injected, and ViT adds a learned embedding per position (197 vectors of size $D$). Fixed 2-D sine-cosine embeddings, which encode row and column separately, perform similarly and need no training.\n\nLearned position embeddings tie the model to a grid size. Fine-tuning at 384×384 with the same patch size gives a 24×24 grid (576 patches) instead of 14×14. The standard fix is to reshape the 196 patch embeddings to a 14×14×$D$ grid, resize bilinearly or bicubically to 24×24, flatten, and keep the class token's embedding unchanged.\n\n## Data appetite and inductive bias\nA CNN builds in locality (small kernels) and translation equivariance (weight sharing). A ViT builds in very little: only the patch grid, and the MLP layers acting per token. It has to learn from data that nearby patches are related. The original paper found ViT trailed ResNets when trained on ImageNet-1k alone (1.3M images) and overtook them only with pretraining on 14M to 300M images. DeiT then showed a data-efficient recipe for ImageNet-1k alone: heavy augmentation (RandAugment, mixup, CutMix from lesson 04.01), stochastic depth, repeated augmentation, and distillation from a CNN teacher through an extra distillation token.\n\n| Model | Width $D$ | Layers | Heads | Params |\n| ViT-S/16 | 384 | 12 | 6 | 22M |\n| ViT-B/16 | 768 | 12 | 12 | 86M |\n| ViT-L/16 | 1024 | 24 | 16 | 307M |\n\n## Cost and windowed attention\nAttention cost grows with the square of the token count. Halving the patch size from 16 to 8 on a 224 image quadruples the tokens (196 to 784) and multiplies attention cost by 16. Dense tasks like detection and segmentation want high resolution and fine patches, so global attention becomes the bottleneck.\n\nThe Swin Transformer's fixes:\n- **Window attention**: tokens attend only within non-overlapping $M \\times M$ windows ($M = 7$, so 49 tokens), making cost linear in image area.\n- **Shifted windows**: every other layer shifts the window grid by $M/2$ so information crosses window borders; a cyclic shift plus a mask keeps the window count constant.\n- **Patch merging**: between stages, concatenate each 2×2 group of tokens and project, halving resolution and doubling channels. The four stages have strides 4, 8, 16 and 32, the same pyramid a ResNet provides, so Swin drops into FPN-based detectors and U-Net-style segmenters directly.\n\n! Example: global versus window attention at Swin's first stage\n! A 224 image with 4×4 patches gives a 56×56 grid, 3,136 tokens. Global attention scores $3136^2 \\approx 9.8$ million pairs per head per layer.\n! With 7×7 windows there are $8 \\times 8 = 64$ windows of 49 tokens: $64 \\times 49^2 = 153{,}664$ pairs, 64 times fewer. Doubling the image side multiplies the window cost by 4 but the global cost by 16.\n\n> Takeaway: a ViT is a standard transformer encoder on patch tokens, a class token and position embeddings. It trades CNN inductive bias for flexibility, so it needs data or strong regularisation, and windowed variants like Swin restore linear cost and a multi-scale pyramid for dense tasks.\n","q":"You have a ViT-B/16 pretrained at 224×224 and want to fine-tune it on 384×384 images. What breaks if you just feed the larger images, what do you change, and roughly how much more attention compute does each layer need?","s":"The patch embedding itself still works, since it is a stride-16 convolution, but the token count changes from 14×14 = 196 to 24×24 = 576 patches, and the learned position embedding table only has entries for 196 patch positions plus the class token, so the addition fails or misaligns. Fix it by reshaping the 196 patch position embeddings into a 14×14 grid, interpolating (bicubic) to 24×24, flattening, and keeping the class token's embedding as it is. Everything else (attention weights, MLPs) is resolution-agnostic. Attention cost scales with tokens squared: (577/197)² ≈ 8.6× per layer, while the MLP cost scales linearly, about 2.9×. Expect better accuracy from finer effective detail, at much higher memory and compute.","r":[["An Image is Worth 16x16 Words (Dosovitskiy et al., 2020)","https://arxiv.org/abs/2010.11929","The ViT paper; section 3.1 for the architecture and 3.2 for resolution changes and position-embedding interpolation."],["Training data-efficient image transformers (DeiT)","https://arxiv.org/abs/2012.12877","How to train ViTs on ImageNet-1k alone; the ablation table shows which augmentations matter."],["Swin Transformer (Liu et al., 2021)","https://arxiv.org/abs/2103.14030","Shifted-window attention and patch merging; figure 2 explains the shift."],["Dive into Deep Learning: Transformers for Vision","https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html","Compact ViT implementation from patch embedding to classifier."]],"k":["vision transformer","patch embedding"],"x":["NumPy","PyTorch"],"p":["vit-patchify","vision-transformer-patch-embedding","2d-sinusoidal-positional-embedding","window-partition-and-reverse","vit-multi-head-self-attention"],"ak":""}]},{"n":"05","name":"Sequence models","lessons":[{"id":"05.01","t":"Recurrent networks","n":["An RNN applies the same cell at every time step, carrying a hidden state: $h_t = \\tanh(W_{xh}x_t + W_{hh}h_{t-1} + b)$. Weight sharing over time lets one model handle any sequence length.","Unrolled over $T$ steps, an RNN is a $T$-layer deep network with tied weights. Backprop through time (BPTT) is ordinary backprop on that unrolled graph, with gradients for the shared weights summed over steps.","The gradient from step $t$ to step $k$ is a product of $t-k$ Jacobians. If their norms sit below 1 the signal vanishes exponentially; above 1 it explodes.","Clip gradients by global norm to tame explosions; use gated cells (next lesson) to fight vanishing; use truncated BPTT to bound memory on long sequences.","Recurrence is inherently sequential in time, which is the main reason transformers replaced RNNs for training on large datasets."],"a":"## Why sequences need their own architecture\nThis module covers models that read ordered data: text, audio, sensor streams, event logs. An MLP needs a fixed input size and treats position 3 and position 30 as unrelated features. A sequence model should handle any length and reuse what it learns about a pattern wherever the pattern occurs. Recurrent networks do this by sharing weights across time. Later lessons add gates (05.02), attention between two sequences (05.03), and finally replace recurrence with attention altogether (05.04). The NLP module that follows uses all of these.\n\n## The RNN cell\nAt each step the cell combines the current input $x_t \\in \\mathbb{R}^d$ with the previous hidden state $h_{t-1} \\in \\mathbb{R}^H$:\n\n$$h_t = \\tanh(W_{xh} x_t + W_{hh} h_{t-1} + b_h), \\qquad y_t = W_{hy} h_t + b_y$$\n\nThe same $W_{xh}$ ($H \\times d$), $W_{hh}$ ($H \\times H$) and $b_h$ are used at every step, so the cell has $H(d + H + 1)$ parameters regardless of length. With $d = 128$ and $H = 256$ that is 98,560. The hidden state is the network's entire memory of the past: a fixed-size summary it must keep updating.\n\n```python\nimport numpy as np\ndef rnn_forward(X, Wxh, Whh, b, h0):       # X: (T, B, d)\n    h, hs = h0, []                          # h: (B, H)\n    for x in X:                             # strictly one step after another\n        h = np.tanh(x @ Wxh.T + h @ Whh.T + b)\n        hs.append(h)\n    return np.stack(hs)                     # (T, B, H)\n```\n\nFor batches of different-length sequences, pad to the longest and mask: padded steps must not update the hidden state that later steps or the loss rely on, and padded outputs must be excluded from the loss. PyTorch's packed sequences do this by skipping padded steps entirely.\n\n## Backpropagation through time\nUnroll the loop and you have a $T$-layer feed-forward network whose layers share weights. BPTT is backprop on that graph. Because $W_{hh}$ appears at every step, its gradient is the sum of the contributions from every step.\n\n%%flow The unrolled RNN. Forward runs left to right; the gradient of a late loss must travel back through every intermediate state.\n[Forward] h0 -(x1)-> h1 -(x2)-> h2 -(x3)-> h3 -(x4)-> *h4 -> Loss\n[Backward] Loss -> *dL/dh4 -(× J4)-> dL/dh3 -(× J3)-> dL/dh2 -(× J2)-> dL/dh1\n%%\n\nEach backward hop multiplies by the step Jacobian $J_i = \\partial h_i / \\partial h_{i-1} = \\text{diag}(1 - h_i^2)\\, W_{hh}$. So the gradient that a loss at step $t$ sends to the state at step $k$ is\n\n$$\\frac{\\partial h_t}{\\partial h_k} = \\prod_{i=k+1}^{t} \\text{diag}(1 - h_i^2)\\, W_{hh}$$\n\nMemory is the other cost: BPTT must store every hidden state from the forward pass, so activation memory grows linearly in $T$.\n\n## Vanishing and exploding gradients\nThe product of $t - k$ matrices behaves roughly like the largest singular value raised to the power $t-k$. The tanh derivative $1 - h^2$ is at most 1 and often much smaller, which pushes toward vanishing.\n\n! Example: what 50 steps does to a gradient\n! If each step scales the gradient by 0.9, after 50 steps it is $0.9^{50} \\approx 0.005$: the loss barely affects what happened 50 steps earlier.\n! If each step scales it by 1.1, it is $1.1^{50} \\approx 117$, and a slightly larger spectral radius gives inf or NaN.\n! A plain RNN in practice learns dependencies of about 10 to 20 steps, not hundreds.\n\nVanishing is silent: training runs, loss falls, and the model just never learns long-range structure. Exploding is loud: loss spikes or becomes NaN. The fixes differ:\n- **Gradient clipping** for explosions. Compute the global norm over all parameter gradients and, if it exceeds a threshold (commonly 1 or 5), rescale all of them by threshold / norm. Direction is kept, step size bounded.\n- **Gated cells** (LSTM, GRU) for vanishing: they add a path through time that is not multiplied by $W_{hh}$ at every step.\n- **Initialisation**: orthogonal $W_{hh}$ starts with all singular values at 1, which delays both problems.\n\n## Truncated BPTT\nFor long streams (a book, a year of sensor data) you cannot backprop through the entire history. Truncated BPTT splits the stream into chunks of $k$ steps (e.g. 35 or 128). The hidden state is carried from one chunk to the next, but detached, so gradients stop at the chunk boundary.\n\n```python\nh = h0\nfor chunk in chunks(stream, k=128):\n    out, h = rnn(chunk, h)\n    loss = criterion(out, targets_for(chunk))\n    loss.backward(); clip_grad_norm_(params, 1.0); opt.step(); opt.zero_grad()\n    h = h.detach()                       # keep the state, drop the graph\n```\n\nThe model still sees information from earlier chunks through $h$, but it is never trained by gradient to put information into $h$ for use more than $k$ steps later.\n\n## The sequential bottleneck\nStep $t$ cannot start until step $t-1$ finishes, so a 1,000-step sequence is 1,000 dependent matrix multiplies, regardless of how many GPU cores are idle. Batching across sequences helps, but not across time. This is the main reason transformers, which process all positions of a training sequence in parallel, took over (lesson 05.04). RNNs remain useful for streaming inference with constant memory per step, and modern state-space models revive the recurrent form for exactly that.\n\n> Takeaway: an RNN is a deep network unrolled in time with shared weights. Gradients through it are products of Jacobians, so they vanish or explode with distance; clip for explosions, gate for vanishing, truncate for memory.\n","q":"You train a character-level RNN with truncated BPTT, chunk length k = 35, carrying the hidden state across chunks. Can the model use information from 100 characters back? Explain what the truncation does and does not prevent.","s":"It can use such information only by accident, not by design. Truncation stops gradients at chunk boundaries, so no loss term ever adjusts the weights to store information in h for longer than 35 steps; the model is never trained to keep a fact for 100 characters. But the forward pass does carry h across boundaries, so whatever the network has learned to keep for short-range reasons (for example 'inside a quotation', or the current topic) persists and can influence predictions far later. So dependencies longer than k are not impossible, just not directly learnable. To learn them you need longer chunks (more memory), a gated cell whose state decays slowly, or an architecture with direct access to earlier positions, such as attention.","r":[["Dive into Deep Learning: Recurrent Neural Networks","https://d2l.ai/chapter_recurrent-neural-networks/rnn.html","The RNN cell with runnable code and shapes."],["Dive into Deep Learning: Backpropagation Through Time","https://d2l.ai/chapter_recurrent-neural-networks/bptt.html","Derives the Jacobian product and compares full, truncated and randomised truncation."],["On the difficulty of training Recurrent Neural Networks (Pascanu et al., 2012)","https://arxiv.org/abs/1211.5063","The analysis of vanishing and exploding gradients and the case for norm clipping."],["The Unreasonable Effectiveness of Recurrent Neural Networks (Karpathy)","https://karpathy.github.io/2015/05/21/rnn-effectiveness/","Character-level RNNs in practice, with visualisations of what hidden units track."]],"k":["RNN","BPTT","vanishing gradients"],"x":["NumPy","PyTorch"],"p":["vanilla-rnn-cell","rnn-cell","language-modeling","gradient-clipping-global-norm-rescaling"],"ak":""},{"id":"05.02","t":"LSTMs and GRUs","n":["An LSTM keeps a separate cell state updated additively: $c_t = f_t \\odot c_{t-1} + i_t \\odot g_t$. Gradients along $c$ are scaled by the forget gate, not by a repeated weight matrix, so they survive when $f_t \\approx 1$.","Gates are sigmoids in $(0, 1)$ computed from $x_t$ and $h_{t-1}$: forget ($f$), input ($i$), output ($o$), plus a tanh candidate $g$. An LSTM has 4× the parameters of a plain RNN of the same width.","Initialise the forget-gate bias to about 1 so the cell starts out remembering; at zero it starts out forgetting half its state every step.","A GRU merges cell and hidden state and uses two gates (update, reset): 3× the RNN's parameters, usually similar accuracy. Watch the convention for which side of the interpolation $z$ multiplies.","In large comparisons, the forget gate and the output activation matter most; most other LSTM variants make little difference."],"a":"## The fix for vanishing gradients\nThe previous lesson showed that in a plain RNN the gradient across $n$ steps is a product of $n$ Jacobians, each containing $W_{hh}$ and a tanh derivative, so it decays or blows up exponentially. The LSTM (Hochreiter and Schmidhuber, 1997; forget gate added by Gers et al., 2000) adds a second state, the cell $c_t$, whose update is mostly additive. That changes the gradient path from a matrix product into an elementwise product of gate values that the network can choose to keep near 1.\n\n## LSTM equations\nWith $[h_{t-1}, x_t]$ the concatenation of the previous hidden state and the input, and $\\sigma$ the sigmoid:\n\n$$f_t = \\sigma(W_f [h_{t-1}, x_t] + b_f), \\quad i_t = \\sigma(W_i [h_{t-1}, x_t] + b_i), \\quad o_t = \\sigma(W_o [h_{t-1}, x_t] + b_o)$$\n\n$$g_t = \\tanh(W_g [h_{t-1}, x_t] + b_g), \\quad c_t = f_t \\odot c_{t-1} + i_t \\odot g_t, \\quad h_t = o_t \\odot \\tanh(c_t)$$\n\n- The **forget gate** $f$ decides what fraction of each cell unit to keep.\n- The **input gate** $i$ decides how much of the new candidate $g$ to write.\n- The **output gate** $o$ decides how much of the cell to expose as $h_t$, which is what the next layer and the next step's gates see.\n\n%%flow The cell-state path through one LSTM step. Nothing on it multiplies by a weight matrix.\nc(t-1) -(× forget gate)-> kept memory -(+ input gate × candidate)-> *c(t) -(tanh, × output gate)-> h(t)\n%%\n\nAlong this path, $\\partial c_t / \\partial c_{t-1} = \\text{diag}(f_t)$ (plus smaller terms through the gates). If the network learns $f \\approx 1$ for a unit, the gradient flows back through hundreds of steps almost unchanged. Hochreiter called this the constant error carousel. The same idea, an identity-like additive path, reappears in ResNets (module 03) and in the residual stream of transformers.\n\n```python\nimport numpy as np\nsig = lambda z: 1 / (1 + np.exp(-z))\ndef lstm_step(x, h, c, W, b):             # W: (4H, d+H), rows in order i, f, g, o\n    z = W @ np.concatenate([x, h]) + b\n    i, f, g, o = np.split(z, 4)\n    c = sig(f) * c + sig(i) * np.tanh(g)\n    h = sig(o) * np.tanh(c)\n    return h, c\n```\n\nPyTorch stacks the four blocks of `weight_ih_l0` in the order input, forget, cell (candidate), output, and keeps two bias vectors (`bias_ih` and `bias_hh`) that are simply added. Loading weights from another framework with a different gate order is a classic silent bug.\n\n## Forget-gate bias\nAt initialisation with zero bias, $f_t \\approx \\sigma(0) = 0.5$: every unit halves its memory each step, so after 10 steps only $0.5^{10} \\approx 0.001$ of the original remains. The gradient path the LSTM was designed to provide is closed until training opens it. Setting $b_f \\approx 1$ gives $f \\approx 0.73$ at the start, and many implementations go higher. Setting it strongly negative would make the LSTM behave like a forgetful plain RNN.\n\n! Example: parameter counts for one layer\n! Input $d = 300$ (word vectors), hidden $H = 512$.\n! Plain RNN: $512 \\times (300 + 512 + 1) = 416{,}256$.\n! LSTM: $4 \\times 416{,}256 = 1{,}665{,}024$ (PyTorch's two bias vectors add another 2,048).\n! GRU: $3 \\times 416{,}256 = 1{,}248{,}768$, a quarter fewer than the LSTM.\n\n## The GRU\nThe gated recurrent unit (Cho et al., 2014) has no separate cell. An update gate $z$ interpolates between the old state and a candidate; a reset gate $r$ controls how much of the old state the candidate may read:\n\n$$r_t = \\sigma(W_r x_t + U_r h_{t-1}), \\quad z_t = \\sigma(W_z x_t + U_z h_{t-1})$$\n\n$$n_t = \\tanh(W_n x_t + r_t \\odot (U_n h_{t-1})), \\quad h_t = (1 - z_t) \\odot n_t + z_t \\odot h_{t-1}$$\n\nIn this convention (Cho's and PyTorch's), $z \\approx 1$ keeps the old state. Some textbooks swap $z$ and $1 - z$; check before porting weights. The interpolation is again an additive path, so the GRU fights vanishing gradients for the same reason as the LSTM.\n\n| | Plain RNN | LSTM | GRU |\n| States | $h$ | $h$ and $c$ | $h$ |\n| Gates | none | forget, input, output | update, reset |\n| Parameters (relative) | 1× | 4× | 3× |\n| Long-range memory | poor (about 10-20 steps) | good | good |\n\n## Practical choices\n- **Which cell?** Greff et al. (2015) compared eight LSTM variants over thousands of runs: none beat the standard LSTM significantly, and removing the forget gate or the output activation hurt most. GRUs perform comparably on most tasks; pick the GRU when parameters or speed matter.\n- **Stacking**: 2 to 4 layers are typical, with dropout between layers (not on the recurrent connection, unless you use the same mask at every step).\n- **Bidirectional**: run one LSTM forward and one backward and concatenate their states. Each position then sees both past and future, which is right for tagging (06.05) and encoding (05.03), and wrong for generation, which must not see the future.\n- **Gradient clipping** is still needed; gates mitigate vanishing, not exploding.\n\n> Takeaway: gates give recurrent networks an additive memory path whose gradient is scaled by learned gate values instead of a repeated weight matrix. LSTMs and GRUs differ in bookkeeping, not in principle; initialise the forget gate to remember.\n","q":"Why does initialising the LSTM forget-gate bias to 1 help early training, and what would you expect if it were initialised to -3 instead?","s":"With bias 0 the forget gate starts at about 0.5, so each cell unit loses half its content per step and the gradient along the cell path also shrinks by half per step; information and credit vanish over about 10 steps, exactly the plain-RNN problem the LSTM was meant to avoid, and the network must first learn to open the gate before it can learn long dependencies. Bias 1 gives f ≈ 0.73 initially (higher bias gives more), so memory and gradients persist much longer from the first update, and the model can discover long-range patterns early. With bias -3, f ≈ 0.05: the cell is wiped almost completely every step, the gradient along c is multiplied by about 0.05 per step, and the LSTM behaves like a memoryless RNN until (and unless) training drives the bias up.","r":[["Understanding LSTM Networks (Olah, 2015)","https://colah.github.io/posts/2015-08-Understanding-LSTMs/","The standard visual walkthrough of each gate, plus GRU and peephole variants."],["Learning Phrase Representations using RNN Encoder-Decoder (Cho et al., 2014)","https://arxiv.org/abs/1406.1078","Introduces the GRU (section 2.3) alongside the encoder-decoder."],["LSTM: A Search Space Odyssey (Greff et al., 2015)","https://arxiv.org/abs/1503.04069","Large ablation of LSTM variants; read the conclusions on which components matter."],["PyTorch nn.LSTM","https://pytorch.org/docs/stable/generated/torch.nn.LSTM.html","Exact equations, gate order and weight shapes used by PyTorch."]],"k":["LSTM","GRU","gating"],"x":["NumPy","PyTorch"],"p":["lstm-cell","gru-cell","lstm-cell-2"],"ak":""},{"id":"05.03","t":"Sequence-to-sequence and attention","n":["An encoder-decoder maps an input sequence to an output sequence of a different length: the encoder reads the source, the decoder generates the target one token at a time conditioned on it.","Without attention, everything about the source must pass through one fixed-size vector, and quality drops sharply on long inputs.","Attention lets each decoder step compute a weighted average of all encoder states, with weights from a learned score between the decoder state and each encoder state.","Additive (Bahdanau) attention scores with a small MLP, $v^\\top \\tanh(W_s s + W_h h_i)$; multiplicative (Luong) attention uses $s^\\top W h_i$ or a plain dot product, which is cheaper and is what transformers scale up.","Training uses teacher forcing (feed the true previous token); inference feeds the model's own predictions. Mask padded source positions before the softmax."],"a":"## Mapping one sequence to another\nTranslation, summarisation, speech recognition and code generation all map an input sequence to an output sequence whose length differs and is not known in advance. The sequence-to-sequence architecture (Sutskever et al., 2014; Cho et al., 2014) handles this with two recurrent networks:\n- The **encoder** reads the source $x_1, \\dots, x_S$ and produces hidden states $h_1, \\dots, h_S$.\n- The **decoder** is a language model over the target that is conditioned on the source. It starts from a summary of the encoder and emits $y_1, y_2, \\dots$ until it produces an end token.\n\nIn the original form the conditioning is just the encoder's final state, used to initialise the decoder. Sutskever et al. reached strong translation results with 4-layer LSTMs and one surprising trick: reversing the source sentence, which puts the first source words close to the first target words and shortens the gradient path between them.\n\n## Teacher forcing and exposure bias\nDuring training the decoder at step $t$ receives the true previous token $y_{t-1}$, not its own prediction. This is teacher forcing: every step's loss is computed in parallel from ground truth inputs, and training is stable. At inference there is no ground truth, so the decoder consumes its own outputs, and an early mistake puts it in states it never saw during training. The mismatch is called exposure bias. Mitigations include scheduled sampling (sometimes feeding model predictions during training) and better search at decoding time (lesson 06.07).\n\n## The bottleneck\nCompressing a 50-word sentence into one 1,000-dimensional vector loses information, and the encoder's early states have the longest path to the decoder's outputs. Bahdanau et al. (2014) showed that BLEU for a basic encoder-decoder falls steeply as sentence length grows past about 30 words, while their attention model stays roughly flat.\n\n## Attention: a soft lookup into the source\nInstead of one summary, keep all encoder states and let each decoder step choose what to read. At step $t$, with decoder state $s_{t-1}$:\n\n$$e_{t,i} = \\text{score}(s_{t-1}, h_i), \\qquad \\alpha_{t,i} = \\frac{\\exp(e_{t,i})}{\\sum_j \\exp(e_{t,j})}, \\qquad c_t = \\sum_i \\alpha_{t,i}\\, h_i$$\n\nThe context vector $c_t$ is fed into the decoder along with the previous token, and the decoder produces $s_t$ and the next-token distribution.\n\n%%seq One decoder step with attention over the encoder states.\nDecoder > Attention: query s(t-1)\nAttention > Encoder states: score every h(i)\nEncoder states -> Attention: softmax weights α(t,i)\nAttention -> Decoder: context c(t) = Σ α h\nDecoder > Decoder: update state, emit y(t)\n%%\n\nScore functions:\n- **Additive** (Bahdanau): $\\text{score}(s, h) = v^\\top \\tanh(W_s s + W_h h)$, a one-hidden-layer MLP. Works well when $s$ and $h$ have different sizes.\n- **General / bilinear** (Luong): $s^\\top W h$.\n- **Dot** (Luong): $s^\\top h$. No parameters, and it turns a whole step into one matrix multiply. Scaled by $1/\\sqrt{d}$, this is the scaled dot-product attention of transformers.\n\nBahdanau used a bidirectional encoder so each $h_i$ summarises context on both sides of source word $i$, and scored with the previous decoder state $s_{t-1}$; Luong scored with the current state $s_t$. The differences are small in practice.\n\n```python\nimport numpy as np\ndef additive_attention(s, H, Ws, Wh, v, mask):   # s: (D,), H: (S, E), mask: (S,) bool\n    e = np.tanh(H @ Wh.T + Ws @ s) @ v            # (S,) one score per source position\n    e = np.where(mask, e, -np.inf)                # padded positions get zero weight\n    a = np.exp(e - e.max()); a /= a.sum()\n    return a @ H, a                               # context (E,), weights (S,)\n```\n\n! Example: three attention weights by hand\n! Scores for three source words: $e = (2.0, 0.5, -1.0)$.\n! Exponentials: $7.389, 1.649, 0.368$, total $9.406$. Weights: $\\alpha = (0.786, 0.175, 0.039)$.\n! The context vector is 79% the first encoder state. If a fourth position were padding and not masked, it would steal weight from real words.\n\n## What attention changes\n- **Gradient path**: the decoder's loss at step $t$ reaches encoder state $h_i$ directly through $\\alpha_{t,i}$, in one hop, instead of through every intervening recurrent step.\n- **Interpretability**: the matrix of $\\alpha_{t,i}$ is a soft alignment; in translation it is roughly diagonal, with visible reorderings such as adjective-noun swaps between English and French.\n- **Cost**: computing all weights is $O(S \\cdot T)$ for source length $S$ and target length $T$, negligible next to the recurrent work at these lengths.\n\nOnce every decoder step can look anywhere in the source, the next question is why the encoder and decoder need recurrence at all. If each position can attend to every other position, including within the same sequence, the sequential loop can go. That is the transformer, next lesson.\n\n> Takeaway: seq2seq models separate reading from writing. Attention replaces a single fixed-size summary with a learned, per-step weighted average of all encoder states, removing the length bottleneck and giving gradients a one-hop path to every source position.\n","q":"A seq2seq LSTM translator without attention handles 10-word sentences well but produces poor translations for 50-word sentences. Explain the failure mechanistically, and explain what attention changes in both the forward pass and the backward pass.","s":"Forward: the decoder sees the source only through the encoder's final state, a fixed-size vector. A 10-word sentence fits; a 50-word sentence must be compressed into the same capacity, so details, especially from early words that have been overwritten by many updates, are lost. Backward: the loss at an early target word must reach the corresponding early source word through roughly 50 encoder steps plus the decoder steps, and the gradient weakens over that path, so the alignment is hard to learn. With attention, each decoder step reads a weighted average of all encoder states, so capacity grows with source length and the decoder can attend to whichever word it needs. The gradient reaches each encoder state directly through its attention weight, so the path length no longer depends on the distance between source and target positions.","r":[["Sequence to Sequence Learning with Neural Networks (Sutskever et al., 2014)","https://arxiv.org/abs/1409.3215","The encoder-decoder LSTM and the source-reversal trick."],["Neural Machine Translation by Jointly Learning to Align and Translate (Bahdanau et al., 2014)","https://arxiv.org/abs/1409.0473","Additive attention; figure 2 shows the length-robustness result."],["Effective Approaches to Attention-based NMT (Luong et al., 2015)","https://arxiv.org/abs/1508.04025","Dot, general and concat scores, and global versus local attention."],["Dive into Deep Learning: Bahdanau Attention","https://d2l.ai/chapter_attention-mechanisms-and-transformers/bahdanau-attention.html","Runnable encoder-decoder with additive attention."]],"k":["seq2seq","attention"],"x":["NumPy","PyTorch"],"p":["sequence-to-sequence-forward-pass","attention-mechanism","scaled-dot-product-attention"],"ak":""},{"id":"05.04","t":"Transformers for sequences","n":["A transformer drops recurrence: self-attention connects every pair of positions in one step, so a whole training sequence is processed in parallel at $O(T^2)$ attention cost.","An encoder block is self-attention plus a position-wise MLP, each wrapped in a residual connection and layer norm. A decoder block adds a causal mask and a cross-attention sublayer that reads the encoder's output.","Pre-LN (normalise before each sublayer) trains stably without long warmup; the original post-LN layout normalises after the residual add and is fragile when deep.","Attention is permutation-equivariant, so order must be injected. Sinusoidal and learned embeddings are added to the inputs; rotary embeddings (RoPE) rotate queries and keys so that attention scores depend on the relative offset.","Three families follow from which blocks you keep: encoder-only (BERT), decoder-only (GPT), encoder-decoder (T5, the original transformer)."],"a":"## From attention-plus-RNN to attention only\nLesson 05.03 ended with a decoder attending over encoder states. The transformer (Vaswani et al., 2017) asks every position in a sequence to attend to every other position in the same sequence (self-attention), and removes the recurrent loop entirely. Two consequences:\n- **Parallel training**: all $T$ positions are computed at once with matrix multiplies, instead of $T$ dependent steps. This is why transformers scale to large datasets.\n- **Constant path length**: any two positions interact within one layer, compared with $O(T)$ steps in an RNN. The price is $O(T^2)$ attention compute and memory per layer.\n\nThis lesson stays at block level. For the mechanics of queries, keys, values, multi-head attention and shape tracing, see the AI Engineering course (LLM internals and the transformer walkthrough), and the AI Research course for building GPT from scratch.\n\n## Encoder and decoder blocks\nAn **encoder block** has two sublayers, each wrapped as $x + \\text{Sublayer}(\\text{LN}(x))$ in the pre-LN layout:\n1. Multi-head self-attention, every position attending to every non-padding position.\n2. A position-wise feed-forward network, typically $D \\to 4D \\to D$ with GELU or a gated variant.\n\nA **decoder block** has three:\n1. Masked self-attention: a causal mask sets scores for future positions to $-\\infty$, so position $t$ sees only positions up to $t$. This is what makes teacher-forced training parallel: all target positions are predicted at once without peeking.\n2. Cross-attention: queries come from the decoder, keys and values from the final encoder output. This is exactly the seq2seq attention of the previous lesson.\n3. The feed-forward network.\n\n%%flow Original encoder-decoder transformer, one block of each. Every sublayer has a residual connection and layer norm.\n[Encoder block] Source tokens -> *Self-attention -> Feed-forward -> Encoder output\n[Decoder block] Target so far -> *Masked self-attention -(K, V from encoder)-> Cross-attention -> Feed-forward -> Next-token logits\n%%\n\n**Pre-LN vs post-LN.** The 2017 paper used post-LN, $\\text{LN}(x + \\text{Sublayer}(x))$. Xiong et al. (2020) showed that post-LN produces large gradients near the output at initialisation, which is why it needs a careful learning-rate warmup and becomes unstable when deep. Pre-LN keeps an un-normalised residual stream from input to output and trains reliably; almost all large models use it, with a final layer norm before the output head.\n\n## Three families\n\n| Family | Blocks | Attention | Typical use |\n| Encoder-only | encoder | bidirectional | classification, tagging, retrieval (BERT, lesson 06.06) |\n| Decoder-only | decoder without cross-attention | causal | generation, chat (GPT and most LLMs) |\n| Encoder-decoder | both | bidirectional encoder, causal decoder | translation, summarisation (T5, original transformer) |\n\n## Giving attention a sense of order\nSelf-attention treats its input as a set: permute the tokens and the outputs are permuted identically. Without position information, \"dog bites man\" and \"man bites dog\" look the same.\n\n- **Sinusoidal** (original): add a fixed vector with $PE_{(p, 2i)} = \\sin(p / 10000^{2i/D})$ and $PE_{(p, 2i+1)} = \\cos(p / 10000^{2i/D})$ to each token embedding. Different dimensions oscillate at geometrically spaced frequencies.\n- **Learned absolute**: a trainable embedding per position (BERT, GPT-2, ViT). Simple, but undefined beyond the trained length.\n- **Rotary (RoPE)**: instead of adding anything to the residual stream, rotate each query and key. Split a $d$-dimensional head vector into $d/2$ pairs; rotate pair $i$ at position $m$ by angle $m\\theta_i$ with $\\theta_i = 10000^{-2i/d}$.\n\nThe point of RoPE is that rotations compose. If $q$ is rotated by $m\\theta$ and $k$ by $n\\theta$, their dot product equals the dot product of the unrotated vectors with one of them rotated by $(m - n)\\theta$. Attention scores therefore depend on content and relative offset only, and the same offset means the same thing anywhere in the sequence. Values are not rotated, so the information moved by attention is position-free. RoPE is the default in most current LLMs (the Inference Engineering course covers fusing it into kernels).\n\n```python\nimport numpy as np\ndef rope(x, pos, base=10000.0):           # x: (T, d) queries or keys, d even\n    d = x.shape[-1]\n    theta = base ** (-np.arange(0, d, 2) / d)          # (d/2,)\n    ang = pos[:, None] * theta[None, :]                # (T, d/2)\n    cos, sin = np.cos(ang), np.sin(ang)\n    x1, x2 = x[:, 0::2], x[:, 1::2]                    # interleaved pairs\n    out = np.empty_like(x)\n    out[:, 0::2] = x1 * cos - x2 * sin\n    out[:, 1::2] = x1 * sin + x2 * cos\n    return out\n```\n\nTwo layouts exist: interleaved pairs (as above, the original paper) and split halves (first half paired with second half, used by many Hugging Face models). Weights trained with one layout give garbage with the other.\n\n! Example: RoPE depends only on the offset\n! One 2-D pair, $\\theta = 0.5$. Query $q = (1, 0)$ at position 3 is rotated by 1.5 rad to $(0.071, 0.997)$. Key $k = (1, 0)$ at position 1 is rotated by 0.5 rad to $(0.878, 0.479)$.\n! Dot product: $0.071 \\times 0.878 + 0.997 \\times 0.479 = 0.540 = \\cos(1.0)$.\n! Move both to positions 10 and 8: angles 5.0 and 4.0, dot product $\\cos(1.0) = 0.540$ again. Same offset, same score.\n\n## What changes in practice\nTraining is parallel, but generation is still one token at a time; the KV cache that makes that efficient is covered in the Inference Engineering course. Length generalisation is the weak spot: models trained on 4k tokens degrade beyond that, and RoPE-scaling methods (position interpolation, NTK-aware scaling) stretch the angles so longer contexts map into the trained range.\n\n> Takeaway: a transformer is a stack of residual blocks of attention and feed-forward layers, with masks deciding who sees whom and a position scheme supplying order. RoPE encodes position by rotating queries and keys, so attention depends on relative distance.\n","q":"RoPE is applied to queries and keys but not to values, and not added to the token embeddings like sinusoidal encodings. Why is that design chosen, and what would be lost if you instead added the rotation result to the input embeddings once at the bottom of the network?","s":"Rotating q and k makes each attention score a function of content and the relative offset m - n, because the two rotations combine into a single rotation by the difference. That gives every layer a clean relative-position signal exactly where it is used, in the scores. Values are left unrotated so the information attention moves between positions is not tagged with an absolute position, and the residual stream stays position-free. If you added a positional vector to the input embeddings once, position would be mixed into the content representation, would have to survive many layers of updates, and the dot product between two such vectors contains content-position cross terms that depend on absolute positions, not just their difference. You would lose the exact relative-offset property and get weaker length generalisation.","r":[["Attention Is All You Need (Vaswani et al., 2017)","https://arxiv.org/abs/1706.03762","The original encoder-decoder transformer; section 3 for blocks and 3.5 for sinusoidal positions."],["RoFormer: Enhanced Transformer with Rotary Position Embedding","https://arxiv.org/abs/2104.09864","Derivation of RoPE and its relative-position property, section 3.4."],["The Annotated Transformer (Harvard NLP)","https://nlp.seas.harvard.edu/annotated-transformer/","Line-by-line PyTorch implementation of the full encoder-decoder."],["On Layer Normalization in the Transformer Architecture (Xiong et al., 2020)","https://arxiv.org/abs/2002.04745","Why post-LN needs warmup and pre-LN does not."]],"k":["transformer","positional encoding","RoPE"],"x":["NumPy","PyTorch"],"p":["transformer-encoder-block","transformer-decoder-block","rotary-position-embedding-rope","sinusoidal-positional-encoding","masked-causal-attention"],"ak":""}]},{"n":"06","name":"Natural language processing","lessons":[{"id":"06.01","t":"Text preprocessing and tokenisation","n":["Every NLP model starts by mapping text to integer ids: normalise, pre-tokenise, split into subwords, look up ids. Each step is a modelling decision, and the model is tied to exactly the pipeline it was trained with.","Unicode normalisation (NFC, NFKC) makes visually identical strings byte-identical; case-folding and accent stripping are lossy choices that some tasks want and others do not.","Sentence splitting on '.' fails on abbreviations, decimals and initials. Use rules with exception lists or a trained splitter, and test on your own domain.","Subword tokenisers sit between words (huge vocabularies, unknown words) and characters (very long sequences). BPE learns merges by pair frequency; WordPiece encodes by greedy longest match with '##' continuations.","Byte-level BPE starts from the 256 byte values, so any string can be encoded and there is no unknown token."],"a":"## Where this module sits\nModule 05 built the architectures that read sequences. This module is about text specifically: how raw strings become token ids, the classical counting models that still serve as baselines and features, word embeddings, token-level tasks, pretrained encoders, and how generated text is decoded and scored. It ends where the AI Engineering and AI Research courses pick up with large language models.\n\n%%flow Each stage is a choice the model is then locked into: the same text must go through the same stages at training and serving time.\nRaw text -(NFKC, lowercase?)-> Normalised -(regex split)-> Pre-tokens -(BPE / WordPiece)-> *Subwords -(vocab lookup)-> Ids + offsets\n%%\n\n## Normalisation\nUnicode allows the same visible text to have several byte sequences. \"é\" can be one code point (U+00E9) or \"e\" followed by a combining accent (U+0065 U+0301). NFC composes these into a canonical form; NFKC additionally folds compatibility characters, so the ligature \"ﬁ\" becomes \"fi\" and full-width \"Ａ\" becomes \"A\". Without normalisation the same word gets different ids depending on which keyboard or PDF extractor produced it.\n\nOther common steps, each with a cost:\n- **Lowercasing** merges \"Apple\" and \"apple\": good for small-data classifiers, bad for named-entity recognition, where case is a strong signal. BERT ships both cased and uncased models for this reason.\n- **Accent stripping** helps English search, hurts French and Vietnamese.\n- **Whitespace and control characters**: collapse runs of spaces, remove zero-width characters, normalise line endings.\n\n```python\nimport unicodedata, re\ndef normalise(s):\n    s = unicodedata.normalize(\"NFKC\", s)\n    s = re.sub(r\"[\\u200b\\u200c\\u200d\\ufeff]\", \"\", s)   # zero-width characters\n    return re.sub(r\"\\s+\", \" \", s).strip()\n```\n\n## Regular expressions and pre-tokenisation\nBefore subword splitting, most tokenisers pre-split text into words, numbers and punctuation with a regex, so merges never cross a word boundary. GPT-2's pattern, for instance, separates contractions (\"'s\", \"'re\"), runs of letters, runs of digits and runs of other symbols, and keeps a leading space attached to the word. Regexes are also the workhorse for extracting URLs, e-mail addresses, mentions and hashtags before they are mangled by later steps.\n\nTwo failure modes to know: greedy quantifiers that swallow too much (`.+` vs `.+?`), and nested quantifiers like `(a+)+` that cause catastrophic backtracking on adversarial input, which can hang a server.\n\n## Sentence splitting\n\"Splitting on full stops\" breaks on \"Dr. Smith\", \"3.14\", \"U.S. troops\" and \"e.g. this\". Practical splitters combine rules (a full stop followed by whitespace and a capital letter is a candidate boundary) with exception lists of abbreviations, or learn abbreviations from unlabelled text, as the Punkt algorithm does. Domain matters: legal text, chat messages and clinical notes all break general-purpose splitters in different ways, so evaluate on a sample of your own data.\n\n## Why subwords\nA word-level vocabulary for English web text needs millions of entries to cover names, typos and inflections, and anything unseen becomes `[UNK]`. A character-level model has no unknowns but makes sequences about 4-5× longer, which hurts attention cost (quadratic in length) and makes the model learn spelling from scratch. Subword vocabularies of 30k to 100k units give frequent words a single token and split rare words into meaningful pieces. English text averages about 4 characters, or roughly 0.75 words, per token with typical LLM tokenisers.\n\n## BPE and WordPiece\n**Byte-pair encoding** (Sennrich et al., 2016) learns a merge list from a corpus:\n1. Start with each word as a sequence of characters (or bytes), with word counts.\n2. Count every adjacent symbol pair, weighted by word frequency.\n3. Merge the most frequent pair into a new symbol, record the merge.\n4. Repeat until the vocabulary reaches the target size.\n\nEncoding a new word replays the merges in the order they were learned.\n\n! Example: the first BPE merges\n! Corpus: low ×5, lower ×2, newest ×6, widest ×3, with `_` marking word end.\n! Pair counts include e s = 9, s t = 9, t _ = 9, w e = 8, l o = 7, o w = 7. Three pairs tie at 9; with first-seen tie-breaking the first merge is e+s → es.\n! Then es+t → est (9) and est+_ → est_ (9), so \"newest\" and \"widest\" share a suffix token. Next come l+o and lo+w (7 each), giving the frequent stem \"low\".\n\n```python\nfrom collections import Counter\ndef bpe_step(words):                          # words: {tuple_of_symbols: count}\n    pairs = Counter()\n    for w, c in words.items():\n        for a, b in zip(w, w[1:]): pairs[a, b] += c\n    best = max(pairs, key=pairs.get)          # ties: first seen wins\n    merged = {}\n    for w, c in words.items():\n        out, i = [], 0\n        while i < len(w):\n            if i + 1 < len(w) and (w[i], w[i + 1]) == best: out.append(w[i] + w[i + 1]); i += 2\n            else: out.append(w[i]); i += 1\n        merged[tuple(out)] = c\n    return best, merged\n```\n\n**WordPiece** (BERT) differs in two ways. Training picks the pair that most increases corpus likelihood, roughly $\\text{count}(ab) / (\\text{count}(a)\\,\\text{count}(b))$, which favours pairs whose parts rarely appear apart. Encoding is greedy longest-match-first: take the longest vocabulary entry that prefixes the word, mark continuation pieces with `##`, repeat. \"unaffable\" becomes `un ##aff ##able`. If some remainder matches nothing, the whole word becomes `[UNK]`.\n\n**Byte-level BPE** (GPT-2 onward) runs BPE over UTF-8 bytes rather than characters. The base vocabulary is the 256 byte values, so every string, including emoji and any script, has an encoding and there is no unknown token; rare characters simply cost several tokens. SentencePiece's unigram model is a third option, which prunes a large candidate vocabulary by likelihood and treats whitespace as an ordinary symbol, which suits languages without spaces.\n\nKeep character offsets for every token. Token-level tasks (lesson 06.05) need them to map predictions back to the original text.\n\n> Takeaway: tokenisation is part of the model. Normalise deliberately, pre-split with a regex, and use a subword tokeniser so vocabulary stays bounded and unknown words decompose into known pieces; byte-level BPE removes unknowns entirely.\n","q":"Why can a byte-level BPE tokeniser (GPT-2 style) never produce an unknown token, while BERT's WordPiece can? What does each model actually receive for an emoji that never appeared in tokeniser training?","s":"Byte-level BPE's base vocabulary is all 256 byte values, and merges only combine symbols that already exist, so any UTF-8 string can at worst be encoded byte by byte. An unseen emoji (4 bytes in UTF-8) arrives as up to four byte-level tokens; the model gets the information, though it costs more tokens and the model may have seen those byte sequences rarely. WordPiece's base vocabulary is a fixed set of characters seen in training. Greedy longest-match encoding fails if no vocabulary entry matches a remaining piece of the word, and then the whole word is replaced by [UNK]. So BERT receives [UNK] for the emoji (and for the whole whitespace-delimited word containing it), which erases all information about it.","r":[["Neural Machine Translation of Rare Words with Subword Units (Sennrich et al., 2016)","https://arxiv.org/abs/1508.07909","The BPE-for-NLP paper; the merge algorithm fits in a dozen lines in section 3.2."],["Hugging Face LLM Course, chapter 6: Tokenizers","https://huggingface.co/learn/llm-course/chapter6/1","Normalisation, pre-tokenisation, and BPE, WordPiece and Unigram side by side with code."],["SentencePiece (Kudo and Richardson, 2018)","https://arxiv.org/abs/1808.06226","Language-independent subword tokenisation treating whitespace as a symbol."],["Python unicodedata","https://docs.python.org/3/library/unicodedata.html","NFC, NFD, NFKC and NFKD normalisation forms and what each folds."]],"k":["tokenisation","BPE","WordPiece"],"x":["Python"],"p":["byte-pair-encoding","subword-tokenization","text-normalization","sentence-segmentation","regex-patterns-for-nlp"],"ak":""},{"id":"06.02","t":"Counting-based language models","n":["A language model assigns probabilities to sequences. The chain rule factors $P(w_1..w_N)$ into next-word probabilities; an n-gram model assumes each word depends only on the previous $n-1$.","Maximum-likelihood n-gram estimates are count ratios, and any unseen n-gram gets probability zero, which makes a test sentence containing it infinitely surprising.","Smoothing moves probability mass to unseen events: add-k (simple, steals too much), interpolation and backoff (mix orders), and Kneser-Ney (uses how many contexts a word appears in, the best classical method).","Perplexity is the exponential of average negative log-likelihood per token: the effective number of
