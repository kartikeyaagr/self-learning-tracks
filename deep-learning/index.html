 equally likely choices. A uniform model over $V$ words has perplexity $V$.","Perplexities are comparable only with the same tokenisation and test text. Convert to per-word or bits-per-byte figures to compare across tokenisers."],"a":"## Language models before neural networks\nA language model assigns a probability to any sequence of tokens. The chain rule makes this exact:\n\n$$P(w_1, \\dots, w_N) = \\prod_{i=1}^{N} P(w_i \\mid w_1, \\dots, w_{i-1})$$\n\nEvery neural language model, including the RNN of 05.01 and every LLM, estimates these conditional probabilities. The n-gram model is the counting version, and it is still worth knowing: it is a fast baseline, a tool for data filtering and spelling correction, and it is where perplexity, smoothing and the sparsity problem come from.\n\n## The Markov assumption and counting\nAn n-gram model assumes the next word depends only on the previous $n - 1$ words. For a trigram model, $P(w_i \\mid w_{i-2}, w_{i-1})$, estimated by maximum likelihood as\n\n$$P_{\\text{MLE}}(w_i \\mid w_{i-2}, w_{i-1}) = \\frac{C(w_{i-2}, w_{i-1}, w_i)}{C(w_{i-2}, w_{i-1})}$$\n\nPad each sentence with start symbols `<s>` and an end symbol `<\/s>` so the first words have a history and the model learns where sentences end. Work in log space: multiplying hundreds of probabilities below 0.1 underflows a float.\n\nThe fatal problem is sparsity. With a 50,000-word vocabulary there are $1.25 \\times 10^{14}$ possible trigrams; even a billion-word corpus sees a tiny fraction. Any unseen trigram has MLE probability zero, so any test sentence containing one gets probability zero, and its perplexity is infinite.\n\n## Smoothing\n\n| Method | Idea | Weakness |\n| Add-k (Laplace when k = 1) | add $k$ to every count: $(C + k)/(C_{\\text{hist}} + kV)$ | with large $V$ it gives far too much mass to unseen events |\n| Interpolation | $\\lambda_3 P_3 + \\lambda_2 P_2 + \\lambda_1 P_1$, weights tuned on held-out data | lower orders still use raw frequency |\n| Backoff (Katz; \"stupid backoff\" at web scale) | use the trigram if seen, else a discounted bigram, else unigram | needs discounting to stay normalised |\n| Kneser-Ney | absolute discounting plus a continuation probability for the lower order | more bookkeeping; the standard choice |\n\nKneser-Ney's key idea concerns what the lower-order model should measure. \"Francisco\" may be frequent, but it appears almost only after \"San\". When the model backs off to unigrams because the bigram \"the Francisco\" is unseen, raw frequency says \"Francisco\" is likely; it should not be, since it virtually never starts a new context. KN replaces the unigram probability with a continuation probability proportional to the number of distinct words that precede $w$. Modified KN with interpolation remained the best n-gram method in Chen and Goodman's extensive comparison.\n\n```python\nfrom collections import Counter\ndef bigram_lm(sentences, k=1.0):\n    uni, bi = Counter(), Counter()\n    for s in sentences:\n        toks = [\"<s>\"] + s.split() + [\"<\/s>\"]\n        uni.update(toks[:-1]); bi.update(zip(toks, toks[1:]))\n    V = len(set(uni) | {\"<\/s>\"})\n    return lambda prev, w: (bi[prev, w] + k) / (uni[prev] + k * V)   # add-k\n```\n\n%%flow Building and scoring an n-gram model. Counts come from training text only; perplexity is measured on held-out text.\nTraining text -(pad with <s>, <\/s>)-> n-gram counts -> *Smoothed P(w given history) -(held-out text)-> Perplexity\n%%\n\n## Perplexity\nPerplexity on a held-out text of $N$ tokens is\n\n$$\\text{PPL} = \\exp\\Big(-\\frac{1}{N} \\sum_{i=1}^{N} \\log P(w_i \\mid \\text{history}_i)\\Big)$$\n\nIt is the inverse of the geometric-mean probability per token, and reads as the effective branching factor: perplexity 100 means the model is, on average, as uncertain as if choosing uniformly among 100 options. A uniform model over $V$ tokens has perplexity exactly $V$; lower is better. Cross-entropy in bits is $\\log_2 \\text{PPL}$.\n\n! Example: smoothing and perplexity by hand\n! Vocabulary $V = 10$, $C(\\text{the}) = 10$, $C(\\text{the cat}) = 3$, $C(\\text{the dog}) = 0$.\n! MLE: $P(\\text{cat} \\mid \\text{the}) = 0.3$, $P(\\text{dog} \\mid \\text{the}) = 0$. Add-1: $(3+1)/(10+10) = 0.2$ and $(0+1)/20 = 0.05$. Note how much the seen event lost.\n! A 3-token test text with probabilities 0.2, 0.1, 0.05: mean log-probability $(-1.609 - 2.303 - 2.996)/3 = -2.303$, so PPL $= e^{2.303} = 10$.\n\n## Comparing perplexities honestly\nPerplexity is per token, so it depends on what a token is. A model with a smaller subword vocabulary predicts more, easier tokens per word, and its per-token perplexity looks lower even if it is a worse model of the text. To compare across tokenisers, compare total log-likelihood of the same text: convert to per-word perplexity, or to bits per byte (total negative log-likelihood in bits divided by the UTF-8 byte count). The unknown-word token is another trap: mapping many rare words to one cheap `<unk>` lowers perplexity artificially. Fix the vocabulary and test text before comparing.\n\n## Where n-grams still matter\n- Fast baselines and features (lesson 06.03 uses n-gram counts as features).\n- Data pipelines: KenLM-style n-gram models score web text for quality filtering in LLM pretraining.\n- Candidate generation and rescoring in speech recognition and spelling correction.\n- Teaching: the n-gram's failure is exactly what neural LMs fix, by sharing statistics between similar contexts through embeddings rather than treating every history as a separate count.\n\n> Takeaway: an n-gram model is the chain rule plus a short memory, estimated by counting. Smoothing decides how much probability unseen events get, and perplexity measures average surprise per token, comparable only when the tokenisation and test text match.\n","q":"Model A uses a 50k word-level vocabulary and gets perplexity 120 on a test set. Model B uses an 8k BPE vocabulary and gets perplexity 40 on the same text, where B's tokeniser produces on average 1.4 tokens per word. Which model is better, and how do you know?","s":"The raw numbers are not comparable, because perplexity is per token and B has 1.4 tokens per word. Compare total log-likelihood of the same text instead. B's average negative log-likelihood is ln 40 ≈ 3.69 nats per token, so per word it is 1.4 × 3.69 ≈ 5.16 nats, a per-word perplexity of e^5.16 ≈ 175. A's per-word perplexity is 120 (ln 120 ≈ 4.79 nats per word). So A assigns higher probability to the test text and is the better model, despite B's lower number. Also check that A does not gain unfairly from mapping rare words to a cheap <unk>; bits per byte on raw text avoids both issues.","r":[["Jurafsky and Martin, Speech and Language Processing (3rd ed. draft)","https://web.stanford.edu/~jurafsky/slp3/","The n-gram language model chapter: smoothing, Kneser-Ney and perplexity with worked examples."],["An Empirical Study of Smoothing Techniques for Language Modeling (Chen and Goodman, 1996)","https://aclanthology.org/P96-1041/","The classic comparison establishing interpolated Kneser-Ney as the strongest n-gram method."]],"k":["n-gram","smoothing","perplexity"],"x":["Python"],"p":["n-gram-language-model","perplexity-computation","conditional-perplexity"],"ak":""},{"id":"06.03","t":"Bag-of-words and TF-IDF","n":["Bag-of-words represents a document as a vector of term counts over the vocabulary, discarding order. Vectors are huge and about 99.9% zeros, so they are stored sparse.","TF-IDF reweights counts: terms frequent in this document but rare in the corpus score high; terms in every document score near the minimum.","With L2-normalised TF-IDF vectors, cosine similarity is a dot product, which makes ranking documents against a query a sparse matrix-vector multiply.","BM25 improves on TF-IDF for ranking with term-frequency saturation ($k_1$) and document-length normalisation ($b$). It remains the standard lexical baseline and half of most hybrid search systems.","Fit the vocabulary and IDF on training data only. A linear model on TF-IDF features is a strong, cheap text-classification baseline."],"a":"## Documents as count vectors\nBefore embeddings, the standard way to give text to a model was to count words. Build a vocabulary of $V$ terms from the training corpus; represent each document as a length-$V$ vector whose entry $j$ is how often term $j$ appears. Order is gone (\"dog bites man\" equals \"man bites dog\"), which is why this is called a bag of words. The approach is still the first baseline to try for classification and the backbone of lexical search.\n\nThree details matter in practice:\n- **Sparsity.** A 200-word document over a 100,000-term vocabulary has at most 200 non-zeros: 99.8% zeros. Store it in a compressed sparse row (CSR) matrix: values, column indices and row pointers. A million documents then take hundreds of megabytes, not the 400 GB a dense float32 matrix would need.\n- **N-gram features.** Adding bigrams lets the model see \"not good\" and \"New York\" as units. Vocabulary grows fast, so cap it by minimum document frequency.\n- **The hashing trick.** Instead of storing a vocabulary, hash each term into one of $2^{20}$ columns. No vocabulary to fit or ship, at the cost of occasional collisions and no way to map columns back to words.\n\n%%flow Lexical search: the same vectoriser, fitted once on the corpus, is applied to documents and queries.\nDocuments -(tokenise)-> Vocabulary -(count)-> Sparse CSR counts -(× IDF, L2 norm)-> *TF-IDF matrix -(dot with query vector)-> Ranked documents\n%%\n\n## TF-IDF\nRaw counts overweight words that appear everywhere (\"the\", \"of\") and say nothing about what a document is about. TF-IDF multiplies a term-frequency part by an inverse-document-frequency part:\n\n$$\\text{tfidf}(t, d) = \\text{tf}(t, d) \\times \\text{idf}(t), \\qquad \\text{idf}(t) = \\ln\\frac{1 + N}{1 + \\text{df}(t)} + 1$$\n\nwhere $N$ is the number of documents and $\\text{df}(t)$ the number containing $t$. This is scikit-learn's smoothed form: the $+1$ inside avoids division by zero, the $+1$ outside keeps terms in every document from being zeroed out entirely. Common variants:\n- **Sublinear tf**: $1 + \\ln \\text{tf}$ for $\\text{tf} > 0$, so a word appearing 20 times does not count 20 times as much as one appearing once.\n- **L2 normalisation** of each document vector, so long documents do not dominate and cosine similarity becomes a plain dot product.\n\n! Example: IDF for a common and a rare term\n! $N = 1{,}000$ documents. \"the\" appears in all of them: $\\text{idf} = \\ln(1001/1001) + 1 = 1.0$.\n! \"transformer\" appears in 10: $\\text{idf} = \\ln(1001/11) + 1 = \\ln 91 + 1 = 5.51$.\n! One occurrence of \"transformer\" outweighs five occurrences of \"the\" before normalisation.\n\n```python\nfrom sklearn.feature_extraction.text import TfidfVectorizer\nvec = TfidfVectorizer(ngram_range=(1, 2), min_df=2, sublinear_tf=True)   # L2 norm by default\nX = vec.fit_transform(train_docs)          # fit vocabulary and IDF on training docs only\nq = vec.transform([\"sparse attention kernels\"])\nscores = (X @ q.T).toarray().ravel()       # cosine similarity, since rows are unit length\ntop10 = scores.argsort()[::-1][:10]\n```\n\nFitting on training data only matters: if IDF is computed over train plus test, test-set term statistics leak into the features, mildly inflating evaluation numbers.\n\n## BM25: TF-IDF tuned for ranking\nFor search, two weaknesses of TF-IDF show up. Term frequency should saturate: the tenth mention of \"python\" adds less evidence than the second. And long documents mention everything more often, so they should be discounted relative to the average length. BM25 handles both:\n\n$$\\text{BM25}(q, d) = \\sum_{t \\in q} \\text{idf}(t) \\cdot \\frac{\\text{tf}(t, d)\\,(k_1 + 1)}{\\text{tf}(t, d) + k_1\\big(1 - b + b\\,\\frac{|d|}{\\text{avgdl}}\\big)}$$\n\n- $k_1$ (typically 1.2 to 2.0) controls saturation: as tf grows the fraction approaches $k_1 + 1$, never more.\n- $b$ (typically 0.75) controls length normalisation: $b = 0$ ignores length, $b = 1$ fully divides by relative length.\n- IDF is usually $\\ln\\big(\\frac{N - \\text{df} + 0.5}{\\text{df} + 0.5} + 1\\big)$.\n\nBM25 is hard to beat on queries with rare, exact terms: product codes, error messages, names. Dense embedding retrieval (lesson 06.04 and the AI Engineering course) wins on paraphrase. Production search usually runs both and fuses the ranked lists, for example with reciprocal rank fusion.\n\n## As features for classification\nA linear model (logistic regression or a linear SVM) on TF-IDF unigrams and bigrams is a strong baseline for topic, spam and sentiment classification, often within a few points of fine-tuned transformers on long-document tasks, at a tiny fraction of the cost. Multinomial naive Bayes on raw counts is even cheaper; the Machine Learning course covers both models. Their weights are directly interpretable: the largest coefficients are the words that drive each class.\n\n> Takeaway: bag-of-words and TF-IDF turn text into sparse, interpretable vectors that make linear models and lexical search fast. BM25 adds term saturation and length normalisation and remains the lexical baseline every dense retriever should be compared against.\n","q":"Under BM25 with k1 = 1.2 and b = 0.75, why doesn't a 10,000-word document that mentions 'python' 20 times automatically outrank a 200-word document that mentions it 5 times, when the average document length is 500 words? Work out the term-frequency factor for each.","s":"The tf factor is tf(k1+1) / (tf + k1(1 - b + b|d|/avgdl)). Long doc: |d|/avgdl = 20, so the length term is 1.2 × (0.25 + 0.75 × 20) = 1.2 × 15.25 = 18.3; factor = 20 × 2.2 / (20 + 18.3) = 44 / 38.3 ≈ 1.15. Short doc: |d|/avgdl = 0.4, length term = 1.2 × (0.25 + 0.3) = 0.66; factor = 5 × 2.2 / (5 + 0.66) = 11 / 5.66 ≈ 1.94. The short document scores higher for this term: saturation caps how much repeated mentions can add (the factor can never exceed 2.2), and length normalisation recognises that 20 mentions in 10,000 words is a lower density than 5 in 200. Raw TF-IDF without normalisation would have favoured the long document.","r":[["scikit-learn: Text feature extraction","https://scikit-learn.org/stable/modules/feature_extraction.html","CountVectorizer, TfidfVectorizer (exact IDF formula and options) and HashingVectorizer."],["Okapi BM25 (Wikipedia)","https://en.wikipedia.org/wiki/Okapi_BM25","The BM25 formula, its IDF variants and the roles of k1 and b, with links to the original papers."],["Jurafsky and Martin, Speech and Language Processing (3rd ed. draft)","https://web.stanford.edu/~jurafsky/slp3/","The vector semantics chapter covers term-document matrices, TF-IDF and cosine similarity."]],"k":["TF-IDF","BM25","sparse vectors"],"x":["scikit-learn","NumPy"],"p":["tf-idf","bag-of-words","document-ranking","text-classification"],"ak":""},{"id":"06.04","t":"Word embeddings","n":["A word embedding is a dense vector (typically 100-300 dimensions) learned so that words appearing in similar contexts get similar vectors: the distributional hypothesis made trainable.","Skip-gram with negative sampling trains a logistic classifier to tell real (word, context) pairs from random ones. It replaces a $V$-way softmax with $k + 1$ binary decisions per pair.","GloVe fits word vectors so their dot products match log co-occurrence counts, by weighted least squares on the global count matrix.","fastText represents a word as the sum of its character n-gram vectors, so it can build vectors for misspellings and unseen inflections.","Static embeddings give one vector per word type, so 'bank' (river) and 'bank' (money) share one vector. Contextual models (lesson 06.06) fix that."],"a":"## From sparse counts to dense vectors\nThe previous lesson's vectors are sparse and know nothing about meaning: \"car\" and \"automobile\" are orthogonal. Word embeddings learn a dense vector per word so that similarity in the space reflects similarity in usage. The idea behind every method here is the distributional hypothesis: words that occur in similar contexts tend to have similar meanings. The AI Engineering course covers embeddings as a retrieval tool; this lesson covers how word vectors are trained.\n\nMechanically, an embedding is a $V \\times D$ matrix and looking up a word is selecting a row. That is the same as multiplying a one-hot vector by the matrix, but far cheaper. The gradient of a lookup is sparse: only the rows used in the batch receive updates, and a word that appears twice in a batch gets both contributions added.\n\n## word2vec: skip-gram with negative sampling\nSkip-gram (Mikolov et al., 2013) slides a window over the corpus. For each centre word $c$ and each context word $o$ within, say, 5 positions, it wants the model to predict $o$ from $c$. Each word has two vectors: $v_w$ when it is the centre and $u_w$ when it is the context. The full softmax $P(o \\mid c) = \\exp(u_o^\\top v_c) / \\sum_w \\exp(u_w^\\top v_c)$ needs a sum over the whole vocabulary for every pair, too slow at $V = 10^6$.\n\nNegative sampling replaces it with a binary task: is this pair real or noise? For each real pair, sample $k$ noise words $n_1..n_k$ and maximise\n\n$$\\log \\sigma(u_o^\\top v_c) + \\sum_{j=1}^{k} \\log \\sigma(-u_{n_j}^\\top v_c)$$\n\n%%flow One skip-gram negative-sampling update for the centre word \"fox\".\nCentre \"fox\" -(lookup)-> v(fox) -(dot with u(quick), u(k noise words))-> *k+1 sigmoid scores -(1 real, k fake)-> Logistic loss\n%%\n\nThe details that make it work:\n- $k$ = 5 to 20 for small corpora, 2 to 5 for large ones.\n- Noise words are drawn from the unigram distribution raised to the 3/4 power, which samples rare words more often than their raw frequency.\n- Frequent words are subsampled: each occurrence of $w$ is dropped with probability $1 - \\sqrt{t / f(w)}$, $t \\approx 10^{-5}$, so \"the\" stops dominating the updates and the effective window widens.\n- CBOW is the mirror variant: predict the centre word from the average of its context vectors. Faster; skip-gram is better for rare words.\n\n! Example: what the 3/4 power does\n! \"the\" has frequency 0.05; a rare word has frequency $10^{-6}$. Raw ratio: 50,000 to 1.\n! After the 3/4 power: $50{,}000^{0.75} \\approx 3{,}340$ to 1. Rare words become about 15 times more likely to appear as negatives, so their vectors get pushed away from unrelated words more often.\n\n```python\nimport numpy as np\nsig = lambda z: 1 / (1 + np.exp(-z))\ndef sgns_step(V_in, U_out, c, o, negs, lr=0.025):\n    v = V_in[c]                                   # (D,)\n    ids = np.concatenate([[o], negs])             # 1 positive, k negatives\n    labels = np.r_[1.0, np.zeros(len(negs))]\n    g = sig(U_out[ids] @ v) - labels              # d loss / d score, (k+1,)\n    grad_v = g @ U_out[ids]\n    np.subtract.at(U_out, ids, lr * g[:, None] * v)   # handles repeated ids\n    V_in[c] -= lr * grad_v\n```\n\n## GloVe\nGloVe (Pennington et al., 2014) starts from the global co-occurrence matrix $X$, where $X_{ij}$ counts how often word $j$ appears in the context of word $i$, and fits\n\n$$J = \\sum_{i,j:\\,X_{ij} > 0} f(X_{ij})\\,\\big(w_i^\\top \\tilde w_j + b_i + \\tilde b_j - \\log X_{ij}\\big)^2, \\quad f(x) = \\min\\big(1, (x/x_{\\max})^{0.75}\\big)$$\n\nwith $x_{\\max} = 100$. The weighting stops very frequent pairs from dominating and ignores zero counts. The final vector is usually $w + \\tilde w$. In practice skip-gram and GloVe give similar quality; GloVe trains on a precomputed matrix, skip-gram streams over text.\n\n## fastText\nBoth methods above treat each word as an atom, so \"running\", \"runner\" and the typo \"runnning\" share nothing, and an unseen word has no vector. fastText (Bojanowski et al., 2017) represents a word as the sum of vectors for its character n-grams (lengths 3 to 6, with boundary markers, e.g. `<ru`, `run`, `unn`, ... plus the whole word), hashed into about 2 million buckets. Training is otherwise skip-gram. Any string, including an out-of-vocabulary word, gets a vector from its n-grams, which matters for morphologically rich languages and noisy text.\n\n| Method | Trains on | Unit | Unseen words |\n| word2vec (SGNS) | streaming windows | word | no vector |\n| GloVe | global co-occurrence counts | word | no vector |\n| fastText | streaming windows | character n-grams | built from n-grams |\n\n## Similarity, analogies and limits\nCompare vectors with cosine similarity: normalise to unit length, then dot. The famous analogy, $v_{king} - v_{man} + v_{woman} \\approx v_{queen}$, holds only if you exclude the three input words from the nearest-neighbour search; otherwise \"king\" itself often wins. Treat analogy benchmarks as a sanity check, not a quality measure.\n\nKnown limits:\n- **One vector per type**: \"bank\" gets a blend of its senses. Contextual models (06.06) produce a different vector per occurrence.\n- **Frequency effects**: very frequent and very rare words cluster in odd regions; rare words have noisy vectors.\n- **Social bias**: vectors absorb associations from the corpus (gender-occupation analogies are the classic demonstration) and pass them into downstream models.\n\n> Takeaway: word embeddings compress co-occurrence statistics into dense vectors where cosine similarity tracks usage. word2vec and GloVe learn one vector per word; fastText builds vectors from subword pieces; all are static, which is the limitation contextual models remove.\n","q":"You need word vectors for a domain of clinical notes full of rare drug names, abbreviations and misspellings. Compare word2vec and fastText for this, including one way fastText could mislead you.","s":"word2vec learns one vector per vocabulary entry, so misspellings and rare drug names either fall below the minimum count and get no vector, or get noisy vectors from very few contexts; every unseen variant at test time has nothing. fastText builds each word from character n-gram vectors, so 'amoxicilin' (misspelt) shares most n-grams with 'amoxicillin' and lands near it, and inflections and unseen words get usable vectors. It also shares statistical strength across words with common pieces. The risk is that surface similarity is not semantic similarity: drug names that differ by a few characters but are clinically unrelated (sound-alike or look-alike medications) will get similar vectors, and short abbreviations with few n-grams can collide. Check nearest neighbours for critical terms before trusting them.","r":[["Efficient Estimation of Word Representations in Vector Space (Mikolov et al., 2013)","https://arxiv.org/abs/1301.3781","Introduces skip-gram and CBOW."],["Distributed Representations of Words and Phrases (Mikolov et al., 2013)","https://arxiv.org/abs/1310.4546","Negative sampling, the 3/4-power noise distribution and frequent-word subsampling."],["GloVe: Global Vectors for Word Representation (Pennington et al., 2014)","https://aclanthology.org/D14-1162/","The weighted least-squares objective and its motivation from co-occurrence ratios."],["Enriching Word Vectors with Subword Information (Bojanowski et al., 2017)","https://arxiv.org/abs/1607.04606","fastText's character n-gram model and results on rare words."]],"k":["word embeddings","word2vec"],"x":["NumPy"],"p":["word2vec","glove","fasttext","embedding-similarity","cosine-similarity-matrix"],"ak":""},{"id":"06.05","t":"Sequence labelling","n":["Sequence labelling assigns one label per token: part-of-speech tags, or named-entity tags in the BIO scheme (B- begins an entity, I- continues it, O is outside).","Per-token argmax can output invalid sequences (I-PER right after O or after B-LOC). Constrained or CRF decoding with the Viterbi algorithm finds the best valid sequence in $O(TK^2)$.","With subword tokenisers, label only the first subword of each word and mask the rest out of the loss; map predictions back to words via offsets.","Evaluate NER with entity-level F1 (exact span and type match), not token accuracy, which is inflated by the many O tokens.","Extractive question answering is span labelling: predict start and end logits per token, then choose the best valid pair with start ≤ end and a length cap."],"a":"## One label per token\nMany NLP tasks label every token rather than the whole text:\n- **Part-of-speech tagging**: noun, verb, adjective and so on, with 17 tags in Universal Dependencies or 45 in the Penn Treebank.\n- **Named-entity recognition (NER)**: find spans that name people, organisations, locations, dates, drugs.\n- **Span extraction**: find the answer to a question as a contiguous span of a passage.\n\nAll share one model shape: an encoder produces a vector per token (bidirectional LSTM from 05.02, or a pretrained transformer from the next lesson), a linear layer maps each to $K$ label logits, and a decoding step turns logits into labels or spans.\n\n%%flow The token-classification pipeline. Decoding and evaluation happen at the word or span level, not the subword level.\nWords -(tokeniser, keep offsets)-> Subwords -> Encoder -> *Per-token logits -(argmax or Viterbi)-> BIO tags -(group)-> Entity spans\n%%\n\n## Tagging schemes\nEntities span several tokens, so labels encode position within the entity. In BIO, B-X starts an entity of type X, I-X continues it, O is outside:\n\n| Token | Barack | Obama | visited | New | York | yesterday |\n| Tag | B-PER | I-PER | O | B-LOC | I-LOC | O |\n\nThe B tag is what separates two adjacent entities of the same type. BIOES adds E (end) and S (single-token) tags, which gives the model more explicit boundary signals and sometimes helps a little. Plain BIO cannot represent nested entities (\"Bank of [England]\" inside an organisation); those need span-based models that score every candidate span.\n\n```python\ndef bio_to_spans(tags):\n    spans, start, typ = [], None, None\n    for i, t in enumerate(tags + [\"O\"]):              # sentinel closes a trailing span\n        if t == \"O\" or t.startswith(\"B-\") or (t.startswith(\"I-\") and t[2:] != typ):\n            if start is not None: spans.append((start, i, typ))\n            start, typ = (i, t[2:]) if t != \"O\" else (None, None)   # stray I- starts a span\n    return spans                                      # [(start, end_exclusive, type)]\n```\n\nHow to treat an I- tag that follows O or a different type is a policy choice; the lenient policy above starts a new entity, a strict one discards it. Use the same policy as your evaluation script.\n\n## Baselines and decoding\nFor POS tagging, simply assigning each word its most frequent training tag (and the most common open-class tag to unknown words) already gets about 92% accuracy on English newswire; good models reach about 97%. Most of the remaining errors are genuinely ambiguous words such as \"that\" or \"back\".\n\nGreedy decoding takes the argmax at each token independently. It is fast but can emit invalid sequences like `O I-PER` or `B-LOC I-PER`, because nothing ties neighbouring decisions together. Two fixes:\n- **Constrained decoding**: forbid invalid transitions, then find the highest-scoring valid sequence.\n- **A CRF layer** on top of the encoder (BiLSTM-CRF was the standard NER architecture before transformers): learn a $K \\times K$ transition score matrix and train on whole-sequence likelihood.\n\nBoth use the Viterbi algorithm: dynamic programming that keeps, for each position and each tag, the best score of any path ending there, plus a back-pointer. Cost is $O(T K^2)$, trivial for a dozen tags. The same algorithm decodes hidden Markov models, the classical tagger.\n\n## Subword alignment\nA transformer tokeniser splits \"Kaczynski\" into several pieces, but the labels belong to words. The standard recipe: give the word's label to its first subword, and give the remaining subwords the ignore label (-100 in PyTorch's cross-entropy) so they are excluded from the loss. At prediction time read the label from each word's first subword. Character offsets from the tokeniser (lesson 06.01) map spans back to the original string. Getting this alignment wrong shifts every label by a token, and accuracy collapses without any error being raised.\n\n## Evaluating NER\nToken accuracy is misleading: most tokens are O, so a model that predicts O everywhere can score above 80%. The CoNLL standard is entity-level precision, recall and F1, where a predicted entity counts only if both its boundaries and its type match exactly.\n\n! Example: token accuracy versus entity F1\n! A test set has 10 gold entities. The model predicts 8, of which 6 match exactly; the other 2 have one boundary token wrong.\n! Precision $= 6/8 = 0.75$, recall $= 6/10 = 0.60$, F1 $= 2 \\times 0.75 \\times 0.6 / 1.35 = 0.667$.\n! Token accuracy could still be 97%, because the two near-misses are each a single wrong token among hundreds of correct O tags.\n\n## Span extraction\nFor extractive question answering (SQuAD-style), the input is `[CLS] question [SEP] passage [SEP]`, and the model outputs two logits per token: start score $s_i$ and end score $e_j$. The answer is the pair maximising $s_i + e_j$ subject to $i \\le j$, $j - i < L_{\\max}$ (say 30 tokens), and both positions inside the passage rather than the question. Taking the two argmaxes independently can produce an end before the start; search over valid pairs, which is $O(T \\cdot L_{\\max})$. If the dataset allows unanswerable questions, compare the best span's score against the score of pointing both at `[CLS]`.\n\n> Takeaway: sequence labelling is per-token classification plus structure. Encode tokens, constrain or Viterbi-decode so labels form valid spans, align subwords to words carefully, and measure with entity-level F1.\n","q":"A NER model's per-token argmax output for five words is: O, B-LOC, I-PER, I-PER, O. How would a lenient BIO decoder, a strict decoder, and Viterbi decoding with transition constraints each handle this, and how does each outcome affect entity-level F1 if the gold answer is a single PER entity over words 2-4?","s":"A lenient decoder closes LOC at word 2 and starts a new PER entity at word 3 from the stray I-PER, giving LOC(2) and PER(3-4). A strict decoder keeps LOC(2) and discards the I-PER tokens, since they lack a B-PER. Viterbi with constraints forbids B-LOC followed by I-PER and finds the best valid sequence; if the PER logits on words 3-4 are strong, it is likely to choose B-PER I-PER I-PER for words 2-4, or B-LOC O O if the LOC evidence on word 2 dominates. Against the gold PER(2-4): lenient produces two false positives and one miss (P = 0, R = 0); strict produces one false positive and one miss; only the constrained decode can produce an exact match, giving P = R = F1 = 1 for this sentence. Structured decoding converts per-token evidence into consistent spans.","r":[["Neural Architectures for Named Entity Recognition (Lample et al., 2016)","https://arxiv.org/abs/1603.01360","BiLSTM-CRF for NER and the IOBES scheme; section 2 explains the CRF layer and Viterbi decoding."],["Bidirectional LSTM-CRF Models for Sequence Tagging (Huang et al., 2015)","https://arxiv.org/abs/1508.01991","Compares LSTM, BiLSTM and BiLSTM-CRF taggers on POS, chunking and NER."],["Introduction to the CoNLL-2003 Shared Task","https://aclanthology.org/W03-0419/","Defines the standard NER dataset and the exact-match entity F1 evaluation."],["SQuAD: 100,000+ Questions for Machine Comprehension","https://arxiv.org/abs/1606.05250","The extractive QA task framing that start/end span prediction solves."]],"k":["NER","BIO tagging","Viterbi"],"x":["Python","NumPy"],"p":["named-entity-recognition","greedy-sequence-tagging","token-classification","span-extraction","pos-tagging"],"ak":""},{"id":"06.06","t":"Pretrained language models","n":["Pretrain once on unlabelled text, fine-tune cheaply per task: a pretrained encoder plus a small head beats task-specific architectures trained from scratch on most NLP benchmarks.","BERT's masked language modelling picks 15% of tokens and predicts the originals; of those, 80% become [MASK], 10% a random token and 10% stay unchanged, because [MASK] never appears at fine-tuning time.","Next-sentence prediction asked whether segment B followed segment A. RoBERTa showed that dropping it, and training longer on more data with dynamic masking, works better.","For classification, put a linear head on the final [CLS] vector (or mean-pooled tokens) and fine-tune all weights with a small learning rate (2e-5 to 5e-5) for 2 to 4 epochs.","Encoders see both directions, so they suit understanding tasks; they do not generate text naturally, which is what decoder-only models are for."],"a":"## Pretrain, then fine-tune\nUntil 2018, most NLP systems were trained from scratch per task, starting at best from static word vectors (lesson 06.04). BERT (Devlin et al., 2018) made a different recipe standard: pretrain a large transformer encoder on unlabelled text with a self-supervised objective, then fine-tune the whole network with a small task head on a few thousand labelled examples. Contextual vectors replaced static ones: \"bank\" gets a different representation in \"river bank\" and \"bank account\" because every layer attends over the whole sentence.\n\nThis lesson covers encoder pretraining and classic fine-tuning. Decoder-only LLMs and parameter-efficient fine-tuning (LoRA and friends) are covered in the AI Research course.\n\n%%flow The two phases. Only the small head is new at fine-tuning time; every pretrained weight is updated too.\n[Pretrain] Unlabelled text -(mask 15%)-> Corrupted tokens -> *Transformer encoder -> Predict original tokens\n[Fine-tune] Labelled sentence -> Pretrained encoder -(final CLS vector)-> *Linear head -> Class label\n%%\n\n## BERT's input format\n- WordPiece vocabulary of about 30,000 tokens (lesson 06.01), maximum length 512.\n- Input: `[CLS] segment A [SEP] segment B [SEP]`. Each token's input vector is the sum of a token embedding, a learned position embedding and a segment embedding (A or B).\n- BERT-base: 12 layers, width 768, 12 heads, 110M parameters. BERT-large: 24 layers, width 1024, 16 heads, 340M.\n\n## Masked language modelling\nA left-to-right LM cannot use the right context, and a bidirectional encoder trained to predict the next token would trivially see the answer. MLM sidesteps this: corrupt some input tokens and train the encoder to recover them using context on both sides.\n\n1. Choose 15% of token positions at random.\n2. Of those, replace 80% with `[MASK]`, 10% with a random token, and leave 10% unchanged.\n3. Compute cross-entropy only at the chosen positions; all others get the ignore label.\n\n```python\nimport numpy as np\ndef mlm_corrupt(ids, mask_id, vocab_size, special, rng, p=0.15):\n    ids = ids.copy()\n    labels = np.full_like(ids, -100)                   # -100 = ignored by the loss\n    cand = ~np.isin(ids, special)                      # never mask [CLS], [SEP], [PAD]\n    chosen = cand & (rng.random(ids.shape) < p)\n    labels[chosen] = ids[chosen]                       # copy labels before corrupting\n    r = rng.random(ids.shape)\n    ids[chosen & (r < 0.8)] = mask_id\n    rand = chosen & (r >= 0.8) & (r < 0.9)\n    ids[rand] = rng.integers(0, vocab_size, rand.sum())\n    return ids, labels                                 # remaining 10% left unchanged\n```\n\nWhy not always use `[MASK]`? Fine-tuning inputs never contain `[MASK]`, so a model that only ever predicted at `[MASK]` positions would learn representations specialised for a token it will never see again. The random 10% forces the model to keep a good representation of every token, since any token might be corrupted; the unchanged 10% biases representations toward the actual observed word. Copying labels before corrupting matters: overwrite first and the \"labels\" become the corrupted ids.\n\n! Example: how much signal one sequence gives\n! A 512-token sequence has about $0.15 \\times 512 \\approx 77$ prediction targets: about 61 `[MASK]`, 8 random replacements, 8 unchanged.\n! A causal LM on the same sequence predicts 511 targets. MLM learns from about 15% as many positions per sequence, one reason it needs long training, and the motivation for ELECTRA, which trains a discriminator on every position.\n\n## Next-sentence prediction\nBERT also trained a binary classifier on the final `[CLS]` vector: is segment B the actual next segment after A (50%), or a random segment from another document (50%)? The aim was to help sentence-pair tasks like entailment and QA. RoBERTa (Liu et al., 2019) found that removing NSP and packing full-length contiguous text matched or improved results, and that most of BERT's headroom came from training longer, on 10× more data, with bigger batches and dynamic masking (a fresh mask each time a sequence is seen). The lesson generalises: an auxiliary objective that looks sensible can be neutral or harmful, so ablate it.\n\n## Fine-tuning for classification\nAdd a linear layer on top of the final `[CLS]` vector (or the masked mean of all token vectors) and train everything end to end with cross-entropy. The BERT paper's ranges remain good defaults:\n- Learning rate 2e-5 to 5e-5 with AdamW, linear warmup over about 10% of steps, then linear decay.\n- 2 to 4 epochs; batch size 16 or 32.\n- A larger learning rate quickly destroys the pretrained features (catastrophic forgetting) and often gives a model that predicts one class.\n\nOn small datasets (a few thousand examples) fine-tuning is unstable: different random seeds, which change the head's initialisation and the data order, can give very different dev scores. Run several seeds and report the mean and spread; train a bit longer with warmup and bias-corrected Adam, both of which were found to reduce the variance.\n\nOther heads use the same encoder: a per-token linear layer for tagging (lesson 06.05), start and end logits for span extraction, or two sentences in one input for pair classification.\n\n## Encoders versus decoders\nAn encoder's bidirectional attention is ideal for understanding tasks: classification, tagging, retrieval embeddings, reranking. It has no natural way to generate text left to right. Decoder-only models trained with next-token prediction generate naturally and, at scale, solve many classification tasks by prompting. For a high-volume, fixed-label task, a fine-tuned 110M-parameter encoder is still often the cheapest accurate option.\n\n> Takeaway: masked language modelling turns unlabelled text into a bidirectional encoder whose contextual vectors transfer to almost any understanding task. Fine-tune all of it gently with a small head, and treat seed variance on small datasets as part of the result.\n","q":"Suppose you pretrain BERT but replace every chosen token with [MASK] (100/0/0 instead of 80/10/10). What goes wrong when you fine-tune and use the model, and what specific job does the 10% 'left unchanged' bucket do?","s":"With 100% [MASK], the model only ever has to make predictions at [MASK] positions, so it can learn that ordinary visible tokens never need a carefully built representation of their own identity: the useful computation is focused on [MASK] slots. At fine-tuning and inference there are no [MASK] tokens, so every input looks unlike pretraining, and the representations of real tokens are less suited to the downstream task (a pretrain-finetune mismatch). The 10% random replacement means any visible token might be wrong, so the model must keep a contextual representation for every position. The 10% unchanged bucket means a visible token is sometimes also the correct answer, which teaches the model that the observed word is informative and anchors each position's representation toward the actual token, which is exactly the situation at fine-tuning time.","r":[["BERT: Pre-training of Deep Bidirectional Transformers (Devlin et al., 2018)","https://arxiv.org/abs/1810.04805","MLM and NSP (section 3.1), the 80/10/10 ablation (appendix C.2) and fine-tuning hyperparameters (appendix A.3)."],["RoBERTa: A Robustly Optimized BERT Pretraining Approach","https://arxiv.org/abs/1907.11692","Ablations of NSP, dynamic masking, batch size and data scale."],["Hugging Face Transformers: Fine-tuning a pretrained model","https://huggingface.co/docs/transformers/training","The practical classification fine-tuning loop with Trainer or plain PyTorch."]],"k":["BERT","masked language modelling","fine-tuning"],"x":["PyTorch","Hugging Face Transformers"],"p":["masked-language-modeling","mutation-trap","next-sentence-prediction","masked-mean-pooling"],"ak":""},{"id":"06.07","t":"Decoding and evaluation","n":["Greedy decoding takes the most likely token at each step; beam search keeps the $B$ best partial sequences by total log-probability and approximates the most likely complete output.","Summed log-probabilities favour short outputs, so beam search needs length normalisation. Very wide beams often lower quality: the most probable sequence is not the best one.","For open-ended generation, likelihood-maximising search produces dull, repetitive text; sampling with temperature, top-k or top-p (nucleus) is the norm.","BLEU is clipped n-gram precision (n = 1 to 4, geometric mean) times a brevity penalty, computed at corpus level; ROUGE is recall-oriented overlap, with ROUGE-L based on the longest common subsequence. Both measure surface overlap, not meaning.","Deduplicate training data, exactly by hash and approximately with MinHash and LSH. Duplicates waste compute, increase memorisation, and leak test examples into training so scores are inflated."],"a":"## From probabilities to text\nA sequence model (05.03, 05.04) gives $P(y_t \\mid y_{<t}, x)$. Producing text means choosing tokens one at a time, and the choice rule matters as much as the model. This lesson covers the rules, the classic metrics for scoring the result, and the data hygiene that keeps those scores honest. Sampling mechanics for LLM serving (temperature, top-k, top-p, speculative decoding) are covered in more depth in the Inference Engineering course; here the focus is on search and evaluation.\n\n%%flow Every generated output passes through a decoding rule, and its score depends on references and on the test set being clean.\nModel logits -> *Decoding rule (greedy, beam, sampling) -> Output text -(compare with references)-> BLEU / ROUGE\n%%\n\n## Greedy and beam search\nGreedy decoding picks $\\arg\\max$ at every step. It is fast and deterministic but myopic: a token that looks best now can lead to a poor continuation.\n\nBeam search keeps the $B$ highest-scoring partial hypotheses. At each step it expands each by every vocabulary token, scores by cumulative log-probability $\\sum_t \\log P(y_t \\mid y_{<t}, x)$, and keeps the top $B$ of the $B \\times V$ candidates. Hypotheses that emit the end token move to a finished list; search stops when no live beam can beat the best finished one, or at a length limit. Typical widths are 4 to 5 for translation and summarisation.\n\nTwo known problems:\n- **Length bias.** Every token adds a negative log-probability, so shorter hypotheses score higher. Normalise by length, $\\text{score} / |y|^{\\alpha}$ with $\\alpha$ between about 0.6 and 1.0 (GNMT used $((5 + |y|)/6)^{\\alpha}$).\n- **Wider is not better.** Raising $B$ finds higher-probability outputs, but for translation these are often shorter and worse; at extreme widths the empty output can win. The model's highest-probability sequence is not the best translation, so beam width is a hyperparameter to tune on a dev set, not a quality knob to max out.\n\n## Sampling for open-ended text\nFor stories, dialogue and chat, maximising likelihood produces generic and repetitive text that falls into loops. Holtzman et al. (2019) showed that human text is not the most probable text under a model: it regularly contains lower-probability tokens. Sampling restores that variety, with controls on the tail:\n- **Temperature** $\\tau$: sample from $\\text{softmax}(z / \\tau)$. $\\tau < 1$ sharpens, $\\tau > 1$ flattens, $\\tau \\to 0$ approaches greedy.\n- **Top-k**: sample only among the $k$ most likely tokens (e.g. 40).\n- **Top-p (nucleus)**: sample from the smallest set of tokens whose probabilities sum to at least $p$ (e.g. 0.9). The set adapts: a few tokens when the model is confident, many when it is not.\n\nUse beam search where there is roughly one right answer (translation, extraction), and sampling where variety is the point.\n\n## BLEU\nBLEU (Papineni et al., 2002) scores a candidate translation against one or more references. For each $n$ from 1 to 4 it computes a modified precision: n-gram matches divided by candidate n-grams, where each n-gram's count is clipped at the most times it appears in any single reference. The score is\n\n$$\\text{BLEU} = \\text{BP} \\cdot \\exp\\Big(\\sum_{n=1}^{4} \\tfrac{1}{4} \\log p_n\\Big), \\qquad \\text{BP} = \\begin{cases} 1 & c > r \\\\ e^{\\,1 - r/c} & c \\le r \\end{cases}$$\n\nwith $c$ the total candidate length and $r$ the reference length. Precision alone rewards short, safe outputs, so the brevity penalty punishes outputs shorter than the reference.\n\n! Example: clipping and the brevity penalty\n! Candidate \"the the the the the the the\" against reference \"the cat is on the mat\": unclipped unigram precision is 7/7; \"the\" appears at most twice in the reference, so the clipped precision is 2/7.\n! A 10-token candidate against a 12-token reference gets $\\text{BP} = e^{1 - 12/10} = e^{-0.2} = 0.82$, an 18% penalty regardless of quality.\n\n```python\nfrom collections import Counter\ndef clipped_precision(cand, refs, n):\n    grams = lambda t: Counter(zip(*[t[i:] for i in range(n)]))\n    c = grams(cand)\n    max_ref = Counter()\n    for r in refs: max_ref |= grams(r)                  # elementwise max over references\n    return sum(min(k, max_ref[g]) for g, k in c.items()), max(sum(c.values()), 1)\n```\n\nBLEU is designed for corpus level: sum matches and totals over all sentences, then combine. Sentence-level BLEU is noisy and needs smoothing, since a single missing 4-gram makes the geometric mean zero. Scores also depend on tokenisation, which is why sacreBLEU standardises it and prints a signature; never compare BLEU numbers computed with different tokenisers.\n\n## ROUGE\nROUGE (Lin, 2004) was built for summarisation and is recall-oriented: how much of the reference does the candidate cover? ROUGE-N is n-gram recall (ROUGE-1, ROUGE-2). ROUGE-L uses the longest common subsequence, which rewards in-order matches without requiring them to be contiguous, and is usually reported as an F-measure combining LCS-based precision and recall.\n\nBoth metrics measure surface overlap. A correct paraphrase can score poorly and a fluent but wrong output can score well. Use them to track progress within one system and dataset, and pair them with human evaluation or model-based judges for decisions that matter.\n\n## Deduplication\nEvaluation is only meaningful if test examples were not in the training data, and web-scale corpora are full of repeats. Lee et al. (2021) found substantial train-test overlap in standard datasets and showed that deduplicated training data led models to emit memorised text far less often, with no loss in quality.\n- **Exact duplicates**: normalise (lowercase, collapse whitespace), hash each document, keep the first occurrence of each hash. Linear time, stable order.\n- **Near duplicates**: represent each document by its set of word or character shingles (e.g. 5-grams) and estimate Jaccard similarity with MinHash: the probability that two documents share the minimum hash under a random hash function equals their Jaccard similarity. With LSH, split a 100-value signature into $b$ bands of $r$ rows; two documents become candidates if any band matches exactly, which happens with probability $1 - (1 - s^r)^b$.\n\nWith $b = 20$, $r = 5$: documents with Jaccard 0.8 become candidates with probability 0.9996; documents at 0.3 only 0.05. Candidates are then checked exactly. Deduplicate before splitting into train and test, or check the test set against the training set explicitly.\n\n> Takeaway: the decoding rule shapes the output as much as the model does: beam search with length normalisation for single-answer tasks, sampling for open-ended ones. BLEU and ROUGE measure n-gram overlap under fixed tokenisation, and they are only honest on deduplicated data.\n","q":"You raise the beam width of a translation model from 5 to 50. Model log-probability of the outputs goes up, but BLEU goes down and outputs get noticeably shorter. Explain why, and what you would change.","s":"Beam search maximises the total log-probability, a sum of negative terms, so every extra token lowers the score; short hypotheses that end early have an advantage. A narrow beam rarely finds those short, high-probability hypotheses, but a 50-wide beam explores enough to find them. It is succeeding at search while exposing a mismatch between the model's probability and translation quality. BLEU drops because the outputs omit content (lower n-gram matches) and because the brevity penalty e^(1 - r/c) applies once candidates are shorter than the references. Fixes: add length normalisation (divide by length to the power α, about 0.6-1.0, or GNMT's penalty), possibly a coverage penalty, and tune both the beam width and α on a dev set; often a beam of 4-8 with normalisation is best.","r":[["The Curious Case of Neural Text Degeneration (Holtzman et al., 2019)","https://arxiv.org/abs/1904.09751","Why likelihood-maximising decoding degenerates on open-ended text, and nucleus sampling."],["BLEU: a Method for Automatic Evaluation of Machine Translation (Papineni et al., 2002)","https://aclanthology.org/P02-1040/","Clipped n-gram precision and the brevity penalty, defined in sections 2.1 to 2.3."],["ROUGE: A Package for Automatic Evaluation of Summaries (Lin, 2004)","https://aclanthology.org/W04-1013/","Definitions of ROUGE-N, ROUGE-L and their variants."],["Deduplicating Training Data Makes Language Models Better (Lee et al., 2021)","https://arxiv.org/abs/2107.06499","Exact and MinHash near-duplicate removal at scale, and its effect on memorisation and train-test overlap."]],"k":["beam search","BLEU","deduplication"],"x":["Python","NumPy"],"p":["beam-search-decoding","evaluation-metrics-bleu-rouge","text-generation-sampling","text-deduplication-minhash","perform-stable-exact-deduplication"],"ak":""}]},{"n":"07","name":"Generative models","lessons":[{"id":"07.01","t":"Autoencoders and VAEs","n":["A plain autoencoder compresses $x$ to a code $z$ and reconstructs it, but its code space has holes, so decoding a random $z$ gives garbage: it is a compressor, not a generator.","A VAE fixes the prior $p(z)=\\mathcal N(0,I)$, learns a decoder $p_\\theta(x\\mid z)$ and an approximate posterior $q_\\phi(z\\mid x)$, and maximises the ELBO $\\mathbb E_q[\\log p_\\theta(x\\mid z)] - \\mathrm{KL}(q_\\phi(z\\mid x)\\,\\|\\,p(z))$.","The reparameterisation $z=\\mu+\\sigma\\odot\\epsilon$, $\\epsilon\\sim\\mathcal N(0,I)$ moves the randomness outside the network so gradients flow through the sample.","For a diagonal Gaussian encoder the KL has a closed form: $\\tfrac12\\sum_j(\\mu_j^2+\\sigma_j^2-\\log\\sigma_j^2-1)$. Predict $\\log\\sigma^2$, not $\\sigma$.","Typical failure modes are blurry samples and posterior collapse (the KL goes to zero and the decoder ignores $z$)."],"a":"## From compression to generation\nAn **autoencoder** is two networks trained end to end. The encoder maps an input $x$ (say a 28x28 MNIST digit flattened to 784 numbers) to a short code $z$ (say 20 numbers); the decoder maps $z$ back to $\\hat x$; the loss is reconstruction error, usually $\\|x-\\hat x\\|^2$. The bottleneck forces the code to keep only what matters. That is useful for compression, denoising and feature learning, but it does not give you a generator. Nothing tells the encoder where in code space to put things, so the codes of real images form a few scattered islands. Pick a random $z$ between them and the decoder produces something that looks like no digit at all.\n\nA **variational autoencoder** (Kingma and Welling, 2013) makes the code space usable by turning the autoencoder into a latent-variable model:\n- **Prior**: $p(z)=\\mathcal N(0, I)$. Generation is \"sample $z$ from the prior, decode it\".\n- **Decoder / likelihood**: $p_\\theta(x\\mid z)$, for example a Gaussian centred on the decoder output, or a Bernoulli per pixel.\n- **Encoder / approximate posterior**: $q_\\phi(z\\mid x)=\\mathcal N(\\mu_\\phi(x), \\mathrm{diag}\\,\\sigma^2_\\phi(x))$. The true posterior $p_\\theta(z\\mid x)$ is intractable, so we learn an approximation.\n\n%%flow The encoder outputs a distribution, not a point; the sample is drawn with external noise so gradients reach mu and sigma.\nx -(encoder)-> mu, log var -(z = mu + sigma * eps)-> *z -(decoder)-> x hat\n%%\n\n## The ELBO\nWe would like to maximise $\\log p_\\theta(x)=\\log\\int p_\\theta(x\\mid z)p(z)\\,dz$, but the integral over $z$ is intractable. For any $q$, Jensen's inequality gives a lower bound, the **evidence lower bound**:\n\n$$\\log p_\\theta(x) \\ge \\mathbb E_{q_\\phi(z\\mid x)}[\\log p_\\theta(x\\mid z)] - \\mathrm{KL}\\big(q_\\phi(z\\mid x)\\,\\|\\,p(z)\\big)$$\n\nThe two terms read naturally. The first is a reconstruction term: codes drawn from the encoder should decode back to $x$. The second is a regulariser: each input's code distribution should stay close to the prior, which packs the islands together into one smooth ball that the prior actually covers. The gap between the two sides is exactly $\\mathrm{KL}(q_\\phi(z\\mid x)\\,\\|\\,p_\\theta(z\\mid x))$, so maximising the ELBO over $\\phi$ also makes the encoder a better posterior approximation. (KL divergence itself is covered in AI Research, Math Fundamentals.)\n\nWith a Gaussian decoder of fixed variance $\\sigma_x^2$, $-\\log p_\\theta(x\\mid z)$ is $\\|x-\\hat x\\|^2/(2\\sigma_x^2)$ plus a constant, so the reconstruction term is a scaled MSE. The choice of $\\sigma_x$ silently sets the balance between the two terms; using plain MSE with weight 1 is a specific, often too-weak, choice of that balance.\n\n## Reparameterisation\nThe reconstruction term is an expectation over $z\\sim q_\\phi$, estimated with one sample per input. You cannot backpropagate through \"draw a random number\". The trick is to write the sample as a deterministic function of the parameters and independent noise:\n\n$$z = \\mu_\\phi(x) + \\sigma_\\phi(x)\\odot\\epsilon,\\qquad \\epsilon\\sim\\mathcal N(0, I)$$\n\nNow $\\partial z/\\partial\\mu = 1$ and $\\partial z/\\partial\\sigma=\\epsilon$, and the gradient is an ordinary pathwise derivative with low variance. This works for any distribution you can write as a differentiable transform of fixed noise; discrete latents need other tools (Gumbel-softmax, straight-through, or vector quantisation as in VQ-VAE).\n\n## KL to a standard Gaussian\nFor a diagonal Gaussian encoder and a standard normal prior the KL is a sum over latent dimensions with no sampling needed:\n\n$$\\mathrm{KL}=\\tfrac12\\sum_{j=1}^{d}\\left(\\mu_j^2+\\sigma_j^2-\\log\\sigma_j^2-1\\right)$$\n\nEach dimension pays for moving its mean away from 0 and for a variance different from 1. Networks predict $\\log\\sigma^2$ so the variance is always positive and the gradient is well behaved near zero.\n\n```python\nimport torch\ndef vae_loss(x, enc, dec):\n    mu, logvar = enc(x).chunk(2, dim=-1)          # (B, d) each\n    z = mu + torch.exp(0.5 * logvar) * torch.randn_like(mu)\n    x_hat = dec(z)\n    rec = ((x - x_hat) ** 2).sum(-1)               # Gaussian decoder, up to scale\n    kl = 0.5 * (mu**2 + logvar.exp() - logvar - 1).sum(-1)\n    return (rec + kl).mean()                       # negative ELBO per example\n```\n\nSum over dimensions inside each example and average over the batch. Averaging over pixels instead shrinks the reconstruction term by a factor of 784 and the model happily collapses onto the prior.\n\n! Example: KL for a 2-D code\n! The encoder outputs $\\mu=(1, 0)$ and $\\log\\sigma^2=(0, -2)$, so $\\sigma^2=(1, 0.135)$.\n! Dimension 1: $\\tfrac12(1+1-0-1)=0.5$ nats, paid only for the shifted mean.\n! Dimension 2: $\\tfrac12(0+0.135+2-1)=0.568$ nats, paid only for the narrow variance.\n! Total KL is 1.07 nats. A dimension the decoder does not use drifts to $\\mu=0,\\sigma=1$ and costs nothing, which is how a VAE switches off unneeded latents.\n\n## What goes wrong, and where VAEs are used\n| Symptom | Cause | Usual fix\n| Blurry samples | Gaussian likelihood averages plausible outputs; per-pixel independence | Better likelihoods, perceptual or adversarial losses, hierarchical latents\n| Posterior collapse | A powerful autoregressive decoder models $x$ alone, KL pushes $q$ to the prior | KL warm-up, \"free bits\" (a floor on per-dimension KL), weaker decoder\n| Ignored dimensions | KL cost exceeds reconstruction benefit | Usually fine; it is automatic dimension selection\n| Entangled factors | Nothing asks for disentanglement | $\\beta$-VAE ($\\beta>1$ on the KL), at a cost in reconstruction\n\nThe most important modern use of a VAE is as a **compressor for diffusion**. Latent diffusion (Stable Diffusion) trains a VAE with a small KL weight plus perceptual and adversarial losses that maps a 512x512x3 image to a 64x64x4 latent, and runs the diffusion process (lessons 07.03 to 07.07) in that latent space, which is 48 times smaller.\n\n> Takeaway: a VAE is an autoencoder whose encoder outputs a Gaussian, trained on the ELBO = reconstruction minus KL to the prior; reparameterisation makes the sample differentiable, and the closed-form KL keeps the code space dense enough that decoding prior samples produces real-looking data.","q":"You train a VAE on MNIST with the loss `F.mse_loss(x_hat, x) + kl.mean()`, where `mse_loss` averages over all 784 pixels and the KL is summed over 20 latent dimensions. Samples from the prior all look like the same grey blob. What happened, and how do you fix it?","s":"Averaging the reconstruction error over 784 pixels makes it about 784 times smaller than the per-image negative log-likelihood, while the KL is still summed over latent dimensions. The KL therefore dominates: the cheapest solution is to set $q(z\\mid x)$ equal to the prior for every input (KL = 0), so $z$ carries no information and the decoder learns to output the mean image. This is posterior collapse caused by mis-weighting, not by the model. Fix it by summing the reconstruction loss over pixels per image (equivalently, choosing a sensible decoder variance) and averaging over the batch, so both terms are per-example log-densities. KL warm-up or a free-bits floor helps if collapse persists. Check by watching per-dimension KL: active dimensions should sit well above zero.","r":[["Kingma and Welling: Auto-Encoding Variational Bayes","https://arxiv.org/abs/1312.6114","The original VAE paper: the ELBO, the reparameterisation trick and the closed-form Gaussian KL (appendix B)."],["Kingma and Welling: An Introduction to Variational Autoencoders","https://arxiv.org/abs/1906.02691","A longer, gentler monograph by the same authors; chapter 2 derives the ELBO gap and gradient estimators."],["Doersch: Tutorial on Variational Autoencoders","https://arxiv.org/abs/1606.05908","Intuition-first tutorial with conditional VAEs; good for the 'why does the code space become dense' picture."]],"k":["VAE","ELBO","reparameterisation"],"x":["PyTorch"],"p":["variational-autoencoder-forward-pass","reparameterized-gaussian-sample","diagonal-gaussian-kl-divergence","autoencoder-forward-pass","kl-divergence-discrete-and-continuous"],"ak":""},{"id":"07.02","t":"Generative adversarial networks","n":["A GAN trains a generator $G(z)$ against a discriminator $D(x)$ in the minimax game $\\min_G\\max_D\\ \\mathbb E[\\log D(x)]+\\mathbb E[\\log(1-D(G(z)))]$; no likelihood is ever computed.","At the optimal discriminator $D^*=p_\\text{data}/(p_\\text{data}+p_g)$ the generator minimises $2\\,\\mathrm{JSD}(p_\\text{data}\\|p_g)-\\log 4$.","Use the non-saturating generator loss $-\\log D(G(z))$: the original loss gives almost no gradient exactly when the generator is bad.","Instabilities (mode collapse, oscillation, a discriminator that wins outright) come from simultaneous gradient play and disjoint supports; WGAN-GP, spectral norm and R1 penalties tame them.","GANs are judged with sample statistics such as FID, the Fréchet distance between Inception-feature Gaussians of real and generated images."],"a":"## Two networks, one game\nA VAE needs an explicit likelihood $p_\\theta(x\\mid z)$, and the Gaussian choice is what makes its samples blurry. Goodfellow et al. (2014) avoided likelihoods altogether. A **generator** $G$ maps noise $z\\sim\\mathcal N(0,I)$ (often 100 or 512 dimensions) to a sample $G(z)$. A **discriminator** $D$ maps any sample to the probability that it is real. $D$ is trained as a binary classifier, real versus generated; $G$ is trained to fool it. The only learning signal $G$ ever receives is the gradient of $D$'s output with respect to the image.\n\n$$\\min_G\\max_D\\ V(D,G)=\\mathbb E_{x\\sim p_\\text{data}}[\\log D(x)]+\\mathbb E_{z\\sim p(z)}[\\log(1-D(G(z)))]$$\n\n%%flow G only sees the data through D's gradient; D sees both real and generated samples.\nNoise z -(generator)-> Fake image -> *Discriminator -(real or fake?)-> Loss\nReal image -> *Discriminator\n%%\n\n## What the game optimises\nFix $G$ and solve for the best discriminator pointwise: maximising $p_\\text{data}(x)\\log D + p_g(x)\\log(1-D)$ gives $D^*(x)=p_\\text{data}(x)/(p_\\text{data}(x)+p_g(x))$. Plug it back in and the generator's objective becomes $2\\,\\mathrm{JSD}(p_\\text{data}\\,\\|\\,p_g)-\\log 4$, minimised exactly when $p_g=p_\\text{data}$, where $D^*=\\tfrac12$ everywhere. So in the idealised infinite-capacity limit, a GAN is a Jensen-Shannon divergence minimiser.\n\nTwo facts in that derivation explain most practical trouble. First, it assumes $D$ is optimal at every step, which never holds; training is a simultaneous game, not minimisation of a fixed loss, and gradient descent on games can circle instead of converging. Second, real images live on thin low-dimensional manifolds. Early in training $p_g$ and $p_\\text{data}$ barely overlap, the JSD sits at its maximum $\\log 2$ no matter how close the manifolds are, and a near-perfect discriminator gives the generator a flat landscape.\n\n## The non-saturating loss\nWrite the discriminator output as $D=\\sigma(l)$ for a logit $l$. Early on, $D$ rejects fakes confidently, $l$ is very negative and $D(G(z))\\approx 0$. The minimax generator loss $\\log(1-\\sigma(l))$ has gradient $-\\sigma(l)$ with respect to $l$: nearly zero, exactly when the generator most needs to learn. The standard fix is to have $G$ maximise $\\log D(G(z))$ instead, whose gradient is $1-\\sigma(l)$, close to 1 in the same regime. Both losses share the same fixed point; only the dynamics differ.\n\n! Example: how much gradient each loss gives\n! Suppose $D(G(z))=0.01$, i.e. logit $l\\approx-4.6$.\n! Minimax loss $\\log(1-D)$: $|\\partial/\\partial l| = \\sigma(l) = 0.01$.\n! Non-saturating loss $-\\log D$: $|\\partial/\\partial l| = 1-\\sigma(l) = 0.99$.\n! The non-saturating version pushes the generator about 99 times harder at the start of training.\n\n```python\n# one training step, non-saturating GAN (BCE on logits)\nbce = torch.nn.BCEWithLogitsLoss()\nfake = G(torch.randn(B, z_dim))\nd_loss = bce(D(real), ones) + bce(D(fake.detach()), zeros)   # detach: no G grads here\nopt_d.zero_grad(); d_loss.backward(); opt_d.step()\ng_loss = bce(D(fake), ones)                                    # \"label fakes as real\"\nopt_g.zero_grad(); g_loss.backward(); opt_g.step()\n```\n\n## Training instabilities and the fixes that stuck\n| Failure | What you see | Why | Common remedy\n| Mode collapse | Many $z$ give the same few images | $G$ finds one output $D$ currently accepts; nothing penalises low diversity directly | Minibatch statistics, WGAN-style losses, larger batches\n| Oscillation | Losses swing, samples cycle between styles | Simultaneous gradient play rotates around the equilibrium | Lower learning rates, Adam with $\\beta_1=0$ to $0.5$, two time-scale updates (TTUR)\n| Discriminator wins | $D$ loss to 0, $G$ stops improving | Disjoint supports, $D$ too strong | Gradient penalties, spectral normalisation, data augmentation for $D$\n| Artefacts at scale | Checkerboards, broken textures | Transposed-conv upsampling, unstable normalisation | Resize-then-conv, careful architecture (DCGAN, StyleGAN)\n\nThe **Wasserstein GAN** (Arjovsky et al., 2017) replaces JSD with the earth mover's distance, which still varies smoothly when supports do not overlap. Its \"critic\" outputs an unbounded score and must be 1-Lipschitz; the original paper clipped weights to $\\pm 0.01$, and WGAN-GP replaced clipping with a penalty $\\lambda(\\|\\nabla_{\\hat x}D(\\hat x)\\|_2-1)^2$, $\\lambda=10$, on random interpolates between real and fake samples. **Spectral normalisation** divides each weight matrix by its largest singular value to bound $D$'s Lipschitz constant cheaply, and the **R1 penalty** (gradient norm on real data only) is the default in StyleGAN.\n\n## Evaluating samples\nWith no likelihood, you judge a GAN by statistics of its samples. The **Fréchet Inception Distance** embeds real and generated images with an Inception-v3 network, fits a Gaussian to each feature set, and computes $\\|\\mu_r-\\mu_g\\|^2+\\mathrm{Tr}(\\Sigma_r+\\Sigma_g-2(\\Sigma_r\\Sigma_g)^{1/2})$. Lower is better; it captures both quality and diversity, but it depends on sample count (use 50k), on the feature network and on preprocessing, so only compare FIDs computed the same way. Diffusion models (next lessons) have largely replaced GANs for image generation because their training is a plain regression with no game, but adversarial losses survive inside VAE tokenisers and in few-step distilled diffusion samplers.\n\n> Takeaway: a GAN trains a generator purely through a discriminator's gradient; the ideal game minimises Jensen-Shannon divergence, but in practice you need the non-saturating loss and Lipschitz control (WGAN-GP, spectral norm, R1) to keep the game from collapsing or cycling.","q":"Halfway through training, your GAN's discriminator loss drops to almost zero and stays there, and generated samples stop improving. Explain what the generator's gradient looks like in this state under the minimax loss and under the non-saturating loss, and name two changes that would restore a useful signal.","s":"A near-zero discriminator loss means $D(G(z))\\approx 0$ for fakes, so the logit is very negative. Under the minimax loss $\\log(1-D)$ the gradient with respect to the logit is $\\sigma(l)\\approx 0$, so the generator receives essentially nothing. The non-saturating loss $-\\log D$ gives a logit gradient near 1, but that only helps if $D$'s gradient with respect to the image is informative; when real and fake supports are disjoint and $D$ is a sharp classifier, $\\partial D/\\partial x$ can be tiny or point in unhelpful directions. Restoring signal means constraining $D$: add a gradient penalty (WGAN-GP on interpolates, or R1 on reals) or spectral normalisation so $D$ stays smooth, and/or weaken it (fewer $D$ steps, lower $D$ learning rate, augmentation of $D$'s inputs). Switching to a Wasserstein-style critic also keeps the loss informative when supports do not overlap.","r":[["Goodfellow et al.: Generative Adversarial Nets","https://arxiv.org/abs/1406.2661","The original paper: the minimax value, the optimal discriminator and the JSD result (section 4)."],["Goodfellow: NIPS 2016 Tutorial on GANs","https://arxiv.org/abs/1701.00160","Why the non-saturating loss, mode collapse, and practical tips from the inventor."],["Gulrajani et al.: Improved Training of Wasserstein GANs","https://arxiv.org/abs/1704.00028","WGAN-GP: why weight clipping fails and how the gradient penalty works."],["Heusel et al.: GANs Trained by a Two Time-Scale Update Rule","https://arxiv.org/abs/1706.08500","Introduces both TTUR and the FID metric."]],"k":["GAN","minimax","FID"],"x":["PyTorch"],"p":["gan-training-step","frechet-distance-between-feature-sets"],"ak":""},{"id":"07.03","t":"Diffusion: the forward process","n":["The forward process adds Gaussian noise in $T$ small steps: $q(x_t\\mid x_{t-1})=\\mathcal N(\\sqrt{1-\\beta_t}\\,x_{t-1},\\ \\beta_t I)$, with no learned parameters.","Because Gaussians compose, you can jump straight to any step: $x_t=\\sqrt{\\bar\\alpha_t}\\,x_0+\\sqrt{1-\\bar\\alpha_t}\\,\\epsilon$, where $\\bar\\alpha_t=\\prod_{s\\le t}(1-\\beta_s)$.","The $\\sqrt{1-\\beta_t}$ shrink keeps the variance at 1 ('variance preserving'), so the end point is close to $\\mathcal N(0,I)$ whatever the data.","The schedule is best read as signal-to-noise ratio $\\mathrm{SNR}(t)=\\bar\\alpha_t/(1-\\bar\\alpha_t)$; linear and cosine schedules differ mainly in how quickly SNR falls.","If $\\bar\\alpha_T$ is not essentially zero, training and sampling disagree at the last step; zero-terminal-SNR rescaling fixes it."],"a":"## The idea in one paragraph\nA diffusion model learns to generate data by learning to undo a fixed corruption. The **forward process** takes a clean image $x_0$ and adds a little Gaussian noise, then a little more, for $T$ steps (DDPM uses $T=1000$) until nothing of the image is left and $x_T$ is indistinguishable from pure noise. That process has no parameters and is trivial to run. The **reverse process**, a neural network, learns to remove the noise one step at a time (lesson 07.04). Generation then starts from fresh noise and runs the learned reverse chain (lesson 07.05). This lesson is about the forward half, because every formula in training and sampling is built from it.\n\n%%flow The forward chain is fixed and cheap; only the reverse chain is learned.\n[Forward, fixed] x0 data -(add noise)-> x1 -> ... -> *xT about N(0, I)\n[Reverse, learned] xT noise -(denoise)-> ... -> x1 -> *x0 sample\n%%\n\n## One step, and why the square root\nEach forward step is\n\n$$q(x_t\\mid x_{t-1})=\\mathcal N\\big(\\sqrt{1-\\beta_t}\\,x_{t-1},\\ \\beta_t I\\big),\\qquad x_t=\\sqrt{1-\\beta_t}\\,x_{t-1}+\\sqrt{\\beta_t}\\,\\epsilon_t$$\n\nwith a small $\\beta_t$ (DDPM: linear from $10^{-4}$ to $0.02$). The shrink factor $\\sqrt{1-\\beta_t}$ is not decoration. If $x_{t-1}$ has unit variance per pixel, then $x_t$ has variance $(1-\\beta_t)\\cdot 1+\\beta_t=1$. Without the shrink, variance would grow by $\\beta_t$ every step and the end point would depend on the data's scale. This is why images are scaled to $[-1, 1]$ first: the process assumes roughly unit-scale data.\n\n## Gaussian facts that give the closed form\nTwo facts do all the work:\n- A scaled Gaussian is Gaussian: $a\\epsilon\\sim\\mathcal N(0, a^2)$.\n- Independent Gaussians add by adding variances: $a\\epsilon_1+b\\epsilon_2 \\overset{d}{=} \\sqrt{a^2+b^2}\\,\\epsilon$.\n\nUnroll two steps with $\\alpha_t=1-\\beta_t$: $x_t=\\sqrt{\\alpha_t\\alpha_{t-1}}\\,x_{t-2}+\\sqrt{\\alpha_t(1-\\alpha_{t-1})}\\,\\epsilon_{t-1}+\\sqrt{1-\\alpha_t}\\,\\epsilon_t$. The two noise terms combine into one Gaussian with variance $\\alpha_t-\\alpha_t\\alpha_{t-1}+1-\\alpha_t=1-\\alpha_t\\alpha_{t-1}$. Repeating to $x_0$ with $\\bar\\alpha_t=\\prod_{s=1}^{t}\\alpha_s$:\n\n$$q(x_t\\mid x_0)=\\mathcal N\\big(\\sqrt{\\bar\\alpha_t}\\,x_0,\\ (1-\\bar\\alpha_t)I\\big),\\qquad x_t=\\sqrt{\\bar\\alpha_t}\\,x_0+\\sqrt{1-\\bar\\alpha_t}\\,\\epsilon$$\n\nThis closed form is the reason diffusion training is cheap. To make a training example at step 700 you do not run 700 noising steps; you draw one $\\epsilon$ and mix. It also means $x_t$ is just a weighted blend of signal and noise, with weights whose squares sum to 1.\n\n```python\nimport numpy as np\nT = 1000\nbetas = np.linspace(1e-4, 0.02, T)\nabar = np.cumprod(1.0 - betas)                       # abar[t-1] is alpha-bar at step t\ndef q_sample(x0, t, rng):                            # t in 1..T\n    eps = rng.standard_normal(x0.shape)\n    return np.sqrt(abar[t-1]) * x0 + np.sqrt(1 - abar[t-1]) * eps, eps\n```\n\n## Reading a schedule as signal-to-noise ratio\nDifferent papers parameterise schedules by $\\beta_t$, $\\bar\\alpha_t$, $\\sigma_t$ or log-SNR, but the quantity that matters is $\\mathrm{SNR}(t)=\\bar\\alpha_t/(1-\\bar\\alpha_t)$, the ratio of signal power to noise power at step $t$.\n\n| Step t | Linear: $\\bar\\alpha_t$ | Linear: SNR | Cosine: $\\bar\\alpha_t$\n| 100 | 0.897 | 8.7 | 0.972\n| 250 | 0.524 | 1.1 | 0.847\n| 500 | 0.079 | 0.085 | 0.494\n| 750 | 0.0034 | 0.0034 | 0.144\n| 1000 | 0.00004 | 0.00004 | about 0\n\nThe linear schedule is already at SNR 0.085 by the halfway point: for most of the second half the input is almost pure noise, so many training steps teach little. Nichol and Dhariwal's **cosine schedule** sets $\\bar\\alpha_t=f(t)/f(0)$ with $f(t)=\\cos^2\\!\\big(\\tfrac{t/T+s}{1+s}\\cdot\\tfrac{\\pi}{2}\\big)$, $s=0.008$, and clips $\\beta_t$ at 0.999. It destroys information more evenly, which matters most at low resolution where a little noise already hides a 32x32 image. Higher resolutions have more redundant pixels and want noisier schedules (shifted towards low SNR), which is why large-image models shift or rescale schedules.\n\n! Example: what the model sees at step 250\n! Linear schedule, $t=250$: $\\sqrt{\\bar\\alpha_t}=\\sqrt{0.524}=0.72$ and $\\sqrt{1-\\bar\\alpha_t}=0.69$.\n! A pixel with clean value 0.8 and noise draw $\\epsilon=-1.2$ becomes $0.72\\cdot0.8+0.69\\cdot(-1.2)=-0.25$.\n! SNR is 1.1, so signal and noise carry about equal power: shapes are visible, fine detail is gone.\n\n## The last step must be pure noise\nSampling starts from $x_T\\sim\\mathcal N(0,I)$, which is only correct if $q(x_T\\mid x_0)$ really is $\\mathcal N(0,I)$, i.e. $\\bar\\alpha_T=0$. Stable Diffusion's schedule ends at $\\bar\\alpha_T\\approx 0.0047$, so training inputs at $t=T$ still leak the image's mean brightness, while sampling inputs never contain that leak. Lin et al. (2023) showed this is why such models cannot produce very dark or very bright images, and fixed it by rescaling the schedule so $\\sqrt{\\bar\\alpha_T}=0$ exactly (which in turn requires v-prediction, lesson 07.04, since predicting $\\epsilon$ from pure noise is trivial and uninformative).\n\n> Takeaway: the forward process is a fixed variance-preserving noising chain whose marginal at any step has the closed form $x_t=\\sqrt{\\bar\\alpha_t}x_0+\\sqrt{1-\\bar\\alpha_t}\\epsilon$; choose and diagnose schedules by their SNR curve, and make sure the final step really is pure noise.","q":"A colleague removes the $\\sqrt{1-\\beta_t}$ factor and uses $x_t=x_{t-1}+\\sqrt{\\beta_t}\\,\\epsilon_t$ with the same linear $\\beta$ schedule, still starting sampling from $\\mathcal N(0, I)$. Using the Gaussian addition rule, what is the distribution of $x_T$ given $x_0$, and why does sampling now go wrong?","s":"Without the shrink, each step adds independent noise with variance $\\beta_t$ and leaves the signal untouched, so $x_T = x_0 + \\sqrt{\\sum_t\\beta_t}\\,\\epsilon$. For the linear schedule $\\sum\\beta_t \\approx 1000\\cdot(10^{-4}+0.02)/2\\approx 10.05$, so $x_T\\sim\\mathcal N(x_0, 10.05\\,I)$. Two problems follow. The signal is never removed: the SNR at $T$ is about $\\|x_0\\|^2/10$ per pixel, not zero, so $x_T$ still depends on the image. And the total variance is about 11 (data variance plus 10), not 1. Starting the reverse chain from $\\mathcal N(0, I)$ therefore feeds the model inputs from a distribution it never saw at $t=T$: wrong scale and no image component. This is the 'variance exploding' family, which can work, but only if you sample from $\\mathcal N(0,\\sigma_\\text{max}^2 I)$ with $\\sigma_\\text{max}$ much larger than the data scale, as in score SDE and EDM models.","r":[["Ho, Jain and Abbeel: Denoising Diffusion Probabilistic Models","https://arxiv.org/abs/2006.11239","Section 2 defines the forward process and the closed-form marginal used everywhere."],["Nichol and Dhariwal: Improved Denoising Diffusion Probabilistic Models","https://arxiv.org/abs/2102.09672","Section 3.2 introduces the cosine schedule and explains why linear wastes steps."],["Lin et al.: Common Diffusion Noise Schedules and Sample Steps are Flawed","https://arxiv.org/abs/2305.08891","The zero-terminal-SNR problem, the rescaling fix and why it needs v-prediction."],["Lilian Weng: What are Diffusion Models?","https://lilianweng.github.io/posts/2021-07-11-diffusion-models/","A careful derivation of every forward-process identity in one place."]],"k":["diffusion","noise schedule","SNR"],"x":["NumPy"],"p":["forward-diffusion-sample","linear-beta-schedule","cosine-noise-schedule","rescale-to-zero-terminal-snr"],"ak":""},{"id":"07.04","t":"Diffusion: the denoiser and its objective","n":["The reverse step is a Gaussian whose mean is written in terms of a predicted noise $\\epsilon_\\theta(x_t, t)$; the ELBO then reduces, up to weights, to $\\|\\epsilon-\\epsilon_\\theta(x_t,t)\\|^2$.","Training is one regression step: sample $x_0$, a step $t$, noise $\\epsilon$; build $x_t$ in closed form; regress the noise. No chain is ever unrolled.","$\\epsilon$, $x_0$ and $v=\\sqrt{\\bar\\alpha_t}\\,\\epsilon-\\sqrt{1-\\bar\\alpha_t}\\,x_0$ are interchangeable targets; they differ in loss weighting across noise levels and in behaviour near the ends of the schedule.","One network serves all $T$ steps, told which step it is through a sinusoidal timestep embedding injected into every residual block.","The classic denoiser is a U-Net with residual blocks, GroupNorm, SiLU and self-attention at low resolutions; transformers on patches (DiT) are the main alternative."],"a":"## What the network has to predict\nThe reverse process models each step as a Gaussian, $p_\\theta(x_{t-1}\\mid x_t)=\\mathcal N(\\mu_\\theta(x_t,t),\\ \\sigma_t^2 I)$. For small $\\beta_t$ the true reverse step is close to Gaussian, so this is a sound choice. The DDPM ELBO decomposes into one KL per step between the tractable posterior $q(x_{t-1}\\mid x_t, x_0)$ (lesson 07.05 gives its formula) and $p_\\theta(x_{t-1}\\mid x_t)$. Both are Gaussians with the same fixed variance, so each KL is just a scaled squared distance between means.\n\nHo et al. then made one substitution that defined the field. Since $x_t=\\sqrt{\\bar\\alpha_t}x_0+\\sqrt{1-\\bar\\alpha_t}\\epsilon$, knowing $\\epsilon$ is the same as knowing $x_0$. So write the mean in terms of a predicted noise:\n\n$$\\mu_\\theta(x_t,t)=\\frac{1}{\\sqrt{\\alpha_t}}\\Big(x_t-\\frac{\\beta_t}{\\sqrt{1-\\bar\\alpha_t}}\\,\\epsilon_\\theta(x_t,t)\\Big)$$\n\nThe per-step KL becomes a weighted $\\|\\epsilon-\\epsilon_\\theta\\|^2$. Dropping the weights gives the **simple loss**, which trained better than the true ELBO in their experiments:\n\n$$L_\\text{simple}=\\mathbb E_{x_0,\\,t\\sim U\\{1..T\\},\\,\\epsilon}\\ \\big\\|\\epsilon-\\epsilon_\\theta\\big(\\sqrt{\\bar\\alpha_t}x_0+\\sqrt{1-\\bar\\alpha_t}\\epsilon,\\ t\\big)\\big\\|^2$$\n\n%%flow One training step: no chain, just a random noise level and a regression target.\nx0 from data -(pick t, draw eps)-> xt closed form -(network)-> *eps hat -(MSE vs eps)-> Loss\n%%\n\n```python\ndef train_step(model, x0, abar, opt):              # x0: (B, C, H, W) in [-1, 1]\n    t = torch.randint(1, T + 1, (x0.shape[0],))\n    eps = torch.randn_like(x0)\n    a = abar[t - 1].view(-1, 1, 1, 1)\n    xt = a.sqrt() * x0 + (1 - a).sqrt() * eps\n    loss = ((model(xt, t) - eps) ** 2).mean()\n    opt.zero_grad(); loss.backward(); opt.step()\n    return loss.item()\n```\n\nThat is the entire training algorithm. Each example teaches the network one noise level, chosen uniformly; over many steps it lear
