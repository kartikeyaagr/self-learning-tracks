 a regression tree can never predict above the largest or below the smallest target in its training data.\n\n## Impurity: Gini and entropy\nTo grow a tree you need a score for how mixed a node is. With class proportions $p_k$ in a node, the two standard choices are:\n\n$$G = 1 - \\sum_k p_k^2 \\qquad H = -\\sum_k p_k \\log_2 p_k$$\n\nGini is the probability that two samples drawn at random from the node (with replacement) have different labels. Entropy is the expected number of bits needed to encode a label. Both are zero for a pure node and maximal for a uniform mix: for two classes, Gini peaks at 0.5 and entropy at 1 bit.\n\nA split sends $n_L$ of the node's $n$ samples left and $n_R$ right. Its quality is the impurity decrease\n\n$$\\Delta = I(\\text{parent}) - \\frac{n_L}{n} I(L) - \\frac{n_R}{n} I(R)$$\n\nWith entropy this decrease is called information gain. In practice the two criteria agree on the chosen split in the large majority of cases; Gini is slightly cheaper (no logarithm) and is the default in scikit-learn. Misclassification error, $1-\\max_k p_k$, is a poor splitting criterion because it is not strictly concave: many useful splits leave it unchanged.\n\n! Example: Gini vs entropy on one node\n! A node holds 10 samples: 6 positive, 4 negative. Gini = 1 − (0.36 + 0.16) = 0.48; entropy = 0.971 bits.\n! Split A sends 4 positives left (pure) and 2 positive / 4 negative right. Right Gini = 1 − (1/9 + 4/9) = 0.444, weighted 0.6 × 0.444 = 0.267, so the decrease is 0.213. Right entropy = 0.918, weighted 0.551, information gain 0.420.\n! Split B sends 4+/1− left and 2+/3− right. Weighted Gini = 0.5 × 0.32 + 0.5 × 0.48 = 0.40, decrease only 0.08.\n! Both criteria prefer A: it creates one pure child, which is exactly what concave impurity rewards.\n\n## Greedy splitting\nFinding the globally optimal tree is NP-hard, so CART (Classification and Regression Trees) grows the tree greedily, top down:\n1. At the current node, for each feature, sort the samples by that feature.\n2. Evaluate every threshold between consecutive distinct values (midpoints).\n3. Keep the (feature, threshold) pair with the largest impurity decrease.\n4. Split, then recurse on each child until a stopping rule fires (pure node, too few samples, maximum depth).\n\nSorting costs $O(n \\log n)$ per feature, and with running class counts each candidate threshold is scored in $O(1)$, so one node costs $O(d\\, n \\log n)$ for $d$ features. Summed over a balanced tree's levels this gives roughly $O(d\\, n \\log^2 n)$. Libraries such as LightGBM and scikit-learn's `HistGradientBoosting*` replace sorting with a histogram of at most 255 bins per feature, which turns each scan into $O(\\text{bins})$ after one pass over the data.\n\nGreedy means myopic. The classic failure is XOR: with two features where the label is $x_1 \\oplus x_2$, no single split reduces impurity, so a greedy tree with a minimum-gain rule may refuse to split at all even though a depth-2 tree is perfect.\n\n## Regression trees\nFor a continuous target, a leaf predicts the mean of its training targets, and impurity becomes the sum of squared errors (SSE). The best split maximises the drop in SSE, which is the same as maximising variance reduction. The prefix-sum trick makes this fast, because $\\text{SSE} = \\sum y^2 - (\\sum y)^2 / n$ for any contiguous block of sorted samples:\n\n```python\nimport numpy as np\n\ndef best_split(x, y):\n    # Best threshold on one feature for squared error. O(n log n).\n    o = np.argsort(x); x, y = x[o], y[o]\n    n = len(y); cs, cs2 = np.cumsum(y), np.cumsum(y * y)\n    nl = np.arange(1, n)                            # left size if we cut after i\n    sse_l = cs2[:-1] - cs[:-1] ** 2 / nl\n    sse_r = (cs2[-1] - cs2[:-1]) - (cs[-1] - cs[:-1]) ** 2 / (n - nl)\n    cost = np.where(x[1:] != x[:-1], sse_l + sse_r, np.inf)   # only between distinct values\n    i = int(np.argmin(cost))\n    return (x[i] + x[i + 1]) / 2, cost[i]\n```\n\nOther losses swap the leaf statistic: absolute error uses the median, Poisson deviance a mean on the log scale.\n\n## Strengths and failure modes\n| Property | Consequence |\n| Threshold splits | No feature scaling; robust to monotone transforms and outliers in inputs |\n| Axis-aligned boxes | A diagonal boundary like $x_1 > x_2$ needs a staircase of many splits |\n| Greedy, data-dependent | Small changes in data can change the root split and the whole tree (high variance) |\n| Constant leaves | Piecewise-constant predictions; no extrapolation outside the training target range |\n| Deep trees memorise | A fully grown tree reaches zero training error; lesson 04.02 deals with this |\n\nThose last three rows are the reason single trees are rarely the final model. Bagging (lesson 04.03) attacks the variance, and boosting (04.04 and 04.05) builds accurate models from many shallow trees.\n\n> Takeaway: a tree is greedy recursive partitioning: at each node, pick the feature and threshold that most reduce weighted impurity (Gini, entropy or SSE), and predict a constant in each leaf.","q":"You have a two-class problem where the label is 1 exactly when $x_1$ and $x_2$ have the same sign, with both features uniform on $[-1, 1]$. Will a CART tree with `min_impurity_decrease=0.01` learn it? What happens without that rule, and why?","s":"No. The label is an XOR pattern of the signs. Any single threshold on $x_1$ or on $x_2$ leaves each child with about half positives, so the expected Gini decrease at the root is close to zero (only sampling noise). A rule requiring a decrease of at least 0.01 will usually stop at the root and predict the majority class, giving about 50% accuracy. Without the rule, the tree splits on whichever threshold happens to look best through noise; once it has split near zero on one feature, the next split on the other feature near zero becomes very informative, so a depth-2 tree recovers the pattern. The lesson is that greedy splitting judges each split only by its immediate gain, so early stopping can block splits whose value appears only one level deeper. This is one argument for growing large and pruning afterwards.","r":[["scikit-learn User Guide: Decision Trees","https://scikit-learn.org/stable/modules/tree.html","Section 1.10.7 gives the exact impurity formulas and complexity; read the tips on practical use."],["The Elements of Statistical Learning (Hastie, Tibshirani, Friedman)","https://hastie.su.domains/ElemStatLearn/","Free PDF. Section 9.2 covers CART regression and classification trees and why misclassification error is a poor split criterion."],["An Introduction to Statistical Learning","https://www.statlearning.com/","Free PDF. Chapter 8.1 is a gentle walk through regression and classification trees with figures."]],"k":["CART","Gini impurity","information gain"],"x":["NumPy","scikit-learn"],"p":["decision-tree-classifier-cart","decision-tree-regressor"],"ak":""},{"id":"04.02","t":"Controlling tree complexity","n":["A tree grown until every leaf is pure has zero training error and very high variance; its complexity must be controlled either while growing (pre-pruning) or afterwards (post-pruning).","Pre-pruning knobs: `max_depth`, `min_samples_split`, `min_samples_leaf`, `max_leaf_nodes`, `min_impurity_decrease`. `min_samples_leaf` is usually the most robust single knob.","Cost-complexity pruning minimises $R_\\alpha(T) = R(T) + \\alpha\\,|T|$; weakest-link pruning produces a nested sequence of subtrees, one per range of $\\alpha$, and cross-validation picks $\\alpha$.","Post-pruning avoids the horizon effect of early stopping: a split with little immediate gain can enable valuable splits below it.","How much to control depends on the role of the tree: prune single trees, grow forest trees deep, keep boosting trees shallow."],"a":"## Why a full tree overfits\nLesson 04.01 grew a tree until a stopping rule fired. Without any rule, CART keeps splitting until every leaf is pure or holds identical feature values. With $n$ distinct training points that can mean close to $n$ leaves, each predicting the label of a single sample. Training error is zero, and the model is a lookup table with rectangular cells.\n\nIn bias-variance terms (module 01, lesson 02), a deep tree has very low bias and very high variance. Leaves with one or two samples copy label noise directly into predictions, and the greedy root split can change if a handful of samples move. The cure is to limit the number of leaves, which is the tree's measure of capacity. There are two ways to do that: stop early, or grow fully and cut back.\n\n## Pre-pruning: stopping rules\nStopping rules are cheap because they prevent the work from being done at all. The common ones in scikit-learn:\n\n| Parameter | Effect | Typical range |\n| `max_depth` | Caps the number of questions on any path; at most $2^{\\text{depth}}$ leaves | 3-12 for single trees |\n| `min_samples_split` | A node needs this many samples to be considered for a split | 2-50 |\n| `min_samples_leaf` | Every child must keep at least this many samples | 1-100, or a fraction like 0.01 |\n| `max_leaf_nodes` | Grows best-first and stops at this many leaves | 8-256 |\n| `min_impurity_decrease` | A split must reduce weighted impurity by at least this | 0-0.01 |\n\n`min_samples_leaf` is usually the most useful single knob. It directly limits how much a leaf can rely on a few noisy labels, it smooths regression trees (a leaf mean over 20 samples is far less noisy than over 1), and unlike `max_depth` it adapts to the data: dense regions can still be split finely while sparse regions stay coarse.\n\nThe weakness of every stopping rule is the horizon effect. A rule judges a split by its immediate gain, but some splits are only valuable because of what they enable below. The XOR example from lesson 04.01 is the extreme case. Post-pruning sidesteps this by looking at whole subtrees.\n\n## Cost-complexity pruning\nBreiman's CART book proposed growing a large tree $T_0$ and then pruning it with a penalty on size. For a subtree $T$ with $|T|$ leaves and training error (or impurity) $R(T)$, define\n\n$$R_\\alpha(T) = R(T) + \\alpha\\,|T|$$\n\nFor $\\alpha = 0$ the best subtree is $T_0$ itself; as $\\alpha$ grows, smaller trees win; for large enough $\\alpha$ only the root survives. The key result is that the optimal subtrees for increasing $\\alpha$ are nested, and they can be found by weakest-link pruning. For each internal node $t$ with subtree $T_t$, compute the penalty at which collapsing $t$ into a leaf breaks even:\n\n$$g(t) = \\frac{R(t) - R(T_t)}{|T_t| - 1}$$\n\nHere $R(t)$ is the error if $t$ were a leaf, and $|T_t| - 1$ is the number of leaves saved. Collapse the node with the smallest $g(t)$, recompute, and repeat until only the root is left. Each collapse gives the next tree in the sequence and the $\\alpha$ at which it becomes optimal.\n\n%%flow Cost-complexity pruning: grow big, generate a nested sequence of subtrees, and let validation pick one.\nGrow full tree T0 -(weakest link)-> Subtrees T1 ⊃ T2 ⊃ … -(CV score per α)-> *Pick α -(refit)-> Final tree\n%%\n\n! Example: one weakest-link step\n! Errors are weighted by the share of all training samples. Node A has a 3-leaf subtree with R(T_A) = 0.05; as a single leaf it would have R(A) = 0.11. So g(A) = (0.11 − 0.05) / (3 − 1) = 0.03.\n! Node B has a 2-leaf subtree with R(T_B) = 0.02 and R(B) = 0.04, so g(B) = 0.02 / 1 = 0.02.\n! B is the weakest link: it buys the least error reduction per extra leaf. It is collapsed first, at α = 0.02. A survives until α reaches 0.03 (after recomputing, since collapsing B can change other values).\n\n## Doing it in practice\nscikit-learn exposes the full pruning path and a `ccp_alpha` parameter. A standard recipe:\n\n```python\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.model_selection import cross_val_score\nimport numpy as np\n\npath = DecisionTreeClassifier(random_state=0).cost_complexity_pruning_path(X_tr, y_tr)\nalphas = path.ccp_alphas[:-1]                     # last alpha prunes to the root\nscores = [cross_val_score(DecisionTreeClassifier(ccp_alpha=a, random_state=0),\n                          X_tr, y_tr, cv=5).mean() for a in alphas]\nbest = alphas[int(np.argmax(scores))]\n```\n\nA common refinement is the one-standard-error rule: pick the largest $\\alpha$ (smallest tree) whose CV score is within one standard error of the best. It trades a statistically invisible amount of accuracy for a simpler, more stable tree. Cross-validation strategies themselves are covered in module 06.\n\nTwo cautions. First, `ccp_alpha` is on the scale of impurity, not of accuracy, so values like 0.001-0.02 are typical and a grid must be data-driven (the pruning path gives it). Second, pruning a tree that is going to be bagged or boosted is usually wasted effort, as the next section explains.\n\n## Complexity depends on the job\nThe right amount of control depends on what the tree is for:\n- **Single interpretable tree**: prune hard; a tree with 8-20 leaves can be read and checked by a domain expert.\n- **Random forest member**: grow deep (default `max_depth=None`), maybe with a small `min_samples_leaf`. Averaging (lesson 04.03) removes variance, so you want each tree to have low bias.\n- **Boosting member**: keep shallow (depth 3-8, or 15-63 leaves). Each tree only needs to fit a small correction, and deep trees make boosting overfit quickly (lesson 04.05).\n\n> Takeaway: control tree size with `min_samples_leaf`-style stopping rules or, better for a single tree, grow fully and pick a cost-complexity $\\alpha$ by cross-validation; ensembles change the target, with deep trees for bagging and shallow ones for boosting.","q":"Two configurations reach the same validation accuracy on a dataset with noisy labels: (a) `max_depth=6` and (b) `min_samples_leaf=25` with unlimited depth. The dataset has a dense region with 90% of samples and a sparse tail. Which would you expect to generalise better to next month's data, and why?","s":"Usually (b). `max_depth=6` caps every path at six questions regardless of how many samples a region holds. In the dense region that may be too coarse, and in the sparse tail it still allows leaves with just one to three samples, which copy label noise. `min_samples_leaf=25` ties capacity to the data: the dense region can be split finely because each leaf still has 25 or more samples, while the sparse tail stays coarse because no leaf may drop below 25 samples. Every leaf prediction is therefore an average over at least 25 labels, which bounds its variance. With noisy labels that is the property that matters for new data. Equal validation accuracy can hide this, so I would also compare the scores' variance across CV folds or bootstrap resamples, where (a) should look less stable.","r":[["scikit-learn example: Post pruning decision trees with cost complexity pruning","https://scikit-learn.org/stable/auto_examples/tree/plot_cost_complexity_pruning.html","Shows the pruning path, how leaves and depth shrink with alpha, and train vs test accuracy."],["scikit-learn User Guide: Decision Trees","https://scikit-learn.org/stable/modules/tree.html","Section on minimal cost-complexity pruning gives the exact definition of the effective alpha."],["The Elements of Statistical Learning","https://hastie.su.domains/ElemStatLearn/","Section 9.2.2 derives weakest-link pruning and cross-validating the penalty."]],"k":["pruning","overfitting"],"x":["scikit-learn"],"p":["decision-tree-classifier-cart","decision-tree-regressor","k-fold-cross-validation"],"ak":""},{"id":"04.03","t":"Bagging and random forests","n":["Averaging $B$ predictors with variance $\\sigma^2$ and pairwise correlation $\\rho$ gives variance $\\rho\\sigma^2 + (1-\\rho)\\sigma^2/B$: more trees kill the second term, only decorrelation shrinks the first.","Bagging trains each tree on a bootstrap sample (size $n$, with replacement). Each sample contains about 63.2% of the distinct points, because $(1-1/n)^n \\to e^{-1} \\approx 0.368$.","Random forests also sample a random subset of features at every split (classically $\\sqrt{d}$ for classification), which decorrelates trees that would otherwise all split on the same strong feature.","Out-of-bag (OOB) error scores each point using only trees that did not see it: a nearly free validation estimate.","Adding trees never causes overfitting in the usual sense, but returns diminish quickly; `max_features` and leaf size are the knobs that matter."],"a":"## Why averaging helps\nLesson 04.02 ended with a tension: deep trees have low bias but high variance. Bagging resolves it by averaging many deep trees. The arithmetic is worth knowing exactly. If each of $B$ predictors has variance $\\sigma^2$ and every pair has correlation $\\rho$, the variance of their average is\n\n$$\\operatorname{Var}\\Big(\\frac{1}{B}\\sum_{b=1}^{B} f_b(x)\\Big) = \\rho\\,\\sigma^2 + \\frac{1-\\rho}{B}\\,\\sigma^2$$\n\nThe second term goes to zero as you add trees. The first does not: it is a floor set by how similar the trees are. Bias is unchanged by averaging, since each tree has the same expected prediction. So an ensemble of averaged trees wants members that are individually low-bias (deep) and mutually as different as possible.\n\n! Example: why decorrelation beats more trees\n! Take σ² = 1 for a single deep tree's prediction at some point.\n! Plain bagging, trees correlated at ρ = 0.5, B = 100: variance = 0.5 + 0.5/100 = 0.505. Going to B = 1000 only reaches 0.5005.\n! A random forest that cuts correlation to ρ = 0.2, still B = 100: variance = 0.2 + 0.8/100 = 0.208.\n! Decorrelation more than halved the variance; a tenfold increase in trees bought almost nothing.\n\n## Bootstrap aggregation\nBreiman's bagging (1996) creates diversity by giving each tree a different dataset. Each tree is trained on a bootstrap sample: $n$ draws with replacement from the $n$ training points. The chance that a given point is never drawn is $(1 - 1/n)^n$, which tends to $e^{-1} \\approx 0.368$. So each bootstrap sample contains about 63.2% of the distinct points, some of them several times, and leaves out roughly a third.\n\nFor classification the ensemble either takes a majority vote or, better, averages the trees' class-probability estimates (scikit-learn does the latter). For regression it averages predictions.\n\n%%flow Random forest training and prediction. Trees are independent, so training is embarrassingly parallel.\nTraining set -(bootstrap b)-> Sample b -(random √d features per split)-> Deep tree b -(average over b)-> *Forest prediction\n%%\n\nBagging helps unstable learners: those whose output changes a lot when the data changes, such as deep trees. It does little for stable ones like linear regression or k-NN with large $k$, because their bootstrap replicas are nearly identical ($\\rho$ close to 1).\n\n## Random forests: feature subsampling\nBagged trees remain highly correlated when one or two features dominate: almost every bootstrap tree puts the same strong feature at the root and grows similar structure beneath it. Breiman's random forest (2001) adds a second source of randomness. At every split, only a random subset of `max_features` = $m$ features is considered. Classic defaults are $m = \\sqrt{d}$ for classification and $m = d/3$ for regression. In current scikit-learn, `RandomForestClassifier` uses `\"sqrt\"` but `RandomForestRegressor` defaults to all features (`1.0`), which makes it plain bagging unless you change it.\n\nSmaller $m$ lowers $\\rho$ but raises each tree's bias and variance, because trees sometimes have to split on weak features. The best $m$ is data-dependent and worth tuning. One failure mode is a dataset with a few informative features buried among hundreds of noise features: with $m = \\sqrt{d}$, many splits see only noise candidates, and the forest degrades. There, larger $m$ helps.\n\nExtremely randomised trees (Extra-Trees) push further: they also draw the threshold at random for each candidate feature and usually skip bootstrapping. They are faster to train and often equally accurate.\n\n## Out-of-bag error\nBecause each tree skipped about 37% of the data, each training point has roughly $0.37B$ trees that never saw it. Predicting each point with only those trees and scoring the result gives the out-of-bag (OOB) error. It behaves much like a cross-validation estimate, comes nearly free during training (`oob_score=True`), and is a convenient way to choose the number of trees or `max_features` on moderately sized data. With very few trees it is noisy, and some points may have no OOB trees at all.\n\n```python\nfrom sklearn.ensemble import RandomForestClassifier\nrf = RandomForestClassifier(n_estimators=500, max_features=\"sqrt\",\n                            min_samples_leaf=1, oob_score=True, n_jobs=-1, random_state=0)\nrf.fit(X_tr, y_tr)\nprint(rf.oob_score_)        # accuracy on out-of-bag predictions\n```\n\n## Practical behaviour and limits\n- **Number of trees**: error falls fast then flattens; 200-1000 is typical. More trees never make test error worse in expectation, but cost memory and latency linearly.\n- **Leaf size and depth**: defaults (fully grown) are strong; raise `min_samples_leaf` for noisy regression targets and smaller models.\n- **No extrapolation**: like single trees, a forest's predictions stay inside the training target range, which matters for trending time series.\n- **Size**: 500 deep trees on a million rows can occupy gigabytes. Capping `max_leaf_nodes` or depth shrinks models with little loss.\n- **Probabilities**: averaged leaf frequencies are typically under-confident near 0 and 1; calibrate if you need probabilities (module 03).\n\nRandom forests are a strong default baseline for tabular data: few critical hyperparameters, little tuning, and OOB error for free. Boosting (next two lessons) usually wins on accuracy once tuned.\n\n> Takeaway: averaging deep trees removes variance only down to the floor $\\rho\\sigma^2$, so random forests add per-split feature sampling to lower $\\rho$; bootstrapping also gives OOB error as a free validation estimate.","q":"A colleague's random forest regressor on 40 features barely beats a single tuned tree, and adding trees from 100 to 2000 changes nothing. They used scikit-learn defaults. What is the likely cause, and what would you change first?","s":"The flat curve with more trees says the variance term $(1-\\rho)\\sigma^2/B$ is already negligible; what remains is the correlation floor $\\rho\\sigma^2$ plus bias. With scikit-learn's `RandomForestRegressor`, the default `max_features=1.0` considers all 40 features at every split, so the model is plain bagging: if one or two features dominate, almost every tree has the same top splits and the trees are highly correlated. I would first lower `max_features`, trying values such as 0.33 (the classic $d/3$), `\"sqrt\"` and 0.5, and compare by OOB score. If that does not help, I would check `min_samples_leaf` (noisy targets favour larger leaves) and whether the problem needs extrapolation or a smooth trend, which no tree ensemble provides.","r":[["Breiman (2001): Random Forests","https://www.stat.berkeley.edu/~breiman/randomforest2001.pdf","The original paper: strength vs correlation bound, feature subsampling, OOB estimates."],["Breiman (1996): Bagging Predictors","https://www.stat.berkeley.edu/~breiman/bagging.pdf","Why bagging helps unstable procedures and does little for stable ones."],["scikit-learn User Guide: Ensembles (forests)","https://scikit-learn.org/stable/modules/ensemble.html","Section on random forests and Extra-Trees, including current max_features defaults and parameter advice."],["scikit-learn example: OOB errors for random forests","https://scikit-learn.org/stable/auto_examples/ensemble/plot_ensemble_oob.html","OOB error as a function of the number of trees for different max_features."]],"k":["bagging","random forest","OOB error"],"x":["scikit-learn"],"p":["random-forest","bagging-classifier","bootstrap-confidence-interval"],"ak":""},{"id":"04.04","t":"Boosting and AdaBoost","n":["Bagging trains strong learners in parallel to reduce variance; boosting trains weak learners in sequence, each focused on what the ensemble so far gets wrong, to reduce bias.","AdaBoost keeps a weight per sample. After each weak learner with weighted error $\\varepsilon_m$, it gives the learner a vote $\\alpha_m = \\tfrac12 \\ln\\frac{1-\\varepsilon_m}{\\varepsilon_m}$ and multiplies the weights of misclassified points by $e^{\\alpha_m}$.","After reweighting, the last learner has weighted error exactly 0.5, so the next learner is forced to find something new.","AdaBoost is forward stagewise additive modelling with exponential loss $e^{-yF(x)}$, whose minimiser is half the log-odds. That view generalises to gradient boosting.","Exponential loss punishes confident mistakes exponentially, so AdaBoost is fragile under label noise."],"a":"## From averaging to correcting\nBagging (lesson 04.03) builds many strong, independent models and averages away their variance. Boosting takes the opposite route: it builds many weak models in sequence, each one trained to fix the mistakes of the ensemble so far. A weak learner is anything slightly better than chance, and the canonical one is a decision stump, a tree with a single split. One stump is a terrible classifier; a weighted vote of a few hundred well-chosen stumps can be excellent. Boosting reduces bias first, and because the learners are dependent, it can also overfit if run too long, unlike bagging.\n\n| | Bagging / random forest | Boosting |\n| Base learner | Deep, low-bias tree | Shallow, high-bias tree or stump |\n| Training | Parallel, independent | Sequential, each depends on the last |\n| Main effect | Reduces variance | Reduces bias (and some variance) |\n| Too many rounds | Harmless, just slower | Can overfit; needs a stopping rule |\n| Label noise | Robust | AdaBoost in particular is sensitive |\n\n## The AdaBoost algorithm\nFreund and Schapire's AdaBoost (1997) for labels $y_i \\in \\{-1, +1\\}$:\n1. Start with uniform weights $w_i = 1/n$.\n2. For $m = 1, \\dots, M$: fit a weak learner $h_m$ to the weighted data, and compute its weighted error $\\varepsilon_m = \\sum_i w_i\\, [h_m(x_i) \\ne y_i]$.\n3. Give it a vote $\\alpha_m = \\tfrac12 \\ln\\big((1-\\varepsilon_m)/\\varepsilon_m\\big)$, which is positive whenever $\\varepsilon_m < 0.5$ and grows without bound as $\\varepsilon_m \\to 0$.\n4. Update $w_i \\leftarrow w_i \\exp(-\\alpha_m y_i h_m(x_i))$, then renormalise so the weights sum to 1. Misclassified points are multiplied by $e^{\\alpha_m}$, correct ones by $e^{-\\alpha_m}$.\n5. Predict with $\\operatorname{sign}\\big(F(x)\\big)$ where $F(x) = \\sum_m \\alpha_m h_m(x)$.\n\n%%flow One AdaBoost round. The sample weights carry all the information from previous rounds.\nWeights w -(fit stump)-> h_m -(weighted error ε)-> Vote α_m -(upweight mistakes)-> *New weights\n%%\n\nIf the weak learner cannot take weights directly, resample the training set in proportion to $w$ instead.\n\n! Example: one round in numbers\n! A stump has weighted error ε = 0.3. Its vote is α = ½ ln(0.7 / 0.3) = ½ ln 2.333 = 0.424.\n! Misclassified weights are multiplied by e^0.424 = 1.528 and correct ones by e^−0.424 = 0.655. Total misclassified weight becomes 0.3 × 1.528 = 0.458, total correct weight 0.7 × 0.655 = 0.458.\n! After normalisation each group holds exactly half the weight. The stump just fitted now has weighted error 0.5 on the new weights, so it is useless for the next round, which must find a different split.\n\nThat equalisation is the mechanism in one line: AdaBoost always moves the weights so that the newest learner looks like a coin flip.\n\n## Why it works: exponential loss\nFriedman, Hastie and Tibshirani (2000) showed that AdaBoost is forward stagewise additive modelling. At each round, it adds the term $\\alpha h$ that most reduces the exponential loss\n\n$$L(F) = \\sum_i \\exp\\big(-y_i F(x_i)\\big)$$\n\nholding earlier terms fixed. Writing $w_i \\propto \\exp(-y_i F_{m-1}(x_i))$, minimising over $h$ is exactly fitting the weighted classifier, and minimising over $\\alpha$ gives the formula above. The weights are just the current loss of each point.\n\nTwo consequences follow. First, the population minimiser of exponential loss is $F^*(x) = \\tfrac12 \\ln\\frac{P(y=1\\mid x)}{P(y=-1\\mid x)}$, half the log-odds, so $F$ can be turned into probabilities with $p = 1/(1+e^{-2F})$, although those probabilities are often poorly calibrated. Second, the training error is bounded by $\\prod_m 2\\sqrt{\\varepsilon_m(1-\\varepsilon_m)}$, which falls exponentially fast as long as every learner beats chance by some margin.\n\nPractitioners noticed that AdaBoost's test error often kept falling after training error hit zero. The margin explanation (Schapire et al.) is that later rounds keep increasing $y_i F(x_i)$, the confidence of correct predictions, and larger margins give better generalisation bounds. It does eventually overfit on noisy data.\n\n## Failure modes and variants\n- **Label noise**: a mislabelled point is misclassified round after round, its weight grows exponentially, and later learners contort themselves around it. Losses that grow linearly in the margin (log-loss, used by gradient boosting) are much more forgiving.\n- **Weak learner too weak or too strong**: if $\\varepsilon_m \\ge 0.5$, boosting stalls; if a learner reaches $\\varepsilon_m = 0$, $\\alpha_m$ is infinite, so implementations clip it. Deep trees overfit the weighted data and make boosting unstable.\n- **Multiclass**: requiring error below 0.5 is too strict with $K$ classes. SAMME uses $\\alpha_m = \\ln\\frac{1-\\varepsilon_m}{\\varepsilon_m} + \\ln(K-1)$, which only needs accuracy above $1/K$; this is what scikit-learn's `AdaBoostClassifier` implements.\n- **Learning rate**: scaling every $\\alpha_m$ by $\\nu < 1$ and using more rounds usually generalises better, as with gradient boosting.\n\n```python\nimport numpy as np\ndef adaboost(X, y, fit_stump, M=200):          # y in {-1, +1}\n    w = np.full(len(y), 1 / len(y)); model = []\n    for _ in range(M):\n        h = fit_stump(X, y, w); pred = h(X)\n        eps = np.clip(w[pred != y].sum(), 1e-10, 1 - 1e-10)\n        a = 0.5 * np.log((1 - eps) / eps)\n        w *= np.exp(-a * y * pred); w /= w.sum()\n        model.append((a, h))\n    return lambda Z: np.sign(sum(a * h(Z) for a, h in model))\n```\n\nStacking is a third ensemble pattern worth knowing: instead of fixed weights, a second-level model learns how to combine base models from their out-of-fold predictions. Lesson 04.05 generalises AdaBoost's idea to any differentiable loss.\n\n> Takeaway: AdaBoost fits weak learners in sequence, each on data reweighted towards current mistakes; it is greedy minimisation of exponential loss, which makes it powerful on clean data and fragile on noisy labels.","q":"Your AdaBoost model's training error reaches 0 after 50 rounds. On a dataset you know contains about 5% flipped labels, test error starts rising after round 200. Explain the mechanism, and give two changes that would help.","s":"Each flipped label sits in a region where the correct rule says the opposite, so most stumps misclassify it. Under exponential loss its weight is multiplied by $e^{\\alpha_m}$ almost every round, so after many rounds a few noisy points hold a large share of the total weight. Later stumps are then chosen mainly to classify those points, carving small regions around them that do not generalise, and test error rises. Two fixes: (1) switch to a loss that grows only linearly with negative margin, such as log-loss gradient boosting or LogitBoost, so a persistent mistake gains weight far more slowly; (2) regularise the existing model by using a learning rate below 1 together with early stopping on a validation set, which stops before the noise-chasing phase. Cleaning the labels or capping sample weights also helps.","r":[["Freund and Schapire (1997): A Decision-Theoretic Generalization of On-Line Learning and an Application to Boosting","https://doi.org/10.1006/jcss.1997.1504","The original AdaBoost paper and its training-error bound."],["Friedman, Hastie, Tibshirani (2000): Additive Logistic Regression","https://web.stanford.edu/~hastie/Papers/AdditiveLogisticRegression/alr.pdf","Shows AdaBoost is stagewise fitting of exponential loss; introduces LogitBoost."],["Schapire: Explaining AdaBoost","https://rob.schapire.net/papers/explaining-adaboost.pdf","Short survey of the different explanations, including margins and the noise problem."],["Zhu, Zou, Rosset, Hastie: Multi-class AdaBoost (SAMME)","https://hastie.su.domains/Papers/samme.pdf","The multiclass variant used by scikit-learn."]],"k":["boosting","AdaBoost","exponential loss"],"x":["NumPy","scikit-learn"],"p":["adaboost","stacking-ensemble","bagging-classifier"],"ak":""},{"id":"04.05","t":"Gradient boosting","n":["Gradient boosting is gradient descent in function space: each new tree fits the negative gradient of the loss with respect to the current predictions (the pseudo-residuals), and is added with a small step size.","For squared error the pseudo-residuals are ordinary residuals $y - F$; for log-loss they are $y - p$. The same algorithm handles any differentiable loss.","Shrinkage (learning rate 0.01-0.1) plus many trees plus early stopping is the main regulariser; row and column subsampling add more.","XGBoost uses a second-order expansion: a leaf's weight is $w^* = -G/(H+\\lambda)$ and a split's gain compares $G^2/(H+\\lambda)$ before and after, with a penalty $\\gamma$ per leaf.","LightGBM and scikit-learn's HistGradientBoosting bin features into at most 255 bins and grow trees leaf-wise, which makes training on millions of rows fast."],"a":"## Boosting as gradient descent\nAdaBoost (lesson 04.04) turned out to be stagewise minimisation of one particular loss. Friedman (2001) asked the general question: for any differentiable loss $L(y, F)$, how do you add one tree at a time to reduce $\\sum_i L(y_i, F(x_i))$?\n\nThink of the vector of predictions $(F(x_1), \\dots, F(x_n))$ as the parameters. Gradient descent would move it along the negative gradient, whose $i$-th component is\n\n$$r_i = -\\frac{\\partial L(y_i, F(x_i))}{\\partial F(x_i)}$$\n\nBut we need a function that also works on new inputs, not just $n$ numbers. So we fit a regression tree $h_m$ to the targets $r_i$ (the pseudo-residuals), which gives the gradient direction as a function of $x$, and take a step:\n\n$$F_m(x) = F_{m-1}(x) + \\nu\\, h_m(x)$$\n\nThe learning rate (shrinkage) $\\nu$ is typically 0.01-0.1. After fitting the tree's structure, each leaf's value is usually re-optimised for the actual loss (a line search per leaf), since the tree was fitted to gradients with squared error.\n\n%%flow Gradient boosting loop. The tree only ever sees pseudo-residuals, so the loss can be anything differentiable.\nCurrent F -(gradient of loss)-> Pseudo-residuals r -(fit small tree)-> h_m -(F += ν·h_m)-> *Updated F\n%%\n\n## Losses and their residuals\n| Loss | $L(y, F)$ | Pseudo-residual $r$ | Initial $F_0$ |\n| Squared error | $\\tfrac12 (y-F)^2$ | $y - F$ | mean of $y$ |\n| Absolute error | $\\lvert y - F\\rvert$ | $\\operatorname{sign}(y - F)$ | median of $y$ |\n| Log-loss, $y \\in \\{0,1\\}$ | $-y\\ln p - (1-y)\\ln(1-p)$, $p = \\sigma(F)$ | $y - p$ | log-odds of base rate |\n| Huber | quadratic near 0, linear in tails | clipped residual | median |\n\nFor log-loss, $F$ is the log-odds, and the optimal leaf value is a Newton step: $\\sum r_i / \\sum p_i(1-p_i)$ over the leaf's samples. Robust losses limit the influence of outliers, which addresses the noise sensitivity of exponential loss.\n\n! Example: two rounds with squared error\n! Targets y = [3, 5, 10]. Start at F0 = mean = 6, so residuals are [−3, −1, 4].\n! A stump separates the third point: leaf values are the mean residuals, −2 for the first two and 4 for the third.\n! With ν = 0.1, F1 = [6 − 0.2, 6 − 0.2, 6 + 0.4] = [5.8, 5.8, 6.4]. New residuals [−2.8, −0.8, 3.6] are only slightly smaller.\n! It takes many small steps to fit the data. That slowness is the point: each tree contributes a little, so no single tree's errors dominate.\n\n## Regularisation\nGradient boosting overfits if run for too long, so its knobs interact:\n- **Learning rate and number of trees** trade off almost exactly: halving $\\nu$ roughly doubles the trees needed. Smaller $\\nu$ almost always generalises a little better, at the cost of training time.\n- **Early stopping**: hold out a validation set and stop when its loss has not improved for, say, 50 rounds. This makes the number of trees a fitted quantity rather than a guess.\n- **Tree size**: depth 3-8 or 15-63 leaves. Depth controls the order of interactions the model can represent per tree.\n- **Subsampling**: fitting each tree on a random 50-80% of rows (stochastic gradient boosting, Friedman 2002) and a fraction of columns both reduce variance and speed training.\n- **Leaf constraints**: minimum samples or minimum hessian sum per leaf, and L2 penalties on leaf values.\n\n## XGBoost: a second-order view\nXGBoost (Chen and Guestrin, 2016) writes the objective at round $m$ with a second-order Taylor expansion. Let $g_i$ and $h_i$ be the first and second derivatives of the loss at the current prediction, and add a penalty $\\gamma T + \\tfrac12 \\lambda \\sum_j w_j^2$ for a tree with $T$ leaves and leaf weights $w_j$. For a fixed structure, with $G_j = \\sum_{i \\in j} g_i$ and $H_j = \\sum_{i \\in j} h_i$, the optimum is closed form:\n\n$$w_j^* = -\\frac{G_j}{H_j + \\lambda} \\qquad \\text{Gain} = \\frac12\\Big[\\frac{G_L^2}{H_L+\\lambda} + \\frac{G_R^2}{H_R+\\lambda} - \\frac{(G_L+G_R)^2}{H_L+H_R+\\lambda}\\Big] - \\gamma$$\n\nSplits are scored with this gain, and a split that does not beat $\\gamma$ is not made. For squared error, $h_i = 1$ and $H$ is the sample count, so $\\lambda$ shrinks small leaves towards zero: a leaf with one residual of 4 gets weight $4/(1+1) = 2$ when $\\lambda = 1$, not 4. For log-loss, $h_i = p_i(1-p_i)$, recovering the Newton step above.\n\n## Making it fast: histograms and leaf-wise growth\nThe expensive part is split finding. Modern libraries bucket each feature into at most 255 quantile bins once, then build per-node histograms of $(G, H)$ and scan bins instead of sorted values. A useful trick: a child's histogram equals the parent's minus its sibling's, so only the smaller child needs a pass over data.\n\n| Library | Distinctive ideas |\n| XGBoost | Second-order objective with $\\lambda$, $\\gamma$; sparsity-aware default directions for missing values; `hist` tree method |\n| LightGBM | Histograms; leaf-wise (best-first) growth capped by `num_leaves`; GOSS keeps large-gradient rows and samples small ones; bundles mutually exclusive sparse features |\n| CatBoost | Symmetric (oblivious) trees; ordered boosting and ordered target statistics to avoid target leakage with categorical features |\n| scikit-learn `HistGradientBoosting*` | LightGBM-style histograms, native missing values and categoricals, built-in early stopping |\n\nLeaf-wise growth reaches lower loss with the same number of leaves than depth-wise growth, but can grow deep, narrow branches on small data; cap `num_leaves` and set `min_child_samples`. All four handle missing values natively by learning which side of each split they go to.\n\n> Takeaway: gradient boosting adds small trees fitted to the negative gradient of any differentiable loss; tune the learning rate, tree size and subsampling, and let early stopping pick the number of trees.","q":"You train LightGBM with `learning_rate=0.3`, `num_leaves=255` on 20,000 rows and see validation loss bottom out at round 40 and then climb. Your manager suggests reducing the number of trees to 40. Is that the best fix? What would you change and why?","s":"Stopping at 40 trees is better than training to 1,000, but it keeps a model built from 40 large, aggressive steps. Each tree has up to 255 leaves fitted on 20,000 rows, so many leaves contain few samples and fit noise. At a learning rate of 0.3 each of those noisy trees also makes a large change to the predictions. Better: lower the learning rate to about 0.05 and let early stopping choose the number of trees (it will now be several hundred); shrink `num_leaves` to 15-63 and raise `min_child_samples` so leaves average over more rows; add row and column subsampling (`bagging_fraction`, `feature_fraction` around 0.7-0.8) and perhaps `lambda_l2`. Many small, regularised steps usually reach a lower minimum of validation loss than a few large ones, not just the same minimum reached sooner.","r":[["Friedman (2001): Greedy Function Approximation: A Gradient Boosting Machine","https://doi.org/10.1214/aos/1013203451","The original gradient boosting paper: pseudo-residuals, per-leaf line search, shrinkage."],["Chen and Guestrin (2016): XGBoost: A Scalable Tree Boosting System","https://arxiv.org/abs/1603.02754","Section 2 derives the second-order leaf weights and split gain."],["XGBoost docs: Introduction to Boosted Trees","https://xgboost.readthedocs.io/en/stable/tutorials/model.html","A clean derivation of the regularised objective and structure score."],["LightGBM docs: Features","https://lightgbm.readthedocs.io/en/stable/Features.html","Histogram algorithm, leaf-wise growth, and how categorical and missing values are handled."]],"k":["gradient boosting","XGBoost","LightGBM"],"x":["XGBoost","LightGBM","scikit-learn"],"p":["gradient-boosted-regressor","decision-tree-regressor"],"ak":""},{"id":"04.06","t":"Interpreting tree models","n":["Impurity-based importance (MDI) sums each feature's weighted impurity decrease over all splits. It is free, but computed on training data and biased towards continuous and high-cardinality features.","Permutation importance shuffles one column of held-out data and measures the drop in score. It is model-agnostic and reflects generalisation, but correlated features share or hide importance.","Partial dependence averages predictions while forcing one feature to each value: it shows the average effect, but extrapolates into impossible feature combinations when features are correlated.","ICE curves show the per-sample lines behind a PD plot and reveal interactions that averaging hides; SHAP (TreeSHAP) gives exact per-prediction attributions for tree ensembles.","Importance measures describe the model, not the world: an important feature is one the model uses, which is not evidence of causation."],"a":"## Three questions, three tools\nTrees and ensembles are often deployed where someone asks \"why?\". This last lesson of the module separates three questions that people tend to blur together:\n- **Which features does the model rely on?** Global importance: MDI or permutation importance.\n- **How does the prediction change with a feature?** Effect curves: partial dependence and ICE.\n- **Why did this one prediction come out this way?** Local attribution: SHAP values.\n\nEach tool answers only its own question, and each has a known way of misleading you.\n\n## Impurity-based importance (MDI)\nEvery split in a tree reduces impurity by some amount, weighted by the fraction of samples reaching that node. Mean decrease in impurity (MDI) adds these up per feature, averages over the trees, and normalises to sum to 1. scikit-learn exposes it as `feature_importances_`.\n\nIt is free and often reasonable, but it has two structural biases:\n1. **Cardinality bias**: a feature with many distinct values offers many candidate thresholds, so by chance alone it finds splits that reduce training impurity. A random numeric column or a customer ID can get substantial MDI.\n2. **Training-data scores**: MDI measures how much a feature helped fit the training set, including fitting noise. Deep forests that memorise give importance to features that do not generalise.\n\nStrobl et al. (2007) documented the bias; the practical rule is to treat MDI as a quick first look and confirm with permutation importance.\n\n## Permutation importance\nThe idea: if the model relies on feature $j$, destroying the information in $j$ should hurt. Take a held-out set, record the score $s$, shuffle column $j$ (breaking its relation with the target and other features while keeping its distribution), and record the new score $s_j$. The importance is $s - s_j$, averaged over several shuffles.\n\n%%flow Permutation importance for one feature. Repeat for each feature and several shuffles; the model is never retrained.\nValidation set -(score)-> Baseline s -(shuffle column j)-> Corrupted set -(score)-> *Importance s − s_j\n%%\n\n```python\nfrom sklearn.inspection import permutation_importance\nres = permutation_importance(model, X_val, y_val, scoring=\"roc_auc\",\n                             n_repeats=10, random_state=0, n_jobs=-1)\norder = res.importances_mean.argsort()[::-1]   # report mean ± std per feature\n```\n\nCost is $d \\times$ `n_repeats` predictions over the validation set; no retraining. It works for any model and any metric.\n\nThe main failure is **correlated features**. If `height_cm` and `height_in` are both present, shuffling one leaves the other intact, so the model barely suffers and both look unimportant. Worse, shuffling one creates rows such as 190 cm alongside 60 in, which the model never saw, so the importance partly measures behaviour on impossible inputs. Remedies: cluster correlated features (for example by Spearman correlation) and permute or drop whole groups, or use drop-column importance (retrain without the feature), which is honest but costs one fit per feature.\n\n! Example: reading permutation importances\n! A churn model has validation AUC 0.84. Shuffling `tenure_months` drops it to 0.71 (importance 0.13 ± 0.01); shuffling `contract_type` gives 0.80 (0.04 ± 0.01); shuffling `account_id` gives 0.84 (0.00 ± 0.002).\n! MDI on the same forest ranked `account_id` third, because it has 50,000 distinct values and the deep trees used it to memorise. Permutation importance on held-out data correctly shows it carries no generalisable signal: drop it.\n! If `tenure_months` and `total_charges` were 0.9 correlated, their individual importances would understate the pair; permuting both together would show the joint effect.\n\n## Partial dependence and ICE\nImportance says how much; effect curves say how. The partial dependence of the prediction on a feature $x_S$ is\n\n$$\\mathrm{PD}(v) = \\frac{1}{n}\\sum_{i=1}^{n} f\\big(x_S = v,\\ x_C^{(i)}\\big)$$\n\nthat is, set feature $S$ to the value $v$ in every row, keep the other features $x_C$ as they are, and average the predictions. Plotting over a grid of $v$ shows the model's average response.\n\nAn individual conditional expectation (ICE) curve is the same computation for a single row, before averaging. Plotting a few hundred ICE lines under the PD line reveals heterogeneity: if half the lines rise and half fall, the PD line is flat even though the feature matters a lot through an interaction.\n\nPartial dependence shares the correlated-feature trap: forcing `age = 20` onto rows with `years_employed = 35` asks the model about inputs that do not exist, and trees answer such questions arbitrarily. Accumulated local effects (ALE) plots average differences only within narrow bins of the actual data and avoid most of this. Either way, a PD curve is a description of the fitted function, not of what would happen if you intervened on the feature.\n\n## Local attributions: SHAP\nShapley values from game theory split one prediction, relative to the average prediction, into additive contributions per feature, with consistency guarantees. They are expensive in general, but TreeSHAP (Lundberg et al.) computes them exactly for tree ensembles in polynomial time, $O(T L D^2)$ for $T$ trees, $L$ leaves and depth $D$, so it is practical for XGBoost, LightGBM and forests. Averaging $\\lvert\\phi_j\\rvert$ over rows gives a global importance that, unlike MDI, does not favour high-cardinality features by construction; a SHAP dependence plot (feature value against $\\phi_j$) is a per-row alternative to PD.\n\n| Method | Question | Data used | Main pitfall |\n| MDI | Global reliance | Training | High-cardinality bias, training noise |\n| Permutation | Global reliance | Held-out | Correlated features, off-manifold rows |\n| PD / ICE | Average and per-row effect | Any | Extrapolation with correlated features |\n| TreeSHAP | Per-prediction attribution | Any | Still describes the model, not causation |\n\n> Takeaway: prefer permutation importance on held-out data over impurity importance, check correlated features before trusting either, and read PD/ICE and SHAP as descriptions of the model's behaviour, not causal effects.","q":"A random forest predicting house prices ranks `listing_id` (a unique integer) second by `feature_importances_`, while `sqft_living` and `sqft_above` (correlation 0.88) both rank low by permutation importance. Explain both observations and what you would report.","s":"`listing_id` ranks high under MDI because it is a continuous-looking feature with a distinct value per row. Deep trees can always find thresholds on it that reduce training impurity, effectively memorising individual houses, and MDI credits those splits even though they do not generalise. Its permutation importance on held-out data should be near zero, and I would drop it. The two square-footage features both look weak under permutation because they carry largely the same information: shuffling one leaves the other available, so the score barely drops. Shuffling also creates implausible pairs, such as a large living area with a tiny above-ground area. I would report importance for the group: permute both columns together, or cluster correlated features and keep one representative. I would state clearly that the size signal is strong, but that splitting it between the two features is not well defined.","r":[["scikit-learn User Guide: Permutation feature importance","https://scikit-learn.org/stable/modules/permutation_importance.html","Algorithm, its relation to MDI, and the correlated-feature caveat."],["scikit-learn User Guide: Partial dependence and ICE plots","https://scikit-learn.org/stable/modules/partial_dependence.html","Definitions, the brute vs recursion methods for trees, and interpretation limits."],["Strobl et al. (2007): Bias in random forest variable importance measures","https://bmcbioinformatics.biomedcentral.com/articles/10.1186/1471-2105-8-25","Shows MDI's preference for features with many categories or values."],["Lundberg, Erion, Lee: Consistent Individualized Feature Attribution for Tree Ensembles","https://arxiv.org/abs/1802.03888","The TreeSHAP algorithm and why gain-based importances can be inconsistent."]],"k":["feature importance","partial dependence","SHAP"],"x":["scikit-learn","SHAP"],"p":["permutation-feature-importance","random-forest"],"ak":""}]},{"n":"05","name":"Unsupervised learning","lessons":[{"id":"05.01","t":"k-means","n":["Unsupervised learning finds structure without labels: groups (clustering), densities (mixtures, anomaly scores) and low-dimensional coordinates (projections). Every method encodes an assumption about what structure means.","k-means minimises inertia $\\sum_i \\lVert x_i - \\mu_{c(i)}\\rVert^2$. Lloyd's algorithm alternates assigning points to the nearest centre and moving each centre to its cluster mean; neither step can increase inertia.","Lloyd converges in finitely many steps but only to a local minimum, so initialisation matters. k-means++ picks each new seed with probability proportional to squared distance from the nearest existing seed.","k-means assumes roughly spherical, similarly sized clusters in a space where Euclidean distance is meaningful: standardise features first, and expect it to fail on elongated or nested shapes.","Choosing $k$ has no single answer: inertia always falls with $k$, so look for an elbow, use silhouette or the gap statistic, or pick $k$ by the downstream task."],"a":"## Unsupervised learning in one page\nModules 01-04 learned a mapping from features to a label. This module drops the label. The data is just $n$ points in $d$ dimensions, and the goal is to describe its structure:\n- **Clustering**: which points belong together (k-means here, hierarchical and DBSCAN in 05.02, mixtures in 05.03).\n- **Dimensionality reduction**: a few coordinates that keep what matters (05.04).\n- **Anomaly detection**: which points do not fit (05.05).\n- **Evaluation**: without labels, how do you know any of it is good (05.06)?\n\nThere is no ground truth to optimise, so every method bakes in a definition of structure. k-means says a cluster is a set of points close to a common centre.\n\n## The objective and Lloyd's algorithm\nGiven $k$, k-means seeks centres $\\mu_1, \\dots, \\mu_k$ and an assignment $c(i)$ of each point that minimise the within-cluster sum of squares, called inertia:\n\n$$J = \\sum_{i=1}^{n} \\lVert x_i - \\mu_{c(i)} \\rVert^2$$\n\nFinding the global minimum is NP-hard even for $k = 2$ in general dimension. Lloyd's algorithm finds a local minimum by alternating two easy steps:\n1. **Assign**: put each point in the cluster of its nearest centre. For fixed centres this is the best possible assignment.\n2. **Update**: move each centre to the mean of its points. For a fixed assignment the mean minimises squared distance.\n\n%%flow Lloyd's algorithm. Each step can only lower J, and there are finitely many assignments, so it must stop.\nSeeds (k-means++) -> Assign to nearest centre -> Move centres to means -(assignments changed?)-> *Converged\n%%\n\nSince neither step can increase $J$ and there are finitely many partitions, the algorithm terminates, usually in 10-100 iterations. Each iteration costs $O(nkd)$. For large $n$, mini-batch k-means updates centres from small random batches and is far faster for a small loss in inertia.\n\n```python\nimport numpy as np\ndef lloyd(X, C, iters=100):\n    for _ in range(iters):\n        d2 = ((X[:, None, :] - C[None, :, :]) ** 2).sum(-1)   # (n, k) squared distances\n        a = d2.argmin(1)\n        newC = np.array([X[a == j].mean(0) if np.any(a == j) else C[j] for j in range(len(C))])\n        if np.allclose(newC, C): break\n        C = newC\n    return C, a, d2[np.arange(len(X)), a].sum()            # centres, labels, inertia\n```\n\nThe `if np.any(a == j)` guard handles empty clusters; libraries instead re-seed an empty centre at a far-away point.\n\n## Seeding with k-means++\nLloyd's local minimum depends heavily on the starting centres. Random points from the data often put two seeds in one true cluster and none in another, and Lloyd cannot fix that because centres move only locally. k-means++ (Arthur and Vassilvitskii, 2007) spreads the seeds out:\n1. Pick the first centre uniformly at random from the data.\n2. For every point, let $D(x)$ be the distance to the nearest centre chosen so far.\n3. Pick the next centre with probability proportional to $D(x)^2$. Repeat until there are $k$.\n\nThis seeding alone is $O(\\log k)$-competitive with the optimal inertia in expectation, and in practice it also speeds Lloyd's convergence. Libraries add restarts too (`n_init`): run several seedings and keep the lowest inertia.\n\n! Example: why squared-distance seeding finds the other cluster\n! One-dimensional data: 1, 2, 3, 10, 11, 12, with k = 2. Suppose the first seed is 1.\n! Squared distances to it: 2 → 1, 3 → 4, 10 → 81, 11 → 100, 12 → 121. Total 307.\n! The chance the second seed lands in {10, 11, 12} is 302 / 307 ≈ 98.4%. Uniform seeding would give 3/5 = 60%.\n! From seeds 1 and 11, one Lloyd pass gives centres 2 and 11, the optimum, with inertia 4.\n\n## What k-means assumes\nk-means is equivalent to a Gaussian mixture with equal, spherical covariances and hard assignments (lesson 05.03 makes this precise). Its failures follow from that:\n- **Scale**: distances mix units, so a feature in dollars swamps one in years. Standardise or otherwise choose a meaningful metric first.\n- **Shape**: boundaries between clusters are straight lines (a Voronoi diagram), so elongated, curved or nested clusters get split or merged. Use DBSCAN, spectral clustering or a full-covariance GMM.\n- **Size and density**: inertia favours splitting a large, spread cluster over keeping a small tight one separate.\n- **Outliers**: means are pulled by extreme points; k-medoids (centres must be data points, any distance) is more robust.\n- **Dimensionality**: in hundreds of dimensions distances concentrate; reduce with PCA first (05.04).\n\n## Choosing k\nInertia always decreases as $k$ grows (reaching 0 at $k = n$), so it cannot pick $k$ by itself. Common tools:\n- **Elbow**: plot inertia against $k$ and look for the bend where gains flatten. Often there is no clear bend.\n- **Silhouette**: average how much closer each point is to its own cluster than to the next one, and choose the $k$ with the highest score (05.06).\n- **Gap statistic**: compare $\\log J_k$ with its expected value on uniform reference data, and pick the smallest $k$ where the gap stops growing meaningfully.\n- **The task**: if clusters feed a product (customer segments, a codebook for vector quantisation), choose the $k$ that serves it: segments a team can act on, or the compression-quality trade-off.\n\n> Takeaway: k-means alternates nearest-centre assignment and mean updates to reach a local minimum of inertia; seed with k-means++, run several restarts, standardise features, and choose $k$ with a criterion other than raw inertia.","q":"You run k-means with $k=3$ on customers described by `annual_spend` (0-200,000) and `visits_per_month` (0-30). The clusters turn out to be three bands of spend, and visits are ignored entirely. Explain why, and how you would fix it. Would running more restarts help?","s":"Inertia is a sum of squared Euclidean distances, so the feature with the largest numeric range dominates. Differences in spend are thousands of times larger than differences in visits, so the cheapest way to lower inertia is to slice the data along spend; visits barely change any distance. More restarts would not help: they find better local minima of the same objective, and this result may well be the global minimum of a badly scaled objective. The fix is to make distances meaningful: standardise each feature (or use a robust scaler if spend is heavily skewed, perhaps after a log transform), or weight features by how much they should matter to the business. After rescaling, I would re-run with k-means++ seeding and several restarts, and compare $k$ values with silhouette scores and with whether the segments are useful.","r":[["Arthur and Vassilvitskii (2007): k-means++: The Advantages of Careful Seeding","https://theory.stanford.edu/~sergei/papers/kMeansPP-soda.pdf","The D² seeding rule and its O(log k) guarantee; short and readable."],["scikit-learn User Guide: Clustering (K-means)","https://scikit-learn.org/stable/modules/clustering.html","Section 2.3.2 on Lloyd, k-means++, mini-batch k-means and the method's assumptions."],["Python Data Science Handbook: In Depth: k-Means Clustering","https://jakevdp.github.io/PythonDataScienceHandbook/05.11-k-means.html","Free chapter with visual examples of where k-means fails."],["Tibshirani, Walther, Hastie: Estimating the number of clusters via the gap statistic","https://hastie.su.domains/Papers/gap.pdf","The gap statistic for choosing k."]],"k":["k-means","k-means++","inertia"],"x":["NumPy","scikit-learn"],"p":["k-means-clustering","kmeans-step","k-means-initialization"],"ak":""},{"id":"05.02","t":"Hierarchical and density-based clustering","n":["Agglomerative clustering starts with every point as its own cluster and repeatedly merges the closest pair; the merge history is a dendrogram you can cut at any level, so $k$ is chosen afterwards.","The linkage defines distance between clusters: single (closest pair, chains), complete (farthest pair, compact), average, and Ward (smallest increase in within-cluster variance, k-means-like).","Agglomerative clustering needs the $O(n^2)$ distance matrix, which limits it to tens of thousands of points.","DBSCAN defines clusters as dense regions: core points have at least `min_samples` neighbours within `eps`, clusters are connected groups of core points plus their border points, and the rest is labelled noise.","DBSCAN finds arbitrary shapes and needs no $k$, but one `eps` cannot fit clusters of very different density; HDBSCAN removes that limit."],"a":"## Two other definitions of a cluster\nLesson 05.01 defined a cluster as points near a centre. That fails for curved shapes, nested groups and noise. This lesson covers two alternatives: hierarchical clustering, which builds a whole tree of nested clusterings, and density-based clustering, which defines clusters as regions where points are packed closely.\n\n## Agglomerative clustering\nThe bottom-up algorithm is simple:\n1. Start with $n$ clusters, one per point, and the pairwise distance matrix.\n2. Merge the two closest clusters.\n3. Update the distances from the merged cluster to all others, using the linkage rule.\n4. Repeat until one cluster remains.\n\nThe output is a dendrogram: a binary tree whose merge heights record the distance at which each merge happened. Cutting it at height $h$ gives the clustering in which no merge above $h$ has happened; cutting to get $k$ clusters undoes the last $k-1$ merges. Unlike k-means, you can inspect the structure at every scale and choose $k$ afterwards.\n\nThe cost is the catch. The distance matrix needs $O(n^2)$ memory, so 100,000 points means $10^{10}$ entries, which is 80 GB as float64. Naive merging is $O(n^3)$; efficient algorithms reach $O(n^2)$ for single linkage (via a minimum spanning tree) and $O(n^2 \\log n)$ for others. In practice it is a tool for up to tens of thousands of points, or for clustering cluster centres produced by something cheaper.\n\n## Linkage criteria\nEverything interesting is in the linkage, the definition of distance between clusters $A$ and $B$:\n\n| Linkage | Distance between clusters | Behaviour |\n| Single | $\\min_{a \\in A, b \\in B} d(a, b)$ | Follows chains of nearby points; finds elongated shapes but one bridge of noise merges two clusters |\n| Complete | $\\max_{a \\in A, b \\in B} d(a, b)$ | Compact clusters of similar diameter; sensitive to outliers |\n| Average (UPGMA) | mean of all pairwise distances | A compromise between single and complete; works with any metric |\n| Ward | increase in total within-cluster sum of squares when merging | Similar-sized, spherical clusters, like k-means; Euclidean only |\n\nWard's criterion for merging clusters of sizes $n_A, n_B$ with means $\\mu_A, \\mu_B$ is $\\frac{n_A n_B}{n_A + n_B}\\lVert \\mu_A - \\mu_B \\rVert^2$, which is exactly the inertia increase. So Ward is a greedy, hierarchical version of the k-means objective and the usual default; single linkage is the one to reach for when clusters are connected but irregular, and the data has little noise.\n\nA connectivity constraint (for example, allowing merges only between $k$-nearest-neighbour graph neighbours) makes agglomerative clustering respect the geometry of the data, such as manifolds or neighbouring pixels, and is also much faster.\n\n## DBSCAN\nDBSCAN (Ester et al., 1996) needs two parameters: a radius `eps` and a count `min_samples`. It classifies points:\n- **Core**: at least `min_samples` points (including itself, in scikit-learn's convention) lie within `eps`.\n- **Border**: not core, but within `eps` of some core point.\n- **Noise**: neither. Labelled −1 and assigned to no cluster.\n\nClusters are the connected components of core points, where two core points are connected if they are within `eps` of each other, plus the border points attached to them.\n\n%%layers DBSCAN's three kinds of point. Only core points can extend a cluster.\n*Core | ≥ min_samples neighbours within eps; links to other core points to grow the cluster\nBorder | within eps of a core point, too sparse to be core; joins that cluster, extends nothing\nNoise | neither; label −1, belongs to no cluster\n%%\n\n! Example: DBSCAN by hand\n! One-dimensional points 1, 2, 3, 8, 20, 21, 22, 23 with eps = 1.5 and min_samples = 3.\n! Neighbourhoods: 2 sees {1, 2, 3}, so it is core; 1 and 3 see only two points each, so they are border points of 2's cluster. 21 sees {20, 21, 22} and 22 sees {21, 22, 23}: both core, linked, with 20 and 23 as borders. 8 sees only itself: noise.\n! Result: clusters {1, 2, 3} and {20, 21, 22, 23}, and one noise point. No k was given, and k-means with k = 2 would have dragged 8 into a cluster.\n\nStrengths: arbitrary shapes, a built-in notion of noise, no $k$, and with a spatial index each neighbourhood query is fast, giving roughly $O(n \\log n)$ in low dimensions (approaching $O(n^2)$ in high dimensions or with a large `eps`). Weaknesses:\n- **One density for everything**: a single `eps` cannot fit a tight cluster and a diffuse cluster at once; the diffuse one fragments into noise or the tight ones merge.\n- **Parameter choice**: set `min_samples` to about $2d$ or more, then plot each point's distance to its `min_samples`-th neighbour in sorted order and choose `eps` at the knee of that curve.\n- **Border ambiguity**: a border point within `eps` of two clusters' cores goes to whichever is found first, so labels can depend on data order.\n- **High dimensions**: distances concentrate and neighbourhoods become uninformative; reduce dimension first.\n\n## HDBSCAN and OPTICS\nHDBSCAN effectively runs DBSCAN at every `eps`, builds the hierarchy of clusters as density rises, and keeps the clusters that persist over the widest range of densities. It needs mainly `min_cluster_size`, handles clusters of varying density, and gives each point a membership strength. OPTICS computes a reachability ordering from which DBSCAN-style clusterings at any `eps` can be extracted. Both are in scikit-learn (`HDBSCAN`, `OPTICS`) and are usually better defaults than plain DBSCAN when densities differ.\n\n> Takeaway: agglomerative clustering gives a full merge tree whose shape is set by the linkage (Ward for compact clusters, single for chains) at $O(n^2)$ cost; DBSCAN finds dense regions of any shape and labels noise, but needs one density scale, which HDBSCAN removes.","q":"You cluster GPS points of taxi pick-ups in a city. Downtown has thousands of points per block; suburbs have a few per block. DBSCAN with `eps` tuned for downtown labels nearly all suburban points as noise; with `eps` tuned for the suburbs, downtown becomes one giant cluster. What is going on, and what would you use instead?","s":"DBSCAN uses one global density threshold: a point is core if it has `min_samples` neighbours within the same radius `eps` everywhere. Downtown and suburban clusters differ in density by orders of magnitude, so no single radius works. A small `eps` matches downtown's spacing, but suburban points then rarely have enough neighbours and become noise. A large `eps` captures the suburbs but connects all of downtown into one chain of core points. I would use HDBSCAN, which considers all density levels and keeps the clusters that are stable over a wide range of them, so dense downtown hotspots and sparse suburban ones can both appear, controlled mainly by `min_cluster_size`. OPTICS is an alternative. Because these are GPS coordinates, I would also use haversine distance, or project the points to metres, so that `eps` means the same distance everywhere.","r":[["Ester, Kriegel, Sander, Xu (1996): A Density-Based Algorithm for Discovering Clusters (DBSCAN)","https://www.aaai.org/Papers/KDD/1996/KDD96-037.pdf","The original paper; definitions of core, border, density-reachability and the k-distance heuristic."],["scikit-learn User Guide: Clustering","https://scikit-learn.org/stable/modules/clustering.html","Sections on hierarchical clustering (linkages, connectivity), DBSCAN, HDBSCAN and OPTICS."],["scikit-learn example: Comparing different hierarchical linkage methods on toy datasets","https://scikit-learn.org/stable/auto_examples/cluster/plot_linkage_comparison.html","A picture of single, average, complete and Ward linkage on the same shapes."],["HDBSCAN docs: How HDBSCAN Works","https://hdbscan.readthedocs.io/en/latest/how_hdbscan_works.html","Step-by-step explanation of mutual reachability, the condensed tree and cluster stability."]],"k":["hierarchical clustering","linkage","DBSCAN"],"x":["scikit-learn","SciPy"],"p":["agglomerative-clustering","dbscan"],"ak":""},{"id":"05.03","t":"Gaussian mixtures and EM","n":["A Gaussian mixture models the data density as $p(x) = \\sum_k \\pi_k \\mathcal N(x \\mid \\mu_k, \\Sigma_k)$: each point comes from a hidden component $z$, which turns clustering into maximum-likelihood estimation.","Clustering is soft: the responsibility $r_{ik} = P(z_i = k \\mid x_i)$ is a posterior probability, so points between clusters get split membership.","EM alternates an E-step (compute responsibilities with current parameters) and an M-step (weighted means, covariances and weights). Each iteration never decreases the log-likelihood.","EM finds local optima and can diverge to infinite likelihood when a component collapses onto one point; use k-means initialisation, restarts and a small covariance regulariser.","Covariance type (full, diag, tied, spherical) sets the shape and parameter count; choose components and type with BIC. k-means is the limit of a spherical GMM with variance going to zero."],"a":"## Clustering as a density model\nk-means (lesson 05.01) gives each point exactly one cluster and treats every cluster as a ball of the same size. A Gaussian mixture model (GMM) generalises both choices by writing down a generative story:\n1. Pick a component $z \\in \\{1, \\dots, K\\}$ with probability $\\pi_k$.\n2. Draw $x$ from $\\mathcal N(\\mu_z, \\Sigma_z)$.\n\nThe density of $x$ is then $p(x) = \\sum_k \\pi_k\\, \\mathcal N(x \\mid \\mu_k, \\Sigma_k)$. Fitting means maximising the log-likelihood\n\n$$\\ell(\\theta) = \\sum_{i=1}^{n} \\log \\sum_{k=1}^{K} \\pi_k\\, \\mathcal N(x_i \\mid \\mu_k, \\Sigma_k)$$\n\nHaving a likelihood brings three things k-means lacks: elliptical clusters of different sizes (through $\\Sigma_k$), soft assignments, and a density $p(x)$ you can use to score new points, which lesson 05.05 uses for anomaly detection. Maximum likelihood for a single Gaussian is covered in ML Maths (Inference); the difficulty here is the sum inside the log, which couples all parameters and has no closed-form solution.\n\n## Soft assignments\nIf we knew the parameters, Bayes' rule would give the posterior that point $i$ came from component $k$:\n\n$$r_{ik} = \\frac{\\pi_k\\, \\mathcal N(x_i \\mid \\mu_k, \\Sigma_k)}{\\sum_j \\pi_j\\, \\mathcal N(x_i \\mid \\mu_j, \\Sigma_j)}$$\n\nThese responsibilities sum to 1 over $k$. A point deep inside a cluster gets $r \\approx 1$; a point halfway between two equal clusters gets about 0.5 each.\n\n! Example: responsibilities in one dimension\n! Two components with equal weights, means 0 and 4, both with σ = 1.\n! At x = 2 (halfway) the two densities are equal, so r = (0.5, 0.5).\n! At x = 1 the unnormalised densities are proportional to e^−0.5 and e^−4.5. So r₁ = 1 / (1 + e^−4) = 0.982: mostly component 1, but not entirely.\n! If component 2 instead had σ = 3, its wider tail would claim a larger share of points far to the left of 0. Shape matters, not just distance to the mean.\n\n## The EM algorithm\nExpectation-maximisation breaks the problem into two easy steps by pretending the responsibilities are known:\n1. **E-step**: compute $r_{ik}$ from the current parameters.\n2. **M-step**: re-estimate every component from all points, each weighted by its responsibility (formulas below).\n3. Repeat until the log-likelihood improves by less than a tolerance.\n\nWith $N_k = \\sum_i r_{ik}$, the effective number of points in component $k$, the M-step is\n\n$$\\pi_k = \\frac{N_k}{n}, \\quad \\mu_k = \\frac{1}{N_k}\\sum_i r_{ik}\\, x_i, \\quad \\Sigma_k = \\frac{1}{N_k}\\sum_i r_{ik}\\,(x_i - \\mu_k)(x_i - \\mu_k)^\\top$$\n\nThat is just weighted maximum likelihood for each Gaussian, with weights $r_{ik}$.\n\n%%seq One EM iteration. The E-step makes a lower bound on the log-likelihood that touches it at the current parameters; the M-step maximises that bound.\nParameters > E-step : current π, μ, Σ\nE-step > M-step : responsibilities r (n × K)\nM-step > Parameters : weighted π, μ, Σ\nParameters -> Parameters : log-likelihood can only go up\n%%\n\nWhy it works: for any distribution $q$ over $z_i$, Jensen's inequality gives $\\log p(x_i) \\ge \\mathbb E_q[\\log p(x_i, z_i)] - \\mathbb E_q[\\log q(z_i)]$, the evidence lower bound (ELBO). The E-step sets $q$ to the true posterior, which makes the bound tight. The M-step raises the bound, so the likelihood rises too. The same bound reappears in variational autoencoders (Deep Learning, generative models), where $q$ is learned by a network instead of computed exactly.\n\nCompute the E-step in log space. In 50 dimensions, Gaussian densities are easily $10^{-300}$, so multiply-then-normalise underflows. Use log-densities and log-sum-exp:\n\n```python\nimport numpy as np\nfrom scipy.special import logsumexp\ndef e_step(log_pi, log_dens):               # log_dens[i, k] = log N(x_i | mu_k, Sigma_k)\n    log_r = log_pi + log_dens\n    ll = logsumexp(log_r, axis=1)            # per-point log-likelihood\n    return np.exp(log_r - ll[:, None]), ll.sum()\n```\n\n## Failure modes and remedies\n- **Local optima**: the likelihood is multimodal. Initialise from k-means (scikit-learn's default) and use several restarts (`n_init`).\n- **Singularities**: if a component's mean sits on one point and its variance shrinks to zero, that point's density goes to infinity, and so does the likelihood. This is a degenerate maximum, not a good fit. Adding a small $\\epsilon I$ to every covariance (`reg_covar`, default $10^{-6}$) prevents it.\n- **Slow convergence**: EM can crawl when components overlap heavily; cap iterations and monitor the log-likelihood.\n- **Wrong $K$**: likelihood always rises with more components, so compare models with BIC, $-2\\ell + p \\log n$, which penalises the parameter count $p$.\n\n## Covariance types, and k-means as a special case\nThe covariance structure controls both cluster shape and the number of parameters. For $d = 10$ and $K = 5$ (counting means, covariances and $K-1$ free weights):\n\n| Type | Shape | Parameters |\n| full | any ellipse per component | 5 × (10 + 55) + 4 = 329 |\n| tied | one shared ellipse | 5 × 10 + 55 + 4 = 109 |\n| diag | axis-aligned ellipses | 5 × (10 + 10) + 4 = 104 |\n| spherical | balls of different sizes | 5 × (10 + 1) + 4 = 59 |\n\nFull covariance grows as $d^2$, so with high $d$ or small $n$, diag or tied are safer.\n\nNow take a spherical GMM with every $\\Sigma_k = \\sigma^2 I$ and equal weights, and let $\\sigma \\to 0$. The responsibilities become 1 for the nearest mean and 0 for the rest, and the M-step becomes \"mean of assigned points\". That is exactly Lloyd's algorithm, which is why k-means struggles with exactly the shapes a full-covariance GMM handles.\n\n> Takeaway: a GMM is a probabilistic, soft, elliptical generalisation of k-means, fitted by EM, which alternates responsibilities and weighted maximum-likelihood updates; guard against local optima and collapsing components, and choose $K$ and covariance type with BIC.","q":"You fit a 6-component, full-covariance GMM to 300 points in 40 dimensions. The log-likelihood is enormous and keeps increasing, and one component has a covariance with near-zero determinant and weight 1/300. What happened, and what would you change?","s":"One component has collapsed onto a single point: its mean equals that point and its covariance is shrinking towards singular, so the density at that point, and with it the log-likelihood, goes to infinity. This is the known degeneracy of maximum likelihood for mixtures, and it is made much more likely here because each full covariance in 40 dimensions has 820 parameters, estimated with an average of only 50 points per component. Fixes: switch to diagonal or tied covariances (or reduce dimension with PCA first) so each component has far fewer parameters; increase `reg_covar` so every covariance has a floor; initialise from k-means and use several restarts; and select the number of components and covariance type by BIC, which will penalise the 6 × 820 covariance parameters heavily. A Bayesian GMM with a prior on covariances is another option.","r":[["scikit-learn User Guide: Gaussian mixture models","https://scikit-learn.org/stable/modules/mixture.html","EM, covariance types, BIC selection and the variational Bayesian GMM."],["Stanford CS229 notes: Mixtures of Gaussians and the EM algorithm","https://cs229.stanford.edu/notes2020spring/cs229-notes8.pdf","Derives EM from Jensen's inequality and the ELBO."],["Python Data Science Handbook: In Depth: Gaussian Mixture Models","https://jakevdp.github.io/PythonDataScienceHandbook/05.12-gaussian-mixtures.html","Free chapter comparing GMM with k-means visually, including density estimation."],["Probabilistic Machine Learning: An Introduction (Murphy)","https://probml.github.io/pml-book/book1.html","Free draft; the mixture model and EM sections give the general latent-variable view."]],"k":["Gaussian mixture","EM algorithm"],"x":["NumPy","SciPy","scikit-learn"],"p":["gaussian-mixture-models-em","maximum-likelihood-estimation","kmeans-step"],"ak":""},{"id":"05.04","t":"Dimensionality reduction in practice","n":["PCA projects centred data onto the top eigenvectors of its covariance (via SVD). In an ML pipeline it is fitted on the training split only and chosen by explained variance or by validation score.","PCA keeps high-variance directions, not predictive ones: a low-variance direction can carry all the signal, so check downstream performance rather than trusting a 95% variance rule.","Whitening rescales PCA coordinates to unit variance ($\\Lambda^{-1/2} U^\\top x$); ZCA rotates back to the original axes. Both amplify noise in tiny-eigenvalue directions, so add an $\\epsilon$.","t-SNE and UMAP make 2-D maps that preserve local neighbourhoods. Cluster sizes and between-cluster distances in the map are not meaningful, and results depend on perplexity or `n_neighbors` and on the seed.","Use PCA for features, compression and denoising; use t-SNE/UMAP for looking at data, typically after PCA to about 50 dimensions."],"a":"## Where this fits\nThe mathematics of PCA (covariance, eigenvectors, SVD) is covered in ML Maths, in the lessons on SVD and principal component analysis. This lesson is about using dimensionality reduction inside ML work: what to fit on, how many components to keep, when whitening helps, and how to read 2-D embeddings without fooling yourself.\n\nThere are two different goals, and they call for different tools:\n- **Reduce features for a model**: compress, denoise, decorrelate, speed things up. The transform must apply to new data. Use PCA (or truncated SVD for sparse data).\n- **Look at the data**: a 2-D picture showing which points are neighbours. Use t-SNE or UMAP, and treat the picture as a hint, not a measurement.\n\n## PCA in a pipeline\nPCA centres the data, takes the SVD $X_c = U S V^\\top$, and keeps the top $m$ right singular vectors as directions. The variance along component $j$ is $\\lambda_j = s_j^2 / (n-1)$, and the explained variance ratio is $\\lambda_j / \\sum_k \\lambda_k$.\n\n%%flow A typical pipeline. Every step is fitted on the training split only, then applied unchanged to validation and test.\nRaw features -(fit on train)-> Standardise -(fit on train)-> *PCA to m dims -> Model\n%%\n\nPractical rules:\n- **Scale first** when features have dif
