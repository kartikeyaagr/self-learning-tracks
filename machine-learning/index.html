re the features barely vary, typically differences between near-duplicate columns, and they are exactly where OLS coefficients blow up. The **effective degrees of freedom** $\\mathrm{df}(\\lambda) = \\sum_j \\sigma_j^2/(\\sigma_j^2 + \\lambda)$ runs from $d$ at $\\lambda = 0$ to $0$ as $\\lambda \\to \\infty$, which is a better complexity measure than counting features.\n\n## Lasso by coordinate descent\nThe lasso objective, in the scaling scikit-learn and glmnet use, is\n\n$$\\tfrac{1}{2n}\\|y - Xw\\|^2 + \\lambda \\|w\\|_1.$$\n\nThe kink at zero rules out a closed form, but one coordinate at a time is easy. Hold all other weights fixed, let $r_{(j)} = y - \\sum_{k \\ne j} x_k w_k$ be the partial residual, and $\\rho_j = \\tfrac1n x_j^\\top r_{(j)}$. With standardised columns the exact minimiser over $w_j$ is the soft-threshold $w_j = S(\\rho_j, \\lambda)$: shrink $\\rho_j$ toward zero by $\\lambda$, and if it crosses zero, stop at zero. Cycle over coordinates until nothing moves.\n\n```python\nimport numpy as np\ndef soft(r, lam): return np.sign(r) * np.maximum(np.abs(r) - lam, 0.0)\n\ndef lasso_cd(X, y, lam, iters=200):        # X standardised, y centred\n    n, d = X.shape; w = np.zeros(d); r = y.copy()\n    for _ in range(iters):\n        for j in range(d):\n            r += X[:, j] * w[j]             # remove j's contribution\n            w[j] = soft(X[:, j] @ r / n, lam)\n            r -= X[:, j] * w[j]\n    return w\n```\n\nTwo facts follow directly. At $\\lambda_{\\max} = \\max_j |x_j^\\top y|/n$ every coordinate thresholds to zero, which is where the path starts. And any feature whose correlation with the current residual stays below $\\lambda$ never enters the model. An alternative solver, ISTA, takes a full gradient step on the squared loss and then soft-thresholds every coordinate; it is slower per unit of progress but generalises to other smooth losses.\n\nThe lasso has known limits: with $d > n$ it selects at most $n$ features, and among a group of correlated features it picks one somewhat arbitrarily.\n\n## Elastic net\nElastic net adds both penalties:\n\n$$\\tfrac{1}{2n}\\|y - Xw\\|^2 + \\lambda\\Big(\\alpha\\|w\\|_1 + \\tfrac{1-\\alpha}{2}\\|w\\|_2^2\\Big).$$\n\nThe coordinate update becomes $w_j = S(\\rho_j, \\lambda\\alpha) / (1 + \\lambda(1-\\alpha))$: threshold, then shrink. The L2 part makes the objective strictly convex, so correlated features get similar weights (the grouping effect) and more than $n$ features can be selected. Beware the naming: scikit-learn's `alpha` is this $\\lambda$, and its `l1_ratio` is this $\\alpha$.\n\n| Property | Ridge | Lasso | Elastic net\n| Closed form | yes | no | no\n| Exact zeros | no | yes | yes\n| Correlated group | shares weight | keeps one | keeps the group, shrunk\n| Features selected when d > n | all, none zero | at most n | can exceed n\n| Usual solver | Cholesky or SVD | coordinate descent | coordinate descent\n\n## The path, and choosing lambda\nNever fit one $\\lambda$. Fit a grid of about 100 values spaced evenly in log scale from $\\lambda_{\\max}$ down to $\\lambda_{\\max}/10^{3}$ or so, starting each fit from the previous solution (a warm start). Neighbouring solutions are close, so the whole path costs little more than a few cold fits.\n\n%%flow The lasso path: start where every weight is zero and relax the penalty, letting features enter one by one.\nlambda max: all weights 0 -(lower lambda)-> few strong features -(lower)-> *CV minimum -(lower)-> near OLS, overfit\n%%\n\nChoose $\\lambda$ by K-fold cross-validation on the training data (module 06 covers the variants). The curve of CV error against $\\log\\lambda$ is usually flat near its minimum, so many $\\lambda$ values are statistically indistinguishable. The **one-standard-error rule** picks the largest $\\lambda$ whose CV error is within one standard error of the minimum: same accuracy within noise, fewer features, more stable. Three practical traps:\n- **Scale.** Standardise using training-fold statistics only, inside the CV loop.\n- **Library conventions.** scikit-learn's `Ridge` minimises $\\|y - Xw\\|^2 + \\alpha\\|w\\|^2$ with no $1/n$; `Lasso` divides the loss by $2n$. The same number means different strengths, and ridge's effective strength changes with dataset size.\n- **Shrinkage bias.** Lasso shrinks the weights it keeps. If you want unbiased coefficients for the selected set, refit OLS on them (the relaxed lasso), and validate that refit too.\n\n! Example: shrinkage factors and a threshold\n! Ridge on a design with singular values $(10, 1, 0.1)$ and $\\lambda = 1$: factors $100/101 = 0.99$, $1/2 = 0.5$ and $0.01/1.01 \\approx 0.01$. The strong direction is untouched, the weak one is almost removed, and $\\mathrm{df} \\approx 1.5$ out of 3.\n! Lasso coordinate update with $\\lambda = 0.3$: if $\\rho_j = 0.8$ the new weight is $0.5$; if $\\rho_j = 0.2$ it is exactly $0$; if $\\rho_j = -0.5$ it is $-0.2$.\n\n> Takeaway: ridge rescales directions of the data, the lasso soft-thresholds coordinates, and elastic net does both. Standardise, fit the whole path with warm starts, and choose lambda by cross-validation, preferring the sparser end of the flat region.\n","q":"You run lasso on unstandardised data. Income is in dollars (standard deviation 30,000) and age is in years (standard deviation 12); both matter about equally. Which coefficient does the lasso tend to zero out, why, and what would change if you re-expressed income in thousands of dollars?","s":"The lasso penalises $|w_j|$ regardless of units. To have the same effect on predictions, the age coefficient must be about 2,500 times larger than the income coefficient (30,000 / 12), so it costs 2,500 times more penalty for the same contribution. In coordinate-descent terms, age's update is thresholded far more heavily relative to its signal, so age is driven to zero first while income survives almost unshrunk. Re-expressing income in thousands multiplies its coefficient by 1,000 and its penalty with it, so the selection shifts toward age: the chosen model now depends on an arbitrary choice of units. Standardising both features (with training statistics) removes that dependence, puts every coefficient on a per-standard-deviation scale, and makes a single $\\lambda$ meaningful across features.","r":[["Regularization Paths for Generalized Linear Models via Coordinate Descent","https://www.jstatsoft.org/article/view/v033i01","The glmnet paper (Friedman, Hastie, Tibshirani): soft-threshold updates, warm-started paths and the lambda grid."],["Statistical Learning with Sparsity","https://hastie.su.domains/StatLearnSparsity/","Chapters 2-4 on the lasso, elastic net and their solvers. Free PDF."],["scikit-learn: Linear models (Ridge, Lasso, Elastic-Net)","https://scikit-learn.org/stable/modules/linear_model.html","The exact objectives behind alpha and l1_ratio, and the CV variants LassoCV and ElasticNetCV."],["The Elements of Statistical Learning, ch. 3.4","https://hastie.su.domains/ElemStatLearn/","Ridge via the SVD, effective degrees of freedom and the lasso path."]],"k":["shrinkage","sparsity"],"x":["NumPy","scikit-learn"],"p":["ridge-regression","lasso-regression","lasso-regression-using-ista","subgradients-for-non-smooth-functions","hessian-matrix-and-convexity-of-linear-regressio"],"ak":""},{"id":"02.03","t":"Logistic regression","n":["Logistic regression models the **log-odds** as linear: $\\log\\frac{p}{1-p} = w^\\top x + b$, so $p = \\sigma(w^\\top x + b)$ and a one-unit change in $x_j$ multiplies the odds by $e^{w_j}$.","Its loss is the Bernoulli negative log-likelihood (binary cross-entropy); in margin form it is $\\log(1 + e^{-y z})$ with $y \\in \\{-1, +1\\}$, which links it to the SVM's hinge loss.","The gradient $\\frac1n X^\\top(p - y)$ has the same shape as linear regression's; the loss is convex, so gradient descent, Newton (IRLS) or L-BFGS all reach the global optimum.","On linearly separable data the unregularised optimum does not exist: weights grow without bound. Regularisation (scikit-learn applies L2 with `C=1.0` by default) fixes it.","The decision boundary $w^\\top x + b = \\log\\frac{t}{1-t}$ is a hyperplane; changing the threshold $t$ slides it without rotating it."],"a":"## From scores to probabilities\nFor a binary label, a linear score $z = w^\\top x + b$ ranges over all real numbers, but a probability must lie in $(0, 1)$. Logistic regression connects the two through the sigmoid:\n\n$$p(y = 1 \\mid x) = \\sigma(z) = \\frac{1}{1 + e^{-z}}.$$\n\nInverting it shows what is really linear: $z = \\log\\frac{p}{1-p}$, the **log-odds**. Each feature adds a fixed amount to the log-odds, so a one-unit increase in $x_j$ multiplies the odds by $e^{w_j}$. With $w_j = 0.7$ the odds roughly double. That is the interpretation analysts use, and it holds only with the same caveats about collinearity and confounding as in 02.01.\n\n| Probability p | Odds p/(1-p) | Logit z\n| 0.50 | 1 | 0\n| 0.73 | 2.7 | 1\n| 0.88 | 7.4 | 2\n| 0.95 | 19 | 2.94\n| 0.99 | 99 | 4.6\n\nThe table is worth remembering: logits of a few units already mean near-certainty, which is why weights do not need to be large to produce confident predictions.\n\n## Cross-entropy from maximum likelihood\nTreat each label as a Bernoulli draw with probability $p_i = \\sigma(w^\\top x_i)$. The negative log-likelihood, averaged, is the binary cross-entropy:\n\n$$L(w) = -\\tfrac{1}{n}\\sum_i \\big[y_i \\log p_i + (1 - y_i)\\log(1 - p_i)\\big].$$\n\nWith labels recoded as $y \\in \\{-1, +1\\}$ the same loss reads $\\tfrac1n\\sum_i \\log(1 + e^{-y_i z_i})$, a function of the **margin** $y_i z_i$ only. Large positive margins cost almost nothing; a confidently wrong prediction (margin $-5$) costs about 5. Lesson 02.05 compares this curve with the SVM's hinge loss.\n\nWhy not squared error on $\\sigma(z)$? It is not convex in $w$, and its gradient contains a factor $\\sigma'(z)$ that vanishes when the model is confidently wrong, exactly when it most needs to move. Cross-entropy cancels that factor. In code, always compute the loss from logits, not from rounded probabilities: `np.logaddexp(0, -y * z)` is exact for large $|z|$, while `np.log(sigmoid(z))` returns `-inf` once $\\sigma(z)$ rounds to 0.\n\n## Fitting it\nThe gradient is strikingly simple:\n\n$$\\nabla L = \\tfrac{1}{n} X^\\top (p - y),$$\n\nprediction error times input, the same shape as linear regression. The Hessian $\\tfrac1n X^\\top S X$ with $S = \\mathrm{diag}(p_i(1 - p_i))$ is positive semi-definite, so the loss is convex and any local minimum is global.\n\n```python\nimport numpy as np\ndef fit_logreg(X, y, lam=1e-2, lr=0.5, steps=2000):   # y in {0,1}\n    w = np.zeros(X.shape[1])\n    for _ in range(steps):\n        p = 1 / (1 + np.exp(-(X @ w)))\n        w -= lr * (X.T @ (p - y) / len(y) + lam * w)  # L2 keeps w finite\n    return w\n```\n\nPlain gradient descent works but is slow on badly scaled features. **Newton's method** uses the Hessian; for logistic regression each Newton step is a weighted least-squares solve, hence the name iteratively reweighted least squares (IRLS), and it converges in 5 to 10 iterations for moderate $d$. scikit-learn defaults to L-BFGS, a quasi-Newton method that approximates curvature from recent gradients, and uses SAGA or liblinear for large sparse problems.\n\n**Separable data.** If some hyperplane separates the classes perfectly, scaling $w$ up always lowers the loss, so the minimiser does not exist: weights diverge, probabilities saturate at 0 and 1, and the optimiser runs until it hits its iteration limit. This happens often with many features or rare categories. An L2 penalty makes the optimum finite and unique; scikit-learn's `LogisticRegression` applies one by default, with `C` the *inverse* strength ($C = 1/\\lambda$, applied to a summed rather than averaged loss).\n\n## Decision boundaries\nPredicting class 1 when $p \\ge t$ is the same as $z \\ge \\log\\frac{t}{1-t}$. For $t = 0.5$ the boundary is the hyperplane $w^\\top x + b = 0$, with $w$ normal to it. Moving the threshold shifts the hyperplane parallel to itself; it never rotates. The size $\\|w\\|$ sets how fast probability changes across the boundary: the distance from the boundary to the 0.73 contour is $1/\\|w\\|$.\n\n%%flow One prediction: a linear score, squashed to a probability, then cut at a threshold chosen for the costs at hand.\nFeatures x -(w.x + b)-> Logit z -(sigmoid)-> *Probability p -(compare with t)-> Class\n%%\n\nCurved boundaries come from features, not from the model: adding $x_1^2$, $x_2^2$ and $x_1 x_2$ lets a linear boundary in the expanded space become an ellipse in the original one. Lesson 02.06 does this implicitly with kernels. Choosing $t$ is a cost question covered in module 06; whether $p$ can be trusted as a probability is lesson 03.04.\n\n! Example: one gradient step by hand\n! Weights $w = (2, -1)$, bias $b = -0.5$, one example $x = (1, 0.5)$ with $y = 1$.\n! Logit $z = 2 - 0.5 - 0.5 = 1.0$, so $p = \\sigma(1) = 0.731$ and the loss is $-\\ln 0.731 = 0.313$.\n! Error $p - y = -0.269$, so the gradient is $(-0.269, -0.134)$ for $w$ and $-0.269$ for $b$. A step with learning rate 0.5 gives $w = (2.134, -0.933)$ and $b = -0.366$; the new logit is $1.30$ and $p = 0.79$.\n\n> Takeaway: logistic regression is a linear model of the log-odds fitted by maximum likelihood. The loss is convex and the gradient is error times input; regularise it, or separable data will send the weights to infinity.\n","q":"You train unregularised logistic regression with gradient descent on a dataset that turns out to be perfectly linearly separable. Describe what happens to the training loss, the norm of the weights and the predicted probabilities as iterations increase, why this is a problem in practice, and two ways to fix it.","s":"Once a separating hyperplane is found, every example has a positive margin $y_i z_i$, and multiplying $w$ by any factor above 1 increases every margin and lowers every $\\log(1 + e^{-y_i z_i})$ term. So the loss keeps falling toward 0 without reaching it, $\\|w\\|$ grows without bound (roughly logarithmically in the number of steps), and predicted probabilities on training points saturate at 0 and 1. The direction of $w$ settles but its scale never does. In practice the optimiser hits its iteration cap and warns about convergence, coefficients and odds ratios are meaningless, and the model is overconfident on new points near the boundary. Fixes: add an L2 (or L1) penalty, which makes the optimum finite and unique; or stop early on validation loss. Collecting more data that overlaps the classes, or merging the rare categories causing separation, also helps.","r":[["Cornell CS4780 lecture notes: Logistic Regression","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote06.html","Logistic regression derived as MLE and MAP, with the gradient."],["Stanford CS229 main notes","https://cs229.stanford.edu/main_notes.pdf","Part on classification and logistic regression, plus Newton's method and the generalised linear model view."],["scikit-learn: LogisticRegression","https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html","What C means, which penalty is on by default, and which solver handles which penalty."]],"k":["log-odds","cross-entropy"],"x":["NumPy","scikit-learn"],"p":["logistic-regression","log-loss-binary-cross-entropy","newton-s-method","sigmoid-stable","basic-autograd"],"ak":""},{"id":"02.04","t":"Multiclass classification","n":["Two routes to $K$ classes: **reduce** to binary problems (one-vs-rest with $K$ models, one-vs-one with $K(K-1)/2$), or use a natively multiclass model such as softmax regression.","One-vs-rest scores come from separately trained models, so they are not on a common scale and do not sum to 1; each subproblem is also imbalanced ($1$ class against $K-1$).","Softmax regression sets $p(y = k \\mid x) = e^{z_k}/\\sum_j e^{z_j}$ with $z = Wx + b$; the cross-entropy gradient on the logits is just $p - \\text{onehot}(y)$.","Softmax is over-parameterised (adding a vector to every row of $W$ changes nothing); with $K = 2$ it reduces exactly to logistic regression on $w_1 - w_0$.","If labels are not mutually exclusive (multi-label), use $K$ independent sigmoids, not a softmax."],"a":"## Two routes to K classes\nLogistic regression and SVMs are binary. With $K > 2$ classes there are two strategies:\n- **Reduction**: train several binary classifiers and combine their outputs. Works with any binary learner, including ones that have no natural multiclass form.\n- **Native multiclass**: change the model so it scores all $K$ classes jointly. For linear models that is softmax (multinomial logistic) regression.\n\nscikit-learn does this silently: `LogisticRegression` uses the multinomial form by default with most solvers, `SVC` uses one-vs-one internally, and `LinearSVC` uses one-vs-rest. Knowing which one you got matters when you read the scores.\n\n## One-vs-rest and one-vs-one\n**One-vs-rest (OvR)** trains classifier $k$ to separate class $k$ from everything else, then predicts $\\arg\\max_k s_k(x)$. It needs $K$ models, each trained on all $n$ examples. Three weaknesses:\n- The scores come from independently trained models, so a score of 2.0 from model 3 and 1.5 from model 5 are not directly comparable, and OvR probabilities do not sum to 1.\n- Each subproblem is imbalanced: with 10 balanced classes, every binary problem is 10% positive.\n- Regions where every classifier says \"not mine\", or several say \"mine\", are resolved only by the argmax.\n\nRifkin and Klautau showed that, with each binary model well tuned and regularised, OvR is as accurate as more elaborate schemes. It is a fine default when the binary learner is strong.\n\n**One-vs-one (OvO)** trains a classifier for every pair of classes on just those two classes' data and predicts by majority vote. For $K = 10$ that is 45 models instead of 10, but each sees only about a fifth of the data. For kernel SVMs, whose training cost grows faster than linearly in $n$, many small problems can be cheaper than a few big ones, which is why libsvm uses OvO.\n\n| Property | One-vs-rest | One-vs-one | Softmax\n| Models trained | K | K(K-1)/2 | 1 (K weight vectors)\n| Data per model | all n | two classes only | all n\n| Scores sum to 1 | no | no (votes) | yes\n| Typical use | linear SVMs, any binary learner | kernel SVMs | logistic-style models, neural nets\n\n## Softmax regression\nGive each class a weight vector, stacked as $W \\in \\mathbb{R}^{K \\times d}$, compute logits $z = Wx + b$, and normalise:\n\n$$p(y = k \\mid x) = \\frac{e^{z_k}}{\\sum_{j=1}^{K} e^{z_j}}.$$\n\nThe loss is cross-entropy, the negative log-probability of the true class:\n\n$$\\ell = -\\log p_y = -z_y + \\log\\sum_j e^{z_j}.$$\n\nIts gradient with respect to the logits is $p - e_y$, where $e_y$ is the one-hot label: push the true class's logit up by $1 - p_y$ and every other logit down by its probability. The weight gradient is that vector times $x^\\top$. The loss is convex in $W$, so the fitting story from 02.03 carries over: gradient methods or L-BFGS, with L2 regularisation.\n\n```python\nimport numpy as np\ndef softmax_xent(Z, y):                 # Z: (n, K) logits, y: (n,) int labels\n    Z = Z - Z.max(axis=1, keepdims=True)              # stability: exp never overflows\n    logp = Z - np.log(np.exp(Z).sum(axis=1, keepdims=True))\n    loss = -logp[np.arange(len(y)), y].mean()\n    G = np.exp(logp); G[np.arange(len(y)), y] -= 1    # dL/dZ = p - onehot\n    return loss, G / len(y)\n```\n\nSubtracting the row maximum leaves the probabilities unchanged (softmax ignores a constant added to every logit) and keeps `exp` from overflowing; computing log-probabilities directly, the log-sum-exp trick, avoids `log(0)`. The AI Research course (lesson 02.02) covers softmax intuition and temperature in more depth.\n\nThat invariance has a second consequence: adding the same vector $c$ to every row of $W$ leaves predictions unchanged, so the unregularised model has no unique solution. Any L2 penalty pins it down. With $K = 2$, only the difference matters: $p(y = 1) = \\sigma\\big((w_1 - w_0)^\\top x\\big)$, which is exactly logistic regression.\n\n%%flow Softmax regression: one score per class, normalised jointly, so the outputs compete and sum to 1.\nFeatures x -(W x + b)-> K logits -(softmax)-> *K probabilities -(argmax)-> Predicted class\n%%\n\n**Decision regions.** Class $k$ wins where $z_k \\ge z_j$ for all $j$, an intersection of $K - 1$ half-spaces. So the regions are convex polytopes and boundaries are piecewise linear, the same for OvR and softmax, though the exact hyperplanes differ.\n\n## Multi-label is a different problem\nIf an example can carry several labels at once (a photo tagged both \"beach\" and \"dog\"), softmax is wrong: it forces the probabilities to compete and sum to 1. Use $K$ independent sigmoid outputs with binary cross-entropy on each, which is OvR with an honest name, and pick a threshold per label. For very large $K$ (thousands of products or words), the full softmax becomes the computational bottleneck; sampled and hierarchical softmax are covered in the Deep Learning and Recommender Systems material.\n\n! Example: softmax and its gradient for three classes\n! Logits $z = (2.0, 1.0, 0.1)$. Exponentials $7.389, 2.718, 1.105$, sum $11.212$, so $p = (0.659, 0.242, 0.099)$.\n! If the true class is the second one, the loss is $-\\ln 0.242 = 1.42$ and the gradient on the logits is $p - e_2 = (0.659, -0.758, 0.099)$: lower the first and third logits, raise the second.\n! Adding 100 to every logit gives the same $p$; computing $e^{102}$ directly would still work in float64 but overflows float32 near $e^{89}$, which is why the max is subtracted first.\n\n> Takeaway: reduce to binary problems when your learner is binary, but prefer softmax regression when you want comparable scores and probabilities that sum to 1. Use independent sigmoids when labels are not exclusive.\n","q":"An OvR logistic model on 4 balanced classes outputs per-class sigmoid probabilities (0.30, 0.25, 0.20, 0.10) for a test point. What does this pattern tell you, how would a softmax model trained on the same data present the same point, and which output would you rather feed into a downstream cost-sensitive decision?","s":"The four binary models each say this point is more likely not their class, and their probabilities sum to only 0.85. The point sits in a region none of them claims, near the shared boundaries or away from the training data. The argmax still predicts class 1, but by a narrow margin, and the numbers are not a distribution: rescaling them to sum to 1 (0.35, 0.29, 0.24, 0.12) is an ad hoc fix with no likelihood behind it. A softmax model is trained so its outputs form a distribution over the four classes. It would likely give a similarly flat but properly normalised vector, and because it was fitted with multiclass cross-entropy, its probabilities are usually better calibrated. For a cost-sensitive decision, which needs expected costs $\\sum_k p_k c_k$, use the softmax output (after a calibration check as in 03.04), and treat the flat profile as a signal to abstain or route for review.","r":[["In Defense of One-Vs-All Classification","https://www.jmlr.org/papers/v5/rifkin04a.html","Rifkin and Klautau (JMLR 2004): well-tuned one-vs-rest matches more complex multiclass schemes."],["Dive into Deep Learning: Softmax Regression","https://d2l.ai/chapter_linear-classification/softmax-regression.html","Softmax, cross-entropy and its gradient, with the information-theory view of the loss."],["scikit-learn: Multiclass and multioutput algorithms","https://scikit-learn.org/stable/modules/multiclass.html","OneVsRest, OneVsOne and which estimators are inherently multiclass, plus multi-label targets."]],"k":["softmax","one-vs-rest"],"x":["NumPy","scikit-learn"],"p":["softmax-regression","softmax-cross-entropy-gradient","cross-entropy-logits","softmax-numerical-stability-and-log-sum-exp","top-k-classification-accuracy"],"ak":""},{"id":"02.05","t":"Support vector machines","n":["Among all separating hyperplanes, the SVM picks the one with the widest **margin**; fixing the closest points at $y_i(w^\\top x_i + b) = 1$ makes the margin $1/\\|w\\|$, so maximising it means minimising $\\tfrac12\\|w\\|^2$.","The soft margin adds slack for violations; it is equivalent to minimising $\\tfrac{\\lambda}{2}\\|w\\|^2 + \\tfrac1n\\sum_i \\max(0, 1 - y_i f(x_i))$, the regularised **hinge loss**, with $\\lambda = 1/(nC)$.","Hinge loss is exactly zero beyond the margin, so only **support vectors** (points on or inside the margin) determine the solution; logistic loss is never zero, so every point contributes.","**Pegasos** solves the primal by SGD: step $\\eta_t = 1/(\\lambda t)$, shrink $w$ by $(1 - \\eta_t\\lambda)$ every step, and add $\\eta_t y_i x_i$ only when the margin is below 1.","In the dual, data enter only through dot products $x_i^\\top x_j$, which is what makes kernels (next lesson) possible."],"a":"## Margins\nWhen two classes are linearly separable, infinitely many hyperplanes separate them. Logistic regression without regularisation does not even settle on one (02.03). The support vector machine makes a specific choice: the hyperplane that stays as far as possible from the nearest training points. A wide margin means small perturbations of the inputs do not flip predictions, and margin-based bounds tie a wider margin to better generalisation regardless of the number of features.\n\nFor a classifier $f(x) = w^\\top x + b$ and labels $y \\in \\{-1, +1\\}$, the **functional margin** of point $i$ is $y_i f(x_i)$, positive when correct. Its geometric distance to the hyperplane is $y_i f(x_i)/\\|w\\|$. Because $w$ and $b$ can be rescaled freely, fix the scale so that the closest points have functional margin exactly 1. The margin is then $1/\\|w\\|$ on each side, and the hard-margin SVM is\n\n$$\\min_{w,b}\\; \\tfrac12\\|w\\|^2 \\quad \\text{s.t.}\\quad y_i(w^\\top x_i + b) \\ge 1 \\;\\; \\forall i.$$\n\n## Soft margin and the hinge loss\nReal data overlap, and one mislabelled point should not dictate the boundary. Add a slack $\\xi_i \\ge 0$ per point, allow $y_i f(x_i) \\ge 1 - \\xi_i$, and pay for slack:\n\n$$\\min_{w,b,\\xi}\\; \\tfrac12\\|w\\|^2 + C\\sum_i \\xi_i.$$\n\nAt the optimum, $\\xi_i = \\max(0, 1 - y_i f(x_i))$, so the problem is the unconstrained, regularised **hinge loss** $\\tfrac{\\lambda}{2}\\|w\\|^2 + \\tfrac1n\\sum_i \\max(0, 1 - y_i f(x_i))$ with $\\lambda = 1/(nC)$. That puts the SVM into the module 01 template: a linear class, a surrogate loss, an L2 penalty. Large $C$ (small $\\lambda$) tolerates few violations, giving a narrow margin and higher variance; small $C$ gives a wide margin with more violations.\n\n| Margin m = y f(x) | 0-1 loss | Hinge max(0, 1-m) | Logistic log(1+e^-m)\n| -1 (wrong) | 1 | 2 | 1.31\n| 0 (on boundary) | 1 | 1 | 0.69\n| 1 (on margin) | 0 | 0 | 0.31\n| 2 (safe) | 0 | 0 | 0.13\n\nBoth surrogates are convex upper bounds (up to scale) on the 0-1 loss. The difference is the right tail: hinge loss is exactly zero once a point is past the margin, so those points exert no force on the solution. Logistic loss keeps rewarding larger margins, which is what makes its outputs probabilities. SVM scores are not probabilities; if you need them, calibrate (03.04).\n\n## Pegasos: SGD on the primal\nFor linear SVMs on large datasets, the simplest effective solver is stochastic subgradient descent on the hinge objective. Pegasos (Shalev-Shwartz et al.) picks one example per step and uses step size $\\eta_t = 1/(\\lambda t)$:\n\n```python\nimport numpy as np\ndef pegasos(X, y, lam=1e-3, T=100_000, seed=0):   # y in {-1,+1}\n    rng = np.random.default_rng(seed); w = np.zeros(X.shape[1])\n    for t in range(1, T + 1):\n        i = rng.integers(len(y)); eta = 1.0 / (lam * t)\n        if y[i] * (X[i] @ w) < 1:                    # inside the margin: hinge is active\n            w = (1 - eta * lam) * w + eta * y[i] * X[i]\n        else:                                        # only the regulariser acts\n            w = (1 - eta * lam) * w\n    return w\n```\n\nEvery step shrinks $w$ (the regulariser's gradient); only margin violators add to it. The number of iterations needed for accuracy $\\epsilon$ scales like $1/(\\lambda\\epsilon)$ and does not depend on $n$, which is why it suits very large data. The bias is usually handled by appending a constant feature, which regularises it slightly; with standardised features that rarely matters. Compare the perceptron: it updates only on mistakes (margin $\\le 0$), never shrinks, and stops at any separating hyperplane, not the widest one.\n\n## The dual and support vectors\nSolving the constrained problem with Lagrange multipliers $\\alpha_i$ gives the dual:\n\n$$\\max_{\\alpha}\\; \\sum_i \\alpha_i - \\tfrac12\\sum_{i,j}\\alpha_i\\alpha_j y_i y_j\\, x_i^\\top x_j \\quad \\text{s.t.}\\quad 0 \\le \\alpha_i \\le C,\\; \\sum_i \\alpha_i y_i = 0,$$\n\nwith $w = \\sum_i \\alpha_i y_i x_i$. Two things to notice. The training data appear only as dot products $x_i^\\top x_j$, so replacing them with a kernel $k(x_i, x_j)$ gives a nonlinear SVM without ever forming features (02.06). And the optimality conditions sort points into three groups:\n\n%%layers Where each training point sits decides its multiplier, and only points with a nonzero multiplier shape the boundary.\nBeyond the margin | alpha = 0; no influence, could be deleted\n*On the margin | 0 < alpha < C; free support vectors, they pin the hyperplane\nInside the margin or misclassified | alpha = C; bounded support vectors, slack is positive\n%%\n\nTypically only a fraction of points are support vectors, which keeps kernel SVM predictions cheap.\n\n**Practical notes.** Standardise features: the margin is a Euclidean distance, so a feature in large units dominates it. Tune $C$ on a log grid by cross-validation. For linear problems use liblinear (`LinearSVC`) or SGD; libsvm (`SVC`) solves the dual and scales roughly between $n^2$ and $n^3$, so it suits tens of thousands of points, not millions.\n\n! Example: two Pegasos steps\n! $\\lambda = 0.1$, step $t = 10$, so $\\eta = 1/(0.1 \\cdot 10) = 1$. Current $w = (0.5, -0.2)$.\n! Example $x = (1, 2)$, $y = +1$: margin $0.5 - 0.4 = 0.1 < 1$, so $w \\leftarrow 0.9\\,(0.5, -0.2) + (1, 2) = (1.45, 1.82)$. Its margin is now $1.45 + 3.64 = 5.09$.\n! Next step $t = 11$, $\\eta = 0.909$, example $x = (2, 1)$, $y = +1$: margin $2.9 + 1.82 = 4.72 \\ge 1$, so only the shrink applies: $w \\leftarrow (1 - 0.0909)\\,w = (1.32, 1.65)$.\n\n> Takeaway: an SVM is L2-regularised hinge loss on a linear model. The hinge's flat region makes the solution depend only on support vectors, and its dual depends only on dot products, which opens the door to kernels.\n","q":"After training a soft-margin linear SVM (fixed C), you delete every training point that is not a support vector and retrain with the same C. What happens to the solution and why? Would the same trick work for L2-regularised logistic regression?","s":"The solution is unchanged. Points strictly beyond the margin have $\\alpha_i = 0$ and zero hinge loss, so they contribute nothing to the objective's (sub)gradient at the optimum. The original $(w, b)$ is still feasible for the reduced problem and still satisfies its optimality (KKT) conditions, and because the problem is convex, it is still optimal. This holds in the $C$ form; in the $\\lambda/n$ form you would have to rescale $\\lambda$, since $n$ changes. In practice, solvers use this to shrink the working set. It does not work for logistic regression: $\\log(1 + e^{-m})$ is positive for every finite margin, so every point exerts some pull on $w$. Deleting the well-classified points removes that pull, the regulariser then shrinks $w$ more, and the boundary and probabilities shift. Logistic regression has no sparse set of support vectors.","r":[["Pegasos: Primal Estimated sub-GrAdient SOlver for SVM","https://home.ttic.edu/~nati/Publications/PegasosMPB.pdf","Shalev-Shwartz, Singer, Srebro and Cotter: the algorithm, its step size and the n-independent convergence rate."],["Cornell CS4780 lecture notes: Support Vector Machine","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote09.html","Margin derivation, soft margin and the hinge-loss view."],["scikit-learn: Support Vector Machines","https://scikit-learn.org/stable/modules/svm.html","SVC vs LinearSVC, the C parameter, complexity and the warning about unscaled data."],["Stanford CS229 main notes","https://cs229.stanford.edu/main_notes.pdf","The SVM chapter: functional vs geometric margin, Lagrange duality and the KKT conditions."]],"k":["margin","hinge loss"],"x":["NumPy","scikit-learn"],"p":["svm-with-hinge-loss-sgd","perceptron","averaged-perceptron","subgradients-for-non-smooth-functions"],"ak":""},{"id":"02.06","t":"Kernels","n":["A **kernel** $k(x, x') = \\phi(x)^\\top\\phi(x')$ computes an inner product in a feature space without building $\\phi$; any algorithm that touches data only through inner products can be kernelised.","By the representer theorem, the regularised solution is $f(x) = \\sum_i \\alpha_i k(x_i, x)$: one coefficient per training point, not per feature.","The RBF kernel $e^{-\\gamma\\|x - x'\\|^2}$ corresponds to an infinite-dimensional feature space; $\\gamma$ sets the bump width, from near-linear (small) to memorising each point (large).","Kernel ridge regression solves $\\alpha = (K + \\lambda I)^{-1}y$: $O(n^3)$ time and $O(n^2)$ memory, so 50,000 points already need a 20 GB Gram matrix.","Past that scale, approximate the kernel with explicit features (random Fourier features, Nyström) and go back to a linear model."],"a":"## Feature maps and their cost\nEvery model in this module is linear in its features. To get a curved boundary you expand the features: $\\phi(x)$ adds squares, products, higher powers. The cost explodes. All monomials up to degree $p$ in $d$ variables number $\\binom{d+p}{p}$; for $d = 100$ and $p = 3$ that is 176,851 features per example. Most of that work is wasted if the algorithm only ever needs inner products between examples.\n\n## The kernel trick\nLook back at the SVM dual (02.05): the data appear only as $x_i^\\top x_j$. Ridge regression can be rewritten the same way. If we replace every inner product with a function $k(x, x')$ that equals $\\phi(x)^\\top\\phi(x')$ for some $\\phi$, the algorithm runs in feature space without ever computing $\\phi$.\n\nThe polynomial case shows it concretely. For $x \\in \\mathbb{R}^2$,\n\n$$(x^\\top x')^2 = x_1^2 x_1'^2 + 2x_1x_2x_1'x_2' + x_2^2x_2'^2 = \\phi(x)^\\top\\phi(x'),\\quad \\phi(x) = (x_1^2, \\sqrt2\\,x_1x_2, x_2^2).$$\n\nOne dot product and one square replace building three features; for degree 3 in 100 dimensions, one dot product and a cube replace 176,851.\n\nTwo results make this general:\n- **Representer theorem.** For a loss on training predictions plus an L2 penalty $\\lambda\\|w\\|^2$, the minimiser lies in the span of the training points' features: $w = \\sum_i \\alpha_i\\phi(x_i)$, so $f(x) = \\sum_i \\alpha_i k(x_i, x)$. You learn $n$ coefficients no matter how many features $\\phi$ has, even infinitely many.\n- **Mercer's condition.** A symmetric function is a valid kernel exactly when every Gram matrix $K_{ij} = k(x_i, x_j)$ it produces is positive semi-definite. Sums, positive multiples and products of kernels are kernels, which lets you build new ones.\n\n%%flow Two ways to get the same nonlinear model; the kernel route costs depend on n, the explicit route on the number of features.\n[Explicit] Input x -(expand)-> Features phi(x) -(dot with w)-> Prediction\n[Kernel] Input x -(compare with each x_i)-> *k(x_i, x) for all i -(weight by alpha_i, sum)-> Prediction\n%%\n\n## Common kernels\n| Kernel | Formula | Feature space | Main knob\n| Linear | $x^\\top x'$ | the inputs themselves | none\n| Polynomial | $(\\gamma\\,x^\\top x' + c)^p$ | all monomials up to degree p | degree p, offset c\n| RBF (Gaussian) | $\\exp(-\\gamma\\|x - x'\\|^2)$ | infinite-dimensional | width gamma\n| Sigmoid | $\\tanh(\\gamma\\,x^\\top x' + c)$ | not always PSD | rarely worth it\n\nThe RBF kernel is the default nonlinear choice. It measures similarity: 1 for identical points, falling toward 0 with distance on a length scale of about $1/\\sqrt{\\gamma}$. The prediction is a weighted sum of bumps centred on training points. Small $\\gamma$ gives wide bumps and an almost linear function; large $\\gamma$ gives narrow bumps that fit each point separately. scikit-learn's default `gamma=\"scale\"` is $1/(d \\cdot \\mathrm{Var}(X))$, a sensible start on standardised data; tune $\\gamma$ and the regularisation strength together on a log grid, because they interact. Kernels are distance-based, so standardise first, exactly as for kNN (03.02).\n\n## Kernel ridge regression\nRidge regression's solution can be rewritten as $w = X^\\top(XX^\\top + \\lambda I)^{-1}y$ (multiply out both forms to check). Here $XX^\\top$ is the $n \\times n$ matrix of inner products, so with a kernel:\n\n$$\\alpha = (K + \\lambda I)^{-1}y, \\qquad f(x) = \\sum_i \\alpha_i\\, k(x_i, x).$$\n\n```python\nimport numpy as np\ndef rbf(A, B, gamma):\n    d2 = (A**2).sum(1)[:, None] + (B**2).sum(1)[None, :] - 2 * A @ B.T\n    return np.exp(-gamma * np.maximum(d2, 0))\n\ndef krr_fit(X, y, gamma, lam):\n    K = rbf(X, X, gamma)\n    return np.linalg.solve(K + lam * np.eye(len(X)), y)   # alpha; Cholesky in practice\n\ndef krr_predict(Xtr, alpha, Xnew, gamma):\n    return rbf(Xnew, Xtr, gamma) @ alpha\n```\n\nThe same formula is the posterior mean of a Gaussian process with covariance $k$ and noise variance $\\lambda$, which is why the GP literature is a good second reference. Unlike the SVM, kernel ridge's $\\alpha$ is dense: every training point participates in every prediction.\n\nThe costs are what limit kernel methods. Training is $O(n^3)$ time and $O(n^2)$ memory; prediction is $O(nd)$ per query. At $n = 50{,}000$, $K$ has $2.5 \\times 10^9$ entries, 20 GB in float64. Kernel SVMs fare somewhat better thanks to sparsity, but they too slow down past roughly $10^5$ points.\n\n## Scaling: back to explicit features\nThe way out is to approximate the kernel with a modest number of explicit features and then fit a linear model, which costs $O(nD^2)$ for $D$ features instead of $O(n^3)$.\n- **Random Fourier features** (Rahimi and Recht): draw $\\Omega \\in \\mathbb{R}^{D \\times d}$ with entries from $\\mathcal{N}(0, 2\\gamma)$ and $b$ uniform on $[0, 2\\pi]$, and set $z(x) = \\sqrt{2/D}\\cos(\\Omega x + b)$. Then $z(x)^\\top z(x') \\approx e^{-\\gamma\\|x - x'\\|^2}$, with error shrinking like $1/\\sqrt{D}$.\n- **Nyström**: pick $m$ landmark points, compute the kernel against them, and use a low-rank approximation of $K$.\n\nWith $D$ or $m$ in the low thousands, these usually match the exact kernel model closely, and they work with any linear learner from this module.\n\n! Example: checking the polynomial kernel\n! $x = (1, 2)$ and $x' = (3, 1)$. Kernel: $x^\\top x' = 3 + 2 = 5$, squared is $25$.\n! Features: $\\phi(x) = (1, 2\\sqrt2, 4)$ and $\\phi(x') = (9, 3\\sqrt2, 1)$. Their dot product is $9 + 2\\sqrt2 \\cdot 3\\sqrt2 + 4 = 9 + 12 + 4 = 25$. Same answer, without building $\\phi$.\n\n> Takeaway: kernels let linear algorithms work in huge or infinite feature spaces by replacing inner products, at a cost that scales with the number of training points. Use them on small and medium data; at scale, approximate them with explicit random or Nyström features.\n","q":"You fit RBF kernel ridge regression and set gamma to an extremely large value. What does the Gram matrix approach, what do the predictions on training points and on new test points look like, and what does the opposite extreme (gamma near zero) do?","s":"As $\\gamma \\to \\infty$, $k(x_i, x_j) = e^{-\\gamma\\|x_i - x_j\\|^2}$ goes to 0 for every distinct pair and stays 1 on the diagonal, so $K \\to I$. Then $\\alpha = (I + \\lambda I)^{-1}y = y/(1+\\lambda)$, and training predictions are $y_i/(1+\\lambda)$: near-memorisation, shrunk only by the ridge term. A new point is far, on that tiny length scale, from every training point, so all its kernel values are about 0 and it predicts about 0 (the mean, if $y$ was centred). That is a lookup table: training error near zero, test error near the variance of $y$. As $\\gamma \\to 0$, every kernel value approaches 1 and $K$ approaches the all-ones matrix, so the model can represent little beyond a constant. To second order the kernel behaves like a low-degree polynomial in $x$, so the fit becomes very smooth and underfits. The useful $\\gamma$ sits between, chosen by cross-validation jointly with $\\lambda$.","r":[["Cornell CS4780 lecture notes: Kernels","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote13.html","Kernelising linear algorithms, well-defined kernels and kernel composition rules."],["Random Features for Large-Scale Kernel Machines","https://papers.nips.cc/paper/2007/hash/013a006f03dbc5392effeb8f18fda755-Abstract.html","Rahimi and Recht (NeurIPS 2007): random Fourier features and their approximation guarantee."],["scikit-learn: Kernel ridge regression","https://scikit-learn.org/stable/modules/kernel_ridge.html","KernelRidge vs SVR, with timing comparisons that show the n-squared and n-cubed costs."],["Gaussian Processes for Machine Learning","https://gaussianprocess.org/gpml/","Rasmussen and Williams, chapters 2 and 4: the GP view of kernel ridge and a catalogue of kernels. Free PDF."]],"k":["kernel trick","RBF kernel"],"x":["NumPy","scikit-learn"],"p":["rbf-kernel-matrix","euclidean-distance","cholesky-decomposition","svm-with-hinge-loss-sgd"],"ak":""}]},{"n":"03","name":"Probabilistic and instance-based models","lessons":[{"id":"03.01","t":"Naive Bayes","n":["A **generative** classifier models $p(y)$ and $p(x \\mid y)$ and classifies with Bayes' rule, $p(y \\mid x) \\propto p(y)\\,p(x \\mid y)$; a discriminative one (logistic regression) models $p(y \\mid x)$ directly.","Naive Bayes assumes features are **conditionally independent given the class**, so $p(x \\mid y) = \\prod_j p(x_j \\mid y)$: $d$ simple estimates per class instead of an exponential joint table.","The assumption is usually false, so the probabilities are overconfident (correlated evidence is counted twice), but the argmax is often still right.","Pick the variant by feature type: Gaussian for continuous, multinomial for counts (text), Bernoulli for binary presence; multinomial NB is a linear classifier in the counts.","**Smoothing** (add $\\alpha$ to every count) stops one unseen feature from forcing a class probability to exactly zero."],"a":"## Where this module goes\nModule 02 fitted $p(y \\mid x)$ or a decision function directly. Those are **discriminative** models. This module covers two different families. **Generative** classifiers model how each class produces its inputs, $p(x \\mid y)$, together with class frequencies $p(y)$, and turn that into a prediction with Bayes' rule: naive Bayes here, discriminant analysis in 03.03. **Instance-based** methods skip the model and compare a query to stored examples: k-nearest neighbours in 03.02. The module ends with calibration (03.04), which asks whether any classifier's probabilities mean what they say. Bayes' rule itself is covered in ML Maths (lesson 10.01).\n\n## Generative classification and the independence assumption\nBayes' rule gives\n\n$$p(y = k \\mid x) = \\frac{p(y = k)\\,p(x \\mid y = k)}{\\sum_c p(y = c)\\,p(x \\mid y = c)}.$$\n\nThe prior $p(y = k)$ is just the class frequency. The hard part is the class-conditional density $p(x \\mid y)$. With $d = 30$ binary features, a full table needs $2^{30} - 1 \\approx 10^9$ probabilities per class, far more than any dataset can estimate.\n\nNaive Bayes makes one strong assumption: given the class, features are independent,\n\n$$p(x \\mid y = k) = \\prod_{j=1}^{d} p(x_j \\mid y = k).$$\n\nNow each class needs $d$ one-dimensional estimates, which take a single pass over the data to compute: counting, no optimisation. Classify by the largest log-posterior, $\\log p(y = k) + \\sum_j \\log p(x_j \\mid y = k)$; working in logs avoids multiplying hundreds of small numbers into underflow.\n\n%%flow Naive Bayes fits by counting and predicts by adding log-probabilities, one term per feature.\nTraining data -(count per class)-> Priors and per-feature likelihoods -(new x: sum logs)-> Log-posterior per class -(argmax)-> *Prediction\n%%\n\n## Why it works anyway, and where it doesn't\nWords in an email are not independent given \"spam\": \"free\" and \"offer\" co-occur. So why does naive Bayes classify text well? Classification only needs the right class to have the highest score, not correct probabilities. Correlated features push the score in the same direction more than once, which inflates its size but often leaves its sign intact.\n\nThe cost shows up in the probabilities. If one feature is duplicated, its log-likelihood ratio is added twice, which is the same as squaring its likelihood ratio. Posteriors get pushed toward 0 and 1, so naive Bayes probabilities are typically overconfident and need calibration (03.04) before you use them as probabilities.\n\nNg and Jordan compared naive Bayes with logistic regression, its discriminative counterpart. Naive Bayes approaches its best error with far fewer examples (on the order of $\\log d$ rather than $d$), but logistic regression usually reaches a lower error once data is plentiful. That is the generative trade in general: a stronger assumption buys sample efficiency at the price of bias when the assumption is wrong. With a few hundred labelled documents, naive Bayes is a strong baseline; with a million, logistic regression on the same features usually wins.\n\n## Variants by feature type\n| Variant | Feature type | Model of p(x_j given y) | Typical use\n| Gaussian | continuous | normal with per-class mean and variance | sensor or tabular features\n| Multinomial | counts | word-frequency distribution over the vocabulary | text classification with counts or TF-IDF\n| Bernoulli | binary | presence or absence per feature | short texts, binary flags\n| Complement | counts | fitted on all other classes | imbalanced text classes\n\nTwo facts help in interviews and in debugging. **Multinomial NB is linear**: its log-posterior is $\\log\\pi_k + \\sum_j x_j\\log\\theta_{kj}$, a weight per word times its count. It is a linear classifier with weights set by counting instead of by optimisation. **Bernoulli NB also penalises absence**: a word typical of spam that is missing from a message lowers the spam score, which multinomial NB ignores. And Gaussian NB is QDA with diagonal covariance matrices, which ties it to lesson 03.03.\n\n## Smoothing\nThe maximum-likelihood estimate for multinomial NB is $\\theta_{kj} = N_{kj}/N_k$, the share of word $j$ among all words in class $k$. If a word never appeared in spam during training, $\\theta = 0$, its log is $-\\infty$, and any message containing it can never be spam, however much other evidence there is. Additive smoothing fixes this:\n\n$$\\theta_{kj} = \\frac{N_{kj} + \\alpha}{N_k + \\alpha d}.$$\n\n$\\alpha = 1$ is Laplace smoothing, $\\alpha < 1$ is Lidstone. It equals the posterior mean under a symmetric Dirichlet prior. Tune $\\alpha$ by cross-validation on a log grid; for large vocabularies, values like 0.01 to 0.1 often beat 1.\n\n```python\nimport numpy as np\ndef fit_mnb(X, y, alpha=1.0):          # X: (n, d) word counts, y: (n,) labels\n    classes = np.unique(y)\n    log_prior = np.log([np.mean(y == c) for c in classes])\n    counts = np.stack([X[y == c].sum(axis=0) for c in classes]) + alpha\n    log_theta = np.log(counts / counts.sum(axis=1, keepdims=True))\n    return classes, log_prior, log_theta\n\ndef predict_mnb(model, X):\n    classes, log_prior, log_theta = model\n    return classes[np.argmax(X @ log_theta.T + log_prior, axis=1)]   # linear in counts\n```\n\n! Example: a four-word spam filter\n! Vocabulary: free, win, meeting, report. Training word counts are spam (3, 2, 0, 1), total 6, and ham (1, 0, 4, 3), total 8. Priors: spam 0.4, ham 0.6.\n! With $\\alpha = 1$ and $d = 4$: spam $\\theta = (4, 3, 1, 2)/10 = (0.4, 0.3, 0.1, 0.2)$; ham $\\theta = (2, 1, 5, 4)/12 = (0.167, 0.083, 0.417, 0.333)$.\n! Message \"free win meeting\": spam score $0.4 \\cdot 0.4 \\cdot 0.3 \\cdot 0.1 = 0.0048$; ham score $0.6 \\cdot 0.167 \\cdot 0.083 \\cdot 0.417 = 0.0035$. Normalised, $p(\\text{spam}) = 0.58$.\n! Without smoothing, spam's count for \"meeting\" is 0, so the spam score is exactly 0 and the filter is certain the message is ham, despite \"free\" and \"win\".\n\n> Takeaway: naive Bayes is a generative classifier that trains by counting under a conditional-independence assumption. It is fast, data-efficient and a strong text baseline, but smooth the counts and don't trust its probabilities without calibration.\n","q":"Through a pipeline bug, every token in your documents is counted twice (each word's count is doubled, and a copied bigram feature duplicates most unigrams). How does this affect a multinomial naive Bayes classifier's predicted classes and probabilities, compared with an L2-regularised logistic regression trained on the same features?","s":"For naive Bayes, the log-posterior is $\\log\\pi_k + \\sum_j x_j\\log\\theta_{kj}$. Doubling every count doubles the likelihood term while the prior term stays the same, so the evidence now outweighs the prior twice as heavily. Predictions can flip toward the class the words favour, especially for rare classes whose prior was holding them back. Posteriors are pushed further toward 0 and 1, because each likelihood ratio is effectively squared. Duplicated features have the same effect, since their evidence is counted twice. Logistic regression learns its weights by maximising conditional likelihood. If the counts double, it can halve its weights; if a feature is duplicated, L2 splits the weight between the copies. In both cases its predictions and probabilities stay roughly unchanged. Discriminative training corrects for redundancy; naive Bayes, by assumption, cannot.","r":[["On Discriminative vs. Generative Classifiers","https://papers.nips.cc/paper/2001/hash/7b7a53e239400a13bd6be6c91c4f6c4e-Abstract.html","Ng and Jordan (NeurIPS 2001): naive Bayes converges faster, logistic regression ends lower."],["Cornell CS4780 lecture notes: Bayes Classifier and Naive Bayes","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote05.html","Derivation of the variants and the proof that multinomial NB is linear."],["scikit-learn: Naive Bayes","https://scikit-learn.org/stable/modules/naive_bayes.html","Gaussian, multinomial, complement and Bernoulli NB, with their smoothing parameters."]],"k":["generative models","smoothing"],"x":["NumPy","scikit-learn"],"p":["text-classification","gaussian-naive-bayes","bayes-theorem","n-gram-language-model","bag-of-words"],"ak":""},{"id":"03.02","t":"k-nearest neighbours","n":["kNN stores the training set and predicts by majority vote (or mean) of the $k$ closest points: no training cost, $O(nd)$ work per query by brute force.","The distance metric *is* the model: unscaled features let the largest-unit feature dominate, and irrelevant features add noise to every distance.","Small $k$ means low bias and high variance (1-NN has zero training error); large $k$ smooths toward the majority class. Choose $k$ by cross-validation.","In high dimensions neighbourhoods stop being local: to capture 1% of uniform data in 10 dimensions you need a cube spanning 63% of each axis, and distances concentrate.","kNN works when data lie near a low-dimensional manifold or in a learned embedding space; at scale it relies on tree indexes or approximate nearest-neighbour search."],"a":"## The algorithm\nk-nearest neighbours is the purest instance-based method. \"Training\" is storing the data. To predict for a query $x$:\n1. Compute its distance to every training point.\n2. Take the $k$ closest.\n3. Classification: majority vote among their labels, optionally weighted by $1/\\text{distance}$. Regression: their mean.\n\nThere is no fitted parameter vector, so kNN can represent arbitrarily complicated boundaries given enough data. A classic result (Cover and Hart, 1967) says that as $n \\to \\infty$ the 1-NN error is at most twice the Bayes error, which is remarkable for a method with no training. The catch is in \"as $n \\to \\infty$\": the data needed grows quickly with dimension.\n\n%%flow Every prediction scans the stored data; the metric and k are the only modelling choices.\nQuery x -(distance to all n points)-> Sorted distances -(take k smallest)-> *k neighbours -(vote or average)-> Prediction\n%%\n\n## The distance metric is the model\nkNN has no weights to learn which features matter, so the metric decides.\n\n| Metric | Formula | Use when\n| Euclidean | $\\sqrt{\\sum_j (x_j - x'_j)^2}$ | continuous, standardised features\n| Manhattan | $\\sum_j |x_j - x'_j|$ | robust to a single large coordinate difference\n| Cosine distance | $1 - \\frac{x^\\top x'}{\\|x\\|\\|x'\\|}$ | direction matters, length doesn't: text, embeddings\n| Mahalanobis | $\\sqrt{(x - x')^\\top S^{-1}(x - x')}$ | correlated features with a known covariance\n| Hamming | number of differing coordinates | categorical or binary codes\n\nTwo failure modes come up constantly:\n- **Scale.** With income in dollars (spread around 30,000) and age in years (spread around 12), Euclidean distance is essentially income distance. Standardise with training statistics, and apply the same transform to queries.\n- **Irrelevant features.** Each useless feature adds random variation to every distance. With 5 useful and 50 noise features, nearest neighbours are mostly chosen by noise. Feature selection or a learned metric matters more for kNN than for any model in module 02, which can set an irrelevant weight to zero.\n\n## Choosing k\n$k$ is the complexity knob, running in the opposite direction from most knobs. With $k = 1$ every training point is its own neighbour: zero training error, a jagged boundary that wraps around every noisy label, high variance. As $k$ grows, predictions average over more points and the boundary smooths. At $k = n$ every query gets the majority class. Validation error against $k$ is U-shaped, as lesson 01.02 predicts, and a rough sense of effective complexity is $n/k$ \"parameters\".\n\nPractical rules: choose $k$ by cross-validation over values like 1, 3, 5, ..., 51; prefer odd $k$ for binary problems to avoid ties; use distance weighting when the closest neighbours are much closer than the $k$-th; and expect larger optimal $k$ with noisier labels.\n\n## The curse of dimensionality\nkNN assumes your neighbours are similar to you. In high dimensions there are no close neighbours.\n\n**Volume.** Put $n$ points uniformly in the unit cube $[0,1]^d$. A sub-cube capturing a fraction $r$ of the points needs edge length $r^{1/d}$. For $r = 0.01$: 0.1 in 2 dimensions, 0.63 in 10, 0.955 in 100. A neighbourhood holding 1% of the data spans almost the whole range of every feature, so it is not local any more.\n\n**Distance concentration.** For many independent features, the distances from a query to its nearest and farthest points become nearly equal: the ratio $(\\text{max} - \\text{min})/\\text{min}$ shrinks toward 0 as $d$ grows. When everything is about equally far away, \"nearest\" carries little information.\n\n**Sample size.** To keep the same neighbourhood size as $d$ grows, $n$ must grow exponentially in $d$.\n\nkNN still works in practice for two reasons. Real data usually lie near a low-dimensional manifold: images of digits have 784 pixels but far fewer real degrees of freedom. And you can move to a space where distance means something: PCA (module 05) or a learned embedding, where kNN becomes retrieval.\n\n## Making it fast\nBrute force is $O(nd)$ per query, which is fine for $10^5$ points and vectorises well:\n\n```python\nimport numpy as np\ndef knn_predict(Xtr, ytr, Xq, k=5):           # ytr: non-negative int labels\n    d2 = (Xq**2).sum(1)[:, None] + (Xtr**2).sum(1)[None, :] - 2 * Xq @ Xtr.T\n    idx = np.argpartition(d2, k, axis=1)[:, :k]   # k smallest, unordered: O(n) per row\n    return np.array([np.bincount(row).argmax() for row in ytr[idx]])\n```\n\nKD-trees and ball trees give exact answers faster in low dimensions (roughly $d \\lesssim 20$) but degrade to brute force beyond that, the curse again. For millions of embedding vectors, use approximate nearest-neighbour indexes such as HNSW or IVF, which trade a little recall for orders-of-magnitude speed; the AI Engineering course (lessons 02.06-02.07) covers them.\n\n! Example: k changes the answer\n! Red points at (1, 1) and (2, 1); blue points at (3, 2.2), (4, 3) and (5, 4). Query (2.5, 1.5).\n! Distances: (2, 1) 0.71 red, (3, 2.2) 0.86 blue, (1, 1) 1.58 red, (4, 3) 2.12 blue, (5, 4) 3.54 blue.\n! $k = 1$: red. $k = 3$: red 2, blue 1, so red. $k = 5$: blue 3, red 2, so blue. Multiply the second coordinate by 100 (a unit change) and the neighbour order is set almost entirely by that coordinate: the answer depends on units, not on the problem.\n\n> Takeaway: kNN is only as good as its distance. Standardise, drop irrelevant features, pick k by cross-validation, and in high dimensions move to a space (PCA or a learned embedding) where nearness means similarity.\n","q":"A kNN classifier gets 90% accuracy on a 5-feature problem. You append 50 features of pure random noise (same scale as the standardised real features). Predict what happens to kNN's accuracy and to an L1-regularised logistic regression's accuracy, and explain the difference.","s":"kNN degrades sharply, likely toward chance. Squared Euclidean distance is a sum over features, so the 50 noise features contribute about 10 times as much variation as the 5 real ones. Neighbours are then chosen mostly by noise, and the vote is close to random among nearby labels. Distances also concentrate as dimension rises, so the nearest points are barely nearer than the rest. kNN has no mechanism to discount a feature. L1-regularised logistic regression barely changes. Each noise feature has near-zero correlation with the label, so its coefficient falls below the soft-threshold and is set exactly to zero, leaving essentially the original 5-feature model. There is a small variance cost from occasional spurious selections. The lesson: models that learn per-feature weights can ignore junk, while kNN needs feature selection or a learned metric done for it.","r":[["Cornell CS4780 lecture notes: k-Nearest Neighbors","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote02_kNN.html","The algorithm, the Cover-Hart bound and a clear treatment of the curse of dimensionality."],["scikit-learn: Nearest Neighbors","https://scikit-learn.org/stable/modules/neighbors.html","Brute force vs KD-tree vs ball tree, when each wins, and the available metrics."],["The Elements of Statistical Learning, ch. 2.5 and 13","https://hastie.su.domains/ElemStatLearn/","Local methods in high dimensions (the edge-length calculation) and prototype methods."]],"k":["distance metrics","curse of dimensionality"],"x":["NumPy","scikit-learn"],"p":["knn-classifier","distance-metrics","euclidean-distance","feature-scaling","embedding-similarity"],"ak":""},{"id":"03.03","t":"Discriminant analysis","n":["Discriminant analysis is a generative classifier with Gaussian class-conditionals $p(x \\mid y = k) = \\mathcal{N}(\\mu_k, \\Sigma_k)$, fitted by class means, covariances and frequencies: no iterative optimisation.","**QDA** gives each class its own $\\Sigma_k$, so boundaries are quadratic; it needs $K\\,d(d+1)/2$ covariance parameters and breaks when a class has fewer than $d$ samples.","**LDA** shares one $\\Sigma$ across classes; the quadratic terms cancel and the boundary is linear, $w = \\Sigma^{-1}(\\mu_1 - \\mu_0)$ for two classes.","LDA and logistic regression have the same functional form but are fitted differently: LDA is more data-efficient if the Gaussian assumption holds, logistic regression more robust when it doesn't.","Shrinking covariance estimates (toward a pooled or diagonal matrix) interpolates between QDA, LDA and Gaussian naive Bayes."],"a":"## Gaussian class-conditionals\nNaive Bayes (03.01) made the class-conditional density easy by assuming independent features. Discriminant analysis keeps the correlations but assumes a shape: each class is a multivariate Gaussian,\n\n$$p(x \\mid y = k) = \\mathcal{N}(x;\\, \\mu_k, \\Sigma_k).$$\n\nFitting is plug-in maximum likelihood: class frequencies $\\hat\\pi_k$, class means $\\hat\\mu_k$ and covariance estimates. Classification picks the largest **discriminant score**, the log of prior times density with shared constants dropped:\n\n$$\\delta_k(x) = -\\tfrac12\\log|\\Sigma_k| - \\tfrac12(x - \\mu_k)^\\top\\Sigma_k^{-1}(x - \\mu_k) + \\log\\pi_k.$$\n\nThe middle term is minus half the squared Mahalanobis distance from $x$ to the class mean, so the rule is \"nearest mean, measured in each class's own covariance, adjusted for prior and spread\".\n\n%%flow Discriminant analysis fits in one pass: statistics per class, then a score per class at prediction time.\n[Fit] Labelled data -(per class)-> Means and priors -(per class or pooled)-> *Covariance estimates\n[Predict] New x -(Mahalanobis distance to each mean)-> Discriminant scores -(argmax)-> Class\n%%\n\n## QDA: one covariance per class\nWith a separate $\\Sigma_k$ per class, $\\delta_k$ is quadratic in $x$ and so are the boundaries $\\delta_k = \\delta_j$: ellipses, parabolas, hyperbolas. That flexibility costs parameters, $K\\big(d + d(d+1)/2\\big)$ in all; for $d = 50$ and $K = 3$, that is 3,975. Each $\\Sigma_k$ is estimated from that class's $n_k$ points only, and if $n_k \\le d$ the estimate is singular and $\\Sigma_k^{-1}$ does not exist. Even with $n_k$ a few times $d$, the smallest eigenvalues are badly underestimated and their inverses blow up the scores.\n\n## LDA: one shared covariance\nAssume all classes share $\\Sigma$, estimated by pooling within-class scatter from every class. Then $-\\tfrac12 x^\\top\\Sigma^{-1}x$ is the same for every class and cancels, leaving a linear score:\n\n$$\\delta_k(x) = x^\\top\\Sigma^{-1}\\mu_k - \\tfrac12\\mu_k^\\top\\Sigma^{-1}\\mu_k + \\log\\pi_k.$$\n\nFor two classes the boundary is the hyperplane with normal $w = \\Sigma^{-1}(\\mu_1 - \\mu_0)$. If $\\Sigma$ were the identity, this would point straight from one mean to the other; $\\Sigma^{-1}$ tilts it away from directions where the classes are naturally spread out.\n\n**LDA versus logistic regression.** Both give $\\log\\frac{p(y=1 \\mid x)}{p(y=0 \\mid x)} = w^\\top x + b$. LDA estimates $w$ from means and a covariance, using the full joint distribution of $x$. Logistic regression maximises the conditional likelihood and ignores how $x$ is distributed. When the classes really are Gaussian with shared covariance, LDA extracts more from each example. When they aren't (heavy tails, outliers, binary or skewed features), logistic regression is more robust, because a far-away outlier moves LDA's mean and covariance but barely moves logistic regression's boundary.\n\n**Fisher's view.** Independently of any Gaussian story, LDA's directions maximise between-class variance relative to within-class variance. There are at most $K - 1$ such directions, which makes LDA a supervised dimensionality reduction: project 50 features onto 2 directions to plot a 3-class problem. In scikit-learn, `LinearDiscriminantAnalysis.transform` does exactly this.\n\n## The family, and shrinkage\n| Model | Covariance assumption | Boundary | Covariance parameters | Good when\n| Gaussian naive Bayes | diagonal, per class | quadratic, axis-aligned | K d | many features, little data\n| LDA | full, shared | linear | d(d+1)/2 | moderate data, similar class shapes\n| QDA | full, per class | quadratic | K d(d+1)/2 | plenty of data per class, different shapes\n| Logistic regression | none (discriminative) | linear | none | non-Gaussian features, enough data\n\nThese are points on a continuum. **Regularised discriminant analysis** blends $\\Sigma_k(\\alpha) = \\alpha\\hat\\Sigma_k + (1 - \\alpha)\\hat\\Sigma_{\\text{pooled}}$ to move between QDA and LDA, and shrinks further toward a scaled identity to stabilise inverses. **Ledoit-Wolf shrinkage** chooses the shrinkage amount analytically; in scikit-learn, `LinearDiscriminantAnalysis(solver=\"lsqr\", shrinkage=\"auto\")` uses it and is the right default when $d$ is not small relative to $n$.\n\n```python\nimport numpy as np\ndef lda_fit(X, y):\n    classes = np.unique(y)\n    mu = np.stack([X[y == c].mean(0) for c in classes])\n    Xc = X - mu[np.searchsorted(classes, y)]          # within-class centring\n    S = Xc.T @ Xc / (len(X) - len(classes))           # pooled covariance\n    W = np.linalg.solve(S, mu.T).T                    # rows: Sigma^-1 mu_k\n    b = -0.5 * (W * mu).sum(1) + np.log([np.mean(y == c) for c in classes])\n    return classes, W, b                              # score = X @ W.T + b\n```\n\n! Example: priors and unequal variances in one dimension\n! Class 0 is $\\mathcal{N}(0, 1)$ and class 1 is $\\mathcal{N}(2, 1)$. With equal priors the LDA boundary is the midpoint, $x = 1$.\n! With $\\pi_1 = 0.2$: the boundary moves to $x = 1 + \\sigma^2\\log(\\pi_0/\\pi_1)/(\\mu_1 - \\mu_0) = 1 + \\ln 4/2 = 1.69$, away from the rarer class.\n! Now let class 1 have variance 4 (QDA, equal priors). Setting $-\\tfrac12 x^2 = -\\tfrac12\\ln 4 - (x-2)^2/8$ gives $3x^2 + 4x - 9.55 = 0$, so $x = 1.24$ or $x = -2.57$. Class 0 wins only between them. The wider class claims both tails, a boundary no linear model can produce.\n\n> Takeaway: discriminant analysis is Gaussian generative classification. Shared covariance gives LDA's linear boundary, per-class covariance gives QDA's quadratic one, and shrinkage between them is how you make either work when features are many and samples few.\n","q":"You have 200 features, 3 classes and 150 training samples per class. QDA crashes or performs terribly, LDA does reasonably, and LDA with shrinkage does best. Explain each outcome in terms of what is being estimated.","s":"QDA estimates a separate $200 \\times 200$ covariance per class, 20,100 free parameters each, from 150 points. A sample covariance from 150 points has rank at most 149, so it is singular and cannot be inverted. Even with a pseudo-inverse or a tiny ridge, the near-zero eigenvalues make the Mahalanobis terms explode along directions the data never explored. LDA pools all 450 points into one covariance, rank up to 447, so it is invertible. But with 20,100 parameters from 450 points the small eigenvalues are still underestimated and the inverse is noisy, which costs accuracy. Shrinkage (Ledoit-Wolf, or blending toward a scaled identity or diagonal) trades a little bias for a big drop in variance: it lifts the small eigenvalues and stabilises $\\Sigma^{-1}$. That is the bias-variance trade from module 01, applied to the covariance estimate instead of the weights.","r":[["scikit-learn: Linear and Quadratic Discriminant Analysis","https://scikit-learn.org/stable/modules/lda_qda.html","The maths of both, LDA as dimensionality reduction, and Ledoit-Wolf shrinkage with the lsqr solver."],["The Elements of Statistical Learning, ch. 4.3","https://hastie.su.domains/ElemStatLearn/","LDA, QDA, regularised discriminant analysis and Fisher's reduced-rank view."],["An Introduction to Statistical Learning","https://www.statlearning.com/","Chapter 4 compares LDA, QDA, naive Bayes and logistic regression on the same problems. Free PDF."]],"k":["generative models","covariance shrinkage"],"x":["NumPy","scikit-learn"],"p":["linear-discriminant-analysis","gaussian-naive-bayes","mahalanobis-distance","maximum-likelihood-estimation","gradient-of-multivariate-gaussian-log-pdf"],"ak":""},{"id":"03.04","t":"Calibrated probabilities","n":["A classifier is **calibrated** if, among cases where it predicts $p$, the event happens a fraction $p$ of the time; this is separate from discrimination, which AUC measures and any monotone transform leaves unchanged.","Check it with a **reliability diagram** (mean prediction against observed frequency per bin), and summarise it with ECE alongside a proper scoring rule such as log loss or the Brier score.","**Platt scaling** fits $\\sigma(a s + b)$ to held-out scores: two parameters, little data needed, good for sigmoid-shaped distortion. Temperature scaling is its one-parameter multiclass cousin.","**Isotonic regression** fits any non-decreasing map with pool-adjacent-violators: more flexible, but it needs roughly a thousand or more calibration points and can overfit.","Always calibrate on data the model was not trained on, and recalibrate after resampling, class reweighting or a change in base rate."],"a":"## What calibration means\nMany decisions use a probability as a number, not just to rank: expected cost $p \\cdot \\text{loss}$, an ad's expected value $p_{\\text{click}} \\times \\text{bid}$, a threshold chosen on last month's data, or combining several models' outputs. These need **calibration**:\n\n$$\\Pr(Y = 1 \\mid \\hat p(X) = p) = p \\quad \\text{for all } p.$$\n\nOf 1,000 emails given spam probability 0.8, about 800 should be spam. Calibration is separate from **discrimination**, how well scores rank positives above negatives. AUC measures ranking only, so any monotone transform of the scores keeps AUC and can wreck or repair calibration. A model can have excellent AUC with useless probabilities; one that predicts the base rate for everyone is perfectly calibrated and useless for ranking.\n\nModels from earlier lessons miscalibrate in characteristic ways:\n- **Naive Bayes**: pushed toward 0 and 1, because correlated evidence is double-counted (03.01).\n- **SVMs**: scores are margins, not probabilities (02.05).\n- **Boosted trees**: often pushed away from 0 and 1, a sigmoid-shaped distortion; **random forests** rarely predict near 0 or 1 because averaging trees pulls them in.\n- **Logistic regression**: usually close to calibrated when well specified and regularised lightly, since it directly optimises log loss.\n- **Modern deep networks**: often overconfident; Guo et al. found temperature scaling fixes much of it.\n\n## Measuring it\nA **reliability diagram** sorts predictions into bins (10 equal-width bins, or equal-count bins when predictions cluster), and plots each bin's mean predicted probability against the observed positive rate. Points on the diagonal mean calibrated; below it means overconfident on the high side.\n\n**Expected calibration error** summarises the gaps, weighted by bin size: $\\mathrm{ECE} = \\sum_b \\frac{n_b}{n}\\,|\\bar y_b - \\bar p_b|$. It is easy to read but depends on the binning and can be gamed (constant predictions score near zero). Report it next to a **proper scoring rule**: log loss or the Brier score $\\frac1n\\sum_i(\\hat p_i - y_i)^2$. Proper scores are minimised by the true probabilities and reward calibration and discrimination together. Module 06 covers the threshold-free ranking metrics; the ML in production module (09) covers monitoring calibration drift after launch.\n\n## Platt scaling and temperature scaling\nPlatt scaling fits a one-feature logistic regression on held-out scores $s$:\n\n$$\\hat p = \\sigma(a\\,s + b),$$\n\nwith $a, b$ chosen to minimise log loss on a calibration set. Two parameters means it needs little data (a few hundred examples) and rarely overfits. It assumes the distortion is sigmoid-shaped, which suits SVM margins and boosted trees well. Platt's paper also replaces 0/1 targets with $(N_+ + 1)/(N_+ + 2)$ and $1/(N_- + 2)$ to avoid overfitting on small sets.\n\n**Temperature scaling** is the multiclass version with one parameter: divide all logits by $T$ before the softmax and fit $T$ on validation log loss. $T > 1$ softens overconfident predictions. Because dividing by a positive constant never changes the argmax, accuracy is untouched.\n\n## Isotonic regression\nWhen the distortion is not sigmoid-shaped, fit an arbitrary non-decreasing step function from score to probability. The **pool-adjacent-violators** algorithm (PAV) does it in linear time after sorting:\n\n```python\ndef pav(y_sorted):                     # labels ordered by increasing score\n    blocks = []                        # each block: [mean, weight]\n    for v in y_sorted:\n        blocks.append([float(v), 1])\n        while len(blocks) > 1 and blocks[-2][0] > blocks[-1][0]:   # violation: merge\n            (m2, w2), (m1, w1) = blocks.pop(), blocks.pop()\n            blocks.append([(m1 * w1 + m2 * w2) / (w1 + w2), w1 + w2])\n    return [m for m, w in blocks for _ in range(w)]\n```\n\nIsotonic regression can fix any monotone distortion, but it has as many degrees of freedom as there are steps. With small calibration sets it overfits, and Niculescu-Mizil and Caruana found Platt better below roughly a thousand calibration points, isotonic better above. Its flat steps also create ties, which can lower AUC slightly.\n\n## Doing it without leakage\n%%flow Calibration is a second model fitted on data the first model never saw, then applied to its scores at serving time.\nTraining split -(fit)-> Classifier -(score)-> Calibration split -(fit Platt or isotonic)-> *Calibrator -(apply at serving)-> Probabilities\n%%\n\n- **Hold-out data.** A model's scores on its own training data are overconfident, so calibrating on them learns the wrong map. Use a separate split, or cross-validation: scikit-learn's `CalibratedClassifierCV(method=\"sigmoid\" or \"isotonic\", cv=5)` fits the calibrator on out-of-fold predictions.\n- **Resampling breaks calibration.** Undersampling negatives or using class weights shifts probabilities toward the minority class. Correct by shifting the logit by $\\log\\frac{\\pi}{1-\\pi} - \\log\\frac{\\pi_s}{1-\\pi_s}$, where $\\pi$ is the true base rate and $\\pi_s$ the training one, or recalibrate on data with the true rate.\n- **Base rates move.** If prevalence changes between training and deployment (prior shift), the same logit correction applies with the new rate. Recalibrate on recent labelled data.\n\n! Example: undoing balanced sampling, then PAV\n! A fraud model is trained on a 1:1 sample, but the true fraud rate is 1%. The logit shift is $\\ln(0.01/0.99) - \\ln(1) = -4.60$. A raw output of 0.5 (logit 0) becomes $\\sigma(-4.60) = 0.01$; a raw 0.9 (logit 2.20) becomes $\\sigma(-2.40) = 0.083$. Without the correction, the cost model would overstate fraud risk by a factor of 10 to 50.\n! PAV on labels sorted by score, $(0, 1, 0, 0, 1, 1)$: the 1 then 0 violate order and pool to 0.5; the next 0 violates again and pools to $1/3$. The result is $(0, \\tfrac13, \\tfrac13, \\tfrac13, 1, 1)$: a monotone step function.\n! ECE contribution of one bin: 200 of 1,000 predictions, mean prediction 0.80, observed rate 0.60, so $0.2 \\times 0.20 = 0.04$.\n\n> Takeaway: ranking quality and probability quality are different. Check calibration with a reliability diagram and a proper score, fix it on held-out data with Platt scaling (little data) or isotonic regression (lots), and recalibrate whenever sampling or base rates change.\n","q":"Your gradient-boosted model has validation AUC 0.91 but a reliability diagram shows it is overconfident at both ends (ECE 0.12). You have 300 labelled examples not used in training. Do you choose Platt scaling or isotonic regression, what happens to AUC and log loss after calibration, and what mistake would make the calibration itself unreliable?","s":"Choose Platt scaling. With 300 examples, isotonic regression's step function has too many degrees of freedom and will overfit the noise in each step. Platt's two parameters are well determined, and a symmetric over-confidence pattern is roughly sigmoid-shaped in logit space, which $\\sigma(a s + b)$ with $a < 1$ corrects. Platt's map is strictly increasing, so the ranking is unchanged and AUC stays 0.91. Log loss and Brier score should improve, and ECE should drop substantially. Isotonic could lower AUC slightly through ties. The mistake to avoid is fitting the calibrator on the training data or on the same split used to tune the model. Those scores are optimistically confident, so the calibrator learns too small a correction. Fit on the 300 untouched examples, or use cross-validated calibration. Then evaluate on yet another split, or with cross-validation, because 300 points give a noisy ECE.","r":[["Predicting Good Probabilities With Supervised Learning","https://www.cs.cornell.edu/~alexn/papers/calibration.icml05.crc.rev3.pdf","Niculescu-Mizil and Caruana (ICML 2005): how each model family miscalibrates, and Platt vs isotonic by data size."],["On Calibration of Modern Neural Networks","https://arxiv.org/abs/1706.04599","Guo et al. (2017): overconfidence in deep nets, reliability diagrams, ECE and temperature scaling."],["scikit-learn: Probability calibration","https://scikit-learn.org/stable/modules/calibration.html","Calibration curves, CalibratedClassifierCV and the sigmoid vs isotonic choice."],["scikit-learn: Isotonic regression","https://scikit-learn.org/stable/modules/isotonic.html","The isotonic model and the pool-adjacent-violators fit behind it."]],"k":["calibration","reliability diagram"],"x":["NumPy","scikit-learn"],"p":["expected-calibration-error","log-loss-binary-cross-entropy","logistic-regression","auc-roc"],"ak":""}]},{"n":"04","name":"Trees and ensembles","lessons":[{"id":"04.01","t":"Decision trees","n":["A decision tree partitions feature space into axis-aligned boxes with a sequence of yes/no questions like $x_j \\le \\theta$, and predicts a constant in each box: the majority class or the mean target.","Splits are chosen greedily: at each node, try every feature and threshold and keep the one that most reduces **impurity**, weighted by the number of samples sent each way.","Gini impurity $1-\\sum_k p_k^2$ and entropy $-\\sum_k p_k \\log_2 p_k$ both peak at a 50/50 mix and are zero for a pure node; they pick the same split most of the time.","Regression trees use squared error: a leaf predicts the mean, and the best split maximises the drop in sum of squared errors. Sorting plus prefix sums makes one feature scan $O(n \\log n)$.","Trees need no scaling, handle mixed feature types and interactions, but are high-variance, axis-bound and cannot extrapolate beyond the target values they saw."],"a":"## What a tree computes\nThis module covers the most widely used family of models for tabular data: trees and the ensembles built from them. It starts with a single tree, because every later lesson (forests, boosting, importance) reuses the same splitting machinery.\n\nA decision tree is a sequence of questions. Each internal node asks one thing about one feature, such as \"is `income` at most 42,000?\", and sends the sample left or right. Each leaf holds a constant prediction. Geometrically, the tree carves the feature space into axis-aligned rectangles and paints each one a single value.\n\n%%flow One root-to-leaf path. Every sample follows exactly one path; the leaf it lands in decides the prediction.\nSample x -(income ≤ 42k?)-> Node: age -(age > 30?)-> *Leaf: p(default) = 0.08\n%%\n\nThis structure explains most of a tree's personality. A single feature is compared with a threshold, so monotone transformations of a feature (log, rank, standardisation) do not change the tree at all, and there is no need to scale inputs. Interactions come for free: a split on `age` below a split on `income` only applies to low-income customers. And because each leaf predicts a constant learned from training targets,
