<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Classical machine learning from first principles: linear models, trees and ensembles, clustering, evaluation, features, recommenders and ML in production.">
<meta name="theme-color" content="#F7F7F8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Machine Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&family=Pixelify+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#F7F7F8; --card:#FFFFFF; --panel:#EFEFF1; --side:#FAFAFA; --ink:#272727; --muted:#6E6E6E; --faint:#9C9CA3;
  --line:#E8E8EA; --line2:#C9C9CF; --accent:#B91C1C; --accent-ink:#FFFFFF; --accent-soft:#FDEDED; --accent-line:#F4C4C4;
  --go:#2F8A5F; --go-soft:#E7F5EE; --go-line:#ABD3C1; --flame:#C8643A; --flame-soft:#FBEFE8; --gold:#9A7414; --gold-soft:#FFF8ED;
  --bad:#B9524A; --bad-soft:#FBEDEB; --paper:#FFF8ED; --paper-line:#EADDBE; --kraft:#5F5647;
  --btn-a:#272727; --btn-b:#272727; --btn-ink:#FFFFFF; --btn-edge:#272727;
  --shadow:rgba(59,59,59,.09) 0 1px 2px, rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.01) 0 0 0 1px;
  --lift:rgba(59,59,59,.05) 0 2px 4px, rgba(59,59,59,.09) 0 4px 8px, rgba(59,59,59,.1) 0 8px 16px, rgba(59,59,59,.01) 0 0 0 1px;
  --dg-sh:#272727; --dot:rgba(39,39,39,.08); --strip:#272727; --strip-ink:#F4F4F5;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --num:"Geist", system-ui, sans-serif;
  --pix:"Pixelify Sans", "Geist Mono", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#F28B82; --accent-ink:#2A0A0A; --accent-soft:#2E1414; --accent-line:#552626;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111112; --card:#19191B; --panel:#202023; --side:#141416; --ink:#ECECEE; --muted:#A3A3A8; --faint:#6F6F76;
  --line:#2A2A2E; --line2:#3A3A40; --accent:#F28B82; --accent-ink:#2A0A0A; --accent-soft:#2E1414; --accent-line:#552626;
  --go:#6CC49A; --go-soft:#13241B; --go-line:#24493A; --flame:#E89470; --flame-soft:#2A1A12; --gold:#E0BD62; --gold-soft:#231E12;
  --bad:#E68A82; --bad-soft:#2B1614; --paper:#221F18; --paper-line:#3A3426; --kraft:#C9BCA4;
  --btn-a:#ECECEE; --btn-b:#ECECEE; --btn-ink:#151516; --btn-edge:#ECECEE;
  --shadow:0 0 0 1px rgba(255,255,255,.02), 0 1px 2px rgba(0,0,0,.4); --lift:0 0 0 1px rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.5);
  --dg-sh:#000000; --dot:rgba(255,255,255,.06); --strip:#232326; --strip-ink:#ECECEE; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.lab{font:500 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
#readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:700;letter-spacing:-.03em;font-size:17px;white-space:nowrap}
.brand b{font-family:var(--pix);font-weight:500;color:var(--accent);letter-spacing:0}
.ibtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
#crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--muted);margin-left:8px}
#crumbs a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#crumbs a:hover{color:var(--ink)}
#crumbs .sep{color:var(--line2)}
.grow{flex:1}
.sbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;min-width:220px}
.sbtn span{flex:1;text-align:left}
kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 13px var(--mono);white-space:nowrap;text-decoration:none}
.chip.st{color:var(--flame)} .chip.st.off{color:var(--faint)}
.chip .lv{font-family:var(--num);font-size:15px;color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:18px 12px 40px;border-right:1px solid var(--line);scrollbar-width:thin}
.side .nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;font-size:14.5px;font-weight:500;color:var(--muted)}
.side .nv:hover{background:var(--panel);color:var(--ink)}
.side .nv[aria-current]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.side .nv .cnt{margin-left:auto;font:600 11px var(--mono);background:var(--flame);color:#fff;border-radius:999px;padding:1px 7px}
.side .part{margin:22px 10px 8px;display:flex;justify-content:space-between}
.side .mr{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink)}
.side .mr:hover{background:var(--panel)}
.side .mr .n{font:500 12px var(--mono);color:var(--faint)}
.side .mr .c{font:500 11px var(--mono);color:var(--faint)}
.side .mr.full .c{color:var(--go)}
.side .mr[aria-current]{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600}
.side .mr[aria-current] .n{color:var(--accent)}
.side .ls{margin:4px 0 8px 22px;padding-left:12px;border-left:1px solid var(--line)}
.side .li{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:8px;text-decoration:none;font-size:13.5px;line-height:1.4;color:var(--muted)}
.side .li:hover{color:var(--ink);background:var(--panel)}
.side .li[aria-current]{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.sd{flex:none;width:9px;height:9px;margin-top:5px;border-radius:50%;border:1.5px solid var(--line2)}
.sd.on{background:var(--go);border-color:var(--go)}
#scrim{display:none}
main{min-width:0;padding:28px 36px 90px}

/* shared components */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel{background:var(--panel);border-radius:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--btn-edge);background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--btn-ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 0 var(--btn-edge),0 8px 18px -8px rgba(0,0,0,.45);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 var(--btn-edge),0 3px 8px -4px rgba(0,0,0,.4)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2);box-shadow:0 2px 0 var(--line2)}
.btn.go{background:linear-gradient(180deg,#22B26F,#0F8C52);border-color:#0A6B3E;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 #0A6B3E,0 8px 18px -8px rgba(15,140,82,.6)}
.btn .xp{font:600 12px var(--mono);padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.16)}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.pill.k{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.a{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.pill.ok{background:var(--go-soft);border-color:transparent;color:var(--go)}
.pill.ip{background:var(--flame-soft);border-color:transparent;color:var(--flame)}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:7px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--go)}
.seg i.cur{background:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:44px 0 14px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.03em}

/* home */
.hero{position:relative;overflow:hidden;padding:52px 48px 48px;min-height:440px;background-color:var(--panel);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.hero .copy{position:relative;z-index:2;max-width:540px}
.hero h1{font-size:clamp(40px,5.6vw,72px);line-height:.98;letter-spacing:-.055em;margin:16px 0 18px;font-weight:700}
.hero h1 .px{font-family:var(--pix);font-weight:500;letter-spacing:-.02em;color:var(--accent)}
.hero p.sub{font-size:18px;color:var(--muted);max-width:470px;margin:0 0 26px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.float{position:absolute;z-index:1;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);padding:16px}
.float.f1{right:46px;top:44px;width:310px;transform:rotate(3deg)}
.float.f2{right:280px;top:270px;width:250px;transform:rotate(-5deg);background:#1B1B1E;color:#F4F4F6;border-color:#000}
.float.f3{right:28px;top:236px;width:236px;transform:rotate(-1.5deg)}
.float.f4{right:250px;top:58px;width:200px;transform:rotate(-8deg);background:var(--accent);color:#fff;border-color:transparent}
.float .lab{margin-bottom:8px}
.float.f2 .lab,.float.f4 .lab{color:rgba(255,255,255,.7)}
.float.f2 .seg i{background:rgba(255,255,255,.14)} .float.f2 .seg i.on{background:#3FCB86}
.float.f4 .big{font:700 34px/1 var(--num)}
.float svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){
  .float{animation:bob 7s ease-in-out infinite}
  .float.f2{animation-delay:-2s}.float.f3{animation-delay:-4s}.float.f4{animation-delay:-5.5s}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat .num{font:800 40px/1 var(--num);letter-spacing:-.05em;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px}
.stat .num small{font:500 13px var(--mono);color:var(--muted)}
.stat .sub{font-size:13.5px;color:var(--muted)}
.wk{display:flex;gap:6px;margin-top:10px}
.wk span{flex:1;text-align:center;font:500 10px var(--mono);color:var(--faint)}
.wk span i{display:block;height:22px;border-radius:7px;background:var(--panel);margin-bottom:4px;border:1px solid var(--line)}
.wk span i.on{background:var(--flame);border-color:var(--flame)}
.wk span.today{color:var(--ink)}
.ring{position:absolute;right:18px;top:18px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.cont{padding:26px;display:flex;flex-direction:column;gap:12px}
.cont h3{font-size:28px;line-height:1.1;letter-spacing:-.04em;margin:4px 0 0}
.cont ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.cont .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.heat{padding:22px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;margin-top:16px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.hm i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--card));border-color:transparent}
.hm i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--card));border-color:transparent}
.hm i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--card));border-color:transparent}
.hm i.l4{background:var(--accent);border-color:transparent}
.hm i.fut{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font:500 11px var(--mono);color:var(--faint)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{padding:16px;display:flex;flex-direction:column;gap:8px}
.bdg .ic{width:46px;height:46px;display:grid;place-items:center;font:700 17px var(--num);border-radius:14px;color:#fff;background:linear-gradient(160deg,var(--gold),#C2700A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 #9A5806}
.bdg b{font-size:14.5px;letter-spacing:-.01em}
.bdg span{font-size:12.5px;color:var(--muted);line-height:1.35}
.bdg.lock{opacity:.55}
.bdg.lock .ic{background:var(--panel);color:var(--faint);box-shadow:inset 0 0 0 1px var(--line2)}
.parth{display:flex;align-items:baseline;gap:14px;margin:34px 0 12px}
.parth h3{margin:0;font-size:19px;letter-spacing:-.03em}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{padding:18px 18px 16px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.mcard .tp{display:flex;justify-content:space-between;align-items:center}
.mcard .no{font:500 26px/1 var(--mono);letter-spacing:-.04em;color:var(--faint)}
.mcard.done .no{color:var(--go)} .mcard.ip .no{color:var(--accent)}
.mcard h4{margin:4px 0 0;font-size:17px;line-height:1.25;letter-spacing:-.02em}
.mcard .ft{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.foot-note{margin-top:40px;font-size:13px;color:var(--faint);max-width:720px}

/* module page */
.mhead{padding:36px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.mhead h1{font-size:clamp(34px,4.4vw,56px);line-height:1;letter-spacing:-.05em;margin:10px 0 14px}
.mhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.mhead .big{font:500 110px/0.8 var(--mono);letter-spacing:-.08em;color:var(--line2);text-align:right}
.path{position:relative;max-width:760px;margin:36px auto 0;padding:10px 0}
.pnode{position:relative;display:flex;align-items:center;gap:18px;text-decoration:none;margin:0 0 26px;transform:translateX(var(--dx,0))}
.pnode .o{flex:none;position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--num);background:var(--card);border:2px solid var(--line2);box-shadow:0 5px 0 var(--line2);color:var(--muted);transition:transform .1s}
.pnode:hover .o{transform:translateY(-2px)}
.pnode.done .o{background:var(--go);border-color:#0A7A47;color:#fff;box-shadow:0 5px 0 #0A6B3E}
.pnode.cur .o{background:var(--accent);border-color:#0F5FA6;color:#fff;box-shadow:0 5px 0 #0D5290}
.pnode.cur .o::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--accent);opacity:.5}
@media (prefers-reduced-motion:no-preference){.pnode.cur .o::after{animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}}
.pnode .t{padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;flex:1;max-width:420px}
.pnode .t b{display:block;font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pnode .t span{font:500 11.5px var(--mono);color:var(--muted)}
.pnode.cur .t{border-color:var(--accent)}
.mnav{display:flex;justify-content:space-between;gap:12px;max-width:760px;margin:30px auto 0}

/* lesson page */
.lgrid{display:grid;grid-template-columns:minmax(0,760px) 230px;gap:44px;justify-content:center}
.lhead{padding:28px 32px 26px;margin-bottom:30px}
.lhead .back{font-size:14px;color:var(--muted);text-decoration:none}
.lhead .back:hover{color:var(--ink)}
.lhead .idrow{display:flex;align-items:center;gap:12px;margin:20px 0 8px}
.lhead .lid{font:600 20px/1 var(--mono);color:var(--accent)}
.lhead h1{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.045em;margin:0 0 18px}
.lhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.lhead .seg{margin-top:20px}
.prose{font-size:17px;line-height:1.72}
.prose>p{margin:0 0 18px}
.prose h2{counter-increment:h;font-size:24px;letter-spacing:-.035em;line-height:1.2;margin:46px 0 14px;display:flex;align-items:baseline;gap:12px}
.prose h2::before{content:counter(h,decimal-leading-zero);font:500 13px var(--mono);color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:7px;transform:translateY(-3px)}
.prose{counter-reset:h fig}
.prose ul,.prose ol{padding-left:22px;margin:0 0 18px}
.prose li{margin:6px 0}
.prose ul li::marker{color:var(--accent)}
.prose ol li::marker{font:600 14px var(--mono);color:var(--accent)}
.prose code{font:500 .86em var(--mono);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.prose strong{font-weight:650}
.code{font:13.5px/1.6 var(--mono);background:#16161A;color:#E9E9EE;padding:18px 20px;border-radius:14px;overflow-x:auto;margin:0 0 20px;border:1px solid #000}
.take{margin:26px 0;padding:20px 22px 20px 22px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);position:relative}
.take .lab{color:var(--accent);margin-bottom:8px}
.take p{margin:0;font-weight:550;font-size:17px}

.tbl{overflow-x:auto;margin:0 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--card)}

.dg{counter-increment:fig;margin:26px 0;padding:22px 20px 14px;border-radius:18px;background-color:var(--card);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.dg figcaption{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);line-height:1.5}

.dg-scroll{overflow-x:auto;padding-bottom:4px}
.dg-scroll svg{display:block;margin:0 auto}
.dg-hint{font:500 11px var(--mono);color:var(--faint);margin-top:6px}
.layers{display:flex;flex-direction:column;gap:0;max-width:560px;margin:0 auto}
.lay{padding:12px 16px;border-radius:12px;background:var(--card);border:1.3px solid var(--ink);box-shadow:0 3px 0 var(--dg-sh);display:flex;flex-direction:column}
.lay strong{font-size:15px}
.lay span{font-size:13.5px;color:var(--muted)}
.lay.hot{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.lay.hot strong{color:var(--accent)}
.lay-arr{text-align:center;color:var(--faint);font-size:14px;line-height:22px}
.wip{padding:14px 18px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-size:15px;margin-bottom:18px}

.blk{margin-top:44px;padding:26px}

.blk h3{margin:0 0 6px;font-size:21px;letter-spacing:-.03em;line-height:1.3}

textarea{width:100%;min-height:140px;resize:vertical;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.saved{font:500 12px var(--mono);color:var(--faint)}
.sample{margin-top:18px;padding:18px 20px;border-radius:14px;background:var(--go-soft);border:1px solid color-mix(in srgb,var(--go) 30%,transparent)}
.sample .lab{color:var(--go);margin-bottom:8px}
.sample p{margin:0;font-size:16px}
.grade{margin-top:18px}
.grade .gb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gbtn{padding:12px 10px;border-radius:14px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;box-shadow:0 3px 0 var(--line2);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.gbtn small{font:500 11px var(--mono);color:var(--muted)}
.gbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.gbtn[data-g="1"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.gbtn[data-g="2"][aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 3px 0 var(--gold);color:var(--gold)}
.gbtn[data-g="3"][aria-pressed="true"]{background:var(--go-soft);border-color:var(--go);box-shadow:0 3px 0 var(--go);color:var(--go)}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.srcs li{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}
.srcs .fav{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 15px var(--num);color:var(--accent)}
.srcs .tx{flex:1;min-width:0}
.srcs a{font-weight:600;text-decoration:none;line-height:1.35;display:block}
.srcs a:hover{color:var(--accent)}
.srcs .n{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.srcs .h{font:500 11px var(--mono);color:var(--faint)}
.rep{flex:none;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font:500 11px var(--mono);color:var(--muted);cursor:pointer}
.rep.on{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.done-zone{margin-top:44px;padding:30px 26px;text-align:center;border-radius:22px;background:var(--panel)}
.done-zone p{margin:10px 0 0;font:500 12px var(--mono);color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pn a{padding:16px 18px;text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:transform .15s,box-shadow .15s}
.pn a:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.pn a b{font-size:15.5px;line-height:1.3;letter-spacing:-.01em}
.pn a.nx{text-align:right;grid-column:2}
.pn a.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rail{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:14px}
.rail .card{padding:16px}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--line);text-decoration:none;font-size:13.5px;color:var(--muted);line-height:1.4}
.toc a.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}

/* review */
.rv{max-width:680px;margin:0 auto}
.rvtop{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:8px 0 18px}
.flip{perspective:1400px;cursor:pointer}
.flip .in{position:relative;min-height:340px;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:30px;border-radius:22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.face.fr{background:var(--card);border:1px solid var(--line);box-shadow:var(--lift)}

.rvbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.empty{padding:44px 30px;text-align:center}
.empty .big{font:700 56px/1 var(--num);color:var(--line2)}

/* palette, toasts */
#pal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,10,14,.42);backdrop-filter:blur(3px)}
#pal.on{display:flex}
.palbox{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font:18px var(--body);background:transparent;color:var(--ink);outline:none}
#palres{max-height:52vh;overflow-y:auto;padding:8px}
#palres a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none}
#palres a.on{background:var(--accent-soft)}
#palres .id{font:500 12px var(--mono);color:var(--accent);width:44px;flex:none}
#palres .tt{flex:1;min-width:0}
#palres .tt b{display:block;font-weight:600;font-size:15px}
#palres .tt span{font-size:12.5px;color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 18px;border-radius:999px;background:#1B1B1E;color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:tin .3s ease-out}
.toast b{font-family:var(--num);font-weight:500;color:#7CC7FF}
.toast.big{padding:16px 24px;font-size:16px;background:linear-gradient(180deg,#22B26F,#0F8C52)}
.toast.big b{color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:85;width:100%;height:100%}

@media (max-width:1279px){.lgrid{grid-template-columns:minmax(0,760px)}.rail{display:none}.float.f2{right:262px;width:230px}}

/* ---- taste pass: fanout brand system (Taste Engine extraction) + slop-rubric fixes ---- */

<script>
const DATA = [{"n":"01","name":"How models learn","lessons":[{"id":"01.01","t":"The learning problem","n":["Supervised learning assumes examples $(x, y)$ are drawn from an unknown distribution $\\mathcal{D}$; the goal is a function $h$ that predicts $y$ well on *new* draws, not on the ones you have.","You pick a **hypothesis class** $\\mathcal{H}$ (lines, trees, networks) and a **loss** $\\ell(h(x), y)$; together they define what \"good\" means and what is even reachable.","**Empirical risk minimisation** picks $\\hat h = \\arg\\min_{h \\in \\mathcal{H}} \\frac1n \\sum_i \\ell(h(x_i), y_i)$, a stand-in for the true risk $R(h) = \\mathbb{E}_{\\mathcal{D}}[\\ell(h(x), y)]$ you cannot compute.","The loss you train on is often a smooth surrogate (log loss, hinge) for the one you care about (0-1 error), because the true one has no useful gradient.","Every later lesson changes one of three knobs: the class, the loss, or how the minimisation is constrained."],"a":"## The setup\nSupervised learning has four ingredients. An **input** $x$, usually a vector of $d$ features ($x \\in \\mathbb{R}^d$). A **label** $y$: a real number for regression, one of $K$ classes for classification. An unknown **data distribution** $\\mathcal{D}$ over pairs $(x, y)$. And a **training set** of $n$ pairs drawn independently from it, $S = \\{(x_1, y_1), \\dots, (x_n, y_n)\\}$.\n\nThe job is to output a function $h: x \\mapsto \\hat y$ that does well on *future* draws from $\\mathcal{D}$. That one word, future, is what makes machine learning different from curve fitting. A lookup table that memorises $S$ fits the training set perfectly and is useless on the next example.\n\nTwo assumptions hide in this setup and are worth saying out loud:\n- **i.i.d. sampling**: training and future examples come from the same $\\mathcal{D}$, independently. Most real failures (drift, leakage, selection bias) are violations of this.\n- **Labels are noisy**: even the best possible predictor makes mistakes, because $y$ is not a deterministic function of $x$. The error of that best predictor is the *Bayes error*, a floor no model can beat.\n\n%%flow The learning loop: you choose the class and the loss; the data picks the function inside the class.\nSample S from D -(choose)-> Hypothesis class H -(choose)-> Loss -(minimise on S)-> *Learned h -(evaluate on new data)-> Test risk\n%%\n\n## Hypothesis classes and losses\nThe **hypothesis class** $\\mathcal{H}$ is the set of functions you are willing to consider. Linear models $h_w(x) = w^\\top x + b$ form a class with $d + 1$ parameters. Decision trees of depth 5 are another class. A ResNet-50 is a class with 25 million parameters. Picking the class is the single biggest modelling decision, because ERM can only return something inside it.\n\nThe **loss** $\\ell(\\hat y, y)$ scores one prediction. Common choices:\n\n| Task | Loss | Formula |\n| Regression | squared error | $(\\hat y - y)^2$ |\n| Regression, robust | absolute / Huber | $|\\hat y - y|$, quadratic near 0 |\n| Binary classification | 0-1 | $\\mathbb{1}[\\hat y \\ne y]$ |\n| Binary, probabilistic | log loss | $-y\\log p - (1-y)\\log(1-p)$ |\n| Binary, margin | hinge | $\\max(0, 1 - y\\,f(x))$ with $y \\in \\{-1, 1\\}$ |\n\nThe loss encodes what errors cost. Squared error punishes one prediction that is off by 10 as much as a hundred that are off by 1, so outliers dominate. Absolute error does not. If the business cost of a false negative is ten times a false positive, the loss should say so.\n\n## Empirical risk minimisation\nThe quantity you care about is the **true risk** $R(h) = \\mathbb{E}_{(x,y)\\sim\\mathcal{D}}[\\ell(h(x), y)]$. You cannot compute it, because $\\mathcal{D}$ is unknown. You can compute the **empirical risk** on the sample:\n\n$$\\hat R_S(h) = \\frac{1}{n}\\sum_{i=1}^{n} \\ell(h(x_i), y_i)$$\n\nERM picks the hypothesis with the smallest empirical risk, $\\hat h = \\arg\\min_{h\\in\\mathcal{H}} \\hat R_S(h)$. For a fixed $h$, $\\hat R_S(h)$ is an unbiased estimate of $R(h)$. The catch is that $\\hat h$ is *chosen using* $S$, so $\\hat R_S(\\hat h)$ is biased low: you picked the function that happens to look best on this sample. The gap $R(\\hat h) - \\hat R_S(\\hat h)$ is the **generalisation gap**, and the next lesson is about what controls it.\n\n```python\nimport numpy as np\n# ERM for a 1-D linear class under squared loss, by brute force over a grid of slopes\nx = np.array([1., 2., 3., 4.]); y = np.array([2.1, 3.9, 6.2, 7.8])\nslopes = np.linspace(0, 4, 401)\nrisk = [np.mean((w * x - y) ** 2) for w in slopes]\nw_hat = slopes[int(np.argmin(risk))]     # about 1.99\n```\n\nReal ERM is never a grid search; it is a closed form (least squares) or an iterative optimiser (gradient descent). But the object being minimised is the same average.\n\n## Surrogate losses\nThe loss you care about and the loss you optimise are often different. Minimising 0-1 error over linear classifiers is NP-hard in general, and its gradient is zero almost everywhere, so gradient methods get no signal. Instead you minimise a **convex surrogate** that upper-bounds it: log loss gives logistic regression, hinge gives the SVM, both covered in Module 02. You still *report* the metric you care about (accuracy, F1, cost), measured on held-out data.\n\n! Example: two classes, one sample, three hypotheses\n! Data: 100 emails, 20 spam. Class $\\mathcal{H}_0$ = constant predictors; $\\mathcal{H}_1$ = linear models on word counts; $\\mathcal{H}_2$ = a lookup table keyed on the exact email text.\n! ERM in $\\mathcal{H}_0$ predicts \"not spam\" for everything: empirical 0-1 risk 0.20. ERM in $\\mathcal{H}_1$ might reach 0.04. ERM in $\\mathcal{H}_2$ reaches 0.00.\n! On new mail, $\\mathcal{H}_2$ has never seen any of the texts and falls back to a default guess, so its true risk is about 0.20 again. Lowest training risk is not lowest true risk; the class decides how much the training number can be trusted.\n\n## Where this course goes next\nEvery method in this course is an instance of the same template: a class, a loss, and a way of minimising empirical risk, often with a constraint added. Linear regression is squared loss over linear functions. Logistic regression is log loss over the same class. An SVM is hinge loss plus a norm penalty. k-NN and naive Bayes reach the template from different directions (memorisation and probabilistic modelling), and Module 03 shows how. The maths behind least squares and likelihood is covered in depth in the ML Maths course (Applications and Inference modules); here the focus is on how the pieces are chosen and how they fail.\n\n> Takeaway: learning is choosing a class and a loss, then minimising the average loss on a sample as a proxy for the expected loss on new data. The proxy is biased toward the sample, and controlling that bias is the rest of the subject.","q":"A team trains a fraud model by minimising log loss, reports 0.3% training error, and ships. On live traffic the model flags almost nothing. Name two distinct places in the learning setup where this could have gone wrong, and how you would tell them apart.","s":"One is the **generalisation gap**: the class is flexible enough to memorise the training set, so low empirical risk says little about true risk. You would see it by evaluating on a held-out split drawn from the same period: if held-out error is far above 0.3%, the model overfit. The other is a violation of the **i.i.d. assumption**: live traffic comes from a different distribution (new fraud patterns, a different country mix, a feature computed differently in production). Then held-out error from the old data can look fine while live performance collapses; comparing feature distributions between training and live data (or evaluating on a later time slice) exposes it. A third suspect is the **loss/metric mismatch**: with 0.3% fraud, predicting \"not fraud\" always already gives 0.3% error, so the reported number may simply be the base rate.","r":[["Understanding Machine Learning (Shalev-Shwartz and Ben-David)","https://www.cs.huji.ac.il/~shais/UnderstandingMachineLearning/","Free PDF. Chapters 2-3 define the learning model, ERM and PAC learning precisely."],["Cornell CS4780: Machine learning setup","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote01_MLsetup.html","Short notes on the D, H, loss framing with good intuition for why memorisation fails."],["Cornell CS4780: Empirical risk minimisation","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote10.html","Surrogate losses (hinge, log, exponential) side by side and how they bound 0-1 loss."]],"k":["empirical risk","loss functions"],"x":["NumPy"],"p":["linear-regression","loss-functions","log-loss-binary-cross-entropy","regression-metrics"],"ak":""},{"id":"01.02","t":"Generalisation and the bias-variance trade-off","n":["Test error splits into irreducible noise, **bias** (error of the average model) and **variance** (how much the model moves when the training set changes).","Capacity is the knob: too little and both training and test error are high (underfitting); too much and training error falls while test error climbs (overfitting).","More data reduces variance but not bias; regularisation and simpler classes trade a little bias for a lot less variance.","Modern over-parameterised models can show **double descent**: test error falls again past the point where the model interpolates the training set."],"a":"## Two ways to be wrong\nTrain the same model class on many different training sets drawn from $\\mathcal{D}$ and you get many different fitted functions $\\hat f_S$. At a fixed input $x$, look at how those predictions spread. For squared loss with $y = f(x) + \\varepsilon$, $\\mathbb{E}[\\varepsilon] = 0$, $\\text{Var}(\\varepsilon) = \\sigma^2$, the expected test error at $x$ decomposes exactly:\n\n$$\\mathbb{E}_{S,\\varepsilon}\\big[(y - \\hat f_S(x))^2\\big] = \\underbrace{\\sigma^2}_{\\text{noise}} + \\underbrace{\\big(f(x) - \\bar f(x)\\big)^2}_{\\text{bias}^2} + \\underbrace{\\mathbb{E}_S\\big[(\\hat f_S(x) - \\bar f(x))^2\\big]}_{\\text{variance}}$$\n\nwhere $\\bar f(x) = \\mathbb{E}_S[\\hat f_S(x)]$ is the average prediction over training sets.\n- **Noise** is the Bayes error. Nothing you do to the model changes it; only better features can.\n- **Bias** is the error of the *average* model. A straight line fitted to a parabola is wrong on average, however many datasets you average over.\n- **Variance** is the sensitivity to the particular sample. A degree-15 polynomial on 20 points changes wildly when one point moves.\n\nThe decomposition is exact for squared loss. For 0-1 loss there are analogues but no clean additive split; the intuition carries over anyway.\n\n## Capacity and the U-shaped curve\nCapacity is how rich the hypothesis class is: polynomial degree, tree depth, $1/k$ in k-NN, number of parameters, inverse regularisation strength. As capacity grows, bias falls and variance rises. Training error falls monotonically. Test error typically falls, bottoms out, then rises.\n\n%%flow As capacity grows, the dominant source of test error switches from bias to variance.\nLow capacity -(high bias)-> Underfit -(add capacity)-> *Sweet spot -(add more)-> Overfit -(high variance)-> Memorised training set\n%%\n\nThe two failure modes look different on a train/validation plot, and that is how you diagnose them:\n\n| Symptom | Training error | Validation error | Likely cause | First fix |\n| Underfitting | high | high, close to training | bias | richer class, better features, less regularisation |\n| Overfitting | low | much higher than training | variance | more data, regularisation, simpler class |\n| Healthy | low | slightly above training | balanced | stop tuning, check on test |\n| Data problem | low | high and noisy across folds | split or leakage issue | check the split (next lesson) |\n\n## What moves bias and what moves variance\n- **More training data** shrinks variance roughly like $1/n$ for many estimators and leaves bias untouched. If a linear model underfits, a billion more rows will not help it.\n- **Regularisation** (lesson 01.04) deliberately adds bias to cut variance. Ridge regression's predictions are biased toward zero but far more stable.\n- **Averaging** reduces variance: bagging and random forests average many high-variance trees, which is why they work (Module 04 goes deeper).\n- **Better features** can cut bias without much extra variance; this is often the cheapest win.\n\n! Example: k-nearest neighbours as a capacity dial\n! With $k = 1$, each prediction copies the label of the closest training point. Training error is 0 (each point is its own neighbour); the decision boundary is jagged and changes when any single point moves: low bias, high variance.\n! With $k = n$, every prediction is the majority class of the whole training set: a constant. Variance is near 0 (one more point barely changes the majority), bias is maximal.\n! On a typical tabular problem with $n = 1000$, validation error might be 18% at $k = 1$, 11% at $k = 15$ and 40% at $k = 1000$. You pick $k$ by validation, not by training error, which is always best at $k = 1$.\n\n## Beyond the U: double descent\nThe classical U-curve assumes capacity stays below the number of training points. Belkin et al. (2019) showed that if you keep going, test error can peak near the **interpolation threshold** (just enough parameters to fit the training data exactly) and then *fall again* as the model becomes heavily over-parameterised. Among the many functions that interpolate the data, gradient descent tends to find smooth, small-norm ones, which acts as an implicit regulariser. Zhang et al. (2017) made the puzzle vivid: standard image networks can perfectly fit randomly shuffled labels, so parameter count alone cannot explain why they generalise on real labels.\n\nFor the classical models in this course (linear models, trees, k-NN, kernels with explicit penalties), the U-shaped picture is the right working model. Keep double descent in mind when you reach the Deep Learning course, where it matters most.\n\n```python\n# Diagnose with a capacity sweep: fit at several capacities, compare train vs validation\nfor deg in [1, 3, 9, 15]:\n    w = np.polyfit(x_tr, y_tr, deg)\n    tr, va = mse(np.polyval(w, x_tr), y_tr), mse(np.polyval(w, x_va), y_va)\n    print(deg, round(tr, 3), round(va, 3))   # training falls every time; validation turns up\n```\n\n> Takeaway: test error is noise plus bias squared plus variance. Diagnose which one dominates from the gap between training and validation error, then add capacity for bias or add data and constraints for variance.","q":"A gradient-boosted model has 2% training error and 2.5% validation error, but the product needs 1%. A colleague proposes collecting ten times more data. Using the bias-variance view, argue whether this is likely to help and what you would try instead.","s":"Training and validation error are close (2% vs 2.5%), so variance is small: the model is not overfitting much. The dominant problem is **bias** (or irreducible noise): even on data it has seen, the model reaches only 2%. More data mainly reduces variance, so ten times more rows would likely shave a little off the 0.5% gap and leave the 2% floor. Better options attack bias: add capacity (deeper trees, more rounds, less regularisation), and above all add informative features, because if the 2% is close to the Bayes error for the current features no model can beat it. A useful check is human or oracle error on a sample: if experts also miss about 2% with the same inputs, only new information (features or labels of better quality) will help.","r":[["Cornell CS4780: Bias-variance decomposition","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote12.html","Clean derivation of the three-term decomposition and how to read train/test curves."],["Reconciling modern machine learning practice and the bias-variance trade-off (Belkin et al.)","https://arxiv.org/abs/1812.11118","The double-descent paper; read the introduction and Figure 1."],["Understanding deep learning requires rethinking generalization (Zhang et al.)","https://arxiv.org/abs/1611.03530","Networks fitting random labels; why capacity counts alone fail to explain generalisation."],["scikit-learn: Underfitting vs overfitting","https://scikit-learn.org/stable/auto_examples/model_selection/plot_underfitting_overfitting.html","A runnable polynomial-degree sweep with cross-validated error."]],"k":["bias-variance","overfitting"],"x":["NumPy"],"p":["knn-classifier","k-fold-cross-validation","bagging-classifier","decision-tree-regressor"],"ak":""},{"id":"01.03","t":"Train, validation and test splits","n":["Use three roles: **train** to fit parameters, **validation** to choose hyperparameters and models, **test** touched once to report an unbiased number.","k-fold cross-validation reuses every point for validation once; it gives a mean and a spread, at k times the cost.","**Leakage** is any path by which information about the evaluation data reaches training: preprocessing fitted on all rows, duplicates across splits, features from the future.","The split must mimic deployment: split by time if you predict the future, by group (user, patient, site) if you predict for unseen groups."],"a":"## Three roles, three splits\nThe previous lesson argued that training error is optimistic. The fix is to measure on data the model never fitted. But every *decision* you make while looking at a number is also a form of fitting. So you need three roles:\n- **Training set**: the optimiser sees it and sets the parameters.\n- **Validation set**: you look at it to choose hyperparameters, features, model families and when to stop. Because you select on it, it also becomes optimistic, just more slowly.\n- **Test set**: looked at once, at the end, to report a number you will stand behind. If you tune after seeing it, it has become a second validation set.\n\nA common default is 70/15/15 or 80/10/10. With millions of rows, a 1% test set (10,000 examples) is plenty; what matters is the *absolute* number of evaluation examples, because the standard error of an accuracy estimate is about $\\sqrt{p(1-p)/m}$. At $m = 1000$ and $p = 0.9$, that is about ±1 percentage point, so a 0.5-point \"improvement\" is noise.\n\n%%flow Each split has one job. Information flows only left to right; the test set feeds nothing back.\nTraining set -(fit parameters)-> Model -(score)-> Validation set -(pick hyperparameters)-> *Final model -(score once)-> Test set\n%%\n\n## Cross-validation\nWhen data is scarce, a single validation split wastes rows and gives a noisy estimate. **k-fold cross-validation** partitions the training data into $k$ folds, trains $k$ times on $k-1$ folds and validates on the one held out, then averages. Every row is validated exactly once. With $k = 5$ you get five scores: report the mean and the standard deviation; if two configurations differ by less than about one standard deviation, treat them as tied.\n\nVariants worth knowing:\n- **Stratified k-fold** keeps class proportions equal in every fold, essential when a class is rare.\n- **Group k-fold** keeps all rows of a group (user, patient, hospital) in the same fold.\n- **Time-series split** (forward chaining) trains on the past and validates on the next block, growing the window each time.\n- **Nested CV**: an inner loop picks hyperparameters, an outer loop estimates the error of the whole procedure. Needed when you want an honest number without a separate test set.\n\n## Leakage: the silent failure\nLeakage is when the evaluation data influences training through a side door. The scores look great and production does not. Kapoor and Narayanan (2022) surveyed leakage across 17 scientific fields and found it affected hundreds of published papers. The usual suspects:\n1. **Preprocessing fitted on all data.** Standardising, imputing, selecting features or fitting PCA before splitting lets test statistics shape the training inputs. Fit every transform on the training fold only, then apply it.\n2. **Duplicates and near-duplicates** across splits: the same image resized, the same customer twice, the same sentence in two documents.\n3. **Group leakage**: several rows per patient, split at random, so the model learns to recognise patients rather than disease.\n4. **Temporal leakage**: features computed with information from after the prediction time (a \"total purchases\" column that includes the purchase being predicted), or a random split on data where the future resembles the recent past.\n5. **Target proxies**: a feature that is a consequence of the label, like \"refund issued\" when predicting fraud.\n\n```python\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.model_selection import GroupKFold, cross_val_score\n# The scaler is refit inside each fold, and no patient appears on both sides.\npipe = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))\nscores = cross_val_score(pipe, X, y, groups=patient_id, cv=GroupKFold(n_splits=5))\n```\n\n## Match the split to deployment\nThe question to ask is: *at prediction time, what will be new?* Then make the validation data new in exactly that way.\n\n| Deployment | What is new | Split |\n| Same users, new random events | individual rows | random or stratified |\n| New users or patients | the group | grouped by id |\n| Predicting next week | time | train on past, validate on a later block |\n| New site or hospital | the environment | leave-one-site-out |\n| Stable assignment across retrains | nothing should move | hash the id into buckets |\n\nA **hash-based split** (bucket = hash(id) mod 100) gives each id the same split forever, even as new data arrives. That stops rows drifting from test into train between retrains, which random re-splitting would do.\n\n! Example: a churn model that looked 12 points too good\n! Data: 2 years of monthly snapshots per customer; label = churns next month. A random 80/20 split gave AUC 0.91. Problem 1: the same customer appears in both splits, with nearly identical features month to month. Problem 2: a feature \"support tickets in the last 90 days\" was computed at extraction time, so it included tickets filed after the snapshot.\n! Fix: cut by time (train on year 1, validate on the first quarter of year 2), recompute features as of each snapshot date, and keep each customer on one side. AUC fell to 0.79, which matched what the model later did in production.\n\n> Takeaway: give train, validation and test separate jobs, fit every transform inside the training fold, and design the split so that what is new at evaluation is exactly what will be new in deployment.","q":"You build a model that predicts machine failure from sensor readings sampled every minute on 40 machines, and random 5-fold CV gives 97% accuracy. Explain why that number is suspect and design a split that answers the real question \"will this work on next month's data from the same fleet\" and, separately, \"will it work on a new machine\".","s":"Minute-level readings are strongly autocorrelated, so a random split puts almost identical neighbouring minutes in train and validation; the model can interpolate between them instead of learning failure signals. Both machine identity and time leak. For **next month on the same fleet**, split by time: train on months 1..t, validate on month t+1, and roll forward (time-series CV), with a gap between the windows if features use lookback windows so no window spans the cut. For **a new machine**, group by machine id: leave-one-machine-out or GroupKFold over the 40 machines, so each validation machine is unseen; ideally also keep the time ordering inside. Expect both numbers to be well below 97%; the gap between them tells you how much the model relies on machine-specific behaviour. Fit any scaling or feature selection inside each training fold.","r":[["scikit-learn: Cross-validation","https://scikit-learn.org/stable/modules/cross_validation.html","k-fold, stratified, group and time-series iterators, and why the test set stays separate."],["scikit-learn: Common pitfalls and recommended practices","https://scikit-learn.org/stable/common_pitfalls.html","Concrete preprocessing-leakage examples and the Pipeline fix."],["Leakage and the reproducibility crisis in ML-based science (Kapoor and Narayanan)","https://arxiv.org/abs/2207.07048","A taxonomy of eight leakage types with real case studies."],["scikit-learn: TimeSeriesSplit","https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html","Forward-chaining splits, including the gap parameter."]],"k":["cross-validation","data leakage"],"x":["scikit-learn"],"p":["hashed-dataset-split","k-fold-cross-validation","normalize-columns","point-in-time-feature-join"],"ak":""},{"id":"01.04","t":"Regularisation","n":["Regularisation adds a preference for simple solutions: minimise $\\hat R_S(w) + \\lambda\\,\\Omega(w)$, trading a little bias for lower variance.","**L2** ($\\|w\\|_2^2$) shrinks all weights smoothly; **L1** ($\\|w\\|_1$) drives many weights exactly to zero.","A penalty is equivalent to a hard constraint $\\Omega(w) \\le t$ and to a prior in MAP estimation: Gaussian for L2, Laplace for L1.","**Early stopping** limits how far gradient descent travels from its start, and for quadratic losses behaves much like L2."],"a":"## The idea\nLesson 01.02 showed that a flexible class has high variance: it fits noise. Regularisation keeps the flexible class but adds a preference for \"simple\" members of it. The regularised objective is\n\n$$\\min_w \\; \\hat R_S(w) + \\lambda\\,\\Omega(w)$$\n\nwhere $\\Omega$ measures complexity and $\\lambda \\ge 0$ sets the exchange rate. $\\lambda = 0$ is plain ERM; $\\lambda \\to \\infty$ forces $\\Omega(w) \\to 0$, usually $w = 0$, a constant model. Somewhere between is a model with a bit more bias and much less variance, and validation (lesson 01.03) tells you where.\n\nWhy does a small norm mean simple? For a linear model $w^\\top x$, a small $\\|w\\|$ means the output changes slowly as the input changes: the function is smooth and cannot chase individual noisy points. Large weights that cancel each other out are the typical signature of overfitting, especially with correlated features.\n\n## L2 and L1\nThe two standard penalties behave differently:\n\n| Property | L2 (ridge, weight decay) | L1 (lasso) |\n| Penalty | $\\lambda\\sum_j w_j^2$ | $\\lambda\\sum_j |w_j|$ |\n| Effect on weights | shrinks all toward 0, rarely exactly 0 | sets many exactly to 0 |\n| Gradient of penalty | $2\\lambda w_j$, proportional to size | $\\lambda\\,\\text{sign}(w_j)$, constant push |\n| Correlated features | spreads weight across them | tends to pick one arbitrarily |\n| Closed form (least squares) | yes | no; coordinate descent or proximal methods |\n| Prior (MAP view) | Gaussian | Laplace |\n\nThe gradient row explains the sparsity. Under L2 the pull toward zero weakens as a weight gets small, so weights approach zero but stop short. Under L1 the pull is constant, so a weight whose data gradient is weaker than $\\lambda$ gets pushed all the way to zero and stays there. Module 02 (lesson 02.02) works through both for linear regression, including how to pick $\\lambda$.\n\n%%layers Three views of the same regulariser. Each is useful for a different question.\n*Penalty | minimise loss + lambda times norm; what you implement\nConstraint | minimise loss subject to norm at most t; explains the geometry (corners of the L1 ball give zeros)\nPrior | MAP estimate with a Gaussian or Laplace prior on weights; explains what lambda means\n%%\n\n## Three equivalent views\n- **Constraint**: minimising $\\hat R + \\lambda\\|w\\|^2$ gives the same solution as minimising $\\hat R$ subject to $\\|w\\|^2 \\le t$ for some $t$ that depends on $\\lambda$ (a Lagrange multiplier argument). The L1 ball is a diamond with corners on the axes; the loss contours tend to touch it at a corner, where some coordinates are zero.\n- **Bayesian**: with Gaussian noise and prior $w \\sim \\mathcal{N}(0, \\tau^2 I)$, the MAP estimate is ridge with $\\lambda = \\sigma^2/\\tau^2$. A tight prior (small $\\tau$) means strong regularisation. A Laplace prior gives the lasso.\n- **Stability**: regularised solutions change less when one training point changes, which is exactly lower variance.\n\n## Early stopping and other implicit regularisers\nGradient descent started at $w = 0$ moves outward step by step. Stopping after $T$ steps keeps $w$ within a region around the origin whose size grows with $T\\eta$ (steps times learning rate). For a quadratic loss this is close to L2 regularisation with $\\lambda \\approx 1/(T\\eta)$; Goodfellow et al. (Deep Learning, chapter 7) give the derivation. In practice you monitor validation loss and keep the checkpoint with the best value, stopping once it has not improved for a set number of evaluations (the *patience*).\n\nOther regularisers you will meet later: data augmentation, dropout, label smoothing, ensembling, and simply using a smaller class. They all reduce variance at some cost in bias.\n\n```python\nimport numpy as np\ndef ridge(X, y, lam):\n    # Closed form; standardise X first and leave the intercept unpenalised (centre y).\n    d = X.shape[1]\n    return np.linalg.solve(X.T @ X + lam * np.eye(d), X.T @ y)\n```\n\n## Practical rules\n1. **Standardise features** before L1 or L2. The penalty treats all weights equally, so a feature measured in millimetres gets penalised far more than the same feature in metres.\n2. **Don't penalise the intercept.** Shifting all targets by a constant should shift the prediction, not fight the penalty.\n3. **Search $\\lambda$ on a log grid**, e.g. $10^{-4}$ to $10^{2}$, because its effect is multiplicative.\n4. **Weight decay in adaptive optimisers** is not identical to an L2 term in the loss; AdamW decouples them for that reason (covered in the Deep Learning course).\n\n! Example: twelve noisy points, a degree-9 polynomial\n! Unregularised least squares fits all 12 points with coefficients in the thousands, alternating sign; validation MSE is 4.8.\n! With ridge at $\\lambda = 10^{-3}$ on standardised polynomial features, coefficients drop below 5 in magnitude, the curve is smooth, and validation MSE is 0.31. At $\\lambda = 10$ the curve is almost flat and validation MSE rises to 1.2: too much bias. The best $\\lambda$ sits in the middle of the grid, where it should.\n\n> Takeaway: regularisation buys lower variance with a little bias by penalising weight size. L2 shrinks, L1 selects, early stopping limits how far the optimiser travels, and lambda is always chosen on validation data.","q":"You fit L1-regularised logistic regression on 500 features, two of which are near-duplicates (correlation 0.99) and both truly predictive. What will the lasso likely do with them, why, and how does switching to L2 or elastic net change the outcome?","s":"The lasso will usually keep one of the pair and set the other to exactly zero, and which one survives can flip between bootstrap samples. Because the two features carry almost the same information, the loss is nearly unchanged if weight moves from one to the other, while the L1 penalty $|w_1| + |w_2|$ is the same for any split with the same total, so the corner solution (one weight zero) is as cheap as any split and the constant L1 push removes the weaker one. L2 penalises $w_1^2 + w_2^2$, which for a fixed total is smallest when the weight is shared equally, so ridge gives both about half the weight and is stable. Elastic net mixes the two: the L2 part encourages grouping (both kept with similar weights) while the L1 part still zeros out the many irrelevant features.","r":[["Deep Learning (Goodfellow, Bengio, Courville), chapter 7: Regularization","https://www.deeplearningbook.org/contents/regularization.html","Sections 7.1 and 7.8: L2/L1 analysis and the early-stopping-as-L2 derivation."],["Dive into Deep Learning: Weight decay","https://d2l.ai/chapter_linear-regression/weight-decay.html","A short runnable demonstration of L2 on a high-dimensional regression."],["The Elements of Statistical Learning (Hastie, Tibshirani, Friedman)","https://hastie.su.domains/ElemStatLearn/","Free PDF. Section 3.4 on shrinkage methods and the constraint geometry."]],"k":["regularisation","early stopping"],"x":["NumPy"],"p":["ridge-regression","lasso-regression","early-stopping","lagrange-multipliers-regularization-as-constrain","adamw-decoupled-weight-decay"],"ak":""},{"id":"01.05","t":"Baselines and sanity checks","n":["Before any real model, compute a **trivial baseline**: majority class for classification, mean or median for regression, last value for time series.","A **linear baseline** (logistic or ridge on standardised features) sets the bar a complex model must clear to justify its cost.","**Learning curves** (score vs training-set size) tell you whether more data will help, separating bias from variance problems.","Cheap sanity checks catch pipeline bugs: overfit a tiny subset, shuffle labels and expect chance, and check that the loss at initialisation matches theory."],"a":"## Why baselines first\nA model with 95% accuracy sounds good until you learn that 95% of the labels are the same class. Without a baseline, a number has no meaning. Baselines do three jobs:\n- They tell you whether the problem is **learnable at all** from these features.\n- They catch **pipeline bugs**: if your fancy model barely beats the majority class, suspect the data before the model.\n- They set a **cost bar**: a gradient-boosted model that beats logistic regression by 0.2 points may not be worth its training and serving cost.\n\n## The ladder of baselines\nClimb it in order, and record each number in the same table with the same split and metric.\n\n%%flow Each rung must beat the previous one by a margin larger than its noise before you climb further.\nTrivial predictor -(beats?)-> Simple heuristic -(beats?)-> Linear model -(beats?)-> *Complex model\n%%\n\n| Task | Trivial baseline | Score it gives |\n| Binary classification | predict the majority class | accuracy = majority rate; AUC = 0.5 |\n| Classification, probabilistic | predict class frequencies | log loss = entropy of the label distribution |\n| Regression (MSE) | predict the training mean | $R^2 = 0$ on that data |\n| Regression (MAE) | predict the training median | MAE of the median |\n| Time series | repeat the last value or the same day last week | \"naive\" or \"seasonal naive\" error |\n| Ranking / recommendation | most popular items | popularity hit rate |\n\nA **simple heuristic** is the rule a domain expert would write in five minutes: \"flag transactions over 5,000 dollars from new accounts\". Then the **linear baseline**: logistic regression or ridge on standardised features with basic encoding. Linear models are fast, stable, hard to overfit at moderate dimensionality, and their coefficients are a free bug detector (a huge weight on \"row id\" means leakage).\n\n```python\nfrom sklearn.dummy import DummyClassifier\nfrom sklearn.linear_model import LogisticRegression\nfor name, m in [(\"majority\", DummyClassifier(strategy=\"most_frequent\")),\n                (\"prior\", DummyClassifier(strategy=\"prior\")),\n                (\"logistic\", LogisticRegression(max_iter=1000))]:\n    m.fit(X_tr, y_tr); print(name, m.score(X_va, y_va))\n```\n\n## Learning curves\nA learning curve plots training and validation score against the number of training examples, for a fixed model. Train on 10%, 20%, ... 100% of the training set and evaluate each on the same validation set. The shape answers \"will more data help?\" before you pay for it:\n\n| Shape | Reading | Action |\n| Both curves high error and close together, flat | high bias; more data won't help | richer model or better features |\n| Large gap, validation still improving at full size | high variance; more data will help | collect data, or regularise |\n| Large gap, validation flat | variance that data alone won't fix | regularise, simplify, check for leakage or label noise |\n| Validation better than training | usually a split or augmentation artefact | check the split |\n\nA related plot, the **validation curve**, sweeps a hyperparameter instead of data size; that is the capacity sweep from lesson 01.02.\n\n## Sanity checks that catch bugs\nThese take minutes and catch many of the bugs that waste days:\n1. **Loss at initialisation.** A $K$-class softmax with small random weights should start at log loss of about $\\ln K$ (2.30 for 10 classes). A much larger value means badly scaled logits; a much smaller one means leakage.\n2. **Overfit a tiny subset.** Take 20 examples and train to near-zero training loss. If a model with enough capacity cannot memorise 20 points, the training loop, labels or gradients are broken.\n3. **Shuffle the labels.** Retrain with labels permuted: validation score should fall to the trivial baseline. If it does not, information is leaking through the features or the split.\n4. **Check predictions by eye.** Look at the 20 most confident errors. Mislabelled examples, encoding bugs and leaked IDs show up immediately.\n5. **Compare to the baseline on slices.** A model can beat the overall baseline while losing to it on an important segment.\n\nKarpathy's \"A Recipe for Training Neural Networks\" lists these as the first steps for deep models, but they apply unchanged to any model in this course.\n\n! Example: a medical triage classifier\n! Data: 8,000 visits, 6% urgent. The majority baseline scores 94% accuracy and 0 recall on urgent cases. A logistic regression on 30 features reaches AUC 0.81. A gradient-boosted model reaches AUC 0.83 on the same 5 folds, standard deviation 0.012 across folds.\n! The learning curve for the boosted model still rises at 8,000 rows (validation AUC 0.79 at 4,000, 0.83 at 8,000) with a large train/validation gap: variance-limited. The team decides that labelling 8,000 more visits is a better investment than more tuning, and keeps logistic regression in production until the gap over it exceeds two standard deviations.\n\n> Takeaway: always report a model next to a trivial and a linear baseline on the same split, read learning curves before buying data, and run the cheap sanity checks before trusting any number.","q":"Your new recommender beats a random-item baseline by 40% on hit rate@10, and your manager is pleased. What baseline is missing, why could it change the conclusion, and what would a learning curve add to the decision about whether to keep investing?","s":"The missing baseline is **most-popular items** (optionally per segment or recent window). Random items are a straw man: popularity alone usually captures a large share of hits, so a model that beats random by 40% might be no better than, or even worse than, simply recommending the top sellers. Compare against popularity on the same split (ideally time-ordered, leave-last-out per user). A learning curve (hit rate vs number of training interactions) then shows the trend: if validation hit rate is still climbing at full data and the train/validation gap is large, more interaction data should help and investment is justified; if both curves have flattened close together, the model is bias-limited and you need new signals or a different model, not more of the same data.","r":[["A Recipe for Training Neural Networks (Karpathy)","https://karpathy.github.io/2019/04/25/recipe/","The \"set up the end-to-end skeleton and get dumb baselines\" section: init-loss checks, overfitting one batch, input-independent baselines."],["scikit-learn: Validation curves and learning curves","https://scikit-learn.org/stable/modules/learning_curve.html","How to compute and read both plots."],["scikit-learn: DummyClassifier","https://scikit-learn.org/stable/modules/generated/sklearn.dummy.DummyClassifier.html","The trivial strategies (most_frequent, prior, stratified, uniform) as ready-made baselines."],["Rules of Machine Learning (Google)","https://developers.google.com/machine-learning/guides/rules-of-ml","Rules 1-4 and 13-17: launch a simple model and heuristic first, then iterate."]],"k":["baselines","learning curves"],"x":["scikit-learn"],"p":["pos-tagging","popularity-baseline-leave-last-out","mini-batch-training-loop","regression-metrics"],"ak":""}]},{"n":"02","name":"Linear models","lessons":[{"id":"02.01","t":"Linear regression","n":["Linear regression predicts $\\hat y = w^\\top x + b$ and picks $w$ by minimising squared error $\\|Xw - y\\|^2$; with an appended column of ones the intercept is just another weight.","Setting the gradient to zero gives the **normal equations** $X^\\top X w = X^\\top y$; solve them with QR or SVD (`lstsq`), never by inverting $X^\\top X$, which squares the condition number.","Geometrically, $\\hat y$ is the **orthogonal projection** of $y$ onto the column space of $X$, so the residual is orthogonal to every feature column.","Prediction needs few assumptions; interpreting coefficients and their standard errors needs many (independent, constant-variance errors, no collinearity, no omitted confounders)."],"a":"## Where this module starts\nModule 01 framed learning as choosing a hypothesis class and a loss, then minimising empirical risk. Linear models are the simplest class worth using: the prediction is a weighted sum of features. They are fast, convex to fit, easy to debug, and the baseline every other model in this course has to beat. This lesson covers the regression case; later lessons swap the loss (logistic, hinge) or add a penalty (ridge, lasso) while keeping the same linear core. The ML Maths course (lesson 08.02) derives least squares from the linear-algebra side; here the focus is on what an engineer needs to fit, check and trust it.\n\n## The model and the loss\nFor $n$ examples with $d$ features, stack inputs into $X \\in \\mathbb{R}^{n \\times d}$ and targets into $y \\in \\mathbb{R}^n$. Append a column of ones to $X$ and the intercept $b$ becomes one more entry of $w$. The model is $\\hat y = Xw$ and ordinary least squares (OLS) minimises\n\n$$L(w) = \\tfrac{1}{n}\\|Xw - y\\|^2 = \\tfrac{1}{n}\\sum_i (w^\\top x_i - y_i)^2.$$\n\nWhy squared error? Three reasons. It is the negative log-likelihood if $y = w^\\top x + \\varepsilon$ with Gaussian noise, so OLS is the maximum-likelihood estimate under that model. It is smooth and convex, so there is one minimum and calculus finds it. And its minimiser is the conditional mean $\\mathbb{E}[y \\mid x]$, which is usually what you want to predict. The price: a residual of 10 costs 100 times a residual of 1, so a few outliers can drag the fit. Absolute or Huber loss (module 06) trades the closed form for robustness.\n\n\"Linear\" means linear in the parameters, not in the raw inputs. Features can be $x^2$, $\\log x$, interactions $x_1 x_2$ or one-hot encodings, and the fitting machinery is unchanged.\n\n## The normal equations and how to solve them\nThe gradient is $\\nabla L = \\tfrac{2}{n} X^\\top (Xw - y)$. Setting it to zero gives\n\n$$X^\\top X\\, w = X^\\top y.$$\n\nIf $X$ has full column rank ($n \\ge d$ and no feature is a linear combination of others), $X^\\top X$ is invertible and the solution is unique. In code, do not form the inverse:\n\n```python\nimport numpy as np\nX1 = np.c_[np.ones(len(X)), X]                  # add intercept column\nw, res, rank, sv = np.linalg.lstsq(X1, y, rcond=None)\nprint(rank, sv.max() / sv.min())                # rank and condition number of X\n```\n\n`lstsq` uses an SVD, which is stable and also reports rank and singular values. Forming $X^\\top X$ squares the condition number: if $\\kappa(X) = 10^5$, then $\\kappa(X^\\top X) = 10^{10}$ and in float64 you have lost about ten of your sixteen significant digits. Cost is $O(nd^2)$ for the factorisation, fine for $d$ in the thousands. For very large $n$ or streaming data, minimise the same loss with (mini-batch) gradient descent; the Hessian is $\\tfrac{2}{n}X^\\top X$, so its largest eigenvalue caps the stable step size and badly scaled features make convergence slow. Standardising features fixes most of that.\n\n## The geometric view\n$Xw$ ranges over the column space of $X$, a $d$-dimensional subspace of $\\mathbb{R}^n$. Least squares picks the point in that subspace closest to $y$, which is the orthogonal projection $\\hat y = Hy$ with the hat matrix $H = X(X^\\top X)^{-1}X^\\top$. Rewriting the normal equations as $X^\\top (y - \\hat y) = 0$ says the residual is orthogonal to every column.\n\n%%flow Least squares projects y onto the space the features can reach; what is left is orthogonal to every feature.\nTargets y -(project onto column space of X)-> *Fitted y-hat -(subtract from y)-> Residual r -(check)-> X-transpose r = 0\n%%\n\nUseful consequences:\n- With an intercept column, residuals sum to exactly zero and the fitted line passes through $(\\bar x, \\bar y)$.\n- $R^2 = 1 - \\|r\\|^2 / \\|y - \\bar y\\|^2$ is the fraction of variance the projection captures. Adding any feature can only enlarge the subspace, so training $R^2$ never drops; judge features on validation data.\n- The diagonal $h_{ii}$ of $H$ is the **leverage** of point $i$: how much its own label moves its own prediction. Points with extreme $x$ have high leverage and deserve a look.\n- Exact duplicates or collinear features make the subspace smaller than $d$. The projection $\\hat y$ is still unique, but $w$ is not: infinitely many weight vectors give the same predictions.\n\n## Assumptions and what breaks\nOLS will happily fit any data. The assumptions matter for what you claim afterwards.\n\n| Assumption | Needed for | Symptom when violated | Typical fix\n| Linear in the chosen features | unbiased predictions | curved pattern in residuals vs fitted | add transforms or interactions\n| Independent errors | valid standard errors | autocorrelated residuals in time series | time-aware models, clustered errors\n| Constant variance | efficient fit, honest intervals | residual spread grows with fitted value | log the target, weighted least squares\n| Normal errors | exact small-sample intervals only | heavy tails in residual plot | usually ignore for prediction; robust loss\n| No strong collinearity | stable, interpretable coefficients | huge coefficients with opposite signs | drop or merge features, ridge (02.02)\n| No omitted confounders | causal reading of a coefficient | coefficient sign flips when a feature is added | domain knowledge, experiments\n\nUnder the first three, the Gauss-Markov theorem says OLS has the lowest variance among unbiased linear estimators. That is a statement about unbiased estimators only; ridge accepts some bias to cut variance further, which is often a better deal (01.02).\n\n! Example: four points by hand\n! Data $x = (1, 2, 3, 4)$, $y = (2, 3, 5, 6)$. Means $\\bar x = 2.5$, $\\bar y = 4$. $\\sum (x - \\bar x)(y - \\bar y) = 3 + 0.5 + 0.5 + 3 = 7$ and $\\sum (x - \\bar x)^2 = 5$, so the slope is $1.4$ and the intercept is $4 - 1.4 \\cdot 2.5 = 0.5$.\n! Fitted values $(1.9, 3.3, 4.7, 6.1)$, residuals $(0.1, -0.3, 0.3, -0.1)$. They sum to 0, and $\\sum x_i r_i = 0.1 - 0.6 + 0.9 - 0.4 = 0$: orthogonal to both columns, as the geometry promises.\n! SSE $= 0.2$, total sum of squares $= 10$, so $R^2 = 0.98$.\n\n> Takeaway: least squares is a projection. Solve it with lstsq or QR, read the residuals rather than the coefficients first, and only interpret coefficients when the error and collinearity assumptions hold.\n","q":"You add a feature that is an exact copy of an existing one in different units (price in dollars and price in cents). What happens to the normal equations, to the predictions, and to the coefficients returned by `np.linalg.inv(X.T @ X) @ X.T @ y` versus `np.linalg.lstsq`?","s":"The new column is 100 times an existing one, so $X$ loses full column rank and $X^\\top X$ is singular: the normal equations have infinitely many solutions, all satisfying $w_{\\text{dollars}} + 100\\,w_{\\text{cents}} = \\text{const}$. The predictions do not change, because the column space is the same and the projection of $y$ onto it is unique. The explicit inverse either raises a singular-matrix error or, because rounding makes the matrix only nearly singular, returns enormous coefficients of opposite sign that are dominated by floating-point noise. `lstsq` uses the SVD, reports rank $d-1$, and returns the minimum-norm solution, which splits the weight between the two columns in proportion to their scale. Neither coefficient is individually meaningful; drop one column, or use ridge, which makes the system invertible and picks a unique split.","r":[["Cornell CS4780 lecture notes: Linear Regression","https://www.cs.cornell.edu/courses/cs4780/2018fa/lectures/lecturenote08.html","OLS as maximum likelihood under Gaussian noise and its MAP (ridge) counterpart, in a few pages."],["The Elements of Statistical Learning, ch. 3","https://hastie.su.domains/ElemStatLearn/","Sections 3.1-3.2: least squares geometry, the hat matrix and the Gauss-Markov theorem. Free PDF."],["scikit-learn: Ordinary Least Squares","https://scikit-learn.org/stable/modules/linear_model.html","The LinearRegression section, including the note on collinearity and solver complexity."],["Dive into Deep Learning: Linear Regression","https://d2l.ai/chapter_linear-regression/linear-regression.html","The same model fitted by minibatch SGD, as a bridge to the optimisation view."]],"k":["least squares","normal equations"],"x":["NumPy"],"p":["linear-regression","least-squares-solution","orthogonal-projection-matrix","moore-penrose-pseudoinverse","qr-decomposition"],"ak":""},{"id":"02.02","t":"Ridge, lasso and elastic net","n":["Ridge solves $(X^\\top X + \\lambda I)w = X^\\top y$; in the SVD basis it shrinks each direction by $\\sigma_j^2/(\\sigma_j^2 + \\lambda)$, so low-variance (often collinear) directions are shrunk most.","The lasso has no closed form, but each coordinate update is a **soft-threshold** $S(\\rho, \\lambda) = \\mathrm{sign}(\\rho)\\max(|\\rho| - \\lambda, 0)$, which is where exact zeros come from.","Elastic net mixes L1 and L2: it still selects features but keeps correlated groups together and can select more than $n$ features when $d > n$.","Fit the whole **regularisation path** on a log grid from $\\lambda_{\\max}$ down, with warm starts, and pick $\\lambda$ by cross-validation; the one-standard-error rule picks a sparser model at no real cost.","Penalty strength depends on feature scale and on the library's objective scaling; standardise first, and check whether the loss is divided by $n$."],"a":"## Picking up from module 01\nLesson 01.04 introduced L2 and L1 penalties, their constraint and prior views, and why lasso drops one of two correlated features. This lesson is the mechanics for linear regression: what ridge does to each direction of the data, how the lasso is actually solved, what elastic net adds, and how to choose $\\lambda$ without fooling yourself. Assume columns of $X$ are standardised (mean 0, variance 1) and $y$ is centred, so the intercept is unpenalised and drops out.\n\n## Ridge through the SVD\nThe ridge objective $\\|y - Xw\\|^2 + \\lambda\\|w\\|^2$ has the closed form\n\n$$\\hat w_{\\text{ridge}} = (X^\\top X + \\lambda I)^{-1} X^\\top y.$$\n\nFor any $\\lambda > 0$ the matrix is positive definite, so the solution exists even with collinear columns or $d > n$. The SVD $X = U\\Sigma V^\\top$ shows what it does to predictions:\n\n$$\\hat y_{\\text{ridge}} = \\sum_j u_j \\,\\frac{\\sigma_j^2}{\\sigma_j^2 + \\lambda}\\, u_j^\\top y.$$\n\nOLS keeps each component $u_j^\\top y$ whole. Ridge multiplies it by a factor between 0 and 1 that is close to 1 for large singular values and close to 0 for small ones. Small singular values are directions whe
