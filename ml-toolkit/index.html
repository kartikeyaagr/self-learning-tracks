able.\n! The best fix is upstream: centre and scale `t` first, after which $\\kappa$ is close to 1 and every method agrees.\n\n> Takeaway: use `@`, `solve`, `lstsq`, `eigh` and `svd(full_matrices=False)` instead of their tempting alternatives, check the condition number when answers look odd, and thread one explicit `Generator` through your code.","q":"A ridge regression implementation computes `w = np.linalg.inv(X.T @ X + lam * np.eye(d)) @ X.T @ y` with X of shape (1,000,000, 50). Comment on its cost and accuracy, and propose a better version. When would you prefer lstsq instead?","s":"The expensive part is `X.T @ X`, about $n d^2 = 2.5 \\times 10^9$ multiply-adds, which is fine. The inverse is only 50 x 50, so its cost is negligible, but it is still the wrong tool: `np.linalg.solve(X.T @ X + lam * np.eye(d), X.T @ y)` is cheaper and more accurate, and because the matrix is symmetric positive definite, a Cholesky solve (`scipy.linalg.cho_factor` and `cho_solve`) is better still. Also note the evaluation order: `inv(...) @ X.T @ y` multiplies a 50 x 50 matrix by the 50 x 1,000,000 `X.T` first; computing `X.T @ y` first avoids that large intermediate. Accuracy depends on $\\kappa(X)^2$ shrunk by the ridge term. When lam is tiny or zero and features are badly scaled or collinear, use `lstsq` on the augmented system `[X; sqrt(lam) I] w = [y; 0]`, which works with $\\kappa(X)$ rather than its square.","r":[["NumPy reference: Linear algebra (numpy.linalg)","https://numpy.org/doc/stable/reference/routines.linalg.html","matmul broadcasting rules and the full list of factorisations and solvers."],["numpy.linalg.lstsq","https://numpy.org/doc/stable/reference/generated/numpy.linalg.lstsq.html","Return values, rcond, and the minimum-norm solution for rank-deficient X."],["NumPy reference: Random Generator","https://numpy.org/doc/stable/reference/random/generator.html","default_rng, the Generator methods, and spawn."],["NEP 19: Random number generator policy","https://numpy.org/neps/nep-0019-rng-policy.html","Why the global state was deprecated and what stream compatibility NumPy promises."]],"k":["linear algebra","conditioning","reproducibility"],"x":["NumPy","SciPy"],"p":["solve-linear-system","least-squares-solution","eigendecomposition","svd-components","random-array-generation"],"ak":""}]},{"n":"02","name":"Pandas for ML data","lessons":[{"id":"02.01","t":"Series, DataFrames and loading data","n":["A `Series` is a 1-D array of values plus an **index** of labels; a `DataFrame` is a set of named columns that share one index. Arithmetic between pandas objects aligns on labels first, not on position.","Every column has exactly one dtype. Integers with a missing value silently become `float64` unless you use a nullable dtype (`Int64`), and text is `object` in pandas 2.x but the dedicated `str` dtype by default in pandas 3.0.","`read_csv` guesses types, missing-value markers and dates. For anything that feeds a model, pass `usecols`, `dtype`, `na_values`/`keep_default_na` and `parse_dates` explicitly so training and serving read the file the same way.","A first inspection is always the same handful of calls: `shape`, `info()`, `head()`/`sample()`, `describe(include=\"all\")`, `isna().mean()` and `nunique()`. They catch most loading bugs before any modelling starts."],"a":"## Orientation: pandas between raw data and arrays\nThe NumPy module gave you fast homogeneous arrays. Real ML data rarely arrives that way: it comes as CSV exports, Parquet files and SQL results with mixed types, missing values, string categories and timestamps. pandas is the layer where you turn that into a clean, keyed feature table, which you then hand to NumPy, scikit-learn or a PyTorch `Dataset` (module 4). This module goes in the order of a typical pipeline: load and inspect (this lesson), select (2), clean (3), aggregate (4), join (5), reshape (6), handle time (7), and keep it fast (8). The SQL module (3) covers the same operations when the data lives in a database.\n\n%%layers The pandas data model, from the bottom up.\nNumPy or Arrow array | one dtype per column, contiguous values\nIndex | row labels used for alignment and lookup\nSeries | one array + one index + a name\n*DataFrame | named columns sharing one index, each with its own dtype\n%%\n\n## Series, index and alignment\nA `Series` pairs values with labels. The labels are not decoration: binary operations between two Series match labels, and labels present in only one side produce `NaN`.\n\n```python\nimport pandas as pd\na = pd.Series([1.0, 2.0, 3.0], index=[\"u1\", \"u2\", \"u3\"])\nb = pd.Series([10.0, 20.0], index=[\"u3\", \"u1\"])\na + b        # u1 21.0, u2 NaN, u3 13.0  (matched by label, not position)\na.values + b.reindex(a.index).values   # explicit, if you really want arrays\n```\n\nAlignment is what makes pandas safe for keyed data, and it is also a classic ML bug: after filtering or sorting, a column's index no longer runs 0..n-1, so assigning a NumPy array of predictions works by position while assigning a Series works by label. When the two disagree you get shuffled predictions with no error. Lesson 2 shows when to call `reset_index(drop=True)`.\n\nA `DataFrame` is a dict-like collection of Series sharing one index. `df.columns` is itself an Index, `df.index` holds the row labels, and `df.dtypes` lists one dtype per column.\n\n## Dtypes you will meet\n| dtype | holds | missing marker | note\n| `int64` | integers | none | a single NaN forces the column to `float64`\n| `Int64`, `Float64`, `boolean` | nullable numbers and booleans | `pd.NA` | keep integers integral when values are missing\n| `float64` | floats | `NaN` | default for any numeric column with gaps\n| `object` | arbitrary Python objects | `None` or `NaN` | pandas 2.x default for text; slow and memory hungry\n| `str` | text | `NaN` | pandas 3.0 default for text, Arrow-backed when pyarrow is installed\n| `datetime64[ns]` (or other units) | timestamps | `NaT` | only if parsed; otherwise the column stays text\n| `category` | a small set of repeated values | `NaN` | integer codes plus a lookup table (lesson 8)\n\nThe switch from `object` to a real string dtype in pandas 3.0 changes `df.dtypes` output and means `select_dtypes(include=\"object\")` only still finds text columns through a deprecated compatibility path; select them with the builtin `include=[str]` and check dtype-based column selection when you upgrade.\n\n## Loading with read_csv\n`read_csv` will infer almost everything, which is convenient in a notebook and dangerous in a pipeline. Inference runs per file (and, with the default C parser and `low_memory=True`, per internal chunk), so the same column can come out as `int64` on one day's export and `float64` or `object` on the next. Pin down what you know:\n\n```python\nSCHEMA = {\"user_id\": \"string\", \"country\": \"category\", \"age\": \"Int64\", \"spend\": \"float64\"}\n\ndf = pd.read_csv(\n    \"users.csv\",\n    usecols=[*SCHEMA, \"signup_ts\"],   # read only what you need\n    dtype=SCHEMA,\n    parse_dates=[\"signup_ts\"],         # or pd.to_datetime(..., format=...) afterwards\n    na_values=[\"\", \"?\", \"-999\"],      # extra markers for missing\n    keep_default_na=False,             # do not treat \"NA\", \"null\", \"nan\" as missing\n)\n```\n\nOther options worth knowing: `index_col` to make a column the index, `nrows` to read a sample, `chunksize` to stream a large file (lesson 8), `date_format` (pandas 2.0+) to fix the timestamp format, and `dtype_backend=\"pyarrow\"` or `engine=\"pyarrow\"` for Arrow-backed columns and a faster multithreaded parser. `keep_default_na=False` matters more than it looks: by default the strings `\"NA\"`, `\"N/A\"`, `\"null\"`, `\"nan\"` and several others become missing, which silently deletes Namibia's country code. Note that with `keep_default_na=False` empty fields are only treated as missing if you list `\"\"` in `na_values`, as above.\n\nKeep the schema dictionary in code and use it in both the training job and the serving path. A model that saw `user_id` as text in training and as an integer at serving will not crash; it will just stop matching keys.\n\n## The first five minutes with a new table\n```python\ndf.shape                       # rows, columns\ndf.info()                      # dtypes, non-null counts, memory\ndf.head(); df.sample(5, random_state=0)\ndf.describe(include=\"all\").T   # ranges, counts, top categories\ndf.isna().mean().sort_values(ascending=False)   # missing rate per column\ndf.nunique().sort_values()     # constants and ID-like columns\ndf[\"label\"].value_counts(dropna=False, normalize=True)\n```\n\nRead the output with questions in mind. Is a column you expected to be numeric `object`? Then some rows contain text such as `\"1,234\"` or `\"unknown\"`. Does an ID column have as many unique values as rows? Is any column constant? Is the label's class balance plausible? Is there a column whose name suggests it was computed after the outcome (for example `refund_amount` in a churn table)? That last question is how leakage gets caught early.\n\n! Example: postcodes that lost their zeros\n! A CSV holds Dutch and US addresses. Without a dtype, `read_csv` parses the `zip` column as `int64`, turning `\"02139\"` into `2139`, and the US rows no longer match the geography table they are joined to later.\n! `df.dtypes` shows `zip int64`, which is the clue: postcodes are labels, not quantities. Re-reading with `dtype={\"zip\": \"string\"}` keeps the leading zeros, and the join match rate goes from 61% to 99.8%.\n! The same rule applies to phone numbers, product codes and any ID: read them as text, because arithmetic on them is meaningless and inference will damage them.\n\n> Takeaway: treat a DataFrame as labelled columns with one dtype each, read files with an explicit schema rather than letting pandas guess, and run the same short inspection on every new table before you trust it.","q":"A colleague's training script reads `events.csv` with a bare `pd.read_csv(path)`. It worked for months, but after a new export the `item_id` column comes out as `float64` instead of `int64`, a later join on `item_id` against an items table (where it is `int64`) now matches fewer rows, and some ids print as `1.2345678e+07`. What probably changed in the file, why did pandas react this way, and how would you make loading robust?","s":"The new export almost certainly contains at least one empty or missing `item_id`. NumPy's `int64` has no missing value, so pandas promotes the whole column to `float64` to hold `NaN`. Floats print large integers in scientific notation and, beyond 2^53, cannot represent every integer exactly, so some ids can change value; and the missing rows can never match. The fix is to stop relying on inference: pass `dtype={\"item_id\": \"Int64\"}` (nullable integer, missing becomes `pd.NA`) or read ids as `\"string\"` since they are labels, list the expected missing markers in `na_values`, and restrict to known columns with `usecols`. Then decide explicitly what a missing id means (drop the row, or route it to an 'unknown' bucket) and count how many rows are affected, rather than letting the join silently drop them. The same schema dictionary should be used wherever this file is read, including serving.","r":[["pandas docs: Intro to data structures","https://pandas.pydata.org/docs/user_guide/dsintro.html","Series, DataFrame, index alignment and how construction from dicts and arrays works."],["pandas API: read_csv","https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html","Every parsing option, especially dtype, na_values, keep_default_na, parse_dates and dtype_backend."],["pandas docs: Essential basic functionality","https://pandas.pydata.org/docs/user_guide/basics.html","dtypes, astype, describe, info and the head/tail inspection helpers."]],"k":["DataFrame","dtypes","read_csv"],"x":["pandas"],"p":["inspect-dataframe-shape","data-types-overview","create-dataframe-from-dict","head-and-tail-operations","change-data-types"],"ak":""},{"id":"02.02","t":"Selecting data","n":["`.loc` selects by **label** and its slices include the end; `.iloc` selects by **position** and its slices exclude the end. Plain `df[...]` takes a column name, a list of names or a boolean mask, and nothing else should be relied on.","Combine boolean conditions with `&`, `|` and `~`, each condition in parentheses; Python's `and`/`or` raise an error on Series. `isin`, `between` and `query` keep longer filters readable.","Write with a single `df.loc[row_selector, column] = value`. Chained forms like `df[mask][\"col\"] = v` write into a temporary object and never reach `df` under Copy-on-Write.","Copy-on-Write is opt-in in pandas 2.x and the only behaviour in pandas 3.0: every selection behaves like a copy, `SettingWithCopyWarning` is gone, and defensive `.copy()` calls are no longer needed for correctness."],"a":"## Three ways in\nLesson 1 showed that a DataFrame has two sets of labels, the index and the columns. Selection is about saying which of them you mean.\n\n| syntax | selects by | slice end | typical use\n| `df[\"col\"]`, `df[[\"a\", \"b\"]]` | column name(s) | n/a | pick columns\n| `df[mask]` | boolean Series aligned on the index | n/a | filter rows\n| `df.loc[rows, cols]` | labels (or boolean mask) | **included** | the general tool, also for writing\n| `df.iloc[rows, cols]` | integer positions | excluded | first n rows, positional splits\n\n```python\ndf.loc[\"2024-01-01\":\"2024-01-31\", [\"clicks\", \"spend\"]]   # both dates included\ndf.iloc[:1000, :5]                                         # rows 0..999, first 5 columns\ndf.loc[df[\"country\"] == \"NL\", \"spend\"]                    # mask plus column\n```\n\nThe two disagree whenever the index is not `0..n-1`, which happens after almost any filter, sort or concat. `df.loc[0]` means \"the row labelled 0\", which may be the 4,000th row after a sort or may not exist after a filter. On a Series, `s[0]` used to fall back to position when the label was missing; that fallback was deprecated in pandas 2.1 and removed in 3.0, so write `s.iloc[0]` when you mean position.\n\n## Boolean masks\nA mask is a boolean Series with the same index as the frame. Build each condition separately and combine with element-wise operators:\n\n```python\nactive = (df[\"last_seen\"] >= \"2024-06-01\") & (df[\"plan\"] != \"free\")\nrisky = df[\"country\"].isin([\"XX\", \"YY\"]) | ~df[\"email_verified\"]\ndf[active & ~risky]\ndf.query(\"age >= @min_age and plan in ['pro', 'team']\")   # @ refers to a Python variable\n```\n\nThe parentheses are required because `&` binds tighter than `>=` in Python. Writing `and` raises `ValueError: The truth value of a Series is ambiguous`. A mask containing missing values (from a nullable boolean column) cannot be used directly; decide what missing means with `.fillna(False)`.\n\nA mask from another frame is aligned by index, not by position. After filtering, call `reset_index(drop=True)` before you pair rows with a NumPy array (for example predictions from `model.predict(X)`), or keep the index and wrap predictions as `pd.Series(preds, index=X.index)`.\n\n## Picking a feature matrix\n`X = df[FEATURES]` with an explicit list fixes both which columns go to the model and their **order**. Most estimators work on positions once data becomes an array, so a column order that differs between training and serving silently feeds the wrong values into each weight. Keep `FEATURES` in code, never build it from `df.columns` minus a few names, and when scoring, select `df[FEATURES]` so a missing column fails loudly with a `KeyError`.\n\n## Writing values safely\nThe safe form is always one indexing call that names both rows and columns:\n\n```python\ndf.loc[df[\"age\"] < 0, \"age\"] = pd.NA          # fix invalid values in place\ndf[\"spend_log\"] = np.log1p(df[\"spend\"])        # new column on the whole frame\ndf = df.assign(is_weekend=df[\"ts\"].dt.dayofweek >= 5)   # functional style\n```\n\nThe unsafe form is **chained assignment**: two indexing steps, the second one writing.\n\n%%flow Chained assignment: the write lands on an intermediate object, not on df.\ndf[mask] -(new object)-> temp -([\"col\"] = v)-> *temp modified -> df unchanged\n%%\n\nBefore Copy-on-Write, whether `df[mask]` returned a view or a copy depended on the internal memory layout, so a chained write sometimes changed `df` and sometimes did not. pandas raised `SettingWithCopyWarning` because it could not tell which case you were in. The same uncertainty applied to `sub = df[mask]; sub[\"x\"] = 1`, where you usually did not want `df` to change but could not be sure.\n\n## Copy-on-Write in pandas 2.x and 3.0\nCopy-on-Write (CoW) removes the ambiguity with one rule: **any object derived from another behaves as a copy**. Internally pandas still shares memory until one side is written to, and only then copies, so selection stays cheap.\n\n- In pandas 2.0 to 2.2 CoW is opt-in with `pd.options.mode.copy_on_write = True`; pandas 2.2 also offers `\"warn\"` to list the places where behaviour will change.\n- In pandas 3.0 CoW is always on. `SettingWithCopyWarning` no longer exists, and a chained assignment never modifies the original; pandas emits a `ChainedAssignmentError` warning to tell you the write was lost.\n- Modifying a subset is fine and never touches the parent: `train = df[df.split == \"train\"]; train[\"x\"] = 0` changes only `train`. Calls to `.copy()` added just to silence warnings can be dropped.\n- Arrays from `df.to_numpy()` or `s.values` may be read-only views under CoW; copy them with `np.array(..., copy=True)` before modifying in place.\n\n! Example: the clipping that never happened\n! A preprocessing script contains `df[df[\"income\"] > cap][\"income\"] = cap`. In pandas 1.x it printed `SettingWithCopyWarning` and did nothing; in 3.0 it prints `ChainedAssignmentError` and still does nothing. Either way the model trains on uncapped incomes, and the large values dominate a linear model's fit.\n! The fix is one call, `df.loc[df[\"income\"] > cap, \"income\"] = cap`, or simply `df[\"income\"] = df[\"income\"].clip(upper=cap)`. A unit test that asserts `df[\"income\"].max() <= cap` after preprocessing would have caught it in both versions.\n\n> Takeaway: use `.loc` for labels, `.iloc` for positions, parenthesised `&`/`|`/`~` for masks, and a single `.loc[rows, col] = value` for every write. Under Copy-on-Write that is not just good style; it is the only form that works.","q":"You sort a validation DataFrame by `timestamp`, filter it to rows with `segment == \"new_users\"`, call `preds = model.predict(val[FEATURES])` and then write `val.loc[:, \"pred\"] = preds` followed by `metrics = val.groupby(\"day\").apply(...)`. Separately, a teammate computes `val_sorted.loc[0:99]` to look at \"the first 100 rows\". Which of these steps are correct, which are not, and why?","s":"Assigning a NumPy array with `val.loc[:, \"pred\"] = preds` is correct: an array has no index, so pandas assigns it by position in the frame's current row order, which is the order `val[FEATURES]` was passed to the model. The risky variant would be building `pd.Series(preds)` without an index and assigning that: its labels run 0..n-1 while `val`'s index holds the original labels from before sorting and filtering, so alignment would put predictions on the wrong rows or leave NaNs. Either keep raw arrays, or wrap with `pd.Series(preds, index=val.index)`. The teammate's `val_sorted.loc[0:99]` is wrong: `.loc` slices by label, inclusive of the end, and after sorting the labels are no longer in order, so it returns every row positioned between label 0 and label 99 wherever they fell, possibly thousands of rows or none. The positional intent is `val_sorted.iloc[:100]` or `val_sorted.head(100)`. If the filtered frame is also modified later, write with `.loc` on `val` itself rather than through a chained selection, because under Copy-on-Write chained writes are discarded.","r":[["pandas docs: Indexing and selecting data","https://pandas.pydata.org/docs/user_guide/indexing.html","loc, iloc, boolean indexing, query and the section on returning a view versus a copy."],["pandas docs: Migration guide for pandas 3.0 (Copy-on-Write)","https://pandas.pydata.org/docs/user_guide/migration.html","The CoW rule, chained assignment, read-only NumPy arrays and how to migrate code."],["pandas docs: Essential basic functionality","https://pandas.pydata.org/docs/user_guide/basics.html","Reindexing and alignment, which explain why a Series assignment can land on the wrong rows."]],"k":["indexing","boolean masks","Copy-on-Write"],"x":["pandas"],"p":["loc-vs-iloc","boolean-indexing","multi-column-selection","column-selection","resetting-index"],"ak":""},{"id":"02.03","t":"Cleaning data","n":["pandas marks missing values as `NaN` (floats), `NaT` (datetimes) or `pd.NA` (nullable dtypes), and `isna()` detects all of them. Sentinels such as `-999`, `\"unknown\"` or `\"\"` are not missing until you convert them.","Any cleaning step that learns a number from the data (a median to impute, a cap for outliers, a category list) is part of the model: fit it on the training split only and apply the same fitted values to validation, test and serving.","Convert types deliberately with `pd.to_numeric` and `pd.to_datetime` using `errors=\"coerce\"`, then count what was coerced to missing; a silent jump in that count is a data-quality alert.","Define duplicates by a business key, not by whole-row equality, and decide which copy to keep (`sort_values` then `drop_duplicates(keep=\"last\")`). Duplicates that straddle train and test inflate offline metrics."],"a":"## A cleaning pipeline has two kinds of steps\nSome cleaning is pure transformation: trimming whitespace, lower-casing, parsing a date. It needs no statistics and behaves identically on any row. Other steps *learn* something: the median for imputation, the 99th percentile for capping, the set of known categories. Those are fitted parameters, exactly like model weights, and they create leakage if you compute them on data that includes the validation or test rows.\n\n%%flow Stateless steps run anywhere; fitted steps learn on train only and are replayed everywhere.\nRaw table -> Parse types -> Normalise strings -> Deduplicate -> *Fit stats on train -(medians, caps, categories)-> Apply to train, val, test, serving\n%%\n\n## Missing values\nStart by making missing values visible. Replace sentinels first, then measure:\n\n```python\ndf = df.replace({\"age\": {-1: np.nan, 999: np.nan}, \"city\": {\"\": np.nan, \"unknown\": np.nan}})\ndf.isna().mean().sort_values(ascending=False)\n```\n\nThen choose a strategy per column:\n- **Drop rows** (`dropna(subset=[\"label\"])`) when the label itself is missing; such rows cannot train a supervised model.\n- **Drop columns** that are mostly empty and carry no signal, but check first whether *being* missing is predictive.\n- **Fill with a constant** (`0`, `\"missing\"`) when missing has a meaning, for example no purchases yet.\n- **Fill with a statistic** fitted on train: `med = train[\"age\"].median(); df[\"age\"] = df[\"age\"].fillna(med)`.\n- **Fill within a group** or along time: `df[\"temp\"] = df.groupby(\"station\")[\"temp\"].ffill()` for sensor gaps (lesson 7 discusses forward fill and time order).\n- **Add an indicator** `df[\"age_missing\"] = df[\"age\"].isna()` before filling, so the model can still see that the value was absent.\n\n`fillna(method=\"ffill\")` was deprecated in pandas 2.1; use `.ffill()` and `.bfill()`. Backward fill uses future values and is a leakage risk in any time-ordered data.\n\n## Type conversion\nColumns that should be numeric often arrive as text because of a few bad rows. `astype(float)` raises on the first bad value; `to_numeric` with `errors=\"coerce\"` converts what it can and marks the rest missing, which you should then count:\n\n```python\nraw = df[\"price\"].str.replace(\",\", \"\", regex=False).str.strip()\ndf[\"price\"] = pd.to_numeric(raw, errors=\"coerce\")\nbad = df[\"price\"].isna() & raw.notna()\nprint(bad.sum(), raw[bad].unique()[:10])     # what failed to parse, and why\n\ndf[\"ts\"] = pd.to_datetime(df[\"ts\"], format=\"%Y-%m-%d %H:%M:%S\", errors=\"coerce\", utc=True)\ndf[\"n_items\"] = df[\"n_items\"].astype(\"Int64\")   # integers with gaps stay integers\n```\n\nPass an explicit `format` to `to_datetime`. Since pandas 2.0 the format is inferred from the first non-missing value and applied to all rows, so a file mixing `03/04/2024` (day first) with `2024-04-03` will either error or coerce half the rows to `NaT`.\n\n## Strings\nThe `.str` accessor applies vectorised string operations and propagates missing values:\n\n```python\ndf[\"email\"] = df[\"email\"].str.strip().str.lower()\ndf[\"plan\"] = df[\"plan\"].str.replace(r\"\\s+\", \"_\", regex=True)\ndf[[\"area\", \"number\"]] = df[\"phone\"].str.extract(r\"^\\((\\d{3})\\)\\s*(\\d{3}-\\d{4})$\")\ndf.columns = df.columns.str.strip().str.lower().str.replace(\" \", \"_\")\n```\n\nNormalising strings before grouping or joining matters more than it seems: `\"Pro\"`, `\"pro \"` and `\"PRO\"` become three categories with a third of the data each. In pandas 3.0 text columns use the `str` dtype by default, and `.str` methods run on Arrow kernels when pyarrow is installed, which is considerably faster than on `object` columns.\n\n## Duplicates\nWhole-row duplicates (`df.duplicated().sum()`) usually mean a pipeline loaded the same file twice. Key duplicates are subtler: two rows for the same `(user_id, event_id)` with different timestamps or values. Decide which version is authoritative and keep it explicitly:\n\n```python\ndf = (df.sort_values(\"updated_at\")\n        .drop_duplicates(subset=[\"user_id\", \"event_id\"], keep=\"last\"))\n```\n\nFor ML there is a second concern: near-identical examples split across train and test. The model memorises the training copy and scores the test copy perfectly. Split by a group key (user, session, document) when such duplicates are likely.\n\n## Outliers\nDistinguish **errors** (negative ages, a timestamp in 1970, a price of 10^9) from **rare but real** values (a genuinely large order). Errors become missing; real extremes are usually capped (winsorised) rather than dropped, using thresholds learned on train:\n\n```python\nlo, hi = train[\"amount\"].quantile([0.01, 0.99])\nfor part in (train, val, test):\n    part[\"amount\"] = part[\"amount\"].clip(lo, hi)\n```\n\nNever drop outlier rows from the validation or test set; the model will see them in production. Tree models are fairly insensitive to extremes, while linear models and neural networks benefit from clipping or a log transform such as `np.log1p`.\n\n! Example: median imputation that leaked\n! A churn model imputes missing `tenure_days` with `df[\"tenure_days\"].median()` computed on the full dataset before the train/test split. Missing tenure is concentrated in recent sign-ups, who churn more, so the imputed value encodes a bit of information from the test rows.\n! Moving the median calculation after the split, `med = train[\"tenure_days\"].median()`, and adding a `tenure_missing` flag changes the test AUC from 0.842 to 0.836. The lower number is the honest one. In scikit-learn, a `SimpleImputer` inside a `Pipeline` enforces this automatically during cross-validation.\n\n> Takeaway: make missing values and bad types visible first, keep stateless cleaning separate from fitted cleaning, and fit every statistic on the training split only, then replay it unchanged everywhere else.","q":"You inherit a fraud dataset of card transactions. `amount` is `object` dtype, about 3% of `merchant_country` values are `\"\"` or `\"N/A\"`, there are 40,000 rows sharing a `transaction_id` with another row, and a notebook caps `amount` at the 99.5th percentile and fills missing `merchant_country` with the mode, both computed on the whole table before a random train/test split. List what you would check and change, in order, and explain the leakage risks.","s":"First fix types: inspect why `amount` is text (currency symbols, thousands separators, words like 'refund'), clean with `.str` methods and convert with `pd.to_numeric(errors=\"coerce\")`, then count and examine the values that became NaN rather than dropping them blindly. Next make missing explicit: map `\"\"` and `\"N/A\"` to NaN (and check whether `read_csv` already turned `\"N/A\"` into NaN by default), and add a `merchant_country_missing` indicator because missingness may itself be a fraud signal. Then the duplicates: check whether rows sharing a `transaction_id` are exact copies (a double load, so drop) or versions of one transaction (an authorisation and a settlement, say), in which case keep the authoritative one with `sort_values` plus `drop_duplicates(subset=\"transaction_id\", keep=...)`. If duplicates remain and the split is random, the two copies of a transaction can land on either side, inflating test scores, so deduplicate before splitting and prefer a time-based split for fraud. Finally move the fitted steps after the split: compute the 99.5th percentile cap and the mode of `merchant_country` on the training rows only and apply those values to test and serving. Computing them on the whole table leaks test-set information into training features; the effect is usually small for a mode but can matter for caps when the test period has a different amount distribution.","r":[["pandas docs: Working with missing data","https://pandas.pydata.org/docs/user_guide/missing_data.html","NaN, NaT and pd.NA, nullable dtypes, fillna, ffill and interpolate."],["pandas docs: Working with text data","https://pandas.pydata.org/docs/user_guide/text.html","The str accessor, regex extraction and the string dtypes."],["pandas docs: Duplicate labels","https://pandas.pydata.org/docs/user_guide/duplicates.html","How duplicate index labels behave and how to detect or disallow them."],["scikit-learn: Common pitfalls and recommended practices","https://scikit-learn.org/stable/common_pitfalls.html","Why preprocessing must be fitted on training data only, with examples of leakage."]],"k":["missing values","data cleaning","leakage"],"x":["pandas"],"p":["handle-missing-values","drop-duplicates","replace-values","change-data-types","rename-columns"],"ak":""},{"id":"02.04","t":"GroupBy and aggregation","n":["`groupby` is split-apply-combine: split rows by key, apply a function to each group, and combine the results. The function's output shape decides what comes back.","`agg` reduces each group to one row; `transform` returns a result with the original index, so you can attach a group statistic to every row as a feature; `apply` is the general, slow fallback.","Named aggregation, `agg(total=(\"amount\", \"sum\"), n=(\"amount\", \"size\"))`, gives flat, readable column names and is the standard way to build a per-entity feature table.","A group statistic that includes the target or the current row (target encoding, a user's mean label) leaks; compute it on training data only or out of fold."],"a":"## Split, apply, combine\nMost feature tables are groupbys: one row per user, item or store, with columns such as \"number of orders\" and \"mean basket size\". pandas implements this as split-apply-combine.\n\n%%flow df.groupby(\"user\")[\"amount\"].sum()\nRows -(split by user)-> one group per user -(apply sum)-> *one value per group -(combine)-> Series indexed by user\n%%\n\n```python\ng = orders.groupby(\"user_id\")\ng[\"amount\"].sum()              # Series indexed by user_id\ng.size()                       # rows per group, counts missing values too\ng[\"amount\"].count()            # non-missing values per group\ng[[\"amount\", \"items\"]].mean()  # DataFrame, one column per input column\norders.groupby([\"user_id\", \"channel\"])[\"amount\"].sum()   # MultiIndex result\n```\n\nGrouping keys become the index of the result; `as_index=False` or a final `reset_index()` turns them back into columns, which is usually what you want before a merge (lesson 5). Missing keys are dropped by default; pass `dropna=False` to keep a `NaN` group.\n\n## agg and named aggregation\n`agg` takes one function, a list, or a dict per column. For feature tables use **named aggregation**: each keyword becomes a column, and the value is a `(column, function)` pair.\n\n```python\nuser_feats = orders.groupby(\"user_id\").agg(\n    n_orders=(\"order_id\", \"nunique\"),\n    total_spend=(\"amount\", \"sum\"),\n    mean_spend=(\"amount\", \"mean\"),\n    max_items=(\"items\", \"max\"),\n    last_order=(\"ts\", \"max\"),\n    share_mobile=(\"channel\", lambda s: (s == \"mobile\").mean()),\n).reset_index()\n```\n\nBuilt-in names such as `\"sum\"`, `\"mean\"`, `\"nunique\"`, `\"first\"` run in optimised code; a lambda runs in Python once per group, which is fine for thousands of groups and slow for millions (lesson 8). The older dict-of-lists form produces MultiIndex columns that then need flattening.\n\n## agg, transform, apply, filter\n| method | function returns | result shape | use it for\n| `agg` | a scalar per group | one row per group | feature tables, reports\n| `transform` | same length as the group (or a scalar, broadcast) | original index | per-row features: group mean, rank, z-score\n| `apply` | anything | depends | complex logic you cannot express otherwise\n| `filter` | a bool per group | subset of original rows | keep groups with at least n rows\n\n`transform` is the one people under-use. It lets you compare each row to its group without a merge:\n\n```python\norders[\"user_mean\"] = orders.groupby(\"user_id\")[\"amount\"].transform(\"mean\")\norders[\"amount_vs_user\"] = orders[\"amount\"] / orders[\"user_mean\"]\norders[\"rank_in_user\"] = orders.groupby(\"user_id\")[\"ts\"].rank(method=\"first\")\norders[\"order_idx\"] = orders.groupby(\"user_id\").cumcount()      # 0, 1, 2, ...\n```\n\nTop-n per group is a sort followed by `head`: `df.sort_values(\"score\", ascending=False).groupby(\"user_id\").head(10)`. This is faster and clearer than `apply` with `nlargest`.\n\n`apply` passes each group as a DataFrame to your function. In pandas 2.2, if that DataFrame still contains the grouping columns, pandas warns that this is deprecated; pass `include_groups=False` and use the group key from `.name` if you need it. In pandas 3.0 `include_groups=True` is no longer allowed, so the grouping columns are always left out of the frame passed to `apply`.\n\nGrouping by a `category` column used to return every category, including those with no rows (`observed=False`). That default was deprecated in pandas 2.1 and is `observed=True` in 3.0, so only categories that actually occur appear unless you ask otherwise.\n\n## Group statistics and leakage\nA group statistic is a feature computed from other rows, so you must ask which rows. Two common traps:\n- **Target encoding.** `df.groupby(\"merchant\")[\"is_fraud\"].transform(\"mean\")` gives every row the fraud rate of its merchant, *including its own label*. For a merchant with one transaction the feature equals the label. Compute the encoding on the training fold only, or out of fold, and add smoothing toward the global mean for rare groups.\n- **Using the future.** A user's mean spend over the whole table includes orders made after the prediction time. For time-ordered data use expanding or shifted statistics (lesson 7) or compute features as of a cutoff date.\n\n```python\ns = df.groupby(\"merchant\")[\"is_fraud\"].transform(\"sum\")\nn = df.groupby(\"merchant\")[\"is_fraud\"].transform(\"size\")\ndf[\"merchant_rate_loo\"] = (s - df[\"is_fraud\"]) / (n - 1)    # leave-one-out; NaN for singletons\n```\n\nAt serving time the same feature must come from the training-period table, mapped by key: `test[\"merchant_rate\"] = test[\"merchant\"].map(train_rates).fillna(global_rate)`.\n\n! Example: a per-user feature table\n! A recommendation model needs one row per user from 12 million interaction rows. `interactions.groupby(\"user_id\").agg(n=(\"item_id\", \"size\"), n_items=(\"item_id\", \"nunique\"), last=(\"ts\", \"max\"))` runs in a few seconds because every aggregation is built in.\n! Adding `top_genre=(\"genre\", lambda s: s.mode().iat[0])` makes the same call take minutes: the lambda runs once for each of 900,000 users. Replacing it with `interactions.groupby([\"user_id\", \"genre\"]).size()` followed by sorting by count and taking the first row per user brings it back to seconds.\n! Both versions are computed only from interactions before the training cutoff, so the table can be joined to labels from after it without leakage.\n\n> Takeaway: use `agg` with named aggregations to build one-row-per-entity features, `transform` to attach group statistics to every row, `apply` only as a last resort, and always ask whether a group statistic can see the label or the future.","q":"You build a click-through model on impression logs with columns `user_id`, `ad_id`, `ts` and `clicked`. A teammate adds `ad_ctr = df.groupby(\"ad_id\")[\"clicked\"].transform(\"mean\")` and `user_n_impr = df.groupby(\"user_id\")[\"ad_id\"].transform(\"size\")` on the full log, then does a random 80/20 split. Validation AUC jumps from 0.71 to 0.93. Explain what each feature leaks, and how you would compute them correctly.","s":"`ad_ctr` is a target encoding computed over all rows, including the row's own `clicked` value and the validation rows. Rare ads are the worst case: an ad with one impression gets `ad_ctr` equal to its own label, and an ad with a few impressions gets a value strongly correlated with each row's label, so the model reads the answer off the feature. `user_n_impr` uses the full log, including impressions that happen after each row's timestamp, which leaks future activity (users who keep getting impressions are by construction active later), and it is computed partly from validation rows. The random split makes it worse because the same users and ads appear on both sides. Correct versions: split by time first (train on earlier days, validate on later ones); compute `ad_ctr` from training-period rows only, with smoothing such as `(clicks + m * global_ctr) / (impressions + m)`, and map it onto validation rows by `ad_id`, filling unseen ads with the global rate; within the training set use out-of-fold or leave-one-out encoding so a row never sees its own label. For `user_n_impr`, count only impressions strictly before each row's `ts`, e.g. `df.sort_values(\"ts\").groupby(\"user_id\").cumcount()`, which is also exactly what can be computed at serving time.","r":[["pandas docs: Group by: split-apply-combine","https://pandas.pydata.org/docs/user_guide/groupby.html","Aggregation, named aggregation, transformation, filtration and apply, with performance notes."],["Wickham: The split-apply-combine strategy for data analysis (2011)","https://www.jstatsoft.org/article/view/v040i01","The paper that named the pattern pandas groupby implements."],["scikit-learn: Common pitfalls and recommended practices","https://scikit-learn.org/stable/common_pitfalls.html","Data leakage from statistics computed on the full dataset."]],"k":["groupby","aggregation","target encoding"],"x":["pandas"],"p":["groupby-basics","multi-level-groupby","top-n-per-group","aggregation-functions","apply-custom-transforms"],"ak":""},{"id":"02.05","t":"Combining tables","n":["`merge` is a SQL join: `how=\"inner\"`, `\"left\"`, `\"right\"`, `\"outer\"` or `\"cross\"`, on one or more key columns. For attaching features to labelled rows, `how=\"left\"` keeps every labelled row.","Duplicate keys multiply rows: a key that appears $m$ times on the left and $n$ times on the right produces $m \\times n$ output rows. Pass `validate=\"many_to_one\"` so pandas raises instead of exploding.","Check every join: compare row counts before and after, use `indicator=True` to count unmatched rows, and make sure key dtypes and string normalisation match on both sides.","`concat` stacks frames along rows or columns by aligning labels; mismatched columns become `NaN`. For time-dependent features, `merge_asof` joins each row to the latest record at or before its timestamp, which keeps joins point-in-time correct."],"a":"## merge is a join\nFeature pipelines are mostly joins: labels joined to user features, item features, and aggregates from lesson 4. pandas `merge` follows SQL semantics (the SQL module covers the same ideas in a database).\n\n```python\ntrain = labels.merge(user_feats, on=\"user_id\", how=\"left\", validate=\"many_to_one\")\ntrain = train.merge(items, left_on=\"item\", right_on=\"item_id\", how=\"left\",\n                    suffixes=(\"\", \"_item\"))\n```\n\n| how | keeps | unmatched rows | typical use\n| `inner` | keys present on both sides | dropped | both tables required\n| `left` | every left row | right columns become `NaN` | attach features to labels\n| `right` | every right row | left columns become `NaN` | rarely needed; swap and use left\n| `outer` | all keys | `NaN` on the missing side | reconciliation, diffing two tables\n| `cross` | every pair | n/a | candidate generation, small grids\n\nAn inner join used to attach features quietly drops labelled examples whose features are missing, and those are often not random (new users, new items). The model then never trains on the cold-start case it will meet in production. Use `how=\"left\"` and handle the missing features explicitly.\n\n`DataFrame.join` is a convenience for joining on the index (`left.join(right, on=\"key\")` uses the right frame's index); `merge` is the general tool and is clearer about keys.\n\n## Row explosions\nA merge produces one output row for every matching pair of rows. If a key value appears $m$ times on the left and $n$ times on the right, it contributes $m \\times n$ rows, so the output size is $\\sum_k m_k n_k$.\n\n%%flow Why a \"lookup\" join can multiply rows.\nlabels: user u7 x 3 rows -(merge on user_id)-> user_feats: u7 x 2 rows (stale + fresh) -> *u7 x 6 rows in train\n%%\n\nDuplicated rows are not just wasted memory: they reweight training toward users with duplicated features, and if the duplicates differ (an old and a new feature value) the model sees contradictory inputs. Protect every join:\n\n```python\nn0 = len(labels)\nout = labels.merge(user_feats, on=\"user_id\", how=\"left\",\n                   validate=\"many_to_one\", indicator=True)\nassert len(out) == n0\nprint(out[\"_merge\"].value_counts())        # both / left_only / right_only\nout = out.drop(columns=\"_merge\")\n```\n\n`validate` accepts `\"one_to_one\"`, `\"one_to_many\"`, `\"many_to_one\"` and `\"many_to_many\"` (or the short forms `\"1:1\"`, `\"1:m\"`, `\"m:1\"`, `\"m:m\"`) and raises `MergeError` if the key uniqueness assumption is wrong. It costs a uniqueness check and is worth it on every pipeline join. To find the culprits, `user_feats[\"user_id\"].value_counts().head()` shows the duplicated keys.\n\n## Keys must really match\nCommon reasons a join matches less than expected:\n- **dtype mismatch.** Merging an `int64` key with an `object` or string key raises a `ValueError` in recent pandas. `int64` against `float64` will merge, but a float key that came from a column with `NaN` is a hint that something upstream is wrong.\n- **String normalisation.** `\"ABC-1 \"` does not match `\"abc-1\"`; normalise both sides with the same function (lesson 3).\n- **Missing keys.** Rows whose key is `NaN` can match each other in pandas merges, unlike SQL where `NULL` never equals `NULL`. Drop or fill missing keys before joining.\n- **Time.** A feature table snapshotted today, joined to labels from last year, gives every training row today's feature values. That is leakage, and it is the subject of the last section.\n\n## concat\n`pd.concat` stacks objects. Along rows (`axis=0`) it aligns columns by name; along columns (`axis=1`) it aligns rows by index.\n\n```python\nbatches = [pd.read_parquet(p) for p in paths]\ndf = pd.concat(batches, ignore_index=True)          # fresh 0..n-1 index\ndf = pd.concat({\"train\": tr, \"test\": te}, names=[\"split\"]).reset_index(level=\"split\")\n```\n\nIf one batch has an extra column, the result has that column with `NaN` for the other batches; if a column changes dtype between batches, the result may fall back to `object`. Check `df.dtypes` after concatenating files from different days, or pass `join=\"inner\"` to keep only shared columns. Growing a frame with `concat` inside a loop copies all previous rows every iteration; collect the pieces in a list and concatenate once.\n\n## Point-in-time joins with merge_asof\nFor each training example, a feature must be the value that was known at the example's timestamp, not the latest value. `merge_asof` does exactly this: for each left row it takes the last right row whose time is at or before the left row's time, optionally within the same entity.\n\n```python\nlabels = labels.sort_values(\"ts\")\nsnapshots = snapshots.sort_values(\"ts\")\ntrain = pd.merge_asof(\n    labels, snapshots, on=\"ts\", by=\"user_id\",\n    direction=\"backward\",            # latest snapshot at or before ts\n    allow_exact_matches=False,       # strictly before: features computed at ts are excluded\n    tolerance=pd.Timedelta(\"30D\"),   # stale snapshots count as missing\n)\n```\n\nBoth frames must be sorted by the `on` column, and its dtypes must match (both `datetime64` with the same time zone). `allow_exact_matches=False` is the conservative choice when a snapshot stamped at time *t* may already include the event being predicted.\n\n! Example: the join that doubled the dataset\n! A label table has 1.2 million rows. After `merge(user_profile, on=\"user_id\")` it has 1.9 million, and offline accuracy improves suspiciously. `user_profile[\"user_id\"].value_counts()` shows 210,000 users with two rows: a profile service wrote a new row on each address change instead of updating.\n! With `validate=\"many_to_one\"` the merge would have raised immediately. The fix keeps one row per user as of each label's time, using `merge_asof(..., by=\"user_id\")` on the profile's `updated_at`, which removes the duplication and also stops later address changes leaking into earlier labels.\n\n> Takeaway: join features to labels with `how=\"left\"` and `validate`, assert the row count, inspect unmatched keys, and use `merge_asof` whenever a feature changes over time.","q":"You train a model to predict whether a support ticket escalates. `tickets` has one row per ticket with `customer_id` and `created_at`. `accounts` is a nightly export with one row per customer per day (`customer_id`, `snapshot_date`, `plan`, `open_tickets`). You write `tickets.merge(accounts, on=\"customer_id\")`. What goes wrong, and what join should you write instead?","s":"`accounts` has many rows per customer, so the merge is many-to-many: each ticket is repeated once per snapshot of its customer, which explodes the row count (a customer with 400 daily snapshots and 5 tickets yields 2,000 rows). Even after deduplicating, every ticket would carry feature values from all dates, including snapshots taken after the ticket was created, so `open_tickets` would count the ticket itself and later tickets: target leakage. The default `how=\"inner\"` also drops tickets from customers missing from the export. The correct join is point in time: sort both frames by time and use `pd.merge_asof(tickets.sort_values(\"created_at\"), accounts.sort_values(\"snapshot_date\"), left_on=\"created_at\", right_on=\"snapshot_date\", by=\"customer_id\", direction=\"backward\", allow_exact_matches=False)`, so each ticket gets the latest snapshot strictly before it was created (both time columns as datetimes with the same time zone; a snapshot dated the same day could already reflect the ticket, so excluding exact matches is safer, or compare against the previous day's date). Add a `tolerance` so very stale snapshots become missing, assert that the output has exactly `len(tickets)` rows, and count tickets that found no snapshot. The serving path must use the same rule: the latest snapshot available at prediction time.","r":[["pandas docs: Merge, join, concatenate and compare","https://pandas.pydata.org/docs/user_guide/merging.html","merge semantics, validate, indicator, concat options and merge_asof."],["pandas API: DataFrame.merge","https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.merge.html","Every merge parameter, including validate and suffixes."],["pandas API: merge_asof","https://pandas.pydata.org/docs/reference/api/pandas.merge_asof.html","Sorting requirements, by, direction, tolerance and allow_exact_matches."]],"k":["merge","joins","point-in-time"],"x":["pandas"],"p":["merge-dataframes","point-in-time-feature-join","concatenate-dataframes","setting-index"],"ak":""},{"id":"02.06","t":"Reshaping","n":["**Long** data has one row per observation (entity, variable, value); **wide** data has one row per entity and one column per variable. Logs and databases store long; most models consume wide.","`pivot` reshapes long to wide and fails on duplicate entries; `pivot_table` aggregates duplicates (mean by default) and can fill gaps. `crosstab` is a pivot table of counts.","`melt` goes from wide to long, which is what you want for plotting, storing many metrics, or applying one groupby across many columns.","`stack` and `unstack` move levels between a MultiIndex on rows and on columns. After pivoting, fix the column set with `reindex(columns=train_columns, fill_value=0)` so serving produces exactly the training layout."],"a":"## Long and wide\nThe same information can be laid out in two shapes. Long (or \"tidy\") data has one row per observation:\n\n| user | metric | value\n| u1 | clicks | 12\n| u1 | spend | 30.5\n| u2 | clicks | 3\n\nWide data has one row per entity and one column per variable:\n\n| user | clicks | spend\n| u1 | 12 | 30.5\n| u2 | 3 | NaN\n\nLong is the natural shape for event logs, for databases, and for adding a new variable without changing a schema. Wide is the shape of a feature matrix: one row per example, one column per feature. Hadley Wickham's *Tidy Data* paper gives the vocabulary: each variable a column, each observation a row, each type of observational unit a table. Feature engineering is often a deliberate move from tidy long tables to a wide design matrix.\n\n%%flow Moving between the two shapes.\nLong events (user, category, amount) -(pivot_table index=user, columns=category)-> *Wide features (one row per user) -(melt id_vars=user)-> Long again\n%%\n\n## pivot and pivot_table\n`pivot` rearranges without computing anything. If two rows share the same index and column pair it raises `ValueError: Index contains duplicate entries, cannot reshape`, which is useful: it tells you your assumption of uniqueness was wrong.\n\n```python\nwide = long.pivot(index=\"user\", columns=\"metric\", values=\"value\")\n```\n\n`pivot_table` aggregates duplicates instead. The default `aggfunc` is `\"mean\"`, which is rarely what you want for counts or money, so always state it:\n\n```python\nspend = tx.pivot_table(index=\"user_id\", columns=\"category\", values=\"amount\",\n                       aggfunc=\"sum\", fill_value=0)\nspend.columns = [f\"spend_{c}\" for c in spend.columns]   # flat, prefixed names\nspend = spend.reset_index()\n```\n\n`margins=True` adds row and column totals for reports. With several `values` or several `aggfunc`s the columns become a MultiIndex; flatten them with `[\"_\".join(map(str, c)) for c in df.columns]` before handing the frame to a model or writing Parquet.\n\n`pd.crosstab(a, b)` counts co-occurrences of two categorical Series, which makes it the quickest confusion matrix: `pd.crosstab(y_true, y_pred, normalize=\"index\")` gives per-class recall along the diagonal.\n\n## melt\n`melt` is the inverse: it turns columns into rows.\n\n```python\nlong = wide.melt(id_vars=[\"user_id\"], value_vars=[\"q1\", \"q2\", \"q3\"],\n                 var_name=\"quarter\", value_name=\"revenue\")\n```\n\nUse it when the same operation should run over many columns, for example normalising 50 sensor channels per device: melt, `groupby([\"device\", \"channel\"])`, transform, then pivot back. It is also the format plotting libraries such as seaborn expect. `pd.wide_to_long` handles columns that encode two things, like `score_2023` and `score_2024`.\n\n## stack and unstack\nWith a MultiIndex, `unstack(level)` moves an index level into the columns and `stack()` moves the innermost column level into the index. A groupby over two keys followed by `unstack` is a pivot:\n\n```python\ncounts = events.groupby([\"user_id\", \"event_type\"]).size().unstack(fill_value=0)\n```\n\n`unstack` without arguments uses the innermost level. In pandas 2.1 `stack` gained a new implementation behind `future_stack=True`; in pandas 3.0 that implementation is the default, it no longer drops rows that are all missing, and the old `dropna` and `sort` arguments have no effect and must stay unspecified (both are deprecated). If you relied on `stack()` removing `NaN` rows, add `.dropna()` explicitly.\n\n## Wide features at training and serving\nA pivot creates one column per category value *that occurs in the data*. That has two consequences for ML:\n- A serving batch with no `\"travel\"` transactions produces no `spend_travel` column, and a new category produces a column the model has never seen. Fix the layout to the training columns: `X = wide.reindex(columns=TRAIN_COLUMNS, fill_value=0)`.\n- A rare category in a long tail creates hundreds of almost-empty columns. Group rare values into `\"other\"` before pivoting, or keep only the top-k categories learned on training data.\n\n`fill_value=0` is correct for counts and sums (no transactions means zero spend), but wrong for averages or last-known values, where \"no data\" is not zero. Use `NaN` and let lesson 3's imputation handle it, or add a count column so the model can tell zero from absent.\n\n! Example: turning a training log into a comparison table\n! A training run logs long records `(step, split, metric, value)`, about 40,000 rows. To compare train and validation loss per step, `log.pivot_table(index=\"step\", columns=[\"split\", \"metric\"], values=\"value\", aggfunc=\"last\")` gives a MultiIndex column for every split and metric pair.\n! `pivot` would have failed because a resumed run logged steps 3,000 to 3,100 twice; `aggfunc=\"last\"` keeps the latest record for each step. Flattening the columns to `train_loss`, `val_loss`, `val_acc` gives a wide table where `(t[\"val_loss\"] - t[\"train_loss\"]).rolling(10).mean()` tracks the generalisation gap directly.\n\n> Takeaway: store and transform data long, model it wide, state the aggregation in every `pivot_table`, and pin the wide column set to the training layout so serving cannot add, drop or reorder features.","q":"Your fraud features include `n_tx_<category>`, built per user by `pivot_table` over the last 30 days of transactions with `aggfunc=\"count\", fill_value=0`, and `avg_amount_<category>` built the same way with `aggfunc=\"mean\", fill_value=0`. In production, the scoring service rebuilds these columns from the live 30-day window and passes `wide.values` to the model. What can go wrong, and how do you fix both the features and the serving path?","s":"Three problems. First, the column set depends on which categories happen to occur in the window: the live data may lack categories seen in training (columns disappear) or contain new ones (columns appear), and because the service passes `wide.values` by position, every feature after the first difference is shifted onto the wrong model weight with no error. Fix it by saving the training column list and doing `wide.reindex(columns=TRAIN_COLUMNS, fill_value=...)` before scoring, mapping unseen categories to an `other` bucket before pivoting, and selecting by name rather than position. Second, `fill_value=0` for `avg_amount_<category>` conflates 'no transactions in this category' with 'transactions averaging zero'; leave these as NaN (and impute consistently) or rely on the count column to disambiguate. Counts filled with 0 are correct. Third, column order from `pivot_table` is sorted by category value, which can differ between environments if category labels are normalised differently (case, whitespace); apply the same normalisation function in both places. A test that builds features for a fixed sample in both the training pipeline and the serving code and compares them column by column catches all three, which is the core of a training-serving skew check.","r":[["pandas docs: Reshaping and pivot tables","https://pandas.pydata.org/docs/user_guide/reshaping.html","pivot, pivot_table, melt, stack, unstack, crosstab, wide_to_long and get_dummies."],["Wickham: Tidy Data (2014)","https://www.jstatsoft.org/article/view/v059i10","Why long, tidy tables make transformation easy and how messy layouts map onto them."],["pandas docs: MultiIndex / advanced indexing","https://pandas.pydata.org/docs/user_guide/advanced.html","How hierarchical row and column indexes work, which stack and unstack move between."]],"k":["reshaping","pivot","tidy data"],"x":["pandas"],"p":["pivot-tables","melt-wide-to-long","unstack-long-to-wide","cross-tabulation","training-serving-skew"],"ak":""},{"id":"02.07","t":"Time series in pandas","n":["Parse timestamps once into `datetime64` (with an explicit format and time zone), sort, and either set them as a `DatetimeIndex` or keep them as a column used with `on=`. Partial-string slicing such as `df.loc[\"2024-03\"]` then works.","`resample` changes frequency (events to daily totals, for instance); `rolling` computes statistics over a moving window of rows (`rolling(7)`) or of time (`rolling(\"7D\")`); `expanding` uses everything so far.","Windows include the current row by default. A feature for predicting time $t$ must use only data before $t$: `shift(1)` before rolling, or `closed=\"left\"` on time-based windows, and always per entity via `groupby`.","Validate with time-ordered splits, never random ones, and make sure label windows and feature windows do not overlap."],"a":"## Getting timestamps right\nTime series work starts with a clean datetime column. Parse with an explicit format, decide on a time zone (UTC is the safe default for storage), and sort:\n\n```python\ndf[\"ts\"] = pd.to_datetime(df[\"ts\"], format=\"%Y-%m-%dT%H:%M:%S%z\", utc=True)\ndf = df.sort_values([\"store_id\", \"ts\"])\ndaily = df.set_index(\"ts\")\ndaily.loc[\"2024-03\"]                      # all of March 2024\ndaily.loc[\"2024-03-01\":\"2024-03-07\"]      # both ends included, as with any .loc slice\ndf[\"ts\"].dt.tz_convert(\"Europe/Amsterdam\").dt.hour   # local hour as a feature\n```\n\nMixing time-zone-aware and naive timestamps raises an error in comparisons and joins, which is a feature: it stops you comparing local and UTC times by accident. Calendar features (`.dt.dayofweek`, `.dt.hour`, `.dt.month`) should be computed in the time zone where the behaviour happens.\n\n## Resampling\n`resample` is a groupby on time bins. It turns irregular events into a regular series:\n\n```python\nsales = df.set_index(\"ts\").groupby(\"store_id\")[\"amount\"].resample(\"D\").sum()\nsales = sales.reset_index()    # columns: store_id, ts, amount\n```\n\nDays with no events appear with sum 0 (and `NaN` for `mean`), which makes gaps explicit. Frequency aliases changed in pandas 2.2: use `\"h\"`, `\"min\"`, `\"s\"` for hours, minutes and seconds, and `\"ME\"`, `\"QE\"`, `\"YE\"` for month, quarter and year ends; the old `\"H\"`, `\"T\"`, `\"M\"` spellings are deprecated. Each bin is labelled by one edge, which is the left edge for daily and hourly bins and the right edge for month-end bins, so read the `label` and `closed` defaults before aligning resampled features with labels.\n\n## Rolling and expanding windows\n| window | covers | example\n| `rolling(7)` | the last 7 **rows** | 7-day mean if there is exactly one row per day\n| `rolling(\"7D\")` | rows within the last 7 days of **time** | robust to missing days and irregular events\n| `expanding()` | all rows so far | running mean, cumulative counts\n| `ewm(halflife=\"7D\", times=...)` | all rows, exponentially weighted | smooth recency-weighted average\n\nRow-based windows silently become wrong when days are missing: seven rows might span three weeks. Either make the series regular first (`resample(\"D\")` or `asfreq(\"D\")`) or use a time-based window. `min_periods` sets how many observations are required before a value is produced; the default for an integer window is the window size, so the first rows are `NaN`.\n\n## Lags without leakage\nBy default every window ends at, and includes, the current row. If the target is today's sales, a 7-day mean that includes today contains the target. The rule: a feature for time $t$ uses only information available before $t$.\n\n%%flow Building a feature for day t from strictly earlier data.\nSales up to day t-1 -(shift 1 per store)-> *rolling 7 mean -> feature at t -> model predicts sales at t\n%%\n\n```python\ndf = df.sort_values([\"store_id\", \"date\"])\ng = df.groupby(\"store_id\")[\"sales\"]\ndf[\"lag_1\"] = g.shift(1)                       # yesterday, per store\ndf[\"lag_7\"] = g.shift(7)                       # same weekday last week\ndf[\"mean_7\"] = g.transform(lambda s: s.shift(1).rolling(7, min_periods=3).mean())\ndf[\"mean_all\"] = g.transform(lambda s: s.shift(1).expanding().mean())\n\nfeat = (df.set_index(\"date\").groupby(\"store_id\")[\"sales\"]\n          .rolling(\"7D\", closed=\"left\").sum())   # time window [t - 7D, t)\n```\n\nThree details matter. The `groupby` stops one store's history spilling into the next store's first rows, which a plain `shift` over the sorted frame would do. The `shift(1)` happens *inside* each group before the window. And if your prediction is made some time before the target (forecasting next week, or labels that arrive late), shift by that horizon, not by one: features for a forecast made on Monday for Friday may use data only up to Monday.\n\n`center=True` windows and `bfill` use future rows; they are fine for smoothing a plot and wrong for features. Forward fill (`ffill`) is safe, since it only copies the past forward.\n\n## Splitting by time\nRandom train/test splits on time series let the model train on Thursday and test on Wednesday, so offline scores reflect interpolation between neighbouring days rather than forecasting. Split by a cutoff instead, and leave a gap at least as long as your longest feature window or label window so the two sides cannot share information:\n\n```python\ncutoff = pd.Timestamp(\"2024-06-01\", tz=\"UTC\")\ntrain = df[df[\"date\"] < cutoff - pd.Timedelta(\"7D\")]\ntest = df[df[\"date\"] >= cutoff]\n```\n\nscikit-learn's `TimeSeriesSplit` (with its `gap` argument) gives the same structure for cross-validation.\n\n! Example: a sales feature that peeked\n! A demand model's feature `rolling_mean_7 = df.groupby(\"store_id\")[\"sales\"].transform(lambda s: s.rolling(7).mean())` gives a validation MAPE of 6%. In production the error is 19%.\n! Because the window includes the current day, one seventh of each feature is the target itself, and on volatile days that share is what the model leans on. Rewriting the feature with `s.shift(1).rolling(7)` brings offline MAPE to 17%, matching production, and is the version that can actually be computed before the day starts.\n\n> Takeaway: parse and sort timestamps first, compute every window per entity on data strictly before the prediction time (`shift` or `closed=\"left\"`), and split train and test by time with a gap.","q":"You predict whether a user will make a purchase in the next 7 days, scoring every Monday at 00:00 UTC. For training you create one row per user per Monday with features `purchases_30d = rolling(\"30D\").count()` over the user's purchase events, computed with `groupby(\"user_id\")` on a frame indexed by purchase time, then merged onto the Monday rows by `(user_id, date)`. The label is purchases in `[Monday, Monday + 7 days)`. Identify the leakage and other bugs in this setup and describe a correct construction.","s":"The rolling count is evaluated at each purchase event, not at the Monday scoring time, so merging on `(user_id, date)` only works for Mondays on which the user purchased, and then the window includes purchases made on Monday itself, i.e. inside the label window: direct leakage. For other Mondays the merge finds no row, so the feature is missing or gets filled with 0, which is also wrong. The correct construction computes features at the scoring times: build the grid of `(user_id, monday)` rows, then for each one count purchases in `[monday - 30 days, monday)`. One way is `pd.merge_asof` from the Monday grid onto a per-user cumulative count of events with `allow_exact_matches=False`, then subtracting the cumulative count as of `monday - 30 days`; another is resampling purchases to daily counts per user, computing `rolling(30)` on the regular daily series, shifting by one day so the window ends on Sunday, and selecting the Mondays. The label must be computed from events in `[monday, monday + 7 days)` only. Split train and validation by Monday dates, not randomly, with at least a 7-day gap so the last training labels do not overlap the first validation features. Check the result by recomputing a few rows by hand and by confirming the same code runs at serving time with only data up to Sunday 23:59.","r":[["pandas docs: Time series / date functionality","https://pandas.pydata.org/docs/user_guide/timeseries.html","DatetimeIndex, time zones, offset aliases (including the 2.2 changes), resample and asfreq."],["pandas docs: Windowing operations","https://pandas.pydata.org/docs/user_guide/window.html","rolling, expanding and ewm, time-based windows, closed and min_periods."],["scikit-learn API: TimeSeriesSplit","https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html","Time-ordered cross-validation folds with an optional gap."]],"k":["time series","rolling windows","leakage"],"x":["pandas"],"p":["point-in-time-feature-join","delayed-label-monitoring","apply-custom-transforms","popularity-baseline-leave-last-out"],"ak":""},{"id":"02.08","t":"Fast, memory-safe pandas","n":["Column-wise operations run in compiled code; `apply(axis=1)` and `iterrows` run Python once per row and are typically 10 to 1000 times slower. Reach for arithmetic, `np.where`/`np.select`, `map`, `cut` and the `.str`/`.dt` accessors first.","Measure memory with `df.memory_usage(deep=True)`. Text columns in `object` dtype dominate it; `category` (or the Arrow-backed `str` default in pandas 3.0) and downcast numerics usually cut a frame several-fold.","Categories are part of the feature contract: build them from the training set and apply the same categories at serving so the integer codes mean the same thing.","For data larger than memory, read only the columns you need, stream with `chunksize` and combine partial aggregates correctly; method chaining with `assign` and `pipe` keeps the pipeline readable and free of half-modified intermediates."],"a":"## Why apply is slow\nA pandas column is a NumPy or Arrow array, so an expression like `df[\"price\"] * df[\"qty\"]` is one loop in compiled code (the NumPy module's vectorisation lesson explains why). `df.apply(f, axis=1)` instead builds a Series for each row and calls the Python function on it; on a million rows that is a million Python calls and a million small objects.\n\n%%layers Rough speed ladder for a per-row computation, fastest at the top.\n*Vectorised column ops | arithmetic, comparisons, np.where, .str and .dt accessors\nBuilt-in groupby / map / merge | compiled loops keyed by group or lookup\nSeries.apply / map with a function | one Python call per element\nDataFrame.apply(axis=1), iterrows | one Python call plus one Series per row\n%%\n\nMost row-wise logic has a vectorised form:\n\n```python\ndf[\"fee\"] = np.where(df[\"plan\"] == \"pro\", 0.0, df[\"amount\"] * 0.03)\n\ndf[\"tier\"] = np.select(                      # branches checked in order\n    [df[\"spend\"] >= 1000, df[\"spend\"] >= 100],\n    [\"gold\", \"silver\"], default=\"bronze\")\n\ndf[\"region\"] = df[\"country\"].map(COUNTRY_TO_REGION)       # NaN if missing from the dict\ndf[\"age_bin\"] = pd.cut(df[\"age\"], bins=[0, 18, 35, 60, 120], right=False)\ndf[\"domain\"] = df[\"email\"].str.split(\"@\").str[1]\ndf[\"hour\"] = df[\"ts\"].dt.hour\n```\n\nWhen a Python function is genuinely needed, apply it to the unique values and map back: `df[\"parsed\"] = df[\"ua\"].map({u: parse(u) for u in df[\"ua\"].unique()})`. With 10 million rows but 5,000 distinct user agents, that is 5,000 calls instead of 10 million. Lesson 4's named aggregations follow the same rule: prefer built-in function names to lambdas.\n\n## Measuring and reducing memory\n`df.info(memory_usage=\"deep\")` and `df.memory_usage(deep=True)` report true memory, including the Python string objects behind `object` columns, which the shallow figure omits. Typical savings:\n\n| change | how | effect\n| repeated strings to category | `astype(\"category\")` | integer codes plus one copy of each value; often 10x smaller\n| text to Arrow strings | pandas 3.0 default, or `dtype_backend=\"pyarrow\"` | compact buffers, faster `.str` methods\n| float64 to float32 | `pd.to_numeric(s, downcast=\"float\")` | half the memory; fine for most features\n| int64 to smaller ints | `pd.to_numeric(s, downcast=\"integer\")` | 2 to 8x smaller, check the value range\n| fewer columns | `usecols=` / `columns=` at read time | the cheapest saving of all\n\nParquet stores dtypes (including categories) and supports reading a subset of columns, so `pd.read_parquet(path, columns=FEATURES)` is far cheaper than reading a CSV and dropping columns afterwards.\n\n## Categoricals as a contract\nA `category` column stores integer codes and a list of categories. Many tools use the codes directly: LightGBM and XGBoost's categorical support read them, and `s.cat.codes` is a quick ordinal encoding. That makes the category list part of the model:\n\n```python\ncats = pd.CategoricalDtype(sorted(train[\"city\"].dropna().unique()))\ntrain[\"city\"] = train[\"city\"].astype(cats)\nserve[\"city\"] = serve[\"city\"].astype(cats)     # unseen cities become NaN, codes stay aligned\n```\n\nIf serving instead calls `astype(\"category\")` on its own batch, categories are inferred from that batch, so code 3 may mean \"Lyon\" in training and \"Oslo\" in production: a silent train/serve skew. Save the dtype (or the category list) with the model. Grouping by a categorical with many unused categories used to produce empty groups; since pandas 3.0 `observed=True` is the default.\n\n## Data that does not fit\nFor a file larger than memory, stream it and combine partial results:\n\n```python\ntotals = None\nfor chunk in pd.read_csv(\"events.csv\", usecols=[\"user_id\", \"amount\"],\n                         dtype={\"user_id\": \"string\", \"amount\": \"float32\"},\n                         chunksize=1_000_000):\n    part = chunk.groupby(\"user_id\")[\"amount\"].agg([\"sum\", \"count\"])\n    totals = part if totals is None else totals.add(part, fill_value=0)\ntotals[\"mean\"] = totals[\"sum\"] / totals[\"count\"]\n```\n\nAggregate sums and counts per chunk, never means: the mean of chunk means is wrong when chunks hold different numbers of rows per user. Distinct counts and medians do not combine this way at all. When chunking gets complicated, move the work to a tool designed for it: the pandas scaling guide lists options, and DuckDB, Polars or the SQL module's techniques handle out-of-core group-bys directly.\n\n## Method chaining\nChaining builds a pipeline as one expression, with each step returning a new frame:\n\n```python\nfeats = (\n    pd.read_parquet(\"orders.parquet\", columns=[\"user_id\", \"ts\", \"amount\", \"plan\"])\n      .query(\"amount > 0\")\n      .assign(month=lambda d: d[\"ts\"].dt.to_period(\"M\"),\n              log_amount=lambda d: np.log1p(d[\"amount\"]))\n      .pipe(add_user_features, cutoff=CUTOFF)\n      .astype({\"plan\": PLAN_DTYPE})\n)\n```\n\n`assign` with a lambda refers to the frame *at that step*, `pipe` slots in your own functions, and nothing is half-modified if a step fails. Under Copy-on-Write (lesson 2) these steps share memory until something is written, so chaining no longer costs a full copy per step. Wrapping the chain in a function gives you one entry point to call from both training and serving.\n\n! Example: a 9 GB frame that fits in 1 GB\n! An interaction log of 60 million rows has `user_id` and `item_id` as text, `event` as text with 4 distinct values, and `ts` and `dwell` as float64. `memory_usage(deep=True)` reports about 9 GB, almost all of it Python string objects.\n! Converting `event` to `category` (1 byte per row), `user_id` and `item_id` to integer ids via `pd.factorize` (int32), `dwell` to float32 and `ts` to `datetime64` brings it to about 1.1 GB. The id mappings from `factorize` are saved next to the model, for the same reason categories are.\n\n> Takeaway: vectorise first, apply to unique values when you must use Python, measure memory with `deep=True`, fix categories on the training set, and stream large files with aggregates that combine correctly.","q":"A preprocessing step takes 40 minutes on 20 million rows. It reads a CSV, then runs `df[\"bucket\"] = df.apply(lambda r: \"high\" if r[\"score\"] > 0.8 and r[\"country\"] in EU else \"low\", axis=1)`, then `df[\"device\"] = df[\"device\"].astype(\"category\")` and finally writes `df[\"device\"].cat.codes` as a model feature. The serving service applies the same code to each incoming batch. Identify the performance and correctness problems and rewrite the logic.","s":"Performance: `apply(axis=1)` calls a Python function and builds a row Series 20 million times; it is almost certainly where the 40 minutes go. The vectorised form is `df[\"bucket\"] = np.where((df[\"score\"] > 0.8) & df[\"country\"].isin(EU), \"high\", \"low\")`, which runs in well under a second; store it as a category too. Reading the CSV with explicit `dtype` and `usecols` (or switching to Parquet) and casting low-cardinality text to `category` will also cut memory and parse time. Correctness: `astype(\"category\")` infers categories from whatever data it sees and sorts them, so in serving each batch gets its own category list and `cat.codes` can map the same device to different integers between training and serving, or between batches. The model then receives meaningless codes without any error. Fix it by building `DEVICE_DTYPE = pd.CategoricalDtype(train_categories)` once on the training data, saving it with the model, and applying `astype(DEVICE_DTYPE)` in both pipelines; unseen devices become NaN (code -1), which should be handled explicitly, for example by mapping to an 'other' category that exists in training. Putting both steps in one function used by training and serving, with a test comparing their outputs on the same rows, guards against the skew.","r":[["pandas docs: Scaling to large datasets","https://pandas.pydata.org/docs/user_guide/scale.html","Loading fewer columns, efficient dtypes, chunking and when to use other libraries."],["pandas docs: Categorical data","https://pandas.pydata.org/docs/user_guide/categorical.html","CategoricalDtype, codes, memory savings and how categories behave in operations."],["pandas docs: Enhancing performance","https://pandas.pydata.org/docs/user_guide/enhancingperf.html","Why apply is slow and how Cython, Numba and eval speed up hot paths."],["pandas docs: PyArrow functionality","https://pandas.pydata.org/docs/user_guide/pyarrow.html","Arrow-backed dtypes and the pyarrow engine for I/O."]],"k":["performance","categoricals","memory"],"x":["pandas"],"p":["apply-custom-transforms","training-serving-skew","change-data-types","data-types-overview"],"ak":""}]},{"n":"03","name":"SQL for ML","lessons":[{"id":"03.01","t":"SELECT, filtering and sorting","n":["A query is evaluated in a logical order that differs from how it is written: FROM, WHERE, GROUP BY, HAVING, SELECT, DISTINCT, ORDER BY, LIMIT. That order explains which names are visible where.","`AND` binds tighter than `OR`. Parenthesise every mixed condition, or `split = 'val' OR split = 'test' AND score > 0.9` will keep every validation row.","SQL uses three-valued logic: any comparison with NULL is UNKNOWN, and WHERE keeps only TRUE rows. `x <> 'a'` silently drops the rows where x is NULL.","Without ORDER BY, row order is undefined; with ties, it is still undefined. Add a unique tie-breaker, and remember databases disagree on where NULLs sort."],"a":"## Why SQL for ML\nMost training data starts life in a database or warehouse: event logs, labels, model registries, evaluation results. Pulling a whole table into pandas and filtering there is slow at scale and moves data you do not need. This module teaches enough SQL to build datasets and analyses where the data lives. The examples are standard SQL that runs in SQLite (the dialect of the practice problems) and PostgreSQL; differences are called out where they matter.\n\n## The anatomy of a query\nA `SELECT` is written in one order and evaluated, logically, in another:\n\n%%flow Logical evaluation order of a SELECT; each step only sees what earlier steps produced.\nFROM / JOIN -> WHERE -> GROUP BY -> HAVING -> *SELECT -> ORDER BY -> LIMIT\n%%\n\n```sql\nSELECT run_id, model, steps * batch_size AS examples_seen\nFROM training_runs\nWHERE status = 'finished' AND (lr >= 1e-4 OR warmup_steps > 0)\nORDER BY examples_seen DESC, run_id\nLIMIT 10;\n```\n\nTwo consequences of that order trip people up:\n- A column alias defined in SELECT is **not** visible in WHERE in standard SQL, because WHERE runs first. PostgreSQL rejects `WHERE examples_seen > 1e6`; SQLite accepts it as an extension. Repeat the expression or move it into a subquery.\n- The alias **is** visible in ORDER BY, which runs after SELECT.\n\nThe database is free to execute the query in any physical order it likes (using an index first, say). The logical order defines only what the answer must be.\n\n## WHERE logic\n`WHERE` keeps the rows for which the condition evaluates to TRUE. The operators: comparisons (`=`, `<>`, `<`, `>=`), `BETWEEN a AND b` (inclusive at both ends), `IN (...)`, `LIKE 'gpt-%'` (`%` matches any run of characters, `_` exactly one), `IS NULL`, combined with `AND`, `OR`, `NOT`.\n\nPrecedence is `NOT`, then `AND`, then `OR`. So\n\n```sql\nWHERE split = 'val' OR split = 'test' AND confidence > 0.9\n```\n\nmeans `split = 'val' OR (split = 'test' AND confidence > 0.9)`: every validation row comes through regardless of confidence. Parentheses cost nothing; use them every time AND and OR mix.\n\nWith timestamps stored as text (`'2025-03-01 14:00:00'`), prefer half-open ranges: `ts >= '2025-03-01' AND ts < '2025-04-01'`. `BETWEEN '2025-03-01' AND '2025-03-31'` misses everything after midnight on the 31st, because `'2025-03-31 09:00:00'` sorts after `'2025-03-31'`.\n\n## NULL and three-valued logic\nNULL means \"unknown\", and any comparison with an unknown is itself UNKNOWN, not TRUE or FALSE. WHERE discards both FALSE and UNKNOWN rows.\n\n| expression | value when x is NULL | row kept by WHERE?\n| `x = 1` | UNKNOWN | no\n| `x <> 1` | UNKNOWN | no\n| `x = NULL` | UNKNOWN, always | no, even for NULL rows\n| `x IS NULL` | TRUE | yes\n| `NOT (x = 1)` | UNKNOWN | no\n| `x <> 1 OR x IS NULL` | TRUE | yes\n\nThe practical rules:\n- Test for missing values with `IS NULL` / `IS NOT NULL`, never `= NULL`.\n- A filter like `label <> 'spam'` drops unlabelled rows as well. If you meant \"not known to be spam\", write `label IS NOT 'spam'` in SQLite or `label IS DISTINCT FROM 'spam'` in PostgreSQL (and in SQLite since version 3.39).\n- `COALESCE(x, default)` substitutes a value for NULL. It
