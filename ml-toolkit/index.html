 cheap uncertainty estimate.\n\n> Takeaway: write functions for one example and let `vmap` add batch axes. Use `in_axes` to say what is shared and what is mapped, nest it for multiple axes, and combine it with `grad` for per-example gradients, keeping an eye on the memory that a batch of gradients costs.","q":"For DP-SGD you compute `jax.vmap(jax.grad(loss), in_axes=(None, 0, 0))(params, X, Y)` on a 350M-parameter model with batch 256 in float32, and the step runs out of memory on an 80 GB GPU even though a normal training step at batch 256 fits easily. Explain the memory difference and give two ways to make it fit while keeping exact per-example clipping.","s":"A normal step reduces over the batch inside the backward pass, so it only ever holds one gradient pytree (350M floats, about 1.4 GB) plus activations. The vmapped version materialises one gradient per example: 256 x 1.4 GB is about 358 GB, far beyond 80 GB, before counting activations. Clipping only needs each example's norm and the clipped sum, so the full per-example tensor never has to exist at once. First option: split the batch into micro-batches of, say, 16 and loop over them with `lax.scan` (or `lax.map`), computing per-example gradients for 16 examples (about 22 GB), clipping them, and adding their sum into a running accumulator in the scan carry; at the end divide by 256 and add noise. Second option: a two-pass approach, computing per-example gradient norms cheaply (for dense layers the norm of an outer-product gradient factorises into norms of activations and output gradients, the 'ghost clipping' trick) and then running one ordinary backward pass on a loss reweighted by each example's clip factor, which gives the clipped sum with a single gradient-sized buffer. Reducing precision or using `jax.checkpoint` addresses activations, not the per-example gradient buffer, so they do not fix this on their own.","r":[["JAX docs: Transformations: grad and vmap","https://docs.jax.dev/en/latest/101/transformations.html","vmap, in_axes and out_axes, with the manual-batching comparison."],["JAX docs: The autodiff cookbook","https://docs.jax.dev/en/latest/301/cookbook.html","Per-example gradients by composing vmap and grad, and how jacfwd and jacrev use vmap."],["JAX API: jax.vmap","https://docs.jax.dev/en/latest/_autosummary/jax.vmap.html","The full signature, including axis_name, axis_size and pytree in_axes."]],"k":["vmap","batching","per-example gradients"],"x":["JAX"],"p":["per-example-gradient-clipping","batched-attention-with-vmap","model-ensemble-with-in-axes","pairwise-distances-with-nested-vmap"],"ak":""},{"id":"05.05","t":"Pytrees and optimisers","n":["A **pytree** is any nesting of lists, tuples, dicts, `None` and registered classes, with arrays (or other non-container objects) as leaves. Every JAX transformation accepts and returns pytrees, which is how a model with hundreds of parameter arrays passes through `grad`, `jit` and `vmap`.","`jax.tree.map(f, tree, *rest)` applies `f` leaf by leaf and rebuilds the same structure. With several trees, they must have the same structure, and `f` receives the matching leaves together.","A model's parameters, its gradients and each slot of optimiser state are pytrees of the same structure, so an optimiser update is a handful of `tree.map` calls.","Adam is a pure function `(grads, state) -> (updates, new_state)` with `m`, `v` and a step count in the state. Optax packages exactly this interface as `GradientTransformation(init, update)` and lets you `chain` clipping, weight decay and scheduling.","`None` is an empty subtree, not a leaf, and custom classes must be registered (for example with `jax.tree_util.register_dataclass`) before transformations can see inside them."],"a":"## Containers all the way down\nIn PyTorch, parameters live inside `nn.Module` objects and the optimiser holds references to them (lessons 04.03 and 04.04). JAX has no module system in the core library. Parameters are plain data, usually nested dicts of arrays, and functions take them as arguments:\n\n```python\nparams = {\n    \"embed\": {\"table\": jnp.zeros((V, D))},\n    \"layers\": [{\"w\": jnp.zeros((D, D)), \"b\": jnp.zeros(D)} for _ in range(4)],\n    \"head\": {\"w\": jnp.zeros((D, V))},\n}\n```\n\nJAX calls such a structure a pytree. Lists, tuples, dicts, `namedtuple`s and `None` are built-in **nodes**; everything else, typically arrays and scalars, is a **leaf**. Transformations flatten a pytree into a list of leaves plus a description of the structure (a `PyTreeDef`), work on the leaves, and unflatten the result. That is why `jax.grad(loss)(params, batch)` returns a gradient with exactly the keys and nesting of `params`.\n\n%%flow What every transformation does with a pytree argument.\nparams tree -(flatten)-> leaves + treedef -(transform each leaf)-> *new leaves -(unflatten)-> tree of same shape\n%%\n\n## The tree utilities\n```python\njax.tree.leaves(params)            # list of arrays, in a fixed order\njax.tree.structure(params)         # PyTreeDef, comparable with ==\njax.tree.map(jnp.zeros_like, params)                 # same structure, zero leaves\njax.tree.map(lambda p, g: p - 0.1 * g, params, grads)  # two trees, leaf by leaf\nn_params = sum(x.size for x in jax.tree.leaves(params))\n```\n\nThe `jax.tree` namespace is the modern spelling of the older `jax.tree_util.tree_map`, `tree_leaves` and so on, which still work. `jax.tree_util.tree_flatten_with_path` and `tree_map_with_path` also hand you each leaf's key path, which is how you build masks such as \"no weight decay on biases or norm scales\".\n\nDict leaves are ordered by sorted key, not insertion order, so the leaf order is deterministic. Multi-tree `map` requires identical structures: passing a `params` tree and an optimiser-state tree that has an extra `None` somewhere fails with a structure-mismatch error, which is a useful check rather than a nuisance.\n\n| object | node or leaf | note\n| `dict`, `list`, `tuple`, `namedtuple` | node | dict children ordered by sorted key\n| `None` | node with no children | contributes zero leaves\n| `jax.Array`, NumPy array, Python scalar | leaf | the usual case\n| your own class | leaf, unless registered | register with `register_dataclass` or `register_pytree_node`\n\nA custom class that is not registered is treated as a single opaque leaf, so `tree.map` passes the whole object to your function and `jit` refuses it as an argument. Libraries such as Flax and Equinox register their module classes so they behave as pytrees.\n\n## An optimiser is a pure function over trees\nSGD with momentum keeps a velocity tree of the same structure as the parameters:\n\n```python\ndef sgd_momentum(params, grads, vel, lr=0.1, beta=0.9):\n    vel = jax.tree.map(lambda v, g: beta * v + g, vel, grads)\n    params = jax.tree.map(lambda p, v: p - lr * v, params, vel)\n    return params, vel\n```\n\nAdam needs two moment trees and a step counter. Written in the update-returning style that Optax uses:\n\n```python\ndef adam_init(params):\n    zeros = jax.tree.map(jnp.zeros_like, params)\n    return {\"m\": zeros, \"v\": zeros, \"t\": jnp.zeros((), jnp.int32)}\n\ndef adam_update(grads, state, lr=1e-3, b1=0.9, b2=0.999, eps=1e-8):\n    t = state[\"t\"] + 1\n    m = jax.tree.map(lambda m, g: b1 * m + (1 - b1) * g, state[\"m\"], grads)\n    v = jax.tree.map(lambda v, g: b2 * v + (1 - b2) * g * g, state[\"v\"], grads)\n    mhat_c, vhat_c = 1 - b1 ** t, 1 - b2 ** t          # bias corrections\n    updates = jax.tree.map(lambda m, v: -lr * (m / mhat_c) / (jnp.sqrt(v / vhat_c) + eps), m, v)\n    return updates, {\"m\": m, \"v\": v, \"t\": t}\n\nupdates, opt_state = adam_update(grads, opt_state)\nparams = jax.tree.map(lambda p, u: p + u, params, updates)\n```\n\nAdamW adds decoupled weight decay, `-lr * wd * p`, to each update, normally masked so that biases and normalisation parameters are excluded. Global-norm clipping, $g \\leftarrow g \\cdot \\min(1, c / \\|g\\|)$ with $\\|g\\| = \\sqrt{\\sum_\\ell \\|g_\\ell\\|^2}$ over all leaves, is one `tree.leaves` reduction and one `tree.map`. Because everything is a pure function of arrays, the whole training step, including the optimiser, can sit inside one `jit`.\n\n## Optax\nOptax is the standard optimiser library for JAX and follows exactly this design. An optimiser is a `GradientTransformation` with `init(params) -> state` and `update(grads, state, params) -> (updates, state)`, and `optax.apply_updates(params, updates)` adds them. Transformations compose:\n\n```python\nimport optax\ntx = optax.chain(\n    optax.clip_by_global_norm(1.0),\n    optax.adamw(learning_rate=optax.warmup_cosine_decay_schedule(0.0, 3e-4, 1_000, 100_000)),\n)\nopt_state = tx.init(params)\nupdates, opt_state = tx.update(grads, opt_state, params)\nparams = optax.apply_updates(params, updates)\n```\n\nWriting Adam yourself once is worth it to understand the state, but in real code use Optax: its implementations handle dtype details, masks and schedules consistently.\n\n! Example: a float in the parameter tree\n! A weight-decay mask is built as `jax.tree.map(lambda x: x.ndim > 1, params)`, so matrices are decayed and vectors (biases, norm scales) are not.\n! Later someone stores a layer's dropout rate as a Python float inside `params`. It becomes a leaf, `x.ndim` fails on a float, and worse, `grad` now tries to differentiate with respect to it.\n! Keep non-trainable configuration out of the parameter tree (pass it as a static argument or close over it), and build masks from key paths with `tree_map_with_path` so the intent (\"decay everything except names ending in `b` or `scale`\") is explicit.\n\n> Takeaway: in JAX a model is a pytree of arrays and an optimiser is a pure function from gradient and state trees to update and state trees. Learn `jax.tree.map`, keep the structures aligned, and let Optax supply the production versions.","q":"Your training state is `(params, opt_state)` and you checkpoint it by flattening with `jax.tree.leaves` and saving the list of arrays. After a refactor that renamed `'mlp'` to `'ffn'` in the parameter dict, restoring the checkpoint with `jax.tree.unflatten(treedef, leaves)` succeeds, but the loss starts much higher than when you saved. What happened, and how should the checkpoint be stored instead?","s":"Dict leaves are flattened in sorted key order, so renaming `'mlp'` to `'ffn'` moves that subtree to a different position in the flattened list (for instance from after `'ln'` to before it). The saved list is still in the old order. If several subtrees have the same structure and leaf shapes (for example the MLP weights and another block with matching shapes), unflattening the old list into the new treedef assigns arrays to the wrong parameters without any shape error, and the Adam moments get scrambled in the same way. The model then starts from a partly permuted set of weights, so the loss jumps. A positional list of leaves is not a safe checkpoint format. Store leaves keyed by their path, for example from `jax.tree_util.tree_flatten_with_path`, or use a checkpointing library such as Orbax that saves the tree structure with names, then restore by name and fail loudly on any key that is missing or unexpected. A rename should be handled by an explicit key mapping during restore.","r":[["JAX docs: Pytrees","https://docs.jax.dev/en/latest/101/pytrees.html","What counts as a node or leaf, tree.map over several trees, key paths and custom registration."],["Optax documentation","https://optax.readthedocs.io/en/latest/","GradientTransformation, chain, schedules, and reference implementations of Adam and AdamW."],["JAX API: jax.tree module","https://docs.jax.dev/en/latest/jax.tree.html","The jax.tree functions (map, leaves, structure, flatten, unflatten)."]],"k":["pytrees","optimisers","Optax"],"x":["JAX","Optax"],"p":["sgd-with-momentum-over-pytree","adamw","global-norm-gradient-clipping","gradient-accumulation-with-scan"],"ak":""},{"id":"05.06","t":"Randomness and numerics","n":["JAX has no global random state. Every random function takes an explicit **key**, the same key always gives the same numbers, and you make new keys with `jax.random.split` (or `fold_in`) rather than reusing one.","`jax.random.key(seed)` returns a typed key array (dtype `key<fry>`); the older `jax.random.PRNGKey(seed)` returns a raw `uint32[2]` array. Both work with every `jax.random` function, but new code should use typed keys.","Arrays are float32 by default and float64 requests are silently downcast unless `jax_enable_x64` is set at startup. On TPUs (and with TF32 on recent NVIDIA GPUs) float32 matmuls may use reduced-precision passes by default; request higher precision when it matters.","On GPU, JAX preallocates most of device memory at startup. Inside a training step, buffer **donation** (`donate_argnums`) lets XLA write the new parameters and optimiser state into the old ones' memory, roughly halving the step's peak for that state.","`jax.checkpoint` (remat) trades compute for activation memory by recomputing intermediates in the backward pass, and `jax_debug_nans` finds the first operation that produced a NaN."],"a":"## Why keys are explicit\nNumPy and PyTorch keep a hidden global generator that every call advances. That is impure: the result of a function depends on how many random calls happened before it, which breaks `jit` caching, makes `vmap` ambiguous (should every example get the same sample?) and makes parallel execution order-dependent. JAX replaces the hidden state with a value you pass around:\n\n```python\nimport jax, jax.numpy as jnp\n\nkey = jax.random.key(0)                 # typed key, dtype key<fry>\nkey, k_init, k_drop = jax.random.split(key, 3)\nw = jax.random.normal(k_init, (784, 256)) * 0.02\nmask = jax.random.bernoulli(k_drop, 0.9, (32, 256))\n```\n\nA key is consumed by the function you give it to. Calling `jax.random.normal(k, ...)` twice with the same `k` returns identical arrays, so reuse produces correlated \"random\" numbers without any error. The discipline is: split before each use, keep one key as the carry for later, and never pass the same key to two consumers.\n\n%%flow Splitting a root key into independent streams.\nkey(0) -(split)-> *carry key -(split)-> next carry + step key\nkey(0) -(split)-> init key -(split per layer)-> layer keys\nkey(0) -(split)-> data key -(fold_in step)-> per-step shuffle key\n%%\n\n`jax.random.fold_in(key, i)` derives a new key from a key and an integer, which is handy for per-step or per-device keys without carrying state: `step_key = jax.random.fold_in(base_key, step)`. The default generator is counter-based Threefry, so splitting is cheap and results are reproducible across devices. Alternative implementations (such as `\"rbg\"`) can be selected for speed on TPU through the `jax_default_prng_impl` option, at the cost of different streams.\n\n## Keys under jit and vmap\nKeys are ordinary arguments, so a jitted function takes a key and returns a new one if it needs to keep drawing. Under `vmap`, give each example its own key by splitting into a batch: `keys = jax.random.split(key, B)` returns a key array of shape `(B,)`, and `jax.vmap(f)(keys, xs)` gives each example independent noise. Passing one unbatched key with `in_axes=None` gives every example the same noise, which is occasionally what you want (the same augmentation for an ensemble) and usually a bug.\n\nTyped keys (`jax.random.key`) carry their implementation in the dtype and refuse arithmetic, so mistakes like adding a key to an array fail loudly. Legacy keys from `jax.random.PRNGKey` are plain `uint32` arrays of shape `(2,)`, which is why old code batches them with a trailing axis of 2. Convert with `jax.random.wrap_key_data` and `jax.random.key_data` when you meet old checkpoints.\n\n## Precision\n| setting | default | how to change\n| float dtype | float32 | `jax.config.update(\"jax_enable_x64\", True)` before creating arrays, or `JAX_ENABLE_X64=1`\n| integer dtype | int32 | same flag\n| float32 matmul on TPU | reduced-precision passes | `precision=jax.lax.Precision.HIGHEST`, or `with jax.default_matmul_precision(\"float32\"):`\n| Python scalars | weakly typed | `bf16_array * 2.0` stays bfloat16\n\nWithout x64 mode, `jnp.array(1.0, dtype=jnp.float64)` gives float32 with only a warning, so scientific code that needs double precision must enable the flag at program start. Mixed dtypes promote along JAX's type lattice; `bfloat16 + float16` gives float32, and a float32 array mixed into a bfloat16 model upcasts everything downstream, just as in PyTorch.\n\nThe matmul default matters in practice. On TPUs, a float32 `jnp.dot` by default uses bfloat16 multiplication passes, which is fast and usually fine for training, but can make a numerical test against NumPy fail at the third or fourth significant digit. Set the precision per call or with the context manager when you need full float32 accuracy. The same `jnp.dot` takes `preferred_element_type` to choose the accumulator: an int8 quantised matmul written as `jnp.dot(a_q, w_q, preferred_element_type=jnp.int32)` accumulates in int32, and you then multiply by the per-channel scales in float32.\n\nMixed-precision training in JAX is explicit: keep float32 master parameters, cast them to bfloat16 inside the forward pass, and compute the loss and the optimiser update in float32. bfloat16 has float32's exponent range and needs no loss scaling. float16 does: multiply the loss by a scale $S$ before differentiating, divide the gradients by $S$, skip the step and lower $S$ if any gradient is non-finite, and raise $S$ after a run of clean steps.\n\n## Memory and donation\nOn GPUs, JAX preallocates a large fraction of device memory (75% by default) the first time it runs, to avoid fragmentation. This surprises people sharing a GPU or running a PyTorch process alongside. `XLA_PYTHON_CLIENT_PREALLOCATE=false` allocates on demand and `XLA_CLIENT_MEM_FRACTION=0.5` (older name `XLA_PYTHON_CLIENT_MEM_FRACTION`) changes the fraction; both must be set before JAX initialises.\n\nBecause arrays are immutable, a training step `state = step(state, batch)` would normally hold the old state and the new state at the same time. For a large model with Adam, the state is parameters plus two moment trees, so this doubles the biggest allocation in the program. Donation tells XLA it may reuse the input buffers for outputs:\n\n```python\nfrom functools import partial\n\n@partial(jax.jit, donate_argnums=(0,))\ndef train_step(state, batch):\n    ...\n    return new_state, metrics\n\nstate, metrics = train_step(state, batch)   # old state buffers are reused\n```\n\nAfter the call, the donated arrays are deleted, and touching the old `state` raises `RuntimeError: Array has been deleted`. Only donate arguments you rebind immediately, and keep a separate copy if you need the old values (for an EMA or a rollback). If a backend cannot use a donation, JAX warns and carries on.\n\nActivations are the other big consumer. `jax.checkpoint` (alias `jax.remat`) wraps a function so its intermediates are not saved for the backward pass and are recomputed instead; applied to each block of a transformer inside a `lax.scan` over layers, it cuts activation memory to roughly one block's worth plus the block inputs, at about one extra forward pass of compute.\n\n! Example: dropout that was not random\n! A jitted training step takes `key` as an argument and uses it for dropout, but the loop calls `train_step(params, batch, key)` with the same `key` every step. Training works, yet the model overfits as if dropout were a fixed mask.\n! It is a fixed mask: the same key produces the same Bernoulli draws every step, so the same units are dropped forever. Inside the loop, write `key, step_key = jax.random.split(key)` and pass `step_key`, or derive `jax.random.fold_in(base_key, step)` inside the step.\n! A quick test for any stochastic function is to call it twice with different keys and assert the outputs differ, and twice with the same key and assert they match.\n\n> Takeaway: treat random keys like any other data and split them before every use, know which precision your hardware gives you by default, and use donation and rematerialisation to keep immutable arrays from doubling your memory.","q":"A colleague's data-augmentation function is `vmap`ped over the batch as `jax.vmap(augment, in_axes=(None, 0))(key, images)` and the key is split once per step. They report that augmentations look random across steps but the model ignores them. What is going on, and what is the correct call?","s":"With `in_axes=None` the key is broadcast, so every image in the batch receives the same random crop, flip and colour jitter within a step. Across steps the key changes, so the augmentation looks random when you inspect one image over time, but within a batch all examples are transformed identically. That greatly reduces the diversity of augmentations per gradient step (and with batch-level statistics such as batch norm, an identical transform is partly normalised away). The fix is to give each example its own key: `keys = jax.random.split(step_key, images.shape[0])` and `jax.vmap(augment)(keys, images)`, with `in_axes=0` for both. A useful check is to augment a batch made of one image repeated B times and confirm that the outputs differ.","r":[["JAX docs: Pseudorandom numbers","https://docs.jax.dev/en/latest/101/random.html","Explicit keys, split and fold_in, and why JAX avoids global random state."],["JAX docs: Common gotchas in JAX","https://docs.jax.dev/en/latest/notebooks/Common_Gotchas_in_JAX.html","Random numbers, double (64-bit) precision and debugging NaNs."],["JAX docs: GPU memory allocation","https://docs.jax.dev/en/latest/201/gpu-memory.html","Preallocation and the XLA_PYTHON_CLIENT_* environment variables."],["JAX docs: Just-in-time compilation (buffer donation section)","https://docs.jax.dev/en/latest/201/jit.html","How donate_argnums works and when donated buffers cannot be reused."]],"k":["PRNG keys","precision","memory"],"x":["JAX"],"p":["prng-key-splitting","mixed-precision-with-loss-scaling","rematerialized-mlp-block","int8-matmul-with-per-channel-scales"],"ak":""},{"id":"05.07","t":"Sharding and parallelism","n":["JAX scales out with one program and many devices (SPMD). A **mesh** arranges the devices in a named grid, a `PartitionSpec` says which mesh axis splits each array dimension, and `NamedSharding(mesh, spec)` combines the two into a layout for a `jax.Array`.","With `jax.jit`, computation follows data: give the inputs shardings and the compiler propagates layouts through the program and inserts the collectives (all-reduce, all-gather, reduce-scatter) that the math requires.","Data parallelism shards the batch and replicates parameters; FSDP also shards parameters and optimiser state over the data axis; tensor (model) parallelism shards the weight matrices themselves, as in the Megatron MLP.","`jax.shard_map` drops to a per-device view: you write code for one shard and call collectives such as `lax.psum`, `lax.all_gather` and `lax.ppermute` yourself, which is the tool for hand-tuned communication.","`jax.pmap` is the legacy API (one device per index of a leading axis); new code should use `jit` with shardings or `shard_map`."],"a":"## From one device to a mesh\nEverything so far ran on one device. Lesson 4's `vmap` adds a batch axis; this lesson splits arrays across devices. PyTorch typically does this by launching one process per GPU and wrapping the model in DDP or FSDP. JAX instead treats the whole set of devices as a single machine: you write one program over global arrays, attach a sharding to them, and the compiler produces the per-device program. On multi-host clusters each host runs the same script after `jax.distributed.initialize()`, and `jax.devices()` lists every device in the job.\n\nA mesh gives the devices a logical shape with axis names:\n\n```python\nimport jax, jax.numpy as jnp\nfrom jax.sharding import NamedSharding, PartitionSpec as P, AxisType\n\nmesh = jax.make_mesh((4, 2), (\"data\", \"model\"),\n                     axis_types=(AxisType.Auto, AxisType.Auto))\nx = jax.device_put(jnp.ones((64, 512)), NamedSharding(mesh, P(\"data\", None)))\nx.addressable_shards[0].data.shape     # (16, 512): rows split 4 ways, replicated over \"model\"\njax.debug.visualize_array_sharding(x)  # prints which device holds which block\n```\n\n`jax.make_mesh` picks a device order that matches the hardware topology, so the axis you communicate over most should be the one with the fastest links. Current JAX also has an *explicit* sharding mode, where shardings are part of an array's type and ambiguous layouts are errors instead of compiler decisions, and `make_mesh` now makes every axis `AxisType.Explicit` by default; the `axis_types` argument above requests the automatic mode this lesson describes (older releases had only automatic mode and no `axis_types` argument). To experiment without accelerators, set `XLA_FLAGS=--xla_force_host_platform_device_count=8` before importing JAX to get eight CPU devices.\n\n## PartitionSpec\nA `PartitionSpec` has one entry per array dimension: a mesh axis name to split that dimension over, a tuple of names to split over several axes, or `None` to keep the dimension whole. Mesh axes not mentioned mean replication over them. For an array of shape `(B, D)` on the 4 x 2 mesh:\n\n| spec | each device holds | used for\n| `P()` | the whole array | replicated parameters in plain data parallelism\n| `P(\"data\", None)` | `(B/4, D)`, same on both \"model\" devices | a batch of activations\n| `P(None, \"model\")` | `(B, D/2)` | column-parallel weights\n| `P(\"data\", \"model\")` | `(B/4, D/2)` | 2-D sharded activations\n| `P((\"data\", \"model\"), None)` | `(B/8, D)` | batch over all eight devices\n\nEach split dimension must be divisible by the product of the mesh axes that split it.\n\n## Automatic partitioning with jit\nPass sharded arrays to a jitted function and XLA's partitioner works out the rest:\n\n```python\nw1 = jax.device_put(w1, NamedSharding(mesh, P(None, \"model\")))   # (512, 2048)\nw2 = jax.device_put(w2, NamedSharding(mesh, P(\"model\", None)))   # (2048, 512)\n\n@jax.jit\ndef mlp(x, w1, w2):\n    h = jax.nn.relu(x @ w1)      # (B, 2048) sharded P(\"data\", \"model\"): no communication\n    return h @ w2                # contracts the sharded axis: XLA inserts an all-reduce\n```\n\nThis is Megatron-style tensor parallelism: the first matmul is split by columns, the second by rows, and the only communication is one all-reduce over `\"model\"` at the end of the block. You can pin layouts with `jax.jit(..., in_shardings=..., out_shardings=...)` and constrain an intermediate with `jax.lax.with_sharding_constraint(h, sharding)` when the compiler's choice is not the one you want.\n\n%%flow Tensor-parallel MLP on the \"model\" axis: where data moves.\nx replicated over model -(x @ w1 column shards)-> h split by columns -(relu, local)-> h @ w2 row shards -> *partial sums -(all-reduce over model)-> y\n%%\n\n## The parallelism strategies\n- **Data parallel**: batch `P(\"data\")`, parameters `P()`. Each device computes gradients on its slice and the gradient of the mean loss needs an all-reduce, which the compiler inserts. Memory per device is the full model plus optimiser state.\n- **FSDP / ZeRO-3**: parameters and optimiser state also sharded over `\"data\"`, for example `P(\"data\", None)` on each weight. The compiler all-gathers weights just before they are used and reduce-scatters gradients, so per-device state memory drops by the axis size.\n- **Tensor parallel**: weights sharded over `\"model\"` as above, usually within a node where links are fastest, with activations communicated inside each layer.\n- **Combinations**: a 2-D mesh with `(\"data\", \"model\")` axes runs FSDP or data parallelism across one axis and tensor parallelism across the other. Pipeline parallelism splits layers into stages and is built by hand or by libraries on top of these primitives.\n\n## shard_map: write the per-device program\nSometimes you want control over exactly which collectives run, for instance to overlap communication with compute or implement a ring algorithm. `jax.shard_map` (formerly `jax.experimental.shard_map.shard_map`) maps a function over the shards: inside, arrays have their local block shapes and you call collectives by mesh axis name.\n\n```python\ndef mlp_local(x, w1, w2):                 # x: (B/4, 512), w1: (512, 1024), w2: (1024, 512)\n    h = jax.nn.relu(x @ w1)\n    return jax.lax.psum(h @ w2, \"model\")  # sum the partial products over \"model\"\n\nmlp_tp = jax.jit(jax.shard_map(\n    mlp_local, mesh=mesh,\n    in_specs=(P(\"data\", None), P(None, \"model\"), P(\"model\", None)),\n    out_specs=P(\"data\", None)))\n```\n\nThe collectives available inside are `psum`, `pmean`, `all_gather`, `psum_scatter` (reduce-scatter), `all_to_all`, and `ppermute`, which sends each shard to another device along a permutation and is the building block of ring all-reduce and ring attention. If you differentiate code inside `shard_map`, check against an unsharded reference: recent versions track which values are replicated and insert the gradient reduction for replicated parameters themselves, so adding your own `psum` on top would multiply gradients by the axis size.\n\n## pmap is legacy\n`jax.pmap` was JAX's original multi-device API: it maps a function over the leading axis of its inputs, one index per device, with collectives named by `axis_name`. It ties array layout to that leading axis, compiles per-device programs separately, and composes poorly with sharded `jit` code. The JAX team now treats it as legacy; use `jit` with `NamedSharding` for most work and `shard_map` where you need explicit per-device code. Old `pmap` code usually translates directly to `shard_map` with a one-dimensional mesh.\n\n! Example: why a 7B model does not fit with plain data parallelism\n! Training a 7-billion-parameter model with Adam on 8 GPUs of 80 GB: bfloat16 parameters take 14 GB, float32 master weights 28 GB and the two Adam moments 56 GB, about 98 GB per replica before activations. With parameters replicated (`P()`), every GPU needs all of it, so it does not fit.\n! Shard parameters and optimiser state over an 8-way `\"data\"` axis (FSDP) and each device holds about 12 GB of state, leaving most of the memory for activations. The cost is an all-gather of each layer's weights in the forward and backward passes and a reduce-scatter of gradients, which the compiler can overlap with compute.\n\n> Takeaway: describe where data lives with a mesh and PartitionSpecs, let `jit` derive the communication for data, FSDP and tensor parallelism, use `shard_map` when you need to write the collectives yourself, and leave `pmap` to old code.","q":"You have 16 GPUs as 2 nodes of 8 with fast NVLink inside a node and slower networking between nodes. You want tensor parallelism plus data parallelism for a model whose layers are too large for one GPU's memory with optimiser state. Propose a mesh shape and axis order, the PartitionSpecs for a dense layer's weight `(d_in, d_out)`, the activations `(B, T, d)` and the batch, and say which collectives cross nodes.","s":"Use a mesh of shape `(2, 8)` with axes `('data', 'model')`, ordered so that the 8 devices of one node form the `'model'` axis; `jax.make_mesh` tries to match axes to the physical topology, but you should check that each `'model'` group is one node by inspecting `mesh.devices`. Tensor parallelism communicates inside every layer, so it belongs on the fast NVLink axis, while data parallelism communicates once per step for gradients, so it can cross the slower inter-node link. For a column-parallel layer the weight is `P(None, 'model')` and for the following row-parallel layer `P('model', None)`; to also reduce optimiser-state memory, add FSDP on the other dimension, for example `P('data', 'model')`, at the cost of all-gathers across nodes. The batch is `P('data', None)` for token ids `(B, T)`, and activations `(B, T, d)` are `P('data', None, None)` between blocks and `P('data', None, 'model')` inside the MLP. Communication over `'model'` (the all-reduce after each row-parallel matmul) stays inside a node. Only the gradient all-reduce over `'data'` (or, with FSDP, the weight all-gathers and gradient reduce-scatters) crosses nodes, and XLA can overlap it with the backward pass.","r":[["JAX docs: Distributed arrays and automatic parallelization","https://docs.jax.dev/en/latest/parallel.html","Meshes, NamedSharding, automatic partitioning with jit and an introduction to shard_map."],["JAX docs: Manual parallelism with shard_map","https://docs.jax.dev/en/latest/201/shard-map.html","Per-device programs, collectives and worked tensor-parallel examples."],["How to Scale Your Model (the scaling book)","https://jax-ml.github.io/scaling-book/","Cost models for data, FSDP and tensor parallelism and the collectives each one needs."]],"k":["sharding","parallelism","shard_map"],"x":["JAX","XLA"],"p":["device-mesh-and-named-sharding","data-parallel-step-with-psum","tensor-parallel-mlp","ring-all-reduce-with-ppermute"],"ak":""}]}];

function inl(s){
  const math = []; s = String(s).replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => { math.push(m); return `\u0000${math.length - 1}\u0000`; });

  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => esc(math[+i]));
}

function dayCounts(){
  const c = {};
  Object.entries(st.at).forEach(([k, t]) => { if (st.done[k] && t) { const d = dk(t); c[d] = (c[d] || 0) + 1; } });
  Object.entries(st.act).forEach(([d, n]) => c[d] = (c[d] || 0) + (n || 0));

function streak(c = dayCounts()){
  let d = today(); if (!c[d]) d = addDays(d, -1); let n = 0;
  while (c[d]) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(c = dayCounts()){
  let best = 0; Object.keys(c).forEach(d => { if (c[addDays(d, -1)]) return; let n = 0, x = d; while (c[x]) { n++; x = addDays(x, 1); } best = Math.max(best, n); });

}

WG.lru = el => {
  el.innerHTML = '<div class="wg-c"><label class="wg-s"><span>Policy</span><select data-id="p"><option value="LRU">LRU</option><option value="LFU">LFU</option><option value="FIFO">FIFO</option></select></label><label class="wg-s"><span>Capacity <output>3</output></span><input type="range" min="2" max="6" value="3" data-id="c"></label></div><div class="lru-keys" role="group" aria-label="Request a key">' + 'ABCDEF'.split('').map(k => `<button type="button" class="btn ghost sm" data-k="${k}">${k}</button>`).join('') + '</div><div class="wg-btns"><button type="button" class="btn ghost sm" data-a="hot">30 skewed requests</button><button type="button" class="btn ghost sm" data-a="scan">One-off scan (G to N)</button><button type="button" class="btn ghost sm" data-a="reset">Reset</button></div><div class="wg-o"></div>';
  let S, hits, miss, last; const R = rng(3);
  const reset = () => { S = []; hits = 0; miss = 0; last = 'Request keys and watch what gets evicted.'; };
  const pol = () => el.querySelector('[data-id="p"]').value, cap = () => +el.querySelector('[data-id="c"]').value;
  const victim = () => { const p = pol(); if (p === 'FIFO') return S.reduce((a, b) => a.ins < b.ins ? a : b); if (p === 'LRU') return S.reduce((a, b) => a.used < b.used ? a : b); return S.reduce((a, b) => (a.n < b.n || (a.n === b.n && a.used < b.used)) ? a : b); };
  let clock = 0;
  const req = (k, quiet) => { clock++; const e = S.find(x => x.k === k);
    if (e){ e.used = clock; e.n++; hits++; if (!quiet) last = `<b>${k}</b>: hit`; return; }
    miss++; let ev = ''; while (S.length >= cap()){ const v = victim(); S = S.filter(x => x !== v); ev = v.k; }
    S.push({k, ins: clock, used: clock, n: 1}); if (!quiet) last = `<b>${k}</b>: miss${ev ? `, evicted <b>${ev}</b>` : ''}`; };
  const draw = () => { el.querySelector('output').textContent = cap(); while (S.length > cap()){ const v = victim(); S = S.filter(x => x !== v); }
    const v = S.length >= cap() ? victim() : null, p = pol();
    const ord = [...S].sort((a, b) => p === 'FIFO' ? b.ins - a.ins : p === 'LRU' ? b.used - a.used : (b.n - a.n) || (b.used - a.used));
    el.querySelector('.wg-o').innerHTML = stats([['Hit rate', hits + miss ? pct(hits / (hits + miss), 0) : '–', `${hits} hits, ${miss} misses`]]) +
      `<div class="lru-row" aria-label="Cache contents">${[...Array(cap())].map((_, i) => { const e = ord[i]; return e ? `<div class="slot${e === v ? ' ev' : ''}"><b>${e.k}</b><small>${p === 'LFU' ? e.n + '× used' : p === 'LRU' ? 'used t' + e.used : 'in at t' + e.ins}</small>${e === v ? '<em>evicted next</em>' : ''}</div>` : '<div class="slot empty">empty</div>'; }).join('')}</div><p class="bf-msg" aria-live="polite">${last}</p>`; };
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k) req(b.dataset.k);
    else if (b.dataset.a === 'hot'){ for (let i = 0; i < 30; i++){ const r = R(); req(r < .45 ? 'A' : r < .7 ? 'B' : r < .85 ? 'C' : 'DEF'[Math.floor(R() * 3)], true); } last = 'Ran 30 requests where A, B and C are popular.'; }
    else if (b.dataset.a === 'scan'){ 'GHIJKLMN'.split('').forEach(k => req(k, true)); last = 'A one-off scan of G to N. Under LRU it flushes the popular keys; LFU keeps them.'; }
    else if (b.dataset.a === 'reset') reset();
    else return; draw(); });
  el.querySelector('.wg-c').addEventListener('input', draw); reset(); draw();
};

WG.hll = el => {
  const NV = v => Math.round(Math.pow(10, v / 10));
  controls(el, [
    {id: 'p', label: 'Precision p (registers = 2ᵖ)', min: 4, max: 16, v: 14, f: v => `${v} → ${nf(Math.pow(2, v))}`},

  ], (V, out) => {
    const m = 1 << V.p, n = NV(V.n), reg = new Uint8Array(m), R = rng(V.p * 1000 + V.n);
    for (let i = 0; i < n; i++){ const h = (R() * 4294967296) >>> 0, idx = h >>> (32 - V.p), w = (h << V.p) >>> 0; const rho = w === 0 ? 33 - V.p : Math.clz32(w) + 1; if (rho > reg[idx]) reg[idx] = rho; }
    let s = 0, z = 0; for (let i = 0; i < m; i++){ s += Math.pow(2, -reg[i]); if (!reg[i]) z++; }
    const al = m === 16 ? 0.673 : m === 32 ? 0.697 : m === 64 ? 0.709 : 0.7213 / (1 + 1.079 / m); let E = al * m * m / s; if (E <= 2.5 * m && z) E = m * Math.log(m / z);
    const se = 1.04 / Math.sqrt(m), mem = m * 6 / 8, mf = b => b < 1024 ? nf(b) + ' B' : nf(b / 1024, b < 10240 ? 1 : 0) + ' KB';
    const T = 40, nt = Math.min(n, 20000), errs = [...Array(T)].map((_, t) => { const r = new Uint8Array(m), Rr = rng(t * 7919 + V.p); for (let i = 0; i < nt; i++){ const h = (Rr() * 4294967296) >>> 0, ix = h >>> (32 - V.p), w = (h << V.p) >>> 0, rho = w === 0 ? 33 - V.p : Math.clz32(w) + 1; if (rho > r[ix]) r[ix] = rho; }
      let s2 = 0, z2 = 0; for (let i = 0; i < m; i++){ s2 += Math.pow(2, -r[i]); if (!r[i]) z2++; } let e = al * m * m / s2; if (e <= 2.5 * m && z2) e = m * Math.log(m / z2); return (e - nt) / nt; });

      ${[-2 * se, -se, 0, se, 2 * se].filter(v => Math.abs(v) < lim).map(v => `<text x="${ml - 8}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v > 0 ? '+' : v < 0 ? '−' : ''}${pct(Math.abs(v), 1)}</text>`).join('')}
      ${[2 * se, -2 * se].map(v => `<line x1="${ml}" x2="${ml + pw}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--c1)" stroke-dasharray="4 4" opacity=".5"/>`).join('')}

WG.geohash = el => {

  const enc = (lat, lng, n) => { let s = ''; for (let i = 0; i < n; i++){ for (const ch of B32){ const b = box(s + ch); if (lat >= b.a[0] && lat < b.a[1] && lng >= b.o[0] && lng < b.o[1]){ s += ch; break; } } } return s; };

      g += `<g class="gh-c${hot ? ' hot' : ''}" data-c="${ch}" tabindex="0" role="button" aria-label="Zoom into ${h + ch}"><rect x="${x + 1}" y="${y + 1}" width="${cw - 2}" height="${chh - 2}" rx="4"/><text x="${x + cw / 2}" y="${y + chh / 2 + 5}" text-anchor="middle" font-size="${Math.min(15, cw / 2.4)}">${ch}</text></g>`; }

// ---------- notes markup ----------
function render(src){
  const lines = src.split('\n'); let out = '', i = 0;
  while (i < lines.length){
    const L = lines[i];
    if (!L.trim()){ i++; continue; }
    if (L.startsWith('### ')){ out += `<h3 class="h3">${inl(L.slice(4))}</h3>`; i++; continue; }
    if (L.startsWith('## ')){ out += `<h2>${inl(L.slice(3))}</h2>`; i++; continue; }
    if (L.startsWith('- ')){ out += '<ul>'; while (i < lines.length && lines[i].startsWith('- ')){ out += `<li>${inl(lines[i].slice(2))}</li>`; i++; } out += '</ul>'; continue; }
    if (/^%%(flow|seq|layers|widget|state|tree|timeline|compare|matrix|bars)\b/.test(L)){ const mm = L.match(/^%%(\w+)\s*(.*)$/), b = []; i++; while (i < lines.length && lines[i].trim() !== '%%'){ if (lines[i].trim()) b.push(mm[1] === 'tree' ? lines[i].replace(/\s+$/, '') : lines[i].trim()); i++; } i++; out += diagram(mm[1], mm[2], b); continue; }
    if (L.startsWith('```')){ const c=[]; i++; while (i < lines.length && !lines[i].startsWith('```')){ c.push(lines[i]); i++; } i++; out += `<pre class="code">${esc(c.join('\n'))}</pre>`; continue; }
    if (/^\d+\. /.test(L)){ out += '<ol>'; while (i < lines.length && /^\d+\. /.test(lines[i])){ out += `<li>${inl(lines[i].replace(/^\d+\. /,''))}</li>`; i++; } out += '</ol>'; continue; }
    if (L.startsWith('> ')){ out += `<div class="take"><div class="lab">Key takeaway</div><p>${inl(L.replace(/^> (Takeaway: )?/,''))}</p></div>`; i++; continue; }
    if (L.startsWith('! ')){ const b = []; while (i < lines.length && lines[i].startsWith('! ')){ b.push(lines[i].slice(2)); i++; }
      const t = b[0].replace(/^Example:\s*/,''); out += `<div class="ex"><div class="lab">Worked example</div><p><strong>${inl(t)}</strong></p>${b.slice(1).map(x => `<p>${inl(x)}</p>`).join('')}</div>`; continue; }
    if (L.startsWith('| ')){ out += '<div class="tbl"><table>'; while (i < lines.length && lines[i].startsWith('| ')){ out += '<tr>' + lines[i].slice(2).replace(/\s*\|\s*$/,'').split(' | ').map(c => `<td>${inl(c)}</td>`).join('') + '</tr>'; i++; } out += '</table></div>'; continue; }
    const p = []; while (i < lines.length && lines[i].trim() && !/^(## |### |- |> |! |\| |\d+\. |```|%%)/.test(lines[i])){ p.push(lines[i]); i++; }
    if (!p.length){ out += `<p>${inl(L)}</p>`; i++; continue; }
    out += `<p>${inl(p.join(' '))}</p>`;
  }
  return out;
}

function rate(v){
  const k = rq.shift(), before = xp(), r = st.rev[k] || {n: 0, box: 0};
  r.n = (r.n || 0) + 1; r.at = now();
  if (v === 1){ r.box = 0; r.due = today(); rq.push(k); }
  else if (v === 2){ r.box = Math.max(1, r.box || 0); r.due = addDays(today(), 1); }
  else { r.box = Math.min(5, (r.box || 0) + 1); r.due = addDays(today(), BOX[r.box]); }

}

// ---------- search palette ----------
let palSel = 0, palList = [];
function openPal(){ $('#pal').classList.add('on'); const i = $('#palin'); i.value = ''; palRender(); setTimeout(() => i.focus(), 10); }
function closePal(){ $('#pal').classList.remove('on'); }
function palRender(){
  const q = $('#palin').value.trim().toLowerCase();
  if (!q) palList = (nextUp() ? [nextUp()] : []).concat(ALL.filter(l => !isDone(l.id)).slice(1, 8));
  else { const t = [], b = []; ALL.forEach(l => { const ti = (l.t + ' ' + l.id).toLowerCase().includes(q); if (ti) t.push(l); else if ((l.a || '').toLowerCase().includes(q)) b.push(l); }); palList = t.concat(b).slice(0, 14); }
  palSel = Math.min(palSel, Math.max(0, palList.length - 1));
  $('#palres').innerHTML = palList.length ? palList.map((l, i) => { const m = DATA.find(x => x.n === l.mod);
    return `<a href="#l${key(l.id)}" class="${i===palSel?'on':''}" data-i="${i}"><span class="id">${l.id}</span><span class="tt"><b>${esc(l.t)}</b><span>${esc(m.name)}${isDone(l.id) ? ' · done' : ''}</span></span></a>`; }).join('')
    : '<div style="padding:18px;color:var(--muted)">No lessons match.</div>';
}
$('#palin').addEventListener('input', () => { palSel = 0; palRender(); });
$('#palin').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); palSel = (palSel + (e.key === 'ArrowDown' ? 1 : -1) + palList.length) % Math.max(1, palList.length); palRender(); document.querySelector('#palres a.on')?.scrollIntoView({block: 'nearest'}); }
  else if (e.key === 'Enter' && palList[palSel]){ location.hash = '#l' + key(palList[palSel].id); closePal(); }
  else if (e.key === 'Escape') closePal();
});
$('#pal').addEventListener('click', e => { if (e.target.id === 'pal' || e.target.closest('#palres a')) closePal(); });
$('#sbtn').onclick = openPal;
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#pal').classList.contains('on') ? closePal() : openPal(); return; }
  const tg = e.target.tagName; if (tg === 'TEXTAREA' || tg === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/'){ e.preventDefault(); openPal(); return; }
  if (e.key === 'Escape'){ closeSide(); closePal(); }
  if (cur.page === 'lesson'){
    const gi = ALL.findIndex(x => key(x.id) === cur.k);
    if (e.key === 'j' && ALL[gi+1]) location.hash = '#l' + key(ALL[gi+1].id);
    if (e.key === 'k' && ALL[gi-1]) location.hash = '#l' + key(ALL[gi-1].id);
    if (e.key === 'c') ($('#complete') || {click(){}}).click();
  }
  if (cur.page === 'review' && rq && rq.length){
    if (e.key === ' '){ e.preventDefault(); $('#flip')?.click(); }
    if (rflip && ['1','2','3'].includes(e.key)) rate(+e.key);

});

function toast(html, big){ const t = document.createElement('div'); t.className = 'toast' + (big ? ' big' : ''); t.innerHTML = html; $('#toasts').appendChild(t); setTimeout(() => t.remove(), big ? 3200 : 2200); }
function confetti(n){
  if (RM) return; const cv = $('#cf'), x = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#2E80D9', '#8A9573', '#1B9EA6', '#DBA292', '#F1CF4E', '#B66DD0', '#272727'];
  const ps = Array.from({length: n}, () => ({x: innerWidth / 2 + (Math.random() - .5) * 160, y: innerHeight * .62, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 6, s: Math.random() * 6 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)]}));
  let f = 0; (function tick(){ x.clearRect(0, 0, cv.width, cv.height); ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .42; p.vx *= .985; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); x.restore(); });
    if (++f < 130) requestAnimationFrame(tick); else x.clearRect(0, 0, cv.width, cv.height); })();
}

// ---------- routing ----------
function route(){
  const h = location.hash.slice(1);
  if (/^m\d\d$/.test(h)){ cur = {page: 'module', mod: h.slice(1), k: null}; modulePage(h.slice(1)); }
  else if (/^l\d\d-\d\d$/.test(h)){ const k = h.slice(1); cur = {page: 'lesson', mod: k.slice(0, 2), k}; lessonPage(k); }
  else if (h === 'review'){ cur = {page: 'review', mod: null, k: null}; reviewPage(); }
  else { cur = {page: 'home', mod: null, k: null}; home(); }
  chrome(); onScroll();
}
function rerender(){ const y = scrollY; route(); scrollTo(0, y); }
function onScroll(){
  const rb = $('#readbar');
  if (cur.page !== 'lesson'){ rb.style.width = '0'; return; }
  const H = document.documentElement.scrollHeight - innerHeight; rb.style.width = (H > 0 ? Math.min(1, scrollY / H) * 100 : 0) + '%';
  const as = [...document.querySelectorAll('#toc a')]; let on = null;
  as.forEach(a => { const el = document.getElementById(a.dataset.to); if (el && el.getBoundingClientRect().top < innerHeight * 0.3) on = a; });
  as.forEach(a => a.classList.toggle('on', a === on));
}
addEventListener('scroll', onScroll, {passive: true});
document.addEventListener('click', e => { const a = e.target.closest('#toc a'); if (!a) return; e.preventDefault(); document.getElementById(a.dataset.to)?.scrollIntoView({behavior: RM ? 'auto' : 'smooth'}); });
let lastHash = location.hash;
const bucket = () => { const w = innerWidth || 800; return w < 641 ? 0 : w < 960 ? 1 : w < 1280 ? 2 : 3; };
let _b = bucket(); addEventListener('resize', () => { const b = bucket(); if (b !== _b){ _b = b; if (cur.page !== 'review') rerender(); } });
addEventListener('hashchange', () => { if (location.hash !== '#review') { rq = null; rflip = false; rsess = 0; } route(); if (location.hash !== lastHash) scrollTo(0, 0); lastHash = location.hash; });

// ---------- writes ----------
const timers = {};
async function setDone(k, v){
  st.done[k] = v; if (v) st.at[k] = now(); else delete st.at[k]; lsSet();
  if (!db) return;
  try { v ? await db.doc('progress/' + k).set({done: true, at: st.at[k]}) : await db.doc('progress/' + k).delete(); } catch(e){}
}
document.addEventListener('input', e => {
  const k = e.target.dataset.note; if (!k) return;
  st.notes[k] = e.target.value; lsSet(); clearTimeout(timers[k]);
  const el0 = document.getElementById('saved-' + k); if (el0) el0.textContent = 'Saving…';
  timers[k] = setTimeout(async () => {
    const el = document.getElementById('saved-' + k);
    if (!db){ if (el) el.textContent = 'Saved in this browser'; return; }
    try { const t = st.notes[k]; t.trim() ? await db.doc('notes/' + k).set({text: t, at: now()}) : await db.doc('notes/' + k).delete(); if (el) el.textContent = 'Saved'; }
    catch(err){ if (el) el.textContent = 'Saved in this browser only'; }
  }, 800);
});
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-flag]'); if (!b) return;
  const fk = b.dataset.flag, v = !st.flags[fk]; st.flags[fk] = v; lsSet();
  b.classList.toggle('on', v); b.textContent = v ? 'reported' : 'report'; b.setAttribute('aria-pressed', v);
  if (db) try { v ? await db.doc('flags/' + fk).set({url: b.dataset.url, at: now()}) : await db.doc('flags/' + fk).delete(); } catch(err){}
});

route();

// ---------- shared persistence ----------
(async () => {
  try { db = window.claude && await window.claude.use('db'); } catch(e){ db = null; }
  if (!db) return;
  const sync = () => { if (document.activeElement?.dataset?.note || cur.page === 'review' || $('#pal').classList.contains('on')) chrome(); else rerender(); };
  let first = true;
  db.collection('progress').onSnapshot(snap => {
    const d = {}, at = {}; snap.docs.forEach(s => { const v = s.data(); if (v?.done){ d[s.id] = true; if (v.at) at[s.id] = v.at; } });
    if (first){ Object.keys(st.done).forEach(k => { if (st.done[k] && !d[k]){ d[k] = true; at[k] = st.at[k] || now(); db.doc('progress/' + k).set({done: true, at: at[k]}).catch(() => {}); } }); first = false; }
    const changed = JSON.stringify(d) !== JSON.stringify(Object.fromEntries(Object.entries(st.done).filter(([, v]) => v)));
    st.done = d; st.at = at; lsSet(); changed ? sync() : chrome();
  }, () => {});
  db.collection('notes').onSnapshot(snap => {
    snap.docs.forEach(s => { const t = s.data()?.text; const el = document.getElementById('ans-' + s.id); if (t != null && document.activeElement !== el){ st.notes[s.id] = t; if (el) el.value = t; } });
    lsSet();
  }, () => {});
  db.collection('flags').onSnapshot(snap => {
    const f = {}; snap.docs.forEach(s => f[s.id] = true); st.flags = f; lsSet();
    document.querySelectorAll('[data-flag]').forEach(b => { const on = !!f[b.dataset.flag]; b.classList.toggle('on', on); b.textContent = on ? 'reported' : 'report'; });
  }, () => {});
  const coll = (name, field, map) => db.collection(name).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(s => { const v = s.data(); if (v) o[s.id] = map(v); });
    const ch = JSON.stringify(o) !== JSON.stringify(st[field]); st[field] = o; lsSet(); if (ch) sync();
  }, () => {});
  coll('grades', 'grades', v => ({g: v.g, at: v.at}));
  coll('reviews', 'rev', v => ({n: v.n, box: v.box, due: v.due, at: v.at}));
  coll('activity', 'act', v => v.n || 0);
})();
addEventListener('load', () => mathify($('#view')));
</script>
