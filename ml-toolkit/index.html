loading_models.html","What a state_dict contains and the recommended save/load patterns."],["He et al.: Delving deep into rectifiers (2015)","https://arxiv.org/abs/1502.01852","The derivation behind Kaiming initialisation for ReLU networks."]],"k":["nn.Module","state_dict","initialisation"],"x":["PyTorch"],"p":["simple-neural-network","custom-linear-layer","residual-block","collect-module-parameters-recursively","weight-initialization"],"ak":""},{"id":"04.04","t":"Losses and optimisers","n":["Most classification losses take **raw logits**, not probabilities: `CrossEntropyLoss` applies log-softmax itself and `BCEWithLogitsLoss` applies a stable log-sigmoid. Applying softmax first trains a different, worse objective without any error.","`CrossEntropyLoss` expects class scores on dimension 1 and int64 class indices: shape `(N, C)` with targets `(N,)`, or `(N, C, d1, ...)` with targets `(N, d1, ...)`. Language-model logits `(B, T, V)` must be flattened or transposed first.","An optimiser holds references to parameters plus per-parameter state: SGD with momentum keeps one buffer, Adam keeps two (`exp_avg`, `exp_avg_sq`), so Adam's state alone is twice the model size in float32.","Parameter groups give different subsets their own learning rate and weight decay; schedulers rewrite `group['lr']` and are stepped after `optimizer.step()`, per batch or per epoch depending on how they were configured."],"a":"## Losses and their input conventions\nPyTorch losses are modules (`nn.CrossEntropyLoss()`) with functional twins (`F.cross_entropy`). The maths is covered in the Deep Learning course; what bites in practice is the input contract. Getting it wrong rarely raises an error. It silently optimises the wrong thing.\n\n| loss | input | target | notes\n| `CrossEntropyLoss` | logits `(N, C)` or `(N, C, d...)` | int64 indices `(N)` or `(N, d...)`, or float probabilities shaped like input | log-softmax inside; `ignore_index=-100`, `label_smoothing`, `weight`\n| `NLLLoss` | log-probabilities | int64 indices | pair with `log_softmax`, never `softmax`\n| `BCEWithLogitsLoss` | logits, any shape | float, same shape | stable; `pos_weight` for imbalance\n| `MSELoss` / `L1Loss` / `HuberLoss` | any shape | same shape | broadcasting mismatches only warn\n| `KLDivLoss` | log-probabilities | probabilities (or log with `log_target=True`) | use `reduction=\"batchmean\"` for the true KL\n\nThree common failures:\n- **Softmax before cross-entropy.** The loss becomes cross-entropy of softmax(softmax(z)), whose gradients are squashed; training is slow and accuracy plateaus low.\n- **Class dimension in the wrong place.** For a language model with logits `(B, T, V)` and targets `(B, T)`, write `F.cross_entropy(logits.view(-1, V), targets.view(-1))` or `F.cross_entropy(logits.transpose(1, 2), targets)`. Passing `(B, T, V)` directly fails only when shapes happen to disagree.\n- **Broadcasting in regression.** `MSELoss` of predictions `(N, 1)` against targets `(N,)` broadcasts to `(N, N)`, comparing every prediction with every target. PyTorch prints a warning that is easy to miss; squeeze the prediction.\n\nWith `reduction=\"mean\"` and `ignore_index`, cross-entropy divides by the number of non-ignored targets, which is what you want for padded sequences within one batch. Across accumulated micro-batches with different numbers of real tokens, sum the losses and divide by the global token count yourself.\n\n## What an optimiser holds\nAn optimiser is constructed from an iterable of parameters (or of parameter groups) and keeps two things: `param_groups`, a list of dicts with hyperparameters like `lr`, `weight_decay` and `betas`, and `state`, a per-parameter dict. For `torch.optim.AdamW` the state of each parameter is a step count plus `exp_avg` and `exp_avg_sq`, both the parameter's shape and dtype. For a 1-billion-parameter float32 model that is 8 GB of optimiser state on top of 4 GB of weights and 4 GB of gradients, which is why the LLM-scale module counts bytes per parameter.\n\n%%seq One optimisation step: who reads and writes what.\nLoop > Model : forward(x)\nModel -> Loop : logits\nLoop > Loss : loss(logits, y)\nLoop > Autograd : loss.backward()\nAutograd -> Model : p.grad filled\nLoop > Optimiser : step() reads p.grad, updates state and p\nLoop > Scheduler : step() rewrites lr in param_groups\nLoop > Optimiser : zero_grad()\n%%\n\nBuild the optimiser **after** moving the model to its device; the optimiser keeps references to the parameter tensors, and its state is created lazily on the first `step()`, on the same device as each parameter.\n\n## Parameter groups\nGroups let one optimiser treat subsets differently. The standard Transformer recipe applies weight decay to matrices but not to biases, norm weights or (often) embeddings:\n\n```python\ndecay, no_decay = [], []\nfor name, p in model.named_parameters():\n    if not p.requires_grad:\n        continue\n    (decay if p.ndim >= 2 else no_decay).append(p)\nopt = torch.optim.AdamW(\n    [{\"params\": decay, \"weight_decay\": 0.1},\n     {\"params\": no_decay, \"weight_decay\": 0.0}],\n    lr=3e-4, betas=(0.9, 0.95))\n```\n\nFine-tuning often adds a group with a smaller learning rate for the pretrained backbone and a larger one for the new head. Note the difference between `Adam(weight_decay=...)`, which adds an L2 term to the gradient and so gets rescaled by Adam's normaliser, and `AdamW`, which decays the weights directly; the ML Maths course explains why the decoupled version regularises as intended.\n\n## Schedulers\nA scheduler wraps an optimiser and rewrites `group[\"lr\"]` each time you call `scheduler.step()`. Call it after `optimizer.step()`; the reverse order skips the first value of the schedule and PyTorch warns about it.\n- **Per-epoch** schedules: `StepLR`, `MultiStepLR`, `CosineAnnealingLR(T_max=epochs)`.\n- **Per-step** schedules: `OneCycleLR`, or `LambdaLR` with a warmup-then-cosine lambda over total steps, standard for Transformers. Configure `T_max` or the lambda in the same unit you step in; mixing epochs and steps is a common silent bug.\n- **Metric-driven**: `ReduceLROnPlateau` takes the validation loss, `scheduler.step(val_loss)`.\n- `SequentialLR` and `ChainedScheduler` compose schedules, for example linear warmup then cosine.\n\nThe scheduler's `state_dict()` (current step, base learning rates) must be checkpointed along with the optimiser's, or a resumed run restarts its warmup.\n\n! Example: warmup plus cosine with LambdaLR\n! Total 10,000 steps, 500 warmup steps, peak learning rate 3e-4 set on the optimiser.\n! `lam = lambda s: (s + 1) / 500 if s < 500 else 0.5 * (1 + math.cos(math.pi * (s - 500) / 9500))`\n! At step 250 the multiplier is 0.502 (lr about 1.5e-4); at step 5,250 it is 0.5 (1.5e-4 on the way down); at step 9,999 it is about 0, so the run ends with a near-zero learning rate. Step it once per batch.\n\n> Takeaway: feed losses logits in the layout they expect, remember that the optimiser carries state as large as the model, and treat learning rate, groups and schedule as part of the checkpointed training state.","q":"A sequence tagger produces logits of shape `(B, T, C)` with padded positions labelled -100. A teammate computes `nn.CrossEntropyLoss()(torch.softmax(logits, -1).permute(0, 2, 1), y)`. It runs. List what is right, what is wrong, and what the training curves will look like.","s":"The permute is correct: it puts classes on dimension 1, giving `(B, C, T)` against targets `(B, T)`, and the default `ignore_index=-100` correctly drops padded positions from both the sum and the averaging count. The bug is the softmax: `CrossEntropyLoss` applies log-softmax itself, so it now treats probabilities in [0, 1] as logits. Softmax of values in [0, 1] is nearly uniform: even a perfect one-hot prediction gives a logit gap of only 1, so the loss is bounded below by ln(1 + (C-1)/e), about 1.46 for 10 classes instead of 0. Gradients pass through two softmaxes and are small. Curves show the loss starting near ln(C) and flattening well above zero while accuracy creeps up slowly, with no error raised. Remove the softmax and pass the raw logits.","r":[["PyTorch docs: CrossEntropyLoss","https://pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html","Exact input/target shapes, ignore_index, label smoothing and how mean reduction counts."],["PyTorch docs: BCEWithLogitsLoss","https://pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html","Why the fused logit form is numerically stable, and pos_weight."],["PyTorch docs: torch.optim","https://pytorch.org/docs/stable/optim.html","Parameter groups, per-parameter options, scheduler ordering and the full scheduler list."],["Loshchilov and Hutter: Decoupled weight decay regularization (2017)","https://arxiv.org/abs/1711.05101","Why AdamW's decay differs from L2 regularisation inside Adam."]],"k":["loss functions","optimisers","lr schedules"],"x":["PyTorch"],"p":["optimizer-scheduler","learning-rate-warmup-scheduler","custom-sgd-with-momentum","manual-weight-update","cross-entropy-logits"],"ak":""},{"id":"04.05","t":"Data pipelines: Dataset and DataLoader","n":["A map-style `Dataset` answers two questions, `__len__` and `__getitem__(i)`; an `IterableDataset` yields a stream. Keep `__getitem__` cheap and per-example; batching belongs to the `DataLoader`.","The `DataLoader` combines a **sampler** (which indices, in what order), a **collate function** (how a list of examples becomes one batch) and **workers** (separate processes that run `__getitem__` in parallel).","`default_collate` stacks tensors of equal shape and recurses into dicts and tuples. Variable-length data (text, detection boxes) needs a custom `collate_fn` that pads and returns masks.","With `num_workers > 0` each worker holds its own copy of the dataset object and its own RNG. An `IterableDataset` must shard itself with `get_worker_info()`, or every worker yields the same data.","If GPU utilisation is low and the loss loop is simple, time the loader alone. `num_workers`, `pin_memory=True`, `persistent_workers=True` and doing decode work once offline are the usual fixes."],"a":"## Two objects with separate jobs\nPyTorch splits input handling into a `Dataset`, which knows how to fetch one example, and a `DataLoader`, which decides order, groups examples into batches and parallelises the fetching. Keeping them separate means the same dataset can be shuffled for training, read in order for evaluation, or sharded across GPUs with a `DistributedSampler`, without changing its code.\n\n```python\nclass Windows(torch.utils.data.Dataset):\n    # Sliding windows over one long series, for forecasting.\n    def __init__(self, series, ctx, horizon):\n        self.x = torch.as_tensor(series, dtype=torch.float32)  # one tensor, not a list\n        self.ctx, self.h = ctx, horizon\n    def __len__(self):\n        return len(self.x) - self.ctx - self.h + 1\n    def __getitem__(self, i):\n        return self.x[i:i + self.ctx], self.x[i + self.ctx:i + self.ctx + self.h]\n\nloader = torch.utils.data.DataLoader(\n    Windows(series, ctx=96, horizon=24), batch_size=64, shuffle=True,\n    num_workers=4, pin_memory=True, drop_last=True, persistent_workers=True)\n```\n\n`__getitem__` should return tensors (or NumPy arrays and numbers, which collate converts) for **one** example. Doing heavy decoding there is fine, because workers run it in parallel; doing global work there (re-reading a whole file per item) is not.\n\n%%flow What happens to produce one batch.\nSampler -(indices)-> Workers -(dataset[i] for each i)-> collate_fn -(stack or pad)-> *pinned batch -(non_blocking copy)-> GPU\n%%\n\n## Samplers and order\n- `shuffle=True` is shorthand for a `RandomSampler`, which draws a fresh permutation every epoch. `shuffle=False` uses a `SequentialSampler`.\n- `WeightedRandomSampler(weights, num_samples)` samples with replacement in proportion to per-example weights, a simple fix for class imbalance; a custom `batch_sampler` can instead build each batch with a fixed number of examples per class.\n- `DistributedSampler` gives each rank a disjoint slice of a shared permutation. Call `sampler.set_epoch(epoch)` every epoch, or every epoch uses the same order.\n- `drop_last=True` discards a final short batch, which keeps batch-norm statistics and compiled shapes stable.\n\n## Collate: from a list of examples to a batch\nThe default collate function takes a list of `batch_size` examples and stacks matching fields: a list of `(x, y)` pairs becomes `(stack(xs), stack(ys))`, dicts are collated per key, and Python numbers become tensors. Stacking requires equal shapes, so variable-length inputs fail with `stack expects each tensor to be equal size`. Write your own:\n\n```python\ndef pad_collate(batch, pad_id=0):\n    seqs = [torch.as_tensor(ids) for ids, _ in batch]\n    lens = torch.tensor([len(s) for s in seqs])\n    x = torch.nn.utils.rnn.pad_sequence(seqs, batch_first=True, padding_value=pad_id)\n    mask = torch.arange(x.size(1))[None, :] < lens[:, None]     # True on real tokens\n    y = torch.tensor([label for _, label in batch])\n    return {\"input_ids\": x, \"attention_mask\": mask, \"labels\": y}\n```\n\nPadding to the longest sequence in the batch wastes compute when lengths vary widely. Bucketing (grouping similar lengths into the same batch) or packing several documents into one fixed-length row with a block-diagonal attention mask, which is the standard for LLM pretraining, cuts the waste.\n\n## Workers, memory and randomness\nWith `num_workers=k`, the loader starts `k` processes, each holding a copy of the dataset object, and each prepares whole batches (`prefetch_factor` batches ahead, default 2). Three consequences:\n- **Copy-on-access memory growth.** Under the `fork` start method, workers share the parent's memory pages until they are written. Python reference counting writes to every object it touches, so a dataset holding a large Python list of strings or dicts gets copied page by page into every worker. Store data in NumPy arrays, tensors or memory-mapped files instead.\n- **Randomness.** PyTorch seeds each worker's `torch` and `random` generators from a base seed plus the worker id, but other libraries' generators can come out identical across workers. Seed NumPy yourself in a `worker_init_fn` using `torch.utils.data.get_worker_info().seed`, or use torch's RNG for augmentation.\n- **IterableDataset sharding.** Each worker iterates its own copy, so with 4 workers you get every example 4 times. Inside `__iter__`, read `get_worker_info()` and yield only every `num_workers`-th shard.\n\n`persistent_workers=True` keeps workers alive between epochs instead of restarting them (and re-pickling the dataset). `pin_memory=True` places batches in page-locked host memory so that `batch.to(\"cuda\", non_blocking=True)` can overlap the copy with compute.\n\n## Is the loader the bottleneck?\n| symptom | likely cause | first fix\n| GPU utilisation saw-tooths, steps wait on `next(it)` | too few workers or slow decode | raise `num_workers` (start near CPU cores per GPU), move decoding offline\n| first batch of each epoch is slow | workers restarting | `persistent_workers=True`\n| host RAM grows each epoch with workers | Python objects copied into workers | NumPy or mmap storage\n| fast loader, slow step | not a data problem | profile the model instead\n\nMeasure it directly: iterate the loader with no model for a few hundred batches and compare batches per second with the training loop's steps per second.\n\n! Example: how many workers?\n! A vision model trains at 20 steps per second with batches of 256 images, so it needs 5,120 decoded and augmented images per second.\n! One worker decodes and augments about 400 images per second, so it takes 13 workers just to keep up; with 8 CPU cores per GPU that is impossible.\n! Options: decode once and store preprocessed tensors, use GPU-side decoding and augmentation, or reduce per-image work (smaller resize). Adding workers past the core count only adds context switching.\n\n> Takeaway: a Dataset returns one example, the DataLoader decides order, batching and parallelism. Collate variable-length data yourself, store data so workers do not copy it, and measure the loader before blaming the model.","q":"You launch the same script on 4 GPUs. Each rank builds `DataLoader(ds, batch_size=32, num_workers=8)` over an `IterableDataset` that streams JSON lines from one big file. An epoch takes 32 times as many optimiser steps as you expected, and the training loss drops unusually fast. What is happening, and how do you fix it?","s":"Nothing shards the stream. Each of the 4 ranks opens the whole file, and within each rank the 8 workers each iterate their own copy of the dataset from the first line, so every line is read once per worker per rank: 32 copies per epoch. You get 32 times the expected steps, and every batch is repeated 32 times, so the model memorises the data and the training loss falls faster than real progress justifies. Samplers cannot help: `DataLoader` rejects a sampler such as `DistributedSampler` for an `IterableDataset`. Shard inside `__iter__` instead: combine the rank and world size from `torch.distributed` with `get_worker_info().id` and `num_workers` into a global reader index from 0 to 31, and have each reader yield only its own lines (line number modulo 32 equals its index), or split the file into shard files and give each reader its own set.","r":[["PyTorch docs: torch.utils.data","https://pytorch.org/docs/stable/data.html","Map-style vs iterable datasets, samplers, collate, worker sharding and the randomness notes."],["PyTorch tutorial: Datasets and DataLoaders","https://pytorch.org/tutorials/beginner/basics/data_tutorial.html","A minimal custom Dataset and how DataLoader iterates it."],["PyTorch performance tuning guide","https://pytorch.org/tutorials/recipes/recipes/tuning_guide.html","num_workers, pinned memory and other input-pipeline settings that affect throughput."]],"k":["DataLoader","collate","workers"],"x":["PyTorch"],"p":["custom-dataset-class","balanced-dataloader","transform-pipeline","padding-and-truncation"],"ak":""},{"id":"04.06","t":"The training loop","n":["Every PyTorch training step is the same five lines: zero gradients, forward, loss, backward, step. Everything else in a real loop (clipping, accumulation, scheduling, logging, evaluation, checkpoints) is inserted at fixed points around them.","`model.train()` and `model.eval()` switch layer behaviour (dropout on or off, batch norm using batch statistics or running ones). They do not touch autograd, so evaluation also needs `torch.no_grad()`.","Clip after `backward()` and before `step()` with `clip_grad_norm_`, and log the norm it returns: the gradient norm is one of the most informative curves you can plot.","Validate on a fixed held-out set at a fixed cadence, keep the best checkpoint by validation metric, and stop when it has not improved for `patience` evaluations."],"a":"## The canonical step\nStrip any PyTorch training script down and you find this:\n\n```python\nmodel.train()\nfor step, (x, y) in enumerate(train_loader):\n    x, y = x.to(dev, non_blocking=True), y.to(dev, non_blocking=True)\n    opt.zero_grad(set_to_none=True)\n    loss = loss_fn(model(x), y)\n    loss.backward()\n    gnorm = torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)\n    opt.step()\n    sched.step()                       # if the schedule is per step\n```\n\nThe order matters. Zeroing after `backward()` throws the gradients away; clipping before `backward()` clips the previous step's gradients; stepping the scheduler before the optimiser skips the first learning rate. The Deep Learning course discusses how to choose batch size, warmup and clipping thresholds; this lesson is about wiring them correctly.\n\n%%flow One training step, with the optional pieces in their only correct positions.\nzero_grad -> forward -> loss -> backward -(optional)-> unscale + *clip -> optimizer.step -> scheduler.step\n%%\n\n## Train and eval modes\n`model.train()` and `model.eval()` set a `training` flag on every submodule. Only layers that read it change: dropout is active in training and the identity in eval; batch norm normalises with the current batch's statistics and updates running averages in training, and uses the stored running averages in eval. Neither mode affects gradient recording.\n\n```python\n@torch.no_grad()\ndef evaluate(model, loader):\n    model.eval()\n    total, n = 0.0, 0\n    for x, y in loader:\n        x, y = x.to(dev), y.to(dev)\n        total += loss_fn(model(x), y).item() * len(y)   # undo the mean\n        n += len(y)\n    model.train()                                      # restore for training\n    return total / n\n```\n\nTwo classic bugs: forgetting `model.eval()` (validation scores fluctuate run to run because dropout is on, and batch norm's running stats get updated with validation data) and forgetting to switch back with `model.train()` (training silently continues without dropout). Weighting each batch's mean loss by its size gives the true dataset mean even when the last batch is short.\n\n## Gradient clipping\n`clip_grad_norm_(params, max_norm)` computes the global L2 norm of all gradients concatenated, $\\|g\\| = \\sqrt{\\sum_p \\|g_p\\|^2}$, and if it exceeds `max_norm` rescales every gradient by `max_norm / ||g||`. The direction is preserved; only the step length is capped. It returns the norm **before** clipping, which is what to log. A healthy run shows a gradient norm that settles into a band; spikes that coincide with loss spikes point to bad batches, a learning rate that is too high, or numerical problems. `clip_grad_value_` clips each element independently and changes the direction, so it is rarely what you want.\n\nWith mixed-precision `GradScaler` (next lesson), call `scaler.unscale_(opt)` before clipping, or you clip scaled gradients against an unscaled threshold. With gradient accumulation, clip once, after the last micro-batch.\n\n## Logging without stalling the GPU\nEach `.item()` forces a host-device sync. Logging every step is fine for small models, but for fast steps accumulate on the device and sync every N steps:\n\n```python\nrunning = torch.zeros((), device=dev)\nrunning += loss.detach()\nif step % 100 == 0:\n    log(step=step, loss=(running / 100).item(), lr=sched.get_last_lr()[0], gnorm=gnorm.item())\n    running.zero_()\n```\n\nWorth logging: training loss, validation loss and metric, learning rate, gradient norm, throughput (examples or tokens per second) and peak memory (`torch.cuda.max_memory_allocated()`). Fix all seeds and log the config so a run can be reproduced.\n\n## Validation cadence and early stopping\nEvaluate on a fixed validation set every epoch, or every K steps for long runs. Early stopping keeps the best checkpoint and stops when the validation metric has not improved by at least `min_delta` for `patience` consecutive evaluations:\n\n```python\nif val < best - min_delta:\n    best, bad = val, 0\n    torch.save(model.state_dict(), \"best.pt\")\nelse:\n    bad += 1\n    if bad >= patience:\n        break\n```\n\nPatience should cover the noise in the validation metric and any planned learning-rate drops; a run with a step schedule often looks flat just before a drop. Early stopping is model selection on the validation set, so report final numbers on a separate test set.\n\n! Example: reading a run from its logs\n! Step 0: loss 2.31 (close to ln 10 = 2.303 for 10 balanced classes, as expected at initialisation). Steps 0 to 2,000: loss falls to 0.6, gradient norm settles between 0.8 and 1.5 under a clip of 1.0, so clipping fires on some steps.\n! Step 2,400: gradient norm jumps to 40 and loss to 1.9, then recovers over 300 steps. The spike coincides with the end of warmup, when the learning rate peaks. Lowering the peak learning rate or lengthening warmup is the first thing to try.\n! Validation loss bottoms out at epoch 7 and rises while training loss keeps falling: overfitting. With patience 3, training stops at epoch 10 and `best.pt` holds epoch 7.\n\n> Takeaway: keep the five-line core intact, put clipping, scheduling and logging in their fixed slots, evaluate in eval mode under `no_grad`, and keep the best checkpoint rather than the last.","q":"Your validation accuracy changes by about 1 point every time you re-run evaluation on the same checkpoint, and after the first evaluation the training loss starts falling faster than before. The model uses dropout and batch norm. What is wrong with the loop and what do you change?","s":"Evaluation is running in training mode. With dropout active, every evaluation samples a different subnetwork, so accuracy varies between identical re-runs; in eval mode the forward pass is deterministic. Batch norm in training mode also normalises with the validation batches' own statistics and updates its running averages with validation data. The faster-falling training loss after evaluation is the second half of the bug: either evaluation switched to eval mode and never switched back, so training continues with dropout disabled and fits the training data more easily, or the running statistics were contaminated. The fix is a helper that calls `model.eval()` and runs under `torch.no_grad()`, then restores `model.train()` before returning, as in the evaluate function in this lesson.","r":[["PyTorch tutorial: Optimizing model parameters","https://pytorch.org/tutorials/beginner/basics/optimization_tutorial.html","The official minimal train and test loops, with the step order spelled out."],["PyTorch docs: clip_grad_norm_","https://pytorch.org/docs/stable/generated/torch.nn.utils.clip_grad_norm_.html","The global-norm definition, the returned value and the error_if_nonfinite option."],["Karpathy: A recipe for training neural networks (2019)","https://karpathy.github.io/2019/04/25/recipe/","A practitioner's sequence for building and checking a training loop step by step."]],"k":["training loop","gradient clipping","early stopping"],"x":["PyTorch"],"p":["mini-training-loop","early-stopping","gradient-clipping-global-norm-rescaling","mini-batch-training-loop"],"ak":""},{"id":"04.07","t":"Checkpointing, mixed precision and speed","n":["A resumable checkpoint is more than weights: model, optimiser, scheduler and `GradScaler` state dicts, the step and epoch counters, and RNG states. Missing any one makes the resumed run diverge from the uninterrupted one.","`torch.autocast` runs matmuls and convolutions in float16 or bfloat16 while keeping precision-sensitive ops (softmax, norms, losses) in float32. The weights themselves stay float32.","float16 has a narrow range (largest finite value 65504, smallest normal about $6 \\times 10^{-5}$), so small gradients underflow; `GradScaler` multiplies the loss by a large factor and skips steps that overflow. bfloat16 has float32's range and does not need it.","`torch.compile(model)` captures the forward into graphs and generates fused kernels. The first call is slow while it compiles; new input shapes or Python-side changes trigger recompiles or graph breaks."],"a":"## Checkpoints you can actually resume from\nSaving `model.state_dict()` is enough to *use* a model. To *resume training* so that the result matches an uninterrupted run, you need every piece of state that the next step reads:\n\n```python\nckpt = {\n    \"model\": model.state_dict(),\n    \"optim\": opt.state_dict(),        # Adam moments and step counts\n    \"sched\": sched.state_dict(),      # position in warmup/cosine\n    \"scaler\": scaler.state_dict(),    # current loss scale (fp16 only)\n    \"step\": step, \"epoch\": epoch, \"best_val\": best,\n    \"rng\": {\"torch\": torch.get_rng_state(), \"cuda\": torch.cuda.get_rng_state_all()},\n}\ntorch.save(ckpt, \"ckpt.tmp\"); os.replace(\"ckpt.tmp\", \"ckpt.pt\")   # atomic swap\n```\n\nLoading reverses it: build the model and optimiser exactly as before, move the model to its device, then call each `load_state_dict`. Use `map_location` to load a GPU checkpoint on a CPU machine. Since PyTorch 2.6 `torch.load` defaults to `weights_only=True`, which unpickles only tensors and plain containers; that is a security feature (a pickle can run arbitrary code), so keep checkpoints to tensors, numbers and strings rather than lowering the guard.\n\nPractical habits: write to a temporary file and rename, so a crash mid-save never corrupts the last good checkpoint; keep the last two or three plus the best; and for a model wrapped by `torch.compile` or DDP, save the underlying module's state dict so key names have no `_orig_mod.` or `module.` prefix. Resuming mid-epoch exactly also requires restoring the sampler's position, which most loops approximate by restarting the epoch.\n\n## Mixed precision with autocast\nMost training time goes into matmuls, and tensor cores run them several times faster in 16-bit formats. Automatic mixed precision gets that speed without converting the whole model:\n\n```python\nuse_fp16 = False                         # True on GPUs without bfloat16 support\ndtype = torch.float16 if use_fp16 else torch.bfloat16\nscaler = torch.amp.GradScaler(\"cuda\", enabled=use_fp16)\nfor x, y in loader:\n    opt.zero_grad(set_to_none=True)\n    with torch.autocast(device_type=\"cuda\", dtype=dtype):\n        loss = loss_fn(model(x), y)      # matmuls in 16-bit, softmax/norm/loss in fp32\n    scaler.scale(loss).backward()        # identity when the scaler is disabled\n    scaler.unscale_(opt)                 # so clipping sees true gradient sizes\n    torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n    scaler.step(opt)                     # skips the step if grads contain inf/nan\n    scaler.update()                      # adjust the scale for next time\n```\n\nAutocast keeps an op list: `matmul`, `linear`, `conv` and attention run in the low-precision dtype; reductions and numerically sensitive ops such as `softmax`, `log_softmax`, `layer_norm` and losses run in float32. Parameters stay float32 (the \"master weights\"); autocast casts them on the fly. Only the forward pass goes inside the context; backward ops run in the dtype their forward ops used.\n\n%%flow Dynamic loss scaling with float16.\nloss -(times S)-> scaled backward -(unscale by 1/S)-> *finite? -(yes)-> step, grow S every 2000 steps\n%%\n\n## Why float16 needs a scaler and bfloat16 does not\nfloat16 has 5 exponent bits: its largest finite value is 65504 and its smallest normal value about $6.1 \\times 10^{-5}$ (subnormals reach about $6 \\times 10^{-8}$). Activation gradients in deep networks are often smaller than that, so they flush to zero. `GradScaler` multiplies the loss by a scale $S$ (initially $2^{16}$), which multiplies every gradient by $S$ and lifts them into range; it divides by $S$ before the step. If any gradient overflowed to inf or nan, it skips the step and halves $S$; after 2,000 consecutive good steps it doubles $S$. A few skipped steps early in training are normal; persistent skipping signals a real numerical problem.\n\nbfloat16 keeps float32's 8 exponent bits (range up to about $3.4 \\times 10^{38}$) and gives up mantissa: 8 significant bits, roughly 2 to 3 decimal digits. Underflow is not the issue, so no scaler is needed; the cost is coarse rounding, which is why weights and optimiser state stay in float32. On GPUs that support it (A100 and later), bfloat16 is the default choice. The LLM-scale module in the AI Research course goes further, into fp8 and memory budgets.\n\n## torch.compile basics\n`model = torch.compile(model)` hands the forward pass to a compiler stack: TorchDynamo captures the Python code into FX graphs by inspecting bytecode, AOTAutograd derives the backward graph ahead of time, and TorchInductor generates fused kernels (Triton on GPU). Fusing chains of elementwise ops (bias, activation, dropout, residual add) removes round trips to memory, which is where much of the speed-up comes from: typically tens of percent for Transformer training, more for models dominated by small ops.\n\nWhat to expect:\n- The first call compiles and can take tens of seconds to minutes; benchmark only after warmup.\n- Code Dynamo cannot trace (data-dependent Python control flow, `.item()`, printing, some third-party calls) causes a **graph break**: the model still runs, with the untraceable part in eager mode, but fusion stops at the break.\n- A new input shape triggers a recompile; after it sees varying shapes Dynamo tries a dynamic-shape graph. Padding to a few fixed lengths keeps recompiles rare.\n- `mode=\"reduce-overhead\"` adds CUDA graphs to cut kernel-launch cost for small batches; `mode=\"max-autotune\"` searches kernel configurations for longer at compile time.\n\n| lever | typical gain | catch\n| bf16 autocast | 2x or more on matmul-heavy models | coarse rounding; keep fp32 master weights\n| `torch.compile` | 1.2x to 2x | compile time, graph breaks, recompiles\n| `channels_last` for CNNs | 1.1x to 1.3x | conv nets only\n| larger batch, fewer syncs | varies | memory, optimisation dynamics\n\n! Example: the resumed run that drifted\n! A run is stopped at step 40,000 and resumed from a checkpoint containing only model and optimiser state.\n! The scheduler restarts at step 0, so the learning rate jumps back through warmup to its peak: the loss spikes. The fp16 loss scale restarts at 65536 when it had settled at 1024, so the first few steps overflow and are skipped. The data order also restarts from epoch 0.\n! Saving and restoring the scheduler, scaler, step counter and RNG states makes the resumed loss curve sit on top of the original.\n\n> Takeaway: checkpoint everything the next step reads, write it atomically, use bfloat16 autocast with float32 master weights where hardware allows (fp16 plus GradScaler otherwise), and compile once the model is correct, not before.","q":"You switch a working fp32 training script to fp16 autocast with `GradScaler`, and add gradient clipping at max_norm 1.0. Training is now much slower to converge, and the logged gradient norm before clipping is around 30,000 every step. What is the bug, why does it slow convergence, and why would the same code be fine with bfloat16 and the scaler disabled?","s":"The gradients are clipped while still multiplied by the loss scale. `scaler.scale(loss).backward()` produces gradients S times too large (S is about 2^15 to 2^16 here, consistent with a logged norm near 30,000 for a true norm below 1), and clipping them to norm 1 then shrinks every update by a factor of roughly S/true-norm. `scaler.step()` later divides by S again, so the effective step is tiny: convergence slows as if the learning rate were cut by orders of magnitude. The fix is `scaler.unscale_(opt)` before `clip_grad_norm_`, so clipping sees true gradient magnitudes, and `scaler.step` knows not to unscale twice. With bfloat16 and `enabled=False`, `scale()` and `unscale_()` are identities, so the gradients are never scaled and clipping already sees true values.","r":[["PyTorch docs: Automatic mixed precision (torch.amp)","https://pytorch.org/docs/stable/amp.html","Autocast op lists (which ops run in 16-bit, which in fp32) and GradScaler's parameters."],["PyTorch docs: AMP examples","https://pytorch.org/docs/stable/notes/amp_examples.html","Correct patterns for clipping, accumulation and multiple losses with a GradScaler."],["PyTorch tutorial: Saving and loading a general checkpoint","https://pytorch.org/tutorials/recipes/recipes/saving_and_loading_a_general_checkpoint.html","Bundling model, optimiser and counters into one resumable file."],["PyTorch tutorial: Introduction to torch.compile","https://pytorch.org/tutorials/intermediate/torch_compile_tutorial.html","Usage, modes, graph breaks and how to read compile behaviour."]],"k":["checkpointing","mixed precision","torch.compile"],"x":["PyTorch"],"p":["mixed-precision-training-memory-accountant","mixed-precision-with-loss-scaling","rmsnorm-forward-pass","mini-batch-training-loop"],"ak":""},{"id":"04.08","t":"Debugging models","n":["Before training for real, overfit one small batch: a correct model and loop drive the loss on 2 to 16 examples to near zero within a few hundred steps. If it cannot, the bug is in the code, not the data or the hyperparameters.","Check the loss at initialisation against theory: with $C$ balanced classes and small initial logits, cross-entropy should start near $\\ln C$ (2.30 for 10 classes). A much larger value means overconfident initial logits or a mismatched target format.","Most shape bugs that do not crash come from broadcasting; assert shapes at module boundaries and be suspicious of any loss whose inputs have different numbers of dimensions.","NaNs come from a short list: log or sqrt of zero, division by a zero norm, softmax over a fully masked row, fp16 overflow, or a learning rate that blows up. `torch.isfinite` checks and `torch.autograd.detect_anomaly` localise them.","Exploding gradients show up as gradient-norm spikes before loss spikes. Log the norm per layer to find where they start."],"a":"## Neural network bugs are quiet\nA typo in a web service throws an exception. A typo in a model usually produces a model that trains a bit worse. Wrong axis in a softmax, dropout left on at evaluation, labels shuffled separately from inputs, a frozen layer, a loss computed on probabilities: all of them run, and most still reduce the loss. Debugging therefore means building checks that fail loudly. The Deep Learning course covers reading loss curves and diagnosing dead or saturated units; this lesson is the PyTorch-side toolkit.\n\n%%flow A debugging ladder: each rung is cheap and rules out a whole class of bugs.\nInspect data and labels -> Loss at init = ln C? -> *Overfit one batch -> Gradient norms per layer -> Scale up\n%%\n\n## Sanity checks before any real run\n1. **Look at the data after the loader.** Decode a batch back to images or text and print the labels next to it. Augmentation bugs, label misalignment and normalisation mistakes show up here and nowhere else.\n2. **Check the loss at initialisation.** For $C$ balanced classes, a freshly initialised classifier should give roughly uniform predictions and loss $\\approx \\ln C$. For a language model with vocabulary $V$, the first loss should be close to $\\ln V$ (10.8 for 50,000 tokens). A value of 40 means huge initial logits; initialise the final layer smaller.\n3. **Overfit a single batch.** Take 2 to 16 examples, disable augmentation and regularisation, and train on that batch repeatedly. Loss should approach zero and training accuracy reach 100 percent. Failure isolates the problem to the model, loss or optimiser wiring: frozen parameters, a detached tensor in the forward pass, a learning rate of zero after a scheduler mistake, targets in the wrong format.\n4. **Check that every parameter gets a gradient.** After one `backward()`, list parameters whose `.grad` is `None` or all zeros. Those layers are unused, detached or frozen.\n5. **Check batch independence.** Compute the gradient of one output example's loss with respect to the input batch; only that example's input row should be non-zero. A reshape that mixes the batch axis with another axis (for example `view` after `transpose` without care) fails this test while still training.\n\n```python\nfor name, p in model.named_parameters():\n    if p.requires_grad and (p.grad is None or p.grad.abs().sum() == 0):\n        print(\"no gradient:\", name)\n```\n\n## Shape errors and silent broadcasting\nCrashing shape errors are the easy kind: read the two shapes in the message (`mat1 and mat2 shapes cannot be multiplied (64x512 and 256x10)`) and trace which dimension is wrong. The dangerous ones broadcast:\n- Loss between `(N, 1)` and `(N,)` becomes `(N, N)`.\n- A per-feature mean computed with the wrong `dim` broadcasts back without error.\n- A mask of shape `(B, T)` applied to scores of shape `(B, H, T, T)` broadcasts along the wrong axes unless reshaped to `(B, 1, 1, T)`.\n\nAssert shapes at module boundaries during development (`assert x.shape == (B, T, D), x.shape`), give dimensions names in comments, and prefer `einsum` or einops-style rearranges, which state the axes explicitly.\n\n## Finding NaNs and infinities\n| source | typical trigger | fix\n| `log(0)`, `log` of a negative | probabilities computed then logged | work in log space; `log_softmax`, `logsigmoid`\n| `sqrt(0)` in backward | norms of zero vectors | add epsilon inside the sqrt\n| division by zero | normalising by a sum or std that can be 0 | clamp the denominator\n| softmax over all `-inf` | a fully masked row (an all-padding sequence) | ensure one unmasked position or use a large finite negative\n| fp16 overflow | activations above 65504 | bfloat16, or GradScaler for gradients\n| optimisation blow-up | learning rate too high, no warmup | lower LR, warmup, clipping\n\nTo find the first bad operation, enable anomaly detection for a short debugging run (it is slow): `torch.autograd.set_detect_anomaly(True)`. When backward produces NaN it raises an error that includes the traceback of the forward op responsible. For forward NaNs, register forward hooks that assert `torch.isfinite(out).all()` and report the module name. `clip_grad_norm_(..., error_if_nonfinite=True)` turns a silent nan step into an exception.\n\n## Exploding and vanishing gradients\nLog the global gradient norm every step and the per-layer norms occasionally. Explosions usually appear first as spikes in a few layers (often the last layers, embeddings, or attention logits in Transformers), a few steps before the loss spikes. Remedies, roughly in order: lower the peak learning rate or extend warmup; clip the global norm; check initialisation and normalisation placement (pre-norm residual blocks are far more stable than post-norm); for attention, normalise queries and keys or cap logits. Vanishing gradients show up as per-layer norms that shrink by orders of magnitude towards the input.\n\nWhen you suspect a custom backward, compare it with finite differences using `torch.autograd.gradcheck(fn, inputs)` on small float64 inputs.\n\n! Example: a classifier stuck at 10 percent\n! A 10-class CNN trains for an epoch and stays at 10 percent accuracy, loss flat at 2.302.\n! Loss at init is correct, but the single-batch overfit test also stays at 2.302. The no-gradient check prints every convolution weight: the forward pass ran `features = self.backbone(x).detach()` left over from a frozen-feature experiment.\n! Removing the detach, the single batch reaches loss 0.01 in 200 steps and the full run trains normally. Total debugging time: two minutes, against a day of hyperparameter search that could never have worked.\n\n> Takeaway: make bugs loud. Check data, initial loss and single-batch overfitting before every new model, assert shapes, and localise NaNs and gradient spikes with hooks and anomaly detection instead of guessing hyperparameters.","q":"A Transformer language model (vocabulary 32,000) trains fine for 3,000 steps, then the loss becomes nan at step 3,140 and stays nan. The gradient norm log shows values around 1 to 2, then 900 at step 3,138 and inf at 3,139. Describe a systematic way to find the cause, and name two plausible root causes and their fixes.","s":"First reproduce cheaply: reload the last checkpoint before the spike, with the same data order, and replay steps 3,130 to 3,140 with per-layer gradient-norm logging, forward hooks asserting finite outputs, and anomaly detection on. That identifies the first layer and op that produce huge or non-finite values, and the exact batch. Inspect the batch: an all-padding or garbage sequence points at the data. Plausible causes: (1) attention logits growing until softmax saturates or fp16 overflows; fixes are bfloat16, query-key normalisation, lower peak learning rate or longer warmup. (2) A fully masked row producing softmax over all -inf, which gives nan; fix the masking or filter empty sequences. Also add global-norm clipping with `error_if_nonfinite=True` or skip non-finite steps so one bad batch cannot destroy the weights.","r":[["Karpathy: A recipe for training neural networks (2019)","https://karpathy.github.io/2019/04/25/recipe/","The overfit-one-batch, check-init-loss and visualise-the-data habits in detail."],["PyTorch docs: torch.autograd (anomaly detection and gradcheck)","https://pytorch.org/docs/stable/autograd.html","detect_anomaly, set_detect_anomaly and gradcheck usage."],["PyTorch docs: Frequently asked questions","https://pytorch.org/docs/stable/notes/faq.html","Out-of-memory causes such as accumulating history across iterations, and other common errors."],["PyTorch docs: Reproducibility","https://pytorch.org/docs/stable/notes/randomness.html","Seeding, deterministic algorithms and DataLoader worker seeding, needed to replay a failing step."]],"k":["debugging","NaNs","exploding gradients"],"x":["PyTorch"],"p":["finite-difference-gradient-checking","gradient-clipping","softmax-numerical-stability-and-log-sum-exp","mutation-trap","tensor-shape-manipulation"],"ak":""}]},{"n":"05","name":"JAX","lessons":[{"id":"05.01","t":"JAX as NumPy","n":["`jax.numpy` mirrors the NumPy API closely enough that most array code ports by changing the import, but every result is a `jax.Array` that lives on a device (CPU, GPU or TPU) and is produced by XLA-compiled kernels.","JAX arrays are **immutable**. `x[i] = v` raises a `TypeError`; the functional form `x.at[i].set(v)` returns a new array, and under `jit` the compiler turns it into an in-place write whenever the old value is no longer needed.","`.at[]` also provides `add`, `multiply`, `min`, `max` and `get`. Repeated indices in `.at[idx].add(1)` all accumulate, unlike NumPy's `a[idx] += 1`, which applies each repeated index only once.","Defaults differ from NumPy: floats are float32 and integers int32 unless 64-bit mode is enabled, out-of-bounds reads clamp instead of raising, and out-of-bounds updates are silently dropped.","Dispatch is asynchronous. A JAX call returns as soon as the work is queued, so time code with `.block_until_ready()`, and remember that `np.asarray(x)` or `float(x)` copies the result back to the host and waits for it."],"a":"## Orientation: what JAX adds to NumPy\nJAX is NumPy plus a set of **composable function transformations**: `grad` turns a function into its gradient, `jit` compiles it, `vmap` batches it, and the sharding tools spread it over many devices. The transformations only work on *pure* functions (output depends only on inputs, no hidden state, no mutation), and almost every difference you will notice from NumPy or PyTorch follows from that one requirement. This module assumes the NumPy module (01) and contrasts with PyTorch (04) where it helps. Lessons 2 to 4 cover the three core transformations, lesson 5 shows how whole models and optimisers are expressed as nested containers called pytrees, lesson 6 covers explicit randomness and numerics, and lesson 7 scales out with meshes and sharding.\n\n%%layers The pieces of JAX this module covers, from the bottom up.\njax.numpy and jax.lax | array operations, lowered to XLA\n*Transformations | grad, jit, vmap, compose freely\nPytrees | parameters and optimiser state as nested containers\nSharding | NamedSharding, shard_map, collectives\n%%\n\n## Same API, different array\n```python\nimport jax\nimport jax.numpy as jnp\n\nx = jnp.linspace(0.0, 1.0, 5)\ny = jnp.sin(x) @ jnp.ones(5)        # same names as NumPy\ntype(x)                             # jax.Array\nx.dtype                             # float32, not float64\nx.devices()                         # {CudaDevice(id=0)} on a GPU machine\n```\n\n`jnp` functions accept NumPy arrays and Python scalars and return `jax.Array`s. The array is allocated on the default device (the first accelerator if there is one), and `jax.device_put(x, device)` moves it explicitly. There is no `.to(device)` per operation as in PyTorch; data simply stays where JAX put it unless you ask for a transfer. `np.asarray(x)` brings it back as a NumPy array on the host.\n\nLower-level operations live in `jax.lax` (`lax.dot_general`, `lax.conv_general_dilated`, the control-flow primitives of lesson 3). `jnp` is a thin layer of NumPy-style conveniences built on top of `lax`.\n\n## Immutability and functional updates\nIn PyTorch you write `x[0] = 1` or `x.add_(1)` and autograd tracks versions to catch problems. JAX forbids mutation entirely:\n\n```python\nx = jnp.zeros(5)\nx[0] = 1.0                      # TypeError: JAX arrays are immutable\nx = x.at[0].set(1.0)            # new array; the old one is unchanged\nx = x.at[1:3].add(2.0)          # also: multiply, min, max, divide, power\nv = x.at[jnp.array([0, 4])].get()   # same as x[...], with indexing options\n```\n\nCopying on every update sounds expensive, but inside a `jit`-compiled function XLA sees the whole computation, knows the old `x` is dead after the update, and performs the write in place. Outside `jit`, each `.at[]` call does allocate a new array, which is one reason to compile hot loops.\n\nThe `.at[]` scatter has a semantic advantage too. Repeated indices accumulate:\n\n```python\nidx = jnp.array([1, 1, 3])\njnp.zeros(5).at[idx].add(1.0)   # [0., 2., 0., 1., 0.]\n```\n\nThe NumPy equivalent `a[idx] += 1` gives `[0, 1, 0, 1, 0]`, because it reads, adds and writes back once per unique position. NumPy needs `np.add.at` for the accumulating behaviour; in JAX it is the default, which makes histograms, embedding-gradient scatters and segment sums one-liners.\n\n## Defaults that differ from NumPy\n| behaviour | NumPy | JAX\n| default float / int | float64 / int64 | float32 / int32 (64-bit only with `jax_enable_x64`)\n| `x[i] = v` | in place | `TypeError`; use `x.at[i].set(v)`\n| index out of bounds on read | `IndexError` | clamped to the last valid index\n| index out of bounds on update | `IndexError` | update silently dropped (configurable via `mode=`)\n| boolean mask `x[mask]` | data-dependent shape, fine | fine eagerly, fails under `jit`\n| execution | synchronous | asynchronous dispatch\n\nOut-of-bounds reads clamp because raising an error from inside an accelerator kernel is not possible; `jnp.arange(3)[10]` returns `2`. That is convenient for padded gathers and dangerous for indexing bugs, so validate indices in tests.\n\nBoolean-mask indexing produces an array whose length depends on the data, which `jit` cannot compile because shapes must be known at trace time (lesson 3). The JAX idiom is to keep the shape fixed and mask arithmetically:\n\n```python\ndef masked_mean(x, mask):\n    return jnp.sum(jnp.where(mask, x, 0.0)) / jnp.maximum(mask.sum(), 1)\n```\n\nThe same idea drives padding variable-length sequences to a few fixed bucket lengths, so that a handful of compiled shapes cover the whole dataset.\n\n## Asynchronous dispatch\nJAX returns from a call as soon as the work is enqueued on the device, like CUDA in PyTorch. Python keeps running ahead while the accelerator computes. Anything that needs the actual values blocks: printing, `float(x)`, `np.asarray(x)`, `x.item()`. To time code honestly, call `.block_until_ready()` on the output, and exclude the first call of a jitted function, which includes compilation:\n\n```python\nf = jax.jit(lambda a: a @ a.T)\na = jnp.ones((4096, 4096))\nf(a).block_until_ready()             # warm-up: trace + compile + run\n%timeit f(a).block_until_ready()     # steady-state time only\n```\n\n! Example: a token-count histogram\n! You need counts of each token id in a batch of shape (B, T) over a vocabulary of size V. The NumPy reflex `counts[tokens.ravel()] += 1` undercounts in NumPy and raises in JAX.\n! The JAX version is `jnp.zeros(V, jnp.int32).at[tokens.ravel()].add(1)`. Repeated ids accumulate, shapes are static, so it compiles under `jit` and runs as a single scatter kernel on the device.\n! If some ids can be a padding value of -1, note that negative indices wrap as in NumPy, so -1 would count into the last bucket. Mask first with `jnp.where(tokens >= 0, 1, 0)` as the update values, or remap padding to an id you later ignore.\n\n> Takeaway: write JAX as NumPy without mutation. Replace in-place writes with `.at[]`, keep shapes independent of data, expect float32 and clamped indices, and block on results before you time them.","q":"You port a NumPy preprocessing function to JAX. It builds `out = np.zeros(n)` and then loops `for i, j in enumerate(idx): out[j] += w[i]`, where `idx` has repeated entries and occasionally contains `n` (one past the end) as a sentinel. Rewrite it in JAX and explain what the rewritten version does with the repeats and the sentinel, compared with the original loop.","s":"The idiomatic rewrite is `out = jnp.zeros(n).at[idx].add(w)`: one scatter-add with no Python loop, which also compiles under `jit`. Repeats behave like the original loop, because `.at[].add` accumulates every occurrence (unlike the vectorised NumPy `out[idx] += w`, which would keep only one write per position). The sentinel differs. The NumPy loop raises `IndexError` on `out[n]`, whereas JAX's scatter drops out-of-bounds updates by default, so sentinel entries are silently ignored. That happens to be the desired behaviour here, but it is better to make it explicit, for example `.at[idx].add(w, mode='drop')`, or to zero the weights of sentinel entries with `jnp.where(idx < n, w, 0)`, so a future change to the indexing mode or to the sentinel value cannot quietly change results. Note also that the result is float32 unless 64-bit mode is enabled, so if the NumPy version relied on float64 accumulation for very long sums, compare the results with a tolerance.","r":[["JAX docs: Quickstart","https://docs.jax.dev/en/latest/notebooks/thinking_in_jax.html","jax.numpy as a NumPy replacement and a first look at jit, grad and vmap."],["JAX docs: Common gotchas in JAX","https://docs.jax.dev/en/latest/notebooks/Common_Gotchas_in_JAX.html","Pure functions, in-place updates with .at[], out-of-bounds indexing and the 64-bit default."],["JAX docs: JAX 101","https://docs.jax.dev/en/latest/101/index.html","jax.Array, transformations, tracing and how jax.numpy relates to jax.lax."]],"k":["jax.numpy","immutability","functional updates"],"x":["JAX","NumPy"],"p":["functional-array-update","masked-mean-without-boolean-indexing","pad-and-mask-to-bucket-length"],"ak":""},{"id":"05.02","t":"Automatic differentiation","n":["`jax.grad(f)` is a new function that returns the gradient of a scalar-valued `f` with respect to its first argument (or the ones in `argnums`). There is no tape and no `.grad` attribute: the gradient is a return value with the same structure as the input.","`jax.value_and_grad` returns the loss and its gradient from one forward and backward pass, and `has_aux=True` lets the function also return metrics that are not differentiated.","`jvp` (forward mode) pushes a tangent through the function; `vjp` (reverse mode) pulls a cotangent back. `jacfwd` builds Jacobians from JVPs and suits tall Jacobians (few inputs); `jacrev` uses VJPs and suits wide ones (few outputs).","Because transformations compose, higher-order derivatives are just nesting: `jax.hessian` is `jacfwd(jacrev(f))`, and a Hessian-vector product is a `jvp` of `grad` that never forms the Hessian.","`lax.stop_gradient` blocks a path, and `jax.custom_vjp` replaces the backward rule of a function, for example a straight-through estimator for rounding."],"a":"## Gradients as functions\nIn PyTorch, autograd records operations as they run and `loss.backward()` writes results into `.grad` attributes (lesson 04.02). JAX takes a functional view. `jax.grad` takes a Python function and returns another Python function that computes the derivative:\n\n```python\nimport jax, jax.numpy as jnp\n\ndef loss(w, x, y):\n    pred = x @ w\n    return jnp.mean((pred - y) ** 2)\n\ndloss_dw = jax.grad(loss)                 # gradient w.r.t. the first argument\ng = dloss_dw(w, x, y)                     # same shape and dtype as w\ngw, gx = jax.grad(loss, argnums=(0, 1))(w, x, y)\n```\n\nNothing accumulates, so there is nothing to zero. The function must return a real scalar, and the arguments being differentiated must be floating point: `grad` on an integer input raises a `TypeError` rather than silently returning zeros. Arguments can be any pytree (lesson 5), so if `w` is a dict of arrays, the gradient is a dict with the same keys.\n\n## value_and_grad and auxiliary outputs\nTraining needs both the loss and its gradient. Calling `loss` and then `grad(loss)` runs the forward pass twice; `value_and_grad` does it once. Metrics such as accuracy go in an auxiliary output:\n\n```python\ndef loss_fn(params, batch):\n    logits = model_apply(params, batch[\"x\"])\n    l = cross_entropy(logits, batch[\"y\"])\n    acc = jnp.mean(jnp.argmax(logits, -1) == batch[\"y\"])\n    return l, {\"acc\": acc}                # (scalar, aux)\n\n(l, aux), grads = jax.value_and_grad(loss_fn, has_aux=True)(params, batch)\n```\n\nWith `has_aux=True` the function must return a pair, and only the first element is differentiated.\n\n## Forward and reverse mode\nFor $f: \\mathbb{R}^n \\to \\mathbb{R}^m$ with Jacobian $J$ at $x$, JAX exposes the two primitive products:\n\n- `jax.jvp(f, (x,), (v,))` returns $(f(x), Jv)$: forward mode, one pass per input direction, memory about the same as the forward pass.\n- `y, f_vjp = jax.vjp(f, x)` then `f_vjp(u)` returns $u^\\top J$: reverse mode, one pass per output direction, but it must store intermediate values from the forward pass.\n\n`grad` is `vjp` with $u = 1$ for a scalar output. `jacfwd` stacks $n$ JVPs and `jacrev` stacks $m$ VJPs (both use `vmap` internally, lesson 4), so prefer `jacfwd` when $n \\ll m$ and `jacrev` when $m \\ll n$. A loss with millions of parameters and one output is the extreme reverse-mode case, which is why training uses `grad`.\n\n%%flow How the derivative tools are built from the two primitives.\nvjp -(cotangent 1)-> grad -(jvp of grad)-> *HVP\nvjp -(vmap over outputs)-> jacrev -(jacfwd over it)-> hessian\njvp -(vmap over inputs)-> jacfwd\n%%\n\n## Higher-order derivatives\nDerivatives are ordinary JAX functions, so you can transform them again. `jax.grad(jax.grad(f))` gives a second derivative of a scalar function, and `jax.hessian(f)` is `jacfwd(jacrev(f))`: reverse mode for the gradient, then forward mode over it, which is the efficient order for a square Hessian.\n\nFor a model with $n$ parameters the Hessian has $n^2$ entries, which is impossible to store for any real network. What optimisation and analysis methods usually need is a Hessian-vector product $Hv$, and forward-over-reverse computes it at the cost of a few gradient evaluations:\n\n```python\ndef hvp(f, x, v):\n    return jax.jvp(jax.grad(f), (x,), (v,))[1]\n```\n\nThis is the building block for power iteration on the top Hessian eigenvalue, Newton-CG and influence functions. If `f` takes a pytree, `x` and `v` are pytrees of the same structure.\n\n## Controlling the backward pass\n`jax.lax.stop_gradient(z)` is the identity in the forward pass and has zero derivative, the JAX counterpart of `.detach()`. Use it for targets that must not receive gradients (a target network, an EMA teacher) or to hide a normalisation constant.\n\nSometimes you want a different backward rule. Rounding has zero gradient almost everywhere, so quantisation-aware training uses a straight-through estimator: round in the forward pass, pass gradients through unchanged in the backward pass. `jax.custom_vjp` expresses this directly:\n\n```python\n@jax.custom_vjp\ndef round_ste(x):\n    return jnp.round(x)\n\ndef round_fwd(x):\n    return jnp.round(x), None            # output, residuals saved for backward\n\ndef round_bwd(res, g):\n    return (g,)                          # one cotangent per input, as a tuple\n\nround_ste.defvjp(round_fwd, round_bwd)\n```\n\nThe same tool gives numerically stable gradients for functions like `log1p(exp(x))`, or gradient clipping inside a layer. `jax.custom_jvp` is the forward-mode counterpart and is preferred when a JVP rule is enough, because it supports both modes.\n\n! Example: grad of a loss that was secretly integer\n! A contrastive loss takes `temperature` as an argument and you call `jax.grad(loss, argnums=2)(params, batch, 1)`. JAX raises a `TypeError`, because `1` is an integer and integer inputs have no meaningful derivative.\n! Passing `1.0` fixes it. The same check catches a subtler bug: if the loss casts its inputs with `.astype(jnp.int32)` along the way, the gradient through that path is zero. JAX does not warn about a cast inside the function, so test that gradients are non-zero for every parameter group on a small batch.\n! Finally, compare against finite differences with `check_grads(f, (x,), order=2)` (imported with `from jax.test_util import check_grads`) before trusting a custom rule.\n\n> Takeaway: in JAX a derivative is just another function. Use `value_and_grad` with `has_aux` for training, pick `jacfwd` or `jacrev` by the shape of the Jacobian, compose `jvp` with `grad` for Hessian-vector products, and reach for `custom_vjp` only when the default rule is wrong for your purpose.","q":"You want the largest eigenvalue of the loss Hessian for a 50-million-parameter model, to check whether your learning rate is near the stability limit $2/\\lambda_{max}$. A colleague proposes `jnp.linalg.eigvalsh(jax.hessian(loss)(params))`. Explain why this fails and describe a JAX approach that works, including its cost per iteration.","s":"The full Hessian has $(5\\times10^7)^2 = 2.5\\times10^{15}$ entries, about 10 petabytes in float32, so `jax.hessian` cannot even be materialised, let alone decomposed (and with a pytree of parameters it would be a nested block structure anyway). Power iteration only needs products $Hv$. Define `hvp = lambda v: jax.jvp(jax.grad(loss_of_params), (params,), (v,))[1]`, where `loss_of_params` closes over a fixed batch. Start with a random pytree `v` of the same structure as `params`, then repeat: `w = hvp(v)`, estimate $\\lambda = \\langle v, w\\rangle$ (summing over all leaves), and set `v = w / ||w||`. Each iteration costs roughly one forward and two backward-like passes (a JVP through the gradient computation, about 2 to 3 times a gradient), and memory is a small multiple of one gradient. Wrap the step in `jax.jit` so it compiles once, run some tens of iterations until $\\lambda$ stabilises, and use the same batch throughout because the Hessian depends on the data. The top eigenvalue is the one of largest magnitude, which near a minimum is usually the largest positive one.","r":[["JAX docs: Transformations: grad and vmap","https://docs.jax.dev/en/latest/101/transformations.html","grad, value_and_grad, has_aux and differentiating with respect to pytrees."],["JAX docs: The autodiff cookbook","https://docs.jax.dev/en/latest/301/cookbook.html","jvp and vjp, jacfwd versus jacrev, Hessians and Hessian-vector products."],["JAX docs: Custom derivative rules","https://docs.jax.dev/en/latest/301/custom-jvp-vjp.html","custom_jvp and custom_vjp with worked numerical-stability examples."]],"k":["autodiff","grad","Hessian-vector products"],"x":["JAX"],"p":["value-and-grad-of-loss","hessian-vector-product","straight-through-estimator-with-custom-vjp","spectral-norm-by-power-iteration"],"ak":""},{"id":"05.03","t":"Compiling with jit","n":["`jax.jit` traces a function once per input signature with abstract values (shape and dtype, no data), records the operations as a jaxpr, compiles that with XLA, and caches the executable. Later calls with the same signature skip Python entirely.","Python code runs only during tracing. `print` and other side effects fire once, values are tracers, and Python `if`/`while` on a traced value raises an error because the value is not known at trace time.","Arguments marked with `static_argnums` or `static_argnames` are treated as compile-time constants: they must be hashable, can drive Python control flow and shapes, and every new value triggers a recompilation.","Data-dependent control flow uses `jnp.where`, `lax.cond`, `lax.switch`, `lax.fori_loop`, `lax.while_loop` and `lax.scan`. Python loops are unrolled at trace time, which makes long loops slow to compile.","Recompilation is the main jit performance bug. Watch for changing shapes, new static values, Python scalars standing in for traced values, and `jax.config.update('jax_log_compiles', True)` to see when it happens."],"a":"## What jit actually does\nPyTorch runs eagerly and `torch.compile` (lesson 04.07) captures graphs as an optimisation. In JAX, compilation is the normal way to run anything non-trivial, and its model is simple to state. When you call a jitted function, JAX replaces each array argument with a **tracer** that carries only a shape and dtype, runs your Python function once with those tracers, and records every primitive operation into an intermediate representation called a jaxpr. XLA compiles the jaxpr into fused device kernels, and the result is cached under a key made of the argument shapes, dtypes, pytree structure, static argument values and sharding.\n\n%%flow The life of a jitted call.\ncall f(x) -(cache hit)-> run compiled executable\ncall f(x) -(new signature)-> *trace with tracers -> jaxpr -> XLA compile -> cache -> run compiled executable\n%%\n\nYou can inspect the trace with `jax.make_jaxpr(f)(x)`, and the compiled program with `jax.jit(f).lower(x).compile().as_text()`. The jaxpr of a small function is worth reading once: you will see that `jnp.where` became a `select_n`, that Python arithmetic on constants has been folded, and that nothing of your Python control flow survives.\n\n## Side effects and tracers\nBecause Python runs only during tracing, side effects behave unexpectedly:\n\n```python\n@jax.jit\ndef f(x):\n    print(\"tracing with\", x)          # prints a tracer, once per new signature\n    jax.debug.print(\"x = {}\", x)      # prints the runtime value, every call\n    return x * 2\n\nf(1.0); f(2.0)            # the first print fires only on the first call\nf(jnp.ones(2))            # new shape: traces and prints again\n```\n\nThe same rule makes global state dangerous. A jitted function that reads a global variable bakes its trace-time value into the compiled code; changing the global later has no effect until something forces a retrace. Appending to a list inside a jitted function appends tracers that are useless outside it. Write jitted functions as pure functions of their arguments.\n\n## Static arguments\nSome arguments are configuration rather than data: a window size, a number of layers, an activation name, a `training` flag. If they decide shapes or Python control flow they must be known at trace time, so mark them static:\n\n```python\nfrom functools import partial\n\n@partial(jax.jit, static_argnames=\"window\")\ndef pool(x, window):\n    return x.reshape(-1, window).mean(axis=1)    # shape depends on window\n\npool(jnp.arange(8.0), window=2)     # compiles for window=2\npool(jnp.arange(8.0), window=4)     # compiles again for window=4\n```\n\nStatic values must be hashable (ints, strings, tuples, frozen dataclasses; not arrays or lists), and each distinct value is a separate compilation. That is the trade-off: static arguments buy flexibility at trace time and cost a compile per value, so use them for a handful of configurations, never for something that changes every step.\n\n## Control flow on traced values\nPython `if x > 0:` needs a concrete boolean, but under `jit` `x > 0` is a tracer, so JAX raises a `TracerBoolConversionError` (a kind of concretisation error). There are three fixes, in order of preference:\n\n| need | tool | notes\n| choose elementwise | `jnp.where(c, a, b)` | computes both sides, then selects\n| choose one branch | `lax.cond(pred, f_true, f_false, *ops)` / `lax.switch` | both branches traced; must return same shapes and dtypes\n| loop with known trip count | `lax.fori_loop(lo, hi, body, init)` | compiled as a loop, not unrolled\n| loop until a condition | `lax.while_loop(cond, body, init)` | not reverse-differentiable\n| loop that emits per-step outputs | `lax.scan(f, carry, xs)` | the workhorse: RNNs, EMAs, layer stacks, accumulation\n\nPython loops over a static range are legal: JAX unrolls them, so a 1,000-step Python loop becomes 1,000 copies of the body in the jaxpr and compiles slowly. `lax.scan` compiles the body once:\n\n```python\ndef ema(xs, decay=0.99):\n    def step(m, x):\n        m = decay * m + (1 - decay) * x\n        return m, m                      # (new carry, per-step output)\n    _, ms = jax.lax.scan(step, jnp.zeros(xs.shape[1:]), xs)\n    return ms\n```\n\n`scan` is also how JAX code expresses gradient accumulation over micro-batches and applies a stack of identical layers whose parameters are stacked along a leading axis.\n\n## Avoiding recompilation\nEvery new input shape is a new compilation, which can take seconds to minutes for a large model. Common causes:\n\n- Variable-length batches. Pad to a few bucket lengths (lesson 1) so only a few shapes ever occur.\n- A changing value passed as a static argument, such as the step number or the learning rate.\n- Switching between Python scalars and arrays of different dtypes for the same argument.\n- Calling `jax.jit(f)` inside a loop on a fresh lambda, which defeats the cache because the function object is new each time.\n\nTurn on `jax.config.update(\"jax_log_compiles\", True)` while developing to log every compilation.\n\n! Example: the learning-rate schedule that recompiled every step\n! A training step is written `@partial(jax.jit, static_argnames=\"step\")` so that a warmup-cosine schedule can use Python `if step < warmup:`. Throughput is terrible, and the compile log shows a new compilation for every step.\n! Each step value is a new static value, so each call traces and compiles from scratch. The fix is to pass `step` as an ordinary traced integer array and write the schedule with array operations: `lr = jnp.where(step < warmup, peak * step / warmup, cosine(step))`.\n! Now one compilation serves the whole run. Optax schedules are written this way for the same reason: they are pure functions of a traced step count.\n\n> Takeaway: jit traces once per signature and compiles the trace. Keep functions pure, make only true configuration static, express data-dependent branches and loops with `jnp.where` and `lax`, and keep the set of input shapes small.","q":"A jitted beam-search decoder takes `max_len` and `beam_size` as arguments and loops `for t in range(max_len)` in Python, breaking out early when all beams have emitted an end token. It fails with a tracer error. A colleague deletes the early break and marks both arguments static; it now runs, but compiling takes four minutes and every new `max_len` compiles again. Explain both symptoms and how you would restructure it.","s":"The early `break` needs a Python boolean computed from traced data (whether all beams finished), so under `jit` the comparison is a tracer and converting it to `bool` raises a `TracerBoolConversionError`. Deleting the break removes the error, but the Python loop over a static `max_len` is unrolled: the jaxpr contains `max_len` copies of the decoder step, so compile time grows with the length, and every new `max_len` value is a new static value and therefore a new compilation. The fix is to keep `max_len` and `beam_size` static (they determine shapes, so they should be), and replace the Python loop with a compiled loop. `lax.while_loop` with a condition `(t < max_len) & ~all_done` stops early on the device, with a carry holding fixed-shape buffers of size `(beam_size, max_len)` updated with `.at[:, t].set(...)`. Alternatively `lax.scan` over `max_len` steps with a `done` mask keeps going but freezes finished beams with `jnp.where`; scan is simpler when you might later differentiate through the loop, which `while_loop` does not support in reverse mode. Either way the body is traced once, so compile time no longer grows with `max_len`.","r":[["JAX docs: Just-in-time compilation","https://docs.jax.dev/en/latest/201/jit.html","Tracing, jaxprs, static arguments and the caching rules."],["JAX docs: Control flow and logical operators with JIT","https://docs.jax.dev/en/latest/201/control-flow.html","cond, switch, fori_loop, while_loop and scan, and which are differentiable."],["JAX docs: Common gotchas in JAX","https://docs.jax.dev/en/latest/notebooks/Common_Gotchas_in_JAX.html","Pure functions, side effects under jit and control-flow errors."]],"k":["jit","tracing","lax control flow"],"x":["JAX","XLA"],"p":["static-arguments-in-jit","traced-learning-rate-schedule","exponential-moving-average-with-scan","spectral-norm-by-power-iteration"],"ak":""},{"id":"05.04","t":"Vectorising with vmap","n":["`jax.vmap(f)` turns a function written for one example into one that works on a batch, by pushing the batch dimension through every primitive. The result is the same vectorised code you would write by hand, not a Python loop.","`in_axes` says which axis of each argument is mapped (`0`, another integer, or `None` for broadcast), and can be a pytree matching the arguments; `out_axes` places the batch axis in the outputs.","Nesting `vmap` maps over several axes, for example `vmap(vmap(dist, (None, 0)), (0, None))` for all pairwise distances, without writing a single broadcast by hand.","`vmap(grad(loss), in_axes=(None, 0, 0))` gives per-example gradients: one gradient pytree per example, each with a leading batch axis. This is what DP-SGD clipping and gradient-noise diagnostics need.","Under `vmap`, `lax.cond` on a batched predicate executes both branches and selects, and memory grows with the batch: per-example gradients cost one copy of the parameters per example."],"a":"## Write it for one, run it for many\nBatched code in NumPy or PyTorch is written with the batch dimension in mind from the start: you think about which axis to sum over, insert `[:, None]` for broadcasting, and use `einsum` strings with an extra `b`. JAX lets you write the function for a single example and add the batch afterwards:\n\n```python\ndef predict(w, b, x):            # x: (d,)  one example\n    return jnp.tanh(w @ x + b)\n\nbatched = jax.vmap(predict, in_axes=(None, None, 0))\nbatched(w, b, X)                 # X: (B, d)  ->  (B, k)\n```\n\n`vmap` is a transformation like `grad`: it traces `predict` with a batched tracer and rewrites each primitive into its batched form (a matrix-vector product becomes a matrix-matrix product, a sum gains an axis offset, and so on). The output is ordinary vectorised XLA code, as fast as the hand-written version, and it composes with `jit` and `grad` in any order. PyTorch now offers the same idea as `torch.func.vmap`, which was modelled on JAX.\n\n## in_axes and out_axes\n`in_axes` has one entry per positional argument. An integer names the axis to map over, and `None` means the argument is shared by every example and broadcast. The entry can itself be a pytree that mirrors the argument, so you can map over some leaves of a dict and not others. All mapped axes must have the same size. `out_axes` does the same for outputs; the default `0` puts the batch axis first.\n\n| call | meaning\n| `vmap(f)` | map axis 0 of every argument and output\n| `vmap(f, in_axes=(None, 0))` | first argument shared, second batched along axis 0\n| `vmap(f, in_axes=1, out_axes=1)` | batch lives on axis 1 on both sides, e.g. time-major data\n| `vmap(f, in_axes=({\"w\": 0, \"b\": None}, 0))` | map only some leaves of a dict argument\n| `vmap(f, axis_name=\"batch\")` | name the axis so collectives like `lax.psum(x, \"batch\")` can reduce over it\n\n`vmap` maps over **positional** arguments; keyword arguments are always mapped along axis 0, so it is clearest to pass everything positionally and control it with `in_axes`.\n\n## Nested vmap\nEach `vmap` adds one batch dimension, so nesting maps over several. Pairwise squared distances between point sets $A$ ($n \\times d$) and $B$ ($m \\times d$):\n\n```python\ndef sqdist(a, b):                          # two vectors -> scalar\n    return jnp.sum((a - b) ** 2)\n\npairwise = jax.vmap(jax.vmap(sqdist, in_axes=(None, 0)), in_axes=(0, None))\nD = pairwise(A, B)                         # (n, m)\nnearest = jnp.argmin(D, axis=1)\n```\n\nThe inner `vmap` maps one point of $A$ against every row of $B$; the outer maps that over every row of $A$. The same pattern gives batched attention: write single-head, single-sequence attention over `(T, d)` arrays, then `vmap` over heads and again over the batch, with key-padding masks passed as another mapped argument.\n\n%%flow Building a batched attention function from the single-example version.\nattend(q, k, v, mask) -(vmap over heads)-> multi-head -(vmap over batch)-> *batched attention -(jit)-> fused kernels\n%%\n\n## Per-example gradients\nOrdinary training averages gradients over the batch before you ever see them. Some methods need each example's gradient separately: differentially private SGD clips each one to a norm bound before averaging, and gradient-noise or influence analyses look at their spread. In PyTorch this takes hooks or `torch.func`; in JAX it is one line, because a loss written for a single example can be differentiated and then batched:\n\n```python\ndef example_loss(params, x, y):          # one example\n    return cross_entropy(model_apply(params, x[None]), y[None])\n\nper_ex_grads = jax.vmap(jax.grad(example_loss), in_axes=(None, 0, 0))\ng = per_ex_grads(params, X, Y)           # each leaf: (B, *leaf.shape)\n```\n\nTo clip each example to norm $C$, compute each example's norm across all leaves, scale, then average:\n\n```python\nsq = sum(jnp.sum(l.reshape(l.shape[0], -1) ** 2, axis=1) for l in jax.tree.leaves(g))\nscale = jnp.minimum(1.0, C / (jnp.sqrt(sq) + 1e-12))           # (B,)\nclipped = jax.tree.map(lambda l: jnp.mean(l * scale.reshape(-1, *[1] * (l.ndim - 1)), 0), g)\n```\n\nThe cost is memory: `g` holds $B$ full copies of the parameter gradients. For large models, compute per-example gradients in micro-batches with `lax.map` or `lax.scan` and accumulate the clipped sum.\n\n## Ensembles and other uses of in_axes\n`in_axes` is not only for data. Stack the parameters of $E$ independently initialised models along a new leading axis, `stacked = jax.tree.map(lambda *ps: jnp.stack(ps), *param_list)`, and `jax.vmap(model_apply, in_axes=(0, None))(stacked, x)` evaluates all members on the same batch in one call, returning `(E, B, ...)`. With `in_axes=(0, 0)` each member gets its own batch, which is how bootstrapped ensembles are trained. Initialising the members is itself a `vmap` over a batch of random keys (lesson 6).\n\n## What vmap changes semantically\nMost code behaves exactly as if you looped. Two exceptions are worth knowing. A `lax.cond` whose predicate is batched cannot pick one branch for the whole batch, so `vmap` converts it into a select that evaluates both branches; expensive or unsafe branches (a `log` of a negative number, say) then run for every example, so guard their inputs. And a `lax.while_loop` with a batched condition keeps running until every example is done, carrying finished ones along unchanged.\n\n! Example: an ensemble of five MLPs in one call\n! Initialise five parameter sets with `jax.vmap(init_params)(jax.random.split(key, 5))`, which returns a single pytree whose every leaf has a leading axis of 5.\n! Training uses `jax.vmap(train_step, in_axes=(0, 0, None))(params, opt_state, batch)`: every member sees the same batch but has its own parameters and optimiser state. One compiled step updates all five, and on a GPU it runs at close to the speed of one larger model because the matmuls are batched.\n! At evaluation, `preds = jax.vmap(apply, in_axes=(0, None))(params, x)` has shape (5, B, classes); the mean over axis 0 is the ensemble prediction and the variance over axis 0 a
